{theme:"nature",diff:"difficile",type:"q",q:"Comment les termites construisent-ils des termitières pouvant atteindre 9 mètres de hauteur avec un système de ventilation maintenant une température et un CO2 constants à l'intérieur, sans architecte central ?",a:"Les termites construisent par stigmergie — chaque individu réagit aux traces chimiques et physiques laissées par les autres, produisant un comportement collectif complexe sans coordination centrale",detail:"La stigmergie (Grassé, 1959) : les termites déposent des granules de sol imprégnés de phéromones. Là où les granules s'accumulent, d'autres termites en déposent davantage. Cette rétroaction positive crée des piliers, arches et chambres complexes. La termitière régule activement sa température (±1°C), son CO2 et son humidité via des cheminées d'aération que les termites ouvrent ou ferment selon les conditions. Eastgate Centre (Harare, Zimbabwe) s'est inspiré de ce système pour sa climatisation passive."},
{theme:"nature",diff:"facile",type:"q",q:"Quel animal produit la toile la plus résistante proportionnellement — plus solide que l'acier et aussi élastique que le caoutchouc — que les ingénieurs tentent de reproduire artificiellement depuis des décennies ?",a:"L'araignée — à masse égale, sa soie de traîne est plus résistante que l'acier et peut s'étirer d'environ 30 % avant de rompre",detail:"La soie d'araignée combine résistance (environ 1 GPa) et élasticité, ce qui lui permet d'absorber l'énergie des chocs ; la soie de l'araignée de Darwin, à Madagascar, est l'un des matériaux biologiques les plus tenaces connus. Applications envisagées : fils chirurgicaux, textiles techniques, protections balistiques. Les araignées, cannibales, ne peuvent être élevées en masse ; on produit de la soie recombinante par des bactéries ou des levures."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle relation symbiotique entre le poisson-clown (Amphiprion) et l'anémone de mer illustre comment deux espèces peuvent co-évoluer pour un bénéfice mutuel — et comment le poisson résiste-t-il au venin de l'anémone ?",a:"Le poisson-clown est protégé du venin de l'anémone par un mucus épais — il défend l'anémone contre les prédateurs et ses excréments la fertilisent (mutualisme)",detail:"L'anémone de mer paralyse et dévore la plupart des poissons. Le poisson-clown sécrète un mucus particulier qui n'active pas les cellules urticantes (nématocystes) ; il s'acclimate par contacts progressifs. En échange, il chasse les poissons qui mangent l'anémone, l'oxygène par ses mouvements et la fertilise de ses excréments. Les poissons-clowns sont hermaphrodites protandres : à la mort de la femelle, le mâle dominant change de sexe — dans Le Monde de Nemo, le père de Nemo aurait donc dû devenir une femelle."},
{theme:"nature",diff:"difficile",type:"q",q:"Quelle « explosion », survenue il y a environ 539 millions d'années, voit apparaître en quelques dizaines de millions d'années la plupart des grands groupes animaux ?",a:"L'explosion cambrienne voit apparaître mollusques, arthropodes, vertébrés, échinodermes en ~25 Ma — hypothèses : augmentation de l'O2, apparition des yeux, dégel post-Snowball Earth",detail:"Les schistes de Burgess (Canada) et de Chengjiang (Chine) conservent les organismes mous de cette période. Avant, seuls des organismes simples. En 25 Ma géologiques, toute la diversité animale actuelle apparaît. Hypothèses : 1/ augmentation de l'O2 atmosphérique permettant les métabolismes actifs. 2/ Apparition des yeux (Andrew Parker) déclenchant une course aux armements prédateur-proie. 3/ Dégel après la 'Terre boule de neige' (Snowball Earth, -720 à -635 Ma)."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle espèce de corbeau (Corvus corax) a une intelligence proche des grands singes, démontrée par sa capacité à résoudre des problèmes en plusieurs étapes, à utiliser des outils et à avoir une théorie de l'esprit ?",a:"Le grand corbeau résout des problèmes à 5-7 étapes, utilise des outils, planifie l'avenir, joue, se souvient des visages et adapte son comportement selon les observateurs",detail:"Les corbeaux cachent leur nourriture et tiennent compte de qui les observe : s'ils ont été vus, ils déplacent leur cachette. Ils reconnaissent des visages humains pendant des années. D'autres corvidés, comme les corbeaux de Nouvelle-Calédonie, fabriquent des outils et réussissent le test de la « fable d'Ésope » (lâcher des pierres pour faire monter le niveau de l'eau) aussi bien que des enfants de 5 à 7 ans. Leur cerveau, très dense en neurones, est organisé différemment de celui des primates."},
{theme:"nature",diff:"facile",type:"q",q:"Quel cétacé, l'orque (Orcinus orca), est en réalité le plus grand membre de la famille des dauphins, et quelles cultures distinctes différencient les populations résidentes des populations transientes du Pacifique Nord ?",a:"Les orques résidentes mangent exclusivement du poisson (saumons) et sont très sociales ; les transientes (Bigg's orcas) chassent les mammifères marins en silence et en petits groupes",detail:"Ces deux écotypes coexistent dans les mêmes eaux sans se mélanger, séparés depuis des centaines de milliers d'années. Leurs vocalisations diffèrent, et chaque groupe familial de résidentes a son propre dialecte. Les orques transmettent à leurs petits des techniques de chasse spécifiques. Depuis 2020, au large de l'Espagne et du Portugal, des orques interagissent avec les gouvernails de voiliers, un comportement apparu dans un petit groupe puis imité."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel parasite microscopique ne peut se reproduire sexuellement que dans l'intestin d'un chat, et comment manipule-t-il le comportement des rats infectés ?",a:"Toxoplasma gondii — il rend les rats attirés, plutôt qu'effrayés, par l'odeur d'urine de chat, ce qui facilite leur capture",detail:"Le parasite forme des kystes dans le cerveau du rongeur, notamment dans des régions liées à la peur. Les rats infectés deviennent plus téméraires, ce qui augmente leurs chances d'être mangés par un chat, son hôte définitif. Toxoplasma gondii infecte environ un tiers de l'humanité, le plus souvent sans symptômes ; des études controversées évoquent des liens avec certains traits de comportement."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment la sélection sexuelle théorisée par Darwin dans La Descendance de l'homme (1871) explique-t-elle des caractères comme la queue du paon qui réduisent la survie mais augmentent la reproduction ?",a:"La sélection sexuelle (choix des femelles + compétition entre mâles) favorise des ornements coûteux (queue du paon, bois du cerf) qui signalent honnêtement la qualité génétique du mâle",detail:"Darwin est troublé par la queue du paon : 'Chaque fois que je vois une plume de paon, j'ai la nausée.' Elle contredit la sélection naturelle (la queue alourdit, ralentit, attire les prédateurs). Solution : la sélection sexuelle. Le 'principe du handicap' (Zahavi, 1975) : seul un mâle en bonne santé peut 'se permettre' un tel ornement — signal honnête de qualité génétique. Les femelles qui choisissent ces mâles transmettent des gènes de qualité à leurs fils."},
{theme:"nature",diff:"facile",type:"q",q:"Quelle rivière les gnous doivent-ils franchir au Kenya, sous la menace des crocodiles, lors de la Grande Migration ?",a:"La Mara",detail:"Entre juillet et octobre, les troupeaux traversent la rivière Mara en masse, souvent au même endroit ; les crocodiles du Nil y attendent leur repas annuel, et de nombreux gnous se noient dans la bousculade. Ils n'ont pas de chef : chacun réagit aux mouvements de ses voisins et à l'odeur de l'herbe fraîche. Les carcasses fertilisent ensuite la rivière et les écosystèmes en aval."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle méthode de datation, mise au point par Willard Libby vers 1949 (prix Nobel 1960), permet de dater des restes organiques jusqu'à environ 50 000 ans ?",a:"La datation par le carbone 14 (radiocarbone)",detail:"Le ¹⁴C se forme dans l'atmosphère quand les rayons cosmiques frappent l'azote 14. Il est absorbé par les plantes (photosynthèse) et tous les animaux. À la mort, l'organisme cesse d'absorber du ¹⁴C et celui qu'il contient se désintègre (demi-vie 5 730 ans). En mesurant le ratio ¹⁴C/¹²C résiduel, on calcule l'âge. Les tests nucléaires atmosphériques des années 1950-60 ont créé un 'pulse' de ¹⁴C qui permet désormais de dater les tissus biologiques à l'année près."},
{theme:"nature",diff:"difficile",type:"q",q:"Quelle découverte de l'ADN ancien (aDNA) de la grotte de Denisova (Sibérie) a révélé une espèce humaine distincte qui s'est croisée avec Homo sapiens, et quelle preuve génétique persiste dans l'ADN des populations actuelles ?",a:"Les Dénisoviens (Homo denisova) — connus uniquement par un doigt, quelques dents et des génomes (jamais de squelette complet) — ont contribué 4-6 % de l'ADN des populations mélanésiennes et papoues",detail:"L'équipe de Svante Pääbo (Institut Max-Planck, prix Nobel 2022) séquence en 2010 l'ADN d'une phalange de Denisova : il appartient à une lignée distincte des Néandertaliens et d'Homo sapiens. Les Dénisoviens ne sont connus que par quelques fossiles (dents, mandibule du Tibet, crâne de Harbin attribué en 2025). Les Papous portent aujourd'hui 4 à 6 % d'ADN dénisovien, et les Tibétains en ont hérité une variante du gène EPAS1 favorable à la vie en altitude."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel oiseau, l'albatros hurleur, possède la plus grande envergure du monde (environ 3,5 m), et quelle technique de vol lui permet de parcourir des milliers de kilomètres presque sans battre des ailes ?",a:"L'albatros utilise le 'vol dynamique' (dynamic soaring) — il exploite le gradient de vent entre la surface de l'océan et l'altitude pour accumuler de l'énergie sans battre des ailes",detail:"Le vol dynamique consiste à exploiter la différence de vitesse du vent entre la surface de l'océan et quelques dizaines de mètres d'altitude : l'albatros monte face au vent, puis redescend en virant, gagnant de l'énergie à chaque cycle. Il peut ainsi parcourir des centaines de kilomètres par jour. Les albatros hurleurs vivent souvent plus de 50 ans et forment des couples durables. La pêche à la palangre et le plastique les menacent."},
{theme:"nature",diff:"facile",type:"q",q:"Quel mammifère, la baleine à bosse (Megaptera novaeangliae), compose des 'chansons' qui évoluent culturellement d'un océan à l'autre, tous les mâles d'une population adoptant progressivement les nouveautés ?",a:"Les baleines à bosse mâles chantent des séquences complexes évoluant en temps réel — les nouveautés se propagent d'ouest en est dans le Pacifique en quelques mois, comme les 'tubes' musicaux",detail:"Les chants de baleine à bosse sont parmi les productions culturelles les plus complexes du règne animal non-humain. Chaque saison, certains mâles introduisent des variantes. Si la variante est adoptée par quelques mâles influents, elle se propage à toute la population en quelques mois. La même propagation est observée de l'Australie vers la Polynésie française. Les biologistes voient dans ce phénomène une proto-culture musicale."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel lac africain a perdu environ 200 espèces de cichlidés après l'introduction de la perche du Nil dans les années 1950, exemple classique d'espèce invasive ?",a:"Le lac Victoria",detail:"Le lac abritait une spectaculaire radiation adaptative : environ 500 espèces de cichlidés endémiques, issues en quelques milliers d'années d'un petit nombre d'ancêtres. La perche du Nil (Lates niloticus), introduite pour la pêche commerciale entre 1954 et 1963, en a décimé une grande partie. Le documentaire Le Cauchemar de Darwin (2004) dénonce la filière d'exportation de ses filets vers l'Europe et la misère des pêcheurs locaux."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment la photosynthèse oxygénique, apparue il y a ~2,7 milliards d'années chez les cyanobactéries, a-t-elle causé la 'Grande Oxydation' et une extinction de masse des organismes anaérobies, tout en rendant possible la vie animale complexe ?",a:"L'oxygène libéré par les cyanobactéries était un poison pour les organismes anaérobies dominants — la 'Grande Catastrophe d'Oxydation' (~2,4 Ga) provoque une extinction massive mais crée les conditions de la vie aérobie complexe",detail:"Avant 2,4 milliards d'années, l'atmosphère terrestre est presque sans O2. Les cyanobactéries (premières à produire O2 par photosynthèse) inondent progressivement l'atmosphère d'oxygène. Pour les organismes anaérobies dominants (bactéries et archées), l'O2 est un toxique (il oxyde les molécules). Extinction massive. Mais l'O2 permet des métabolismes beaucoup plus efficaces (respiration cellulaire = 18x plus d'énergie que la fermentation). La couche d'ozone (O3) protège ensuite des UV, permettant la colonisation des terres."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle molécule anticancéreuse a été découverte dans l'écorce de l'if du Pacifique ?",a:"Le taxol (paclitaxel)",detail:"Isolé dans les années 1960 et commercialisé en 1992, le paclitaxel traite notamment les cancers du sein et de l'ovaire. Environ deux tiers des médicaments anticancéreux sont d'origine naturelle ou en dérivent. D'autres exemples : l'aspirine (saule), la morphine (pavot), la pénicilline (champignon), l'artémisinine (armoise, contre le paludisme). Chaque espèce disparue emporte des molécules peut-être précieuses."},
{theme:"nature",diff:"facile",type:"q",q:"Comment appelle-t-on les ballets aériens de milliers d'étourneaux évoluant ensemble sans chef ?",a:"Les murmurations",detail:"Les murmurations d'étourneaux (Sturnus vulgaris) peuvent regrouper des millions d'individus. Chaque oiseau suit 3 règles simples : rester proche de ses voisins, aller à la même vitesse, éviter les collisions. Le comportement collectif complexe (ondulations, spirales) émerge de ces règles locales sans coordination globale. Ce phénomène d''intelligence collective' ou d'émergence inspire les algorithmes d'essaim utilisés en robotique et en intelligence artificielle."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel champignon tropical transforme les fourmis charpentières en « zombies » avant de les tuer pour disperser ses spores ?",a:"Ophiocordyceps unilateralis",detail:"Le champignon pousse la fourmi infectée à quitter son nid et à grimper à environ 25 cm du sol, où température et humidité lui conviennent. La fourmi mord la nervure d'une feuille dans une « morsure de la mort » puis meurt ; le champignon sort de sa tête et libère ses spores sur les fourmis passant en dessous. Des cicatrices de morsures similaires ont été retrouvées sur des feuilles fossiles de 48 millions d'années."},
{theme:"nature",diff:"difficile",type:"q",q:"Quelle controverse scientifique oppose la vision darwinienne 'gradualiste' de l'évolution (accumulation de petites variations) et la théorie des 'équilibres ponctués' de Gould et Eldredge (1972) sur le rythme du changement évolutif ?",a:"Gould et Eldredge observent que le registre fossile montre des périodes longues de stase (peu de changements) ponctuées de changements rapides — incompatible avec un gradualisme strict",detail:"Le registre fossile montre rarement des séries de formes intermédiaires graduelles. Gould et Eldredge proposent que les espèces restent stables pendant des millions d'années (stase) puis changent rapidement (~100 000 ans, court en temps géologique) lors d'événements comme l'isolement géographique de petites populations. Ce débat, parfois mal compris comme remettant en cause la sélection naturelle, concerne en réalité le rythme et non le mécanisme de l'évolution."},
{theme:"nature",diff:"facile",type:"q",q:"En quelle année la déforestation de l'Amazonie brésilienne atteint-elle son record du XXIe siècle, avec environ 27 000 km² ?",a:"En 2004",detail:"La déforestation tombe ensuite à environ 4 600 km² en 2012, grâce à la surveillance par satellite et à la création d'aires protégées, puis remonte à plus de 13 000 km² en 2021 sous Jair Bolsonaro, avant de reculer à nouveau sous Lula à partir de 2023. Elle est due surtout à l'élevage bovin, au soja, aux routes et à l'orpaillage illégal. Au-delà de 20 à 25 % de forêt détruite, l'Amazonie pourrait basculer vers la savane."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel scientifique naturaliste, Alexander von Humboldt (1769-1859), est considéré comme le père de l'écologie et de l'environnementalisme moderne pour avoir le premier décrit la nature comme un réseau interconnecté ?",a:"Humboldt décrit lors de son ascension du Chimborazo (Équateur, 1802) que la végétation se répartit en zones selon l'altitude, comme les zones climatiques de la Terre — vision de la nature comme système interrelié",detail:"Humboldt imagine les isothermes (lignes d'égale température), fonde la géographie des plantes et étudie le courant froid du Pacifique qui porte son nom. Il est l'un des premiers à relier la déforestation à des changements du climat local. Darwin et Thoreau le lisent avec passion ; Ernst Haeckel forge le mot « écologie » en 1866."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel oiseau, le martin-pêcheur (Alcedo atthis), a inspiré la conception du TGV japonais Shinkansen grâce à la forme de son bec qui lui permet de plonger dans l'eau sans éclaboussures ni choc ?",a:"L'ingénieur Eiji Nakatsu (ornithologiste amateur) redesigne en 1997 le nez du Shinkansen série 500 en s'inspirant du bec du martin-pêcheur — réduction du bruit de 75 % et économie d'énergie de 15 %",detail:"Le train créait un bang en sortant des tunnels, à cause de l'onde de pression. Nakatsu remarque que le martin-pêcheur plonge de l'air dans l'eau, bien plus dense, presque sans éclaboussure grâce à son bec effilé. Le nouveau nez réduit fortement ce bruit et, selon JR West, la consommation d'énergie d'environ 15 % tout en permettant d'aller plus vite. Le biomimétisme est depuis un champ d'ingénierie à part entière."},
{theme:"nature",diff:"facile",type:"q",q:"Quelle catastrophe nucléaire de 1986, à Tchernobyl (Ukraine), a créé ironiquement une 'zone d'exclusion' de 2 600 km² devenue l'une des réserves de faune sauvage les plus riches d'Europe ?",a:"La zone d'exclusion de Tchernobyl accueille loups, lynx, ours, bisons, aigles — en l'absence de perturbation humaine, la biodiversité y explose malgré la radioactivité",detail:"30 km autour de la centrale évacuée, les animaux prolifèrent sans chasseurs ni agriculteurs. Des loups 7x plus nombreux que dans les parcs voisins, des chevaux de Przewalski réintroduits, des cerfs et sangliers. La radioactivité affecte certains individus (tumeurs, mutations) mais la 'pression humaine zéro' l'emporte sur la pression radiologique. Paradoxe : la pire catastrophe nucléaire crée accidentellement une réserve naturelle."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle espèce d'arbre, le ginkgo biloba, est appelé 'fossile vivant' car il existe depuis 270 millions d'années presque inchangé, et pourquoi a-t-il survécu à l'extinction des dinosaures ?",a:"Le ginkgo est le seul survivant de son groupe (Ginkgophyta), apparu il y a environ 270 millions d'années ; il a traversé plusieurs extinctions de masse et a été préservé par sa culture dans les temples d'Asie",detail:"La lignée du ginkgo remonte au Permien et a survécu notamment aux extinctions de la fin du Permien, de la fin du Trias et de la fin du Crétacé. À l'état sauvage, il ne subsiste que dans quelques régions de Chine ; les botanistes européens le découvrent au Japon à la fin du XVIIe siècle, cultivé près des temples. Six ginkgos situés à environ 1 à 2 km de l'hypocentre de la bombe d'Hiroshima ont survécu et repoussé."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment le concept d''hypothèse Gaïa' de James Lovelock (1972) propose-t-il que la Terre elle-même agit comme un organisme autorégulé, et quelle est la critique principale de la communauté scientifique ?",a:"Lovelock propose que les êtres vivants régulent activement les conditions chimiques et climatiques terrestres (température, O2, pH des océans) pour maintenir la vie — critiqué car implique une téléologie (but) absent de la sélection naturelle",detail:"La Terre maintient une température, une teneur en O2 (21 %), un pH océanique et une salinité étonnamment stables depuis des milliards d'années malgré l'augmentation de 30 % de la luminosité solaire. Lovelock (et Lynn Margulis) proposent que les organismes régulent ces conditions de manière systémique. Dawkins critique : la sélection naturelle opère sur les individus, pas sur les planètes. La version 'soft' (la vie influence les conditions terrestres) est largement acceptée ; la version 'strong' (la Terre est un organisme) reste controversée."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle structure moléculaire de l'ADN, la double hélice, a été découverte en 1953 par Watson et Crick grâce aux travaux cristallographiques de qui, et pourquoi cette attribution reste-t-elle controversée ?",a:"Rosalind Franklin (1920-1958) produit la 'Photo 51' — image aux rayons X de l'ADN qui révèle sa structure hélicoïdale — montrée à Watson sans sa permission par Wilkins, ce qui lui permet de proposer le modèle",detail:"Watson, Crick et Wilkins reçoivent le Prix Nobel en 1962 (Franklin est morte d'un cancer en 1958 — le Nobel n'est pas attribué à titre posthume). La 'Photo 51' (Franklin, 1952) est la clé du puzzle. Watson la voit via Wilkins sans l'autorisation de Franklin. Dans son livre 'La Double Hélice' (1968), Watson dépeint Franklin de manière condescendante. La communauté scientifique reconnaît depuis largement son rôle fondamental."},
{theme:"nature",diff:"facile",type:"q",q:"Quel phénomène dit 'effet papillon' (Edward Lorenz, 1963) illustre la sensibilité aux conditions initiales des systèmes chaotiques — le battement d'ailes d'un papillon au Brésil peut-il déclencher une tornade au Texas ?",a:"Non — l'effet papillon est une métaphore illustrant que de petites variations dans les conditions initiales produisent des évolutions radicalement différentes dans les systèmes chaotiques (météorologie, turbulences)",detail:"Edward Lorenz découvre en 1961 que ses simulations météo divergent complètement selon qu'il entre 0,506 ou 0,506127 dans son modèle. Il publie en 1963 ses équations de convection atmosphérique montrant un attracteur 'en forme de papillon'. Sa conférence de 1972 s'intitule 'Predictability: Does the Flap of a Butterfly's Wings in Brazil Set Off a Tornado in Texas ?'. Le chaos déterministe explique pourquoi les prévisions météo au-delà de 10-14 jours sont impossibles."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle race de chien, le border collie, est considérée comme la plus intelligente selon les tests cognitifs canins, et quel individu nommé Chaser a démontré un vocabulaire de plus de 1 000 mots ?",a:"Chaser (2004-2019), border collie de John Pilley (psychologue, Wofford College) — a appris les noms de 1 022 objets distincts et comprenait des phrases grammaticales simples",detail:"Pilley entraîne Chaser plusieurs heures par jour pendant trois ans. Elle identifie 1 022 jouets par leur nom, comprend des catégories (« les frisbees ») et peut déduire qu'un nom inconnu désigne l'objet inconnu parmi des objets familiers. Ses performances sont publiées en 2011 dans la revue Behavioural Processes. Cela reste toutefois très différent du langage humain, notamment par l'absence de syntaxe productive."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment le microbiote intestinal humain, composé de dizaines de milliers de milliards de micro-organismes, influence-t-il l'immunité et peut-être le comportement ?",a:"Par l'axe intestin-cerveau (nerf vague, métabolites, hormones), le microbiote influence l'immunité et pourrait jouer sur l'anxiété ou l'humeur ; l'intestin produit environ 90 % de la sérotonine de l'organisme",detail:"On estime à environ 38 000 milliards le nombre de bactéries intestinales, à peu près autant que de cellules humaines, pour une masse d'environ 200 g. Leurs gènes sont bien plus nombreux que les nôtres. La sérotonine intestinale est produite par des cellules de l'intestin, sous l'influence des bactéries. Des souris sans microbes montrent un comportement anormal. Les transplantations fécales traitent efficacement les infections récidivantes à Clostridioides difficile ; leur intérêt en psychiatrie reste à démontrer."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel est le seul phoque vivant exclusivement en eau douce, endémique du lac Baïkal ?",a:"La nerpa, ou phoque du Baïkal (Pusa sibirica)",detail:"Le Baïkal, plus profond (1 642 m) et plus ancien (environ 25 millions d'années) des lacs du monde, contient environ 20 % de l'eau douce liquide de surface. Il abrite des milliers d'espèces, en majorité endémiques. On ignore encore comment les ancêtres marins de la nerpa sont arrivés au cœur de la Sibérie, probablement par des réseaux fluviaux depuis l'Arctique. Pollution industrielle et réchauffement menacent l'écosystème."},
{theme:"nature",diff:"facile",type:"q",q:"Quel document international, la Convention sur la diversité biologique (1992, Rio), et son Protocole de Nagoya (2010) visent-ils à protéger, et quel objectif '30x30' a été adopté à Montréal en 2022 ?",a:"La biodiversité ; l'objectif « 30x30 » vise à protéger 30 % des terres et 30 % des océans d'ici 2030, contre environ 17 % et 8 % en 2022",detail:"La Convention sur la Diversité Biologique (Rio, 1992) est ratifiée par 196 pays. Le Protocole de Nagoya régule l'accès aux ressources génétiques (biopiraterie). À Montréal (COP15 biodiversité, décembre 2022), 196 pays adoptent le cadre Kunming-Montréal : protéger 30 % des terres et océans d'ici 2030, restaurer 30 % des écosystèmes dégradés. Les États-Unis n'ont jamais ratifié la CDB."},
{theme:"nature",diff:"difficile",type:"q",q:"Quelle découverte paléontologique dans les schistes de Burgess (Canada) révèle que des animaux avec des plans corporels radicalement différents des nôtres ont existé au Cambrien, dont Opabinia (5 yeux, trompe) et Hallucigenia (épines dorsales, pattes ventrales) ?",a:"Les schistes de Burgess (1909, Charles Walcott) conservent des organismes mous du Cambrien moyen (508 Ma) — Stephen Jay Gould les réinterprète dans 'La Vie est belle' (1989) comme illustrant le hasard de l'évolution",detail:"Walcott découvre les schistes de Burgess en 1909 et classe tous les organismes dans des groupes connus (biais conservateur). Dans les années 1970-80, Whittington, Conway Morris et Briggs réinterprètent : Opabinia (5 yeux sur tiges, trompe frontale) et Hallucigenia (épines dorsales, pattes étranges) n'entrent dans aucun groupe moderne. Gould en conclut que l'évolution est contingente — si on rembobinait, l'humanité n'apparaîtrait probablement pas. Conway Morris, lui, voit une convergence vers les mêmes solutions."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel est le plus grand poisson prédateur actuel, dont les attaques mortelles sur l'homme restent pourtant rares ?",a:"Le requin blanc (Carcharodon carcharias), qui peut dépasser 6 m",detail:"Le requin blanc se nourrit surtout d'otaries, de phoques, de poissons et de céphalopodes. Il lui arrive de mordre un objet inconnu pour l'identifier, par exemple un surfeur dont la silhouette évoque, vue d'en dessous, celle d'une otarie, puis de relâcher sa prise. Tous requins confondus, on recense en moyenne moins d'une dizaine d'attaques mortelles par an dans le monde, alors que les humains tuent des dizaines de millions de requins chaque année."},
{theme:"nature",diff:"facile",type:"q",q:"Quel comportement des abeilles butineuses, décrypté par Karl von Frisch (prix Nobel 1973), indique à la colonie la direction et la distance des fleurs ?",a:"La danse frétillante (Schwänzeltanz) : l'abeille décrit un huit, l'angle de la ligne droite par rapport à la verticale indique la direction par rapport au soleil, et la durée du frétillement la distance",detail:"Karl von Frisch découvre dans les années 1940 que les abeilles butineuses 'racontent' leur découverte par la danse. La danse ronde (< 100 m) et la danse frétillante (> 100 m) : l'axe du 'frétillement' indique la direction relative au soleil, la durée du frétillement la distance (1 seconde = ~1 km). Von Frisch reçoit le Nobel en 1973 avec Lorenz et Tinbergen pour l'étude du comportement animal."},
{theme:"nature",diff:"moyen",type:"q",q:"Quels oiseaux des Galápagos, aux becs adaptés à des régimes alimentaires différents, sont devenus un symbole de la sélection naturelle ?",a:"Les « pinsons de Darwin », une quinzaine d'espèces issues d'un ancêtre commun",detail:"Darwin fait escale aux Galápagos en 1835 à bord du Beagle. Becs robustes pour les graines dures, fins pour les insectes, adaptés aux cactus : cette radiation adaptative illustre la sélection naturelle. Darwin n'en saisit pourtant l'importance qu'à son retour, quand l'ornithologue John Gould identifie ses spécimens comme des espèces distinctes. Les travaux de Peter et Rosemary Grant ont depuis observé l'évolution de leurs becs en temps réel."},
{theme:"nature",diff:"facile",type:"q",q:"Quel écosystème marin, la mangrove, protège les côtes des tsunamis et cyclones, filtre l'eau, stocke du carbone et sert de nurserie à 80 % des espèces de poissons tropicaux commerciaux ?",a:"Les mangroves (forêts côtières tropicales à racines-échasses) sont parmi les écosystèmes les plus productifs et protecteurs — elles stockent 3-5x plus de carbone au km² que les forêts tropicales",detail:"Les racines-échasses des palétuviers (Rhizophora) atténuent les vagues, protègent les côtes et piègent les sédiments. Après le tsunami de 2004, les côtes avec mangroves ont subi moins de dégâts que celles sans. Les mangroves stockent jusqu'à 1 023 tonnes de carbone/ha (vs 200-250 pour les forêts tropicales). 35 % ont disparu depuis 1980 (aquaculture de crevettes, développement côtier). 80 % des espèces de poissons tropicaux commerciaux y passent une partie de leur cycle."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel grand singe a l'intervalle entre deux naissances le plus long de tous les mammifères, environ 7 à 9 ans ?",a:"L'orang-outan",detail:"Le petit reste avec sa mère 7 à 8 ans, plus longtemps que chez tout autre mammifère non humain. Il apprend quels fruits sont comestibles, quand et où les trouver, comment construire un nid chaque soir. Cette reproduction très lente rend les populations extrêmement vulnérables. Les orangs-outans de Bornéo et de Sumatra sont en danger critique, menacés par la déforestation liée notamment aux plantations de palmiers à huile."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel processus géologique dit 'subduction' explique la formation des chaînes de montagnes, des arcs volcaniques et des fosses océaniques, et quelle est la plaque qui s'enfonce sous l'autre ?",a:"La subduction : une plaque océanique (plus dense) plonge sous une plaque continentale ou océanique — en fondant dans le manteau, elle génère des magmas qui alimentent les volcans",detail:"Là où deux plaques convergent, la plus dense (généralement océanique) plonge sous l'autre à 2-10 cm/an. La plaque en subduction fond dans le manteau à 100-200 km de profondeur. Les fluides libérés abaissent le point de fusion des roches du manteau sus-jacent — générant du magma qui remonte (volcans). Les Andes (subduction de la plaque de Nazca), le Japon et les Philippines (subduction de la plaque Pacifique/Philippines) en sont des exemples."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment la théorie de la tectonique des plaques, proposée dans sa forme moderne dans les années 1960, a-t-elle été rejetée pendant 50 ans avant d'être acceptée, et quel rôle les données des fonds marins ont-elles joué ?",a:"Alfred Wegener propose la dérive des continents en 1912 — rejetée faute de mécanisme. Les données d'expansion des fonds marins (anomalies magnétiques symétriques, 1963) fournissent le mécanisme manquant",detail:"Wegener observe que les côtes de l'Amérique du Sud et de l'Afrique s'emboîtent, que les fossiles y sont identiques, que les chaînes de montagnes se correspondent. Mais il ne connaît pas le mécanisme. Sa théorie est moquée. Dans les années 1950-60, les sondages des fonds marins révèlent les dorsales médio-océaniques et les anomalies magnétiques en bandes symétriques (Vine, Matthews, 1963) — preuve de l'expansion des fonds marins. La communauté géologique accepte la tectonique des plaques en moins de 5 ans."},
{theme:"nature",diff:"facile",type:"q",q:"Quel animal, la pieuvre mimic (Thaumoctopus mimicus), peut imiter jusqu'à 15 espèces différentes comme le poisson-lion, la raie et la sole, devenant l'exemple le plus spectaculaire de mimétisme comportemental ?",a:"La pieuvre mimic (découverte en 1998 au large de Sulawesi) imite activement des espèces toxiques ou dangereuses selon le prédateur qui la menace",detail:"Selon le prédateur qui la menace, la pieuvre mimétique adopte différents déguisements : elle s'aplatit et ondule comme une sole, étale ses bras comme les épines venimeuses d'une rascasse volante ou imite un serpent de mer. Elle est la première espèce connue à pratiquer ainsi un mimétisme dynamique de plusieurs modèles. Elle vit dans les eaux peu profondes de l'Indo-Pacifique."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle région naturelle, la toundra arctique, subit un réchauffement 3-4x plus rapide que la moyenne mondiale ('amplification arctique'), et quels changements écologiques en résultent ?",a:"Cette « amplification arctique » est due notamment à la rétroaction de l'albédo : la glace et la neige, qui réfléchissent une grande partie du rayonnement, laissent place à l'océan sombre, qui en absorbe plus de 90 %",detail:"L'Arctique s'est réchauffé de ~3°C depuis 1979 (vs ~1°C pour la planète). La banquise estivale a perdu 40 % de son étendue. Les ours polaires (dépendent de la glace pour chasser les phoques) jeûnent plus longtemps. Les rennes perdent accès à l'herbe sous la glace reformée après le dégel. La végétation se modifie (arbustes remplacent la mousse). Les espèces du sud colonisent progressivement l'Arctique (grizzlys croisés avec ours polaires, 'pizzlys')."},
{theme:"nature",diff:"facile",type:"q",q:"Quel parc américain, créé en 1872, est considéré comme le premier parc national du monde ?",a:"Yellowstone (Wyoming, Montana, Idaho)",detail:"Yellowstone est créé par le Congrès sous la présidence d'Ulysses Grant, pour protéger ses geysers et ses paysages d'une exploitation privée. Le modèle s'exporte dans le monde entier ; la France crée son premier parc national, la Vanoise, en 1963. Les aires protégées couvrent aujourd'hui environ 17 % des terres émergées. Les « parcs de papier », protégés en théorie mais non gérés, restent un problème."},
{theme:"nature",diff:"difficile",type:"q",q:"Quelle théorie de l'évolution, la 'sélection de parentèle' (kin selection) de William Hamilton (1964), explique l'altruisme apparent chez les animaux sociaux comme les abeilles, fourmis et termites — où les individus se sacrifient pour leurs proches ?",a:"Hamilton démontre que l'altruisme évolue quand le bénéfice pour les proches parents (pondéré par leur degré de parenté) dépasse le coût pour l'altruiste (règle de Hamilton : rB > C)",detail:"La règle de Hamilton : un comportement altruiste évolue si r×B > C, où r = degré de parenté, B = bénéfice pour le bénéficiaire, C = coût pour l'altruiste. Dans les fourmis, les ouvrières (stériles) partagent 75 % de leurs gènes avec leurs sœurs (haplodiploïdie) — il est plus rentable génétiquement de nourrir leurs sœurs que d'avoir des filles (50 %). Dawkins popularise ce concept sous le nom de 'gène égoïste' (1976) : ce sont les gènes qui maximisent leur propagation, pas les individus."},
{theme:"nature",focus:"allemagne",diff:"facile",type:"q",q:"Quelle grande forêt allemande, symbole de la culture romantique, est célèbre pour ses paysages et ses légendes ?",a:"La Forêt-Noire (Schwarzwald)",detail:"Située dans le Bade-Wurtemberg, la Forêt-Noire culmine au Feldberg (1 493 m). Ses sombres forêts d'épicéas ont nourri l'imaginaire romantique et l'image des contes allemands. C'est aussi une région gastronomique (gâteau Forêt-Noire, jambon fumé) et la patrie de l'horloge à coucou. Le Danube y prend sa source, à Donaueschingen ; le Rhin la longe à l'ouest."},
{theme:"nature",focus:"allemagne",diff:"moyen",type:"q",q:"Quel concept forestier allemand du XVIIIe siècle est l'ancêtre de la notion moderne de développement durable ?",a:"La Nachhaltigkeit (durabilité/soutenabilité) — Hans Carl von Carlowitz, 1713",detail:"Dans son traité Sylvicultura Oeconomica (1713), von Carlowitz théorise qu'on ne doit prélever en forêt que ce qui peut se régénérer naturellement. Ce concept forestier allemand est l'ancêtre direct du développement durable moderne. Le mot Nachhaltigkeit est entré dans toutes les langues via l'anglais « sustainability »."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est la déesse de la sagesse et de la guerre dans la mythologie grecque, patronne d'Athènes, née tout armée du crâne de Zeus ?",a:"Athéna",detail:"Athéna naît après qu'Héphaïstos fend le crâne de Zeus d'un coup de hache. Elle est la déesse de la sagesse stratégique (différente d'Arès, dieu de la violence brute), des arts et de l'artisanat. La chouette et l'olivier lui sont consacrés. Rome l'adopte sous le nom de Minerve."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est le fils de Dédale qui s'approcha trop près du soleil avec ses ailes de cire et chuta dans la mer ?",a:"Icare",detail:"Dédale fabrique des ailes de plumes et de cire pour s'échapper du labyrinthe de Crète. Il avertit son fils : ni trop haut (la cire fond) ni trop bas (l'humidité alourdit). Icare, grisé par le vol, monte trop haut. Son nom est devenu le symbole de l'hubris — l'orgueil qui précède la chute."},
{theme:"mytho",diff:"facile",type:"q",q:"Quel héros grec accomplit douze travaux imposés par Eurysthée, dont tuer l'Hydre de Lerne et capturer Cerbère ?",a:"Héraclès (Hercule chez les Romains)",detail:"Les douze travaux incluent : tuer le lion de Némée, l'Hydre de Lerne, capturer la biche de Cérynia, le sanglier d'Érymanthe, nettoyer les écuries d'Augias, les oiseaux du lac Stymphale, le taureau de Crète, les juments de Diomède, la ceinture d'Hippolyte, les bœufs de Géryon, les pommes des Hespérides et Cerbère."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Méduse dans la mythologie grecque, et quel héros la décapite en se servant de son bouclier comme miroir ?",a:"Méduse est l'une des trois Gorgones — Persée la décapite en regardant son reflet dans le bouclier poli d'Athéna",detail:"Méduse changeait en pierre quiconque croisait son regard. Persée reçoit d'Athéna un bouclier poli, d'Hermès une serpe (harpè), et des Nymphes des sandales ailées, un sac (kibisis) et le casque d'invisibilité d'Hadès. Du cou tranché de Méduse naissent Pégase, le cheval ailé, et Chrysaor. Athéna place ensuite la tête de la Gorgone sur son égide."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quel roi de Phrygie obtint des dieux que tout ce qu'il touche se transforme en or, don qui se révéla une malédiction ?",a:"Midas",detail:"Midas reçoit ce don de Dionysos pour avoir bien traité Silène, son compagnon. Sa nourriture et sa boisson se changeant en or, il supplie le dieu de le lui retirer ; Dionysos lui ordonne de se baigner dans le Pactole, dont les sables deviennent aurifères. L'épisode de sa fille changée en or est un ajout moderne (Nathaniel Hawthorne, XIXe siècle). Midas est aussi l'homme aux oreilles d'âne."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Cassandre dans la mythologie grecque et pourquoi ses prophéties véridiques ne sont-elles jamais crues ?",a:"Princesse troyenne à qui Apollon accorda la prophétie puis, après son refus, condamna à n'être jamais crue",detail:"Cassandre prédit la chute de Troie, le danger du cheval de bois, la mort d'Agamemnon — sans jamais être écoutée. Après la guerre, elle est réduite en esclavage et emmenée par Agamemnon, qu'elle sait condamné. Son nom est devenu synonyme de celui qui prédit une catastrophe sans être écouté."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quel roi légendaire de Crète fit construire le Labyrinthe pour y enfermer le Minotaure, monstre né de l'union de sa femme Pasiphaé avec un taureau ?",a:"Minos",detail:"Poséidon avait envoyé un taureau blanc à Minos pour être sacrifié ; Minos le garde. En punition, Poséidon rend Pasiphaé amoureuse du taureau — d'où le Minotaure (tête de taureau, corps d'homme). Dédale construit le Labyrinthe. Thésée tue le monstre grâce au fil d'Ariane."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Orphée dans la mythologie grecque et pourquoi échoue-t-il à ramener Eurydice des Enfers ?",a:"Musicien thrace dont le chant charme tous les êtres — il obtient d'Hadès de ramener Eurydice mais se retourne avant de sortir des Enfers",detail:"Orphée descend aux Enfers pour récupérer Eurydice, morte d'une morsure de serpent. Son chant émeut Hadès et Perséphone, qui acceptent à condition qu'il ne se retourne pas avant de sortir. Au dernier moment, il se retourne — Eurydice disparaît. Son histoire symbolise l'amour, la perte et l'impossibilité du retour."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quelle guerre de dix ans oppose les Grecs aux Troyens, et quel stratagème permet finalement aux Grecs de prendre la ville ?",a:"La guerre de Troie — le cheval de Troie, immense cheval de bois renfermant des soldats grecs cachés",detail:"La guerre éclate après l'enlèvement d'Hélène par Pâris. Dix ans de siège infructueux. Ulysse propose le stratagème du cheval de bois, que les Troyens introduisent dans la ville comme offrande à Athéna. La nuit, les soldats grecs sortent et ouvrent les portes. Troie est incendiée."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quelle femme ouvre une jarre (ou boîte) libérant tous les maux du monde dans la mythologie grecque, ne conservant que l'Espoir au fond ?",a:"Pandore — première femme créée par Héphaïstos sur ordre de Zeus pour punir les hommes d'avoir reçu le feu de Prométhée",detail:"Zeus commande la création de Pandore («Tous les dons») pour punir Prométhée d'avoir volé le feu. Elle reçoit de chaque dieu un don (beauté, ruse, curiosité). Elle ouvre la jarre (pithos, mal traduit en «boîte» par Érasme) d'où s'échappent maladies, mort et misères. Seul l'Espoir reste au fond."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quelle figure mythologique grecque est condamnée à l'immortalité sans la jeunesse éternelle, vieillissant indéfiniment après qu'Aurore oublie de demander ce dernier don pour lui ?",a:"Tithon — amant de l'Aurore (Éos) qui oublia de demander la jeunesse avec l'immortalité",detail:"Éos obtient de Zeus l'immortalité pour Tithon, prince troyen, mais oublie de demander la jeunesse éternelle. Il vieillit sans fin, se ratatine et perd ses forces ; selon certaines versions, il est changé en cigale. Ce mythe sur l'horreur d'une immortalité sans jeunesse a inspiré le poème Tithonus de Tennyson."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Tirésias et combien de fois a-t-il changé de sexe selon la mythologie grecque ?",a:"Devin aveugle de Thèbes qui vécut sept générations — il changea deux fois de sexe en frappant des serpents en accouplement",detail:"Tirésias frappe deux serpents en accouplement et se transforme en femme. Sept ans plus tard, il refrappe les mêmes serpents et redevient homme. Zeus et Héra lui demandent qui de l'homme ou de la femme ressent plus de plaisir. Il répond que la femme en ressent neuf fois plus. Héra, furieuse, l'aveugle ; Zeus compense en lui accordant le don de prophétie."},
{theme:"mytho",diff:"facile",type:"q",q:"Quels jumeaux, fils du dieu Mars et de la vestale Rhéa Silvia, sont selon la légende les fondateurs de Rome en 753 av. J.-C. ?",a:"Romulus et Rémus",detail:"Abandonnés sur le Tibre, les jumeaux sont allaités par une louve (la Lupa Capitolina). Ils grandissent et fondent Rome. Lors d'une dispute sur l'emplacement de la ville, Romulus tue Rémus qui avait sauté par-dessus ses murailles. Rome porte le nom du vainqueur. La louve capitoline est le symbole de la ville."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quel héros troyen, fils d'Anchise et d'Aphrodite, fuit Troie en flammes avec son père sur le dos et fonde selon Virgile la lignée qui donnera naissance à Rome ?",a:"Énée — héros de l'Énéide de Virgile, ancêtre légendaire des Romains",detail:"Énée fuit Troie avec son père Anchise, son fils Ascagne et les Pénates (dieux du foyer). Après de longues errances (dont un séjour à Carthage avec Didon), il atteint le Latium. Son fils Ascagne fonde Albe-la-Longue, et sa descendance donnera Romulus et Rémus. Virgile écrit l'Énéide pour légitimer Auguste comme descendant d'Énée et donc de Vénus."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Janus dans la mythologie romaine et pourquoi le premier mois de l'année porte-t-il son nom ?",a:"Dieu romain des commencements, des passages et des transitions — représenté avec deux visages regardant passé et avenir",detail:"Janus, sans équivalent grec, préside aux portes, aux passages et aux commencements ; le mois de janvier (Ianuarius) porte son nom. Les portes de son temple du Forum étaient ouvertes en temps de guerre et fermées en temps de paix, ce qui n'arriva que très rarement, notamment sous Numa et sous Auguste. Il symbolise la dualité et la transition."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Loki dans la mythologie nordique et quel rôle joue-t-il dans la mort du dieu Baldr ?",a:"Le dieu trompeur de la mythologie nordique — il fait lancer par l'aveugle Höðr la branche de gui qui tue Baldr, dieu lumineux et bien-aimé",detail:"Baldr est invulnérable à tout... sauf au gui, que sa mère Frigg avait oublié d'inclure dans sa promesse de protection. Loki apprend ce secret et guide la main de l'aveugle Höðr pour lancer le gui fatal. La mort de Baldr est un signe annonciateur du Ragnarök. Loki est ensuite enchaîné par les dieux jusqu'à la fin des temps."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quelle est la cosmologie de l'arbre-monde Yggdrasil dans la mythologie nordique, et quels neuf mondes relie-t-il ?",a:"Yggdrasil est le frêne cosmique qui soutient les neuf mondes, dont Asgard (dieux), Midgard (humains) et Niflheim (mort)",detail:"Les listes varient selon les sources, mais comprennent généralement Asgard (Ases), Vanaheim (Vanes), Alfheim (elfes lumineux), Midgard (humains), Jötunheim (géants), Svartalfheim ou Nidavellir (elfes sombres et nains), Muspelheim (feu), Niflheim (glace et brume) et Hel (royaume des morts). Un aigle se tient au sommet, le dragon Níðhöggr ronge les racines, et l'écureuil Ratatosk court entre eux en semant la discorde."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qu'est-ce que le Valhalla dans la mythologie nordique et qui sont les Walkyries ?",a:"Le Valhalla est la salle d'Odin où festoient les guerriers morts au combat (Einherjar) — les Walkyries choisissent les élus sur le champ de bataille",detail:"Les Einherjar s'entraînent au combat le jour et festoient la nuit, attendant le Ragnarök. Les Walkyries ('celles qui choisissent les morts') chevauchent sur les champs de bataille pour sélectionner les guerriers dignes. Wagner les immortalise dans sa Tétralogie (La Chevauchée des Walkyries)."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Fenrir dans la mythologie nordique et quel dieu sera dévoré par ce loup lors du Ragnarök ?",a:"Fenrir est l'immense loup fils de Loki — il dévore Odin lors du Ragnarök, avant d'être tué par Víðarr",detail:"Les dieux enchaînent Fenrir avec le ruban magique Gleipnir (fait de bruit de pas d'un chat, barbe de femme, racines de montagne...). Tyr sacrifie sa main pour que Fenrir accepte d'être attaché. Au Ragnarök, Fenrir se libère et dévore Odin. Víðarr, fils d'Odin, le venge en déchirant ses mâchoires."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Osiris dans la mythologie égyptienne et comment est-il tué par son frère Seth ?",a:"Osiris est le dieu des morts et de la renaissance — son frère Seth le tue, découpe son corps en morceaux (14 selon Plutarque) et les disperse à travers l'Égypte",detail:"Isis (épouse d'Osiris) et Nephthys rassemblent les morceaux. Isis ressuscite Osiris le temps de concevoir Horus. Osiris devient alors le seigneur des morts. Son histoire symbolise le cycle des saisons (mort/renaissance) et la crue annuelle du Nil. Horus combat Seth pour venger son père."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Ra dans la mythologie égyptienne et quel voyage accomplit-il chaque jour et chaque nuit ?",a:"Ra est le dieu soleil — il traverse le ciel dans sa barque le jour, et la Douât (monde souterrain) la nuit, en combattant le serpent Apophis",detail:"Chaque nuit, Ra doit franchir les douze heures de la Douât à bord de sa barque. Apophis, serpent du chaos, tente de l'engloutir ; des dieux, dont Seth, le défendent. À l'aube, Ra renaît. Ce cycle traduit la lutte perpétuelle entre l'ordre (Maât) et le chaos (Isfet)."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Anubis dans la mythologie égyptienne et quel rôle joue-t-il dans le jugement des âmes ?",a:"Dieu à tête de chacal, gardien des nécropoles et guide des âmes — il préside à la pesée du cœur contre la plume de Maât",detail:"À la mort, Anubis conduit l'âme dans la Salle des Deux Vérités. Le cœur du défunt est pesé contre la plume de Maât (vérité/justice). Si le cœur est plus léger, l'âme rejoint le paradis. Si plus lourd (alourdi par les péchés), la chimère Ammout (lion/hippopotame/crocodile) le dévore et l'âme est détruite."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Thoth dans la mythologie égyptienne et quelles inventions lui attribue-t-on ?",a:"Dieu à tête d'ibis ou de babouin — dieu de la sagesse, de l'écriture, de la magie et de la science, inventeur des hiéroglyphes selon les Égyptiens",detail:"Thoth est le scribe des dieux, conseiller de Ra, arbitre entre Horus et Seth. Il invente l'écriture, les mathématiques, l'astronomie et la médecine. Les Grecs l'identifient à Hermès (Hermès Trismégiste). Il possède le Livre de Thoth, recueil de formules magiques conférant une puissance absolue."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quelle déesse égyptienne, sœur et épouse d'Osiris, est la plus puissante magicienne du panthéon et devient la grande mère universelle absorbant d'autres cultes ?",a:"Isis — sa popularité dépasse l'Égypte, son culte se répand dans tout l'Empire romain jusqu'en Grande-Bretagne",detail:"Isis ressuscite Osiris, conçoit Horus par magie, protège son fils contre Seth. Son culte se répand dans le monde grec puis romain (Iseum de Pompéi, temple d'Isis à Rome). Elle absorbe les attributs d'autres déesses (Hathor, Aphrodite, Déméter). Son culte mystérique promet la résurrection aux initiés."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quel est le plus ancien récit épique connu de l'humanité, tablettes sumériennes racontant les aventures d'un roi d'Uruk et sa quête d'immortalité ?",a:"L'Épopée de Gilgamesh (~2100 av. J.-C.)",detail:"Gilgamesh, roi d'Uruk, est divin aux deux tiers. Après la mort de son ami Enkidou, terrifié par la mort, il part chercher l'immortalité auprès d'Utnapishtim, survivant du déluge, épisode qui annonce le récit de Noé. Une plante de jouvence lui est volée par un serpent. Les premiers poèmes sumériens datent d'environ 2100 av. J.-C. ; la version « standard » en akkadien, en onze tablettes, d'environ 1200 av. J.-C."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quelle déesse babylonienne descend aux Enfers pour retrouver son amant Dumuzi, provoquant le gel de toute reproduction sur Terre pendant son absence ?",a:"Inanna/Ishtar — déesse sumérienne/babylonienne de l'amour et de la guerre dont la descente aux Enfers symbolise le cycle des saisons",detail:"Inanna descend dans le royaume de sa sœur Éreshkigal, abandonnant à chaque porte un attribut divin. Nue et abaissée, elle est tuée et pendue. Durant son absence, toute reproduction cesse. Les dieux la ressuscitent ; elle doit laisser un substitut : Dumuzi (son époux), qui passe six mois aux Enfers — mythe du cycle agricole."},
{theme:"mytho",diff:"facile",type:"q",q:"Selon la mythologie japonaise, quels deux dieux créent le Japon en remuant l'océan primordial avec une lance ornée de joyaux ?",a:"Izanagi et Izanami — couple divin primordial de la mythologie shinto",detail:"Izanagi et Izanami remuent l'océan chaotique avec la lance Amenonuhoko. Les gouttes qui tombent forment les îles du Japon. Ils engendrent ensuite les dieux de la nature. Izanami meurt en donnant naissance au dieu du feu. Izanagi descend aux Enfers (Yomi) pour la retrouver — mais fuit quand il voit son corps en décomposition."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Amaterasu dans la mythologie japonaise et pourquoi se cache-t-elle dans une grotte plongeant le monde dans l'obscurité ?",a:"Amaterasu est la déesse du soleil, divinité suprême du shintoïsme — elle se cache après les violences de son frère Susanoo",detail:"Susanoo (dieu des tempêtes) saccage les rizières d'Amaterasu et profane son temple. Elle se retire dans la grotte Ama-no-Iwato, plongeant le monde dans les ténèbres. Les dieux organisent une fête bruyante devant la grotte pour l'attirer dehors. Elle ressort curieuse — la lumière revient. La famille impériale japonaise se dit descendante d'Amaterasu."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Susanoo dans la mythologie japonaise et quel monstre à huit têtes et huit queues tue-t-il pour sauver une jeune fille ?",a:"Susanoo, dieu des tempêtes, tue le serpent Yamata no Orochi en le saoulant au saké — il trouve dans sa queue le sabre Kusanagi",detail:"Le Yamata no Orochi, serpent à 8 têtes, dévore une à une les filles d'un couple de dieux. Susanoo prépare 8 tonneaux de saké. Le serpent s'enivre et s'endort. Susanoo le découpe. Dans la queue, il trouve le sabre Kusanagi no Tsurugi, l'une des trois Regalia impériales du Japon."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qu'est-ce que le concept de Musubi dans la cosmologie shinto et comment s'articule-t-il avec la notion de kami ?",a:"Musubi désigne la force créatrice d'harmonie et de croissance présente dans tous les kami — êtres ou phénomènes naturels dotés d'une puissance spirituelle",detail:"Dans le shinto, les kami ne sont pas des dieux au sens occidental : ce sont des puissances spirituelles habitant des lieux, des phénomènes, des ancêtres. Le musubi est l'énergie qui unit et fait croître. Il n'y a pas de dualisme bien/mal absolu. L'harmonie (wa) entre humains, kami et nature est le but central du shinto."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Cú Chulainn dans la mythologie irlandaise et quel exploit surhumain accomplit-il seul contre les armées de la reine Medb ?",a:"Héros ultime de la mythologie celtique irlandaise — il défend seul l'Ulster contre l'armée du Connacht grâce à sa fureur de combat ('warp spasm')",detail:"Cú Chulainn est le fils du dieu Lug. Pendant que les guerriers d'Ulster sont frappés d'une malédiction (les Douleurs de l'Ulster), lui seul combat l'armée de Medb au corps à corps quotidien. Son état de fureur (riastrad) le transforme en monstre incontrôlable. Sa mort, debout attaché à une pierre, est l'une des plus épiques de la littérature mythologique."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quelle île paradisiaque des morts accueille les héros et les dieux dans la mythologie celtique irlandaise et bretonne ?",a:"Tír na nÓg ('Pays de la jeunesse') en irlandais, ou l'Avalon en tradition bretonne arthurienne",detail:"Dans la mythologie irlandaise, Tír na nÓg est une île à l'ouest où nul ne vieillit ni ne meurt. Niamh emmène Oisín (fils de Finn McCool) dans ce paradis. Il y reste 300 ans (qui lui semblent 3 ans). En Bretagne, Avalon accueille le roi Arthur blessé pour qu'il guérisse jusqu'à son retour."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui sont les Tuatha Dé Danann dans la mythologie irlandaise et quel destin leur est réservé après la conquête des Milésiens ?",a:"Les dieux de la mythologie irlandaise pré-chrétienne — après leur défaite face aux Milésiens (ancêtres des Irlandais), ils se retirent sous les collines (les Sidhe)",detail:"Les Tuatha Dé Danann ('Tribus de la déesse Dana') arrivent en Irlande sur des nuages magiques. Ils vainquent les Fir Bolg et les Fomorians. Mais les Milésiens les battent. Le dieu Dagda leur attribue les collines creuses (Sidhe) comme royaume souterrain. Les dieux deviennent les Aos Sí (fées irlandaises) de la tradition folklorique."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Quetzalcóatl dans la mythologie aztèque et quel mythe de son retour influence la conquête espagnole ?",a:"Dieu serpent à plumes de la sagesse et du vent — les Aztèques interprètent parfois l'arrivée de Cortès en 1519 comme son retour annoncé",detail:"Quetzalcóatl (« serpent à plumes ») apporte aux hommes le maïs, le calendrier et les arts. Selon la légende, il est chassé de Tula, la cité toltèque, par son rival Tezcatlipoca et part vers l'est en promettant de revenir. Cortès arrive en 1519, année « 1-Roseau » (Ce Acatl), associée à ce dieu. Beaucoup d'historiens pensent toutefois que l'idée d'un Cortès pris pour Quetzalcóatl a été largement construite après la conquête."},
{theme:"mytho",diff:"moyen",type:"q",q:"Selon la mythologie maya du Popol Vuh, comment les dieux créent-ils les premiers hommes après plusieurs tentatives ratées ?",a:"Les dieux créateurs (Tepeu, Gucumatz et d'autres) façonnent les premiers vrais humains avec de la pâte de maïs blanc et jaune, après des échecs avec la boue puis le bois",detail:"Le Popol Vuh (« Livre du Conseil »), texte k'iche' rédigé en caractères latins vers 1550 et copié vers 1701 par le dominicain Francisco Ximénez, raconte que les hommes de boue se délitent et que les hommes de bois, sans âme, sont détruits par un déluge, leurs ustensiles se retournant contre eux. Il relate aussi les exploits des jumeaux Hunahpu et Xbalanque contre les seigneurs de Xibalba (le monde souterrain)."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Huitzilopochtli dans la mythologie aztèque et pourquoi les sacrifices humains lui sont-ils offerts ?",a:"Dieu de la guerre et du soleil — sa naissance miraculeuse (armé de pied en cap, tuant ses 400 frères) symbolise la victoire du soleil chaque matin sur les étoiles",detail:"Sa mère, Coatlicue, est fécondée par une boule de plumes. Sa sœur Coyolxauhqui et ses 400 frères (les Centzon Huitznahua, dieux des étoiles du sud) veulent la tuer ; Huitzilopochtli naît tout armé et les extermine. Ce mythe justifie les sacrifices : le soleil doit être nourri de sang humain, « l'eau précieuse », pour triompher chaque matin des ténèbres. Son temple occupait le sommet du Templo Mayor de Tenochtitlan."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Ganesh dans la mythologie hindoue et comment acquiert-il sa tête d'éléphant ?",a:"Fils de Shiva et Parvati, dieu à tête d'éléphant de la sagesse et des commencements — Shiva lui coupe la tête et la remplace par celle d'un éléphant",detail:"Plusieurs versions existent. La plus célèbre : Parvati modèle Ganesh en argile et lui insuffle la vie. Shiva, ne reconnaissant pas son fils, lui tranche la tête. Pour consoler Parvati, il promet de remplacer la tête par celle du premier animal venu — un éléphant. Ganesh est invoqué au début de tout projet ou voyage."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quelle grande guerre épique oppose les Pandavas aux Kauravas dans le Mahabharata, et quel est le rôle de Krishna comme guide d'Arjuna ?",a:"La guerre de Kurukshetra — Krishna révèle à Arjuna la Bhagavad Gita pour le convaincre de combattre malgré ses doutes moraux",detail:"Les Pandavas (5 frères, dont Arjuna) affrontent leurs cousins Kauravas (100 frères) pour le trône. Arjuna refuse de combattre : les deux camps comptent ses proches. Krishna lui révèle la Bhagavad Gita : l'âme est immortelle, le devoir (dharma) du guerrier est de combattre. Les Pandavas gagnent mais à un coût terrible."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Ravana dans le Ramayana et comment Rama, avec l'aide de l'armée de singes de Hanuman, finit-il par le vaincre ?",a:"Ravana est le démon à dix têtes roi de Lanka qui enlève Sita, épouse de Rama — Hanuman retrouve Sita et Rama construit un pont pour attaquer Lanka",detail:"Rama (avatar de Vishnu) est exilé 14 ans avec Sita et son frère Lakshmana. Ravana enlève Sita. Hanuman (dieu-singe) retrouve Sita à Lanka. Une armée de singes construit un pont jusqu'à Lanka. Rama tue Ravana d'une flèche divine. Sita doit traverser le feu pour prouver sa pureté. L'épopée explore le dharma, la loyauté et la justice."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quels sont les quatre yugas (âges du monde) dans la cosmologie hindoue et dans lequel se trouve-t-on selon la tradition ?",a:"Satya Yuga (âge d'or), Treta Yuga, Dvapara Yuga et Kali Yuga (âge actuel de déclin) — un cycle complet dure 4 320 000 ans",detail:"Le Satya Yuga est l'âge de la vérité et de la pureté (dharma à 100 %). Chaque yuga voit un déclin progressif : le Kali Yuga (commencé en 3102 av. J.-C. selon la tradition) est l'âge de la discorde et de l'immoralité. À sa fin, Kalki (dernier avatar de Vishnu) détruira le monde corrompu et un nouveau cycle commencera."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Nuwa dans la mythologie chinoise et comment crée-t-elle les premiers humains et répare-t-elle le ciel brisé ?",a:"Déesse à corps de serpent qui crée les humains en argile et répare le ciel avec des pierres de cinq couleurs après qu'un pilier céleste s'effondre",detail:"Nuwa est l'une des plus anciennes divinités chinoises. Elle crée les humains : les premiers modelés à la main sont nobles, ceux fabriqués à la chaîne (en trempant une corde dans l'argile) sont le peuple ordinaire. Quand le dieu Gong Gong brise un pilier du ciel, Nuwa fond des pierres de cinq couleurs pour réparer la voûte céleste."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est le Roi des Singes Sun Wukong dans la mythologie chinoise et dans quelle épopée classique du XVIe siècle apparaît-il ?",a:"Sun Wukong est le Roi Singe magicien du roman La Pérégrination vers l'Ouest (Xiyouji) de Wu Cheng'en",detail:"Né d'un rocher, Sun Wukong acquiert des pouvoirs fabuleux (72 transformations, bâton magique Ruyi Jingu Bang) et défie le Ciel. Le Bouddha l'emprisonne sous une montagne pendant 500 ans, avant qu'il n'accompagne le moine Xuanzang vers l'Inde pour rapporter les sutras bouddhiques. Il a inspiré Dragon Ball et le jeu vidéo Black Myth: Wukong (2024)."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qu'est-ce que le combat entre Pangu et le chaos originel dans la cosmogonie chinoise, et comment son corps donne-t-il naissance au monde ?",a:"Pangu émerge de l'œuf cosmique primordial, sépare le ciel de la terre en les poussant 18 000 ans — à sa mort, son corps se transforme en univers",detail:"Dans l'obscurité originelle, un œuf contient le chaos. Pangu naît et sépare yin (terre, lourd) et yang (ciel, léger). Il pousse le ciel vers le haut 18 000 ans. À sa mort : son souffle devient le vent et les nuages, sa voix le tonnerre, ses yeux le soleil et la lune, ses membres les montagnes, son sang les rivières, ses cheveux les étoiles, ses puces les humains."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Baba Yaga dans la mythologie slave et quel rôle ambigu joue-t-elle dans les contes russes ?",a:"Sorcière de la forêt slave à la maison sur pattes de poule — guide ambivalente qui peut aider ou dévorer les héros selon qu'ils respectent les rites",detail:"Baba Yaga vit dans une izba (maison) qui tourne sur des pattes de poule, entourée d'une clôture en os. Elle aide les héros qui respectent le protocole (demander à manger et à boire, accomplir des tâches) et dévore les autres. Elle est à la fois figure de mort et de renaissance — initiateur des héros dans leur quête."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Perun dans la mythologie slave et quelle est sa rivalité cosmique avec Veles ?",a:"Perun est le dieu slave du tonnerre et de la guerre — sa lutte éternelle contre Veles (dieu du monde souterrain) structure la cosmologie slave",detail:"Perun vit dans les hauteurs (ciel, chênes, montagnes). Veles vit dans les profondeurs (eau, serpents, bétail). Veles vole régulièrement les troupeaux de Perun ou enlève ses proches. Perun le chasse avec ses éclairs — Veles se cache en se transformant en animaux. Cette lutte symbolise le cycle des saisons et les orages qui fertilisent la terre."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Anansi dans la mythologie akan (Ghana) et comment ce personnage d'araignée s'est-il répandu à travers l'Atlantique avec la traite négrière ?",a:"Anansi l'araignée est le dieu trickeur des histoires et de la sagesse — ses contes voyagent avec les esclaves africains jusqu'aux Caraïbes et aux Amériques",detail:"Dans la mythologie akan, Anansi achète au dieu du ciel Nyame toutes les histoires du monde en capturant des créatures réputées imprenables. Ses contes ont survécu dans la diaspora africaine, aux Caraïbes (Anansi, Nancy) et dans le sud des États-Unis (« Aunt Nancy »). Le personnage de Br'er Rabbit, lui, dérive plutôt des contes africains du lièvre rusé. Neil Gaiman met Anansi en scène dans American Gods et Anansi Boys."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Ogun dans la mythologie yoruba et quels domaines préside-t-il dans le système des orishas ?",a:"Ogun est l'orisha du fer, de la guerre, du travail et de la technologie — vénéré par les forgerons, chasseurs, soldats et en diaspora par les chauffeurs",detail:"Dans le système yoruba des orishas (divinités intermédiaires entre Olodumare/Dieu suprême et les humains), Ogun est le seigneur du fer. Il ouvre les chemins (sa machette défriche la forêt). En diaspora (Candomblé brésilien, Santería cubaine, Vodou haïtien), il devient Ogum/Ogou et reste associé aux métaux, à l'énergie brute et à la justice violente."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Inti dans la mythologie inca et quel lien mythique l'unit à la famille impériale ?",a:"Inti est le dieu soleil des Incas — l'Inca (empereur) est considéré comme son fils et représentant sur Terre",detail:"Inti est la divinité principale de l'empire inca. Le Coricancha (temple du Soleil à Cusco) lui est dédié, recouvert d'or. La fête Inti Raymi (encore célébrée aujourd'hui en juin) marque le solstice d'hiver andéen. La Coya (épouse de l'Inca) est fille de la Lune (Mama Quilla). L'or est la sueur d'Inti, l'argent les larmes de la Lune."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Maui dans la mythologie polynésienne et quels exploits semi-divins lui attribue-t-on à travers tout le Pacifique ?",a:"Demi-dieu trickeur polynésien — il pêche les îles avec son hameçon, ralentit le soleil pour allonger les jours, et tente (en vain) de conquérir l'immortalité",detail:"Maui est commun à la mythologie hawaïenne, maorie, tahitienne et samoane. Il ralentit le soleil en l'attrapant avec des liens pour que les jours soient plus longs. Il pêche l'île de Nouvelle-Zélande (Te Ika a Maui) avec son hameçon magique. Il tente d'entrer dans le corps de la déesse de la mort Hine-nui-te-pō mais est écrasé — l'immortalité échappe aux hommes. Disney en fait un personnage dans Moana (2016)."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Poséidon dans la mythologie grecque et quels sont ses attributs et son domaine ?",a:"Dieu de la mer, des tremblements de terre et des chevaux — frère de Zeus, il règne sur les océans avec son trident",detail:"Poséidon (Neptune chez les Romains) partage le monde avec Zeus (ciel) et Hadès (enfers) après la défaite des Titans. Il crée les chevaux d'un coup de trident sur la roche. Sa rivalité avec Athéna pour la patronne d'Athènes se termine par un vote des dieux en faveur de l'olivier d'Athéna contre la source salée de Poséidon."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Ulysse (Odysseus) et combien d'années met-il à rentrer chez lui à Ithaque après la guerre de Troie ?",a:"Roi d'Ithaque, héros de l'intelligence et de la ruse — il erre 10 ans avant de rentrer, affrontant Cyclopes, Sirènes et la colère de Poséidon",detail:"L'Odyssée d'Homère raconte ces 10 ans : Polyphème le Cyclope (aveuglé par Ulysse), Circé qui transforme ses compagnons en cochons, Charybde et Scylla, les Sirènes, Calypso qui le retient 7 ans, Nausicaa... Il rentre déguisé en mendiant et massacre les prétendants qui courtisent sa fidèle Pénélope."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quel sculpteur de la mythologie grecque tombe amoureux de sa propre statue au point qu'Aphrodite l'anime pour lui ?",a:"Pygmalion — sculpteur chypriote dont la statue d'ivoire prend vie, selon les Métamorphoses d'Ovide",detail:"Pygmalion, dégoûté par les femmes de son île, sculpte dans l'ivoire une femme idéale et en tombe amoureux. Lors de la fête d'Aphrodite, la déesse anime la statue, qu'il épouse. Chez Ovide, elle n'a pas de nom ; celui de Galatée s'impose au XVIIIe siècle, notamment avec Rousseau. Le mythe inspire la pièce Pygmalion de George Bernard Shaw (1913), adaptée en My Fair Lady."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Achille et quelle est son unique vulnérabilité qui cause sa mort devant Troie ?",a:"Le plus grand guerrier grec de la guerre de Troie — sa seule vulnérabilité est son talon, où il fut tenu quand sa mère Thétis le trempa dans le Styx",detail:"Selon une tradition postérieure à Homère, attestée notamment chez le poète latin Stace, Thétis plonge le nourrisson dans le Styx pour le rendre invulnérable, mais le talon par lequel elle le tient reste mortel. Achille se retire du combat après une querelle avec Agamemnon, puis y revient pour venger Patrocle et tue Hector. Il meurt d'une flèche de Pâris guidée par Apollon. L'expression « talon d'Achille » en est issue."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Œdipe et comment réalise-t-il malgré lui la prophétie delphique qui prédisait qu'il tuerait son père et épouserait sa mère ?",a:"Roi de Thèbes qui tue son père Laïos sans le connaître et épouse sa mère Jocaste — à la découverte de la vérité, il s'arrache les yeux",detail:"L'oracle prédit à Laïos que son fils le tuera. Le nourrisson est abandonné et recueilli à Corinthe. Adulte, Œdipe consulte Delphes, apprend la prophétie et fuit pour l'éviter. Sur la route, il tue un vieil homme (Laïos, son père). Il sauve Thèbes du Sphinx et épouse la reine veuve (Jocaste, sa mère). La vérité révélée, Jocaste se pend, Œdipe s'aveugle."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Thor dans la mythologie nordique et quelle est son arme emblématique ?",a:"Dieu nordique du tonnerre, fils d'Odin — son marteau Mjöllnir est l'arme la plus puissante des Ases",detail:"Thor protège les hommes et les dieux des géants de glace (Jötunn). Mjöllnir revient toujours dans sa main après avoir été lancé. Il possède aussi la ceinture Megingjörð qui double sa force et des gants de fer. Le jeudi (Thursday = Thor's day) lui doit son nom en anglais, comme Donnerstag en allemand (Donner = tonnerre)."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui sont les Nornes dans la mythologie nordique et quel pouvoir exercent-elles sur le destin des dieux et des hommes ?",a:"Trois femmes (Urd, Verdandi, Skuld) tissant le destin à la source Urðarbrunnr au pied de Yggdrasil — même les dieux leur sont soumis",detail:"Urd (ce qui a été), Verdandi (ce qui advient), Skuld (ce qui doit être) représentent passé, présent et futur. Elles tissent la toile du destin de chaque être. Les Parques romaines (Clotho, Lachésis, Atropos) et les Moires grecques leur sont analogues. Leur pouvoir transcende celui des Ases — personne n'échappe au destin tissé."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quel voyage mystique Odin accomplit-il pour acquérir la sagesse des runes, et quel sacrifice consent-il pour boire à la source de Mimir ?",a:"Odin se pend 9 jours et 9 nuits à Yggdrasil, percé de sa propre lance — pour boire à la source de Mimir il abandonne un œil",detail:"Odin est le dieu de la sagesse, de la guerre et de la mort, mais aussi de la poésie et de la magie. Il se sacrifie à lui-même pour obtenir la connaissance des runes. Pour boire à la source de sagesse de Mimir, il laisse un œil en gage — d'où son iconographie borgne. Il voyage incognito parmi les hommes avec son chapeau à large bord et son bâton."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quel rôle joue Horus dans la mythologie égyptienne et pourquoi le pharaon est-il assimilé à lui de son vivant ?",a:"Horus, fils d'Osiris et d'Isis, venge son père contre Seth et devient le dieu du ciel vivant — le pharaon est son incarnation terrestre",detail:"Le combat d'Horus contre Seth est long et brutal (80 ans selon certains textes). Horus perd un œil (l'Oudjat, œil d'Horus, symbole de protection). Seth perd ses parties génitales. Le tribunal des dieux tranche en faveur d'Horus. Pharaon vivant = Horus ; pharaon mort = Osiris. L'œil d'Horus est l'amulette la plus répandue de l'Égypte antique."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Sekhmet dans la mythologie égyptienne et quel mythe raconte comment elle faillit détruire l'humanité entière ?",a:"Déesse à tête de lionne de la guerre et des épidémies — Ra l'envoie punir les hommes rebelles mais elle s'emballe et doit être endormie par de la bière teintée en rouge",detail:"Ra envoie sa fille Sekhmet châtier les humains qui le méprisent. Sekhmet, ivre de sang, devient incontrôlable. Ra ordonne qu'on teigne 7 000 jarres de bière en rouge sang. Sekhmet se jette dessus, s'enivre et s'endort. L'humanité est sauvée. Ce mythe explique les fêtes rituelles de l'ivresse en Égypte et le double aspect de la déesse : destructrice et guérisseuse."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quel dieu maori des forêts sépare ses parents Ranginui (le ciel) et Papatūānuku (la terre) pour laisser entrer la lumière dans le monde ?",a:"Tāne (Tāne Mahuta)",detail:"Ranginui et Papatūānuku étaient enlacés, et leurs enfants vivaient dans l'obscurité entre eux. Après débat, Tāne, couché sur le dos, repousse le ciel avec ses jambes et la lumière envahit le monde. Tāwhirimātea, dieu des vents, opposé à cette séparation, attaque ses frères avec ses tempêtes. Les larmes de Ranginui forment la rosée, les soupirs de Papatūānuku la brume."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quel dieu aztèque de la nuit et du jaguar utilise un miroir fumant pour voir tous les secrets du monde et rivalise avec Quetzalcóatl ?",a:"Tezcatlipoca ('Miroir fumant') — dieu de la nuit, du nord, du jaguar et du chaos, adversaire et double de Quetzalcóatl",detail:"Tezcatlipoca possède un miroir de pyrite qui révèle tous les secrets et peut envoyer maladie et mort. Il piège Quetzalcóatl en lui faisant croire qu'il est laid, puis en l'enivrant pour le pousser à commettre l'inceste — Quetzalcóatl quitte alors son royaume. Tezcatlipoca représente le chaos nécessaire à la création ; Quetzalcóatl l'ordre et la civilisation."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Shiva dans la mythologie hindoue et quels aspects contradictoires incarne-t-il ?",a:"L'une des trois grandes divinités hindoues (Trimurti) — destructeur et régénérateur, ascète et danseur cosmique, dieu de la fertilité et de la mort",detail:"Shiva est représenté avec le troisième œil (sagesse et destruction), le trident Trishula, le cobra Vasuki, le croissant de lune, le Gange jaillissant de ses cheveux. Sa danse Nataraja représente la création et la destruction cyclique de l'univers. Il est le maître du yoga et de la méditation, époux de Parvati, père de Ganesh et Kartikeya."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui sont les dix avatars (Dashavatara) de Vishnu dans la mythologie hindoue et lequel est encore attendu ?",a:"Vishnu s'incarne en poisson, tortue, sanglier, homme-lion, nain, Parashurama, Rama, Krishna, Bouddha et Kalki (encore à venir)",detail:"Les avatars descendent sur terre pour rétablir le dharma (ordre cosmique) quand le mal l'emporte. Les plus célèbres sont Rama, héros du Ramayana, et Krishna, guide d'Arjuna dans la Bhagavad-Gita. Selon les listes, le Bouddha ou Balarama figure en neuvième position ; l'inclusion du Bouddha traduit une assimilation du bouddhisme. Kalki, sur un cheval blanc et l'épée flamboyante, viendra à la fin du Kali Yuga."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est le roi Arthur dans la mythologie bretonne et quelles sont les trois caractéristiques qui en font un mythe — plutôt qu'un personnage historique — de portée universelle ?",a:"Roi légendaire breton entouré des Chevaliers de la Table Ronde — son mythe est fondé sur : la quête du Graal (idéal spirituel), Excalibur (légitimité divine) et le sommeil d'Avalon (roi qui reviendra)",detail:"Arthur est peut-être inspiré d'un chef guerrier du Ve-VIe s. résistant aux Saxons. Mais le mythe littéraire (Chrétien de Troyes, XIIe s. ; Malory, XVe s.) construit un idéal chevaleresque. La Table Ronde symbolise l'égalité. Le Graal (coupe du Christ ou pierre de lumière selon les versions) est la quête spirituelle ultime. Arthur dort à Avalon et reviendra quand la Bretagne en aura besoin."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est le Dagda dans la mythologie irlandaise et quels objets magiques possède-t-il ?",a:"Le Dagda est le 'Bon Dieu' des Tuatha Dé Danann — il possède une massue qui tue et ressuscite, un chaudron d'abondance inépuisable et une harpe qui commande les saisons",detail:"Le Dagda ('bon dieu', pas 'dieu du bien') est le père des dieux irlandais, maître de la magie et de la sagesse. Sa massue tue d'un bout et ressuscite de l'autre. Son chaudron (Coire Ansic) nourrit sans jamais se vider. Sa harpe (Uaithne) commande les saisons et peut provoquer rire, larmes ou sommeil. Il est aussi le dieu de la terre et des contrats."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Marzanna (ou Morena) dans la mythologie slave et quel rituel printanier lui est encore consacré en Pologne et en Tchéquie ?",a:"Déesse slave de la mort, de l'hiver et des maladies — une effigie de paille est noyée ou brûlée au printemps pour symboliser la victoire sur l'hiver",detail:"Marzanna représente l'hiver et la mort. Chaque année au printemps (généralement le 21 mars), on fabrique une effigie de paille habillée, on la promène au village en chantant des malédictions, puis on la brûle et jette dans une rivière. Ce rituel préchrétien survit sous une forme folklorique dans plusieurs pays slaves. Son nom est apparenté à 'mort' dans les langues slaves."},
{theme:"mytho",diff:"facile",type:"q",q:"Quelle déesse chinoise vit sur la Lune avec un lapin de jade après avoir bu l'élixir d'immortalité de son époux, l'archer Hou Yi ?",a:"Chang'e",detail:"Hou Yi est l'archer qui abat 9 des 10 soleils (qui brûlaient la Terre). En récompense, il reçoit l'élixir d'immortalité. Sa femme Chang'e le boit pour l'empêcher d'en abuser (ou selon d'autres versions, pour ne pas le partager). Elle s'envole sur la lune avec le lapin de jade qui prépare l'élixir. La Fête de la Mi-Automne lui est dédiée."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est le Dragon Jaune (Huanglong) et quelle place occupent les dragons dans la cosmologie et la symbolique chinoises ?",a:"Contrairement à l'Occident, les dragons chinois (long) sont bienveillants — symboles de l'eau, de la fertilité, de la puissance impériale et de la bonne fortune",detail:"Le dragon chinois (long) est un être composite (corps de serpent, griffes d'aigle, écailles de carpe, tête de chameau). Il contrôle la pluie et les rivières — essentiel pour l'agriculture. L'Empereur de Chine est le Fils du Dragon. Le Dragon Jaune (Huanglong) apparaît à l'Empereur Jaune (Huangdi) pour lui transmettre les arts de la civilisation."},
