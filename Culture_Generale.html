{theme:"economie",diff:"moyen",type:"q",q:"Quel mécanisme de marché permet aux entreprises industrielles d'échanger des droits à polluer pour atteindre collectivement un plafond d'émissions de CO2 à moindre coût ?",a:"Le marché carbone (EU ETS — système d'échange de quotas d'émission) — en vigueur en Europe depuis 2005",detail:"Le système européen d'échange de quotas (EU ETS) couvre environ 10 000 installations industrielles et énergétiques, ainsi que l'aviation intra-européenne. Il fixe un plafond global d'émissions décroissant et les entreprises s'échangent des quotas (cap and trade). Le prix de la tonne de CO₂ a dépassé 80 € en 2022-2023, puis fluctué autour de 60-80 €."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce qu'une externalité négative en économie et quel exemple classique l'illustre ?",a:"Un coût imposé à des tiers non parties à une transaction — la pollution industrielle en est l'exemple type",detail:"Les externalités négatives (pollution, congestion) ne sont pas intégrées dans les prix de marché, conduisant à une surproduction. Les taxes pigouviennes visent à corriger cette défaillance en faisant payer le pollueur."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que l'hypothèse des marchés efficients de Fama et quelle est sa limite principale ?",a:"Eugene Fama (Prix Nobel 2013) — les prix des actifs reflètent toute l'information disponible, rendant impossible de 'battre le marché' régulièrement",detail:"L'hypothèse des marchés efficients fonde la gestion passive (ETF, fonds indiciels) mais est remise en question par les bulles spéculatives et la crise de 2008. Elle reste cependant l'hypothèse de référence en finance académique."},
{theme:"economie",diff:"moyen",type:"q",q:"Quels sont les principaux instruments du protectionnisme économique ?",a:"Droits de douane, quotas d'importation, normes techniques, subventions aux entreprises nationales",detail:"Le protectionnisme a ses théoriciens, comme Alexander Hamilton et Friedrich List, défenseurs de l'« industrie naissante ». La guerre commerciale sino-américaine lancée en 2018, puis les hausses générales de droits de douane décidées par les États-Unis en 2025, ont relancé le débat sur ses coûts et ses bénéfices face au libre-échange ricardien."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie de la croissance endogène et qui en sont les pères fondateurs ?",a:"Paul Romer et Robert Lucas (années 1980-90) — la croissance vient de l'intérieur : capital humain, innovation, connaissances",detail:"Contrairement aux modèles néoclassiques (Solow) où la technologie est exogène, Romer montre que l'investissement en R&D et en éducation génère des rendements croissants. Cette théorie justifie les politiques publiques en faveur de l'éducation et de l'innovation."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le modèle de Solow et que prédit-il sur la convergence économique entre pays riches et pauvres ?",a:"Robert Solow (1956) — les pays pauvres croissent plus vite car le capital y est plus rentable, tendant vers une convergence",detail:"Le modèle de Solow prédit une 'convergence conditionnelle'. Les tigres asiatiques ont rattrapé les pays riches, mais l'Afrique subsaharienne reste à la traîne, ce qui pousse à chercher d'autres facteurs explicatifs comme les institutions."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la dette publique et pourquoi l'étude de Reinhart et Rogoff sur le seuil de 90 % du PIB a-t-elle été remise en cause ?",a:"En 2013, une erreur de tableur Excel dans leur étude de 2010 est découverte, affaiblissant la thèse qu'une dette > 90 % freine automatiquement la croissance",detail:"Reinhart et Rogoff publient une étude très influente justifiant l'austérité. En 2013, un étudiant découvre une erreur dans leur tableur, affaiblissant leur conclusion et relançant le débat sur l'austérité pendant la crise de la zone euro."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la taxe Tobin et quel en est l'objectif ?",a:"Taxe infime sur les transactions financières internationales proposée par James Tobin en 1972 pour réduire la spéculation à court terme",detail:"Tobin propose une taxe de 0,1-0,5 % sur les échanges de devises pour 'jeter du sable dans les rouages' de la spéculation. L'idée revient dans le débat après 2008. L'UE tente d'instaurer une taxe sur les transactions financières sans y parvenir."},
{theme:"economie",diff:"moyen",type:"q",q:"Quels pays ont expérimenté le revenu universel de base (RUB), et quels en sont les résultats ?",a:"Finlande (2017-2018), Kenya, Canada — amélioration du bien-être, sans réduction significative du travail",detail:"Le RUB vise à garantir un filet de sécurité sans conditions ni contrôle. Les expériences montrent une amélioration du bien-être et aucune réduction significative du travail. Son coût global et son financement restent les principaux obstacles à une généralisation."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la financiarisation de l'économie et quelles en sont les critiques ?",a:"La domination croissante de la sphère financière sur l'économie réelle depuis les années 1980 — profits financiers disproportionnés, instabilité accrue",detail:"La part des profits financiers dans les profits totaux explose depuis 1980. Des économistes comme Adair Turner montrent que la finance est devenue trop grande et que son développement excessif nuit à la croissance réelle, notamment en détournant les talents de l'industrie."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie institutionnaliste de Douglass North et pourquoi explique-t-elle les inégalités de développement ?",a:"North (Prix Nobel 1993) — les institutions (règles formelles et informelles) déterminent les incitations et la performance économique",detail:"North montre que les règles formelles (lois, droits de propriété) et informelles (normes, conventions) façonnent les incitations économiques. La différence de développement entre pays s'explique largement par la qualité de leurs institutions."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la stakeholder theory et en quoi s'oppose-t-elle à la vision de Friedman sur le rôle de l'entreprise ?",a:"Freeman (1984) : l'entreprise doit répondre à tous ses acteurs — contre Friedman (1970) : seul le profit des actionnaires compte",detail:"Friedman affirmait que 'la seule responsabilité sociale de l'entreprise est d'augmenter ses profits'. La stakeholder theory, portée par la RSE et les critères ESG, s'impose progressivement dans les grandes entreprises."},
{theme:"economie",diff:"facile",type:"q",q:"Qu'est-ce que la crise des subprimes de 2008 et quel mécanisme financier l'a propagée mondialement ?",a:"Effondrement du marché immobilier américain propagé via la titrisation des créances hypothécaires douteuses (CDO)",detail:"Les banques accordent des crédits à des emprunteurs insolvables, les revendent sous forme de produits financiers complexes notés AAA par les agences. Quand les défauts augmentent, tout le système financier mondial s'effondre en cascade."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que l'OPEP et quel rôle a-t-elle joué lors des chocs pétroliers des années 1970 ?",a:"Organisation des Pays Exportateurs de Pétrole (1960) — elle coordonne les quotas de production pour influencer le prix du baril",detail:"Fondée à Bagdad en 1960, l'OPEP compte 12 membres depuis le départ de l'Angola en 2024, dont l'Arabie saoudite. Son pouvoir se manifeste lors des chocs pétroliers de 1973 (embargo après la guerre du Kippour) et de 1979 (révolution iranienne). Il est dilué par l'essor du pétrole de schiste américain ; depuis 2016, l'« OPEP+ » associe notamment la Russie."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie du capital humain et qui la développe dans les années 1960 ?",a:"Gary Becker et Theodore Schultz (Prix Nobel) — l'éducation et la formation sont des investissements qui augmentent la productivité",detail:"Becker montre que les décisions d'éducation peuvent être analysées comme des investissements en capital : coût immédiat contre rendement futur. Cette théorie fonde les politiques d'investissement public en éducation."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le paradoxe de l'épargne de Keynes et quel est son impact en récession ?",a:"Ce qui est rationnel pour un individu (épargner) est néfaste pour la collectivité en récession (chute de la demande globale)",detail:"Keynes montre qu'en récession, si chaque agent économise par prudence, la demande globale s'effondre, approfondissant la crise. Ce paradoxe justifie l'intervention de l'État pour maintenir la demande quand le secteur privé se rétracte."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la rent-seeking (recherche de rente) et pourquoi est-elle néfaste pour l'économie ?",a:"Obtenir un revenu en manipulant l'environnement économique plutôt qu'en créant de la valeur — lobbying, faveurs réglementaires",detail:"L'idée est formulée par Gordon Tullock (1967) et le terme par Anne Krueger (1974). Les entreprises investissent dans le lobbying pour obtenir protections, licences ou subventions plutôt que d'innover. Ces dépenses sont socialement improductives et détournent des ressources de la croissance."},
{theme:"economie",diff:"difficile",type:"q",q:"Qu'est-ce que l'hypothèse d'instabilité financière de Hyman Minsky ?",a:"En période de boom, les agents prennent des risques croissants jusqu'au 'moment Minsky' — l'effondrement brutal",detail:"Minsky distingue trois types d'emprunteurs : les couverts, les spéculatifs et les Ponzi. En boom, la proportion de Ponzi croît jusqu'au retournement. Quasi-ignoré de son vivant, il est redécouvert après 2008."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie de la dépendance et comment explique-t-elle le sous-développement des pays du Sud ?",a:"Prebisch (CEPAL, 1950) — les pays du Sud restent pauvres à cause de termes de l'échange défavorables et de leur insertion dominée dans l'économie mondiale",detail:"Les théoriciens de la dépendance (Frank, Cardoso) soutiennent que les matières premières perdent en valeur relative face aux produits industriels. Cette théorie influence les politiques d'industrialisation par substitution aux importations en Amérique latine."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la courbe environnementale de Kuznets et pourquoi est-elle controversée ?",a:"La pollution augmente avec le revenu jusqu'à un seuil puis diminue — mais ce retournement n'est pas automatique pour le CO2",detail:"La courbe de Kuznets environnementale postule qu'en devenant riches, les sociétés s'offrent un environnement plus propre. Les données sont mitigées : si la pollution locale diminue dans les pays riches, les émissions de CO2 per capita y restent élevées."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que l'économie circulaire et en quoi s'oppose-t-elle au modèle linéaire ?",a:"Modèle 'cradle to cradle' : les déchets d'un processus deviennent les ressources d'un autre — contre le 'produire-utiliser-jeter'",detail:"L'économie circulaire vise à découpler croissance économique et consommation de ressources naturelles. Elle repose sur les 3R (Réduire, Réutiliser, Recycler) et inspire des politiques industrielles, notamment le plan d'action européen de 2020."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le problème du 'too big to fail' et quel aléa moral pose-t-il ?",a:"Les grandes banques savent qu'elles seront renflouées par l'État en cas de crise — elles prennent donc plus de risques",detail:"Les institutions 'too big to fail' dont la faillite mettrait en danger tout le système financier sont sauvées par les États en 2008. Les régulateurs répondent par Bâle III (renforcement des fonds propres) et les stress tests, mais le problème d'aléa moral persiste."},
{theme:"economie",diff:"moyen",type:"q",q:"En quoi la Banque mondiale diffère-t-elle du FMI dans leurs rôles respectifs ?",a:"La Banque mondiale finance des projets de développement à long terme — le FMI gère les crises de balance des paiements à court terme",detail:"La Banque mondiale (BIRD + IDA) accorde des prêts à long terme pour des projets d'infrastructure, d'éducation et de santé. Fondées toutes deux à Bretton Woods en 1944, les deux institutions ont souvent promu des politiques libérales similaires avant d'évoluer."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la révolution marginaliste des années 1870 et qui sont ses fondateurs ?",a:"Jevons, Menger, Walras — remplacement de la valeur-travail par l'utilité marginale décroissante comme fondement de la valeur",detail:"La révolution marginaliste fonde la microéconomie néoclassique moderne : la valeur d'un bien n'est pas son coût de production (classiques) mais l'utilité que procure la dernière unité consommée. Walras formalise l'équilibre général, Marshall popularise la microéconomie."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la gig economy et quels défis pose-t-elle au droit du travail ?",a:"Plateformes (Uber, Deliveroo) qui externalisent le travail à des 'indépendants' sans protection salariale",detail:"Les plateformes numériques offrent aux travailleurs la flexibilité d'indépendants, mais souvent avec la dépendance économique de salariés. Plusieurs juridictions ont requalifié des chauffeurs en salariés (Cour suprême britannique, affaire Uber, 2021 ; Cour de cassation française, 2020). L'UE a adopté en 2024 une directive sur le travail via les plateformes, qui instaure une présomption de salariat."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le capitalisme de surveillance théorisé par Shoshana Zuboff ?",a:"Les données personnelles deviennent une matière première pour prédire et modifier les comportements — Google et Facebook en sont les acteurs principaux",detail:"Zuboff (2019) montre que les plateformes ne vendent pas des services mais des prédictions comportementales à leurs vrais clients (annonceurs). Ce modèle crée une asymétrie de pouvoir radicale entre les plateformes et les individus."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la trappe à liquidité de Keynes et dans quel pays contemporain l'observe-t-on ?",a:"Situation où les taux d'intérêt à zéro rendent la politique monétaire inefficace — le Japon l'illustre depuis les années 1990",detail:"Selon Keynes, lorsque les taux d'intérêt sont proches de zéro, les agents préfèrent conserver de la monnaie plutôt qu'investir, et la politique monétaire perd son efficacité. Le Japon en est l'exemple depuis les années 1990, malgré des taux nuls puis négatifs ; la Banque du Japon n'est sortie des taux négatifs qu'en 2024. La réponse keynésienne est la relance budgétaire."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie des biens communs et comment Elinor Ostrom conteste-t-elle la 'tragédie des communs' ?",a:"Ostrom (Prix Nobel 2009) — les communautés gèrent collectivement leurs ressources sans privatisation ni État, contredisant Hardin",detail:"Garrett Hardin (1968) affirme que les ressources communes sont inévitablement surexploitées. Ostrom réfute empiriquement cette thèse en étudiant des pêcheries et forêts gérées durablement par des communautés auto-organisées depuis des siècles."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le 'China shock' d'Autor et ses effets sur l'emploi industriel américain ?",a:"David Autor, David Dorn et Gordon Hanson montrent que la concurrence des importations chinoises a détruit des centaines de milliers d'emplois industriels américains ; avec Acemoglu, ils estiment les pertes totales à environ 2 millions entre 1999 et 2011",detail:"L'adhésion de la Chine à l'OMC (2001) accélère ses exportations. Le « choc chinois » a fait baisser les prix pour les consommateurs, mais concentré les pertes d'emplois dans certaines régions, qui ne s'en sont pas remises. Ces travaux nuancent l'idée que les perdants du libre-échange se reconvertissent facilement, et éclairent la montée du populisme."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel livre de Richard Thaler et Cass Sunstein (2008) popularise le « paternalisme libéral » et l'idée d'« architecture du choix » ?",a:"Nudge",detail:"Un nudge modifie la présentation des choix sans contraindre : inscrire par défaut les salariés à un plan d'épargne retraite augmente massivement la participation. Le Royaume-Uni crée une « Nudge Unit » en 2010, imitée par de nombreux gouvernements. Les critiques y voient une forme de manipulation. Thaler reçoit le prix Nobel en 2017."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la 'malédiction des ressources' naturelles et comment affecte-t-elle le développement économique ?",a:"Les pays riches en pétrole tendent à avoir une croissance plus faible et des institutions plus corrompues — maladie hollandaise, rente désincitatrice",detail:"Sachs et Warner (1995) montrent que les pays riches en ressources naturelles croissent moins vite. La rente désincentive l'investissement dans l'éducation et l'industrie, finance des régimes autoritaires et apprécie le taux de change (maladie hollandaise)."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel gisement géant de gaz, découvert en 1959 et fermé en 2024 en raison des séismes qu'il provoquait, est à l'origine de l'expression « syndrome hollandais » ?",a:"Le gisement de Groningue (Pays-Bas)",detail:"L'afflux de devises tiré des exportations de gaz apprécie le florin et pénalise l'industrie exportatrice néerlandaise ; The Economist forge l'expression « Dutch disease » en 1977. L'exploitation provoque à partir des années 1990 des séismes qui endommagent des milliers de maisons, conduisant l'État à fermer le gisement."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie de l'agence et quel problème pose-t-elle dans les grandes entreprises cotées ?",a:"Jensen et Meckling (1976) — les dirigeants (agents) peuvent poursuivre leur intérêt propre au détriment des actionnaires (principals)",detail:"La séparation entre propriété (actionnaires) et contrôle (managers) crée des conflits d'intérêts : les dirigeants peuvent s'octroyer des salaires excessifs. La réponse classique est la rémunération en stock-options, mais elle crée d'autres biais (court-termisme)."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le système de Bretton Woods et pourquoi Nixon y met-il fin en 1971 ?",a:"Régime de changes fixes autour du dollar convertible en or — Nixon suspend la convertibilité ('Nixon Shock') car les dépenses de la guerre du Vietnam épuisent les réserves d'or",detail:"À Bretton Woods (1944), les pays s'engagent à maintenir leur parité par rapport au dollar, lui-même convertible en or à 35 dollars l'once. La surabondance de dollars rend la convertibilité insoutenable. Nixon y met fin en août 1971, ouvrant l'ère des changes flottants."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que l'indice de développement humain (IDH) et qui le crée en 1990 comme alternative au PIB ?",a:"Indicateur combinant revenu, éducation et espérance de vie — créé par Mahbub ul Haq et Amartya Sen pour le PNUD",detail:"L'IDH, publié annuellement dans le Rapport sur le développement humain du PNUD, classe les pays selon leurs performances en matière de bien-être. Amartya Sen développe ensuite l'approche par les capabilités : ce qui compte n'est pas le revenu mais ce que les gens peuvent faire."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que l'ordolibéralisme allemand et en quoi diffère-t-il du libéralisme anglo-saxon ?",a:"École de Fribourg — un État fort doit garantir les conditions du marché concurrentiel contre les monopoles, contre le laisser-faire et l'interventionnisme",detail:"L'ordolibéralisme, né à Fribourg dans les années 1930 (Eucken, Röpke), influence profondément la politique économique allemande. Contrairement au laisser-faire, il postule que le marché concurrentiel est une construction institutionnelle qui exige une intervention étatique active."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la taxe carbone et pourquoi le mouvement des Gilets jaunes de 2018 illustre-t-il un paradoxe de politique climatique ?",a:"Taxe sur les émissions de CO2 — refus populaire quand elle frappe les ménages ruraux dépendants de la voiture sans accès aux transports en commun",detail:"La hausse de la taxe carbone sur le carburant en 2018 déclenche les Gilets jaunes : ceux qui n'ont pas accès aux transports en commun subissent le coût sans avoir les alternatives des urbains. Ce paradoxe illustre que les politiques climatiques doivent être équitables pour être acceptées."},
{theme:"economie",diff:"difficile",type:"q",q:"Qu'est-ce que les ondes Kondratiev et quel sort leur économiste fondateur a-t-il subi ?",a:"Nikolaï Kondratiev — cycles économiques longs de 40-60 ans, lié à des vagues d'innovation. Fusillé par Staline car ses cycles prévoyaient la survie du capitalisme",detail:"Kondratiev identifie dans les années 1920 des cycles longs liés à de grandes vagues d'innovation (vapeur, chemin de fer, électricité, automobile). Schumpeter popularise ces « cycles Kondratiev ». Ses travaux, qui suggèrent que le capitalisme surmonte ses crises, lui valent d'être arrêté en 1930 ; il est fusillé en 1938 lors de la Grande Terreur."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la loi de Say et pourquoi Keynes la rejette-t-il ?",a:"Say (1803) : l'offre crée sa propre demande — Keynes répond que la demande effective peut être insuffisante si les agents épargnent",detail:"La loi de Say affirme que tout produit crée un revenu qui permettra d'acheter d'autres produits. Keynes réfute cela en 1936 : les agents peuvent épargner plutôt que dépenser, créant une insuffisance de demande effective qui justifie l'intervention de l'État."},
{theme:"economie",diff:"moyen",type:"q",q:"Quelle économiste reçoit le Prix Nobel 2023 pour ses travaux sur les inégalités de genre sur le marché du travail ?",a:"Claudia Goldin (née en 1946)",detail:"Goldin montre que l'essentiel de l'écart salarial entre hommes et femmes s'explique par la 'taxe sur la flexibilité' : les emplois les mieux payés exigent une disponibilité totale incompatible avec les responsabilités familiales encore majoritairement portées par les femmes."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie des contrats incomplets et quel Prix Nobel la développe ?",a:"Oliver Hart (Prix Nobel 2016) — les contrats ne peuvent prévoir tous les événements futurs, d'où des problèmes de gouvernance et de propriété",detail:"Hart montre que les contrats réels sont inévitablement incomplets. Cette incomplétude explique pourquoi les entreprises existent, pourquoi les droits de propriété importent, et comment structurer les contrats de privatisation et de partenariats public-privé."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie de la perspective (prospect theory) de Kahneman et Tversky ?",a:"Les individus sont deux fois plus sensibles aux pertes qu'aux gains équivalents — asymétrie fondamentale contredisant l'utilité espérée",detail:"La théorie des perspectives (1979) montre que perdre 100 euros fait deux fois plus souffrir que gagner 100 euros procure de plaisir. De plus, les individus sur-pondèrent les petites probabilités. Ces biais expliquent l'aversion au risque et les erreurs de jugement financier."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie de la régulation et quels économistes français la développent dans les années 1970 ?",a:"Robert Boyer et Michel Aglietta analysent les régimes d'accumulation et les modes de régulation institutionnelle du capitalisme",detail:"La théorie de la régulation (École de Paris) explique pourquoi le capitalisme peut être stable pendant de longues périodes (fordisme, 1945-1975) avant de céder à une crise. Elle insiste sur le rôle des institutions dans la cohérence d'un régime économique."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que l'économie sociale et solidaire (ESS) et quelle place occupe-t-elle en France ?",a:"Le secteur des coopératives, mutuelles, associations et fondations ; il représente environ 10 % de l'emploi et près de 14 % de l'emploi privé en France",detail:"L'ESS place les personnes et l'utilité sociale avant le profit, avec une gouvernance démocratique et des bénéfices largement réinvestis. La loi Hamon de 2014 lui donne un cadre légal en France. Les SCOP (sociétés coopératives et participatives) en sont un exemple emblématique."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la 'Grande Modération' (1985-2007) et pourquoi a-t-elle créé un faux sentiment de sécurité ?",a:"Période de faible volatilité économique qui a encouragé une prise de risque excessive, préparant la crise de 2008",detail:"Le terme, proposé par les économistes Stock et Watson (2002), est popularisé par Ben Bernanke dans un discours de 2004. La faible volatilité de la croissance et de l'inflation a conduit les acteurs financiers à sous-estimer les risques systémiques et à s'endetter excessivement. La crise de 2008 a brutalement mis fin à cette illusion."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le paradoxe d'Easterlin et que révèle-t-il sur la relation entre croissance et bonheur ?",a:"Au-delà d'un certain seuil, la croissance du revenu national n'augmente plus le bonheur moyen — c'est le revenu relatif qui importe",detail:"Richard Easterlin (1974) observe qu'aux États-Unis, malgré la forte croissance d'après-guerre, le bonheur déclaré moyen n'a pas augmenté. Une explication : la position relative par rapport aux autres compte davantage que le revenu absolu. Le paradoxe est discuté : d'autres travaux (Stevenson et Wolfers) trouvent un lien durable entre revenu et satisfaction."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie des choix publics de James Buchanan et quelle conclusion libérale en découle ?",a:"Buchanan (Prix Nobel 1986) — les politiciens et fonctionnaires maximisent leur intérêt propre comme tout agent économique, justifiant la méfiance envers l'État",detail:"Buchanan, avec Gordon Tullock (The Calculus of Consent, 1962), applique la logique économique au comportement politique : les élus cherchent à être réélus, les bureaucrates à étendre leur budget. Cette théorie justifie des règles constitutionnelles limitant l'État (équilibre budgétaire) et nourrit le courant libertarien."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le principe de précaution en économie et comment s'applique-t-il aux risques environnementaux ?",a:"Face à l'incertitude scientifique sur des risques graves et irréversibles, l'absence de preuve n'est pas une preuve d'absence",detail:"Le principe de précaution (Rio, 1992 ; Constitution française, 2005) justifie d'agir contre un risque potentiel avant qu'il soit prouvé. Il s'applique au changement climatique et aux perturbateurs endocriniens. Les économistes débattent de sa compatibilité avec l'analyse coût-bénéfice."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le taux d'actualisation dans l'économie du changement climatique et pourquoi est-il au cœur du débat Stern/Nordhaus ?",a:"Nicholas Stern (faible taux) justifie une action climatique immédiate coûteuse — Nordhaus (taux plus élevé) arrive à des conclusions plus modérées",detail:"Stern (rapport 2006) utilise un faible taux d'actualisation pour montrer que le coût de l'inaction dépasse celui de l'action. Nordhaus (Prix Nobel 2018) utilise un taux plus élevé. Ce débat technique masque un choix éthique : combien valorisons-nous le bien-être des générations futures ?"},
{theme:"popculture",diff:"facile",type:"q",q:"Dans quelle saga trouve-t-on les personnages de Bilbo et Frodon Sacquet ?",a:"Le Seigneur des Anneaux / Le Hobbit (J.R.R. Tolkien)",detail:"Tolkien publie Le Hobbit en 1937 et Le Seigneur des Anneaux en 1954-1955. Il invente des langues entières (elfique, nain). Peter Jackson adapte l'œuvre au cinéma (2001-2003) avec un budget de ~300 millions de dollars."},
{theme:"popculture",diff:"facile",type:"q",q:"Qui a créé le personnage de James Bond, agent 007 ?",a:"Ian Fleming (1953)",detail:"Fleming publie Casino Royale en 1953, en s'inspirant de ses années au renseignement naval britannique. Sean Connery incarne Bond au cinéma dès 1962 dans James Bond contre Dr No. La série officielle compte 25 films, ce qui en fait l'une des plus longues franchises de l'histoire du cinéma ; Amazon en détient désormais le contrôle créatif."},
{theme:"popculture",diff:"facile",type:"d",q:"Film de science-fiction de 1977 qui révolutionna le cinéma hollywoodien et lança une franchise mondiale",a:"Star Wars (George Lucas)",detail:"Star Wars invente le concept de blockbuster d'été et révolutionne les effets spéciaux. La franchise rachetée par Disney en 2012 pour 4 milliards de dollars génère plus de 70 milliards en merchandising."},
{theme:"popculture",diff:"moyen",type:"d",q:"Album de Michael Jackson (1982) qui reste le disque le plus vendu de l'histoire",a:"Thriller",detail:"Produit par Quincy Jones, Thriller s'est vendu à quelque 70 millions d'exemplaires selon les estimations. Sept de ses neuf titres sont entrés dans le top 10 américain. Le clip de Thriller, réalisé par John Landis (près de 14 minutes), est souvent cité comme le plus célèbre de l'histoire."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel jeu vidéo sorti en 2011 s'est vendu à plus de 300 millions d'exemplaires ?",a:"Minecraft (Mojang/Microsoft)",detail:"Créé par Markus « Notch » Persson, Minecraft est sorti en 2011. Microsoft rachète Mojang en 2014 pour 2,5 milliards de dollars. Ce jeu bac-à-sable est le plus vendu de tous les temps, tous supports confondus."},
{theme:"popculture",diff:"moyen",type:"q",q:"Comment s'appelle la théocratie totalitaire imaginée par Margaret Atwood dans La Servante écarlate (1985) ?",a:"La République de Gilead",detail:"Gilead a renversé le gouvernement des États-Unis ; les femmes fertiles, les « servantes », y sont réduites à leur fonction reproductrice et portent une robe rouge et une coiffe blanche. L'adaptation en série (Hulu, 2017-2025) a fait de ce costume un symbole des manifestations féministes. Atwood a publié une suite, Les Testaments (2019)."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quel artiste américain a réalisé Balloon Dog, vendue 58,4 millions de dollars en 2013 ?",a:"Jeff Koons",detail:"La sculpture en acier inoxydable poli, imitant un ballon de baudruche, a été vendue chez Christie's en 2013, alors record pour un artiste vivant. Koons a battu ce record en 2019 avec Rabbit (91 millions de dollars). Il incarne un art kitsch inspiré de la culture de consommation et fait réaliser ses œuvres par des assistants, comme Warhol dans sa Factory."},
{theme:"popculture",diff:"difficile",type:"q",q:"Dans quelle ville américaine se déroule la série The Wire (Sur écoute), souvent citée comme l'une des meilleures séries de l'histoire ?",a:"Baltimore (Maryland, États-Unis)",detail:"Créée par David Simon, ancien journaliste du Baltimore Sun (2002-2008), The Wire dépeint, saison après saison, le trafic de drogue, le port, la mairie, l'école et la presse de Baltimore. Peu regardée à sa diffusion, elle est aujourd'hui considérée comme un chef-d'œuvre de la télévision."},
{theme:"nature",diff:"facile",type:"q",q:"Quel gaz est principalement responsable de l'effet de serre anthropique ?",a:"Le CO₂ (dioxyde de carbone)",detail:"Le CO₂ représente ~76 % des émissions de gaz à effet de serre humaines. Sa concentration atmosphérique dépasse 420 ppm en 2024 — un niveau inégalé depuis 3 millions d'années."},
{theme:"nature",diff:"facile",type:"d",q:"Accord international de 2015 visant à limiter le réchauffement climatique à 1,5-2°C",a:"Accord de Paris (COP21)",detail:"Adopté par 196 parties en décembre 2015, il vise à contenir le réchauffement « nettement en dessous de 2 °C » et à poursuivre les efforts pour le limiter à 1,5 °C. Les États-Unis l'ont quitté sous Trump (2020), réintégré sous Biden (2021), puis quitté de nouveau en 2025-2026. Les engagements actuels conduiraient à un réchauffement d'environ 2,5 à 3 °C."},
{theme:"nature",diff:"facile",type:"q",q:"Quel est l'écosystème le plus riche en biodiversité de la planète ?",a:"La forêt tropicale humide (notamment l'Amazonie)",detail:"L'Amazonie abrite environ 10 % des espèces connues et stocke de 150 à 200 milliards de tonnes de carbone. Contrairement à une idée reçue, elle ne « produit » pas 20 % de l'oxygène mondial : elle en consomme presque autant qu'elle en produit. La déforestation fait craindre un point de bascule vers la savane."},
{theme:"nature",diff:"moyen",type:"q",q:"Qu'est-ce que la « sixième extinction de masse » ?",a:"La crise d'extinction actuelle, causée par les activités humaines",detail:"Le taux d'extinction actuel est 100 à 1 000 fois supérieur au taux naturel. Les 5 extinctions précédentes avaient des causes géologiques ou cosmiques. Celle-ci est la première causée par une seule espèce."},
{theme:"nature",diff:"moyen",type:"d",q:"Cycle par lequel l'eau circule entre les océans, l'atmosphère et les continents",a:"Le cycle hydrologique",detail:"Évaporation → condensation en nuages → précipitations → ruissellement → retour à la mer. Ce cycle régule le climat et distribue l'eau douce. Le réchauffement l'accélère, intensifiant sécheresses et inondations."},
{theme:"nature",diff:"difficile",type:"q",q:"Qu'est-ce que l'« effet albédo » et pourquoi amplifie-t-il le réchauffement aux pôles ?",a:"La glace réfléchit ~80 % du soleil ; l'océan n'en réfléchit que ~6 % — la fonte remplace des surfaces réfléchissantes par des surfaces absorbantes",detail:"Cette boucle de rétroaction positive explique pourquoi l'Arctique se réchauffe 4 fois plus vite que la moyenne mondiale. Plus la banquise fond, plus elle absorbe de chaleur, plus elle fond."},
{theme:"nature",diff:"difficile",type:"d",q:"Concept des neuf processus vitaux à ne pas dépasser pour maintenir les conditions d'habitabilité de la Terre",a:"Les limites planétaires (Rockström, 2009)",detail:"Johan Rockström et ses collègues identifient 9 processus, dont le climat, l'intégrité de la biosphère, les cycles de l'azote et du phosphore et l'acidification des océans. Selon les évaluations les plus récentes (2025), 7 des 9 limites seraient déjà dépassées."},
{theme:"nature",diff:"moyen",type:"q",q:"Combien d'espèces ont été décrites par la science, et combien estime-t-on qu'il en existe ?",a:"~2 millions décrites ; estimations : 8 à 10 millions au total",detail:"Seulement 20-25 % du vivant aurait été catalogué. Les insectes (plus d'1 million d'espèces connues) et les micro-organismes sont les plus nombreux. Les fonds marins et les sols tropicaux restent les plus méconnus."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel aliment fermenté coréen, à base de chou et de piment, est inscrit au patrimoine UNESCO ?",a:"Le kimchi",detail:"Le kimchi est un pilier de la cuisine coréenne, décliné en des centaines de variétés. L'UNESCO a inscrit en 2013 le kimjang, la tradition collective de préparation du kimchi en Corée du Sud, puis en 2015 la tradition nord-coréenne de fabrication du kimchi. Riche en bactéries lactiques, il était autrefois fermenté dans des jarres enterrées."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel pays est à l'origine de la pizza et des pâtes ?",a:"L'Italie",detail:"L'art du pizzaiolo napolitain est inscrit au patrimoine immatériel de l'UNESCO depuis 2017. Paradoxalement, la tomate, ingrédient central, est originaire d'Amérique et n'arrive en Italie qu'au XVIe siècle. Les nouilles existaient aussi en Chine depuis l'Antiquité ; la légende d'un Marco Polo rapportant les pâtes de Chine est fausse."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle épice, plus chère que l'or au kilo, provient des stigmates d'une fleur ?",a:"Le safran (Crocus sativus)",detail:"Il faut 150 000 fleurs et 400 heures de cueillette manuelle pour produire 1 kg de safran (3 000-10 000 €/kg). L'Iran produit 90 % du safran mondial. Il colore la paella, le risotto milanais et de nombreux plats persans."},
{theme:"gastro",diff:"moyen",type:"q",q:"Qu'est-ce que la fermentation lactique, et quels aliments en résultent ?",a:"Transformation de sucres en acide lactique par des bactéries — yaourt, kéfir, fromage, choucroute, kimchi",detail:"La fermentation lactique est l'une des plus anciennes techniques de conservation. Elle acidifie les aliments (pH bas), les préservant des pathogènes, et produit des probiotiques bénéfiques pour le microbiote."},
{theme:"gastro",diff:"difficile",type:"q",q:"Qu'appelle-t-on le « cinquième goût », découvert par un chercheur japonais en 1908 ?",a:"L'umami (goût savoureux/charnu) — découvert par Kikunae Ikeda",detail:"Ikeda isole le glutamate monosodique dans l'algue kombu. L'umami est présent dans le parmesan, la sauce soja, les champignons, les tomates mûres et la viande. Les 4 autres goûts : sucré, salé, acide, amer."},
{theme:"gastro",diff:"difficile",type:"d",q:"Procédé culinaire consistant à cuire des aliments sous vide à basse température pendant de longues heures",a:"La cuisson sous vide",detail:"Inventée par Pralus et Goussault dans les années 1970 en France, cette technique cuit les aliments à 55-85°C dans des sacs hermétiques. Elle préserve les jus, textures et nutriments. Standard en gastronomie contemporaine."},
{theme:"gastro",diff:"moyen",type:"d",q:"Boisson japonaise fermentée à base de riz, pilier de la culture nippone",a:"Le saké",detail:"Fermenté et non distillé, le saké titre généralement entre 14 et 16 % vol. Sa fabrication (polissage du riz, koji, fermentation parallèle multiple) est un art ancestral. Les sakés haut de gamme (junmai daiginjo) se comparent aux grands vins. Le Japon compte plus d'un millier de brasseries de saké."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est le roi des dieux dans la mythologie grecque ?",a:"Zeus (Jupiter chez les Romains)",detail:"Zeus règne sur l'Olympe, maîtrise la foudre et l'ordre cosmique. Fils de Cronos qu'il renverse, il est père de nombreux dieux et héros. Sa contrepartie romaine Jupiter donne son nom à la plus grande planète du système solaire."},
{theme:"mytho",diff:"facile",type:"d",q:"Récit grec du roi condamné aux Enfers à rouler éternellement un rocher jusqu'au sommet d'une colline, d'où il retombe sans cesse",a:"Le mythe de Sisyphe",detail:"Sisyphe, roi légendaire de Corinthe, avait trompé la mort à deux reprises, notamment en enchaînant Thanatos. Camus en fait la métaphore de la condition humaine dans Le Mythe de Sisyphe (1942) : la lutte vers les sommets suffit à remplir un cœur d'homme, et « il faut imaginer Sisyphe heureux »."},
{theme:"mytho",diff:"facile",type:"q",q:"Quel animal sacré est au cœur du culte religieux en Inde hindoue ?",a:"La vache",detail:"Dans l'hindouisme, la vache est symbole de la Terre nourricière, associée à Krishna (gardien de vaches). L'abattage bovin est interdit ou très encadré dans de nombreux États indiens."},
{theme:"mytho",diff:"moyen",type:"q",q:"Dans la mythologie nordique, quel événement marque la fin des dieux et du monde ?",a:"Le Ragnarök",detail:"Le Ragnarök est le crépuscule des dieux : Odin, Thor, Freyr affrontent les géants et les monstres (Fenrir, le Serpent de Midgard). La plupart des dieux périssent, puis un monde nouveau et purifié émerge."},
{theme:"mytho",diff:"moyen",type:"d",q:"Concept hindou désignant la loi universelle, le devoir moral et l'ordre cosmique",a:"Le Dharma",detail:"Dans l'hindouisme et le bouddhisme, le Dharma désigne à la fois l'ordre universel et le devoir individuel. La Bhagavad-Gita tourne autour de ce dilemme : Arjuna doit-il combattre ses proches par dharma ?"},
{theme:"mytho",diff:"moyen",type:"q",q:"Qu'est-ce que le Tao dans le taoïsme ?",a:"Le principe originel indicible qui sous-tend l'univers et auquel il faut s'harmoniser",detail:"Lao Tseu ouvre le Tao Te Ching : « Le Tao qu'on peut nommer n'est pas le Tao éternel. » Le Tao est l'ordre naturel des choses. La sagesse consiste à agir en accord avec lui (wu wei, non-agir)."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qu'est-ce que le karma dans le bouddhisme et l'hindouisme ?",a:"La loi de causalité morale : chaque action engendre des conséquences qui affectent les renaissances futures",detail:"Le karma (« action » en sanskrit) n'est pas un jugement divin mais un mécanisme naturel. L'objectif ultime est de s'en libérer totalement (moksha dans l'hindouisme, nirvana dans le bouddhisme)."},
{theme:"mytho",diff:"difficile",type:"q",q:"Dans la cosmologie aztèque, qu'est-ce que le Cinquième Soleil ?",a:"L'ère actuelle créée à Teotihuacan, maintenue par des sacrifices humains",detail:"Les Aztèques croyaient en 4 ères précédentes détruites par des cataclysmes. Le Cinquième Soleil naquit quand les dieux se sacrifièrent. Pour qu'il continue de mouvoir l'astre, il fallait le nourrir de sang humain."},
{theme:"mytho",diff:"difficile",type:"d",q:"Pratique spirituelle sibérienne dans laquelle un praticien entre en transe pour communiquer avec les esprits",a:"Le chamanisme",detail:"Le mot « chaman » vient de la langue des Evenks (toungouse), en Sibérie. Le chaman sert de médiateur entre les vivants et les esprits, grâce à des états modifiés de conscience (tambour, danse, parfois plantes psychoactives). Certains anthropologues y voient l'une des plus anciennes formes de spiritualité ; le terme est aujourd'hui appliqué, parfois abusivement, à des pratiques du monde entier."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Prométhée dans la mythologie grecque et quelle est sa punition ?",a:"Le titan qui vola le feu aux dieux pour le donner aux hommes — condamné à avoir le foie dévoré chaque jour par un aigle",detail:"Zeus, furieux, enchaîne Prométhée au Caucase. Chaque jour un aigle lui dévore le foie qui repousse chaque nuit. C'est le symbole du bienfaiteur de l'humanité puni pour son défi à l'ordre divin. Héraclès le libérera."},
{theme:"histoire",diff:"facile",type:"q",q:"Qui était Vercingétorix ?",a:"Chef gaulois qui mena la résistance contre César",detail:"Vercingétorix unifia les tribus gauloises et infligea une défaite à César à Gergovie (52 av. J.-C.). Mais la bataille d'Alésia la même année tourne au désastre : encerclé, il se rend à César. Il sera exhibé à Rome puis étranglé après 6 ans de captivité."},
{theme:"histoire",diff:"facile",type:"q",q:"Quel empire Alexandre le Grand a-t-il fondé au IVe siècle av. J.-C. ?",a:"L'empire macédonien, le plus grand du monde antique à son époque",detail:"En 13 ans (336-323 av. J.-C.), Alexandre conquiert la Perse, l'Égypte, la Bactriane et atteint l'Inde. Son empire s'étend de la Grèce à l'Indus. Il meurt à 32 ans à Babylone, probablement d'une fièvre, laissant un empire qui se fragmente aussitôt entre ses généraux (les Diadoques)."},
{theme:"histoire",diff:"facile",type:"q",q:"Quelle civilisation a construit les pyramides de Gizeh ?",a:"Les Égyptiens de l'Ancien Empire (~2560 av. J.-C.)",detail:"La grande pyramide de Khéops est la seule des 7 merveilles du monde antique encore debout. Elle a nécessité environ 20 ans de construction et 2,3 millions de blocs de pierre. Contrairement au mythe, elle fut construite par des ouvriers salariés, non par des esclaves."},
{theme:"histoire",diff:"facile",type:"q",q:"Qui était Jeanne d'Arc ?",a:"Paysanne française qui fit couronner Charles VII et fut brûlée vive en 1431",detail:"À 17 ans, Jeanne affirme recevoir des voix divines lui ordonnant de chasser les Anglais. Elle lève le siège d'Orléans (1429) et conduit Charles VII à Reims pour son sacre. Capturée par les Bourguignons, vendue aux Anglais, elle est brûlée à Rouen à 19 ans. Canonisée en 1920."},
{theme:"histoire",diff:"facile",type:"q",q:"En quelle année Christophe Colomb atteint-il l'Amérique ?",a:"1492",detail:"Le 12 octobre 1492, Colomb aborde une île des Bahamas qu'il nomme San Salvador, croyant avoir atteint l'Asie. Il effectuera 4 voyages sans jamais réaliser qu'il a découvert un nouveau continent. C'est Amerigo Vespucci qui comprendra le premier qu'il s'agit d'une terra incognita."},
{theme:"histoire",diff:"facile",type:"q",q:"Dans quel pays la Révolution industrielle démarre-t-elle au XVIIIe siècle, et quelle invention de James Watt en est le symbole ?",a:"En Angleterre (Grande-Bretagne) ; la machine à vapeur perfectionnée par James Watt (brevet de 1769)",detail:"Partie d'Angleterre vers 1760, la révolution industrielle se diffuse en Europe au XIXe siècle. Watt n'invente pas la machine à vapeur, conçue par Newcomen (1712), mais la rend beaucoup plus efficace grâce au condenseur séparé. Charbon, fer et vapeur remplacent progressivement le travail manuel. Elle crée le prolétariat urbain et les grandes villes industrielles ; l'espérance de vie baisse d'abord dans les villes surpeuplées avant de remonter."},
{theme:"histoire",diff:"facile",type:"q",q:"Quel pharaon est associé au célèbre masque en or découvert dans la Vallée des Rois ?",a:"Toutankhamon",detail:"Pharaon de 1332 à 1323 av. J.-C., mort vers 18-19 ans, Toutankhamon était peu important de son vivant. Mais sa tombe, découverte intacte par Howard Carter en 1922, est la plus complète jamais trouvée : 5 000 objets dont le masque funéraire en or massif de 11 kg."},
{theme:"histoire",diff:"facile",type:"q",q:"Qui a fondé l'Empire romain en devenant son premier empereur ?",a:"Auguste (Octave), en 27 av. J.-C.",detail:"Petit-neveu et fils adoptif de César, Octave bat Marc Antoine et Cléopâtre à Actium (31 av. J.-C.) puis reçoit du Sénat le titre d'Augustus. Il règne 40 ans, inaugurant le Principat. Son règne est une période de paix et de prospérité (Pax Romana) qui durera deux siècles."},
{theme:"histoire",diff:"facile",type:"q",q:"Quel pourcentage de la population européenne la Peste noire emporte-t-elle entre 1347 et 1351 ?",a:"Entre 30 et 50 % environ",detail:"Venue d'Asie centrale, la peste arrive en Europe par les ports siciliens en 1347. En 5 ans, elle tue 25 millions d'Européens. Elle bouleverse la société médiévale : pénurie de main-d'œuvre, fin du servage dans de nombreuses régions, remise en question de l'Église. Elle reviendra par vagues jusqu'au XVIIIe s."},
{theme:"histoire",diff:"facile",type:"q",q:"Quel conquérant mongol fonda le plus grand empire terrestre de l'histoire ?",a:"Gengis Khan (XIIIe siècle)",detail:"Temüjin, futur Gengis Khan (« souverain universel »), unifie les tribus mongoles en 1206 et lance des conquêtes de la Chine du Nord à l'Asie centrale. À sa mort en 1227, l'empire couvre déjà plus de 13 millions de km² ; sous ses successeurs, il dépasse 20 millions de km², ce qui en fait le plus grand empire d'un seul tenant de l'histoire. Son petit-fils Kubilai Khan achève la conquête de la Chine."},
{theme:"histoire",diff:"facile",type:"q",q:"En quelle année se termine la Reconquista avec la prise de Grenade par les Rois Catholiques, l'année même où Colomb découvre l'Amérique ?",a:"En 1492",detail:"Les Maures ont envahi l'Ibérie en 711. La Reconquista commence avec la victoire de Covadonga (722) et s'achève avec la prise de Grenade par Ferdinand et Isabelle — la même année que le voyage de Colomb. Cette guerre de 770 ans forge l'identité espagnole et portugaise."},
{theme:"histoire",diff:"facile",type:"q",q:"Qui était Léonard de Vinci au-delà de son œuvre picturale ?",a:"Ingénieur, anatomiste, inventeur, architecte et scientifique — archétype de l'homme de la Renaissance",detail:"Ses carnets, dont environ 7 000 pages subsistent, montrent des machines volantes, des engins militaires, des pompes hydrauliques et des études anatomiques remarquables, notamment sur les valvules du cœur. Né hors mariage en 1452 à Vinci, il meurt en 1519 au Clos Lucé, près d'Amboise, accueilli par François Ier."},
{theme:"histoire",diff:"facile",type:"q",q:"Quel roi anglais est contraint de signer la Magna Carta en 1215, limitant pour la première fois le pouvoir royal ?",a:"Jean sans Terre",detail:"Les barons révoltés contraignent le roi à sceller la Grande Charte, qui affirme que le roi lui-même est soumis à la loi. Son article 39, qui interdit d'emprisonner un homme libre sans jugement légal, est considéré comme un ancêtre de l'habeas corpus, formalisé par une loi de 1679. Le texte inspire durablement les traditions constitutionnelles anglo-saxonnes."},
{theme:"histoire",diff:"facile",type:"q",q:"Quel événement marqua la fin de l'Empire byzantin en 1453 ?",a:"La chute de Constantinople, prise par les Ottomans sous Mehmed II",detail:"Mehmed II assiège Constantinople avec 80 000 hommes et des canons géants. La ville tient 53 jours. L'empereur Constantin XI meurt en combattant. La chute marque la fin de l'Empire romain d'Orient (1 123 ans d'existence) et la fin du Moyen Âge selon certains historiens. Sainte-Sophie devient mosquée."},
{theme:"histoire",diff:"facile",type:"q",q:"Qui était Abraham Lincoln ?",a:"16e président des États-Unis, abolitionniste, assassiné en 1865",detail:"Lincoln est élu en 1860 sur un programme anti-esclavagiste, déclenchant la sécession des États du Sud. Sa victoire dans la Guerre de Sécession (1861-1865) abolit l'esclavage. Il est assassiné par John Wilkes Booth au théâtre Ford le 14 avril 1865, 5 jours après la capitulation confédérée."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quelle relation juridique et militaire fonde le système féodal médiéval, liant un suzerain à ses vassaux contre fidélité et service armé ?",a:"La vassalité : par l'hommage, le vassal s'engage envers son seigneur, qui lui concède un fief",detail:"La pyramide féodale va du roi aux grands seigneurs (ducs, comtes), aux chevaliers, jusqu'aux serfs liés à la terre. Ce système, dominant en Europe du IXe au XIIIe s., fragmente le pouvoir royal. La montée des villes et du commerce le ronge progressivement avant que les États centralisés l'effacent."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quelles sont les causes principales de la chute de l'Empire romain d'Occident en 476 ?",a:"Invasions barbares, crise économique, instabilité politique, armée mercenaire — combinaison de facteurs sur plusieurs siècles",detail:"476 (dépôt de Romulus Augustule par Odoacre) est une date symbolique plus qu'un effondrement soudain. L'Empire s'est lentement érodé : inflation, épidémies, armée composée de Germains peu loyaux, pression des Huns qui poussent les Goths vers l'intérieur. L'Empire d'Orient (Byzance) survit 1 000 ans de plus."},
{theme:"histoire",diff:"moyen",type:"q",q:"En quelle année et dans quelle ville Martin Luther affiche-t-il ses 95 thèses, acte fondateur de la Réforme protestante ?",a:"En 1517, à Wittenberg",detail:"Luther publie ses 95 thèses contre la vente des indulgences ; leur affichage sur la porte de l'église du château, le 31 octobre, relève peut-être de la légende. Avec Zwingli et Calvin, la Réforme fracture l'Église occidentale. Les guerres de religion qui suivent ravagent l'Europe. La Réforme accélère aussi l'alphabétisation grâce aux Bibles en langues vernaculaires."},
{theme:"histoire",diff:"moyen",type:"q",q:"En quelle année le Code civil napoléonien est-il promulgué, et dans combien de pays son influence juridique est-elle encore perceptible aujourd'hui ?",a:"En 1804 ; il a influencé le droit de dizaines de pays en Europe, en Amérique latine, en Afrique et au Moyen-Orient",detail:"Napoléon unifie le droit français chaotique (plus de 300 coutumes locales) en un code cohérent : égalité devant la loi, propriété privée, liberté contractuelle, laïcité de l'état civil. Exporté dans l'Europe napoléonienne, il influence encore le droit de la Louisiane, du Québec, de l'Amérique latine et du Maghreb."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel diplomate autrichien dirige le Congrès de Vienne et incarne le principe de légitimité et d'équilibre européen après Napoléon ?",a:"Klemens von Metternich",detail:"Le congrès de Vienne (1814-1815), animé par Metternich (Autriche), Talleyrand (France), Castlereagh (Royaume-Uni), le tsar Alexandre Ier et la Prusse, redessine la carte de l'Europe après Napoléon. Il restaure les monarchies au nom de la légitimité et organise un équilibre des puissances qui évite une guerre générale jusqu'en 1914. La France, vaincue, s'en tire remarquablement bien."},
{theme:"histoire",diff:"moyen",type:"q",q:"Combien de semaines dure la Commune de Paris en 1871 avant d'être écrasée lors de la 'Semaine sanglante' ?",a:"Environ dix semaines (72 jours, du 18 mars au 28 mai 1871)",detail:"Après la défaite face à la Prusse, Paris se soulève contre le gouvernement installé à Versailles. La Commune adopte la séparation de l'Église et de l'État, l'école laïque et gratuite, la limitation des salaires des élus. La « Semaine sanglante » (21-28 mai) fait entre quelques milliers et 20 000 morts selon les estimations, les historiens récents retenant plutôt le bas de la fourchette. Marx y voit la première révolution prolétarienne."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quelles sont les causes de la Révolution russe de 1917 ?",a:"Défaites militaires catastrophiques, famine, incompétence du tsar Nicolas II, agitation révolutionnaire — en deux vagues : février (chute du tsar) et octobre (prise du pouvoir par les bolcheviks)",detail:"La Russie perd 1,7 million de soldats en 1914-1917. La révolution de Février renverse le tsar et installe un gouvernement provisoire qui continue la guerre. Les bolcheviks de Lénine promettent « la paix, la terre, le pain » et s'emparent du pouvoir en octobre, ouvrant la voie à la guerre civile et à l'URSS."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel montant le Plan Marshall injecte-t-il dans l'économie européenne entre 1948 et 1952, et quel secrétaire d'État américain lui donne son nom ?",a:"Environ 13 milliards de dollars ; George Marshall",detail:"Proposé par le secrétaire d'État George Marshall en 1947, il conditionne l'aide à la coopération économique entre pays européens — genèse de l'intégration européenne. L'URSS refuse et interdit à ses satellites d'y participer. Il accélère la division de l'Europe et la Guerre froide tout en sauvant les démocraties occidentales."},
{theme:"histoire",diff:"moyen",type:"q",q:"Combien de morts la guerre de Sécession américaine fait-elle, et quelle question de l'esclavage en est la cause principale ?",a:"Environ 620 000 morts (jusqu'à 750 000 selon des estimations récentes) ; le maintien de l'esclavage et son extension aux nouveaux territoires",detail:"Onze États esclavagistes du Sud font sécession après l'élection de Lincoln (1860). La guerre fait plus de morts américains que toutes les autres guerres des États-Unis réunies. La victoire du Nord conduit au 13e amendement (1865), qui abolit l'esclavage. Mais après la Reconstruction, la ségrégation et les lois Jim Crow oppriment les Noirs du Sud pendant près d'un siècle."},
{theme:"histoire",diff:"moyen",type:"q",q:"Qui préside la Conférence de Berlin de 1884-1885 partageant l'Afrique entre puissances européennes sans consulter les populations africaines ?",a:"Otto von Bismarck",detail:"Bismarck convoque 14 nations européennes pour réguler la compétition coloniale. L'Afrique est découpée en ignorant les ethnies et royaumes existants. En 30 ans, 90 % de l'Afrique passe sous contrôle européen. Ces frontières artificielles sont encore celles des États africains aujourd'hui et expliquent nombre de conflits."},
{theme:"histoire",diff:"moyen",type:"q",q:"Combien d'années dure la Révolution culturelle lancée par Mao, et quelle institution — les Gardes rouges — en est l'instrument de terreur ?",a:"Dix ans (1966-1976)",detail:"Mao mobilise la jeunesse (les Gardes rouges) pour détruire les « quatre vieilleries » (culture, idées, habitudes, coutumes). Intellectuels, professeurs et fonctionnaires sont humiliés, déportés, exécutés. Bilan estimé : 0,5 à 2 millions de morts, des millions de déportés. Les universités sont fermées pendant 10 ans."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel traité mit fin à la Première Guerre mondiale pour l'Autriche-Hongrie ?",a:"Le traité de Saint-Germain-en-Laye (1919)",detail:"L'Autriche-Hongrie, empire multiethnique de 52 millions d'habitants, est démantelée en 7 États successeurs : Autriche, Hongrie, Tchécoslovaquie, Yougoslavie, Pologne, Roumanie (en partie), Italie (en partie). L'empire des Habsbourg, vieux de 600 ans, disparaît définitivement."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel acronyme anglais désigne la doctrine de destruction mutuelle assurée, et quel est son effet paradoxal sur la stabilité nucléaire ?",a:"MAD (Mutual Assured Destruction) ; en rendant toute attaque suicidaire, elle rend paradoxalement la guerre nucléaire improbable",detail:"Paradoxe de la guerre froide : la menace d'une destruction totale stabilise les relations entre superpuissances. Au milieu des années 1980, les arsenaux mondiaux dépassent 60 000 têtes nucléaires. L'incident de 1983, où l'officier soviétique Stanislav Petrov identifie à juste titre une fausse alerte, montre la fragilité du système."},
{theme:"histoire",diff:"moyen",type:"q",q:"Qui dirige la révolution haïtienne jusqu'à sa mort en captivité en 1803, permettant à Haïti de devenir la première République noire indépendante ?",a:"Toussaint Louverture, mort en captivité au fort de Joux (Jura) en 1803",detail:"En 1791, les esclaves de Saint-Domingue se soulèvent contre les colons. Toussaint Louverture, puis Jean-Jacques Dessalines, dirigent la lutte ; l'expédition envoyée par Bonaparte est décimée par la fièvre jaune et la résistance. Haïti proclame son indépendance le 1er janvier 1804 : c'est la seule révolte d'esclaves victorieuse de l'histoire. En 1825, la France impose une indemnité de 150 millions de francs (réduite à 90), dont le remboursement pèse sur Haïti jusqu'au milieu du XXe siècle."},
{theme:"histoire",diff:"moyen",type:"q",q:"Qui était Simón Bolívar ?",a:"Libérateur de l'Amérique latine qui émancipa six pays de la domination espagnole",detail:"Entre 1810 et 1826, Bolívar libère le Venezuela, la Colombie, l'Équateur, le Pérou, la Bolivie (nommée en son honneur) et Panama. Il rêve d'une grande confédération latino-américaine — son projet échoue face aux rivalités régionales. Il meurt en 1830, déçu, disant avoir « labouré la mer »."},
{theme:"histoire",diff:"moyen",type:"q",q:"En quel mois de 1944 le Débarquement de Provence a-t-il lieu, et quelle armée française libère ensuite la vallée du Rhône jusqu'à l'Alsace ?",a:"En août 1944 (le 15) ; la 1re armée française du général de Lattre de Tassigny",detail:"Moins connu qu'Overlord, ce débarquement implique 450 000 hommes dont 250 000 Français (armée de De Lattre de Tassigny). Il remonte la vallée du Rhône en 3 semaines, libérant Lyon et rejoignant les armées du nord. Sans lui, la libération de la France aurait pris bien plus longtemps."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quelle est la cause principale de la Fronde de 1648 — dite Fronde parlementaire — opposant le Parlement de Paris à la régente Anne d'Autriche et Mazarin ?",a:"Le refus par le Parlement de Paris de nouveaux impôts et de l'arbitraire fiscal de Mazarin, en pleine guerre contre l'Espagne",detail:"Deux phases : la Fronde parlementaire (1648-1649), où le Parlement de Paris résiste aux impôts royaux, et la Fronde des Princes (1650-1653), où les grands aristocrates (Condé, Conti) s'allient parfois à l'Espagne. L'échec de la Fronde convainc Louis XIV de la nécessité d'un pouvoir absolu et de tenir les nobles à Versailles."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quel empire dual naît du Compromis austro-hongrois de 1867, transformant l'Empire autrichien en une monarchie bicéphale ?",a:"L'Autriche-Hongrie (« double monarchie »)",detail:"Face à la montée des nationalismes et à la défaite contre la Prusse (1866), François-Joseph accepte de partager le pouvoir avec la Hongrie. L'empire devient une monarchie duale : deux États séparés, un seul souverain. Cette construction bancale gère 11 nationalités différentes jusqu'à son implosion en 1918."},
{theme:"histoire",diff:"difficile",type:"q",q:"Lors de quelle opération allemande de l'été 1941 Staline ordonne-t-il la politique de la terre brûlée pour priver l'envahisseur de ressources ?",a:"L'opération Barbarossa, lancée le 22 juin 1941 ; Staline appelle à la terre brûlée dans son discours radiodiffusé du 3 juillet 1941",detail:"L'ordre n°428 (novembre 1941) ordonne de détruire usines, récoltes, ponts, bâtiments dans une bande de 40 à 60 km derrière les lignes. Des partisans sont parachutés pour incendier les villages. Combinée aux atrocités allemandes, cette politique aggrave considérablement les souffrances des civils soviétiques."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quel dirigeant égyptien nationalise le canal de Suez en 1956, déclenchant une intervention militaire franco-britannique condamnée par les États-Unis ?",a:"Gamal Abdel Nasser",detail:"Nasser nationalise le canal en juillet 1956. Israël, la France et le Royaume-Uni attaquent l'Égypte en octobre-novembre. L'opération réussit militairement, mais Eisenhower exerce une forte pression financière (sur la livre sterling) et l'URSS menace. Londres et Paris se retirent. La crise montre que les anciennes puissances coloniales ne peuvent plus agir sans l'aval américain."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quelle est la cause immédiate de la révolte des Cipayes en 1857, liée à l'introduction de nouvelles cartouches enduites de graisse animale ?",a:"Les cartouches du nouveau fusil Enfield, réputées graissées au suif de vache et au saindoux de porc, qu'il fallait déchirer avec les dents",detail:"Le prétexte : les nouvelles cartouches enduites de graisse de vache et de porc, offensant hindous et musulmans. La révolte s'étend à Delhi, Kanpur, Lucknow. Les Britanniques la répriment avec une brutalité extrême. En 1858, la Couronne britannique prend le contrôle direct : fin de la Compagnie des Indes, début du Raj."},
{theme:"histoire",diff:"difficile",type:"q",q:"Dans quelle ville indonésienne et en quelle année se tient la conférence afro-asiatique réunissant 29 pays, qui préfigure le mouvement des non-alignés ?",a:"À Bandung, en 1955",detail:"29 pays d'Asie et d'Afrique (représentant 1,5 milliard d'habitants) se réunissent en Indonésie. Nehru, Nasser, Sukarno, Zhou Enlai définissent une « troisième voie » entre le bloc américain et soviétique. Bandung préfigure la décolonisation et l'émergence du Tiers-Monde comme acteur politique."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quel type de mouvement — militaire ou civil — déclenche la Révolution des Œillets au Portugal le 25 avril 1974, mettant fin à 48 ans de dictature ?",a:"Un coup d'État militaire du Mouvement des forces armées (MFA), aussitôt soutenu par la population",detail:"Épuisés par les guerres coloniales en Afrique, de jeunes officiers renversent l'Estado Novo, fondé par Salazar et dirigé depuis 1968 par Marcelo Caetano, presque sans effusion de sang. Le signal est la diffusion à la radio de la chanson « Grândola, Vila Morena ». Des œillets rouges sont glissés dans les canons des fusils. La révolution ouvre la voie à la décolonisation de l'Angola et du Mozambique et précède les transitions grecque et espagnole."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quelle décision de Nixon en août 1971 met fin au système de Bretton Woods en suspendant la convertibilité du dollar en or ?",a:"La suspension de la convertibilité du dollar en or, annoncée le 15 août 1971 (le « choc Nixon »)",detail:"Négocié en 1944 dans le New Hampshire, le système de Bretton Woods crée le FMI et la Banque mondiale et instaure des parités fixes autour d'un dollar convertible en or. Les déficits américains rendent cette convertibilité intenable. Après la décision de Nixon et l'échec des accords du Smithsonian (1971), le monde passe aux changes flottants en 1973."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quel rôle joua la bataille de Lépante (1571) dans l'histoire méditerranéenne ?",a:"Victoire de la Sainte-Ligue chrétienne sur la flotte ottomane, qui stoppa l'expansion turque en Méditerranée occidentale",detail:"La plus grande bataille navale depuis l'Antiquité : 400 galères, 150 000 hommes. La flotte ottomane est détruite en quelques heures. Cervantes y perd l'usage de sa main gauche. Mais l'importance stratégique est relative : les Ottomans rebâtissent leur flotte en un an. La victoire est surtout un choc psychologique — l'invincibilité ottomane est brisée."},
{theme:"histoire",diff:"difficile",type:"q",q:"Qui publie 'J'Accuse' en 1898, lettre ouverte défendant Dreyfus et déclenchant une crise politique majeure en France ?",a:"Émile Zola, dans le journal L'Aurore, le 13 janvier 1898",detail:"Le capitaine Alfred Dreyfus, officier juif, est condamné en 1894 pour espionnage au profit de l'Allemagne, sur la base de faux. La lettre de Zola au président Félix Faure déchaîne la société française entre dreyfusards et antidreyfusards et révèle l'antisémitisme d'une partie de l'armée et de l'opinion. Dreyfus est réhabilité en 1906. L'affaire nourrit le combat républicain qui aboutit à la loi de 1905 et aurait influencé Theodor Herzl."},
{theme:"histoire",diff:"difficile",type:"q",q:"En quelle année Staline dissout-il le Komintern, et pour quelle raison diplomatique liée à la Seconde Guerre mondiale ?",a:"En 1943 ; pour rassurer ses alliés occidentaux sur l'abandon de la révolution mondiale",detail:"Le Komintern (IIIe Internationale) subordonne les partis communistes du monde entier à Moscou. Il finance des révolutions, forme des agents et définit la « ligne » que tous doivent suivre. Dissous par Staline en 1943 pour rassurer ses alliés occidentaux, il est remplacé par le Kominform en 1947."},
{theme:"histoire",diff:"difficile",type:"q",q:"Combien de soldats allemands se rendent à Stalingrad en février 1943, et quel général est fait prisonnier par les Soviétiques ?",a:"Environ 91 000 soldats ; le maréchal Friedrich Paulus",detail:"Hitler veut prendre la ville qui porte le nom de Staline, verrou de la Volga sur la route du pétrole du Caucase. La 6e armée de Paulus est encerclée par l'opération soviétique Uranus (novembre 1942) et capitule le 2 février 1943. Seuls quelques milliers de prisonniers reviendront d'URSS. Avec près de deux millions de tués, blessés et prisonniers dans les deux camps, c'est l'une des batailles les plus meurtrières de l'histoire."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quelle loi américaine de 1964 met fin à la ségrégation raciale légale, résultat direct du mouvement des droits civiques ?",a:"Le Civil Rights Act (1964)",detail:"Rosa Parks refuse de céder sa place dans un bus (1955), puis viennent les sit-ins de Greensboro (1960), la marche sur Washington (« I have a dream », 1963) et les marches de Selma (1965). Le Civil Rights Act interdit la ségrégation dans les lieux publics et les discriminations à l'emploi ; le Voting Rights Act (1965) protège le droit de vote. Martin Luther King est assassiné en 1968."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quels territoires Israël conquiert-il lors de la guerre des Six Jours de juin 1967, occupations qui structurent encore le conflit israélo-palestinien ?",a:"Le Sinaï et la bande de Gaza (pris à l'Égypte), la Cisjordanie et Jérusalem-Est (pris à la Jordanie), le plateau du Golan (pris à la Syrie)",detail:"Israël lance une attaque préventive le 5 juin 1967 et détruit l'aviation égyptienne au sol. En six jours, il triple la superficie sous son contrôle. Le Sinaï est restitué à l'Égypte après les accords de Camp David (1978-1982). La résolution 242 de l'ONU (« la paix contre les territoires ») reste un cadre de référence pour les négociations."},
{theme:"histoire",diff:"difficile",type:"q",q:"Combien d'Arméniens sont massacrés lors du génocide de 1915-1916, et quel empire est responsable de cette extermination ?",a:"Entre 600 000 et 1,5 million selon les estimations (souvent environ 1,2 million) ; l'Empire ottoman, sous le gouvernement Jeunes-Turcs",detail:"Les Arméniens, accusés de sympathie pour la Russie ennemie, sont déportés et massacrés à partir d'avril 1915 ; les colonnes de déportés meurent de faim, de soif et d'exécutions dans les déserts de Syrie. La Turquie refuse toujours le terme de génocide, reconnu par de nombreux États. Le juriste Raphael Lemkin s'appuie notamment sur ce cas pour forger le mot « génocide » en 1944."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quelle puissance coloniale est vaincue à Dien Bien Phu en mai 1954, et quelle conférence internationale met ensuite fin à la guerre d'Indochine ?",a:"La France ; la conférence de Genève (juillet 1954)",detail:"Le général Giáp encercle et détruit le camp retranché en 57 jours ; environ 11 000 soldats de l'Union française sont faits prisonniers. La défaite précipite l'arrivée de Pierre Mendès France au pouvoir et la signature des accords de Genève, qui partagent provisoirement le Viêt Nam au 17e parallèle, prélude à la guerre américaine."},
{theme:"histoire",diff:"facile",type:"q",q:"Quelle famille florentine finance la Renaissance italienne au XVe siècle, faisant de Florence le centre culturel de l'Europe ?",a:"Les Médicis",detail:"Née à Florence sous les Médicis, la Renaissance produit Léonard, Michel-Ange, Raphaël, Botticelli. Elle remet l'homme au centre (humanisme) contre le théocentrisme médiéval. L'imprimerie de Gutenberg (1450) diffuse ces idées. Elle se propage en Europe du Nord avec Érasme, Shakespeare, Rabelais."},
{theme:"histoire",diff:"facile",type:"q",q:"Qui était Cléopâtre VII et pourquoi est-elle célèbre ?",a:"Dernière reine d'Égypte, alliée de César puis d'Antoine, symbole du déclin de l'Égypte ptolémaïque",detail:"Cléopâtre VII (69-30 av. J.-C.) est la première de sa dynastie à parler égyptien. Elle séduit César pour consolider son trône, puis s'allie à Marc Antoine contre Octave. Vaincus à Actium (31 av. J.-C.), elle se suicide plutôt que d'être exhibée à Rome. L'Égypte devient province romaine."},
{theme:"histoire",diff:"facile",type:"q",q:"Qui est le principal rédacteur de la Déclaration d'indépendance américaine du 4 juillet 1776 ?",a:"Thomas Jefferson",detail:"Rédigée principalement par Thomas Jefferson, elle proclame : « Tous les hommes sont créés égaux. » Elle est adoptée le 4 juillet 1776 — date de la fête nationale américaine. Ses principes (droits naturels, souveraineté populaire) inspirent la Révolution française et toutes les constitutions libérales."},
{theme:"histoire",diff:"facile",type:"q",q:"Quelle capitale l'Empire ottoman conquiert-il en 1453, mettant fin à l'Empire byzantin et marquant la fin du Moyen Âge pour de nombreux historiens ?",a:"Constantinople",detail:"Fondé vers 1299, l'Empire ottoman fait de Constantinople sa capitale. À son apogée, sous Soliman le Magnifique (XVIe siècle), il contrôle l'Anatolie, les Balkans, le Moyen-Orient et l'Afrique du Nord. Son démembrement après la Première Guerre mondiale (traités de Sèvres, puis de Lausanne en 1923) façonne le Moyen-Orient actuel. Le sultanat est aboli en 1922."},
{theme:"histoire",diff:"facile",type:"q",q:"Qui était Mahatma Gandhi ?",a:"Leader du mouvement d'indépendance indien, fondateur de la désobéissance civile non-violente",detail:"Gandhi (1869-1948) oppose la résistance non-violente (satyagraha) à l'Empire britannique. Sa Marche du sel (1930) — 388 km à pied pour contester le monopole britannique — est une masterclass de désobéissance civile. L'Inde obtient son indépendance en 1947. Gandhi est assassiné par un nationaliste hindou en janvier 1948."},
{theme:"histoire",diff:"facile",type:"q",q:"Quel est le rôle des Croisades dans l'histoire médiévale ?",a:"Guerres saintes lancées par la papauté entre 1095 et 1291 pour reprendre Jérusalem aux musulmans",detail:"Les historiens comptent traditionnellement huit croisades principales. La première prend Jérusalem en 1099, dans un bain de sang. La quatrième (1204) est détournée sur Constantinople, ville chrétienne, qui est pillée. Les croisades stimulent les échanges en Méditerranée et s'accompagnent, en Europe, de violentes persécutions antijuives."},
{theme:"histoire",diff:"facile",type:"q",q:"En quelle année l'apartheid est-il officiellement démantelé en Afrique du Sud, et quelle élection multiraciale s'ensuit en 1994 ?",a:"Entre 1990 et 1991 (abrogation des dernières grandes lois en juin 1991) ; les premières élections multiraciales ont lieu le 27 avril 1994",detail:"L'apartheid (« séparation » en afrikaans) classe les habitants en Blancs, Noirs, Coloureds et Indiens avec des droits radicalement différents. Nelson Mandela est emprisonné 27 ans pour avoir combattu ce système. Il est libéré en 1990, élu président en 1994. L'Afrique du Sud négocie sa transition sans guerre civile — un miracle fragile."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quelle puissance coloniale mène la seconde guerre des Boers (1899-1902) contre les républiques afrikaners du Transvaal et de l'État libre d'Orange ?",a:"Le Royaume-Uni",detail:"Les Britanniques internent les civils boers et africains dans des camps de concentration, où meurent environ 26 000 femmes et enfants boers et au moins 20 000 Africains noirs. Les Espagnols avaient déjà pratiqué la « reconcentración » à Cuba (1896). Les Boers capitulent en 1902 mais obtiennent une large autonomie ; l'Union sud-africaine naît en 1910. L'enjeu est notamment le contrôle des mines d'or du Witwatersrand."},
{theme:"histoire",diff:"moyen",type:"q",q:"Dans quel discours de 1947 le président Truman annonce-t-il son aide à la Grèce et à la Turquie contre le communisme, fondant la doctrine qui porte son nom ?",a:"Dans son discours devant le Congrès du 12 mars 1947",detail:"Truman demande au Congrès 400 millions de dollars pour la Grèce et la Turquie menacées. Il formule la doctrine : les États-Unis défendront partout la liberté contre la tyrannie. Cette doctrine justifiera l'intervention en Corée, au Viêt Nam, en Amérique latine — et définit la politique étrangère américaine jusqu'à la chute de l'URSS."},
{theme:"histoire",diff:"moyen",type:"q",q:"En quelle année Lénine lance-t-il la NEP, et pourquoi cette retraite tactique vers une économie mixte est-elle nécessaire après la guerre civile ?",a:"En 1921 ; l'économie, ruinée par la guerre civile et le « communisme de guerre », est au bord de l'effondrement, et la révolte de Kronstadt menace le régime",detail:"La NEP autorise le commerce privé et les paysans à vendre leurs surplus. Elle sauve l'URSS de la famine. Lénine la présente comme « un pas en arrière pour mieux avancer ». Staline l'abandonne en 1928 pour la collectivisation forcée. La NEP est aujourd'hui citée par les réformateurs chinois comme modèle."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel traité de 1494 partage le monde entre l'Espagne et le Portugal, et quelle autorité religieuse en est le médiateur ?",a:"Le traité de Tordesillas ; la papauté (bulles d'Alexandre VI en 1493), même si le traité est négocié directement entre les deux couronnes",detail:"Le pape avait tracé une première ligne à 100 lieues à l'ouest des Açores et du Cap-Vert ; le traité la repousse à 370 lieues. Les terres à l'ouest reviennent à l'Espagne, celles à l'est au Portugal, ce qui explique que le Brésil soit lusophone. Ce partage ignore totalement les peuples qui habitent ces territoires."},
{theme:"histoire",diff:"moyen",type:"q",q:"Qui était Ibn Battuta et pourquoi est-il remarquable ?",a:"Voyageur et géographe marocain du XIVe s. qui parcourut 120 000 km en 30 ans — plus que Marco Polo",detail:"Ibn Battuta (1304-1368/69) visite 44 pays actuels : Afrique du Nord, Moyen-Orient, Inde, Chine, Mali, Russie. Son récit (la Rihla) décrit en détail les sociétés, cours et coutumes. Alors que Marco Polo est célébré en Occident, Ibn Battuta reste méconnu — le voyageur le plus prolifique de l'histoire prémoderne."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel slogan résume l'ambition de la Révolution Meiji au Japon, cherchant à moderniser le pays tout en préservant ses valeurs nationales ?",a:"« Fukoku kyōhei » (« pays riche, armée forte »)",detail:"L'ère Meiji (1868-1912) abolit le système féodal et les privilèges des samouraïs, adopte une constitution (1889), crée une armée de conscription et industrialise le pays avec l'aide d'experts occidentaux. Une autre formule, « wakon yōsai » (« esprit japonais, technique occidentale »), résume cet équilibre. En 1905, le Japon bat la Russie, première victoire moderne d'un pays asiatique sur une puissance européenne."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quelle distance l'Armée rouge chinoise parcourt-elle lors de la Longue Marche de 1934-1935, et combien de soldats en reviennent vivants ?",a:"Environ 10 000 à 12 000 km ; sur quelque 86 000 partants, seuls quelques milliers (environ 8 000) arrivent au Shaanxi",detail:"L'Armée rouge quitte le Jiangxi en octobre 1934 pour échapper aux nationalistes de Tchang Kaï-chek et arrive un an plus tard au Shaanxi. Catastrophe militaire transformée en épopée fondatrice, la Longue Marche forge la légitimité de Mao, qui prend l'ascendant sur le Parti lors de la conférence de Zunyi (1935). Elle reste un mythe fondateur de la République populaire."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quel empire impose au XIIIe siècle la Pax Mongolica sur la route de la soie, reliant la Chine à l'Europe ?",a:"L'Empire mongol (Pax Mongolica)",detail:"Sous la Pax Mongolica, des marchands, diplomates et missionnaires traversent l'Asie en sécurité relative. Marco Polo en bénéficie. Les transferts de technologie (papier, imprimerie, poudre à canon) s'accélèrent vers l'Europe. Mais les Mongols transmettent aussi la Peste Noire depuis l'Asie centrale."},
{theme:"histoire",diff:"difficile",type:"q",q:"Par quel compromis de 1820 le Congrès américain tente-t-il de maintenir l'équilibre entre États esclavagistes et États libres ?",a:"Le compromis du Missouri : le Missouri entre dans l'Union comme État esclavagiste et le Maine comme État libre, l'esclavage étant interdit au nord du parallèle 36°30'",detail:"Ce compromis repousse la guerre civile de 40 ans mais illustre l'impossibilité de maintenir indéfiniment l'union entre Nord et Sud. Son abrogation par le Kansas-Nebraska Act (1854) rouvre la question et précipite la guerre civile. Lincoln dira que cette question ne peut se résoudre que par les armes."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quel historien grec, lui-même général athénien, rédige le récit de la Guerre du Péloponnèse (431-404 av. J.-C.) ?",a:"Thucydide",detail:"Exilé après un échec militaire, Thucydide écrit une histoire de la guerre entre Athènes et Sparte qui cherche des causes rationnelles, notamment la crainte que la puissance athénienne inspire à Sparte. Athènes est affaiblie par la peste (430), le désastre de l'expédition de Sicile (415-413) et les revirements d'Alcibiade. Sparte l'emporte en 404 mais sort épuisée ; c'est la Macédoine qui dominera la Grèce au siècle suivant."},
{theme:"histoire",diff:"difficile",type:"q",q:"Combien de victimes le régime de Pol Pot fait-il au Cambodge entre 1975 et 1979, sur une population d'environ 8 millions ?",a:"Entre 1,5 et 2 millions de morts, soit environ un quart de la population",detail:"Pol Pot proclame l'« an zéro » : les villes sont vidées, la monnaie abolie, les citadins envoyés aux champs, les intellectuels exécutés ; porter des lunettes peut suffire à être suspect. Les charniers sont découverts après l'invasion vietnamienne de 1979. Un tribunal parrainé par l'ONU condamne les derniers dirigeants pour génocide en 2018, verdict confirmé en appel en 2022."},
