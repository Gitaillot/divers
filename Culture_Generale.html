{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Saturne dans la mythologie romaine et pourquoi son règne est-il considéré comme un âge d'or ?",a:"Dieu romain de l'agriculture et du temps (assimilé au Cronos grec) — son règne mythique est une ère d'abondance et d'égalité sans travail forcé",detail:"Selon la légende, Saturne règne sur le Latium à une époque où la terre produit d'elle-même, sans travail ni inégalités. Les Saturnales, célébrées à partir du 17 décembre, commémorent cet âge d'or : les hiérarchies sont inversées, les maîtres servent leurs esclaves, on échange des cadeaux. Certaines traditions de Noël en auraient hérité."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qu'est-ce que les Mystères d'Éleusis et pourquoi leur secret fut-il si bien gardé pendant plus de deux millénaires ?",a:"Rites d'initiation célébrés à Éleusis (Attique) en l'honneur de Déméter et Perséphone — les initiés juraient le silence sous peine de mort",detail:"Les Mystères d'Éleusis (XIVe s. av. J.-C. - 396 ap. J.-C.) promettaient aux initiés une vision de l'au-delà et un sort privilégié après la mort. Des milliers d'Athéniens, puis de Romains (Cicéron, Marc Aurèle) s'y faisaient initier. Leur secret est si bien gardé qu'on ne sait toujours pas ce qui se passait lors de la nuit centrale. Certains chercheurs suggèrent une boisson psychédélique (kykeon)."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Eshu (ou Elegba) dans la mythologie yoruba et quel rôle joue-t-il comme messager entre les hommes et les orishas ?",a:"Eshu-Elegba est le dieu yoruba des carrefours, de la communication et du destin — gardien des frontières entre le monde humain et divin",detail:"Eshu est le premier des orishas à recevoir les prières, car sans lui les messages n'atteignent pas les dieux. Il est représenté comme un enfant ou un vieillard, parfois phallique. Imprévisible, il peut aider ou nuire. En diaspora, il devient Exú (Candomblé), Legba (Vodou haïtien) et Eleggua (Santería). Son équivalent syncrétique catholique est souvent Saint Pierre."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Viracocha dans la mythologie andine et comment crée-t-il le monde et les humains avant de disparaître sur l'océan ?",a:"Viracocha est le dieu créateur suprême des Incas — il crée le monde, le soleil, la lune et les humains à Tiahuanaco, puis part vers l'ouest sur l'océan Pacifique",detail:"Viracocha ('mousse de la mer') émerge du lac Titicaca. Il crée d'abord une humanité de pierre (insatisfaisante), puis des géants (détruits par un déluge). Il crée enfin les humains actuels à Tiahuanaco. Il parcourt le monde en mendiant pour enseigner les arts civilisateurs, puis s'en va en marchant sur l'eau vers le Pacifique, promettant de revenir."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Hermès dans la mythologie grecque et quels rôles multiples exerce-t-il auprès des dieux et des hommes ?",a:"Messager des dieux, guide des âmes (psychopompe), dieu des voyageurs, commerçants et voleurs — il est aussi l'inventeur de la lyre",detail:"Hermès (Mercure chez les Romains) naît le matin, vole les bœufs d'Apollon le midi, fabrique la lyre avec une carapace de tortue le soir. Son attribut est le caducée (bâton entouré de deux serpents). Il est le seul dieu à circuler librement entre l'Olympe, la Terre et les Enfers."},
{theme:"mytho",diff:"facile",type:"q",q:"Quels géants aux cent bras et aux cinquante têtes aident Zeus à vaincre les Titans et à les enfermer dans le Tartare ?",a:"Les Hécatonchires (Cottus, Briarée et Gygès) — géants à cent bras et cinquante têtes, alliés de Zeus contre les Titans",detail:"La Titanomachie (guerre des Titans) dure dix ans. Zeus libère les Hécatonchires emprisonnés par Cronos. Ils peuvent lancer cent rochers à la fois. Leur aide est décisive. Les Titans vaincus sont précipités dans le Tartare, abîme en dessous des Enfers. Cette victoire permet à Zeus d'établir l'ordre olympien."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Déméter dans la mythologie grecque et comment son deuil pour Perséphone explique-t-il les saisons ?",a:"Déesse de l'agriculture — chaque fois que sa fille Perséphone séjourne aux Enfers (6 mois), Déméter laisse la terre stérile : c'est l'hiver",detail:"Hadès enlève Perséphone. Déméter, inconsolable, abandonne ses fonctions et la terre devient stérile. Zeus intervient : Perséphone partagera son temps entre Hadès (hiver, printemps) et Déméter (été, automne). Le mythe explique les saisons et fonde les Mystères d'Éleusis, rites initiatiques promettant la vie après la mort."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quelle créature mi-homme mi-taureau, enfermée dans le Labyrinthe de Crète, est tuée par Thésée ?",a:"Le Minotaure — monstre né de l'union contre-nature de Pasiphaé et d'un taureau blanc, se nourrissant de jeunes Athéniens",detail:"Athènes doit envoyer en tribut sept jeunes hommes et sept jeunes filles, chaque année ou tous les neuf ans selon les versions. Thésée se porte volontaire ; grâce au fil que lui donne Ariane, fille de Minos, il tue le Minotaure et ressort du Labyrinthe. Au retour, il oublie de remplacer ses voiles noires par des voiles blanches, et son père Égée, croyant à sa mort, se jette dans la mer qui porte depuis son nom."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Jason dans la mythologie grecque et quelle expédition mène-t-il avec ses Argonautes pour récupérer la Toison d'Or ?",a:"Jason et les Argonautes partent en Colchide (Géorgie actuelle) chercher la Toison d'Or — avec l'aide de la magicienne Médée, fille du roi",detail:"La Toison d'Or (bélier ailé) est gardée par un dragon en Colchide. Médée tombe amoureuse de Jason, l'aide à accomplir les épreuves impossibles (taureaux crachant le feu, guerriers nés de dents de dragon, dragon) et fuit avec lui. La trahison ultérieure de Jason la poussera à tuer leurs propres enfants — sujet de la Médée d'Euripide."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Dionysos dans la mythologie grecque et pourquoi son culte est-il à l'origine du théâtre grec ?",a:"Dieu du vin, de l'extase et du théâtre — ses fêtes (Dionysies) incluaient des chœurs (dithyrambes) dont émergent la tragédie et la comédie grecques",detail:"Dionysos (Bacchus chez les Romains) est « né deux fois » : sa mère Sémélé ayant été foudroyée, Zeus coud l'enfant dans sa cuisse jusqu'à terme. Son cortège (thiase) de ménades et de satyres répand l'extase. Les Grandes Dionysies d'Athènes sont le cadre des concours où Eschyle, Sophocle et Euripide font jouer leurs tragédies : le théâtre naît du rite."},
{theme:"mytho",diff:"facile",type:"q",q:"Qui est Aphrodite dans la mythologie grecque et de quelle manière naît-elle de la mer selon Hésiode ?",a:"Déesse de l'amour et de la beauté — elle émerge de l'écume marine née du sang d'Ouranos castré par Cronos",detail:"Cronos tranche le sexe de son père Ouranos et le jette dans la mer. De l'écume (aphros) naît Aphrodite, poussée sur un coquillage jusqu'à Chypre (son île sainte). Vénus chez les Romains, elle est mère d'Éros (Cupidon). Le tableau de Botticelli (La Naissance de Vénus, 1485) immortalise cette scène."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quel être hybride de la mythologie grecque, moitié humain moitié cheval, est réputé sage et enseigne la médecine, la musique et les arts de la guerre — contrairement aux autres centaures violents ?",a:"Chiron — centaure fils de Cronos, précepteur d'Achille, d'Asclépios et de nombreux héros grecs",detail:"Contrairement aux centaures ivrognes (comme ceux du mariage de Pirithoos), Chiron est sage, juste et instruit. Il enseigne à Achille la musique, la médecine et les arts martiaux. Il forme aussi Asclépios (dieu de la médecine), Hercule et Jason. Blessé accidentellement par une flèche empoisonnée d'Hercule, immortel mais en souffrance permanente, il choisit de mourir."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Héphaïstos dans la mythologie grecque, quel handicap partage-t-il avec d'autres dieux ou héros forgerons, et que fabrique-t-il de plus remarquable ?",a:"Dieu forgeron boiteux — il forge l'armure d'Achille, le char du Soleil, les automates d'or (servantes), et les chaînes qui retiennent Arès et Aphrodite en flagrant délit",detail:"Héphaïstos (Vulcain chez les Romains) est boiteux : jeté de l'Olympe par Zeus ou par Héra selon les versions, ou né infirme. On retrouve cette infirmité chez d'autres forgerons mythiques, comme Wieland (Völundr) dans la tradition germanique ; on l'a parfois rapprochée des maux liés au travail des métaux. Ses servantes automates en or préfigurent la robotique."},
{theme:"mytho",diff:"moyen",type:"q",q:"Quel animal sacré est le vahana (monture) de Vishnu, de Shiva et de Ganesh dans la mythologie hindoue ?",a:"Garuda (aigle géant, monture de Vishnu), Nandi (taureau blanc, monture de Shiva) et Moushika (souris ou rat, monture de Ganesh)",detail:"Les vahanas ('véhicules') sont indissociables des dieux hindous. Garuda est un demi-aigle demi-homme, ennemi des serpents-nagas. Nandi le taureau garde l'entrée des temples de Shiva. La souris de Ganesh symbolise la capacité à pénétrer partout et à surmonter les obstacles. Chaque vahana incarne un aspect de la divinité qu'il porte."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Hanuman dans la mythologie hindoue et pourquoi est-il considéré comme le dévot parfait et le héros par excellence ?",a:"Dieu-singe fils du dieu du vent, lieutenant de Rama dans le Ramayana — sa loyauté absolue et ses pouvoirs illimités en font l'idéal du bhakti (dévotion)",detail:"Hanuman peut voler, changer de taille, soulever des montagnes et est invulnérable. Il retrouve Sita à Lanka, brûle la moitié de la ville avec sa queue enflammée, rapporte une montagne entière d'herbes médicinales pour soigner Lakshmana. Quand Rama lui demande ce qu'il est, il répond : 'Je suis ton serviteur.' Son culte est l'un des plus populaires en Inde aujourd'hui."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quelle épopée finnoise du XIXe siècle, compilée par Elias Lönnrot, réunit la mythologie et la tradition orale finnoise autour du héros Väinämöinen ?",a:"Le Kalevala (1835-1849) — épopée nationale finnoise qui inspirera Tolkien pour ses Elfes et leur langue, et Sibelius pour sa musique",detail:"Elias Lönnrot recueille des chants épiques (runot) en Carélie et les assemble en une épopée de 50 chants (édition définitive de 1849). Väinämöinen, vieux sage chamane, joue du kantele. Tolkien, fasciné par le finnois, s'en inspire pour le quenya, langue des Elfes, et pour l'histoire de Túrin. Sibelius tire du Kalevala sa symphonie Kullervo (1892) et sa Suite de Lemminkäinen."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Izanami dans la mythologie japonaise après sa mort et comment sa décomposition révèle-t-elle la nature de la mort dans le shinto ?",a:"Izanami devient souveraine de Yomi (monde des morts) — quand Izanagi la voit en décomposition et fuit, elle lance des démons à sa poursuite",detail:"Izanagi descend à Yomi pour retrouver Izanami, morte en enfantant le feu. Elle lui demande de ne pas la regarder. Il désobéit et voit son corps pourri grouillant de vers et de démons. Il fuit en roulant un rocher sur l'entrée de Yomi. Izanami crie : 'Je tuerai 1000 de tes sujets par jour.' Il répond : 'J'en créerai 1500.' — mythe de l'équilibre vie/mort."},
{theme:"mytho",diff:"difficile",type:"q",q:"Qui est Oya dans la mythologie yoruba et quel pouvoir sur les éléments et la mort lui est attribué ?",a:"Oya est l'orisha des tempêtes, des tornades, des éclairs et de la frontière avec la mort — elle règne sur les cimetières et les transformations",detail:"Oya ('elle déchire') est l'épouse d'Ogun puis de Shango. Elle commande les vents violents, les tornades et les éclairs. En tant que gardienne des cimetières, elle règne sur la frontière entre vie et mort. En diaspora : Iansã (Candomblé), Oyá (Santería). Son équivalent syncrétique catholique est Notre-Dame de la Candelaria ou Sainte Thérèse."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Coyote dans les mythologies des peuples amérindiens des Plaines et du Grand Bassin, et quel rôle de trickster joue-t-il ?",a:"Coyote est le trickeur (filou divin) de nombreuses nations amérindiennes — créateur chaotique, voleur du feu, farceur dont les erreurs font autant que ses succès",detail:"Comme Loki nordique ou Anansi africain, Coyote représente le chaos créateur. Selon les tribus (Navajo, Ute, Nez-Percé), il vole le feu pour les hommes, crée la mort en projetant un bâton dans les étoiles, ou libère les animaux d'une montagne sacrée. Ses ruses tournent souvent contre lui — mais ses erreurs créent le monde tel qu'il est."},
{theme:"mytho",diff:"facile",type:"q",q:"Quel fruit, goûté aux Enfers, oblige Perséphone à y retourner chaque année ?",a:"La grenade",detail:"Hadès enlève Perséphone, fille de Déméter et de Zeus, pendant qu'elle cueille des fleurs. Avant de la laisser repartir, il lui fait manger des graines de grenade (une seule dans l'Hymne homérique à Déméter, plusieurs chez d'autres auteurs) : quiconque a goûté la nourriture des morts doit y revenir. Elle passe donc une partie de l'année aux Enfers, période où Déméter, en deuil, laisse la terre stérile."},
{theme:"mytho",diff:"moyen",type:"q",q:"Qui est Indra dans la mythologie védique et comment son combat contre le dragon Vritra structure-t-il la cosmologie indo-européenne ?",a:"Indra est le roi des dieux védiques, dieu de l'orage — il tue le serpent/dragon Vritra qui retenait les eaux et permet les pluies fertilisantes",detail:"Indra (équivalent de Zeus/Thor) arme son foudre de la colonne vertébrale du sage Dadhichi et s'en sert pour pourfendre Vritra. Ce combat (dieu de l'orage contre serpent des eaux) est un mythe pan-indo-européen : Marduk contre Tiamat (Babylone), Zeus contre Typhon (Grèce), Thor contre Jörmungandr (Nordique). Il symbolise la victoire de l'ordre sur le chaos, de la pluie sur la sécheresse."},
{theme:"mytho",diff:"difficile",type:"q",q:"Quel mythe de création mesopotamien raconte comment Marduk tue la déesse-dragon Tiamat et crée le monde avec son corps ?",a:"L'Enuma Elish (« Lorsqu'en haut »), épopée babylonienne de la création, mise par écrit vers la fin du IIe millénaire av. J.-C. — Marduk fend le corps de Tiamat : une moitié forme le ciel, l'autre la terre",detail:"Tiamat (l'océan salé primordial) et Apsu (eau douce) engendrent les dieux. Ces derniers troublent leur repos. Apsu veut les tuer ; les dieux le tuent d'abord. Tiamat se venge. Marduk accepte de la combattre si les dieux lui accordent la suprématie. Il la pourfend : une moitié = ciel, l'autre = terre. De son lieutenant Kingu naissent les humains, créés pour servir les dieux."},
{theme:"mytho",focus:"allemagne",diff:"moyen",type:"q",q:"Qui sont les Nibelungen, et quelle est leur légende ?",a:"Peuple mythique nordique-germanique gardien d'un trésor maudit — tué par Siegfried, convoité par les dieux et les hommes",detail:"Dans le Nibelungenlied (« Chant des Nibelungen », vers 1200), le nom désigne d'abord les détenteurs d'un trésor fabuleux, puis les Burgondes qui s'en emparent. Siegfried conquiert ce trésor, épouse Kriemhild ; trahi et assassiné, il est vengé dans un bain de sang à la cour d'Attila (Etzel). Wagner en tire L'Anneau du Nibelung en s'appuyant aussi sur les sources nordiques. L'œuvre est l'épopée nationale allemande."},
{theme:"mytho",focus:"allemagne",diff:"moyen",type:"q",q:"Quels sont les principaux dieux du panthéon germanique et nordique, et lesquels ont donné leur nom à des jours de la semaine ?",a:"Tyr (mardi : Tuesday), Odin/Wotan (mercredi : Wednesday), Thor (jeudi : Thursday, Donnerstag) et Frigg ou Freyja (vendredi : Friday, Freitag)",detail:"Le panthéon germano-nordique distingue les Ases (Odin, Thor, Tyr, Frigg) et les Vanes (Njörd, Freyr, Freyja). Les Germains ont adapté les noms des jours romains en remplaçant Mars, Mercure, Jupiter et Vénus par leurs propres dieux : Tiw, Woden, Thunor/Donar et Frigg. En allemand, Mittwoch (« milieu de semaine ») a remplacé le jour de Wotan, et Dienstag vient d'un surnom de Tyr (Thingsus)."},
{theme:"mytho",focus:"allemagne",diff:"difficile",type:"q",q:"Qu'est-ce que la Edda, et quel rôle joue-t-elle dans la mythologie nordique-germanique ?",a:"Recueil de mythes et poèmes eddiques islandais du XIIIe s. qui constitue la principale source sur la mythologie nordique",detail:"L'Edda poétique, recueil anonyme conservé dans un manuscrit des années 1270 (Codex Regius), et l'Edda en prose de Snorri Sturluson (vers 1220) racontent la création du monde, les dieux, les géants et le Ragnarök. Sans ces textes islandais, une grande part de la mythologie germanique serait perdue. Wagner et Tolkien y ont largement puisé."},
{theme:"histoire",focus:"allemagne",diff:"facile",type:"q",q:"Quel porte-parole du régime est-allemand annonce par erreur, le 9 novembre 1989, l'ouverture « immédiate » des frontières ?",a:"Günter Schabowski",detail:"Schabowski reçoit le nouveau règlement sur les voyages juste avant sa conférence de presse, sans en connaître les détails. À un journaliste qui demande quand il entre en vigueur, il répond : « immédiatement, sans délai ». Les images sont diffusées à la télévision ouest-allemande, et des milliers de Berlinois de l'Est se pressent aux points de passage, que les gardes finissent par ouvrir. Cette erreur couronne la « révolution pacifique » engagée par les manifestations de Leipzig."},
{theme:"histoire",focus:"allemagne",diff:"moyen",type:"q",q:"Quel philosophe des Lumières a dit du Saint-Empire romain germanique qu'il n'était « ni saint, ni romain, ni empire » ?",a:"Voltaire (Essai sur les mœurs, 1756)",detail:"Fondé en 962 par le couronnement d'Otton Ier, le Saint-Empire est une mosaïque de plusieurs centaines de principautés, évêchés et villes libres sous un empereur élu. La Réforme et la guerre de Trente Ans le fragmentent davantage ; les traités de Westphalie (1648) consacrent sa faiblesse. Il disparaît en 1806, quand François II renonce à la couronne sous la pression de Napoléon."},
{theme:"histoire",focus:"allemagne",diff:"moyen",type:"q",q:"Dans quelle salle d'un château français l'Empire allemand est-il proclamé le 18 janvier 1871 ?",a:"La galerie des Glaces du château de Versailles",detail:"Bismarck unifie l'Allemagne autour de la Prusse par trois guerres : contre le Danemark (1864), l'Autriche (1866) et la France (1870-1871). Le roi de Prusse Guillaume Ier devient empereur allemand. La proclamation à Versailles humilie la France, qui choisira le même lieu pour faire signer le traité de 1919. Bismarck crée aussi les premières assurances sociales (maladie 1883, accidents 1884, vieillesse 1889)."},
{theme:"histoire",focus:"allemagne",diff:"moyen",type:"q",q:"Quel dirigeant spartakiste est assassiné avec Rosa Luxemburg par les corps francs en janvier 1919 ?",a:"Karl Liebknecht",detail:"En novembre 1918, les mutineries de marins à Kiel et les conseils ouvriers renversent l'Empire ; Guillaume II abdique le 9 novembre. Ce jour-là, le social-démocrate Philipp Scheidemann proclame la République depuis le Reichstag, puis Liebknecht une « République socialiste libre » depuis le château de Berlin. L'insurrection spartakiste de janvier 1919 est écrasée par les corps francs, mobilisés par le gouvernement social-démocrate."},
{theme:"histoire",focus:"allemagne",diff:"difficile",type:"q",q:"Combien d'accusés le tribunal militaire international de Nuremberg condamne-t-il à mort en octobre 1946 ?",a:"12, dont Martin Bormann par contumace",detail:"Le tribunal juge 22 hauts dirigeants nazis (24 avaient été inculpés) pour complot, crimes contre la paix, crimes de guerre et crimes contre l'humanité. Outre les 12 condamnations à mort, il prononce 7 peines de prison et 3 acquittements. Göring se suicide au cyanure quelques heures avant l'exécution prévue ; Ribbentrop, Keitel et Jodl sont pendus. Ces procès fondent le droit international pénal moderne."},
{theme:"histoire",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle réforme monétaire de juin 1948, dans les zones occidentales de l'Allemagne, lance le « miracle économique » et déclenche le blocus de Berlin ?",a:"L'introduction du Deutsche Mark (20 juin 1948)",detail:"Le Deutsche Mark remplace le Reichsmark déprécié ; en quelques jours, les magasins se remplissent. Ludwig Erhard libère simultanément de nombreux prix. L'URSS riposte en bloquant les accès terrestres à Berlin-Ouest, ravitaillé par un pont aérien pendant près d'un an. L'Allemagne de l'Ouest reçoit aussi environ 1,4 milliard de dollars au titre du plan Marshall."},
{theme:"histoire",focus:"allemagne",diff:"difficile",type:"q",q:"Quel historien allemand soutient en 1961, dans Griff nach der Weltmacht, que l'Allemagne impériale porte une lourde responsabilité dans la Première Guerre mondiale ?",a:"Fritz Fischer",detail:"À partir des archives allemandes, Fischer montre que les dirigeants impériaux avaient des buts de guerre expansionnistes, formulés notamment dans le « programme de septembre » 1914. Sa thèse choque une Allemagne attachée à l'idée d'une guerre défensive et ouvre la « controverse Fischer ». L'historiographie actuelle reconnaît une responsabilité allemande importante, tout en soulignant celle des autres puissances."},
{theme:"histoire",focus:"allemagne",diff:"facile",type:"q",q:"En quelle année la RDA commence-t-elle la construction du mur de Berlin ?",a:"En 1961, dans la nuit du 12 au 13 août",detail:"Le Mur vise à stopper l'exode de quelque 3 millions d'Allemands de l'Est passés à l'Ouest depuis 1949. D'abord fait de barbelés, il devient une double enceinte de béton d'environ 155 km, avec plus de 300 miradors. Au moins 140 personnes y sont tuées. Kennedy déclare « Ich bin ein Berliner » en 1963, Reagan lance « M. Gorbatchev, abattez ce mur ! » en 1987. Le Mur tombe le 9 novembre 1989."},
{theme:"histoire",focus:"allemagne",diff:"moyen",type:"q",q:"Quel ancien commentateur des lois raciales de Nuremberg devient le plus proche collaborateur d'Adenauer, symbole des limites de la dénazification ?",a:"Hans Globke",detail:"Les Alliés classent les Allemands passés devant les chambres de dénazification en cinq catégories : principaux coupables, coupables, moindres coupables, suiveurs et disculpés. Des millions de dossiers sont examinés, mais la guerre froide pousse vite à réintégrer d'anciens nazis dans l'administration, la justice et l'armée. Globke, co-auteur d'un commentaire juridique des lois de Nuremberg (1935), dirige la chancellerie d'Adenauer de 1953 à 1963."},
{theme:"histoire",focus:"allemagne",diff:"difficile",type:"q",q:"Dans quel aéroport s'achève tragiquement la prise d'otages des Jeux olympiques de Munich, en septembre 1972 ?",a:"À la base aérienne de Fürstenfeldbruck",detail:"Le 5 septembre 1972, huit membres de Septembre noir prennent en otage des membres de la délégation israélienne ; deux sont tués au village olympique. L'assaut improvisé à Fürstenfeldbruck (tireurs trop peu nombreux, mauvais éclairage) tourne au massacre : les neuf otages restants, cinq preneurs d'otages et un policier ouest-allemand meurent. Israël lance ensuite l'opération « Colère de Dieu », sujet du film Munich de Spielberg (2005)."},
{theme:"histoire",focus:"allemagne",diff:"moyen",type:"q",q:"Quel juriste, arrière-petit-neveu d'un célèbre maréchal prussien, anime le Cercle de Kreisau, groupe de résistance anti-nazie ?",a:"Helmuth James von Moltke",detail:"Le Cercle de Kreisau (du nom du domaine familial en Silésie) réunit des officiers, des socialistes, des chrétiens et des aristocrates qui préparent une Allemagne démocratique, fédérale et européenne après le nazisme. Moltke, opposé à l'assassinat de Hitler, est arrêté en janvier 1944, avant l'attentat du 20 juillet. Condamné par le juge Roland Freisler, il est exécuté le 23 janvier 1945."},
{theme:"histoire",focus:"allemagne",diff:"facile",type:"q",q:"Dans quelle discipline scientifique Angela Merkel, chancelière de 2005 à 2021, obtient-elle son doctorat en RDA ?",a:"La chimie quantique (physique-chimie)",detail:"Fille de pasteur, ayant grandi en RDA, Merkel soutient sa thèse en 1986 à l'Académie des sciences de Berlin-Est et entre en politique après la chute du Mur. Première femme chancelière, elle gère la crise de l'euro, l'accueil de centaines de milliers de réfugiés en 2015 (« Wir schaffen das »), le Brexit et la première présidence Trump. Forbes l'a désignée à de nombreuses reprises femme la plus puissante du monde."},
{theme:"histoire",focus:"allemagne",diff:"difficile",type:"q",q:"Dans quelle ville de Rhénanie Karl Marx naît-il en 1818 ?",a:"À Trèves (Trier)",detail:"Fils d'un avocat d'origine juive converti au protestantisme, Marx étudie à Bonn et Berlin, devient journaliste, puis est expulsé de Prusse, de France et de Belgique. Il s'installe à Londres en 1849, où il écrit Le Capital (livre I, 1867). Sa maison natale à Trèves est devenue un musée. La Chine a offert à la ville une statue de lui en 2018, pour le bicentenaire de sa naissance."},
{theme:"histoire",focus:"allemagne",diff:"moyen",type:"q",q:"Quel chef des SA est éliminé lors de la « nuit des longs couteaux », fin juin 1934 ?",a:"Ernst Röhm",detail:"Röhm voulait faire des SA, forts de millions d'hommes, une armée populaire rivale de la Reichswehr et réclamait une « seconde révolution ». Hitler, poussé par les généraux, Göring et Himmler, fait exécuter sans procès, du 30 juin au 2 juillet, entre 85 et 200 personnes, dont des opposants conservateurs. Après la mort de Hindenburg (août 1934), l'armée prête serment à Hitler en personne ; les SS deviennent autonomes."},
{theme:"geo",focus:"allemagne",diff:"facile",type:"q",q:"Quelle ville allemande, capitale de la Bavière, est connue pour l'Oktoberfest et le palais de Nymphenburg, et abrite le siège de BMW ?",a:"Munich (München) — 3e ville d'Allemagne, capitale de la Bavière, siège de BMW, Allianz, MAN",detail:"Munich, fondée en 1158, a accueilli les JO d'été de 1972, marqués par la prise d'otages d'athlètes israéliens. L'Englischer Garten (environ 375 ha) est l'un des plus grands parcs urbains du monde. L'Oktoberfest, née en 1810 du mariage du prince héritier Louis (futur Louis Ier), attire environ 6 millions de visiteurs. Le Deutsches Museum est l'un des plus grands musées des sciences et techniques au monde."},
{theme:"geo",focus:"allemagne",diff:"facile",type:"q",q:"Quel quartier d'entrepôts en briques du port de Hambourg est inscrit au patrimoine mondial de l'UNESCO depuis 2015 ?",a:"La Speicherstadt (« ville des entrepôts »), avec le quartier voisin des Kontorhaus",detail:"Hambourg, sur l'Elbe à une centaine de km de la mer du Nord, est le 3e port d'Europe et une ville-État (Freie und Hansestadt Hamburg) d'environ 1,9 million d'habitants. La Speicherstadt (1883-1927), plus grand complexe d'entrepôts du monde bâti sur pieux de chêne, stockait café, thé, épices et tapis. La HafenCity se construit autour. Les Beatles ont fait leurs débuts dans le quartier de la Reeperbahn."},
{theme:"geo",focus:"allemagne",diff:"moyen",type:"q",q:"Quel tronçon du Rhin, entre Bingen et Coblence, célèbre pour ses châteaux et le rocher de la Lorelei, est inscrit au patrimoine mondial depuis 2002 ?",a:"La vallée du Haut-Rhin moyen (Oberes Mittelrheintal)",detail:"Ce tronçon d'environ 65 km aligne vignobles et châteaux médiévaux. Le Rhin prend sa source en Suisse (Grisons), traverse le lac de Constance, forme la frontière germano-suisse jusqu'à Bâle, puis la frontière franco-allemande, avant de traverser cette vallée et de rejoindre les Pays-Bas. La Lorelei (rocher de 132 m) est associée à une sirène dont le chant envoûtait les bateliers (poème de Heine, 1824)."},
{theme:"geo",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle île de la mer du Nord, la plus septentrionale d'Allemagne, reliée au continent par la digue Hindenburgdamm, perd chaque année du littoral malgré des rechargements de sable ?",a:"Sylt",detail:"Sylt (99 km²) est une île de sable reliée au continent par une digue ferroviaire (1927). Ses plages et ses dunes attirent une clientèle aisée ; l'immobilier y est parmi les plus chers d'Allemagne. Sa côte ouest recule d'environ 1 à 2 m par an sous l'effet des tempêtes. Le rechargement de sable (environ 1 million de m³ par an) coûte des millions d'euros chaque année."},
{theme:"geo",focus:"allemagne",diff:"facile",type:"q",q:"Quelle route touristique d'environ 85 km traverse le Palatinat, l'une des plus grandes régions viticoles d'Allemagne ?",a:"La Route des vins allemande (Deutsche Weinstraße), créée en 1935",detail:"Le Palatinat (Rhénanie-Palatinat) est la 2e région viticole d'Allemagne après la Hesse rhénane. L'Allemagne produit surtout des vins blancs (Riesling, Müller-Thurgau), mais aussi des rouges (Spätburgunder, c'est-à-dire pinot noir). Les vins de qualité sont classés selon la maturité du raisin (Kabinett, Spätlese, Auslese, Beerenauslese, Trockenbeerenauslese). Le VDP, association de domaines prestigieux, a créé un classement des parcelles comparable aux grands crus français."},
{theme:"geo",focus:"allemagne",diff:"difficile",type:"q",q:"Quelle notion géopolitique désigne la position centrale de l'Allemagne en Europe, sans frontières naturelles nettes, qui a nourri la peur de l'encerclement ?",a:"La Mittellage (« position centrale »)",detail:"Sans barrière naturelle comparable aux Pyrénées ou à la Manche, l'Allemagne est exposée aux guerres sur deux fronts (1914, 1941). Bismarck y répond par un système d'alliances défensives destiné à isoler la France. Guillaume II l'abandonne, et l'Allemagne se retrouve « encerclée » (Einkreisung) en 1914. Hitler cherche d'abord à éviter un second front, avant d'envahir l'URSS en 1941."},
{theme:"geo",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle ville saxonne, surnommée « la Florence de l'Elbe », est dévastée par les bombardements alliés du 13 au 15 février 1945 ?",a:"Dresde",detail:"Les bombardements de la RAF et de l'USAAF font entre 22 700 et 25 000 morts selon la commission d'historiens (2010), et détruisent le centre baroque. La propagande nazie, puis est-allemande, a longtemps gonflé les chiffres. La nécessité militaire du raid reste débattue. L'Opéra Semper rouvre en 1985 ; la Frauenkirche, reconstruite grâce à des dons du monde entier, en 2005. Le négationniste David Irving a instrumentalisé ce bombardement ; il a été condamné en Autriche en 2006."},
{theme:"geo",focus:"allemagne",diff:"facile",type:"q",q:"Quel château de Louis II de Bavière, construit à partir de 1869 dans les Alpes bavaroises, a inspiré le château de La Belle au bois dormant de Disneyland ?",a:"Neuschwanstein",detail:"Louis II de Bavière, dit « le roi fou », fait bâtir Neuschwanstein sur un piton rocheux au-dessus des gorges de la Pöllat. Il n'y vit que 172 jours avant sa mort mystérieuse en 1886 dans le lac de Starnberg. Avec environ 1,4 million de visiteurs par an, c'est l'un des châteaux les plus visités d'Europe. Les Alpes bavaroises culminent à la Zugspitze (2 962 m), point le plus haut d'Allemagne."},
{theme:"sciences",focus:"allemagne",diff:"facile",type:"q",q:"Pour quels travaux Albert Einstein, né à Ulm en 1879, reçoit-il le prix Nobel de physique 1921 ?",a:"L'explication de l'effet photoélectrique, et non la relativité",detail:"En 1905, Einstein explique l'effet photoélectrique en supposant que la lumière est composée de quanta d'énergie (les futurs photons), un pilier de la physique quantique. Le comité Nobel juge alors la relativité trop controversée. Le prix de 1921 est décerné en 1922. Einstein quitte l'Allemagne en 1933 et s'installe aux États-Unis ; il signe en 1939 la lettre à Roosevelt qui contribue au lancement du projet Manhattan."},
{theme:"sciences",focus:"allemagne",diff:"moyen",type:"q",q:"Quel chimiste allemand propose en 1865 la structure cyclique du benzène, après, selon son récit, un rêve de serpent se mordant la queue ?",a:"Kekulé rêve (selon la légende) d'un ouroboros (serpent circulaire) et comprend que le benzène est un anneau de 6 carbones — fondement de la chimie organique aromatique",detail:"La structure du benzène (C6H6) est un mystère pendant des décennies : 6 carbones avec 6 hydrogènes ne correspondent à aucune chaîne linéaire stable. Kekulé propose l'anneau hexagonal alternant liaisons simples et doubles (structure mésomère). Cette découverte ouvre la chimie aromatique (aspirine, colorants, explosifs, médicaments). La légende du rêve est probablement une reconstruction a posteriori mais reste dans l'histoire des sciences."},
{theme:"sciences",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle physicienne autrichienne, exilée en Suède en 1938, interprète avec Otto Frisch la fission nucléaire, sans recevoir le Nobel attribué à Otto Hahn ?",a:"Lise Meitner (1878-1968)",detail:"Juive, Meitner doit fuir l'Allemagne en 1938 après l'Anschluss. Hahn et Strassmann obtiennent du baryum en bombardant de l'uranium avec des neutrons, résultat incompréhensible ; Meitner et son neveu Frisch expliquent que le noyau s'est scindé en libérant de l'énergie (E = mc²) et nomment le phénomène « fission ». Le Nobel de chimie 1944 est attribué à Hahn seul. Meitner refuse de travailler à la bombe ; l'élément 109 porte le nom de meitnérium."},
{theme:"sciences",focus:"allemagne",diff:"difficile",type:"q",q:"Quel modèle d'université, mis en place à Berlin en 1810, associe enseignement et recherche et sera imité dans le monde entier ?",a:"Le modèle humboldtien, à l'université de Berlin (aujourd'hui université Humboldt)",detail:"Le diplomate Wilhelm von Humboldt, frère du naturaliste Alexander, conçoit une université fondée sur l'unité de la recherche et de l'enseignement (Einheit von Forschung und Lehre) et la liberté académique. Fichte en est l'un des premiers recteurs ; Hegel y enseigne à partir de 1818. Le modèle inspire notamment l'université Johns Hopkins (1876) et les grandes universités de recherche américaines."},
{theme:"sciences",focus:"allemagne",diff:"facile",type:"q",q:"Quel polygone régulier Carl Friedrich Gauss démontre-t-il, à 18 ans, constructible à la règle et au compas ?",a:"Le polygone régulier à 17 côtés (heptadécagone)",detail:"Ce résultat de 1796 décide Gauss, surnommé « le prince des mathématiciens », à se consacrer aux mathématiques. On lui doit notamment la méthode des moindres carrés (qui permet de retrouver l'astéroïde Cérès), la loi normale, une démonstration du théorème fondamental de l'algèbre, des travaux de géodésie et de magnétisme terrestre (avec Weber). Son portrait figurait sur les billets allemands de 10 marks."},
{theme:"sciences",focus:"allemagne",diff:"moyen",type:"q",q:"Quel chimiste allemand popularise la « loi du minimum », selon laquelle la croissance d'une plante est limitée par le nutriment le plus rare ?",a:"Justus von Liebig (1803-1873)",detail:"Formulée d'abord par Carl Sprengel (1828), la loi du minimum est popularisée par Liebig, qui montre l'importance de l'azote, du phosphore et du potassium pour les plantes et fonde la chimie agricole. À Giessen, il crée un laboratoire d'enseignement par la pratique qui forme des chimistes du monde entier. Il lance aussi un extrait de viande concentré. Il se trompe en revanche sur la fermentation, qu'il croit purement chimique."},
{theme:"sciences",focus:"allemagne",diff:"difficile",type:"q",q:"Quelle constante fondamentale, notée h, porte le nom du physicien qui introduit les quanta d'énergie en 1900 ?",a:"La constante de Planck (h ≈ 6,626 × 10⁻³⁴ J·s)",detail:"Max Planck (1858-1947) postule que l'énergie rayonnée est émise par paquets, E = hν, ce qu'il qualifie lui-même d'« acte de désespoir ». Depuis 2019, la valeur de h est fixée exactement et sert à définir le kilogramme. Planck reçoit le Nobel en 1918. Son fils Erwin, impliqué dans le complot du 20 juillet 1944, est exécuté par les nazis en 1945."},
{theme:"sciences",focus:"allemagne",diff:"moyen",type:"q",q:"Quel bacille Robert Koch identifie-t-il en 1882, découverte qui lui vaut le prix Nobel de médecine en 1905 ?",a:"Le bacille de la tuberculose (Mycobacterium tuberculosis)",detail:"Koch perfectionne la culture des bactéries sur milieu solide ; l'usage de la gélose (agar-agar) est suggéré par Fanny Hesse, épouse de son collaborateur Walther Hesse. Il identifie aussi le bacille du choléra (1883-1884) et formule les « postulats de Koch » pour établir qu'un microbe cause une maladie. Sa rivalité avec Pasteur, sur fond d'hostilité franco-allemande, stimule l'essor de la bactériologie."},
{theme:"sciences",focus:"allemagne",diff:"facile",type:"q",q:"Dans quelle ville Johannes Gutenberg met-il au point son imprimerie à caractères mobiles vers 1450 ?",a:"Mayence (Mainz)",detail:"Gutenberg combine des caractères en alliage de plomb, d'étain et d'antimoine, une presse inspirée des pressoirs et une encre grasse. Sa Bible à 42 lignes, tirée à environ 180 exemplaires, est achevée vers 1455. Un procès lui fait perdre une partie de son atelier au profit de son associé Johann Fust. L'imprimerie favorise ensuite la diffusion rapide des écrits de Luther. Mayence abrite aujourd'hui le musée Gutenberg."},
{theme:"sciences",focus:"allemagne",diff:"difficile",type:"q",q:"Quel ingénieur allemand, concepteur du missile V2, devient après la guerre l'architecte de la fusée Saturn V du programme Apollo ?",a:"Wernher von Braun (1912-1977)",detail:"Membre du parti nazi et officier SS, von Braun dirige le développement du V2, premier missile balistique opérationnel (1944), tiré par milliers sur Londres et Anvers. Les V2 sont assemblés à Mittelwerk par les déportés du camp de Dora, où environ 20 000 prisonniers meurent, davantage que les victimes des tirs. Il se rend aux Américains en 1945 et est recruté dans le cadre de l'opération Paperclip. À la NASA, il conçoit la Saturn V qui propulse Apollo 11."},
{theme:"philo",focus:"allemagne",diff:"facile",type:"q",q:"Quel philosophe allemand, qui ne quitta presque jamais Königsberg, publie la Critique de la raison pure (1781) ?",a:"Emmanuel Kant (1724-1804)",detail:"Kant opère une « révolution copernicienne » : ce n'est pas l'esprit qui se règle sur les objets, mais les objets qui se règlent sur les formes de notre connaissance (espace, temps, catégories). La Critique de la raison pure limite la raison spéculative : on ne peut prouver ni l'existence de Dieu ni l'immortalité de l'âme. La Critique de la raison pratique (1788) fonde la morale sur l'impératif catégorique. Sa ponctualité était, dit-on, légendaire à Königsberg (aujourd'hui Kaliningrad)."},
{theme:"philo",focus:"allemagne",diff:"moyen",type:"q",q:"Quel philosophe allemand, auteur d'Être et Temps (1927), adhère au parti nazi en 1933 et devient recteur de l'université de Fribourg ?",a:"Martin Heidegger (1889-1976)",detail:"Être et Temps analyse le Dasein (« être-là ») comme être-au-monde, temporel et mortel ; l'angoisse face à la mort révèle la finitude et appelle à l'authenticité. Recteur en 1933-1934, Heidegger prononce un discours favorable au régime et ne s'en est jamais clairement expliqué ; ses Cahiers noirs, publiés à partir de 2014, révèlent un antisémitisme. Parmi ses élèves figurent Hannah Arendt, Hans-Georg Gadamer, Herbert Marcuse et Hans Jonas."},
{theme:"philo",focus:"allemagne",diff:"moyen",type:"q",q:"Quel philosophe de la seconde génération de l'École de Francfort oppose la « raison communicationnelle » à la raison instrumentale ?",a:"Jürgen Habermas (né en 1929)",detail:"Contre le pessimisme d'Adorno et Horkheimer, Habermas soutient que la modernité n'est pas seulement instrumentale (rapport moyens-fins) mais aussi communicationnelle (recherche d'entente par l'échange d'arguments). Sa Théorie de l'agir communicationnel (1981) fonde une éthique de la discussion et une théorie de la démocratie délibérative. Il est aussi un défenseur engagé de l'intégration européenne."},
{theme:"philo",focus:"allemagne",diff:"difficile",type:"q",q:"Pour quel magazine américain Hannah Arendt couvre-t-elle le procès Eichmann à Jérusalem en 1961 ?",a:"The New Yorker",detail:"Ses articles, publiés en 1963 puis réunis dans Eichmann à Jérusalem, avancent la thèse de la « banalité du mal » : Eichmann lui apparaît comme un fonctionnaire terne, incapable de penser par lui-même. Arendt, élève de Heidegger et de Jaspers, exilée aux États-Unis, est alors vivement attaquée, notamment pour ses remarques sur le rôle des conseils juifs."},
{theme:"philo",focus:"allemagne",diff:"facile",type:"q",q:"Quel poète et dramaturge allemand, ami de Goethe, est l'auteur des Brigands (1781) et de Guillaume Tell (1804) ?",a:"Friedrich Schiller (1759-1805)",detail:"Les Brigands, drame de la révolte contre l'ordre social, font scandale ; Schiller fuit le Wurtemberg pour échapper au duc Charles-Eugène. Figure du Sturm und Drang puis du classicisme de Weimar, il écrit aussi Don Carlos, Marie Stuart et des essais philosophiques (Lettres sur l'éducation esthétique de l'homme, 1795). Son « Ode à la joie », mise en musique par Beethoven, fournit la mélodie de l'hymne européen, adopté sans paroles. Il repose à Weimar près de Goethe."},
{theme:"philo",focus:"allemagne",diff:"difficile",type:"q",q:"Quel philosophe de l'École de Francfort publie L'Homme unidimensionnel (1964), ouvrage qui marque les mouvements contestataires de 1968 ?",a:"Herbert Marcuse",detail:"Marcuse y décrit une société industrielle avancée qui intègre ses opposants en créant de faux besoins, réduisant l'individu à une seule dimension. L'École de Francfort (Institut de recherche sociale, fondé en 1923), exilée aux États-Unis sous le nazisme, développe la « théorie critique » ; Horkheimer et Adorno y rédigent la Dialectique de la raison (1944), critique de la raison instrumentale et de l'industrie culturelle."},
{theme:"philo",focus:"allemagne",diff:"moyen",type:"q",q:"Quel opéra de Richard Wagner est profondément marqué par la philosophie de Schopenhauer ?",a:"Tristan et Isolde (1865)",detail:"Wagner découvre Le Monde comme volonté et comme représentation en 1854. Dans Tristan, le désir sans fin, la nuit et l'aspiration à l'anéantissement traduisent la philosophie de la Volonté. Pour Schopenhauer, la musique exprime directement la Volonté et permet de suspendre momentanément sa tyrannie. Influencé par le bouddhisme, il inspire aussi Nietzsche, qui s'en éloigne, et Freud."},
{theme:"philo",focus:"allemagne",diff:"moyen",type:"q",q:"Quel philosophe allemand prononce les Discours à la nation allemande (1807-1808) dans Berlin occupé par Napoléon ?",a:"Johann Gottlieb Fichte (1762-1814)",detail:"Dans ces 14 discours, Fichte appelle à un renouveau national par l'éducation et définit la nation allemande par la langue et la culture, même en l'absence d'État (Kulturnation). Cette conception culturelle s'oppose à la conception civique que formulera Renan en 1882 (la nation comme « plébiscite de tous les jours »). Elle a nourri le nationalisme allemand et plus tard le pangermanisme."},
{theme:"arts",focus:"allemagne",diff:"facile",type:"q",q:"Quel poète allemand a écrit l'« Ode à la joie », que Beethoven met en musique dans le finale de sa 9e Symphonie (1824) ?",a:"Friedrich Schiller",detail:"Schiller écrit son poème An die Freude en 1785. Beethoven, qui perd l'ouïe dès la fin des années 1790 et envisage le suicide (Testament de Heiligenstadt, 1802), l'intègre au finale de sa 9e Symphonie, avec solistes et chœur, une nouveauté pour une symphonie de cette ampleur. Lors de la création à Vienne, la contralto Caroline Unger l'aurait tourné vers le public pour qu'il voie les applaudissements. La mélodie, sans paroles, est devenue l'hymne européen."},
{theme:"arts",focus:"allemagne",diff:"moyen",type:"q",q:"Quel peintre romantique allemand a peint Le Voyageur contemplant une mer de nuages (vers 1818) ?",a:"Caspar David Friedrich (1774-1840)",detail:"Friedrich peint des paysages nordiques (Rügen, Harz, Saxe) dans une lumière mélancolique : ruines gothiques dans la brume, croix sur les rochers, mers de nuages. Sa « figure vue de dos » (Rückenfigur) invite le spectateur à s'identifier au personnage face à l'immensité, expression du sublime. Longtemps oublié, il est redécouvert au début du XXe siècle."},
{theme:"arts",focus:"allemagne",diff:"moyen",type:"q",q:"Quel film de Fritz Lang (1931), avec Peter Lorre, montre la traque d'un tueur d'enfants par la police et la pègre de Berlin ?",a:"M le Maudit",detail:"M le Maudit, premier film parlant de Lang, est l'un des premiers grands films consacrés à un tueur en série. Selon le récit de Lang lui-même, Goebbels lui aurait proposé en 1933 de diriger le cinéma du Reich, et il aurait fui le soir même ; ses passeports montrent en réalité plusieurs allers-retours. Il s'installe à Paris, puis à Hollywood. Son épouse et scénariste Thea von Harbou, dont il divorce, rejoint le parti nazi."},
{theme:"arts",focus:"allemagne",diff:"facile",type:"q",q:"Quel compositeur allemand, auteur d'Ainsi parlait Zarathoustra et du Chevalier à la rose, préside la Chambre de musique du Reich de 1933 à 1935 ?",a:"Richard Strauss (1864-1949)",detail:"Le début d'Ainsi parlait Zarathoustra (1896) est devenu célèbre grâce à 2001 : l'Odyssée de l'espace de Kubrick. Strauss accepte la présidence de la Reichsmusikkammer, mais collabore avec le librettiste juif Stefan Zweig (La Femme silencieuse) ; une lettre critique envers le régime, interceptée par la Gestapo, entraîne sa démission en 1935. Il reste en Allemagne, notamment pour protéger sa belle-fille juive Alice et ses petits-enfants. Il est blanchi par un tribunal de dénazification en 1948 ; sa réputation reste ambiguë."},
{theme:"arts",focus:"allemagne",diff:"difficile",type:"q",q:"Quelle cinéaste réalise Le Triomphe de la volonté (1935) et Olympia (1938), films de propagande nazie aux innovations techniques majeures ?",a:"Leni Riefenstahl (1902-2003)",detail:"Le Triomphe de la volonté filme le congrès du parti nazi à Nuremberg (1934) avec une trentaine de caméras, des grues et des travellings, et présente Hitler en sauveur descendu du ciel. Olympia, sur les JO de Berlin, invente une grande part du film sportif moderne (ralentis, caméras sous-marines). Classée « sympathisante » par la dénazification, Riefenstahl affirma toute sa vie n'avoir fait que de l'art. Elle publie ensuite des livres de photos sur les Nouba du Soudan et meurt à 101 ans sans s'être repentie."},
{theme:"arts",focus:"allemagne",diff:"moyen",type:"q",q:"Quel romancier allemand, prix Nobel 1972, dénonce la presse à scandale dans L'Honneur perdu de Katharina Blum (1974) ?",a:"Heinrich Böll (1917-1985)",detail:"Le roman vise le quotidien Bild (groupe Springer). En 1972, Böll avait réclamé dans Der Spiegel un procès équitable pour Ulrike Meinhof, ce qui lui valut d'être accusé de complaisance envers le terrorisme. Il dénonce aussi la réintégration d'anciens nazis et le conformisme de l'après-guerre (Et il ne dit pas un seul mot, Portrait de groupe avec dame). Président du PEN club international, il accueille Soljenitsyne chez lui lors de son expulsion d'URSS en 1974."},
{theme:"arts",focus:"allemagne",diff:"facile",type:"q",q:"Dans quelles trois villes le Bauhaus a-t-il successivement été installé ?",a:"Weimar (1919-1925), Dessau (1925-1932) et Berlin (1932-1933)",detail:"Fondé par Walter Gropius, le Bauhaus unit arts, artisanat et industrie. Chassé de Weimar par la droite nationaliste, il s'installe à Dessau dans un bâtiment conçu par Gropius, puis à Berlin, avant de fermer en 1933 sous la pression nazie. Ses maîtres (Klee, Kandinsky, Moholy-Nagy, Mies van der Rohe) émigrent : Gropius enseigne à Harvard, Mies van der Rohe et Moholy-Nagy à Chicago."},
{theme:"arts",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle chanson de Herbert Grönemeyer (1984), hymne officieux d'une ville de la Ruhr, est chantée par les supporters de son club avant chaque match ?",a:"Bochum",detail:"Herbert Grönemeyer, né à Göttingen mais qui a grandi à Bochum, est l'un des chanteurs les plus vendus d'Allemagne. La chanson célèbre avec tendresse et ironie la ville minière en déclin ; elle résonne avant chaque match du VfL Bochum. Die Ärzte, fondé à Berlin en 1982, est un autre pilier de la scène rock germanophone, connu pour son humour absurde et ses engagements politiques."},
{theme:"arts",focus:"allemagne",diff:"difficile",type:"q",q:"Quel courant musical allemand (1979-1984), mêlant punk, synthétiseurs et textes en allemand, révèle Nena (99 Luftballons) et Trio (Da Da Da) ?",a:"La Neue Deutsche Welle (« nouvelle vague allemande »)",detail:"La Neue Deutsche Welle est la réponse allemande au punk et à la new wave britanniques : textes en allemand, synthétiseurs, esthétique post-industrielle, humour souvent absurde. 99 Luftballons (Nena, 1983), écrite dans le contexte de la crise des euromissiles, raconte comment 99 ballons déclenchent par erreur une guerre ; elle devient un succès mondial. Da Da Da (Trio, 1982), construite sur un petit clavier Casio, est un succès international."},
{theme:"arts",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle chorégraphe allemande, fondatrice du Tanztheater Wuppertal, est l'autrice de Café Müller (1978) ?",a:"Pina Bausch (1940-2009)",detail:"Pina Bausch invente le Tanztheater (théâtre dansé), qui mêle danse, paroles, musique et objets pour explorer les relations entre hommes et femmes. Elle disait s'intéresser moins à la façon dont les gens bougent qu'à ce qui les meut. Dans Café Müller, des danseurs aux yeux fermés se heurtent aux chaises. Almodóvar lui rend hommage dans Parle avec elle (2002), Wim Wenders dans Pina (2011)."},
{theme:"politique",focus:"allemagne",diff:"facile",type:"q",q:"Quel pourcentage minimal des voix un parti doit-il obtenir pour entrer au Bundestag (sauf exceptions) ?",a:"5 % des deuxièmes voix (Zweitstimmen)",detail:"L'électeur allemand dispose de deux voix : la première pour un candidat de sa circonscription (Erststimme), la seconde pour une liste de parti (Zweitstimme), qui détermine la répartition proportionnelle des sièges. Le seuil de 5 % vise à éviter la fragmentation qui avait paralysé la République de Weimar ; un parti remportant au moins trois circonscriptions y échappe. Ce système produit des coalitions. Depuis la réforme de 2023, le Bundestag compte 630 sièges."},
{theme:"politique",focus:"allemagne",diff:"moyen",type:"q",q:"Quel chancelier dirige la RFA de 1949 à 1963 et signe avec de Gaulle le traité de l'Élysée ?",a:"Konrad Adenauer (1876-1967)",detail:"Adenauer, 73 ans à son entrée en fonction, ancre la RFA à l'Ouest : accord de Luxembourg (1952) prévoyant 3 milliards de marks de réparations à Israël, adhésion à l'OTAN (1955), traités de Rome (1957), traité de l'Élysée (1963) scellant la réconciliation franco-allemande. Surnommé « der Alte » (le Vieux), il quitte la chancellerie à 87 ans."},
{theme:"politique",focus:"allemagne",diff:"moyen",type:"q",q:"Quel chancelier démissionne en 1974 après la découverte qu'un de ses proches collaborateurs, Günter Guillaume, espionnait pour la RDA ?",a:"Willy Brandt",detail:"Guillaume, collaborateur de Brandt depuis 1970, était un officier du service de renseignement extérieur est-allemand (HVA). Arrêté en avril 1974, il avait eu accès à des documents confidentiels. Brandt, prix Nobel de la paix 1971 pour son Ostpolitik, démissionne le 7 mai 1974 ; Helmut Schmidt lui succède. Guillaume est échangé contre des agents occidentaux en 1981."},
{theme:"politique",focus:"allemagne",diff:"difficile",type:"q",q:"Comment le système fédéral allemand distribue-t-il les compétences entre le Bund (fédération) et les 16 Länder, et quel rôle particulier jouent les Länder dans l'application des lois fédérales ?",a:"En Allemagne, le Bund légifère, les Länder administrent et exécutent — les Länder ont la compétence résiduelle dans l'éducation, la police et la culture, mais exécutent la plupart des lois fédérales",detail:"Le fédéralisme allemand est dit « d'exécution » : le Bund fixe l'essentiel des lois, les Länder les appliquent avec leurs propres administrations. Les Länder ont des compétences propres, notamment l'éducation, la culture et la police, d'où 16 systèmes scolaires parfois difficiles à harmoniser. Le Bundesrat, qui représente les gouvernements des Länder, doit approuver les lois qui touchent leur administration ou leurs finances."},
{theme:"politique",focus:"allemagne",diff:"moyen",type:"q",q:"Quel écologiste allemand devient en 1998 ministre des Affaires étrangères dans la coalition « rouge-verte » de Gerhard Schröder ?",a:"Joschka Fischer",detail:"Les Verts (Die Grünen), fondés en 1980 par des militants antinucléaires, pacifistes et féministes, entrent au Bundestag en 1983 avec 5,6 % des voix. Fischer, ancien militant d'extrême gauche, devient un ministre pro-européen respecté (1998-2005). Les Verts gouvernent de nouveau de 2021 à 2025 dans la coalition d'Olaf Scholz, avec Annalena Baerbock et Robert Habeck, avant de retourner dans l'opposition."},
{theme:"politique",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle phrase d'Angela Merkel, prononcée en 2015 face à l'arrivée massive de réfugiés, est devenue le symbole de sa politique d'accueil ?",a:"« Wir schaffen das » (« Nous y arriverons »)",detail:"Fin août 2015, l'Allemagne cesse de renvoyer les Syriens vers leur pays d'entrée dans l'UE (règlement de Dublin) ; environ 890 000 demandeurs d'asile arrivent cette année-là. La décision divise sa coalition (la CSU bavaroise y est hostile) ; les agressions de la Saint-Sylvestre à Cologne attisent les tensions. L'AfD entre au Bundestag en 2017 avec 12,6 %, puis devient le deuxième parti en 2025 avec près de 21 %."},
{theme:"politique",focus:"allemagne",diff:"difficile",type:"q",q:"Comment le 'Sonderweg' (voie spéciale) est-il utilisé par les historiens pour caractériser le développement politique allemand au XIXe-XXe siècle — et pourquoi cette thèse est-elle aujourd'hui controversée ?",a:"Le 'Sonderweg' (voie particulière) postule que l'Allemagne a suivi un chemin anormal vers la modernité (modernisation économique sans libéralisation politique) qui aurait rendu le nazisme inévitable — critiqué comme téléologique",detail:"Défendue notamment par Hans-Ulrich Wehler, la thèse du Sonderweg soutient que l'Allemagne s'est industrialisée rapidement tandis que ses élites traditionnelles (Junker, armée) bloquaient la démocratisation, préparant le terrain au nazisme. David Blackbourn et Geoff Eley (1984) la critiquent : elle suppose une norme « occidentale » (britannique, française) idéalisée et lit l'histoire à rebours. Le débat reste structurant dans l'historiographie allemande."},
{theme:"politique",focus:"allemagne",diff:"facile",type:"q",q:"Comment appelle-t-on en Allemagne une coalition gouvernementale réunissant la CDU/CSU et le SPD ?",a:"Une « grande coalition » (Große Koalition, ou GroKo)",detail:"La CDU et sa sœur bavaroise, la CSU, forment un groupe commun au Bundestag. Les deux grands partis rivaux ont gouverné ensemble en 1966-1969, 2005-2009 et 2013-2021 (sous Angela Merkel), puis de nouveau depuis 2025 sous Friedrich Merz. On leur reproche d'affaiblir l'opposition centrale et de profiter aux extrêmes. Entre-temps, Olaf Scholz avait dirigé une coalition « feu tricolore » (SPD-Verts-FDP), effondrée fin 2024."},
{theme:"politique",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle monnaie l'Allemagne réunifiée accepte-t-elle d'abandonner au profit de l'euro, en partie pour rassurer ses partenaires européens ?",a:"Le deutschemark",detail:"La réunification (1990) inquiète Mitterrand et Thatcher. Helmut Kohl accélère l'intégration européenne : le traité de Maastricht (1992) prévoit l'union monétaire. L'Allemagne renonce au mark, symbole du « miracle économique », mais impose une banque centrale indépendante sur le modèle de la Bundesbank et les critères de convergence. L'idée d'un « marchandage » explicite euro contre réunification est débattue par les historiens : le projet monétaire était antérieur à 1989."},
{theme:"litterature",focus:"allemagne",diff:"facile",type:"q",q:"Quel personnage du Procès de Kafka est arrêté un matin sans savoir de quoi on l'accuse ?",a:"Joseph K.",detail:"Joseph K., fondé de pouvoir dans une banque, est poursuivi par un tribunal invisible et finit exécuté « comme un chien », sans jamais connaître l'accusation. Dans Le Château, l'arpenteur K. tente en vain d'accéder au château qui gouverne le village. Kafka, juif de Prague de langue allemande, était employé d'une compagnie d'assurances ; l'adjectif « kafkaïen » désigne une situation absurde et oppressante."},
{theme:"litterature",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle romancière de RDA, auteure de Cassandre (1983), voit révéler en 1993 qu'elle a brièvement été informatrice de la Stasi ?",a:"Christa Wolf (1929-2011)",detail:"Wolf réinterprète les mythes grecs (Cassandre, Médée) dans une perspective féministe et pacifiste. Elle avait été informatrice (sous le nom de « Margarete ») de 1959 à 1962, avant d'être elle-même étroitement surveillée pendant des décennies. La « querelle littéraire » (Literaturstreit) qui suit la réunification révèle les tensions entre écrivains de l'Est et de l'Ouest."},
{theme:"litterature",focus:"allemagne",diff:"difficile",type:"q",q:"Quel poète juif de langue allemande, né en Roumanie et dont les parents sont morts en déportation, écrit « Todesfuge » (Fugue de mort) ?",a:"Paul Celan (1920-1970)",detail:"Écrit vers 1945, « Todesfuge » reprend la structure de la fugue musicale ; ses images récurrentes (le « lait noir », les cheveux d'or de Margarete et les cheveux de cendre de Sulamith) et le vers « la mort est un maître venu d'Allemagne » en font un poème majeur sur la Shoah. Celan écrit dans la langue des bourreaux, avec une langue de plus en plus hermétique. Sa rencontre avec Heidegger en 1967 reste célèbre. Il se suicide dans la Seine en 1970."},
{theme:"litterature",focus:"allemagne",diff:"moyen",type:"q",q:"Quel roman d'Erich Maria Remarque (1929), décrivant la Première Guerre mondiale vue par un jeune soldat allemand, est brûlé par les nazis ?",a:"À l'Ouest, rien de nouveau",detail:"Paul Bäumer, 18 ans, s'engage sous l'influence des discours patriotiques de son professeur ; au front, les illusions s'effondrent face à la boue, aux gaz et à la mort absurde. Le roman se vend à des millions d'exemplaires. Les nazis le brûlent en 1933 et déchoient Remarque de sa nationalité. Adapté par Lewis Milestone (1930), il l'a été de nouveau en 2022 ; ce film a obtenu 4 Oscars."},
{theme:"litterature",focus:"allemagne",diff:"facile",type:"q",q:"Quel procédé théâtral Bertolt Brecht théorise-t-il pour empêcher le spectateur de s'identifier aux personnages et l'amener à réfléchir ?",a:"L'effet de distanciation (Verfremdungseffekt)",detail:"Dans le « théâtre épique » de Brecht, les acteurs s'adressent au public, des panneaux annoncent les scènes, des chansons interrompent l'action et les décors restent visiblement artificiels. L'Opéra de quat'sous (1928, musique de Kurt Weill), Mère Courage et La Vie de Galilée sont ses pièces majeures. Exilé en 1933, convoqué en 1947 par la Commission des activités antiaméricaines, il s'installe à Berlin-Est en 1949 et y fonde le Berliner Ensemble."},
{theme:"litterature",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle romancière autrichienne, prix Nobel 2004, est l'auteure de La Pianiste (1983) ?",a:"Elfriede Jelinek (née en 1946)",detail:"La Pianiste décrit Erika Kohut, professeure de piano dominée par sa mère, qui développe des pratiques masochistes ; Michael Haneke l'adapte en 2001 (Grand Prix du Festival de Cannes). Jelinek explore la violence cachée sous la respectabilité bourgeoise et la langue comme instrument de domination. Elle ne se rend pas à Stockholm pour recevoir le Nobel ; un membre de l'Académie démissionne en 2005 pour protester contre ce choix."},
{theme:"economie",focus:"allemagne",diff:"facile",type:"q",q:"Quel scandale de 2015 révèle que Volkswagen a équipé des millions de voitures diesel d'un logiciel truquant les tests d'émissions ?",a:"Le « Dieselgate »",detail:"Découverte par l'Agence américaine de protection de l'environnement (EPA), la fraude concerne environ 11 millions de véhicules : le logiciel réduit les émissions d'oxydes d'azote pendant les tests, alors qu'en conduite réelle elles peuvent atteindre 40 fois la limite. Amendes, rachats et indemnisations coûtent plus de 30 milliards d'euros au groupe. L'automobile représente environ un sixième des exportations allemandes."},
{theme:"economie",focus:"allemagne",diff:"moyen",type:"q",q:"Comment appelle-t-on en Allemagne le tissu d'entreprises moyennes, souvent familiales, au cœur de la compétitivité du pays ?",a:"Le Mittelstand",detail:"Le Mittelstand regroupe l'immense majorité des entreprises allemandes et environ la moitié de l'emploi privé. Parmi elles figurent de nombreux « champions cachés » (Hermann Simon, 1996), leaders mondiaux de niches peu connues du grand public : Kärcher (nettoyeurs haute pression), Rational (fours professionnels). Leur modèle : spécialisation, exportation, autofinancement, apprentissage dual et stabilité familiale."},
{theme:"economie",focus:"allemagne",diff:"difficile",type:"q",q:"Quelle surtaxe, instaurée en 1991, a contribué pendant trois décennies à financer la reconstruction de l'ex-RDA ?",a:"Le Solidaritätszuschlag (« Soli »), égal à 5,5 % de l'impôt sur le revenu et sur les sociétés",detail:"Les transferts vers l'Est sont estimés à environ 2 000 milliards d'euros entre 1990 et 2020. Helmut Kohl avait promis des « paysages florissants » ; la plupart des combinats de RDA, non compétitifs, ferment, et le chômage dépasse 15 à 20 % à l'Est. La Treuhandanstalt privatise environ 8 500 entreprises. Depuis 2021, le Soli ne concerne plus que les revenus les plus élevés et les sociétés."},
{theme:"economie",focus:"allemagne",diff:"moyen",type:"q",q:"Quelles réformes du marché du travail, menées par Gerhard Schröder entre 2003 et 2005, portent le nom d'un dirigeant de Volkswagen ?",a:"Les lois Hartz (du nom de Peter Hartz)",detail:"Elles réduisent la durée d'indemnisation, fusionnent aide sociale et allocation chômage de longue durée (Hartz IV), développent l'intérim et les « minijobs » faiblement rémunérés et exonérés. Le chômage passe d'environ 11 % en 2005 à moins de 6 % dans les années 2010, mais la précarité progresse. Hartz IV a été remplacé en 2023 par le Bürgergeld. Schröder perd les élections de 2005."},
{theme:"economie",focus:"allemagne",diff:"moyen",type:"q",q:"Comment s'appelle la transition énergétique allemande, accélérée après Fukushima, qui a conduit à la fermeture des derniers réacteurs nucléaires en avril 2023 ?",a:"L'Energiewende",detail:"L'Allemagne développe massivement l'éolien et le solaire depuis 2000 : les renouvelables fournissent plus de la moitié de l'électricité consommée en 2023. Mais la sortie du nucléaire oblige à recourir au charbon et au gaz lors des périodes sans vent ni soleil (Dunkelflaute). La guerre en Ukraine a révélé la dépendance au gaz russe. Les prix élevés de l'électricité pèsent sur l'industrie."},
{theme:"economie",focus:"allemagne",diff:"difficile",type:"q",q:"Quelle règle, inscrite en 2009 dans la Loi fondamentale allemande, limite le déficit structurel fédéral à 0,35 % du PIB ?",a:"Le frein à l'endettement (Schuldenbremse)",detail:"Wolfgang Schäuble, ministre des Finances, va plus loin avec le « zéro noir » (schwarze Null), l'équilibre budgétaire atteint de 2014 à 2019. Les critiques, souvent keynésiens, dénoncent un sous-investissement dans les infrastructures et le numérique. En 2023, la Cour constitutionnelle invalide une réaffectation de 60 milliards d'euros. En mars 2025, la règle est assouplie pour la défense et un fonds de 500 milliards pour les infrastructures."},
{theme:"gastro",focus:"allemagne",diff:"facile",type:"q",q:"Quelle ville bavaroise abrite le Christkindlesmarkt, l'un des plus anciens et des plus célèbres marchés de Noël d'Europe ?",a:"Nuremberg",detail:"Le marché est attesté depuis le XVIIe siècle (1628 au moins). On y boit du Glühwein (vin chaud épicé) et on y mange des Lebkuchen, pains d'épices de Nuremberg protégés par une indication géographique, ainsi que les Nürnberger Rostbratwürste, petites saucisses grillées également protégées. Cologne, Dresde et Strasbourg ont aussi des marchés de Noël renommés."},
{theme:"gastro",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle saucisse blanche bavaroise se mange traditionnellement avant midi, avec un bretzel et de la moutarde douce ?",a:"La Weisswurst",detail:"Faite de veau et de lard de porc, aromatisée au persil et au citron, elle ne doit pas, dit-on, « entendre sonner les cloches de midi », car elle était autrefois préparée sans conservateur. L'Allemagne est une mosaïque culinaire : Obatzda et jarret de porc en Bavière, poisson et Labskaus à Hambourg, Currywurst (inventée en 1949 par Herta Heuwer) à Berlin."},
{theme:"gastro",focus:"allemagne",diff:"facile",type:"q",q:"Quelle eau-de-vie de cerises, protégée par une indication géographique, parfume le gâteau Forêt-Noire ?",a:"Le Schwarzwälder Kirschwasser",detail:"Distillée en Forêt-Noire depuis des siècles à partir de cerises de la région, elle doit respecter des règles strictes de production. Le Schwarzwälder Kirschtorte (génoise au chocolat, cerises, crème fouettée, kirsch) est le gâteau allemand le plus connu à l'étranger. L'Allemagne produit aussi de nombreux schnaps de fruits et le Korn, eau-de-vie de grain."},
{theme:"gastro",focus:"allemagne",diff:"moyen",type:"q",q:"Quel rôti de bœuf allemand, mariné plusieurs jours dans du vinaigre et du vin, se prépare différemment selon les régions ?",a:"Le Sauerbraten",detail:"Le Sauerbraten est l'un des plats nationaux allemands disputés (avec la Bratwurst et la Currywurst). La marinade attendrit et parfume le bœuf. La sauce (réduite avec le liquide de marinade) est épaissie différemment selon les régions. En Rhénanie, les Lebkuchen (pain d'épices) ou le Rübenkraut (sirop de betterave) donnent une note sucrée-épicée unique. Servi avec Knödel (quenelles) en Bavière ou Rotkohl (chou rouge) dans le Nord."},
{theme:"gastro",focus:"allemagne",diff:"difficile",type:"q",q:"Pourquoi la loi de pureté de la bière (Reinheitsgebot), promulguée en Bavière en 1516, est-elle aujourd'hui critiquée par des brasseurs artisanaux ?",a:"Parce qu'elle limite les ingrédients (eau, malt, houblon, levure) et exclut fruits, épices, miel ou céréales non maltées utilisés dans d'autres traditions brassicoles",detail:"Promulguée par le duc Guillaume IV de Bavière, la loi ne mentionnait que l'eau, l'orge et le houblon : le rôle de la levure était inconnu, elle a été ajoutée plus tard. Elle visait notamment à réserver le blé et le seigle au pain. Étendue à toute l'Allemagne au début du XXe siècle, elle reste un argument de marketing. Les brasseurs artisanaux lui reprochent de brider l'innovation ; la Weizen nécessite des exceptions."},
{theme:"nature",focus:"allemagne",diff:"facile",type:"q",q:"Quel est le premier parc national créé en Allemagne, en 1970 ?",a:"Le parc national de la Forêt bavaroise (Bayerischer Wald)",detail:"Le parc (environ 24 000 ha) jouxte le parc national tchèque de Šumava, formant l'un des plus grands espaces forestiers protégés d'Europe centrale. Sa devise, « Natur Natur sein lassen » (« laisser la nature être nature »), proscrit toute intervention dans la zone centrale : les arbres morts restent sur place et les scolytes ne sont pas combattus. Cette non-intervention a d'abord choqué les forestiers, mais la forêt s'est régénérée de façon plus diverse."},
{theme:"nature",focus:"allemagne",diff:"moyen",type:"q",q:"Quel terme allemand désigne le dépérissement des forêts attribué aux pluies acides dans les années 1980 ?",a:"Le Waldsterben (« mort des forêts »)",detail:"En novembre 1981, Der Spiegel titre « Der Wald stirbt » (« La forêt meurt »). Les pluies acides, chargées de dioxyde de soufre des centrales et d'oxydes d'azote des voitures, sont mises en cause. L'Allemagne impose la désulfuration des fumées des centrales (1983) et généralise le pot catalytique. Les émissions de soufre chutent de plus de 90 %. Les prévisions catastrophistes se sont révélées exagérées, mais cette inquiétude a profondément marqué la conscience écologique allemande."},
{theme:"nature",focus:"allemagne",diff:"facile",type:"q",q:"Quelles sont les deux plus grandes associations allemandes de protection de la nature ?",a:"Le NABU (Naturschutzbund Deutschland) et le BUND (Bund für Umwelt und Naturschutz Deutschland)",detail:"Le NABU, héritier d'une ligue de protection des oiseaux fondée en 1899, et le BUND (1975) comptent chacun des centaines de milliers de membres. Le mouvement écologiste allemand, nourri par la tradition romantique de la nature (Wald, Heimat), le Waldsterben et les luttes antinucléaires des années 1970-1980 (Wyhl, Brokdorf, Gorleben), a donné naissance aux Verts, entrés au Bundestag en 1983."},
{theme:"nature",focus:"allemagne",diff:"moyen",type:"q",q:"Dans quel Land allemand le loup s'installe-t-il de nouveau en 2000, après environ 150 ans d'absence ?",a:"En Saxe (région de Lusace), venu de Pologne",detail:"Le loup a recolonisé naturellement l'Allemagne depuis la Pologne ; on y compte aujourd'hui plus de 200 meutes. Strictement protégé par la directive européenne Habitats, il tue chaque année plusieurs milliers d'animaux d'élevage, ce qui oppose éleveurs et défenseurs de la nature. En 2024-2025, la Convention de Berne puis l'UE ont abaissé son statut de protection, facilitant les tirs dans certains cas."},
{theme:"nature",focus:"allemagne",diff:"difficile",type:"q",q:"Quelle mesure budgétaire déclenche en janvier 2024 les grandes manifestations d'agriculteurs allemands ?",a:"La suppression progressive de l'avantage fiscal sur le gazole agricole",detail:"Pour combler un trou budgétaire après une décision de la Cour constitutionnelle, le gouvernement Scholz veut supprimer cet avantage, ce qui provoque des blocages de routes dans tout le pays. Les agriculteurs dénoncent aussi les contraintes environnementales et la bureaucratie de la PAC. L'agriculture allemande, très intensive, est confrontée à la pollution des nappes par les nitrates et au déclin des insectes."},
{theme:"nature",focus:"allemagne",diff:"moyen",type:"q",q:"Quel grand fleuve allemand, très pollué par l'industrie de la RDA, a connu une spectaculaire dépollution après la réunification ?",a:"L'Elbe",detail:"En 1990, l'Elbe était l'un des fleuves les plus pollués d'Europe : la région chimique de Bitterfeld y rejetait mercure, métaux lourds et composés organochlorés. La fermeture des usines non rentables et la construction de stations d'épuration améliorent rapidement la qualité de l'eau. Des programmes de réintroduction ont permis le retour des saumons à partir des années 1990. Les sédiments restent par endroits contaminés."},
{theme:"mytho",focus:"allemagne",diff:"moyen",type:"q",q:"Quel héros du Nibelungenlied devient invulnérable en se baignant dans le sang d'un dragon, sauf entre les épaules où s'était posée une feuille de tilleul ?",a:"Siegfried",detail:"Siegfried tue le dragon, s'empare du trésor des Nibelungen et de la Tarnkappe (cape d'invisibilité), puis épouse Kriemhild. Hagen apprend de Kriemhild son point faible et le tue d'un coup de lance lors d'une chasse ; sa mort déclenche la vengeance de Kriemhild. Dans les sources nordiques (saga des Völsungar), le héros s'appelle Sigurd et le dragon Fáfnir. Le parallèle avec le talon d'Achille est frappant."},
{theme:"mytho",focus:"allemagne",diff:"facile",type:"q",q:"Quel recueil des frères Grimm, publié à partir de 1812, rassemble notamment Blanche-Neige, Hänsel et Gretel et Raiponce ?",a:"Les Contes de l'enfance et du foyer (Kinder- und Hausmärchen)",detail:"Jacob et Wilhelm Grimm recueillent surtout ces contes auprès de jeunes femmes cultivées de leur entourage, ainsi que de la conteuse Dorothea Viehmann, veuve d'un tailleur. Les premières éditions sont plus crues : dans Cendrillon, les demi-sœurs se mutilent les pieds pour chausser la pantoufle, et des colombes leur crèvent les yeux. Au fil des sept éditions (jusqu'en 1857), Wilhelm adoucit les allusions sexuelles et transforme la mère de Blanche-Neige en belle-mère. Les Grimm sont aussi les auteurs d'un monumental dictionnaire allemand."},
{theme:"mytho",focus:"allemagne",diff:"moyen",type:"q",q:"Quel bouffon farceur de la tradition germanique, dont le nom évoque une chouette et un miroir, ridiculise les puissants en prenant tout au pied de la lettre ?",a:"Till Eulenspiegel",detail:"Un recueil de ses farces est imprimé à Strasbourg vers 1510-1511. Engagé pour une tâche, il exécute les ordres à la lettre pour mieux tourner en dérision bourgeois, artisans et clercs. Son nom, « chouette-miroir », a reçu diverses interprétations, dont une plus grivoise en bas allemand. Charles De Coster en fait le héros d'un roman flamand contre l'oppression espagnole (1867), et Richard Strauss celui d'un poème symphonique (1895)."},
{theme:"mytho",focus:"allemagne",diff:"difficile",type:"q",q:"Comment le romantisme allemand (Schlegel, Tieck, Novalis, 1795-1815) a-t-il réinventé le Moyen Âge comme âge d'or mythique et les légendes germaniques comme sources de l'identité nationale, contre les Lumières françaises ?",a:"Le romantisme allemand (Jena, 1795) rejette la raison des Lumières pour l'intuition, l'organique, le national — il réhabilite le Moyen Âge gothique, les légendes germaniques et le «Volksgeist» (esprit du peuple) comme fondements de l'identité",detail:"Contre la France des Lumières (universel, rationnel, révolutionnaire), le romantisme d'Iéna (Schlegel, Tieck) valorise le particulier, l'irrationnel, l'historique. Novalis idéalise le Moyen Âge catholique-germanique ('La Chrétienté ou l'Europe', 1799). Les Grimm collectent les 'Märchen' comme patrimoine du Volksgeist. Arnim et Brentano compilent les chants populaires ('Des Knaben Wunderhorn'). Cette mythisation du passé médiéval alimente le nationalisme allemand du XIXe siècle et, dans ses formes extrêmes, l'idéologie nazie."},
{theme:"popculture",focus:"allemagne",diff:"moyen",type:"q",q:"Quel défilé techno berlinois, né en 1989, a réuni jusqu'à 1,5 million de personnes avant de s'achever par le drame de Duisbourg en 2010 ?",a:"La Love Parade",detail:"Lancée par Matthias Roeingh (« Dr Motte ») avec 150 participants comme une « manifestation » pour la paix, la Love Parade devient dans les années 1990 le symbole de la réunification festive de Berlin. En 2010, à Duisbourg, une bousculade dans un tunnel d'accès fait 21 morts et des centaines de blessés ; l'événement est définitivement arrêté. Des clubs comme le Tresor ou le Berghain font toujours de Berlin une capitale de la techno."},
{theme:"popculture",focus:"allemagne",diff:"facile",type:"q",q:"Quel jeu de société allemand de Klaus Teuber (1995) a popularisé dans le monde le genre de l'« eurogame » ?",a:"Catan (Les Colons de Catane)",detail:"Teuber, prothésiste dentaire près de Darmstadt, invente le jeu sur son temps libre. Catan reçoit le Spiel des Jahres (« jeu de l'année ») en 1995 et s'est vendu à plus de 40 millions d'exemplaires. L'eurogame privilégie la stratégie, la négociation et l'absence d'élimination des joueurs ; il inspire Carcassonne, Les Aventuriers du rail ou Dominion. Teuber est mort en 2023."},
{theme:"popculture",focus:"allemagne",diff:"moyen",type:"q",q:"Quel hebdomadaire d'information allemand, fondé en 1947 à Hambourg, est au cœur d'une crise politique majeure en 1962 sous Adenauer ?",a:"Der Spiegel",detail:"Après un article sur les faiblesses de la défense ouest-allemande, des journalistes du Spiegel sont arrêtés pour trahison et ses locaux perquisitionnés. Le scandale, vécu comme une atteinte à la liberté de la presse, pousse le ministre de la Défense Franz Josef Strauss à quitter le gouvernement. En 2018, l'affaire Relotius révèle qu'un journaliste vedette du magazine avait inventé des passages de nombreux reportages."},
{theme:"popculture",focus:"allemagne",diff:"facile",type:"q",q:"Quel trophée récompense le meilleur film au Festival international du film de Berlin (Berlinale) ?",a:"L'Ours d'or (Goldener Bär)",detail:"Fondée en 1951 avec le soutien des Alliés, la Berlinale est une vitrine culturelle de l'Ouest face à Berlin-Est. L'ours est l'emblème de la ville. Avec Cannes et Venise, c'est l'un des trois grands festivals internationaux ; il se distingue par son large public payant et son engagement politique. Des Ours d'argent récompensent la mise en scène et l'interprétation."},
{theme:"sport",focus:"allemagne",diff:"facile",type:"q",q:"Quel surnom désigne la victoire surprise de la RFA sur la Hongrie (3-2) en finale de la Coupe du monde 1954 ?",a:"Le « miracle de Berne »",detail:"La Hongrie de Puskás, Kocsis et Czibor, invaincue depuis 1950, avait battu l'Allemagne 8-3 au premier tour. En finale, la RFA remonte de 0-2 à 3-2, grâce notamment à un doublé de Helmut Rahn. Le pays suit le match à la radio ; le commentateur Herbert Zimmermann s'écrie « Deutschland ist Weltmeister ! ». Ce succès est souvent présenté comme un acte fondateur de l'identité ouest-allemande. L'Allemagne compte 4 titres mondiaux (1954, 1974, 1990, 2014)."},
{theme:"sport",focus:"allemagne",diff:"moyen",type:"q",q:"Quel club de football allemand, le plus titré du pays, a pour devise « Mia san mia » (« Nous sommes ce que nous sommes ») ?",a:"Le Bayern Munich",detail:"Fondé en 1900, le Bayern compte plus de 30 titres de champion d'Allemagne et 6 Ligues des champions. Son président juif Kurt Landauer, écarté par les nazis et interné à Dachau en 1938 avant de s'exiler, reprend la présidence après la guerre. La règle allemande du « 50+1 » impose que les membres détiennent la majorité des droits de vote : Adidas, Audi et Allianz possèdent chacun environ 8 % du capital, le reste appartenant au club et à ses centaines de milliers de membres."},
{theme:"sport",focus:"allemagne",diff:"facile",type:"q",q:"Quel pilote allemand remporte 7 titres de champion du monde de F1, dont 5 consécutifs avec Ferrari (2000-2004) ?",a:"Michael Schumacher (né en 1969)",detail:"Schumacher, né à Hürth et formé en karting à Kerpen, débute en F1 en 1991 (Jordan). Il gagne ses 2 premiers titres avec Benetton (1994, 1995), puis 5 d'affilée avec Ferrari. Ses 91 victoires ont été dépassées par Lewis Hamilton en 2020, qui a aussi égalé ses 7 titres. Ses méthodes ont parfois été controversées (accrochages avec Damon Hill en 1994 et Jacques Villeneuve en 1997). Grièvement blessé dans un accident de ski à Méribel en 2013, il vit depuis à l'abri des regards, sa famille protégeant strictement sa vie privée."},
{theme:"sport",focus:"allemagne",diff:"moyen",type:"q",q:"Quel joueur allemand devient en 1985, à 17 ans, le plus jeune vainqueur du simple messieurs de Wimbledon ?",a:"Boris Becker (né en 1967)",detail:"Non classé tête de série, Becker gagne Wimbledon à 17 ans et 7 mois, puis à nouveau en 1986 et 1989 ; il remporte aussi l'US Open (1989) et l'Open d'Australie (1991, 1996). Après sa retraite, ses affaires tournent mal : déclaré en faillite au Royaume-Uni en 2017, il est condamné en 2022 à 2 ans et demi de prison pour avoir dissimulé des actifs. Libéré après 8 mois, il est expulsé vers l'Allemagne en décembre 2022."}
];

// NAVIGATION
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) {
    s.classList.toggle('hidden', s.id !== id);
  });
}
function goToConfig() {
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('doneScreen').style.display = 'none';
  showScreen('screenConfig');
  updateCardCount();
}
function startGame() {
  showScreen('screenGame');
  doRestart();
}

// CONFIG
function toggleTheme(t) {
  var count = ALL_THEMES.filter(function(x) { return activeThemes[x]; }).length;
  if (activeThemes[t] && count === 1) return;
  activeThemes[t] = !activeThemes[t];
  document.querySelector('[data-theme="' + t + '"]').classList.toggle('active', activeThemes[t]);
  updateCardCount();
}
function selectAll() {
  ALL_THEMES.forEach(function(t) {
    activeThemes[t] = true;
