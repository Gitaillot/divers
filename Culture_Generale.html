{theme:"politique",diff:"moyen",type:"q",q:"Quel pourcentage du vote britannique approuve le Brexit lors du référendum du 23 juin 2016, et quel Premier ministre en avait convoqué la consultation ?",a:"51,9 % ; David Cameron",detail:"Cameron convoque le référendum pour apaiser l'euroscepticisme conservateur, le perd et démissionne. Theresa May voit son accord de retrait rejeté trois fois par le Parlement ; Boris Johnson en obtient un nouveau. Le Royaume-Uni quitte l'UE le 31 janvier 2020, la transition prenant fin le 31 décembre 2020. Le Brexit a créé une frontière douanière de fait en mer d'Irlande."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année et dans quel contexte de crise le G20 est-il créé, remplaçant progressivement le G7 comme forum économique mondial ?",a:"En 1999, après les crises financières asiatique (1997) et russe (1998)",detail:"Le G7 (États-Unis, Japon, Allemagne, France, Royaume-Uni, Italie, Canada) existe depuis 1975 ; la Russie, intégrée en 1997, en est exclue en 2014. Le G20 réunit 19 pays, l'UE et, depuis 2023, l'Union africaine, soit environ 85 % du PIB mondial. D'abord réunion de ministres des Finances, il devient un sommet de chefs d'État lors de la crise de 2008. Ces forums n'ont pas de pouvoir contraignant."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année l'État d'Israël est-il proclamé, et quel conflit immédiat éclate le lendemain avec ses voisins arabes ?",a:"Le 14 mai 1948 ; la première guerre israélo-arabe",detail:"Le sionisme (Herzl, 1896) vise un foyer national juif en Palestine, alors ottomane ; la déclaration Balfour (1917) le promet. La Shoah accélère l'émigration juive. Le plan de partage de l'ONU (1947) est accepté par les dirigeants juifs et rejeté par les États arabes. La guerre de 1948 entraîne l'exode de centaines de milliers de Palestiniens (Nakba). Les accords d'Oslo (1993) n'ont pas abouti à un État palestinien ; l'attaque du Hamas du 7 octobre 2023 a ouvert une guerre dévastatrice à Gaza."},
{theme:"politique",diff:"moyen",type:"q",q:"Quelle chambre du Congrès américain doit approuver les traités internationaux à la majorité des deux tiers ?",a:"Le Sénat",detail:"Le président dirige la politique étrangère et commande les armées, mais le Sénat ratifie les traités et le Congrès déclare la guerre et vote le budget. Le Sénat a ainsi rejeté le traité de Versailles (1919), empêchant l'entrée des États-Unis dans la SDN. La War Powers Resolution (1973) limite à 60 jours un engagement militaire sans autorisation du Congrès. Les « accords exécutifs » permettent au président de contourner la ratification."},
{theme:"politique",diff:"moyen",type:"q",q:"Dans quelle ville néerlandaise siège la CPI, et quel grand pays n'a pas ratifié le statut de Rome la fondant ?",a:"À La Haye ; les États-Unis n'en sont pas membres (pas plus que la Russie, la Chine ou l'Inde)",detail:"La CPI, fondée par le Statut de Rome (1998), siège depuis 2002. Elle juge les individus pour génocide, crimes contre l'humanité, crimes de guerre et crime d'agression, lorsque les États concernés ne le font pas. Les États-Unis ont retiré leur signature en 2002, la Russie en 2016. La Cour a émis des mandats d'arrêt contre Vladimir Poutine (2023) et Benyamin Netanyahou (2024) ; l'ancien président philippin Rodrigo Duterte lui a été remis en 2025."},
{theme:"politique",diff:"moyen",type:"q",q:"Selon la classification de Sartori, quel type de système de partis caractérise une démocratie avec deux grands partis alternant au pouvoir ?",a:"Le bipartisme",detail:"Giovanni Sartori distingue parti unique, parti hégémonique, parti prédominant, bipartisme, multipartisme modéré et multipartisme polarisé. Le bipartisme américain est renforcé par le scrutin majoritaire. L'Allemagne, avec sa proportionnelle à seuil de 5 %, connaît un multipartisme modéré. Le Japon du PLD illustre le parti prédominant. L'érosion des grands partis de masse est un phénomène majeur depuis les années 1990."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel parti d'extrême droite arrive en tête des élections législatives en Italie en 2022, permettant à Giorgia Meloni de devenir Première ministre ?",a:"Fratelli d'Italia (Frères d'Italie)",detail:"Héritier du Mouvement social italien, le parti de Giorgia Meloni obtient environ 26 % des voix en 2022 et forme une coalition avec la Lega et Forza Italia. Les droites radicales progressent dans toute l'Europe : le Rassemblement national arrive en tête des européennes de 2024 en France, l'AfD obtient près de 21 % aux législatives allemandes de 2025. En Hongrie, en revanche, le Fidesz de Viktor Orbán a perdu le pouvoir en 2026. Leurs succès s'expliquent par les crises économiques, migratoires et la défiance envers les élites."},
{theme:"politique",diff:"facile",type:"q",q:"Quel est le rôle de la Banque mondiale et du FMI dans l'économie mondiale ?",a:"Banque mondiale : prêts pour le développement des pays pauvres — FMI (Fonds monétaire international) : stabilité financière internationale, aide aux pays en crise de balance des paiements",detail:"Les deux institutions de Bretton Woods sont créées en 1944 (Conférence de Bretton Woods) à l'initiative de Keynes et White. Le FMI octroie des prêts d'urgence en échange de politiques d'ajustement structurel (coupes budgétaires, privatisations) critiquées pour leur coût social. La Banque mondiale finance routes, hôpitaux, écoles dans les pays en développement. Les BRICS développent leurs propres banques alternatives (Nouvelle banque de développement)."},
{theme:"politique",diff:"facile",type:"q",q:"Quelle loi française de 1982 opère la première grande décentralisation, transférant des compétences aux régions et départements ?",a:"Les lois Defferre (1982-1983)",detail:"La France, héritière d'une tradition jacobine, est l'un des pays les plus centralisés d'Europe. Les lois portées par Gaston Defferre suppriment la tutelle préfectorale a priori, confient l'exécutif départemental et régional à des élus et font des régions des collectivités territoriales. L'« acte II » (2003) inscrit l'organisation décentralisée dans la Constitution. L'Espagne a opté pour un quasi-fédéralisme, l'Allemagne pour le fédéralisme."},
{theme:"politique",diff:"facile",type:"q",q:"Quelle loi de 1905 sépare les Églises de l'État en France, et quel président du Conseil la fait adopter malgré l'opposition du Vatican ?",a:"La loi de séparation des Églises et de l'État du 9 décembre 1905, portée par Aristide Briand et adoptée sous le gouvernement de Maurice Rouvier",detail:"La loi garantit la liberté de conscience et le libre exercice des cultes ; la République ne reconnaît, ne salarie ni ne subventionne aucun culte. Le pape Pie X la condamne en 1906. La laïcité est un principe constitutionnel depuis 1946. La loi de 2004 interdit les signes religieux ostensibles aux élèves des écoles publiques ; les agents publics sont, eux, soumis à un devoir de neutralité. L'Alsace-Moselle conserve le régime concordataire."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année et dans quelle ville les Accords de Paris fixant l'objectif de limiter le réchauffement à 1,5°C sont-ils signés ?",a:"En 2015, à Paris (COP21)",detail:"L'accord de Paris vise à contenir le réchauffement « nettement en dessous de 2 °C » et à poursuivre les efforts pour le limiter à 1,5 °C, grâce à des contributions nationales volontaires. Il succède au protocole de Kyoto (1997), qui imposait des objectifs contraignants aux seuls pays riches. Les États-Unis s'en sont retirés une première fois sous Trump, l'ont réintégré en 2021, puis s'en sont retirés à nouveau en 2025-2026. Les COP annuelles peinent à maintenir l'ambition."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel réseau social est au centre des controverses sur la désinformation lors de l'élection présidentielle américaine de 2016 ?",a:"Facebook (avec le scandale Cambridge Analytica)",detail:"L'Internet Research Agency russe a mené des campagnes sur Facebook et d'autres plateformes lors de la présidentielle de 2016 ; la société Cambridge Analytica a exploité les données de dizaines de millions d'utilisateurs. Le terme « fake news » a été popularisé par Donald Trump pour discréditer les médias. Les deepfakes aggravent le problème. Le règlement européen sur les services numériques (DSA, 2022) impose aux plateformes de lutter contre la désinformation."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel éditorialiste américain parle dès 1990 de « moment unipolaire » pour décrire la domination américaine après la guerre froide ?",a:"Charles Krauthammer",detail:"L'expression, tirée d'un article de Foreign Affairs, décrit les États-Unis devenus seule superpuissance — l'« hyperpuissance » selon Hubert Védrine. La montée de la Chine (2e économie mondiale en 2010), le révisionnisme russe et l'affirmation de puissances régionales dessinent depuis un monde plus multipolaire. Kenneth Waltz jugeait au contraire la bipolarité plus stable que la multipolarité."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel essayiste français popularise dans les années 1990 le terme « Françafrique » pour dénoncer les réseaux d'influence de la France en Afrique ?",a:"François-Xavier Verschave (La Françafrique, 1998)",detail:"L'expression avait été employée positivement en 1955 par l'Ivoirien Félix Houphouët-Boigny. Verschave, président de l'association Survie, la retourne pour désigner un système de soutien à des régimes autoritaires, de réseaux politico-affairistes et de présence militaire. Après les coups d'État au Mali, au Burkina Faso et au Niger (2020-2023), les troupes françaises ont quitté ces pays, puis le Tchad, le Sénégal et la Côte d'Ivoire (2025)."},
{theme:"politique",diff:"difficile",type:"q",q:"Dans quel article de 1992 Alexander Wendt formule-t-il la thèse constructiviste que 'l'anarchie est ce que les États en font' ?",a:"« Anarchy is What States Make of It », publié dans la revue International Organization",detail:"Pour Wendt, les structures du système international ne sont pas données mais construites par les identités, les normes et les interactions des États. Une même anarchie peut être hobbesienne (ennemis), lockéenne (rivaux) ou kantienne (amis) : les États-Unis ne perçoivent pas les armes britanniques comme celles de la Corée du Nord. Le constructivisme étudie l'évolution des normes (droits humains, tabou nucléaire)."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel philosophe canadien publie en 1995 Multicultural Citizenship, défendant les droits des minorités nationales et des groupes ethniques ?",a:"Will Kymlicka",detail:"Kymlicka distingue les minorités nationales (Québécois, peuples autochtones), qui peuvent revendiquer une autonomie, et les groupes issus de l'immigration, qui demandent des aménagements culturels. Il défend un « multiculturalisme libéral ». La démocratie majoritaire peut opprimer les minorités (« tyrannie de la majorité », Tocqueville). La tradition républicaine française refuse les droits communautaires ; aux États-Unis, la Cour suprême a mis fin en 2023 aux préférences raciales dans les admissions universitaires (SFFA v. Harvard)."},
{theme:"politique",diff:"moyen",type:"q",q:"Dans quelle ville indonésienne et en quelle année se tient la conférence fondatrice du mouvement des non-alignés, réunissant 29 pays afro-asiatiques ?",a:"À Bandung, en 1955",detail:"La conférence de Bandung, réunie à l'initiative notamment de Nehru, Nasser, Sukarno et Zhou Enlai, affirme le droit des peuples décolonisés à la non-ingérence et à une voie indépendante des deux blocs. Le Mouvement des non-alignés est fondé à Belgrade en 1961 (Tito, Nehru, Nasser) et compte aujourd'hui 120 membres. Il a perdu de son influence après la guerre froide."},
{theme:"politique",diff:"moyen",type:"q",q:"Quelle crise migratoire de 2015 en Europe, liée au conflit syrien, divise profondément les États membres de l'UE sur la répartition des réfugiés ?",a:"La crise des réfugiés de 2015, ou « crise migratoire européenne »",detail:"Plus d'un million de personnes, fuyant surtout la Syrie, l'Afghanistan et l'Irak, demandent l'asile en Europe en 2015. Les États se divisent sur la répartition des réfugiés : l'Allemagne accueille, la Hongrie ferme ses frontières. L'accord UE-Turquie (2016) limite les arrivées par la mer Égée. Le pacte européen sur la migration et l'asile (2024) durcit les contrôles aux frontières extérieures."},
{theme:"politique",diff:"facile",type:"q",q:"Quelle est la différence entre un traité international et une loi nationale ?",a:"Un traité est un accord entre États, signé et ratifié selon les procédures de chaque pays — en France, les traités ratifiés ont une valeur supérieure à la loi mais inférieure à la Constitution",detail:"Selon l'article 55 de la Constitution, les traités ratifiés ont une autorité supérieure à celle des lois. La Cour de cassation l'applique depuis 1975 (arrêt Jacques Vabre), le Conseil d'État depuis 1989 (arrêt Nicolo). Au Royaume-Uni, de tradition dualiste, un traité n'a d'effet interne qu'après une loi d'incorporation. Aux États-Unis, les traités ratifiés par le Sénat font partie de la « loi suprême du pays »."},
{theme:"politique",diff:"facile",type:"q",q:"Quel traité de 1950, appliqué par la Cour de Strasbourg, garantit les droits fondamentaux dans les 46 États du Conseil de l'Europe ?",a:"La Convention européenne des droits de l'homme",detail:"Tout individu peut saisir la Cour européenne des droits de l'homme après avoir épuisé les recours nationaux. Ses arrêts s'imposent aux États, qui peuvent être condamnés à indemniser et à modifier leur législation. La France a été condamnée à de nombreuses reprises (conditions de détention, droits des étrangers). Au Royaume-Uni, une sortie de la Convention est régulièrement débattue."},
{theme:"politique",diff:"moyen",type:"q",q:"En quel mois et année la Russie déclenche-t-elle son invasion à grande échelle de l'Ukraine, et quelle en est la réaction immédiate de l'OTAN ?",a:"Le 24 février 2022 ; l'OTAN renforce aussitôt son flanc oriental, sans intervenir directement en Ukraine",detail:"Vladimir Poutine invoque la « dénazification » et la menace de l'OTAN pour justifier l'invasion. Les Occidentaux adoptent des sanctions sans précédent (gel des réserves de la banque centrale russe) et livrent des armes à Kiev. La Finlande et la Suède rejoignent l'OTAN. Fin 2024, la Russie occupe environ un cinquième du territoire ukrainien. La guerre a révélé la dépendance européenne au gaz russe et redessiné les alliances."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel congrès européen de 1815, après les guerres napoléoniennes, cherche à établir un équilibre des puissances durable sur le continent ?",a:"Le congrès de Vienne (1814-1815)",detail:"Sous l'égide de Metternich, les vainqueurs de Napoléon redessinent la carte de l'Europe pour qu'aucune puissance ne puisse la dominer. Ce « concert européen » garantit une paix relative jusqu'en 1914, le Royaume-Uni jouant souvent le rôle d'arbitre de l'équilibre. Le principe d'équilibre des puissances, ancien, structure les relations européennes de Westphalie à la Première Guerre mondiale."},
{theme:"politique",diff:"facile",type:"q",q:"Combien de députés composent l'Assemblée nationale française, et pour combien d'années sont-ils élus ?",a:"577 députés, élus pour 5 ans",detail:"Les députés sont élus au scrutin majoritaire uninominal à deux tours, sauf dissolution anticipée. L'Assemblée peut renverser le gouvernement par une motion de censure et a le dernier mot sur le Sénat (348 sénateurs élus au suffrage indirect). L'article 49-3 permet de faire adopter un texte sans vote, sauf motion de censure ; Élisabeth Borne l'a utilisé pour la réforme des retraites de 2023."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel traité de 2007 donne valeur juridique contraignante à la Charte des droits fondamentaux de l'UE ?",a:"Le traité de Lisbonne (signé en 2007, en vigueur en 2009)",detail:"Proclamée en 2000, la Charte réunit une cinquantaine de droits en 6 titres (dignité, libertés, égalité, solidarité, citoyenneté, justice). Elle s'impose aux institutions de l'UE et aux États lorsqu'ils appliquent le droit européen. La Pologne et le Royaume-Uni avaient obtenu un protocole limitant sa justiciabilité sur leur territoire."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel mécanisme de démocratie participative la Convention citoyenne sur le climat (France, 2019-2020) illustre-t-il ?",a:"La démocratie délibérative, par une assemblée de citoyens tirés au sort",detail:"150 citoyens tirés au sort ont formulé 149 propositions pour réduire les émissions de gaz à effet de serre ; une partie a été reprise dans la loi « Climat et résilience » (2021). Le budget participatif de Porto Alegre (1989) est un autre modèle de démocratie participative. Ces dispositifs complètent la démocratie représentative sans la remplacer."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel institut, fondé en 1923, devient sous la direction de Max Horkheimer le berceau de la « théorie critique » ?",a:"L'Institut de recherche sociale de Francfort (« École de Francfort »)",detail:"Fondé grâce au mécène Felix Weil et dirigé par Horkheimer à partir de 1930, l'institut réunit Adorno, Marcuse, Fromm et Benjamin, qui croisent Marx et Freud pour critiquer le capitalisme, l'autoritarisme et l'industrie culturelle. Exilé à New York sous le nazisme, il revient à Francfort en 1950. Habermas en est la grande figure de la seconde génération."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année l'Organisation mondiale du commerce (OMC) remplace-t-elle le GATT, et combien de membres regroupe-t-elle ?",a:"En 1995 ; elle compte 166 membres",detail:"L'OMC succède au GATT (1947). Son mécanisme de règlement des différends permet à de petits pays de contester les politiques commerciales des grandes puissances. Depuis 2019, les États-Unis bloquent la nomination des juges de l'Organe d'appel, paralysant ce mécanisme. Les guerres commerciales sino-américaines et les hausses de droits de douane américaines testent les limites du multilatéralisme commercial."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel partenariat oriental l'UE lance-t-elle en 2009 pour rapprocher d'elle des pays comme l'Ukraine, la Géorgie et la Moldavie ?",a:"Le Partenariat oriental",detail:"Lancé en 2009 dans le cadre de la politique européenne de voisinage, il associe l'Arménie, l'Azerbaïdjan, le Bélarus, la Géorgie, la Moldavie et l'Ukraine. Après l'invasion russe, l'Ukraine et la Moldavie obtiennent le statut de candidat en juin 2022, puis l'ouverture des négociations d'adhésion en 2024. La Géorgie devient candidate en décembre 2023, mais le processus est gelé depuis 2024. Les Balkans occidentaux sont aussi candidats."},
{theme:"politique",diff:"facile",type:"q",q:"Quelle convention internationale de 1961 codifie le droit diplomatique moderne, définissant l'inviolabilité des ambassades ?",a:"La convention de Vienne sur les relations diplomatiques",detail:"Elle garantit l'inviolabilité des locaux diplomatiques et l'immunité des diplomates. La diplomatie permanente naît dans les cités italiennes de la Renaissance ; le congrès de Vienne (1815) fixe les rangs diplomatiques. La convention de Vienne de 1963 codifie, elle, les relations consulaires. La diplomatie publique vise les opinions étrangères (BBC World Service, RFI)."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel traité européen, rejeté par référendum en France et aux Pays-Bas en 2005, tentait de doter l'UE d'une constitution ?",a:"Le traité établissant une Constitution pour l'Europe (signé en 2004)",detail:"Rejeté en 2005 par 54,7 % de « non » en France et 61,5 % aux Pays-Bas, il est abandonné ; l'essentiel de son contenu est repris dans le traité de Lisbonne (2007). L'idée d'une fédération européenne remonte à Victor Hugo (« États-Unis d'Europe », 1849) et au Manifeste de Ventotene d'Altiero Spinelli (1941)."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel événement de 2014 en Ukraine illustre pour la première fois à grande échelle la guerre hybride russe alliant soldats sans insignes et désinformation ?",a:"L'annexion de la Crimée par la Russie (2014)",detail:"Des soldats russes sans insignes (les « petits hommes verts ») prennent le contrôle de la péninsule, avant un référendum non reconnu internationalement. La guerre hybride combine opérations militaires, cyberattaques (NotPetya, 2017), désinformation (Internet Research Agency, RT) et mercenaires (Wagner). Un article du général Guerassimov (2013) est souvent présenté, abusivement, comme sa doctrine officielle."},
{theme:"politique",diff:"facile",type:"q",q:"Quelle convention de Genève de 1951 définit le statut de réfugié et fonde le droit d'asile au niveau international ?",a:"La convention relative au statut des réfugiés (convention de Genève, 1951)",detail:"Elle définit le réfugié comme une personne craignant avec raison d'être persécutée du fait de sa race, de sa religion, de sa nationalité, de son appartenance à un groupe social ou de ses opinions politiques ; le protocole de New York (1967) lève ses limites géographiques et temporelles. Le HCR recense plus de 100 millions de personnes déplacées de force dans le monde depuis 2023."},
{theme:"politique",diff:"facile",type:"q",q:"Quel est le rôle du président de la République française selon la Constitution de 1958 ?",a:"Chef de l'État, garant de la Constitution, commandant en chef des armées, nomme le Premier ministre, préside le Conseil des ministres, peut dissoudre l'Assemblée nationale",detail:"L'article 5 de la Constitution confie au président la mission de veiller au fonctionnement régulier des institutions. Il dispose du domaine réservé (défense, politique étrangère). L'article 16 lui donne des pleins pouvoirs en cas de crise grave. Depuis l'instauration du quinquennat (2002), sa légitimité est renforcée par l'élection directe et l'alignement du mandat avec celui de l'Assemblée."},
{theme:"politique",diff:"facile",type:"q",q:"Quel article de la Constitution française permet au président de soumettre un projet de loi au référendum populaire ?",a:"L'article 11",detail:"De Gaulle utilise le référendum de manière plébiscitaire : en 1962, il fait adopter l'élection du président au suffrage universel direct ; en 1969, son échec sur la régionalisation et la réforme du Sénat le pousse à démissionner. Le traité de Maastricht est approuvé de justesse en 1992 (51 %), la Constitution européenne rejetée en 2005 (55 %). Les révisions constitutionnelles relèvent de l'article 89."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel concept, combinant hard power et soft power, Joseph Nye popularise-t-il dans les années 2000 ?",a:"Le smart power",detail:"Le smart power désigne la capacité à combiner contrainte (militaire, économique) et attraction (culture, valeurs, diplomatie) selon les situations ; l'expression a aussi été employée par Suzanne Nossel (2004) et reprise par Hillary Clinton. Pour Hans Morgenthau (Politics Among Nations, 1948), la puissance est au centre des relations internationales ; elle est relative et dépend du contexte."},
{theme:"politique",diff:"moyen",type:"q",q:"Dans quel ouvrage de 1936 Keynes remet-il en cause l'autorégulation des marchés et justifie l'intervention de l'État en période de récession ?",a:"La Théorie générale de l'emploi, de l'intérêt et de la monnaie",detail:"Keynes y montre qu'en cas de sous-emploi, l'État doit soutenir la demande, quitte à creuser le déficit. La reconstruction d'après 1945 s'en inspire. Milton Friedman et l'école de Chicago privilégient la maîtrise de la masse monétaire (monétarisme). La stagflation des années 1970 affaiblit le keynésianisme ; la crise de 2008 et la pandémie provoquent un retour massif des politiques de relance."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel indice annuel de Transparency International classe les pays selon leur niveau perçu de corruption dans le secteur public ?",a:"L'indice de perception de la corruption (IPC)",detail:"Transparency International classe chaque année 180 pays ; le Danemark, la Finlande et la Nouvelle-Zélande sont en tête. La corruption, abus d'une fonction publique à des fins privées, freine le développement et érode la confiance. En France, Jacques Chirac (2011) et Nicolas Sarkozy ont été condamnés. L'OCDE (1997) et l'ONU (2003) ont adopté des conventions anticorruption."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel philosophe hégélien du XIXe siècle théorise la société civile comme sphère intermédiaire entre la famille et l'État ?",a:"Hegel lui-même (Principes de la philosophie du droit, 1820)",detail:"Pour Hegel, la société civile (bürgerliche Gesellschaft) est la sphère des besoins et des échanges entre individus, entre la famille et l'État. Tocqueville valorise les associations comme écoles de la démocratie ; Gramsci voit dans la société civile le lieu de l'hégémonie culturelle. Les régimes autoritaires cherchent à la contrôler (lois sur les « agents de l'étranger » en Russie)."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel révolutionnaire russe publie en 1917 L'Impérialisme, stade suprême du capitalisme ?",a:"Lénine",detail:"Écrit en 1916, l'ouvrage, inspiré de Hobson et Hilferding, voit dans l'expansion coloniale la conséquence du capitalisme monopolistique et financier, à la recherche de débouchés et de matières premières. La rivalité entre puissances impérialistes expliquerait la Première Guerre mondiale. Cette analyse influence les théories néomarxistes du sous-développement et les études postcoloniales."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel pays ibérique sert de modèle de 'transition par le pacte' après la mort de Franco en 1975, négociant pacifiquement le passage à la démocratie ?",a:"L'Espagne",detail:"Après la mort de Franco (1975), le roi Juan Carlos et le Premier ministre Adolfo Suárez conduisent une « rupture négociée » : loi pour la réforme politique (1976), légalisation du Parti communiste, élections libres (1977), pactes de la Moncloa, Constitution de 1978. Cette transition s'inscrit dans la « troisième vague » de démocratisation (Huntington) qui touche l'Europe du Sud, l'Amérique latine puis l'Europe de l'Est. La tentative de coup d'État de 1981 échoue."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel est le rôle de la Cour de justice de l'Union européenne (CJUE) ?",a:"Juridiction suprême de l'UE garantissant l'interprétation et l'application du droit européen — ses arrêts s'imposent aux États membres et aux juridictions nationales",detail:"La CJUE (Luxembourg) statue sur les recours en manquement (Commission vs État membre), les renvois préjudiciels (questions des juges nationaux), les recours en annulation d'actes européens. Sa jurisprudence a été fondatrice : primauté du droit européen (Van Gend en Loos, 1963 ; Costa v. ENEL, 1964), effet direct des directives, protection des droits fondamentaux. La Pologne et la Hongrie ont contesté sa primauté — créant une crise constitutionnelle majeure."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel philosophe allemand théorise la démocratie délibérative dans Théorie de l'agir communicationnel (1981) ?",a:"Jürgen Habermas",detail:"Pour Habermas, une décision est légitime si elle résulte d'une discussion ouverte à tous, où seule compte la force du meilleur argument. Rawls développe une idée voisine de « raison publique » (Libéralisme politique, 1993). La démocratie délibérative inspire conventions citoyennes et jurys citoyens ; on lui reproche son idéalisme."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année la Chine dépasse-t-elle le Japon pour devenir la deuxième économie mondiale en termes de PIB nominal ?",a:"En 2010",detail:"La Chine combine autoritarisme politique et capitalisme d'État, présenté comme alternative au modèle libéral occidental. La rivalité technologique avec les États-Unis (Huawei, TikTok, semi-conducteurs) recompose les chaînes de valeur mondiales. Graham Allison parle de « piège de Thucydide » : la montée d'une puissance défiant la puissance établie risque de mener à la guerre."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel système de santé universel le Royaume-Uni crée-t-il en 1948, devenant le modèle du service public de santé financé par l'impôt ?",a:"Le National Health Service (NHS)",detail:"Créé en 1948 par le gouvernement travailliste d'Attlee, sur la base du rapport Beveridge, le NHS offre des soins gratuits au point d'accès, financés par l'impôt. Il s'oppose aux systèmes fondés sur l'assurance, comme la Sécurité sociale française (1945) ou le modèle largement privé des États-Unis. La pandémie de Covid-19 a montré le poids politique des décisions sanitaires."},
{theme:"politique",diff:"facile",type:"q",q:"Dans quelle tradition juridique le concept d'État de droit (Rechtsstaat) est-il théorisé au XIXe siècle, signifiant que l'État lui-même est soumis à la loi ?",a:"Dans la tradition juridique allemande (Rechtsstaat)",detail:"L'État de droit implique la hiérarchie des normes, l'indépendance de la justice, le contrôle de constitutionnalité et la protection des droits fondamentaux ; il s'oppose à l'État arbitraire. Le juriste autrichien Hans Kelsen en a théorisé la hiérarchie des normes. La Commission de Venise (Conseil de l'Europe) veille à son respect, et l'UE peut suspendre des fonds en cas de violation (mécanisme de conditionnalité, 2020)."},
{theme:"politique",diff:"facile",type:"q",q:"Qu'est-ce qu'une élection présidentielle en France et comment se déroule-t-elle ?",a:"Élection au suffrage universel direct à deux tours — si aucun candidat n'obtient la majorité absolue au 1er tour, les deux premiers s'affrontent au 2e tour",detail:"L'élection au suffrage universel direct est instaurée par référendum en 1962 (contre la majorité de l'Assemblée). Elle a lieu tous les 5 ans depuis l'instauration du quinquennat (2002). Le 1er tour élimine tous les candidats sauf les deux en tête. Le 2e tour oppose les deux finalistes. La règle des 500 parrainages d'élus est requise pour se présenter. L'entre-deux-tours est une phase clé de mobilisation et d'alliances."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel grand pays industrialisé ne ratifie pas le protocole de Kyoto, vidant de sa substance cet accord de réduction des émissions ?",a:"Les États-Unis",detail:"Adopté en 1997 et entré en vigueur en 2005, le protocole impose des objectifs de réduction aux pays industrialisés. Le Sénat américain avait annoncé son refus dès 1997 (résolution Byrd-Hagel, 95 voix contre 0) ; George W. Bush rejette le protocole en 2001. La Chine, pays en développement, n'a pas d'objectif. Le Canada s'en retire en 2011. L'accord de Paris (2015) le remplace par des engagements nationaux volontaires."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel pourcentage du revenu national brut l'ONU fixe-t-elle en 1970 comme objectif d'aide publique au développement des pays riches ?",a:"0,7 %",detail:"Seuls quelques pays atteignent régulièrement cet objectif (Suède, Norvège, Luxembourg, Danemark) ; la France consacre environ 0,5 % de son RNB à l'aide, et plusieurs donateurs l'ont réduite depuis 2024. L'efficacité de l'aide est débattue : Dambisa Moyo (L'aide fatale, 2009) y voit une source de dépendance, Jeffrey Sachs défend une aide massive et ciblée. Les transferts des migrants dépassent souvent l'aide publique."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel archevêque sud-africain préside la Commission vérité et réconciliation créée après l'apartheid ?",a:"Desmond Tutu",detail:"La Commission (1996-2002) offre l'amnistie aux auteurs de crimes politiques en échange d'aveux complets ; elle devient un modèle de justice transitionnelle. D'autres voies existent : procès des juntes en Argentine (1985), tribunaux communautaires gacaca au Rwanda (2001-2012), qui jugent près de deux millions d'affaires liées au génocide. Tutu avait reçu le prix Nobel de la paix en 1984."},
{theme:"politique",diff:"difficile",type:"q",q:"Depuis quelle année Xi Jinping préside-t-il la Chine, et quel amendement constitutionnel de 2018 supprime la limite de deux mandats ?",a:"Il est président depuis 2013 (secrétaire général du Parti depuis 2012) ; l'amendement de 2018 supprime la limite de deux mandats présidentiels",detail:"Xi Jinping fait inscrire sa « pensée » dans les statuts du Parti (2017) puis dans la Constitution (2018) et obtient un troisième mandat en 2022-2023. Son « rêve chinois » vise la « grande renaissance de la nation chinoise » d'ici 2049, centenaire de la République populaire, après le « siècle d'humiliation » (1839-1949). Les politiques à Hong Kong, au Xinjiang, en mer de Chine méridionale et envers Taïwan s'inscrivent dans cette vision."},
{theme:"politique",diff:"moyen",type:"q",q:"Quelle militante féministe américaine publie en 1963 La Femme mystifiée (The Feminine Mystique), ouvrage qui lance la deuxième vague du féminisme ?",a:"Betty Friedan",detail:"Friedan fonde en 1966 la National Organization for Women (NOW). La première vague du féminisme avait obtenu le droit de vote (Royaume-Uni 1918 puis 1928, États-Unis 1920, France 1944). La deuxième (Beauvoir, Friedan) lutte pour la contraception, l'avortement et l'égalité au travail ; la troisième intègre race et classe (bell hooks, Crenshaw) ; #MeToo (2017) est souvent associé à une quatrième vague. En France, la loi sur la parité date de 2000."},
{theme:"politique",diff:"moyen",type:"q",q:"Quelle loi américaine de 1965 garantit le droit de vote aux Afro-Américains dans les États du Sud où ils en étaient illégalement privés ?",a:"Le Voting Rights Act",detail:"Le mouvement des droits civiques (1955-1968) combat la ségrégation dans le Sud : boycott des bus de Montgomery après le geste de Rosa Parks (1955), marche sur Washington (1963), marches de Selma (1965). Le président Johnson fait adopter le Civil Rights Act (1964) puis le Voting Rights Act, qui interdit les tests d'alphabétisation et place sous contrôle fédéral les États discriminatoires. Martin Luther King est assassiné en 1968. En 2013, la Cour suprême a affaibli la loi (Shelby County v. Holder)."},
{theme:"politique",diff:"facile",type:"q",q:"Combien d'États membres l'ONU compte-t-elle, et quel est le dernier pays à l'avoir rejointe en 2011 ?",a:"193 membres ; le dernier admis est le Soudan du Sud (2011)",detail:"L'ONU naît à San Francisco le 26 juin 1945 et succède à la SDN. Ses 6 organes principaux sont l'Assemblée générale, le Conseil de sécurité, le Secrétariat, la Cour internationale de justice, le Conseil économique et social et le Conseil de tutelle (inactif depuis 1994). Le Saint-Siège et la Palestine sont États observateurs. António Guterres est secrétaire général jusqu'au 31 décembre 2026 ; son successeur entre en fonction en 2027."},
{theme:"politique",diff:"facile",type:"q",q:"Quel politologue américain forge en 1971 le terme de « polyarchie » pour désigner les démocraties réellement existantes ?",a:"Robert Dahl",detail:"Dans Polyarchy, Dahl définit la démocratie concrète par deux dimensions : la participation (droit de vote étendu) et la contestation (libre compétition politique), garanties par des institutions comme des élections libres, la liberté d'expression et d'association, et des sources d'information pluralistes. L'indice de démocratie de The Economist classe 167 pays, dont une vingtaine de « démocraties pleines »."},
{theme:"politique",diff:"moyen",type:"q",q:"Dans quelle ville néerlandaise le traité créant l'Union européenne est-il signé en 1992, et quel pays le rejette d'abord par référendum avant de le ratifier ?",a:"À Maastricht ; le Danemark le rejette par référendum en juin 1992, avant de l'approuver en 1993",detail:"Signé le 7 février 1992 et entré en vigueur le 1er novembre 1993, le traité transforme les Communautés en Union européenne, organisée en trois piliers (Communautés, PESC, justice et affaires intérieures). Il crée la citoyenneté européenne et fixe les critères de convergence pour l'euro (déficit inférieur à 3 % du PIB, dette inférieure à 60 %). L'euro devient monnaie de compte en 1999, les pièces et billets circulent en 2002."},
{theme:"politique",diff:"difficile",type:"q",q:"Dans quelle revue Huntington publie-t-il en 1993 son article fondateur sur le 'choc des civilisations', avant d'en faire un livre en 1996 ?",a:"Dans Foreign Affairs",detail:"Huntington y prédit que les conflits de l'après-guerre froide opposeront de grandes civilisations (occidentale, islamique, confucéenne, orthodoxe, hindoue…), le long de « lignes de fracture ». Les attentats du 11 septembre 2001 ont paru lui donner raison. Ses critiques lui reprochent d'essentialiser les cultures et d'ignorer les conflits internes aux civilisations ; Amartya Sen (Identité et violence, 2006) rappelle que les identités sont plurielles."},
{theme:"politique",diff:"facile",type:"q",q:"Quel pays impose depuis 1924 le vote obligatoire pour ses élections fédérales ?",a:"L'Australie",detail:"Les abstentionnistes sans motif valable y paient une amende, et la participation dépasse 90 %. Une vingtaine de pays pratiquent le vote obligatoire, comme la Belgique et le Luxembourg. Ailleurs, l'abstention progresse : elle a dépassé 50 % au premier tour des législatives françaises de 2022. Aux États-Unis, les lois exigeant une pièce d'identité pour voter sont accusées de pénaliser les minorités."},
{theme:"politique",diff:"moyen",type:"q",q:"Quelle loi américaine de 2022 consacre environ 370 milliards de dollars à la transition énergétique, symbole du retour de la politique industrielle ?",a:"L'Inflation Reduction Act (IRA)",detail:"Critiquée depuis les années 1980, la politique industrielle revient en force après la pandémie (pénuries de masques, de médicaments, de semi-conducteurs) et face aux subventions chinoises. L'IRA, adoptée sous Joe Biden, accorde des crédits d'impôt aux énergies propres et aux véhicules électriques produits aux États-Unis ; une loi budgétaire de 2025 en a supprimé une partie. Les Chips Acts américain et européen visent à relocaliser la production de semi-conducteurs."},
{theme:"philo",diff:"facile",type:"d",q:"Méthode philosophique consistant à progresser vers la vérité par questions et réponses",a:"La maïeutique (ou dialectique socratique)",detail:"Socrate comparait son art à celui de sa mère sage-femme : il « accouchait » les esprits de leurs idées. Il ne prétendait rien savoir, guidant son interlocuteur à découvrir lui-même la vérité."},
{theme:"philo",diff:"facile",type:"q",q:"Quelle est la formule fondatrice de la philosophie de Descartes ?",a:"« Je pense, donc je suis » (Cogito ergo sum)",detail:"Dans le Discours de la méthode (1637), écrit en français, Descartes doute de tout jusqu'à trouver une certitude indubitable : s'il doute, il pense ; s'il pense, il existe. La formule latine « cogito, ergo sum » apparaît dans les Principes de la philosophie (1644). C'est le point de départ de la philosophie moderne du sujet."},
{theme:"philo",diff:"facile",type:"q",q:"Quel philosophe grec a classifié le savoir en disciplines et fondé la logique ?",a:"Aristote",detail:"Élève de Platon et précepteur d'Alexandre le Grand, Aristote fonde le Lycée à Athènes. Il pose les bases de la logique (syllogisme), de la biologie, de la physique et de la politique."},
{theme:"philo",diff:"moyen",type:"q",q:"Pour Sartre, que signifie « l'existence précède l'essence » ?",a:"L'homme n'a pas de nature prédéfinie — il se crée par ses choix",detail:"Dans L'Existentialisme est un humanisme (1945), Sartre affirme que l'homme, contrairement à un objet, n'a pas d'essence fixée à l'avance. Il est « condamné à être libre » et entièrement responsable de lui-même."},
{theme:"philo",diff:"moyen",type:"q",q:"Quelle distinction Kant établit-il entre « phénomène » et « noumène » ?",a:"Le phénomène est ce que nous percevons ; le noumène (chose en soi) est inaccessible",detail:"Dans la Critique de la raison pure (1781), Kant montre que notre connaissance est limitée aux apparences. La réalité indépendante de notre perception reste inconnaissable."},
{theme:"philo",diff:"moyen",type:"d",q:"Courant philosophique du XIXe s. pour lequel la vérité se mesure à l'utilité pratique d'une idée",a:"Le pragmatisme",detail:"Développé par Peirce, James et Dewey aux États-Unis. William James : « Le vrai, c'est simplement l'expédient dans notre façon de penser. » Il influencera profondément la pensée américaine."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'appelle-t-on la « guillotine de Hume » en philosophie morale ?",a:"L'impossibilité logique de dériver un « devoir être » d'un simple constat de fait",detail:"Hume remarque dans le Traité de la nature humaine (1739) qu'on passe subrepticement des faits aux normes sans justification. « Les hommes sont ainsi faits, donc ils devraient... » est un saut injustifié."},
{theme:"philo",diff:"difficile",type:"q",q:"Quelle est la thèse centrale du Contrat social de Rousseau ?",a:"La légitimité politique naît d'un pacte par lequel les individus s'en remettent à la « volonté générale »",detail:"Rousseau (1762) distingue la volonté de tous (intérêts particuliers) et la volonté générale (intérêt commun). Cette pensée inspirera la Révolution française et le concept de souveraineté populaire."},
{theme:"philo",diff:"difficile",type:"d",q:"Concept nietzschéen désignant la réévaluation des valeurs par les faibles pour retourner la domination des forts",a:"La morale du ressentiment (transvaluation des valeurs)",detail:"Dans La Généalogie de la morale (1887), Nietzsche décrit la « révolte des esclaves dans la morale » : animés par le ressentiment, les faibles déclarent « bonnes » l'humilité et la faiblesse, et « mauvaises » la force et la vitalité des « maîtres ». Nietzsche appelle à une nouvelle « transvaluation de toutes les valeurs »."},
{theme:"philo",diff:"facile",type:"q",q:"Qui est Platon et quelle est l'allégorie de la caverne ?",a:"Philosophe grec (428-348 av. J.-C.), élève de Socrate — l'allégorie de la caverne illustre la condition humaine face à l'ignorance",detail:"Des prisonniers enchaînés prennent les ombres sur le mur pour la réalité. Celui qui se libère accède à la vérité (les Idées). Cette allégorie illustre la distinction platonicienne entre monde sensible (apparences) et monde intelligible (vérités éternelles). Le philosophe-roi doit redescendre éclairer ses concitoyens."},
{theme:"philo",diff:"facile",type:"q",q:"Qu'est-ce que l'éthique d'Aristote et le juste milieu ?",a:"L'éthique aristotélicienne vise le bonheur (eudaimonia) par la vertu — la vertu est le juste milieu entre deux excès",detail:"Dans l'Éthique à Nicomaque, Aristote définit le bonheur comme activité de l'âme conforme à la vertu. La vertu est une disposition acquise par l'habitude. Le courage est le juste milieu entre lâcheté et témérité. L'homme est un animal politique qui s'accomplit dans la cité."},
{theme:"philo",diff:"facile",type:"q",q:"Quel philosophe grec fonde le stoïcisme vers 300 av. J.-C., et dans quel lieu d'Athènes enseigne-t-il ?",a:"Zénon de Kition ; il enseigne sous le Portique peint (Stoa poikilè), d'où le nom de l'école",detail:"Le stoïcisme prône la maîtrise des passions et l'accord avec la raison qui gouverne le monde. Il distingue ce qui dépend de nous (jugements, désirs) de ce qui n'en dépend pas (corps, biens, mort). Ses grandes figures romaines sont Sénèque, Épictète, esclave affranchi, et l'empereur Marc Aurèle."},
{theme:"philo",diff:"facile",type:"q",q:"Quel état de tranquillité de l'âme Épicure place-t-il au cœur du bonheur, obtenu en ne satisfaisant que les désirs naturels et nécessaires ?",a:"L'ataraxie (absence de trouble de l'âme), complétée par l'aponie (absence de douleur du corps)",detail:"Épicure (341-270 av. J.-C.) classe les désirs en naturels et nécessaires (manger, boire), naturels non nécessaires (mets raffinés) et vains (richesse, gloire). Le sage se contente des premiers et cultive l'amitié. Loin de la caricature, l'épicurisme est une éthique de la sobriété. Il se distingue du stoïcisme, qui recherche la vertu plutôt que le plaisir."},
{theme:"philo",diff:"facile",type:"q",q:"Quel philosophe britannique du XVIIe siècle pose les bases de l'empirisme en affirmant que toute connaissance vient de l'expérience sensible ?",a:"John Locke (Essai sur l'entendement humain, 1689)",detail:"Pour Locke, l'esprit est à la naissance une « table rase » sur laquelle l'expérience inscrit ses idées. Berkeley (« être, c'est être perçu ») et Hume, pour qui la causalité n'est qu'une habitude de l'esprit, prolongent l'empirisme. Il s'oppose au rationalisme de Descartes et de Leibniz, qui défendent l'existence d'idées innées."},
{theme:"philo",diff:"facile",type:"q",q:"Qui est Immanuel Kant et quel est son apport fondamental ?",a:"Philosophe allemand (1724-1804) — révolution copernicienne : l'esprit impose ses structures au monde, non l'inverse",detail:"Kant synthétise empirisme (Hume) et rationalisme (Leibniz). La Critique de la raison pure (1781) examine les conditions de la connaissance. La Critique de la raison pratique (1788) fonde la morale sur l'impératif catégorique."},
{theme:"philo",diff:"facile",type:"q",q:"Qu'est-ce que l'impératif catégorique de Kant ?",a:"Principe moral universel : agis selon une maxime que tu peux vouloir voir devenir une loi universelle",detail:"L'impératif catégorique commande sans condition. Sa 2e formulation : traite l'humanité toujours en même temps comme une fin, jamais simplement comme un moyen. Il fonde une éthique déontologique basée sur le devoir, indépendamment des conséquences."},
{theme:"philo",diff:"facile",type:"q",q:"Quel ouvrage collectif en 28 volumes, dirigé par Diderot et d'Alembert, synthétise l'esprit des Lumières au XVIIIe siècle ?",a:"L'Encyclopédie (1751-1772)",detail:"L'Encyclopédie, ou Dictionnaire raisonné des sciences, des arts et des métiers compte 17 volumes de texte et 11 de planches. Interdite à plusieurs reprises, elle diffuse les savoirs et l'esprit critique des Lumières, mouvement fondé sur la raison, la science et la liberté (Voltaire, Montesquieu, Rousseau, Diderot). Kant définit les Lumières comme la sortie de l'homme hors de l'état de minorité dont il est lui-même responsable."},
{theme:"philo",diff:"facile",type:"q",q:"Dans quel ouvrage de 1882 Nietzsche fait-il prononcer pour la première fois la formule 'Dieu est mort' par un personnage ?",a:"Le Gai Savoir (aphorisme 125, « L'insensé »)",detail:"Un « insensé » y annonce : « Dieu est mort ! […] Et c'est nous qui l'avons tué ! » Nietzsche (1844-1900) constate que les valeurs chrétiennes ont perdu leur fondement et redoute le nihilisme ; il appelle à créer de nouvelles valeurs (surhomme, volonté de puissance, éternel retour). Sa sœur Elisabeth a favorisé sa récupération par les nazis, largement contraire à sa pensée."},
{theme:"philo",diff:"facile",type:"q",q:"Quelle conférence publique de 1945 à Paris, prononcée par Sartre, popularise l'existentialisme et pose sa thèse centrale ?",a:"« L'existentialisme est un humanisme », prononcée le 29 octobre 1945",detail:"Sartre y défend l'idée que « l'existence précède l'essence » : l'homme se définit par ses actes. Kierkegaard est considéré comme le précurseur de l'existentialisme au XIXe siècle. Heidegger (Être et Temps, 1927) inspire le mouvement, tout en refusant l'étiquette. Beauvoir (Le Deuxième Sexe, 1949) applique l'existentialisme à la condition féminine ; Camus récusait aussi le terme."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la dialectique hégélienne ?",a:"Chez Hegel, le réel se développe par contradictions surmontées (thèse-antithèse-synthèse) — mouvement de l'Esprit vers sa réalisation totale",detail:"Dans la Phénoménologie de l'esprit (1807), chaque figure de la conscience suscite sa négation, surmontée dans une unité supérieure (Aufhebung, qui à la fois supprime, conserve et dépasse). Le schéma « thèse-antithèse-synthèse » vient plutôt de Fichte et des manuels que de Hegel lui-même. Marx renverse la dialectique : ce sont les conditions matérielles, non l'Esprit, qui meuvent l'histoire."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que le matérialisme historique de Marx ?",a:"L'histoire est déterminée par les conditions matérielles de production (infrastructure) qui conditionnent les idées et les institutions (superstructure)",detail:"Marx : ce n'est pas la conscience des hommes qui détermine leur existence, c'est leur existence sociale qui détermine leur conscience. La lutte des classes est le moteur de l'histoire. Cette approche révolutionne les sciences sociales."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la phénoménologie de Husserl ?",a:"Edmund Husserl (1859-1938) — méthode décrivant les structures de l'expérience consciente avant toute théorie : retour aux choses mêmes",detail:"La réduction phénoménologique met entre parenthèses les jugements d'existence. Heidegger, Merleau-Ponty et Sartre s'en inspirent. Merleau-Ponty (Phénoménologie de la perception, 1945) analyse le corps vécu comme lieu de l'expérience."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que l'utilitarisme de Bentham et Mill ?",a:"Théorie morale : la bonne action est celle qui maximise le bonheur du plus grand nombre — Jeremy Bentham (1748-1832) et John Stuart Mill (1806-1873)",detail:"Bentham calcule le bonheur par intensité, durée, certitude. Mill affine : certains plaisirs sont qualitativement supérieurs. L'utilitarisme influence l'économie du bien-être et l'éthique médicale."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie de la justice de John Rawls ?",a:"Rawls (Théorie de la justice, 1971) : une société juste est celle que des individus choisiraient derrière un voile d'ignorance",detail:"Derrière le voile d'ignorance, on ignore sa classe sociale, ses talents, son sexe. Deux principes : égalité des libertés fondamentales ; les inégalités ne sont justifiées que si elles bénéficient aux plus défavorisés (principe de différence)."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la déconstruction de Jacques Derrida ?",a:"Méthode philosophique (1967) révélant les tensions et présupposés cachés dans les textes — critique de la métaphysique de la présence",detail:"Derrida (De la grammatologie, 1967) déconstruit la hiérarchie oral/écrit. La différance désigne le jeu de différences qui produit le sens sans jamais l'atteindre totalement. La déconstruction influence les études littéraires, le féminisme et le postcolonialisme."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que le droit naturel en philosophie ?",a:"Courant (Aristote, Cicéron, Grotius, Locke) selon lequel il existe des droits universels indépendants des législations humaines",detail:"Aristote distingue le juste naturel (universel) et le juste légal (conventionnel). Locke : les droits naturels (vie, liberté, propriété) précèdent l'État. La Déclaration des droits de l'homme (1789) et la Déclaration universelle (1948) s'y fondent."},
{theme:"philo",diff:"moyen",type:"q",q:"Dans quel ouvrage posthume de 1677 Spinoza développe-t-il sa philosophie more geometrico, identifiant Dieu et la Nature ?",a:"L'Éthique",detail:"Publiée après sa mort, en 1677, l'Éthique est construite « à la manière des géomètres » (définitions, axiomes, propositions démontrées). Spinoza (1632-1677) y identifie Dieu et la Nature (Deus sive Natura), substance unique. Excommunié par la communauté juive d'Amsterdam en 1656, à 23 ans, il conçoit la liberté non comme libre arbitre mais comme compréhension de la nécessité qui nous détermine."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que le scepticisme et le doute cartésien ?",a:"Descartes utilise le doute hyperbolique comme méthode pour trouver une vérité indubitable — le Cogito résiste à tout doute",detail:"Descartes radicalise le scepticisme : et si un malin génie m'induisait toujours en erreur ? Mais le doute lui-même prouve que je pense, donc que j'existe. Hume renouvelle le scepticisme : la causalité et l'identité personnelle ne sont que des habitudes."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que le positivisme d'Auguste Comte ?",a:"Auguste Comte (1798-1857) : la pensée passe par trois stades — théologique, métaphysique, positif (scientifique)",detail:"La Loi des trois états : l'humanité explique les phénomènes d'abord par des dieux, puis par des forces abstraites, enfin par des lois empiriques. Comte fonde la sociologie. Il inspire le Cercle de Vienne et le positivisme logique."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la philosophie de l'absurde de Camus ?",a:"Camus (Le Mythe de Sisyphe, 1942) : l'absurde naît du désir de sens de l'homme face au silence du monde — il faut l'affronter sans fuir",detail:"Face à l'absurde, Camus écarte deux fuites : le suicide physique et le « suicide philosophique » (le saut dans la foi ou dans une transcendance). Il prône la révolte lucide, qui consiste à vivre pleinement sans espoir d'un sens ultime : « il faut imaginer Sisyphe heureux ». Sa rupture avec Sartre, en 1952, porte sur L'Homme révolté et sur le communisme."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que le structuralisme en philosophie et sciences humaines ?",a:"Courant des années 1960 analysant les phénomènes humains comme des systèmes de relations — Lévi-Strauss, Lacan, Althusser, Barthes",detail:"Le structuralisme s'inspire de Saussure : le sens naît des différences entre signes. Lévi-Strauss applique cette méthode aux mythes. Le post-structuralisme (Derrida, Foucault) critique le structuralisme mais en hérite."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la biopolitique de Michel Foucault ?",a:"La gestion politique de la vie des populations (natalité, santé, hygiène, longévité) par l'État moderne",detail:"Dans La Volonté de savoir (1976), Foucault oppose le pouvoir souverain, qui consiste à « faire mourir et laisser vivre », au biopouvoir moderne, qui vise à « faire vivre et laisser mourir ». Le biopouvoir combine le pouvoir disciplinaire sur les corps individuels, analysé dans Surveiller et punir (1975) — prisons, écoles, hôpitaux —, et la biopolitique, qui régule les populations."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que l'éthique du care de Carol Gilligan ?",a:"Courant féministe (In a Different Voice, 1982) valorisant la sollicitude et l'attention aux besoins d'autrui contre l'éthique universaliste abstraite",detail:"Gilligan critique Kohlberg : les femmes développent une morale du care différente de la morale de la justice. Joan Tronto (1993) en fait une théorie politique : le care est une pratique sociale exigeant redistribution et reconnaissance."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que l'être-au-monde selon Heidegger ?",a:"Heidegger (Être et Temps, 1927) : l'être humain (Dasein) est toujours déjà dans le monde, avec les autres, dans la temporalité",detail:"Heidegger veut rouvrir la question de l'être. Le Dasein est un être-au-monde (In-der-Welt-sein), être-avec (Mitsein), être-pour-la-mort. Son engagement nazi (1933-1934) reste une question éthique ouverte."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que le critère de réfutabilité de Karl Popper ?",a:"Popper (1934) : une théorie est scientifique si elle peut être réfutée (falsifiable) — distingue la science de la pseudo-science",detail:"Un seul cygne noir suffit à réfuter tous les cygnes sont blancs. La science progresse par conjectures et réfutations. Kuhn (Structure des révolutions scientifiques, 1962) répond : la science progresse par paradigmes, non par réfutations individuelles."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que le problème difficile de la conscience selon Chalmers ?",a:"David Chalmers (1995) : expliquer pourquoi des processus physiques donnent lieu à une expérience subjective (qualia) reste irréductible à la neurologie",detail:"Le problème facile : expliquer les fonctions cognitives. Le problème difficile : pourquoi y a-t-il quelque chose que cela fait d'être un être conscient ? Le physicalisme, le dualisme et le panpsychisme proposent des réponses."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la philosophie de Simone de Beauvoir ?",a:"Beauvoir (Le Deuxième Sexe, 1949) : On ne naît pas femme, on le devient — la féminité est une construction sociale",detail:"Beauvoir applique l'existentialisme à la condition féminine. La femme est définie comme l'Autre par rapport à l'homme universel. La liberté authentique exige de se projeter dans des projets qui transcendent la condition assignée."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la banalité du mal selon Hannah Arendt ?",a:"Arendt (Eichmann à Jérusalem, 1963) : le mal peut être accompli sans intention malveillante, par simple absence de pensée",detail:"Arendt assiste en 1961 au procès d'Adolf Eichmann, organisateur de la déportation des Juifs. Elle y voit un bureaucrate zélé, incapable de penser par lui-même, plutôt qu'un monstre. Sa thèse, souvent mal comprise, ne dit pas que la Shoah est banale, mais que des crimes immenses peuvent être commis par des hommes sans profondeur diabolique. Elle a suscité une vive controverse."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la raison instrumentale selon l'École de Francfort ?",a:"Horkheimer et Adorno (Dialectique de la Raison, 1944) : la raison des Lumières, en se mettant au service de la domination, se retourne contre elle-même",detail:"La raison devait libérer. En devenant instrumentale (outil pour dominer), elle produit le totalitarisme et l'industrie culturelle. Habermas répond en distinguant raison communicationnelle et raison instrumentale."},
{theme:"philo",diff:"moyen",type:"q",q:"Quel philosophe médiéval tente de concilier la raison aristotélicienne et la foi chrétienne dans la Somme théologique ?",a:"Thomas d'Aquin",detail:"La scolastique (XIe-XIVe siècle) cherche à concilier la foi chrétienne et la raison philosophique. Thomas d'Aquin (Somme théologique, 1266-1273) intègre la philosophie d'Aristote, redécouverte en Occident via les commentateurs arabes, à la théologie chrétienne. Anselme de Cantorbéry formule la preuve ontologique ; la querelle des universaux oppose réalistes et nominalistes."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la querelle des universaux au Moyen Âge ?",a:"Débat sur le statut des concepts généraux — réalisme (les universaux existent réellement), nominalisme (Guillaume d'Occam : ce ne sont que des noms)",detail:"La question : le concept de rouge a-t-il une existence indépendante des choses rouges ? Occam (rasoir d'Occam) dit non : seules les choses individuelles existent. Ce débat préfigure les discussions en philosophie du langage."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la preuve ontologique d'Anselme de Cantorbéry ?",a:"Dieu est ce dont on ne peut rien concevoir de plus grand — un tel être doit donc exister en réalité",detail:"Anselme (Proslogion, 1078) : si Dieu n'existe que dans l'esprit, je peux en concevoir un identique mais existant en réalité, donc plus grand. Kant réfute l'argument : l'existence n'est pas un prédicat."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la phronesis (prudence pratique) d'Aristote ?",a:"Faculté intellectuelle permettant de délibérer correctement sur ce qui est bon dans des situations concrètes — irréductible à la science",detail:"La phronesis (Éthique à Nicomaque, livre VI) est la vertu de l'intelligence pratique. Elle diffère de l'épistémè (connaissance théorique) et de la techné (savoir-faire). Le phronimos est l'homme prudent, doté de l'expérience pour agir bien."},
{theme:"philo",diff:"facile",type:"q",q:"Qu'est-ce que le dualisme cartésien ?",a:"Descartes distingue deux substances : la res cogitans (chose pensante, l'esprit) et la res extensa (chose étendue, le corps)",detail:"Le dualisme pose le problème corps-esprit : comment des substances radicalement différentes interagissent-elles ? Les solutions : occasionnalisme (Malebranche), monisme (Spinoza), matérialisme (Hobbes). Le problème reste central en philosophie de l'esprit."},
{theme:"philo",diff:"facile",type:"q",q:"Qu'est-ce que la théorie des Idées chez Platon ?",a:"Les Idées sont des réalités intelligibles éternelles dont les choses sensibles sont des copies imparfaites",detail:"Les choses sensibles participent aux Idées sans jamais les égaler. L'Idée du Bien est au sommet, comme le soleil pour le visible. Aristote critique la séparation des Idées et des choses (argument du troisième homme)."},
{theme:"philo",diff:"moyen",type:"q",q:"Quelles sont les quatre nobles vérités du bouddhisme, telles que le Bouddha les énonce lors de son premier sermon ?",a:"La vie est souffrance (dukkha) ; la souffrance naît de la soif ou du désir (tanha) ; elle peut cesser (nirvana) ; le Noble Chemin octuple mène à cette cessation",detail:"Le Bouddha les énonce dans le parc des Gazelles à Sarnath, près de Bénarès. Le bouddhisme est une philosophie autant qu'une religion. Il reconnaît trois caractéristiques de l'existence : l'impermanence (anicca), l'absence de soi permanent (anatta) et la souffrance (dukkha)."},
{theme:"philo",diff:"moyen",type:"q",q:"Quel concept central Confucius place-t-il au cœur de sa philosophie morale, traduit par humanité ou bienveillance ?",a:"Le ren (« humanité », « bienveillance »)",detail:"Pour Confucius (551-479 av. J.-C.), le ren s'exprime à travers les rites (li), qui ordonnent les relations sociales, et la piété filiale (xiao). Les Entretiens rassemblent son enseignement. Le confucianisme a structuré la pensée politique et morale de la Chine, de la Corée, du Japon et du Vietnam pendant plus de deux millénaires."},
{theme:"philo",diff:"moyen",type:"q",q:"Quel est le rôle de la philosophie islamique médiévale dans la transmission d'Aristote ?",a:"Les philosophes arabes (Al-Kindi, Avicenne, Averroès) ont traduit et commenté Aristote, transmettant sa philosophie à l'Occident médiéval",detail:"Ibn Sina (Avicenne, 980-1037) : Canon de la médecine et oeuvre philosophique monumentale. Ibn Rushd (Averroès, 1126-1198) commente Aristote si profondément qu'il est surnommé le Commentateur. Ses oeuvres en latin influencent Thomas d'Aquin."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que le pragmatisme de William James ?",a:"James (1842-1910) : une idée est vraie si elle fonctionne dans la pratique — la vérité n'est pas une copie du réel mais un outil d'action",detail:"James (Pragmatism, 1907) : le test d'une idée est ses conséquences pratiques. Dewey applique le pragmatisme à l'éducation. Rorty abandonne la notion de vérité objective. Le pragmatisme est la philosophie américaine par excellence."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la distinction sens/référence de Frege ?",a:"Frege (1892) : une expression a un sens (la façon dont elle présente son objet) et une référence (l'objet lui-même) — l'étoile du matin et l'étoile du soir ont même référence (Vénus) mais sens différents",detail:"Cette distinction résout le puzzle de l'identité : l'étoile du matin = l'étoile du soir est informatif bien que les deux termes désignent Vénus. Fondamentale pour la philosophie du langage, la logique et la sémantique."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que le transhumanisme et ses enjeux philosophiques ?",a:"Courant promouvant l'amélioration humaine par la technologie — questions : identité personnelle, justice, définition de l'humain",detail:"Le transhumanisme vise le dépassement de l'humain par la biotechnologie et l'IA. Questions : si je télécharge mon esprit, suis-je encore moi ? Qui aura accès à ces améliorations ? Michael Sandel défend les limites comme condition de l'éthique."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que le néoplatonisme de Plotin ?",a:"Plotin (IIIe s.) : l'Un (Dieu) se déploie en niveaux d'être (Intellect, Âme) — influencera Augustin et la mystique chrétienne",detail:"Plotin (Ennéades) développe une hiérarchie ontologique : l'Un, l'Intellect, l'Âme. La remontée vers l'Un est l'objectif de la vie philosophique. Augustin d'Hippone synthétise Plotin et christianisme, façonnant la théologie médiévale."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la théorie pure du droit de Hans Kelsen ?",a:"Kelsen (1881-1973) : le droit est une hiérarchie de normes dont la validité remonte à une norme fondamentale (Grundnorm)",detail:"La Théorie pure du droit (1934) veut faire du droit une science rigoureuse. La validité d'une norme vient d'une norme supérieure, jusqu'à la Grundnorm. Kelsen rédige la Constitution autrichienne de 1920 et conçoit le modèle de Cour constitutionnelle centralisée."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que le vitalisme de Bergson et la durée ?",a:"Henri Bergson (1859-1941) : la vie et la conscience échappent aux catégories de l'intelligence — la durée (temps vécu) est irréductible au temps mesurable",detail:"L'Essai sur les données immédiates de la conscience (1889) distingue le temps de l'horloge et la durée réelle. L'élan vital (L'Évolution créatrice, 1907) est le principe d'imprévisibilité de la vie. Bergson reçoit le prix Nobel de littérature (1927)."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que l'éthique déontologique par opposition au conséquentialisme ?",a:"Déontologie (Kant) : l'acte est moral selon sa conformité au devoir — conséquentialisme (Mill, Bentham) : l'acte est moral si ses conséquences maximisent le bien",detail:"Kant condamne le mensonge même pour sauver un innocent. Le conséquentialiste peut justifier un mal mineur pour un bien majeur. Les dilemmes du trolley problem illustrent la tension. L'éthique des vertus (Aristote) propose une troisième voie."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que le pari de Pascal ?",a:"Pascal (1623-1662) : si Dieu existe, croire fait gagner un bien infini ; s'il n'existe pas, on ne perd presque rien — il est donc rationnel de parier sur Dieu",detail:"Le Pari (Pensées, fragment 418) : si vous croyez et que Dieu existe, gain infini. Si vous croyez et qu'il n'existe pas, perte finie. Si vous ne croyez pas et qu'il existe, perte infinie. Le choix rationnel est de croire."},
{theme:"philo",diff:"difficile",type:"q",q:"Quels penseurs français des années 1960-70 — de Derrida à Foucault — sont regroupés sous l'étiquette post-structuraliste, et quelle pensée rejettent-ils ?",a:"Derrida, Foucault, Deleuze, Lyotard ; ils rejettent l'idée structuraliste de structures stables et closes qui fixeraient le sens",detail:"Le post-structuralisme montre que les structures sont instables (Derrida) et traversées de rapports de pouvoir (Foucault). Lyotard (La Condition postmoderne, 1979) annonce la fin des « grands récits ». L'étiquette, surtout utilisée dans le monde anglophone (« French Theory »), a fortement influencé les études culturelles et de genre."},
{theme:"philo",diff:"facile",type:"q",q:"Dans quel ouvrage de 1689 Locke défend-il les droits naturels à la vie, à la liberté et à la propriété, influençant les révolutions américaine et française ?",a:"Les Deux Traités du gouvernement civil (1689)",detail:"Locke (Deux Traités du gouvernement civil, 1689) s'oppose à l'absolutisme de Hobbes. L'État naît du consentement des gouvernés. Si le souverain viole les droits naturels, le peuple peut se révolter. Jefferson s'inspire de Locke dans la Déclaration d'indépendance (1776)."},
{theme:"philo",diff:"moyen",type:"q",q:"Comment Hobbes décrit-il la vie à l'état de nature dans le Léviathan (1651), justifiant ainsi l'autorité absolue du souverain ?",a:"Hobbes (Léviathan, 1651) : à l'état de nature, la vie est solitaire, pauvre, méchante, brutale et courte — les hommes cèdent leur liberté à un souverain absolu",detail:"Hobbes écrit pendant la guerre civile anglaise. A l'état de nature, la guerre de tous contre tous règne. Le contrat social : les individus cèdent leurs droits naturels à un souverain absolu. Locke et Rousseau transformeront ce cadre contractualiste."},
{theme:"philo",diff:"facile",type:"q",q:"Quelle anecdote célèbre illustre la provocation de Diogène face à Alexandre le Grand venu lui rendre visite ?",a:"Alexandre lui demande ce qu'il souhaite ; Diogène répond : « Ôte-toi de mon soleil »",detail:"Diogène de Sinope (vers 413-323 av. J.-C.), figure du cynisme, vit dans une jarre (un pithos, souvent appelé « tonneau ») et méprise les conventions sociales. Il se promène en plein jour avec une lanterne en disant « je cherche un homme ». Selon la tradition, Alexandre aurait déclaré : « Si je n'étais Alexandre, je voudrais être Diogène. » Le cynisme influence ensuite le stoïcisme."},
{theme:"philo",diff:"facile",type:"q",q:"Quel ouvrage de 1819 Schopenhauer publie-t-il pour exposer sa vision du monde comme représentation et volonté aveugle ?",a:"Le Monde comme volonté et comme représentation",detail:"Pour Arthur Schopenhauer (1788-1860), le monde tel que nous le percevons n'est que représentation ; derrière lui agit la Volonté, force aveugle et sans but qui nous pousse à désirer sans fin, source de toute souffrance. L'art, la compassion et l'ascèse permettent de s'en libérer. L'ouvrage, paru fin 1818 et daté de 1819, influence Nietzsche, Wagner et Freud."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la mort de l'art selon Hegel ?",a:"Hegel (Leçons sur l'esthétique) : l'art manifeste sensiblement l'Absolu — mais la philosophie accomplit cela mieux, rendant l'art chose du passé",detail:"L'art grec symbolisait parfaitement l'unité de la forme et du contenu. Le monde moderne, dominé par la réflexion, ne peut plus trouver sa vérité dans la forme sensible. Cette thèse alimente le débat sur l'avenir de l'art contemporain."},
{theme:"philo",diff:"moyen",type:"q",q:"Comment Aristote nomme-t-il le bonheur comme fin ultime de l'existence humaine, distingué de la simple accumulation de plaisirs ?",a:"L'eudaimonia",detail:"Pour Aristote (Éthique à Nicomaque), l'eudaimonia est l'activité de l'âme conforme à la vertu, menée sur une vie entière. Épicure place le bonheur dans l'ataraxie (absence de trouble), les stoïciens dans l'apatheia (absence de passions) et la vertu. Ces trois conceptions structurent le débat éthique occidental."},
{theme:"philo",diff:"difficile",type:"q",q:"Dans quel roman pédagogique de 1762 Rousseau développe-t-il sa conception de l'éducation naturelle, opposée à la société corruptrice ?",a:"Émile ou De l'éducation",detail:"Pour Rousseau, l'homme naît bon et la société le corrompt. Émile est élevé à la campagne selon une éducation « négative » : il apprend par l'expérience directe plutôt que par les livres. Rousseau contribue à faire reconnaître l'enfance comme un âge spécifique. Condamné à Paris et à Genève dès sa parution, l'ouvrage inspire Pestalozzi, Montessori et Dewey."},
{theme:"philo",diff:"difficile",type:"q",q:"Quel philosophe américain du XXe siècle défend un naturalisme radical affirmant que la philosophie doit s'aligner sur les sciences naturelles ?",a:"Willard Van Orman Quine",detail:"Dans « L'épistémologie naturalisée » (1969), Quine soutient que la philosophie doit être continue avec les sciences : il n'existe pas de point de vue extérieur à la science. Le naturalisme affirme que tout ce qui existe relève des sciences naturelles. Ses critiques invoquent le problème difficile de la conscience (Chalmers) ou l'irréductibilité des normes."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que le scepticisme de Pyrrhon ?",a:"Pyrrhon (360-270 av. J.-C.) suspend tout jugement (épochè) — l'ataraxie (tranquillité) s'ensuit quand on cesse de chercher ce qu'on ne peut trouver",detail:"Pyrrhon enseigne que nos sens et raison ne peuvent atteindre la vérité. La suspension du jugement libère des opinions contradictoires. Cette position est reprise par Sextus Empiricus. Montaigne s'en inspire : Que sais-je ?"},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que les actes de langage de John Austin ?",a:"Austin (1962) : le langage accomplit des actions — promettre, ordonner, déclarer sont des actes illocutoires",detail:"Austin distingue les énoncés constatifs (décrivent un état) et performatifs (accomplissent une action en le disant). Il distingue actes locutoires (dire), illocutoires (l'intention) et perlocutoires (l'effet sur l'auditeur). Searle développe la théorie. Habermas s'en inspire."},
{theme:"philo",diff:"difficile",type:"q",q:"Comment Augustin définit-il le temps dans les Confessions : comme réalité extérieure ou comme distension de l'âme ?",a:"Comme une « distension de l'âme » (distentio animi) : le temps existe dans l'esprit, par la mémoire (passé), l'attention (présent) et l'attente (futur)",detail:"Au livre XI des Confessions, Augustin écrit que s'il ne demande pas ce qu'est le temps, il le sait, mais que s'il veut l'expliquer, il ne le sait plus. Le passé n'est plus, le futur n'est pas encore : seul existe un triple présent dans l'âme. Husserl, puis Heidegger, qui fait de la temporalité la structure fondamentale du Dasein, prolongent cette réflexion."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que les jeux de langage du second Wittgenstein ?",a:"Wittgenstein (Investigations philosophiques, 1953) : le sens vient de l'usage dans des jeux de langage ancrés dans des formes de vie",detail:"Le Tractatus (1921) : ce qui peut être dit clairement le sera. Les Investigations : le langage est un ensemble de pratiques sociales. Les problèmes philosophiques naissent du langage en vacances."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que l'éthique animale de Peter Singer ?",a:"Singer (Animal Liberation, 1975) : la capacité à souffrir (sentience) est le critère moral — la discrimination fondée sur l'espèce (spécisme) est injuste",detail:"Singer applique l'utilitarisme aux animaux : les intérêts de tout être capable de souffrir doivent être pris en compte de manière égale. Il emprunte le terme de « spécisme » à Richard Ryder. Tom Regan défend, lui, des droits fondés sur la valeur inhérente des animaux. En France, le Code civil reconnaît depuis 2015 les animaux comme des « êtres vivants doués de sensibilité »."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la monadologie de Leibniz ?",a:"Leibniz (1646-1716) : la réalité est constituée de monades (substances simples, indivisibles) — nous vivons dans le meilleur des mondes possibles",detail:"Dans la Monadologie (1714), l'univers est composé d'une infinité de monades sans interaction réelle, chacune reflétant l'univers entier ; une « harmonie préétablie » les accorde. Dieu a choisi le meilleur des mondes possibles. Voltaire parodie cet optimisme dans Candide (1759). Leibniz invente le calcul infinitésimal indépendamment de Newton."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la Sittlichkeit (vie éthique) chez Hegel ?",a:"Hegel (Principes de la philosophie du droit, 1821) : famille, société civile et État sont les stades de l'Esprit objectif",detail:"Hegel distingue le droit abstrait, la moralité (conscience individuelle) et la vie éthique (Sittlichkeit, institutions concrètes). L'État hégélien est la réalisation de la liberté. Marx critique cet État comme défenseur des intérêts bourgeois."},
{theme:"philo",diff:"facile",type:"q",q:"Qu'est-ce que la méthode inductive de Francis Bacon ?",a:"Francis Bacon (1561-1626) : la science doit partir de l'observation des faits particuliers pour remonter aux lois générales",detail:"Bacon (Novum Organum, 1620) critique la scolastique et propose d'observer la nature systématiquement. Il identifie les idoles (préjugés) : de la tribu, de la caverne, du marché, du théâtre. Sa méthode inspire la Royal Society (1660)."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la bioéthique et les quatre principes de Beauchamp et Childress ?",a:"Quatre principes — autonomie, bienfaisance, non-maléficence, justice — structurent l'éthique médicale depuis 1979",detail:"L'autonomie : respecter le patient comme agent capable de décider (consentement éclairé). La bienfaisance : agir dans l'intérêt du patient. La non-maléficence : primum non nocere. La justice : distribution équitable des ressources médicales."},
{theme:"philo",diff:"facile",type:"q",q:"Quelle formule de Hegel résume sa vision de l'histoire comme réalisation progressive de la liberté et de l'Esprit absolu ?",a:"« L'histoire du monde n'est rien d'autre que le progrès de la conscience de la liberté »",detail:"Dans les Leçons sur la philosophie de l'histoire, publiées en 1837, Hegel décrit ce progrès : dans l'Orient, un seul est libre ; dans le monde gréco-romain, quelques-uns ; dans le monde germanique chrétien, tous. Les passions des « grands hommes » servent, à leur insu, les fins de la raison : c'est la « ruse de la raison ». Marx renverse ce schéma idéaliste en matérialisme historique."},
{theme:"philo",diff:"facile",type:"q",q:"Quel philosophe présocratique imagine le paradoxe d'Achille et de la tortue pour contester la réalité du mouvement ?",a:"Zénon d'Élée (Ve siècle av. J.-C.)",detail:"Disciple de Parménide, Zénon soutient qu'Achille ne rattrapera jamais la tortue partie avant lui : chaque fois qu'il atteint sa position précédente, elle a avancé. D'autres paradoxes (la flèche, la dichotomie) visent à montrer que le mouvement est contradictoire. Aristote répond en distinguant l'infini en puissance et l'infini en acte ; la notion mathématique de série convergente apporte une réponse moderne."},
{theme:"philo",diff:"moyen",type:"q",q:"Quel philosophe britannique propose en 1905, dans « On Denoting », la théorie des descriptions définies, à propos de « l'actuel roi de France » ?",a:"Bertrand Russell",detail:"Pour Russell, « l'actuel roi de France est chauve » se décompose en une affirmation d'existence (« il existe un et un seul roi de France ») et une prédication : la phrase est donc fausse, et non dépourvue de sens. Cette analyse logique fonde la philosophie analytique du langage. Strawson (1950) objecte que la phrase présuppose l'existence du roi sans l'affirmer."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la phénoménologie du corps selon Merleau-Ponty ?",a:"Maurice Merleau-Ponty (1908-1961) : le corps vécu (Leib) n'est pas un objet parmi les objets mais la condition de toute expérience — contre le dualisme cartésien",detail:"La Phénoménologie de la perception (1945) montre que la perception est incarnée : nous percevons avec notre corps, non avec un esprit désincorporé. Le schéma corporel organise notre expérience. Le membre fantôme montre que le corps vécu déborde le corps objectif. Cette approche fonde les théories de l'embodied cognition en sciences cognitives."},
{theme:"philo",diff:"moyen",type:"q",q:"Dans quel ouvrage de 1943 Sartre affirme-t-il que l'homme est « condamné à être libre » ?",a:"L'Être et le Néant",detail:"Pour Sartre, la conscience (le « pour-soi ») n'est jamais identique à elle-même et ne peut pas ne pas choisir : la liberté est totale, et la responsabilité avec elle. La mauvaise foi consiste à fuir cette liberté en se prétendant déterminé par sa nature, son rôle ou son passé, comme le garçon de café qui « joue » à être garçon de café. Sartre reprend la formule dans L'existentialisme est un humanisme (1945)."},
{theme:"philo",diff:"moyen",type:"q",q:"Quel concept Marx développe-t-il pour décrire la condition du travailleur dépossédé du fruit de son travail sous le capitalisme ?",a:"L'aliénation",detail:"Dans les Manuscrits de 1844, Marx décrit un travailleur dépossédé du produit de son travail, de son activité, de son essence humaine (le travail créateur) et des autres hommes. Il s'inspire de Feuerbach, pour qui l'homme projette ses propres qualités en Dieu (aliénation religieuse). Le communisme doit, selon lui, rendre à l'homme la maîtrise de son travail."},
