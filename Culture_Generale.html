{theme:"philo",diff:"difficile",type:"q",q:"Quel ouvrage de 1960 Hans-Georg Gadamer consacre-t-il à l'herméneutique philosophique, centré sur la fusion des horizons d'interprétation ?",a:"Vérité et Méthode",detail:"Gadamer s'oppose à l'idéal d'objectivité des sciences humaines (Dilthey). Les préjugés (Vorurteile) ne sont pas des obstacles mais les conditions de la compréhension. La 'fusion des horizons' désigne la rencontre entre le texte (son monde) et le lecteur (son monde). La vérité dans les humanités n'est pas une méthode mais une expérience transformatrice."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la philosophie de la technique chez Heidegger ?",a:"Heidegger (La Question de la technique, 1954) : la technique moderne n'est pas un outil neutre mais un mode de dévoilement du monde qui transforme la nature en 'fonds' (Bestand) disponible",detail:"La technique artisanale dévoile la nature en collaborant avec elle (le menuisier suit le fil du bois). La technique moderne (Gestell, arraisonnement) transforme tout en ressource exploitable. Le Rhin est une centrale hydroélectrique potentielle avant d'être un paysage. Le danger de la technique : la perte des autres modes de dévoilement (art, poésie). Le salut est dans cette prise de conscience."},
{theme:"philo",diff:"moyen",type:"q",q:"Quel sophisme G.E. Moore dénonce-t-il dans ses Principia Ethica (1903) en montrant qu'on ne peut pas déduire le bien du naturel ?",a:"Le « sophisme naturaliste » (naturalistic fallacy)",detail:"Pour Moore, le bien ne peut être défini par une propriété naturelle comme le plaisir ou l'utilité. Son « argument de la question ouverte » : pour toute propriété naturelle X, on peut demander sans contradiction « X est-il bon ? ». Le bien serait donc une propriété simple, indéfinissable et non naturelle, saisie par intuition. La critique rejoint la « guillotine de Hume »."},
{theme:"philo",diff:"moyen",type:"q",q:"Quel philosophe irlandais contemporain, auteur de Républicanisme (1997), distingue la liberté républicaine de la liberté libérale ?",a:"Philip Pettit",detail:"Pettit distingue la liberté comme non-interférence (libéralisme : ne pas être entravé) et la liberté comme non-domination (républicanisme : ne pas être soumis au pouvoir arbitraire d'autrui, même bienveillant). Un esclave au maître indulgent n'est pas libre, car son sort dépend du bon vouloir de ce maître. Cette tradition remonte à Cicéron et à Machiavel."},
{theme:"philo",diff:"difficile",type:"q",q:"Quels sont les trois stades de l'existence selon Kierkegaard, du plus bas au plus élevé ?",a:"Kierkegaard (1813-1855) distingue trois stades : esthétique (plaisir, immédiat), éthique (devoir, universalité), religieux (foi absurde, 'téléologique suspension de l'éthique')",detail:"Au stade esthétique (figure de Don Juan), l'individu vit dans l'instant et le plaisir, jusqu'à l'ennui et au désespoir. Au stade éthique (le juge Wilhelm), il choisit le devoir et l'engagement. Au stade religieux (Abraham, dans Crainte et tremblement), il accomplit un saut de la foi qui peut aller jusqu'à la « suspension téléologique de l'éthique ». Kierkegaard est considéré comme un précurseur de l'existentialisme."},
{theme:"philo",diff:"difficile",type:"q",q:"Quel philosophe britannique du XVIIe siècle pose le problème de l'identité personnelle en la fondant sur la continuité de la mémoire et de la conscience ?",a:"John Locke",detail:"Pour Locke (Essai sur l'entendement humain, 1694 pour le chapitre ajouté), l'identité personnelle repose sur la continuité de la conscience et de la mémoire, non sur celle de la substance. Hume ne trouve en lui qu'un « faisceau de perceptions », jamais un moi stable. Derek Parfit (Reasons and Persons, 1984) soutient que l'identité n'est pas ce qui importe : seule compte la continuité psychologique."},
{theme:"philo",diff:"moyen",type:"q",q:"Comment traduit-on le concept africain ubuntu, et dans quel pays Nelson Mandela l'invoque-t-il comme fondement de la réconciliation nationale ?",a:"« Je suis parce que nous sommes » (ou « une personne est une personne par les autres ») ; en Afrique du Sud",detail:"L'ubuntu, notion des langues nguni (zoulou, xhosa), fait de l'identité individuelle une réalité relationnelle. Desmond Tutu et Nelson Mandela en font un fondement éthique de la réconciliation après l'apartheid. La philosophie africaine contemporaine interroge l'universalisme supposé des philosophies occidentales."},
{theme:"philo",diff:"difficile",type:"q",q:"Quel concept Thomas Kuhn introduit-il dans La Structure des révolutions scientifiques (1962) pour décrire un changement radical de cadre théorique ?",a:"Le changement de paradigme",detail:"Un paradigme est l'ensemble des théories, méthodes et problèmes reconnus par une communauté scientifique. La « science normale » résout des énigmes dans ce cadre jusqu'à l'accumulation d'anomalies, qui provoque une crise puis une révolution (Copernic, Lavoisier, Einstein). Selon Kuhn, les paradigmes successifs sont en partie « incommensurables », ce qui relativise l'idée d'un progrès linéaire."},
{theme:"philo",diff:"facile",type:"q",q:"Quelle position radicale Kant défend-il sur le mensonge : est-il permis de mentir pour sauver une vie innocente ?",a:"Kant : il est toujours interdit de mentir, même pour sauver un innocent — l'impératif catégorique est absolu et ne souffre aucune exception",detail:"Dans Sur un prétendu droit de mentir par humanité (1797), Kant maintient qu'il faut dire la vérité même à l'assassin qui cherche votre ami. Le devoir de ne pas mentir est catégorique. Cette position est extrême : si on dit la vérité et que l'assassin tue l'ami, on n'est pas responsable. Mill et les conséquentialistes rejettent cette rigidité."},
{theme:"philo",diff:"moyen",type:"q",q:"Qui est Diotime dans le Banquet de Platon, et quelle conception de l'amour ascendant vers le Beau absolu lui prête-t-il ?",a:"Une prêtresse de Mantinée, dont Socrate rapporte l'enseignement : l'amour s'élève de la beauté d'un corps à celle de tous les corps, des âmes, des savoirs, jusqu'au Beau en soi",detail:"Dans le Banquet, plusieurs convives font l'éloge d'Éros. Aristophane raconte le mythe des êtres doubles coupés en deux par Zeus, chacun cherchant sa moitié. Socrate, via Diotime, définit l'amour comme désir de posséder toujours le bien et d'enfanter dans la beauté. Alcibiade conclut par un éloge de Socrate lui-même."},
{theme:"philo",diff:"difficile",type:"q",q:"Quel philosophe américain publie en 1949 L'Almanach d'un comté des sables, fondant l'éthique de la terre comme première éthique environnementale ?",a:"Aldo Leopold",detail:"Leopold propose d'étendre la communauté morale aux sols, aux eaux, aux plantes et aux animaux : une chose est juste si elle tend à préserver l'intégrité, la stabilité et la beauté de la communauté biotique. L'éthique environnementale se développe dans les années 1970 : écologie profonde d'Arne Naess (1973), droits des arbres de Christopher Stone (1972), écoféminisme de Val Plumwood."},
{theme:"philo",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie de la connaissance et le problème de Gettier ?",a:"Edmund Gettier (1963) réfute la définition traditionnelle du savoir comme croyance vraie et justifiée — il montre des cas où les trois conditions sont remplies sans que l'on 'sache' vraiment",detail:"Depuis le Théétète de Platon, on définit souvent le savoir comme une croyance vraie et justifiée. En trois pages, Gettier propose des contre-exemples où quelqu'un a une croyance vraie et justifiée, mais vraie par chance. Un cas voisin, attribué à Russell : je lis l'heure sur une horloge arrêtée qui, par hasard, indique l'heure exacte. Ce problème a suscité une immense littérature en épistémologie."},
{theme:"philo",diff:"moyen",type:"q",q:"Quelle distinction stoïcienne entre ce qui dépend de nous et ce qui n'en dépend pas structure l'éthique d'Épictète dans le Manuel ?",a:"Ce qui dépend de nous (jugements, désirs, actions) et ce qui n'en dépend pas (corps, biens, réputation, mort)",detail:"Pour Épictète, né esclave, le bonheur consiste à ne désirer que ce qui dépend de nous et à accepter le reste comme voulu par la raison universelle (logos) qui gouverne le monde. Le Manuel, rédigé par son disciple Arrien, résume cet enseignement. Marc Aurèle (Pensées pour moi-même) reprend la même distinction."},
{theme:"philo",diff:"difficile",type:"q",q:"Quelles sont les deux faces du signe linguistique selon Saussure, et quelle relation arbitraire les unit ?",a:"Ferdinand de Saussure (Cours de linguistique générale, 1916) : le signe linguistique est l'union d'un signifiant (image acoustique) et d'un signifié (concept) — le rapport est arbitraire",detail:"Saussure fonde la linguistique structurale. Le signe n'a pas de rapport naturel avec les choses : 'arbre' en français, 'tree' en anglais, 'Baum' en allemand désignent la même chose. Le sens naît des différences entre signes (paradigme, syntagme). La langue est un système de différences sans termes positifs. Cette approche inspire le structuralisme anthropologique, littéraire et psychanalytique."},
{theme:"philo",diff:"moyen",type:"q",q:"Quel philosophe grec de l'Antiquité est à l'origine du paradoxe du sorite, posant la question des concepts vagues aux frontières indéfinies ?",a:"Eubulide de Milet (IVe s. av. J.-C.) — le sorite illustre le problème de la vagueness des prédicats",detail:"Le sorite (du grec sôros, tas) : si un tas de sable perd un grain il reste un tas, donc enlever tous les grains un par un devrait toujours laisser un tas — pourtant un grain n'est pas un tas. Ce paradoxe est central en philosophie du langage et en sémantique formelle."},
{theme:"litterature",diff:"facile",type:"q",q:"Qui est l'auteur de l'Iliade et de l'Odyssée, épopées fondatrices de la littérature occidentale ?",a:"Homère (VIIIe s. av. J.-C.) — bien que son existence même soit débattue par les historiens",detail:"La 'question homérique' agite les philologues depuis le XIXe s. : Homère est-il un auteur unique, ou ces épopées sont-elles le fruit d'une tradition orale collective ? Les deux œuvres restent les textes fondateurs de la culture grecque et occidentale."},
{theme:"litterature",diff:"facile",type:"q",q:"Quel dramaturge grec du Ve s. av. J.-C. est l'auteur d'Œdipe Roi, pièce modèle de la tragédie antique ?",a:"Sophocle",detail:"Sophocle remporte 18 fois le concours de tragédies aux Grandes Dionysies. Aristote, dans sa Poétique, cite Œdipe Roi comme l'exemple parfait de la tragédie, avec sa reconnaissance (anagnorisis) et son coup de théâtre (peripeteia)."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui écrit la Divine Comédie au début du XIVe siècle, œuvre fondatrice de la littérature italienne ?",a:"Dante Alighieri (1265-1321)",detail:"La Divine Comédie (Enfer, Purgatoire, Paradis) est rédigée en toscan, contribuant à faire de ce dialecte la base de l'italien moderne. Dante y guide le lecteur à travers l'au-delà, accompagné par Virgile puis Béatrice."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel auteur français du XVIe siècle crée Pantagruel et Gargantua, œuvres emblématiques de l'humanisme renaissant ?",a:"François Rabelais (vers 1494-1553)",detail:"Rabelais mêle érudition humaniste, satire des institutions et humour scatologique dans un style exubérant. Son œuvre incarne l'idéal renaissant de la connaissance encyclopédique et de la libre pensée contre le dogmatisme scolastique."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui est l'auteur des Essais (1580), inventant un genre littéraire nouveau centré sur l'introspection ?",a:"Michel de Montaigne (1533-1592)",detail:"Montaigne invente le genre de l'essai en faisant de lui-même son propre sujet d'étude ('Que sais-je ?'). Ses Essais influencent profondément Shakespeare, Pascal et toute la littérature de l'introspection jusqu'à nos jours."},
{theme:"litterature",diff:"facile",type:"q",q:"Quel dramaturge élisabéthain est l'auteur de Hamlet, Macbeth, Roméo et Juliette et du Roi Lear ?",a:"William Shakespeare (1564-1616)",detail:"Shakespeare est considéré comme le plus grand écrivain de langue anglaise. Ses 37 pièces et 154 sonnets ont été traduits dans toutes les langues. Le Globe Theatre, où ses pièces étaient jouées, a été reconstruit à Londres en 1997."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel dramaturge français du XVIIe siècle écrit Phèdre, Andromaque et Britannicus, sommets de la tragédie classique ?",a:"Jean Racine (1639-1699)",detail:"Racine respecte scrupuleusement la règle des trois unités (lieu, temps, action) et la bienséance du classicisme. Ses tragédies en alexandrins comptent parmi les sommets de la langue poétique française, par leur pureté et leur intensité psychologique."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui est l'auteur du Cid (1637), pièce fondatrice du théâtre classique français qui déclenche une célèbre querelle ?",a:"Pierre Corneille (1606-1684)",detail:"La querelle du Cid oppose Corneille à l'Académie française, fondée par Richelieu. L'Académie critique la pièce pour ses entorses aux règles classiques, mais son succès populaire est immédiat et durable."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel auteur du XVIIe siècle écrit Les Fables, chef-d'œuvre de la poésie française inspiré d'Ésope et Phèdre ?",a:"Jean de La Fontaine (1621-1695)",detail:"Les Fables de La Fontaine (12 livres, 1668-1694) sont bien plus que des histoires pour enfants : ce sont des œuvres morales et politiques adressées aux adultes, illustrant les vices et vertus humains à travers des animaux."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui écrit Candide (1759), conte philosophique satirisant l'optimisme leibnizien ?",a:"Voltaire (François-Marie Arouet, 1694-1778)",detail:"Candide raille la philosophie de Leibniz selon laquelle 'tout est pour le mieux dans le meilleur des mondes possibles', à travers une série de catastrophes absurdes. La conclusion — 'il faut cultiver notre jardin' — reste l'une des phrases les plus citées de la littérature française."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel roman épistolaire de Laclos (1782) est considéré comme l'un des chefs-d'œuvre du libertinage littéraire ?",a:"Les Liaisons dangereuses",detail:"Le roman par lettres de Choderlos de Laclos met en scène la marquise de Merteuil et le vicomte de Valmont manipulant leurs victimes par pur plaisir. Plusieurs adaptations cinématographiques en ont fait une œuvre universellement connue."},
{theme:"litterature",diff:"facile",type:"q",q:"Quel romancier français du XIXe siècle crée La Comédie humaine, fresque de plus de 90 romans sur la société française ?",a:"Honoré de Balzac (1799-1850)",detail:"Balzac invente le personnage récurrent entre plusieurs romans (Rastignac, Vautrin) et ambitionne de faire pour la société ce que Buffon a fait pour la nature. Il travaille jusqu'à 18 heures par jour, alimenté au café, produisant une œuvre colossale."},
{theme:"litterature",diff:"facile",type:"q",q:"Quel romancier russe est l'auteur de Guerre et Paix (1869) et Anna Karénine (1877) ?",a:"Léon Tolstoï (1828-1910)",detail:"Guerre et Paix, qui suit plusieurs familles nobles russes pendant les guerres napoléoniennes, est souvent cité comme l'un des plus grands romans jamais écrits. Tolstoï développe ensuite une doctrine chrétienne et pacifiste, renonce à ses droits d'auteur et à une partie de ses biens, et meurt en 1910 dans une petite gare après avoir fui son domaine."},
{theme:"litterature",diff:"facile",type:"q",q:"Quel romancier russe est l'auteur de Crime et Châtiment (1866) et Les Frères Karamazov (1880) ?",a:"Fiodor Dostoïevski (1821-1881)",detail:"Dostoïevski, condamné à mort puis gracié au dernier moment, a profondément marqué la littérature mondiale par sa plongée dans la psychologie des personnages torturés. Nietzsche, Kafka et Sartre le considèrent comme une influence majeure."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel poète français est le chef de file du symbolisme avec des œuvres comme L'Après-midi d'un faune ?",a:"Stéphane Mallarmé (1842-1898)",detail:"Mallarmé préside les fameux 'mardis' où se retrouvent les poètes symbolistes. Son projet est de suggérer plutôt que de nommer, de faire de la poésie une musique du langage. Debussy met en musique L'Après-midi d'un faune en 1894."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel poète français du XIXe siècle révolutionne la poésie avec Une saison en enfer et les Illuminations, avant d'abandonner la littérature à 21 ans ?",a:"Arthur Rimbaud (1854-1891)",detail:"Rimbaud, génie précoce et rebelle, théorise le 'dérèglement de tous les sens' comme méthode poétique. Sa relation tumultueuse avec Verlaine, et son abandon total de la littérature pour le commerce en Afrique, en font une figure mythique."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier irlandais publie Ulysse en 1922, roman moderniste considéré comme l'un des plus importants du XXe siècle ?",a:"James Joyce (1882-1941)",detail:"Ulysse transpose l'Odyssée d'Homère dans le Dublin d'une seule journée (le 16 juin 1904, 'Bloomsday'). Le roman, publié en feuilleton dans The Little Review puis en volume à Paris, est censuré aux États-Unis pour obscénité jusqu'en 1933."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle romancière britannique est l'auteure de Mrs Dalloway (1925) et pionnière du roman moderniste ?",a:"Virginia Woolf (1882-1941)",detail:"Virginia Woolf explore la vie intérieure de ses personnages par le monologue intérieur et une narration polyphonique. Figure du groupe de Bloomsbury, elle fonde avec son mari la maison d'édition Hogarth Press. Elle est aussi une essayiste féministe majeure avec Une chambre à soi (1929)."},
{theme:"litterature",diff:"facile",type:"q",q:"Qui est l'auteur de La Métamorphose (1915) et du Procès (1925), œuvres emblématiques de l'absurde et de l'aliénation ?",a:"Franz Kafka (1883-1924)",detail:"Kafka, fonctionnaire pragois de langue allemande, publie peu de son vivant et demande à son ami Max Brod de brûler ses manuscrits à sa mort. Brod les publie à la place, donnant naissance à l'adjectif 'kafkaïen' pour désigner une situation absurde et bureaucratique."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel prix Nobel de littérature (1954) est l'auteur de L'Adieu aux armes et Le Vieil Homme et la mer ?",a:"Ernest Hemingway (1899-1961)",detail:"Hemingway développe un style dépouillé, la 'théorie de l'iceberg' : l'essentiel n'est pas dit mais présent en filigrane. Correspondant de guerre, il participe à la Première Guerre mondiale, à la guerre civile espagnole et à la Seconde Guerre mondiale."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle romancière américaine publie Beloved (1987), roman sur l'esclavage qui lui vaut le Prix Nobel en 1993 ?",a:"Toni Morrison (1931-2019)",detail:"Beloved, inspiré d'un fait réel, raconte l'histoire d'une esclave qui tue son enfant pour lui éviter l'esclavage. Toni Morrison est la première femme noire américaine à recevoir le Nobel de littérature. Ses romans explorent l'identité noire américaine avec une profondeur sans égale."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui écrit Le Maître et Marguerite, roman satirique soviétique publié à titre posthume en 1966 ?",a:"Mikhaïl Boulgakov (1891-1940)",detail:"Boulgakov rédige ce roman entre 1928 et 1940, sachant qu'il ne pourra pas le publier de son vivant sous Staline. Il mêle une satire acerbe de la société soviétique à une relecture du mythe de Faust et à la visite du diable dans le Moscou des années 1930."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel auteur colombien reçoit le Prix Nobel de littérature en 1982, consacrant le réalisme magique latino-américain ?",a:"Gabriel García Márquez (1927-2014)",detail:"García Márquez, surnommé « Gabo », est l'auteur de Cent ans de solitude (1967), traduit dans des dizaines de langues. Il raconte avoir trouvé le ton de ce roman en se souvenant de sa grand-mère, qui racontait des choses extraordinaires sur un ton parfaitement naturel."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel écrivain japonais publie La Ballade de l'impossible (1987) et est aujourd'hui le romancier japonais le plus lu dans le monde ?",a:"Haruki Murakami (né en 1949)",detail:"Murakami mêle réalisme quotidien et éléments fantastiques dans une prose influencée par la littérature américaine et le jazz. Ses romans — dont Kafka sur le rivage et 1Q84 — sont des phénomènes éditoriaux mondiaux, régulièrement cités pour le Nobel."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle romancière nigériane est l'auteure de L'Hibiscus pourpre (2003) et de Americanah (2013) ?",a:"Chimamanda Ngozi Adichie (née en 1977)",detail:"Adichie est l'une des voix les plus importantes de la littérature africaine contemporaine. Son essai 'Nous sommes tous des féministes' (2014), adapté d'une conférence TED, est devenu un manifeste mondial du féminisme contemporain."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel auteur tchèque exilé à Paris est l'auteur de L'Insoutenable Légèreté de l'être (1984) ?",a:"Milan Kundera (1929-2023)",detail:"Membre du Parti communiste puis exclu, Kundera voit ses livres interdits après l'invasion soviétique de 1968. Il s'installe en France en 1975 et perd la nationalité tchécoslovaque en 1979 ; il la recouvre en 2019. L'Insoutenable Légèreté de l'être a pour toile de fond le Printemps de Prague et l'occupation soviétique. Ses derniers romans sont écrits directement en français."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier péruvien, Prix Nobel 2010, est l'auteur de La Ville et les chiens et La Fête au Bouc ?",a:"Mario Vargas Llosa (1936-2025)",detail:"Avec García Márquez, Cortázar et Fuentes, Vargas Llosa est une figure majeure du « boom » latino-américain des années 1960-1970. Ses romans mêlent politique, histoire et virtuosité narrative. Élu à l'Académie française en 2021, il est mort à Lima en avril 2025."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel écrivain argentin, devenu aveugle et directeur de la Bibliothèque nationale, publie le recueil Fictions (1944) ?",a:"Jorge Luis Borges (1899-1986)",detail:"Borges invente des univers labyrinthiques où bibliothèques infinies, miroirs et labyrinthes interrogent la réalité et la fiction (« La Bibliothèque de Babel », « Pierre Ménard, auteur du Quichotte »). Il dirige la Bibliothèque nationale d'Argentine à partir de 1955, alors qu'il perd la vue. Umberto Eco, Italo Calvino et la littérature postmoderne lui doivent beaucoup."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier français du XXe siècle est l'auteur de La Nausée (1938) et du cycle Les Chemins de la liberté ?",a:"Jean-Paul Sartre (1905-1980)",detail:"Sartre, figure majeure de l'existentialisme, refuse le Prix Nobel de littérature en 1964 pour ne pas être 'institutionnalisé'. La Nausée est le premier grand roman existentialiste, explorant la contingence radicale de l'existence à travers le personnage de Roquentin."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle romancière française publie Bonjour Tristesse en 1954 à 18 ans, devenant une icône de la littérature française ?",a:"Françoise Sagan (1935-2004)",detail:"Bonjour Tristesse, vendu à plus d'un million d'exemplaires, scandalise et fascine par son ton libre et amoral. Sagan devient l'incarnation d'une certaine jeunesse française — fast cars, jeu, liberté — et reste une des romancières françaises les plus lues à l'étranger."},
{theme:"litterature",diff:"difficile",type:"q",q:"Qui est l'auteur de En attendant Godot (1952), pièce phare du théâtre de l'absurde, et de quelle nationalité est-il ?",a:"Samuel Beckett (1906-1989) — irlandais, écrivant en français et anglais",detail:"Prix Nobel 1969, Beckett choisit d'écrire en français pour, disait-il, écrire « sans style ». Dans En attendant Godot, créé en 1953, deux vagabonds attendent indéfiniment un certain Godot qui ne vient jamais. C'est l'une des pièces les plus jouées et commentées du XXe siècle."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel dramaturge norvégien, auteur de La Maison de poupée (1879) et de Hedda Gabler, est considéré comme le père du théâtre moderne ?",a:"Henrik Ibsen (1828-1906)",detail:"Ibsen révolutionne le théâtre en abordant des sujets tabous (condition des femmes, maladies vénériennes, corruption) dans un langage naturaliste. Bernard Shaw le défend en Angleterre contre la censure victorienne, reconnaissant en lui le fondateur du théâtre social moderne."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quelle romancière britannique publie Middlemarch (1871), considéré par de nombreux critiques comme le plus grand roman anglais ?",a:"George Eliot (Mary Ann Evans, 1819-1880)",detail:"Mary Ann Evans publie sous un pseudonyme masculin pour être prise au sérieux. Middlemarch, sous-titré « Étude de la vie de province », est une fresque sociale d'une grande profondeur psychologique et morale. Virginia Woolf y voyait l'un des rares romans anglais écrits pour des adultes."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier français, prix Nobel 1985, est l'auteur de La Route des Flandres (1960) ?",a:"Claude Simon (1913-2005)",detail:"Claude Simon, figure du Nouveau Roman, déconstruit la narration traditionnelle en entremêlant temps, souvenirs et sensations dans de longues phrases sinueuses. La Route des Flandres s'inspire de la débâcle de mai 1940, qu'il a vécue comme cavalier. Son œuvre, réputée difficile, a été consacrée par le Nobel en 1985."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle poète américaine, recluse à Amherst, publie moins de 10 poèmes de son vivant mais laisse 1800 poèmes à sa mort en 1886 ?",a:"Emily Dickinson (1830-1886)",detail:"Dickinson invente une poésie iconoclaste, aux tirets abondants et aux rimes approximatives, qui préfigure la modernité. Presque inconnue de son vivant, elle est aujourd'hui considérée comme l'une des plus grandes poètes de langue anglaise."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier américain est l'auteur de Moby Dick (1851), épopée maritime considérée comme un chef-d'œuvre de la littérature américaine ?",a:"Herman Melville (1819-1891)",detail:"Moby Dick est un échec commercial à sa sortie, et Melville meurt oublié. Redécouvert dans les années 1920, le roman est aujourd'hui classé parmi les plus grands romans américains. Il peut se lire comme une épopée, un traité de cétologie, une allégorie métaphysique ou un roman de l'obsession."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui est l'auteur du Conte de deux villes et des Grandes Espérances, romancier social de l'ère victorienne ?",a:"Charles Dickens (1812-1870)",detail:"Dickens publie ses romans en feuilletons, influençant directement le suspense et les retournements de situation. Ses personnages (Oliver Twist, Ebenezer Scrooge, Pip) sont devenus des archétypes culturels. Il contribue à faire évoluer les lois sur le travail des enfants."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel poète et romancier russe est l'auteur du Docteur Jivago (1957), publié à l'étranger et lui valant un Nobel qu'il doit refuser ?",a:"Boris Pasternak (1890-1960)",detail:"Le Docteur Jivago, roman sur la révolution russe, est refusé par les éditeurs soviétiques et publié clandestinement en Italie. Le Nobel 1958 provoque une telle pression des autorités soviétiques que Pasternak est contraint de le refuser. Le roman paraît en URSS seulement en 1988."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel auteur sénégalais, père de la négritude avec Aimé Césaire, devient en 1960 le premier président du Sénégal ?",a:"Léopold Sédar Senghor (1906-2001)",detail:"Senghor est le premier Africain membre de l'Académie française (1983). La négritude, mouvement qu'il cofonde avec Césaire dans les années 1930 à Paris, affirme la valeur et la beauté des cultures africaines contre l'assimilation coloniale."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier kényan, auteur de Décoloniser l'esprit (1986), décide d'écrire uniquement en gikuyu pour rejeter la langue coloniale ?",a:"Ngũgĩ wa Thiong'o (1938-2025)",detail:"Emprisonné sans jugement au Kenya en 1977-1978 après une pièce jugée subversive, Ngũgĩ écrit dans sa cellule, sur du papier hygiénique, son premier roman en gikuyu (Caitaani Mũtharaba-inĩ, « Le Diable sur la croix »). Dans Décoloniser l'esprit, il plaide pour que les écrivains africains écrivent dans leurs langues. Il est mort en mai 2025."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle romancière britannique est l'auteure de Harry Potter, la série de livres la plus vendue de l'histoire ?",a:"J.K. Rowling (née en 1965)",detail:"Harry Potter à l'école des sorciers (1997) a été refusé par une douzaine d'éditeurs avant d'être accepté par Bloomsbury. Les 7 romans se sont vendus à plus de 500 millions d'exemplaires, traduits dans plus de 80 langues. Rowling a été la première auteure à devenir milliardaire grâce à ses livres. Ses prises de position sur l'identité de genre suscitent depuis 2020 de vives controverses."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel héros de l'indépendance sud-américaine est le personnage central du Général dans son labyrinthe (1989) de Gabriel García Márquez ?",a:"Simón Bolívar",detail:"Le roman retrace le dernier voyage de Bolívar, malade et désabusé, sur le fleuve Magdalena en 1830, quelques mois avant sa mort. García Márquez y démythifie le « Libertador » en montrant un homme vieillissant. Le « boom » latino-américain réunit dans les années 1960-1970 García Márquez, Vargas Llosa, Cortázar, Fuentes et Donoso."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel romancier italien, auteur du Nom de la rose (1980), est aussi l'un des plus grands sémioticiens du XXe siècle ?",a:"Umberto Eco (1932-2016)",detail:"Le Nom de la rose, roman policier médiéval aux multiples couches symboliques et intertextuelles, est un phénomène éditorial mondial. Eco, professeur de sémiotique à Bologne, construit un roman qui se lit à plusieurs niveaux — thriller, histoire des idées, méditation sur la connaissance."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel poète de langue allemande, né à Prague en 1875, est l'auteur des Élégies de Duino ?",a:"Rainer Maria Rilke (1875-1926)",detail:"Les Élégies de Duino, commencées en 1912 au château de Duino, sur l'Adriatique, et achevées en 1922, sont considérées comme un sommet de la poésie lyrique du XXe siècle. Rilke y interroge la condition humaine et la mission du poète face à l'ange. Il est aussi l'auteur des Lettres à un jeune poète et des Sonnets à Orphée."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quelle romancière britannique commence à 18 ans l'écriture de Frankenstein (1818), souvent considéré comme le premier roman de science-fiction ?",a:"Mary Shelley (1797-1851)",detail:"L'idée naît en 1816 au bord du lac Léman, à la villa Diodati, lors d'un concours d'histoires de fantômes avec Lord Byron, Percy Shelley et John Polidori. La créature n'a pas de nom dans le roman : Frankenstein est le nom de son créateur, Victor. L'œuvre pose des questions toujours actuelles sur la responsabilité scientifique."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier américain est l'auteur de Le Bruit et la Fureur (1929), roman moderniste sur le déclin d'une famille sudiste ?",a:"William Faulkner (1897-1962)",detail:"Faulkner, Prix Nobel 1949, invente un comté fictif du Mississippi (Yoknapatawpha) où se déroule la plupart de ses romans. Le Bruit et la Fureur utilise quatre narrateurs différents, dont un personnage déficient mental, pour raconter la même histoire depuis des points de vue incompatibles."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel poète péruvien, auteur de Trilce (1922), est considéré comme l'un des plus grands poètes de langue espagnole du XXe siècle ?",a:"César Vallejo (1892-1938)",detail:"Vallejo bouleverse la poésie de langue espagnole par une langue fragmentée, douloureuse et inventive. Emprisonné en 1920-1921 au Pérou, il s'installe à Paris en 1923, où il meurt dans la pauvreté en 1938. Ses Poèmes humains, posthumes, et España, aparta de mí este cáliz, inspiré par la guerre d'Espagne, ont influencé toute la poésie hispanique."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel romancier français du XXe siècle, auteur de La Modification (1957), est une figure majeure du Nouveau Roman ?",a:"Michel Butor (1926-2016)",detail:"La Modification, écrit entièrement à la deuxième personne du singulier ('vous'), raconte en temps réel le voyage en train d'un homme qui renonce à quitter sa femme pour sa maîtresse. Le Nouveau Roman, mouvement des années 1950-70, rejette les conventions du roman traditionnel (intrigue, psychologie, chronologie)."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel essai de Primo Levi (1986) réfléchit à la mémoire des camps, à la honte du survivant et à la « zone grise » ?",a:"Les Naufragés et les Rescapés",detail:"Dernier livre publié de son vivant, l'essai revient sur Auschwitz quarante ans après : la « zone grise » désigne l'espace ambigu entre victimes et bourreaux, où des déportés étaient contraints de collaborer. Levi y analyse aussi la défaillance de la mémoire et la culpabilité des survivants. Il meurt en 1987."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel écrivain sud-africain publie En attendant les barbares (1980) et reçoit le prix Nobel de littérature en 2003 ?",a:"J.M. Coetzee (né en 1940)",detail:"Coetzee, installé en Australie depuis 2002 et naturalisé en 2006, est l'un des rares auteurs à avoir reçu deux fois le Booker Prize (1983, 1999). En attendant les barbares, situé dans un empire imaginaire, interroge la complicité avec l'oppression coloniale."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel poème d'Allen Ginsberg (1956), poursuivi pour obscénité, devient l'un des manifestes de la Beat Generation ?",a:"Howl (Hurlement)",detail:"Publié par Lawrence Ferlinghetti à San Francisco (City Lights), le poème s'ouvre sur une évocation des « meilleurs esprits » de sa génération détruits par la folie. Le procès pour obscénité de 1957 se conclut par un acquittement, victoire pour la liberté d'expression. Avec Jack Kerouac (Sur la route) et William Burroughs (Le Festin nu), Ginsberg incarne la Beat Generation."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle poète américaine, auteure de La Cloche de détresse (1963), est une figure majeure de la poésie confessionnelle ?",a:"Sylvia Plath (1932-1963)",detail:"La Cloche de détresse, roman autobiographique publié sous pseudonyme peu avant le suicide de Plath, décrit la dépression d'une jeune femme brillante dans l'Amérique des années 1950. Sa poésie — Ariel, publiée posthumément — est une plongée viscérale dans la mort et la renaissance."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier indien de langue anglaise, auteur des Enfants de minuit (1981), reçoit le Booker of Bookers en 1993 ?",a:"Salman Rushdie (né en 1947)",detail:"Les Enfants de minuit, dont les héros naissent à l'heure de l'indépendance indienne (minuit, 15 août 1947), est une saga magico-réaliste sur l'histoire de l'Inde moderne. Les Versets sataniques (1988) valent à Rushdie une fatwa de l'ayatollah Khomeini (1989), qui le contraint à vivre caché. En 2022, il est grièvement blessé au couteau lors d'une conférence aux États-Unis."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier français crée en 1905 le personnage d'Arsène Lupin, « gentleman cambrioleur » ?",a:"Maurice Leblanc (1864-1941)",detail:"Le roman policier français naît avec Émile Gaboriau (L'Affaire Lerouge, 1866, et l'inspecteur Lecoq). Il se popularise au début du XXe siècle avec Arsène Lupin, le Rouletabille de Gaston Leroux et Fantômas (1911) de Marcel Allain et Pierre Souvestre. Georges Simenon et son commissaire Maigret (1931) donnent au genre ses lettres de noblesse."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier britannique est l'auteur de 1984 et de La Ferme des animaux, deux dystopies antitotalitaires majeures ?",a:"George Orwell (Eric Arthur Blair, 1903-1950)",detail:"La Ferme des animaux (1945) est une allégorie de la révolution soviétique et de la trahison stalinienne des idéaux révolutionnaires. 1984 invente 'Big Brother', la 'novlangue' et la 'double-pensée', des concepts entrés dans le langage courant pour décrire les dérives totalitaires."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quelle romancière canadienne publie La Servante écarlate (1985), dystopie féministe adaptée en série en 2017 ?",a:"Margaret Atwood (née en 1939)",detail:"La Servante écarlate imagine une théocratie patriarcale aux États-Unis où les femmes fertiles sont réduites à leur fonction reproductrice. La série Hulu (2017) provoque un regain d'intérêt mondial, les femmes manifestant déguisées en servantes lors de protestations féministes."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel auteur francophone marocain, auteur de La Boîte à merveilles (1954), est le fondateur de la littérature marocaine de langue française ?",a:"Ahmed Sefrioui (1915-2004)",detail:"La Boîte à merveilles, l'un des premiers romans marocains de langue française, est un récit d'enfance dans la médina de Fès. Sefrioui ouvre la voie à une riche littérature maghrébine francophone, dont Driss Chraïbi, Tahar Ben Jelloun, Kateb Yacine et Assia Djebar seront des figures majeures."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel roman de J.M. Coetzee (1999), qui lui vaut son second Booker Prize, suit un professeur déchu dans l'Afrique du Sud post-apartheid ?",a:"Disgrâce",detail:"David Lurie, professeur au Cap renvoyé après une liaison avec une étudiante, se réfugie chez sa fille dans une ferme isolée, où ils subissent une agression violente. Le roman provoque une controverse en Afrique du Sud, certains y voyant une vision pessimiste, voire raciste, de la transition. Coetzee s'installe en Australie en 2002 et reçoit le Nobel en 2003."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel poète irlandais, auteur de La Terre des désirs et des Cygnes sauvages à Coole, reçoit le Nobel en 1923 ?",a:"William Butler Yeats (1865-1939)",detail:"Yeats, figure centrale du Renouveau celtique irlandais et sénateur de la République irlandaise, développe une poésie symboliste nourrie de mythologie celtique et de mysticisme. Son poème La Seconde Venue (1919) est l'un des plus cités du XXe siècle."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier autrichien, auteur de L'Homme sans qualités (1930-1943), laisse une œuvre inachevée considérée comme le plus grand roman de langue allemande du XXe siècle ?",a:"Robert Musil (1880-1942)",detail:"L'Homme sans qualités, roman inachevé de plus de 1700 pages, est une satire et une méditation sur la dissolution de l'Empire austro-hongrois à la veille de la Première Guerre mondiale. Son personnage central, Ulrich, cherche à trouver 'le sens de la vie' dans une société en décomposition."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel est le premier roman de Toni Morrison (1970), sur une fillette noire qui rêve d'avoir les yeux bleus ?",a:"L'Œil le plus bleu (The Bluest Eye)",detail:"Pecola Breedlove, maltraitée et méprisée, rêve d'avoir les yeux bleus des fillettes blanches qu'on lui présente comme modèles de beauté. Morrison y analyse l'intériorisation du racisme. Elle était alors éditrice chez Random House ; elle recevra le prix Nobel en 1993."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quelle romancière française reçoit le prix Goncourt 1984 pour L'Amant ?",a:"Marguerite Duras (1914-1996)",detail:"L'Amant, récit autobiographique de la liaison entre une adolescente française et un riche Chinois dans l'Indochine coloniale, se vend à plus de 2 millions d'exemplaires. Duras est aussi scénariste (Hiroshima mon amour, 1959) et cinéaste (India Song). Elle n'a jamais reçu le Nobel."},
{theme:"litterature",diff:"moyen",type:"q",q:"Contre quel candidat Mario Vargas Llosa perd-il l'élection présidentielle péruvienne de 1990 ?",a:"Alberto Fujimori",detail:"Candidat d'une coalition de centre droit libérale, Vargas Llosa est donné favori mais perd au second tour face à un outsider, Alberto Fujimori, qui gouvernera de manière de plus en plus autoritaire jusqu'en 2000. Vargas Llosa raconte cette campagne dans Le Poisson dans l'eau (1993). Il reçoit le Nobel en 2010."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel mouvement littéraire américain des années 1950-60, incarné par Kerouac, Ginsberg et Burroughs, célèbre la liberté, la route et la contre-culture ?",a:"La Beat Generation",detail:"La Beat Generation (de 'beaten down' et 'beatitude') naît à New York autour de Columbia University. Sur la route de Kerouac (1957), Howl de Ginsberg (1956) et Le Festin nu de Burroughs (1959) sont ses manifestes. Elle influencera directement la contre-culture des années 1960."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel romancier français, auteur du Voyage au bout de la nuit (1932), scandalise avec un style oral révolutionnaire mais est compromis par ses écrits antisémites ?",a:"Louis-Ferdinand Céline (1894-1961)",detail:"Voyage au bout de la nuit bouleverse la langue romanesque par l'argot, la syntaxe orale et un pessimisme radical. Mais Céline publie des pamphlets violemment antisémites (1937-1941) et se compromet avec la collaboration, ce qui fait de lui l'une des figures les plus controversées de la littérature française. Des manuscrits inédits retrouvés ont été publiés à partir de 2022 (Guerre, Londres)."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle romancière britannique, auteure de Orgueil et Préjugés (1813), est la fondatrice du roman de mœurs anglais ?",a:"Jane Austen (1775-1817)",detail:"Austen publie anonymement ('par une dame') et observe avec une ironie mordante la société provinciale anglaise et ses rituels matrimoniaux. Ses six romans, longtemps sous-estimés comme 'littérature féminine', sont aujourd'hui au canon de la littérature mondiale."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel auteur martiniquais, cofondateur de la négritude, publie en 1939 Cahier d'un retour au pays natal, poème fondateur de la littérature caribéenne ?",a:"Aimé Césaire (1913-2008)",detail:"Député de la Martinique et maire de Fort-de-France pendant 56 ans (1945-2001), Césaire cofonde à Paris, avec Senghor et Léon-Gontran Damas, le mouvement de la négritude. Son Cahier d'un retour au pays natal, long poème en prose, dénonce le colonialisme et affirme la dignité noire. Il est aussi l'auteur du Discours sur le colonialisme (1950)."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel ami de Kafka refuse de détruire ses manuscrits et publie Le Procès, Le Château et L'Amérique ?",a:"Max Brod",detail:"Kafka avait demandé à Brod de brûler tous ses écrits inédits. Brod désobéit et publie Le Procès (1925), Le Château (1926) et L'Amérique (1927), faisant de Kafka un géant de la littérature mondiale. La Métamorphose (1915) et La Colonie pénitentiaire (1919) faisaient partie des rares textes publiés du vivant de l'auteur."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel poète français du XVIe siècle, chef de file de La Pléiade, est l'auteur des Amours et des Odes ?",a:"Pierre de Ronsard (1524-1585)",detail:"Ronsard et du Bellay fondent la Pléiade pour enrichir et ennoblir la langue française, en imitant les grands auteurs antiques. Ronsard est surnommé 'le prince des poètes' et 'le poète des princes' pour sa célébration de l'amour, de la nature et de la fuite du temps (carpe diem)."},
{theme:"philo",diff:"facile",type:"q",q:"Quelle formule attribuée à Socrate résume sa conception de la sagesse comme reconnaissance de sa propre ignorance ?",a:"Socrate : je sais que je ne sais rien — la reconnaissance de l'ignorance est le début de la sagesse et distingue le philosophe du sophiste",detail:"Dans l'Apologie de Platon, Socrate explique pourquoi l'oracle de Delphes l'a déclaré le plus sage : contrairement aux politiciens, poètes et artisans, il ne croit pas savoir ce qu'il ne sait pas. La formule « je sais que je ne sais rien » ne figure pas mot pour mot chez Platon, mais en résume l'esprit. La philosophie commence par ce dépouillement des fausses certitudes."},
{theme:"philo",diff:"moyen",type:"q",q:"Quelle distinction Isaiah Berlin établit-il en 1958 entre liberté négative et liberté positive dans son essai Deux conceptions de la liberté ?",a:"Isaiah Berlin (1958) distingue liberté négative (absence d'interférence d'autrui) et liberté positive (capacité de se gouverner soi-même, de se réaliser)",detail:"La liberté négative (libéralisme classique) : je suis libre si personne ne m'empêche de faire ce que je veux. La liberté positive : je suis libre si je peux réaliser mes objectifs, si je suis maître de ma vie. Berlin s'inquiète de la liberté positive qui peut légitimer des tutelles (l'État sachant mieux que moi ce qui est bon pour moi). Amartya Sen et Martha Nussbaum développent l'approche des capabilités."},
{theme:"philo",diff:"difficile",type:"q",q:"Dans quel ouvrage de 1983 Michael Walzer défend-il une conception pluraliste de la justice, refusant un principe unique de distribution ?",a:"Walzer (Spheres of Justice, 1983) : la justice consiste à ne pas laisser un bien social (argent, pouvoir, amour) dominer toutes les sphères — chaque sphère a ses propres critères de distribution",detail:"Contre le principe universel de Rawls, Walzer défend une « égalité complexe » : la santé doit être distribuée selon les besoins, le pouvoir politique selon la démocratie, les honneurs selon le mérite. La tyrannie commence quand un bien domine une autre sphère, par exemple quand l'argent achète des voix ou le pouvoir des richesses."},
{theme:"philo",diff:"facile",type:"q",q:"Comment Épicure formule-t-il son argument pour dédramatiser la mort, en jouant sur l'absence de sujet qui pourrait en souffrir ?",a:"« La mort n'est rien pour nous » : quand nous sommes, la mort n'est pas là ; quand la mort est là, nous ne sommes plus",detail:"Dans la Lettre à Ménécée, Épicure soutient que la mort, simple absence de sensation, n'est pas à craindre. Platon (Phédon) voyait au contraire dans la philosophie un exercice de la mort ; les stoïciens pratiquent la méditation de la mort (meditatio mortis). Montaigne reprend l'idée : « que philosopher, c'est apprendre à mourir ». Heidegger fait de l'être-pour-la-mort la condition d'une existence authentique."},
{theme:"philo",diff:"difficile",type:"q",q:"Qu'est-ce que la théorie cohérentiste de la vérité et comment s'oppose-t-elle à la théorie de la correspondance ?",a:"Théorie de la correspondance : une proposition est vraie si elle correspond à la réalité — Théorie cohérentiste (Bradley, Neurath) : une proposition est vraie si elle est cohérente avec l'ensemble des propositions acceptées",detail:"La théorie de la correspondance (Aristote, Russell, Wittgenstein du Tractatus) : 'la neige est blanche' est vrai si et seulement si la neige est blanche. Problème : comment accéder à la réalité pour vérifier ? La théorie cohérentiste évite ce problème : la vérité est interne au système de croyances. Critique : peut légitimer des systèmes cohérents mais faux. La théorie pragmatiste : vrai = ce qui fonctionne."},

{theme:"litterature",diff:"facile",type:"q",q:"Qui a écrit Don Quichotte, considéré comme le premier roman moderne ?",a:"Miguel de Cervantes (1605-1615)",detail:"Don Quichotte parodie les romans de chevalerie tout en inventant une fiction psychologique et réflexive moderne. C'est l'un des livres les plus traduits au monde."},
{theme:"litterature",diff:"facile",type:"d",q:"Roman de Victor Hugo (1862) sur la misère sociale et la rédemption dans la France du XIXe s.",a:"Les Misérables",detail:"Jean Valjean passe 19 ans au bagne : 5 ans pour avoir volé un pain, et 14 pour ses tentatives d'évasion. Libéré, il tente de se racheter, traqué par l'inspecteur Javert. L'œuvre dénonce la misère, les inégalités sociales et le système pénal."},
{theme:"litterature",diff:"facile",type:"q",q:"Quel poète français du XIXe s. est l'auteur des Fleurs du mal (1857) ?",a:"Charles Baudelaire",detail:"À sa parution, le recueil vaut à Baudelaire un procès pour outrage à la morale publique : six poèmes sont censurés, une condamnation annulée seulement en 1949. Baudelaire explore le spleen et la beauté du laid ; ses Petits Poèmes en prose popularisent le poème en prose. Il est considéré comme le père de la poésie moderne."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui est l'auteur de À la recherche du temps perdu, et combien de volumes compte cette œuvre ?",a:"Marcel Proust — 7 volumes (1913-1927)",detail:"La Recherche explore la mémoire involontaire déclenchée par une sensation (la madeleine dans le thé). Elle compte 3 000 personnages et 1,5 million de mots. Proust mourut avant d'en revoir les derniers volumes."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui a écrit L'Étranger et reçu le Prix Nobel de littérature en 1957 ?",a:"Albert Camus",detail:"L'Étranger (1942) met en scène Meursault, un homme qui semble indifférent à tout, même à la mort de sa mère, et qui tue un Arabe sur une plage d'Alger. Camus y explore l'absurde. Il meurt dans un accident de voiture en 1960, à 46 ans."},
{theme:"litterature",diff:"moyen",type:"q",q:"Dans quel village imaginaire se déroule Cent ans de solitude, de Gabriel García Márquez ?",a:"Macondo",detail:"Publié en 1967, le roman retrace sept générations de la famille Buendía à Macondo, village fondé par José Arcadio Buendía, de sa création à sa disparition. Le lieu s'inspire d'Aracataca, ville natale de l'auteur en Colombie. García Márquez reçoit le prix Nobel en 1982."},
{theme:"litterature",diff:"difficile",type:"d",q:"Technique narrative qui reproduit le cours non censuré des pensées d'un personnage",a:"Le flux de conscience (stream of consciousness)",detail:"Le terme vient du psychologue William James (1890). Après Édouard Dujardin (Les lauriers sont coupés, 1887), James Joyce (Ulysse, 1922) et Virginia Woolf (Mrs Dalloway, 1925) abandonnent la narration linéaire pour plonger dans l'intériorité brute. Ulysse suit en 18 épisodes une seule journée à Dublin."},
{theme:"litterature",diff:"difficile",type:"d",q:"Œuvre dystopique de George Orwell (1949) décrivant une société totalitaire sous surveillance permanente",a:"1984",detail:"Big Brother, la Novlangue, le Ministère de la Vérité — autant de concepts entrés dans le langage courant. Orwell s'inspire du stalinisme et du nazisme. Le roman reste la référence absolue sur le totalitarisme."},
{theme:"litterature",diff:"difficile",type:"d",q:"Courant littéraire du XIXe s. visant à représenter la réalité sociale avec rigueur quasi-scientifique",a:"Le naturalisme (Zola)",detail:"Zola théorise le « roman expérimental » dans lequel l'écrivain observe les effets de l'hérédité et du milieu. Le cycle des Rougon-Macquart (20 romans, 1871-1893) en est la réalisation la plus aboutie."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui est l'auteur de Si c'est un homme (1947), témoignage littéraire fondamental sur l'expérience d'Auschwitz ?",a:"Primo Levi (1919-1987)",detail:"Primo Levi, chimiste turinois déporté à Auschwitz en 1944, publie son récit sans haine ni pathos. D'abord peu remarqué, le livre est réédité en 1958 et devient l'un des témoignages majeurs sur la Shoah. Levi raconte son retour dans La Trêve (1963)."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier américain, auteur de Sur la route (1957), est la figure emblématique de la Beat Generation ?",a:"Jack Kerouac (1922-1969)",detail:"Sur la route, tapé en trois semaines sur un rouleau de papier de 36 mètres, capture l'esprit de liberté et d'errance. Avec Allen Ginsberg (Howl) et William Burroughs (Le Festin nu), Kerouac forme le trio fondateur de la contre-culture américaine des années 1950-60."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier mexicain est l'auteur de Pedro Páramo (1955), chef-d'œuvre bref du réalisme magique influençant García Márquez ?",a:"Juan Rulfo (1917-1986)",detail:"Pedro Páramo, récit d'un mort cherchant son père dans un village fantôme, est l'un des romans les plus courts et les plus influents du XXe siècle. Rulfo ne publie que deux livres, mais leur impact sur la littérature hispanique est immense et durable."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier américain est l'auteur de L'Attrape-cœurs (1951), roman culte de l'adolescence rebelle ?",a:"J.D. Salinger (1919-2010)",detail:"L'Attrape-cœurs, narré par l'adolescent Holden Caulfield, devient la bible de la jeunesse américaine. Salinger, traumatisé par son succès, se réfugie dans un isolement total dès les années 1960 et ne publie plus rien jusqu'à sa mort."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle romancière française, auteure de La Princesse de Clèves (1678), écrit le premier roman psychologique de la littérature française ?",a:"Madame de La Fayette (1634-1693)",detail:"La Princesse de Clèves inaugure l'étude des passions intérieures dans le roman français. Le célèbre 'aveu' de l'héroïne à son mari reste un moment fondateur de la littérature française classique."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel poète américain, auteur des Feuilles d'herbe (1855), célèbre le corps et la démocratie dans une poésie libre révolutionnaire ?",a:"Walt Whitman (1819-1892)",detail:"Whitman publie et réécrit sans cesse les Feuilles d'herbe tout au long de sa vie. Son vers libre et son souffle épique influencent toute la poésie américaine moderne, de Ginsberg à Langston Hughes."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier turc, auteur de Mon nom est Rouge (1998) et Neige (2002), reçoit le Prix Nobel en 2006 ?",a:"Orhan Pamuk (né en 1952)",detail:"Pamuk est poursuivi pour 'insulte à la turquité' après avoir évoqué publiquement le génocide arménien. Ses romans explorent la tension entre tradition ottomane et modernité occidentale dans la Turquie contemporaine."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel poète et romancier chilien, auteur des Vingt poèmes d'amour (1924), reçoit le Prix Nobel en 1971 ?",a:"Pablo Neruda (1904-1973)",detail:"Neruda, militant communiste et diplomate, écrit une poésie amoureuse, politique et cosmique (Chant général, 1950). Ses Vingt poèmes d'amour et une chanson désespérée, publiés à 20 ans, comptent parmi les recueils les plus vendus en espagnol. Il meurt douze jours après le coup d'État de Pinochet ; en 2023, des experts ont relancé l'hypothèse d'un empoisonnement."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle poète afro-américaine lit un poème à l'investiture de Bill Clinton en 1993 et est l'auteure de Je sais pourquoi l'oiseau en cage chante (1969) ?",a:"Maya Angelou (1928-2014)",detail:"Maya Angelou mêle poésie, autobiographie et militantisme. Je sais pourquoi l'oiseau en cage chante décrit son enfance marquée par la pauvreté et le racisme dans l'Arkansas des années 1930."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier français est l'auteur de La Condition humaine (1933, Prix Goncourt), sur l'insurrection communiste à Shanghai ?",a:"André Malraux (1901-1976)",detail:"La Condition humaine explore la fraternité et l'engagement à travers la répression du soulèvement communiste de 1927. Malraux, lui-même engagé en Espagne et dans la Résistance, devient ministre de la Culture de De Gaulle de 1959 à 1969."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier britannique, auteur d'Au cœur des ténèbres (1899), explore la violence coloniale dans l'État indépendant du Congo ?",a:"Joseph Conrad (1857-1924)",detail:"Né en Pologne, Conrad n'apprend vraiment l'anglais qu'à vingt ans passés, après une carrière de marin. Au cœur des ténèbres, publié en revue en 1899 puis en volume en 1902, s'inspire de son voyage sur le fleuve Congo en 1890, quand le territoire était la propriété personnelle de Léopold II. Il a inspiré Apocalypse Now de Coppola (1979)."},
{theme:"litterature",diff:"moyen",type:"q",q:"Qui écrit Les Hauts de Hurlevent (1847), unique roman de cette auteure, chef-d'œuvre du romantisme gothique anglais ?",a:"Emily Brontë (1818-1848)",detail:"Les Hauts de Hurlevent, publié sous pseudonyme masculin (Ellis Bell), est d'abord mal reçu pour sa violence. Réévalué au XXe siècle, il est aujourd'hui considéré comme l'un des plus grands romans anglais, notamment pour son héros Heathcliff."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quelle romancière française reçoit le Prix Nobel en 2022, première Française à l'obtenir, pour une œuvre explorant la mémoire et les dominations sociales ?",a:"Annie Ernaux (née en 1940)",detail:"Ernaux, auteure de La Place, Les Années, pratique une 'écriture plate' autobiographique explorant la transfuge de classe et la honte sociale. Les Années (2008), mémoire collective d'une génération, est son œuvre la plus célébrée à l'étranger."},
{theme:"economie",diff:"facile",type:"q",q:"Qui est considéré comme le père fondateur de l'économie libérale moderne ?",a:"Adam Smith (La Richesse des nations, 1776)",detail:"Smith introduit la « main invisible » : les individus qui cherchent leur intérêt personnel contribuent sans le vouloir à la richesse collective. Il défend la division du travail et le libre-échange."},
{theme:"economie",diff:"facile",type:"d",q:"Indicateur mesurant la valeur de l'ensemble des biens et services produits dans un pays en un an",a:"Le PIB (Produit Intérieur Brut)",detail:"Le PIB est la mesure standard de la richesse économique. Critiqué car il ne mesure pas le bonheur ni les inégalités. Des alternatives comme l'IDH ou le Bonheur National Brut ont été proposées."},
{theme:"economie",diff:"facile",type:"q",q:"Quelle institution est chargée de la politique monétaire de la zone euro ?",a:"La Banque Centrale Européenne (BCE)",detail:"Fondée en 1998, siège à Francfort, la BCE fixe les taux d'intérêt directeurs. En 2012, Mario Draghi a sauvé l'euro avec sa phrase : « Whatever it takes. »"},
{theme:"economie",diff:"moyen",type:"q",q:"Quelle est la thèse centrale de Keynes sur le rôle de l'État en récession ?",a:"L'État doit stimuler la demande par la dépense publique (relance budgétaire)",detail:"Dans la Théorie générale (1936), Keynes réfute l'idée que les marchés s'auto-régulent. En récession, l'État doit compenser la chute de la demande privée. Cette vision guidera le New Deal et les politiques d'après-guerre."},
{theme:"economie",diff:"moyen",type:"d",q:"Phénomène par lequel une hausse généralisée des prix érode le pouvoir d'achat",a:"L'inflation",detail:"Mesurée par l'indice des prix à la consommation (IPC). Une inflation modérée (~2 %) est considérée saine. L'hyperinflation (Allemagne 1923, Zimbabwe 2008) peut détruire une économie en quelques mois."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le « dilemme du prisonnier » en théorie des jeux ?",a:"Une situation où deux acteurs rationnels prennent une décision sous-optimale faute de coopération",detail:"Deux prisonniers peuvent se dénoncer ou se taire. En agissant chacun dans son intérêt, tous deux se dénoncent — et sont plus lourdement condamnés qu'en coopérant. Ce paradoxe explique de nombreuses défaillances de la coopération internationale."},
{theme:"economie",diff:"difficile",type:"q",q:"Qu'est-ce que la « destruction créatrice » selon Schumpeter ?",a:"Le capitalisme progresse en détruisant continuellement les structures existantes pour en créer de nouvelles",detail:"Dans Capitalisme, socialisme et démocratie (1942), l'innovation est le moteur du capitalisme : l'automobile détruit l'industrie du cheval, internet détruit la presse papier — tout en créant de nouvelles richesses."},
{theme:"economie",diff:"difficile",type:"d",q:"Situation où les marchés financiers s'emballent dans une spirale spéculative déconnectée de la valeur réelle",a:"Une bulle spéculative",detail:"La tulipomanie hollandaise (1637), la crise de 1929, la bulle internet (2000) et la crise des subprimes (2007-2008) suivent un schéma voisin : euphorie, survalorisation, panique, effondrement. À chaque fois, on entend que « cette fois, c'est différent », formule qui a donné son titre à un livre de Reinhart et Rogoff (2009)."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste britannique publie en 1890 les Principes d'économie, synthèse de l'analyse néoclassique de l'offre et de la demande ?",a:"Alfred Marshall (1842-1924)",detail:"Marshall formalise la microéconomie moderne : courbes d'offre et de demande, élasticité, surplus du consommateur, équilibre partiel. Il intègre l'utilité marginale, découverte dans les années 1870 par Jevons, Menger et Walras, à une analyse des coûts de production. Son cadre reste la base des manuels."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste autrichien s'oppose frontalement à Keynes dans les années 1930 et théorise que les cycles économiques sont causés par l'expansion artificielle du crédit ?",a:"Friedrich Hayek (1899-1992) — Prix Nobel 1974",detail:"Hayek, chef de file de l'École autrichienne, argue que les taux d'intérêt artificiellement bas faussent les signaux de marché. Son œuvre La Route de la servitude (1944) critique le planisme. Ses idées influencent Thatcher et Reagan dans les années 1980."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste américain popularise le monétarisme et démontre que la Grande Dépression a été aggravée par une erreur de politique monétaire de la Fed ?",a:"Milton Friedman (1912-2006) — Prix Nobel 1976",detail:"Avec Anna Schwartz, Friedman montre dans Une histoire monétaire des États-Unis (1963) que la Fed a laissé la masse monétaire chuter d'environ un tiers entre 1929 et 1933. Il défend une règle de croissance stable de la monnaie et théorise le « taux de chômage naturel » (1968), en dessous duquel une relance ne produit que de l'inflation."},
{theme:"economie",diff:"facile",type:"q",q:"Quelle crise financière mondiale, déclenchée par l'effondrement du marché des subprimes américains, frappe l'économie mondiale à partir de 2008 ?",a:"La crise des subprimes (2007-2008) — Grande Récession",detail:"Les subprimes sont des prêts immobiliers accordés à des emprunteurs fragiles, titrisés et vendus dans le monde entier. La faillite de Lehman Brothers, le 15 septembre 2008, déclenche une crise systémique. En 2009, le PIB mondial recule pour la première fois depuis l'après-guerre, et des dizaines de milliers de milliards de dollars de richesse financière s'évaporent."},
{theme:"economie",diff:"facile",type:"q",q:"Quelle organisation internationale, créée en 1944 à Bretton Woods, régule le système monétaire mondial et prête aux pays en difficulté de balance des paiements ?",a:"Le Fonds Monétaire International (FMI)",detail:"Le FMI et la Banque mondiale naissent à la conférence de Bretton Woods. Le FMI surveille les politiques économiques et accorde des prêts assortis de conditions (ajustement structurel) aux pays en crise. Il compte 191 membres et son siège est à Washington ; sa direction revient traditionnellement à un Européen."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel accord de libre-échange, entré en vigueur en 1994, unit les États-Unis, le Canada et le Mexique, et sous quel nom est-il renégocié ?",a:"L'ALENA ; il est remplacé en 2020 par l'ACEUM (USMCA), négocié sous la première présidence Trump",detail:"L'ALENA supprime l'essentiel des droits de douane entre les trois pays et crée alors la plus grande zone de libre-échange du monde. L'ACEUM, signé en 2018 et entré en vigueur en 2020, durcit notamment les règles d'origine dans l'automobile. Il doit faire l'objet d'un réexamen conjoint en 2026."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel phénomène économique désigne la coexistence d'une inflation élevée et d'un chômage élevé, frappant les économies occidentales dans les années 1970 ?",a:"La stagflation",detail:"La stagflation contredit la courbe de Phillips (qui prédisait un arbitrage entre inflation et chômage) et invalide la politique keynésienne de relance. Elle ouvre la voie au monétarisme et aux politiques de désinflation compétitive des années 1980."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste indien, Prix Nobel 1998, développe la théorie des capabilités et co-crée l'Indice de Développement Humain (IDH) avec le PNUD en 1990 ?",a:"Amartya Sen (né en 1933)",detail:"Sen propose de mesurer le développement par les libertés et capacités réelles des individus (santé, éducation, participation). Ses travaux sur les famines montrent qu'elles résultent de défaillances politiques et d'inégalités dans l'accès à la nourriture, non de pénuries absolues."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste français publie en 2013 Le Capital au XXIe siècle, montrant que le taux de rendement du capital tend à dépasser le taux de croissance ?",a:"Thomas Piketty (né en 1971)",detail:"Piketty montre à partir de données historiques que r > g entraîne une concentration croissante des richesses. Son livre, traduit dans 40 langues, relance le débat mondial sur la taxation du capital et les inégalités patrimoniales."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel mécanisme de politique monétaire consiste pour une banque centrale à acheter massivement des actifs financiers pour injecter des liquidités quand les taux sont déjà à zéro ?",a:"L'assouplissement quantitatif (Quantitative Easing ou QE)",detail:"Le QE est pratiqué par la Fed dès 2008, puis par la BCE à partir de 2015. Il gonfle le bilan des banques centrales (plus de 8 000 milliards $ pour la Fed) mais son efficacité sur l'économie réelle reste débattue."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste américain Prix Nobel 2001 montre dans 'The Market for Lemons' que l'asymétrie d'information conduit à la défaillance des marchés ?",a:"George Akerlof (né en 1940)",detail:"Akerlof montre que sur le marché des voitures d'occasion, l'incertitude sur la qualité pousse les bons vendeurs à quitter le marché, ne laissant que les mauvaises voitures ('lemons'). Ce modèle s'applique aux marchés du crédit, de l'assurance et de la santé."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel psychologue israélo-américain, Prix Nobel d'économie 2002, fonde l'économie comportementale en distinguant pensée rapide (Système 1) et pensée lente (Système 2) ?",a:"Daniel Kahneman (1934-2024)",detail:"Kahneman, avec Amos Tversky, développe la théorie des perspectives : les pertes pèsent deux fois plus que les gains équivalents (aversion à la perte). Son livre Système 1 / Système 2 (2011) est un best-seller mondial de vulgarisation."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste britannique du XVIIIe siècle théorise l'avantage comparatif, montrant que le libre-échange bénéficie à tous même quand un pays est moins efficace dans toutes les productions ?",a:"David Ricardo (1772-1823)",detail:"Dans ses Principes de l'économie politique et de l'impôt (1817), Ricardo prend l'exemple du Portugal et de l'Angleterre : même si le Portugal produit à la fois le vin et le drap plus efficacement, les deux pays gagnent à se spécialiser là où leur avantage relatif est le plus grand. C'est le fondement théorique du libre-échange."},
{theme:"economie",diff:"moyen",type:"q",q:"Quelle courbe popularisée en 1974 suggère qu'au-delà d'un certain taux d'imposition, augmenter les impôts réduit les recettes fiscales ?",a:"La courbe de Laffer — Arthur Laffer",detail:"Selon la légende, Laffer dessine sa courbe sur une serviette lors d'un dîner à Washington, en 1974, devant Donald Rumsfeld et Dick Cheney, alors collaborateurs du président Ford. Elle inspire les baisses d'impôts de la « Reaganomics ». L'adage « trop d'impôt tue l'impôt » est ancien ; le niveau du seuil reste très débattu."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste américain forge le concept de 'consommation ostentatoire' dans La Théorie de la classe de loisir (1899), décriant la dépense comme signal de statut social ?",a:"Thorstein Veblen (1857-1929)",detail:"Les 'biens Veblen' sont ceux dont la demande augmente avec le prix (luxe, art, grandes écoles). Veblen fonde l'institutionnalisme américain, courant critique du capitalisme qui analyse les institutions et les comportements sociaux plutôt que les seuls marchés."},
{theme:"economie",diff:"facile",type:"q",q:"Quelle organisation internationale, créée en 1995 en remplacement du GATT, régule le commerce mondial et arbitre les différends commerciaux entre ses 166 membres ?",a:"L'Organisation mondiale du commerce (OMC)",detail:"L'OMC organise les négociations commerciales et dispose d'un mécanisme de règlement des différends, longtemps considéré comme son principal atout. Il est paralysé depuis 2019, les États-Unis bloquant la nomination des juges de l'Organe d'appel. Le cycle de Doha, lancé en 2001, est au point mort depuis 2008."},
{theme:"economie",diff:"facile",type:"q",q:"Quel regroupement de 20 grandes économies représentant 85 % du PIB mondial devient le principal forum de coordination économique mondiale après la crise de 2008 ?",a:"Le G20",detail:"Créé en 1999, le G20 réunit 19 grandes économies, l'Union européenne et, depuis 2023, l'Union africaine. D'abord réunion de ministres des Finances, il devient un sommet de chefs d'État en 2008 pour coordonner les plans de relance et la régulation financière (accords de Bâle III). Il n'a pas de pouvoir contraignant."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel phénomène désigne la désindustrialisation d'un pays causée par l'appréciation de sa monnaie suite à l'exploitation d'une ressource naturelle, observé aux Pays-Bas après 1959 ?",a:"Le syndrome hollandais (Dutch disease)",detail:"L'exportation de gaz naturel apprécie le florin néerlandais, rendant les exportations manufacturières moins compétitives. Ce phénomène se retrouve dans de nombreux pays pétroliers (Venezuela, Nigeria) et s'applique aussi aux afflux massifs d'aide internationale."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste américain Prix Nobel 2008 développe la 'nouvelle théorie du commerce international' basée sur les rendements croissants, les économies d'échelle et la géographie économique ?",a:"Paul Krugman (né en 1953)",detail:"Krugman explique pourquoi des pays similaires échangent les mêmes types de produits (commerce intra-branche : l'Allemagne et la France échangent des voitures). Sa théorie de la nouvelle géographie économique explique la concentration industrielle dans certaines régions."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste britannique propose la taxe pigouvienne pour corriger les externalités négatives en faisant payer aux pollueurs le coût social de leur activité ?",a:"Arthur Pigou (1877-1959)",detail:"Une externalité négative (pollution, embouteillages) impose un coût à la société non reflété dans les prix de marché. La taxe pigouvienne, comme la taxe carbone, internalise ce coût externe. C'est le fondement théorique des marchés du carbone et des taxes environnementales."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel théorème économique affirme qu'en l'absence de coûts de transaction, les parties peuvent négocier pour corriger les externalités sans intervention publique ?",a:"Le théorème de Coase — Ronald Coase (Nobel 1991)",detail:"Coase montre que la réglementation publique n'est pas toujours nécessaire si les droits sont clairement définis et les coûts de négociation faibles. Cela inspire les marchés de droits à polluer (EU ETS européen) comme alternative à la taxe pigouvienne."},
{theme:"economie",diff:"facile",type:"q",q:"Quel indicateur statistique mesure le degré d'inégalité dans la distribution des revenus, allant de 0 (égalité parfaite) à 1 (inégalité maximale) ?",a:"Le coefficient de Gini — Corrado Gini (1912)",detail:"Les pays scandinaves ont des Gini autour de 0,25-0,28, les États-Unis autour de 0,40, l'Afrique du Sud autour de 0,60. C'est la mesure d'inégalité la plus utilisée internationalement, mais elle ne capture pas les inégalités de patrimoine aussi bien que les inégalités de revenus."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste américain Prix Nobel 1995 montre que si les agents anticipent rationnellement les politiques économiques, ils les neutralisent — invalidant les modèles keynésiens ?",a:"Robert Lucas (1937-2023) — théorie des anticipations rationnelles",detail:"La « critique de Lucas » (1976) montre que les relations économiques estimées sur le passé changent quand la politique change, car les agents adaptent leurs anticipations : les grands modèles économétriques keynésiens ne permettent donc pas d'évaluer de nouvelles politiques. Elle fonde la « nouvelle macroéconomie classique ». L'idée que les ménages épargnent une relance en prévision d'impôts futurs relève, elle, de l'équivalence ricardienne (Barro, 1974)."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel phénomène de panique bancaire, illustré par la faillite de la Silicon Valley Bank en 2023, est une prophétie auto-réalisatrice où la crainte de faillite suffit à provoquer la faillite ?",a:"Le bank run (ruée bancaire)",detail:"Le bank run de SVB (mars 2023) est le premier de l'ère des réseaux sociaux : des rumeurs sur Twitter déclenchent 42 milliards de dollars de retraits en une journée, rendant la banque insolvable. La garantie des dépôts (100 000 € en Europe) existe pour prévenir ces paniques."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste américain Prix Nobel 2001, auteur de La Grande Désillusion, critique les 'thérapies de choc' du FMI imposées aux pays en développement dans les années 1990 ?",a:"Joseph Stiglitz (né en 1943)",detail:"Stiglitz, ancien économiste en chef de la Banque mondiale, critique les privatisations précipitées, l'austérité et la libéralisation rapide des capitaux imposées par le FMI. Il plaide pour une mondialisation équitable tenant compte des inégalités et des spécificités nationales."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel modèle de croissance (1956) montre que seul le progrès technologique explique la croissance à long terme, le capital seul étant soumis aux rendements décroissants ?",a:"Le modèle de Solow — Robert Solow (Nobel 1987)",detail:"Solow montre que si le capital est le seul facteur accumulable, la croissance s'épuise (état stationnaire). Seul le progrès technique exogène ('manne tombée du ciel') permet une croissance durable. Cette limite inspire les théories de la croissance endogène de Romer et Lucas."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel dilemme montre que le pays émetteur de la monnaie de réserve mondiale doit s'endetter pour fournir de la liquidité mondiale, fragilisant ainsi sa monnaie à terme ?",a:"Le dilemme de Triffin — Robert Triffin (1960)",detail:"Triffin prédit que le dollar ne peut pas rester éternellement la monnaie de réserve mondiale sans que les déficits américains finissent par miner sa crédibilité. Sa prédiction se réalise partiellement avec la fin du système de Bretton Woods en 1971 (Nixon Shock)."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel concept de l'économie comportementale désigne la modification de l'architecture des choix pour orienter les décisions sans contrainte ni incitation financière — associé à Richard Thaler (Nobel 2017) ?",a:"Le nudge (coup de pouce)",detail:"Thaler montre que la façon dont les options sont présentées influe massivement sur les choix (opt-in vs opt-out pour les retraites). Le nudge est adopté par de nombreux gouvernements pour améliorer l'épargne retraite, la sécurité routière et les comportements de santé."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel concept développé par Daron Acemoglu, Simon Johnson et James Robinson (Nobel 2024) explique les différences de richesse entre nations par la qualité de leurs institutions politiques ?",a:"La distinction entre institutions 'inclusives' (participatives, innovantes) et 'extractives' (concentrant les richesses au profit d'une élite)",detail:"Dans Pourquoi les nations échouent (2012), ils montrent que c'est la qualité des institutions et non la géographie, la culture ou la religion qui détermine le développement. Ils étudient des 'expériences naturelles' comme la comparaison Corée du Nord / Corée du Sud."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel phénomène observe que la volatilité des cours boursiers est bien trop élevée pour être justifiée par les seules variations des dividendes futurs, remettant en cause les marchés efficients ?",a:"L'excès de volatilité (excess volatility) — Robert Shiller (Nobel 2013)",detail:"Shiller remet en cause l'hypothèse des marchés efficients de Fama. Il développe le ratio CAPE (prix/bénéfices corrigé du cycle) pour détecter les surévaluations boursières et prédit correctement la bulle internet (2000) et la bulle immobilière (2006)."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel phénomène désigne la hausse structurelle du coût des services (santé, éducation, arts du spectacle) par rapport aux biens manufacturés, du fait de la faible progression de leur productivité ?",a:"La maladie de Baumol (Baumol's cost disease) — William Baumol (1967)",detail:"Baumol et Bowen (1966) observent qu'un quatuor à cordes exige toujours autant de musiciens et de temps qu'au XVIIIe siècle, alors que la productivité de l'industrie progresse fortement. Les salaires des services suivant ceux de l'économie, les coûts des services à forte intensité humaine (santé, éducation, spectacle) augmentent structurellement, ce qui pèse sur les dépenses publiques."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel concept de la théorie des jeux désigne un profil de stratégies où aucun joueur n'a intérêt à s'écarter unilatéralement — du nom d'un mathématicien américain Prix Nobel 1994 ?",a:"L'équilibre de Nash — John Nash (1928-2015)",detail:"L'équilibre de Nash généralise l'analyse stratégique à tous les jeux. Il s'applique aux guerres de prix entre oligopoles, à la course aux armements, aux négociations commerciales. La vie de Nash, marquée par la schizophrénie, inspire le film A Beautiful Mind (2001)."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste et historien d'origine austro-hongroise montre dans La Grande Transformation (1944) que l'économie de marché est une construction historique récente qui suscite des contre-mouvements de protection ?",a:"Karl Polanyi (1886-1964)",detail:"Pour Polanyi, la transformation au XIXe siècle du travail, de la terre et de la monnaie en « marchandises fictives » a provoqué des réactions de défense de la société : syndicats, protection sociale, protectionnisme, jusqu'aux fascismes. Son analyse nourrit les critiques contemporaines de la mondialisation."},
{theme:"economie",diff:"moyen",type:"q",q:"Quel économiste péruvien est l'auteur du Mystère du capital (2000), expliquant que la pauvreté persiste faute de titres de propriété formels permettant aux pauvres d'accéder au crédit ?",a:"Hernando de Soto (né en 1941)",detail:"De Soto montre que les pauvres des pays en développement possèdent des actifs réels (maisons, terres) mais sans titres légaux formels, ces actifs sont du 'capital mort' : ils ne peuvent pas servir de garantie pour obtenir du crédit et entreprendre."},
