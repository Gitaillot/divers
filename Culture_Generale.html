{theme:"gastro",diff:"moyen",type:"q",q:"Quel sel marin produit uniquement dans les marais salants de Guérande (Loire-Atlantique) est récolté à la main et doit sa couleur grise à l'argile des bassins ?",a:"Le sel de Guérande (fleur de sel et gros sel gris)",detail:"Les paludiers récoltent la fleur de sel (qui flotte à la surface) et le gros sel gris (déposé sur le fond argileux) à la main, avec des outils traditionnels. La fleur de sel de Guérande est réputée pour sa finesse et ses arômes d'iode et de violette. Elle bénéficie d'un Label Rouge et d'une IGP. Les marais salants de Guérande couvrent 2 000 hectares et existent depuis l'époque mérovingienne."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle race bovine blanche, originaire de la région de Charolles en Bourgogne, est l'une des grandes races à viande du monde ?",a:"La charolaise",detail:"Sélectionnée pour la viande depuis le XVIIIe siècle, la charolaise est une race massive à la robe blanche ou crème, aujourd'hui élevée dans des dizaines de pays. Sa viande, tendre et peu grasse, bénéficie de labels de qualité ; le bœuf de Charolles est protégé par une AOP depuis 2014."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelle controverse éthique et culturelle entoure la production du caviar d'esturgeon, et quels pays ont développé des alternatives durables face à l'effondrement des populations d'esturgeons sauvages de la mer Caspienne ?",a:"Les esturgeons comptent parmi les animaux les plus menacés du monde : la plupart des espèces sont en danger critique, leur commerce est encadré par la CITES depuis 1998, et l'aquaculture (Chine, Italie, France) a remplacé la pêche sauvage de la Caspienne",detail:"La Caspienne abritait l'essentiel des esturgeons producteurs de caviar. La surpêche et le braconnage après la chute de l'URSS les ont presque décimés. L'UICN classe la plupart des espèces d'esturgeons en danger critique d'extinction. La Chine est devenue le premier producteur de caviar d'élevage ; la France en produit notamment en Aquitaine."},
{theme:"gastro",diff:"facile",type:"q",q:"Quelle ville est souvent désignée comme la capitale mondiale de la street food, avec ses marchés nocturnes et ses hawker centres où se côtoient cuisine chinoise, malaise et indienne ?",a:"Singapour — ses hawker centres sont inscrits au patrimoine immatériel de l'UNESCO depuis 2020",detail:"Dans les hawker centres, marchés couverts, des centaines de stands proposent chacun une spécialité : poulet de Hainan, char kway teow, laksa, bak kut teh. La culture des hawkers est inscrite au patrimoine immatériel de l'UNESCO en 2020. En 2016, le Michelin étoile le stand de riz au poulet à la sauce soja de Chan Hon Meng, alors l'un des repas étoilés les moins chers du monde ; il perd son étoile en 2021."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel plat de rue mexicain, le taco al pastor, a été créé par des immigrants libanais à Mexico City dans les années 1930 et porte la trace de quelle technique culinaire du Moyen-Orient ?",a:"Le taco al pastor est inspiré du shawarma libanais — la viande de porc marinée est cuite sur une broche verticale (trompo) héritée de la rôtisserie levantine",detail:"Les immigrants libanais au Mexique au XXe siècle adaptent leur shawarma : ils remplacent l'agneau par le porc (plus courant au Mexique), ajoutent la marinade adobo (piments séchés, ananas, épices), conservent la broche verticale. Le taco al pastor est garni d'ananas, coriandre et oignon. C'est l'un des meilleurs exemples de fusion culinaire créée par l'immigration."},
{theme:"gastro",diff:"moyen",type:"q",q:"Dans quels pays la consommation de viande par habitant est-elle la plus élevée, et quel poids l'élevage a-t-il dans les émissions de gaz à effet de serre ?",a:"Hong Kong, les États-Unis, l'Australie et l'Argentine dépassent 100 kg par an et par habitant ; l'élevage représente environ 14,5 % des émissions mondiales (FAO)",detail:"Les bovins pèsent à eux seuls environ deux tiers des émissions de l'élevage. La production d'un kilo de bœuf émet plusieurs dizaines de kilos d'équivalent CO₂ et mobilise de grandes surfaces, bien plus que la volaille ou les légumineuses. Réduire la consommation de viande rouge est l'un des leviers climatiques les plus efficaces, mais aussi l'un des plus difficiles culturellement."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelle est l'origine de la cuisine 'fusion' et comment le chef Wolfgang Puck à Los Angeles dans les années 1980 a-t-il créé un nouveau paradigme gastronomique en mêlant techniques françaises et ingrédients asiatiques ?",a:"Wolfgang Puck ouvre Spago (1982) puis Chinois on Main (1983) à Los Angeles, mariant techniques françaises (fond, réduction) avec ingrédients asiatiques (gingembre, citronnelle, miso) et californiens",detail:"Wolfgang Puck, Autrichien formé en France, s'installe à Los Angeles. À Spago, il propose une pizza au saumon fumé et à la crème ; à Chinois on Main, il mêle wok et sauces françaises (canard laqué aux prunes). Il popularise l'idée qu'on peut mélanger librement les traditions culinaires. Critiquée pour son manque de cohérence, cette approche a ouvert la voie à de nombreuses cuisines contemporaines."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel régime alimentaire traditionnel méditerranéen, inscrit au patrimoine UNESCO, a été associé dans les études cliniques à une réduction du risque cardiovasculaire et de mortalité ?",a:"Le régime méditerranéen (Grèce, Italie du Sud, Espagne, Maroc) — huile d'olive, légumineuses, poissons, légumes, vin modéré — protège le cœur selon l'étude PREDIMED (2013)",detail:"L'étude espagnole PREDIMED, publiée en 2013 sur plus de 7 000 personnes, montre une réduction d'environ 30 % des accidents cardiovasculaires avec un régime méditerranéen enrichi en huile d'olive ou en noix, par rapport à un régime pauvre en graisses. Retirée puis republiée en 2018 après correction de défauts de méthode, elle confirme ses conclusions. La diète méditerranéenne est inscrite au patrimoine immatériel de l'UNESCO depuis 2010."},
{theme:"gastro",diff:"difficile",type:"q",q:"Comment l'industrie agroalimentaire a-t-elle transformé l'alimentation mondiale depuis les années 1950, et quelle classification des aliments ultra-transformés (NOVA) permet d'en mesurer l'impact sanitaire ?",a:"La classification NOVA (Carlos Monteiro, 2009) divise les aliments en 4 groupes selon leur degré de transformation — le groupe 4 (ultra-transformés) représente 60 % des calories dans les pays anglophones",detail:"La classification NOVA, développée par Carlos Monteiro (université de São Paulo), distingue : 1, aliments bruts ou peu transformés ; 2, ingrédients culinaires ; 3, aliments transformés ; 4, produits ultra-transformés (additifs, émulsifiants, arômes). Ces derniers sont associés à l'obésité, au diabète et aux maladies cardiovasculaires. En France, ils fourniraient environ un tiers des calories. Le Nutri-Score, fondé sur la composition nutritionnelle, ne tient pas compte du degré de transformation."},
{theme:"gastro",diff:"facile",type:"q",q:"Quelle pratique alimentaire française est inscrite en 2010 au patrimoine culturel immatériel de l'UNESCO, l'une des premières de ce type ?",a:"Le repas gastronomique des Français",detail:"L'UNESCO reconnaît non pas un plat ou une recette, mais une pratique sociale : la façon dont les Français partagent un repas (ordre des plats, accord mets-vins, convivialité, mise en scène de la table). Les critères incluent l'apéritif, les entrées-plat-fromage-dessert, le choix des vins, et la durée du repas. Cette inscription illustre la gastronomie comme culture et art de vivre, pas seulement comme alimentation."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel État mexicain sert d'exemple représentatif dans l'inscription de la cuisine traditionnelle mexicaine au patrimoine de l'UNESCO en 2010 ?",a:"Le Michoacán",detail:"L'inscription de la cuisine mexicaine (2010) porte sur la culture culinaire de Michoacán comme exemple représentatif : les cuisines au bois, les marchés de producteurs, les variétés locales de maïs, les moles ancestraux. La cuisine mexicaine est fondée sur la 'trinité' maïs-haricots-courge (les 'Trois Sœurs') complétée par les piments, la tomate et le cacao."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelles sont les principales conditions imposées par l'AOP « camembert de Normandie » ?",a:"Un fromage au lait cru de vache normande, moulé à la louche et fabriqué en Normandie — à distinguer du « camembert fabriqué en Normandie », souvent pasteurisé",detail:"La France compte plus d'un millier de fromages et environ 45 AOP fromagères. Le camembert de Normandie AOP impose notamment le lait cru, issu en partie de vaches de race normande, et un moulage à la louche en plusieurs passages. Le lait cru face au lait pasteurisé est un débat récurrent. Brie de Meaux, comté, roquefort et reblochon comptent parmi les AOP les plus connues."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel plat signature a fait la renommée de Joël Robuchon, longtemps détenteur du record d'étoiles Michelin ?",a:"Sa purée de pommes de terre, très riche en beurre",detail:"Joël Robuchon (1945-2018), sacré « cuisinier du siècle » par le Gault & Millau en 1990, a cumulé jusqu'à plus de 30 étoiles Michelin. Sa purée (pommes de terre ratte, beurre froid incorporé en grande quantité, lait chaud) est devenue légendaire. Ses Ateliers, où l'on mange au comptoir face à la cuisine, ont essaimé à Paris, Tokyo, Las Vegas, Londres et New York."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel procédé culinaire le chef Ferran Adrià popularise-t-il en 2003 avec ses billes de melon et d'olive — technique inspirée de l'industrie alimentaire industrielle ?",a:"La sphérification : un liquide additionné d'alginate, plongé dans un bain de calcium, s'entoure d'une fine membrane de gel et forme des billes qui éclatent en bouche",detail:"Adrià découvre la sphérification (utilisée industriellement depuis les années 1950) et l'applique à la gastronomie. Le procédé : plonger une cuillère de liquide aromatisé + alginate de sodium dans un bain de chlorure de calcium. Une membrane se forme instantanément. Le 'caviar' de melon d'Adrià reproduit visuellement le caviar avec un liquide fruité. Cette technique ouvre la 'cuisine moléculaire'."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel légume, longtemps considéré comme toxique en Europe après son introduction des Amériques, a failli manquer à la table française avant que Parmentier convainque Louis XVI d'en promouvoir la consommation ?",a:"La pomme de terre — Antoine Parmentier obtient de Louis XVI l'autorisation de cultiver la Plaine des Sablons et offre des bouquets de fleurs de pomme de terre à la reine",detail:"Parmentier (1737-1813) goûte la pomme de terre pendant sa captivité en Prusse. En France, elle est considérée comme impropre à la consommation humaine (bonne pour les cochons). Parmentier fait garder ses champs de jour pour attiser la curiosité, puis les laisse sans surveillance la nuit — les paysans 'volent' les tubercules. Le Hachis Parmentier porte son nom."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel pays est le premier producteur mondial de café, et dans quelle région d'Afrique la légende situe-t-elle la découverte du caféier ?",a:"Le Brésil (environ 35 à 40 % de la production mondiale) ; la légende situe la découverte en Éthiopie, dans la région de Kaffa, par un berger nommé Kaldi",detail:"Selon la légende, Kaldi remarque l'excitation de ses chèvres après qu'elles ont mangé des baies rouges. Le café se diffuse au Yémen au XVe siècle, dans l'Empire ottoman au XVIe, puis en Europe au XVIIe. Les États-Unis sont le premier consommateur en volume, les pays nordiques en tête par habitant. En Éthiopie, la cérémonie du café est un rituel social."},
{theme:"gastro",diff:"moyen",type:"q",q:"Dans quel pays la culture du riz a-t-elle été domestiquée il y a environ 10 000 ans, et combien de variétés différentes de riz sont cultivées dans le monde aujourd'hui ?",a:"La domestication du riz (Oryza sativa) a eu lieu en Chine (vallée du Yangtsé) il y a ~10 000 ans — il existe plus de 40 000 variétés cultivées",detail:"Le riz est la céréale de base de plus de la moitié de l'humanité. La 'révolution verte' des années 1960 (semences à haut rendement, engrais) a multiplié la production mais réduit la biodiversité. L'IRRI (Institut international de recherche sur le riz, Philippines) conserve 132 000 variétés. Le riz parfumé (basmati indien, jasmin thaïlandais) bénéficie d'indications géographiques."},
{theme:"gastro",diff:"moyen",type:"q",q:"Pourquoi le thon rouge atteint-il des prix records lors de la vente aux enchères du Nouvel An au marché de Toyosu, à Tokyo ?",a:"Pour sa rareté et sa chair grasse (otoro) ; le record date du 5 janvier 2026 : environ 510 millions de yens (3,2 millions de dollars) pour un thon d'environ 240 kg",detail:"Le thon, pêché au large d'Ōma (Aomori), a été adjugé à Kiyoshi Kimura, patron de la chaîne Sushi Zanmai, qui détenait déjà le précédent record (2019). Ces enchères du Nouvel An relèvent autant du prestige et de la publicité que du marché. Les stocks de thon rouge du Pacifique, longtemps surpêchés, se reconstituent grâce à des mesures de conservation."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel pays d'Amérique latine a inventé le ceviche, et quel est l'ingrédient acide qui 'cuit' le poisson cru sans chaleur dans cette préparation ?",a:"Le Pérou revendique l'invention du ceviche — le jus de citron vert dénature les protéines du poisson par son acidité, comme le ferait une cuisson",detail:"Le ceviche péruvien associe poisson blanc cru en dés, citron vert, coriandre, oignon rouge et piment. Le jus de marinade, le « leche de tigre », se boit parfois en apéritif. L'Équateur et le Chili ont leurs propres versions. Les pratiques et savoirs liés au ceviche péruvien sont inscrits au patrimoine immatériel de l'UNESCO depuis 2023."},
{theme:"gastro",diff:"difficile",type:"q",q:"Comment la cuisine de l'Inde du Sud diffère-t-elle structurellement de celle du Nord, et quels ingrédients fondamentaux distinguent ces deux grandes traditions culinaires ?",a:"Nord : blé (pain naan, roti), produits laitiers (ghee, paneer), viandes marinées au tandoor — Sud : riz, lentilles (dhal, idli, dosa), huile de coco ou de sésame, piments frais",detail:"La cuisine du Nord (Pendjab, Delhi, Rajasthan) utilise le blé, les produits laitiers (ghee, yaourt, paneer) et les viandes cuites au tandoor. Elle est influencée par les cuisines moghole et persane (biryani, korma). La cuisine du Sud (Kerala, Tamil Nadu, Karnataka) est à base de riz, cocotier (noix, lait, huile), lentilles et piments frais. Le sambar, le rasam et le chutney coconut sont omnipresents."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel type de vin rouge peut s'accorder avec des poissons gras, contrairement à la règle « vin blanc avec le poisson » ?",a:"Un rouge léger et peu tannique, comme un pinot noir ou un gamay",detail:"La règle 'blanc avec poisson, rouge avec viande' est une simplification. Les tannins des vins rouges puissants réagissent avec les iodes du poisson et créent une saveur métallique désagréable. Mais un pinot noir de Bourgogne léger avec du saumon grillé fonctionne. La règle d'or est 'accord régional' : vin et plat de la même région se marient souvent naturellement (muscadet-huîtres, rosé de Provence-bouillabaisse)."},
{theme:"gastro",diff:"facile",type:"q",q:"Quelle boisson fermentée à base d'orge malté, houblonnée, est la troisième boisson la plus consommée au monde après l'eau et le thé, avec une histoire de plus de 5 000 ans ?",a:"La bière — les premières traces remontent à la Mésopotamie sumérienne (~3400 av. J.-C.) avec l'hymne à Ninkasi (déesse de la bière)",detail:"Les Sumériens avaient une déesse de la bière (Ninkasi). Les Égyptiens en brassaient pour les bâtisseurs de pyramides (ration journalière). Les moines médiévaux perfectionnent les techniques. La révolution industrielle (Pasteur, réfrigération) crée la bière industrielle. Le mouvement craft beer (micro-brasseries) depuis les années 1990 renouvelle la culture brassicole mondiale."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel distillat mexicain à base d'agave, produit exclusivement dans la région de Jalisco et quatre États limitrophes, a obtenu en 1974 sa dénomination d'origine contrôlée ?",a:"La tequila — produite uniquement à partir d'agave bleu Weber (Agave tequilana) dans Jalisco, Guanajuato, Michoacán, Nayarit et Tamaulipas",detail:"La tequila blanco, non vieillie, exprime l'agave frais ; la reposado (2 à 12 mois en fût) et l'añejo (1 à 3 ans) développent des notes boisées. Le mezcal, produit surtout dans l'Oaxaca à partir de divers agaves, se distingue par ses arômes fumés, dus à la cuisson des cœurs d'agave dans des fosses. Les paysages d'agaves de Tequila sont inscrits au patrimoine mondial depuis 2006."},
{theme:"gastro",diff:"difficile",type:"q",q:"Comment le mouvement des 'mères lyonnaises' (Paul, Brazier, Blanc) a-t-il façonné la gastronomie lyonnaise au point de faire de Lyon la 'capitale gastronomique du monde' selon Curnonsky ?",a:"Les 'mères' (cuisinières bourgeoises ayant ouvert leurs propres bouchons) ont transmis une cuisine authentique, technique mais accessible qui fonde la réputation mondiale de Lyon",detail:"Curnonsky ('prince des gastronomes') sacre Lyon 'capitale gastronomique du monde' dans les années 1930. Les 'mères' (Mère Brazier, Mère Fillioux, Mère Guy) sont d'anciennes cuisinières de riches familles lyonnaises qui ouvrent leurs propres restaurants. Leur cuisine : quenelles de brochet, poulet demi-deuil, tablier de sapeur, gratins dauphinois. Paul Bocuse est l'héritier direct de cette tradition."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel condiment japonais, pâte de soja fermentée avec du sel et un champignon (Aspergillus oryzae), existe en plusieurs couleurs et saveurs selon la durée de fermentation ?",a:"Le miso — blanc (shiro, 1-3 mois, doux), jaune (shinshu, 6 mois) et rouge (aka, 1-3 ans, intense et salé)",detail:"Le miso est la base de la soupe miso (dashi + miso + tofu + wakame). Il contient des probiotiques et des acides aminés. Le koji (Aspergillus oryzae) est le champignon miracle de la cuisine japonaise — il fermente aussi le saké, le vinaigre de riz et la sauce soja. René Redzepi et les chefs du monde entier l'utilisent désormais pour fermenter viandes, légumes et céréales."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel fromage suisse à pâte dure, produit dans les cantons de Fribourg, Vaud, Neuchâtel, du Jura et une partie de Berne, est protégé par une AOP ?",a:"Le Gruyère AOP — affiné 5 à 18 mois en cave, produit avec du lait cru de vaches nourries au foin et pâturage",detail:"Le Gruyère AOP est fabriqué dans environ 150 fromageries villageoises. Il faut environ 400 litres de lait cru pour une meule de 35 kg ; les vaches sont nourries d'herbe et de foin, l'ensilage étant interdit. L'affinage développe parfois des cristaux de tyrosine. Aux États-Unis, un tribunal a jugé en 2021 que « gruyere » était un terme générique, au détriment des consortiums suisse et français."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelle controverse scientifique oppose 'terroir' (le sol et le lieu déterminent la saveur) et 'technique' (le savoir-faire du vigneron est prépondérant) dans la viticulture mondiale ?",a:"Le débat terroir vs technique est fondamental — les défenseurs du terroir (Bourgogne) affirment que le sol transmet des minéraux au vin ; les scientifiques peinent à prouver ce transfert chimique direct",detail:"Le terroir (sol, sous-sol, microclimat, exposition) est un concept français sans équivalent exact ailleurs. Des études montrent que les sommeliers les plus experts identifient les terroirs au goût — mais en aveugle, les résultats sont moins convaincants. La Bourgogne (où 1 mètre de distance peut changer l'appellation et multiplier le prix par 10) est le cas extrême. Le débat oppose romantisme culturel et rationalisme scientifique."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel plat national géorgien, le khinkali (ravioli au bouillon), est emblématique d'une cuisine du Caucase qui a influencé la Russie et la Turquie et reste méconnue en Occident ?",a:"Le khinkali est un grand ravioli plissé (19 plis selon la tradition) contenant de la viande et du bouillon — on le tient par le nœud, on mord et on aspire le jus avant de manger",detail:"La cuisine géorgienne (Géorgie du Caucase) est l'une des plus complexes du monde : le satsivi (poulet sauce noix aux épices), le chakhokhbili (ragoût de poulet aux herbes), le pkhali (boulettes aux noix et épinards), l'adjika (pâte de piment aux noix). La Géorgie est l'un des plus anciens pays viticoles (8 000 ans, amphores kvevri enterrées)."},
{theme:"gastro",diff:"facile",type:"q",q:"De quel mot nahuatl, qui signifiait aussi « testicule », vient le mot « avocat » ?",a:"Ahuacatl",detail:"Les Espagnols transforment ahuacatl en aguacate, puis le mot devient « avocat » en français par rapprochement avec le nom du juriste. L'avocatier est domestiqué au Mexique depuis des millénaires. Le Mexique reste le premier producteur mondial ; l'essor de la demande depuis les années 2010 a entraîné déforestation et emprise des cartels dans le Michoacán."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle cuisine juive ashkénaze, née en Europe centrale et orientale, a été préservée et transplantée aux États-Unis par les immigrants du XIXe-XXe siècle, donnant naissance à des institutions comme le deli new-yorkais ?",a:"La cuisine ashkénaze (bagels, lox, pastrami, matzo ball soup, rugelach) a trouvé à New York son expression la plus célèbre — chez Katz's Delicatessen (ouvert en 1888)",detail:"La cuisine ashkénaze est façonnée par les contraintes de la cacherout (séparation viandes/laitages), les hivers rigoureux d'Europe de l'Est (plats mijotés) et la pauvreté (abats valorisés). À New York, les immigrants juifs de l'Est européen créent le deli (épicerie-restaurant) avec pastrami sur rye, brisket, pickles. Katz's Deli est immortalisé par la scène de 'Quand Harry rencontre Sally' (1989)."},
{theme:"gastro",diff:"difficile",type:"q",q:"Comment le guide Michelin a-t-il été créé par les frères Michelin pour vendre des pneus, et par quel processus est-il devenu l'arbitre mondial de la gastronomie de luxe ?",a:"Créé en 1900 pour aider les automobilistes (garages, hôtels), le guide décerne sa première étoile en 1926 et adopte son système à trois étoiles à partir de 1931",detail:"André et Édouard Michelin distribuent d'abord leur guide gratuitement : plus les gens voyagent, plus ils usent leurs pneus. En 1920, constatant qu'on s'en sert pour caler des meubles, ils décident de le vendre. Une étoile signale « une très bonne table », deux « mérite un détour », trois « vaut le voyage ». Certains chefs ont demandé à sortir du guide, comme Sébastien Bras en 2017."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel chef brésilien, Alex Atala, utilise les ingrédients de l'Amazonie (fourmis, tapioca, cupuaçu) pour promouvoir la biodiversité amazonienne dans la gastronomie internationale depuis son restaurant D.O.M. à São Paulo ?",a:"Alex Atala (né en 1968) — D.O.M. classé régulièrement dans les 50 meilleurs restaurants mondiaux, pionnier de la cuisine amazonienne de haute gastronomie",detail:"Atala utilise des ingrédients indigènes amazoniens : la formiga Içá (fourmi géante au goût de citronnelle), le jambu (plante qui engourdit la langue), le pupunha (palmier), le tucupi (jus de manioc fermenté toxique cru). Son travail valorise les produits autochtones, combat la déforestation en montrant leur valeur gastronomique. Il collabore avec des communautés indigènes pour l'approvisionnement."},
{theme:"gastro",diff:"facile",type:"q",q:"Quelle huile, extraite des olives, est la graisse culinaire centrale du régime méditerranéen, et quelle mention 'extra-vierge' indique qu'elle a été extraite par simple pression à froid avec une acidité inférieure à 0,8 % ?",a:"L'huile d'olive extra-vierge (HOEV) — extraite mécaniquement à froid, sans solvant, acidité ≤ 0,8 %, préservant les polyphénols antioxydants",detail:"L'Espagne, notamment l'Andalousie, produit près de la moitié de l'huile d'olive mondiale, devant l'Italie et la Grèce. La mention « extra-vierge » est réglementée : extraction uniquement mécanique, acidité inférieure ou égale à 0,8 %, absence de défaut à la dégustation. Des études ont révélé de nombreuses fraudes sur l'étiquetage. Ses polyphénols, comme l'oléocanthal, ont des propriétés anti-inflammatoires."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle préparation fermentée à base de poisson, utilisée dans l'Antiquité romaine comme condiment universel, a resurgi sous différentes formes dans les cuisines du monde entier ?",a:"Le garum romain — ancêtre de la sauce de poisson asiatique (nuoc-mâm vietnamien, nam pla thaïlandais), de la colatura di alici italienne et du Worcestershire sauce britannique",detail:"Le garum (sauce de poisson fermentée, intestins et sang de poisson macérés dans le sel) était le condiment universel romain — équivalent du sel+umami. Produit à Pompéi, Carthagène, en Bretagne. La colatura di alici (Cetara, Campanie) en est la version moderne directe. Le nuoc-mâm et le nam pla sont ses cousins asiatiques indépendants mais similaires. Le Worcestershire sauce (1837) contient des anchois fermentés."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quel paradoxe alimentaire les études épidémiologiques révèlent-elles sur les Français — forte consommation de graisses saturées associée à une faible mortalité cardiovasculaire — et comment les chercheurs expliquent-ils ce 'French Paradox' ?",a:"Le « French paradox » (Serge Renaud, 1992) a été expliqué par la consommation modérée de vin rouge, les repas structurés, les portions plus petites et la qualité des aliments — des hypothèses débattues",detail:"Serge Renaud (Inserm) et Michel de Lorgeril publient en 1992 dans The Lancet un article sur ce paradoxe : les Français consomment beaucoup de graisses saturées mais meurent moins d'infarctus que les Américains. Le vin rouge et ses polyphénols ont été mis en avant, mais d'autres facteurs, comme des biais statistiques, sont discutés. Le paradoxe s'estompe à mesure que les habitudes alimentaires convergent."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel chef britannique, auteur de 'The Naked Chef' et de campagnes contre la malbouffe dans les cantines scolaires anglaises, est devenu l'une des personnalités culinaires les plus influentes du monde ?",a:"Jamie Oliver (né en 1975)",detail:"Jamie Oliver popularise une cuisine simple, saine et accessible depuis 'The Naked Chef' (1999). Sa campagne 'Feed Me Better' (2005) contraint le gouvernement Blair à investir 280 millions de livres dans l'amélioration des repas scolaires. Il ouvre sa chaîne Jamie's Italian (30 restaurants) — qui fait faillite en 2019. Sa fondation continue de lutter contre l'obésité infantile."},
{theme:"gastro",diff:"facile",type:"q",q:"Quelle pâtisserie viennoise, ancêtre du croissant français, était originellement en forme de croissant de lune et aurait été inventée pour célébrer la victoire sur les Ottomans à Vienne en 1683 ?",a:"Le Kipferl autrichien — le croissant arrive à Paris avec la Boulangerie viennoise d'August Zang (vers 1838) ; la version en pâte feuilletée se fixe en France au début du XXe siècle",detail:"Selon une légende non vérifiée, des boulangers viennois, travaillant la nuit, auraient entendu les Ottomans creuser des tunnels et donné l'alerte en 1683 ; ils auraient créé une pâtisserie en forme de croissant, symbole ottoman. Une autre légende attribue l'arrivée du croissant en France à Marie-Antoinette. L'histoire documentée retient surtout August Zang."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel phénomène dit 'food gentrification' observe-t-on quand les cuisines pauvres (tacos, ramen, açaï) sont adoptées par les classes aisées et revendues à des prix multipliés par 10 ?",a:"La 'food gentrification' ou appropriation culinaire transforme des nourritures populaires et économiques en produits de luxe — le ramen coûte 3 € à Tokyo et 18 € à Paris",detail:"Le ramen japonais (plat d'ouvriers, 200 yens à Tokyo) atteint 18-25 euros dans les restaurants branchés parisiens. Le taco mexicain populaire devient 'taqueria artisanale' à 7 euros. L'açaï brésilien (fruit du palmier, nourriture des pêcheurs d'Amazonie) devient le 'bowl' à 12 euros de la classe aisée urbaine. Ce phénomène enrichit les restaurateurs mais coupe parfois les cuisines de leurs communautés d'origine."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle tradition culinaire brésilienne, héritée de l'esclavage africain, a produit la feijoada — ragoût de haricots noirs et viandes — en utilisant les morceaux de porc dédaignés par les maîtres ?",a:"Selon un récit populaire, la feijoada serait née chez les esclaves à partir des morceaux de porc délaissés ; les historiens y voient plutôt une adaptation des ragoûts portugais. Elle est devenue le plat national brésilien",detail:"La feijoada associe haricots noirs, plante d'origine américaine, et diverses viandes de porc. Le récit de son origine servile est contesté : les morceaux comme les oreilles ou les pieds étaient aussi consommés par les Européens, et des plats proches existent au Portugal (cozido). Elle est servie avec du riz, du chou, de la farofa (farine de manioc grillée) et des tranches d'orange."},
{theme:"gastro",diff:"difficile",type:"q",q:"Comment la Révolution française a-t-elle contribué à la naissance du restaurant moderne à Paris, en libérant les cuisiniers des maisons aristocratiques sur le marché ?",a:"La chute de l'aristocratie libère des milliers de cuisiniers formés qui ouvrent leurs propres établissements à Paris — la carte et le service à l'assiette remplacent le service à la française",detail:"Avant 1789, les cuisiniers travaillaient surtout pour les grandes maisons ou dans le cadre de corporations très réglementées. Les premiers « restaurants » (bouillons « restaurants ») apparaissent à Paris dans les années 1760, mais la Révolution, en supprimant les corporations et en dispersant les domestiques des nobles émigrés, accélère leur essor : Beauvilliers, Méot, Véry. Au XIXe siècle, le service « à la russe » (plats successifs) remplace le service « à la française »."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel fruit tropical, originaire d'Amérique centrale, est le principal ingrédient du guacamole mexicain et est désormais cultivé sur 6 continents pour satisfaire la demande mondiale croissante ?",a:"L'avocat (Persea americana) — domestiqué au Mexique il y a 5 000 ans, il est aujourd'hui le fruit dont la valeur à l'export augmente le plus rapidement au monde",detail:"Les Aztèques le nommaient ahuacatl. Introduit en Europe au XVIe siècle, il reste longtemps marginal. La mode de l'« avocado toast » et de l'alimentation saine fait exploser la demande depuis les années 2010. Le Mexique, surtout le Michoacán, fournit environ 30 % de la production mondiale. Sa culture, gourmande en eau, est controversée."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle cuisinière américaine a popularisé la cuisine française aux États-Unis avec son émission The French Chef (1963-1973) et son livre Mastering the Art of French Cooking ?",a:"Julia Child (1912-2004)",detail:"Julia Child découvre la gastronomie française à Paris, où son mari est diplomate, et suit les cours du Cordon Bleu. Son livre (1961), écrit avec Simone Beck et Louisette Bertholle, est d'abord refusé par un éditeur avant de devenir un best-seller. Son émission sur la chaîne publique WGBH révolutionne la télévision culinaire par son naturel et son humour. Meryl Streep l'incarne dans Julie & Julia (2009)."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelle est l'origine de la sauce béchamel, et pourquoi les disputes de paternité entre la France et l'Italie illustrent-elles la complexité des échanges culinaires entre les deux pays depuis Catherine de Médicis ?",a:"La béchamel (roux + lait) est attribuée au marquis Louis de Béchameil (XVIIe s.) mais des sauces similaires existaient déjà en Italie — les Médicis auraient apporté des recettes à la cour de France en 1533",detail:"Selon la légende (douteuse), Catherine de Médicis apporte en 1533 ses cuisiniers florentins à Paris en épousant Henri II, transmettant ainsi la cuisine italienne à la France. Les historiens contestent cette version — la gastronomie française se développe indépendamment. La béchamel (Béchameil, maître d'hôtel de Louis XIV) est une création française. Mais les échanges culinaires Franco-italiens sont réels et continus depuis la Renaissance."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel pays du Proche-Orient est considéré comme le berceau du houmous, et pourquoi ce plat simple (pois chiches écrasés, tahini, citron, ail) est-il au centre d'une 'guerre culinaire' entre Liban, Israël et Palestine ?",a:"Le houmous est revendiqué par le Liban, Israël, la Palestine et la Syrie — il est inscrit au patrimoine libanais mais préparé par toutes les cultures de la région depuis des siècles",detail:"Le Liban a tenté d'enregistrer le houmous comme patrimoine exclusivement libanais (2008), provoquant la protestation d'Israël et d'autres pays arabes. Le mot arabe hummus signifie simplement 'pois chiches'. Le plat est préparé identiquement dans tout le Levant depuis des siècles. Cette 'guerre du houmous' illustre comment la nourriture devient enjeu d'identité nationale dans un contexte politique tendu."},
{theme:"gastro",diff:"facile",type:"q",q:"Quels pays consomment le plus de fromage par habitant, et combien de variétés la France produit-elle ?",a:"Le Danemark, l'Islande, la Finlande et la France figurent en tête (environ 25 kg par an et par habitant) ; la France produit plus de 1 000 fromages",detail:"De Gaulle aurait demandé : « Comment voulez-vous gouverner un pays qui a 246 variétés de fromage ? » (le chiffre varie selon les versions). La France compte environ 45 AOP fromagères ; le comté est la plus produite. Elle figure parmi les premiers exportateurs mondiaux, avec l'Allemagne et les Pays-Bas."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel style de ramen, au bouillon d'os de porc opaque et crémeux, est la spécialité de Hakata (Fukuoka) ?",a:"Le tonkotsu ramen",detail:"Introduits au Japon par des immigrants chinois à la fin du XIXe siècle, les ramen se déclinent par régions : Tokyo (shōyu, bouillon clair au soja), Sapporo (miso), Hakata (tonkotsu, os de porc cuits pendant des heures), Kitakata (shōyu léger). Les nouilles instantanées, inventées par Momofuku Ando en 1958, se vendent à plus de 100 milliards de portions par an. Un musée des ramen existe à Shin-Yokohama."},
{theme:"gastro",diff:"difficile",type:"q",q:"Comment Anthony Bourdain, auteur de 'Kitchen Confidential' (2000), a-t-il transformé la perception publique du métier de cuisinier et de la culture des cuisines professionnelles ?",a:"Bourdain révèle les coulisses brutales des cuisines (hiérarchie militaire, alcool, drogues, burns) tout en célébrant la street food mondiale — il démocratise le tourisme gastronomique",detail:"Kitchen Confidential décrit les réalités des brigades : journées interminables, alcool et drogues, brûlures, hiérarchie quasi militaire, secrets peu ragoûtants des restaurants. Bourdain en fait aussi un récit romantique. Ses émissions No Reservations puis Parts Unknown (CNN) célèbrent les cuisines de rue du monde entier. Il se suicide en 2018 à Kaysersberg, en Alsace, pendant un tournage."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel pays d'Europe du Nord a inventé le smörgåsbord, buffet froid de harengs marinés, fromages, viandes et pains qui a inspiré les buffets mondiaux ?",a:"La Suède — le smörgåsbord ('table à sandwichs') est un repas festif traditionnel où l'on se sert soi-même, centré sur le hareng mariné sous toutes ses formes",detail:"Le smörgåsbord suédois traditionnel inclut : hareng mariné (surströmming pour les amateurs de sensations fortes), gravlax (saumon mariné au sel et aneth), köttbullar (boulettes de viande), Jansson's frestelse (gratin d'anchois et pommes de terre), fromages et pains de seigle. Le concept de 'buffet à volonté' qu'on retrouve dans les hôtels du monde entier en est directement inspiré."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle est l'origine de la cuisine créole de Louisiane, et comment mélange-t-elle les influences françaises, espagnoles, africaines et amérindiennes pour créer un style unique ?",a:"La cuisine créole de Nouvelle-Orléans est née au XVIIIe siècle de la rencontre entre colons français, esclavage africain, héritage espagnol et techniques amérindiennes (filé, gombo)",detail:"Les Français apportent le roux et les fonds, les Africains réduits en esclavage le gombo (okra), qui a donné son nom au gumbo, les Amérindiens le filé (feuilles de sassafras en poudre), les Espagnols certaines charcuteries et épices. Il en résulte gumbo, jambalaya, étouffée et beignets. On distingue la cuisine créole, urbaine, de la cuisine cadienne (cajun), rurale, héritée des Acadiens."},
{theme:"gastro",diff:"difficile",type:"q",q:"Pourquoi le sucre est-il passé en quelques siècles du statut d'épice de luxe réservée aux apothicaires à celui de produit de masse responsable d'une crise de santé publique mondiale ?",a:"La canne à sucre cultivée par des esclaves dans les Amériques rend le sucre abordable aux XVIIe-XVIIIe siècles ; sa consommation passe de quelques kilos par an et par habitant vers 1800 à plusieurs dizaines aujourd'hui dans les pays riches",detail:"Au Moyen Âge, le sucre, importé d'Orient, est une épice coûteuse vendue par les apothicaires. Les plantations des Antilles et du Brésil, reposant sur la traite de millions d'Africains, font s'effondrer les prix. Puis la betterave sucrière (XIXe siècle), les sodas et les aliments ultra-transformés font exploser la consommation. L'OMS recommande de limiter les sucres libres à moins de 10 %, idéalement 5 %, de l'apport énergétique, soit environ 25 à 50 g par jour."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel plat de riz valencien, cuit dans une large poêle plate, se préparait à l'origine avec du lapin, du poulet et des haricots plutôt qu'avec des fruits de mer ?",a:"La paella valencienne",detail:"La paella valencienne traditionnelle (poulet, lapin, haricots verts et garrofó, tomate, safran) diffère de la paella aux fruits de mer servie aux touristes. Elle est née dans les rizières de l'Albufera, près de Valence. La poêle large (« paella » signifie poêle en valencien) favorise l'évaporation et la formation du socarrat, croûte dorée au fond. On la cuisinait au feu de bois, souvent de sarments ou d'oranger."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quels pays ont fait inscrire ensemble, en 2020, les savoirs et pratiques liés au couscous au patrimoine immatériel de l'UNESCO ?",a:"L'Algérie, la Mauritanie, le Maroc et la Tunisie",detail:"Le couscous (semoule de blé dur roulée, cuite à la vapeur) est un plat identitaire du Maghreb, aux nombreuses variantes. Cette candidature commune, saluée comme un exemple de coopération entre pays aux relations parfois tendues, a évité une querelle de paternité comparable à la « guerre du houmous ». Les savoirs de la préparation se transmettent surtout dans les familles."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle discipline scientifique, qui étudie les transformations physico-chimiques lors de la cuisson, est fondée par Nicholas Kurti et Hervé This à la fin des années 1980 ?",a:"La gastronomie moléculaire",detail:"Le physicien Nicholas Kurti (Oxford) donne en 1969 une conférence célèbre, « Le physicien dans la cuisine ». Avec le physico-chimiste français Hervé This, il organise à partir de 1992 des ateliers à Erice (Sicile). Hervé This décortique les « précisions culinaires » (dictons, tours de main) pour en tester la validité. La « cuisine moléculaire » des chefs en est une application."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel bulbe aromatique, longtemps dédaigné par l'aristocratie européenne pour son odeur, est un pilier des cuisines méditerranéennes ?",a:"L'ail (Allium sativum)",detail:"L'ail est cultivé depuis 5 000 ans en Asie centrale. En Europe médiévale, la noblesse le dédaigne (odeur associée aux classes laborieuses). Les moines l'interdisent parfois comme excitant charnel. En Méditerranée, il n'a jamais cessé d'être la base de l'alimentation. Son composé actif (allicine, libérée par l'écrasement) a des propriétés antibactériennes documentées. La France produit l'ail rose de Lautrec (Label Rouge)."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelle est la différence entre la cuisine de l'Asie du Sud-Est continentale (Thaïlande, Vietnam, Cambodge) et insulaire (Indonésie, Philippines, Malaisie) dans leurs usages des graisses, des herbes et des techniques de cuisson ?",a:"Continentale : herbes fraîches abondantes (citronnelle, basilic thaï, menthe), sauces de poisson fermentées, wok rapide — Insulaire : noix de coco (lait, huile), épices séchées (clou de girofle, muscade des Moluques), cuissons longues",detail:"La cuisine continentale (Vietnam, Thaïlande, Laos) utilise herbes fraîches, citron vert, piments frais, sauces fermentées (nuoc-mâm, nam pla) et cuissons rapides. L'insulaire (Indonésie, Malaisie, Philippines) est marquée par le lait de coco (rendang, nasi lemak), les épices séchées des Moluques (clou de girofle, muscade — raison des guerres coloniales hollandaises) et la sauce de soja fermentée (kecap manis)."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel chef mexicain a propulsé la cuisine mexicaine parmi les meilleures tables du monde avec son restaurant Pujol, à Mexico, célèbre pour son « mole madre » ?",a:"Enrique Olvera (né en 1976) — Pujol classé parmi les 10 meilleurs restaurants mondiaux, sa 'mole madre' vieillit en continu depuis 2013",detail:"Olvera réinterprète la cuisine mexicaine traditionnelle avec des techniques modernes. Son « mole madre » est une sauce qui évolue en permanence depuis 2013 : un nouveau mole est régulièrement ajouté à l'ancien, à la manière d'un levain. Il a aussi ouvert Cosme à New York. Il a inspiré une génération de chefs mexicains revendiquant leur identité culinaire."},
{theme:"gastro",diff:"facile",type:"q",q:"Dans quelle ville ouvrent en 1554 des cafés publics devenus célèbres, avant que la mode ne gagne l'Europe ?",a:"À Constantinople (Istanbul)",detail:"Le café, d'abord consommé par les soufis du Yémen pour leurs veilles, se répand à La Mecque et au Caire avant d'atteindre Constantinople. Au XVIIe siècle, les coffeehouses de Londres sont surnommées « penny universities » ; la compagnie d'assurances Lloyd's naît dans l'une d'elles. À Paris, le Procope ouvre en 1686. Certains historiens associent ces lieux de débat à l'essor des Lumières."},
{theme:"gastro",focus:"allemagne",diff:"facile",type:"q",q:"Quel style de bière blonde à fermentation basse tire son nom d'une ville de Bohême où il est créé en 1842 ?",a:"La pils (ou pilsner), de Plzeň",detail:"Le brasseur bavarois Josef Groll y crée une bière claire et houblonnée, devenue le style le plus bu au monde. En Allemagne, d'autres styles emblématiques sont la Weizen (bière de blé), l'Helles bavaroise, la Märzen, la Kölsch de Cologne et l'Altbier de Düsseldorf. L'Oktoberfest de Munich en est la grande vitrine."},
{theme:"gastro",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle spécialité charcutière allemande, née à Francfort au XVe siècle, a conquis le monde entier ?",a:"La Frankfurter Würstchen (frankfurter)",detail:"La saucisse de Francfort, fumée, fine et longue, est attestée à Francfort dès la fin du XVe siècle. Depuis un jugement de 1929, seules celles fabriquées dans la région de Francfort peuvent porter le nom de « Frankfurter Würstchen ». Exportée par les immigrants allemands, elle est l'une des ancêtres du hot-dog américain, avec la saucisse de Vienne."},
{theme:"gastro",focus:"allemagne",diff:"difficile",type:"q",q:"Qu'est-ce que la culture du Brotzeit et quelle place occupe le pain dans la gastronomie allemande ?",a:"Le Brotzeit (« temps du pain ») est un repas léger à base de pain, charcuteries et fromages — l'Allemagne produit plus de 3 000 variétés de pain",detail:"La culture du pain allemand est inscrite depuis 2014 à l'inventaire national allemand du patrimoine immatériel. Seigle, épeautre, graines, levain : l'Institut allemand du pain recense plus de 3 000 sortes. Le Pumpernickel de Westphalie, le bretzel bavarois et le Vollkornbrot sont emblématiques. Le Brotzeit, collation à base de pain, charcuterie et fromage, est une institution, surtout en Bavière."},
{theme:"nature",diff:"facile",type:"q",q:"Quel mammifère terrestre est le plus rapide du monde, capable d'atteindre 110 km/h sur de courtes distances dans les savanes africaines ?",a:"Le guépard (Acinonyx jubatus)",detail:"Le guépard accélère de 0 à 100 km/h en 3 secondes — plus vite qu'une Ferrari. Mais cette vitesse ne dure que 20-30 secondes. Il doit se reposer 30 minutes après une chasse pour refroidir son corps. Son succès de chasse est de 50 % (le meilleur chez les grands félins). Sa population mondiale a chuté à ~7 000 individus, menacés par la perte d'habitat."},
{theme:"nature",diff:"facile",type:"q",q:"Quel cétacé, le plus grand animal ayant jamais existé, émet des appels à très basse fréquence audibles par ses congénères à des centaines de kilomètres ?",a:"La baleine bleue (Balaenoptera musculus)",detail:"La baleine bleue peut dépasser 30 m et 150 tonnes ; son cœur pèse environ 180 kg. Ses appels infrasonores (10-40 Hz), qui atteignent environ 188 décibels, se propagent très loin sous l'eau. Les clics du cachalot sont toutefois encore plus puissants. La chasse industrielle a réduit sa population d'environ 300 000 à quelques milliers d'individus ; elle se reconstitue lentement."},
{theme:"nature",diff:"facile",type:"q",q:"Quel papillon nord-américain migre chaque automne sur plus de 4 000 km jusqu'aux forêts du Mexique, le voyage de retour s'étalant sur plusieurs générations ?",a:"Le monarque (Danaus plexippus)",detail:"Les monarques de l'Est de l'Amérique du Nord hivernent par millions dans les forêts de sapins du Michoacán. Au printemps, la remontée vers le Canada s'effectue en trois ou quatre générations : ceux qui reviennent au Mexique l'automne suivant sont les arrière-petits-enfants des migrants, et retrouvent pourtant les mêmes sites. Ils s'orientent grâce au soleil et au champ magnétique. Leurs effectifs ont fortement chuté en quelques décennies."},
{theme:"nature",diff:"facile",type:"q",q:"Quel primate non-humain partage 98,7 % de son ADN avec l'être humain et utilise des outils, fait la guerre et manifeste des comportements empathiques proches des nôtres ?",a:"Le chimpanzé commun (Pan troglodytes)",detail:"Jane Goodall (1934-2025) observe en 1960 les chimpanzés de Gombe (Tanzanie) fabriquer et utiliser des outils, comme des tiges pour « pêcher » les termites. Les chimpanzés mènent des conflits entre groupes, nouent des alliances et transmettent des comportements culturels (techniques pour casser les noix). Leur population sauvage serait passée d'environ un million au début du XXe siècle à moins de 300 000 individus."},
{theme:"nature",diff:"moyen",type:"q",q:"Comment le poulpe démontre-t-il une forme d'intelligence distribuée — neuf cerveaux et 2/3 de ses neurones dans ses tentacules — et quelle capacité de camouflage possède-t-il ?",a:"Le poulpe a 1 cerveau central + 8 ganglions nerveux autonomes dans ses bras — il peut changer couleur et texture en 200 millisecondes grâce à ses chromatophores",detail:"Les 2/3 des 500 millions de neurones du poulpe sont dans ses bras, qui agissent semi-indépendamment. Son cerveau central donne des ordres généraux, les bras décident localement. Les chromatophores (cellules pigmentées élastiques) permettent de mimer instantanément texture et couleur — corail, sable, algues. Les poulpes résolvent des labyrinthes, jouent avec des objets et reconnaissent les individus humains."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel oiseau peut rester en vol jusqu'à dix mois sans se poser, se nourrissant et dormant dans les airs ?",a:"Le martinet noir (Apus apus)",detail:"Des balises miniatures ont montré en 2016 que certains martinets noirs restent en vol dix mois d'affilée, en dehors de la période de nidification. Ils dorment en planant à haute altitude, se nourrissent d'insectes en plein vol et boivent en rasant l'eau. Leur nom vient du grec apous, « sans pieds » : leurs pattes très courtes les rendent malhabiles au sol."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel animal est le seul mammifère à pondre des œufs, possède un bec de canard, une queue de castor, des pattes de loutre et est capable de détecter les champs électriques de ses proies ?",a:"L'ornithorynque (Ornithorhynchus anatinus) d'Australie — un monotrème qui pond des œufs et produit du venin",detail:"L'ornithorynque est, avec les échidnés, l'un des seuls mammifères ovipares (monotrèmes). La femelle pond 1 à 3 œufs et allaite ses petits par des zones de la peau dépourvues de mamelons. Son bec porte des dizaines de milliers d'électrorécepteurs qui détectent l'activité musculaire de ses proies sous l'eau. Les mâles ont un ergot venimeux aux pattes arrière. Les premiers spécimens envoyés en Grande-Bretagne (1799) furent pris pour un canular."},
{theme:"nature",diff:"difficile",type:"q",q:"Quelle petite méduse, qualifiée de « biologiquement immortelle », peut redevenir polype après avoir atteint la maturité ?",a:"Turritopsis dohrnii",detail:"Face au stress, à une blessure ou au vieillissement, cette méduse de quelques millimètres peut transformer ses cellules adultes en d'autres types cellulaires (transdifférenciation) et revenir au stade de polype, recommençant son cycle de vie. En théorie, ce processus peut se répéter indéfiniment ; en pratique, la plupart sont mangées ou meurent de maladie. Elle intéresse les chercheurs travaillant sur la reprogrammation cellulaire."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment les fourmis coupeuses de feuilles (Atta) pratiquent-elles l'agriculture depuis 50 millions d'années, et quel champignon cultivent-elles dans leurs colonies de millions d'individus ?",a:"Les fourmis Atta cultivent un champignon (Leucoagaricus gongylophorus) en le nourrissant de feuilles découpées — elles produisent aussi des antibiotiques pour protéger leur culture",detail:"Les fourmis coupeuses de feuilles ne mangent pas les feuilles — elles les utilisent comme substrat pour cultiver un champignon dont elles se nourrissent. Elles ont développé en parallèle des bactéries (Streptomyces) produisant des antifongiques pour protéger leur culture des parasites. Cette co-évolution de 50 millions d'années est l'exemple le plus élaboré d'agriculture non-humaine."},
{theme:"nature",diff:"facile",type:"q",q:"Quel pin des Montagnes Blanches de Californie, âgé de près de 4 900 ans, est l'un des plus vieux arbres individuels connus ?",a:"« Mathusalem », un pin Bristlecone (Pinus longaeva) dont l'emplacement exact est gardé secret",detail:"Mathusalem aurait germé vers 2830 av. J.-C. : il avait déjà plus de deux siècles quand fut construite la grande pyramide de Khéops. Sa longévité tient aux conditions extrêmes (environ 3 000 m d'altitude, froid, sécheresse), qui ralentissent sa croissance et les attaques de pathogènes. Les cernes des Bristlecones ont servi à calibrer la datation au carbone 14."},
{theme:"nature",diff:"facile",type:"q",q:"Quel organisme de la forêt nationale de Malheur (Oregon), surnommé le « Humongous Fungus », s'étend sur près de 10 km² de sous-sol ?",a:"Un champignon parasite, l'armillaire (Armillaria ostoyae)",detail:"Identifié en 1998, cet individu couvre environ 965 hectares et serait âgé de plusieurs milliers d'années (de 2 400 à 8 650 ans selon les estimations). Les champignons visibles en surface ne sont qu'une infime partie de l'organisme : l'essentiel est un réseau souterrain de filaments (mycélium et rhizomorphes). L'armillaire tue les arbres en infectant leurs racines."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel clone de peupliers faux-trembles de l'Utah, formé d'environ 47 000 troncs reliés à un même système racinaire, est l'un des organismes les plus massifs du monde ?",a:"Pando (du latin « je m'étends »)",detail:"Pando, qui couvre environ 43 hectares, est une colonie clonale de Populus tremuloides : toutes ses tiges sont génétiquement identiques et pèseraient ensemble quelque 6 000 tonnes. Chaque tronc vit 100 à 130 ans, mais l'âge du clone est très incertain, de quelques milliers à plusieurs dizaines de milliers d'années. Il est menacé par les cerfs et le bétail, qui broutent les jeunes pousses."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel arbre australien (Eucalyptus regnans) est le plus grand arbre feuillu du monde, pouvant dépasser 100 mètres, et pourquoi les eucalyptus sont-ils adaptés aux incendies de forêts australiennes ?",a:"L'Eucalyptus regnans, dont le spécimen « Centurion », en Tasmanie, mesure environ 100 m ; les eucalyptus sont adaptés au feu, qui élimine leurs concurrents",detail:"Centurion figure parmi les plus grands arbres à fleurs du monde, avec le méranti jaune « Menara » de Bornéo. Les eucalyptus ont coévolué avec les incendies australiens : leurs huiles essentielles (eucalyptol) sont très inflammables, et beaucoup d'espèces rejettent après le feu à partir de bourgeons protégés sous l'écorce ou de lignotubers souterrains. Les koalas tolèrent les toxines de leurs feuilles, que presque aucun autre mammifère ne peut digérer."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment le réseau mycorhizien — parfois appelé 'Wood Wide Web' — permet-il aux arbres d'une forêt d'échanger nutriments et signaux chimiques via les champignons du sol ?",a:"Les champignons mycorhiziens colonisent les racines des arbres et forment un réseau souterrain permettant l'échange de sucres, de phosphore, d'azote et de signaux d'alarme entre arbres distants",detail:"Suzanne Simard (UBC) démontre en 1997 que des bouleaux 'mères' transfèrent du carbone radioactif à des épicéas ombragés via les champignons mycorhiziens. Les arbres malades ou mourants transfèrent leurs nutriments aux voisins via ce réseau. Les signaux chimiques d'attaque d'insectes se propagent aussi. Le terme 'Wood Wide Web' est populaire mais contesté — les échanges sont complexes et parfois compétitifs."},
{theme:"nature",diff:"facile",type:"q",q:"Quel volcan indonésien, dont l'éruption de 1883 est l'une des plus puissantes de l'histoire moderne, a généré un tsunami de 30 mètres tuant 36 000 personnes et un hiver volcanique mondial ?",a:"Le Krakatoa (Krakatau) — son explosion produit le son le plus fort jamais enregistré, audible à 5 000 km de distance",detail:"L'explosion du 27 août 1883 est entendue jusqu'à l'île Rodrigues, à près de 4 800 km. L'onde de choc fait plusieurs fois le tour de la Terre. Les aérosols projetés dans la stratosphère abaissent la température moyenne de l'hémisphère Nord d'environ un demi-degré à un degré l'année suivante. Les couchers de soleil rougeoyants de 1883-1884 auraient, selon une hypothèse, inspiré Le Cri de Munch. Un nouveau volcan, Anak Krakatau (« enfant du Krakatoa »), émerge en 1927."},
{theme:"nature",diff:"facile",type:"q",q:"Quelle est la plus grande plaque tectonique de la Terre, qui se déplace de 7 à 11 cm par an vers le nord-ouest ?",a:"La plaque pacifique",detail:"Ses frontières avec les plaques voisines dessinent la « ceinture de feu du Pacifique », sur environ 40 000 km : Andes, côte ouest américaine (faille de San Andreas), Alaska, îles Aléoutiennes, Japon, Philippines, Nouvelle-Zélande. Cette ceinture concentre environ 75 % des volcans actifs et 90 % des séismes. Le Japon, à la jonction de quatre plaques, ressent environ 1 500 séismes par an."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle éruption indonésienne de 1815, la plus puissante des temps historiques, provoque « l'année sans été » de 1816 ?",a:"L'éruption du Tambora (île de Sumbawa), en avril 1815 — indice d'explosivité volcanique 7",detail:"Le Tambora projette plus de 100 km³ de matériaux et fait des dizaines de milliers de morts sur place. En 1816, gelées estivales en Nouvelle-Angleterre, mauvaises récoltes et famines en Europe, émeutes de la faim. Mary Shelley, bloquée par le mauvais temps au bord du lac Léman, y conçoit Frankenstein ; Byron écrit Darkness. Selon une hypothèse, la cherté du fourrage aurait encouragé l'invention de la draisienne (1817), ancêtre du vélo."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle faille californienne, frontière entre les plaques pacifique et nord-américaine, est responsable du séisme de San Francisco de 1906 ?",a:"La faille de San Andreas",detail:"Longue d'environ 1 300 km, la faille fait coulisser les deux plaques de quelques centimètres par an. Le séisme de 1906 (magnitude 7,9) et l'incendie qui suit font environ 3 000 morts et détruisent une grande partie de San Francisco. Los Angeles, sur la plaque pacifique, se rapproche lentement de San Francisco. Les géologues attendent un futur « Big One »."},
{theme:"nature",diff:"difficile",type:"q",q:"Quelle période géologique, il y a 66 millions d'années, voit la disparition des dinosaures non-aviens due à l'impact d'un astéroïde et ses conséquences, et quel site mexicain conserve la trace de cet impact ?",a:"La limite K-Pg (Crétacé-Paléogène) — le cratère de Chicxulub (Yucatán, Mexique) mesure 180 km de diamètre et son impact a déclenché un hiver nucléaire",detail:"Un astéroïde d'environ 10 km frappe le Yucatán à environ 20 km/s, libérant une énergie équivalant à des milliards de bombes d'Hiroshima. Incendies, tsunamis et poussières bloquant la lumière provoquent un « hiver d'impact ». Environ 75 % des espèces disparaissent. Survivent notamment les oiseaux (dinosaures aviens), des mammifères, des crocodiliens et des tortues. Une couche riche en iridium, élément rare sur Terre, trahit l'origine extraterrestre de la catastrophe."},
{theme:"nature",diff:"facile",type:"q",q:"Quel est le point le plus profond des océans, atteint pour la première fois en 1960 par Jacques Piccard et Don Walsh ?",a:"Challenger Deep, dans la fosse des Mariannes (environ 10 935 m)",detail:"Piccard et Walsh y descendent à bord du bathyscaphe Trieste ; James Cameron y plonge seul en 2012 dans le Deepsea Challenger. La pression y dépasse 1 000 fois la pression atmosphérique. Des organismes y vivent pourtant : amphipodes, holothuries, foraminifères. L'Everest (8 849 m) y serait submergé sous plus de 2 km d'eau."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel courant océanique chaud de l'Atlantique Nord contribue à adoucir le climat de l'Europe de l'Ouest ?",a:"Le Gulf Stream, élément de la circulation méridienne de retournement atlantique (AMOC)",detail:"Au large de la Floride, le Gulf Stream transporte environ 30 millions de m³ d'eau par seconde, plus de cent fois le débit de l'Amazone. L'AMOC est entraînée par la plongée d'eaux froides et salées en Atlantique Nord. La fonte des glaces du Groenland, qui adoucit ces eaux, pourrait l'affaiblir ; un effondrement refroidirait nettement l'Europe du Nord-Ouest malgré le réchauffement global."},
{theme:"nature",diff:"moyen",type:"q",q:"Le Triangle des Bermudes connaît-il réellement plus de disparitions de navires et d'avions que les autres zones maritimes ?",a:"Non — selon les assureurs, il ne présente pas de risque supérieur à d'autres zones très fréquentées",detail:"Lloyd's of London (assureurs maritimes) ne classe pas le Triangle des Bermudes comme zone à risque supérieur. Les 'mystères' ont des explications banales : tempêtes, erreurs de navigation, trafic maritime intense. La théorie des 'bulles de méthane' (éruptions sous-marines diminuant la densité de l'eau) est séduisante mais non confirmée. Charles Berlitz popularise le mythe en 1974 avec un livre omettant les cas résolus."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment les récifs coralliens, qui couvrent 0,1 % de la surface océanique, abritent-ils 25 % de toutes les espèces marines, et quelle menace le réchauffement pose-t-il à travers le phénomène de blanchissement ?",a:"Le blanchissement corallien survient quand la température dépasse de 1-2°C la normale : les coraux expulsent leurs algues symbiotiques (zooxanthelles) qui leur donnent couleur et nutriments — ils blanchissent et meurent",detail:"Les zooxanthelles, algues unicellulaires vivant dans les tissus des coraux, leur fournissent jusqu'à 90 % de leur énergie par photosynthèse. Le stress thermique rompt cette symbiose. La Grande Barrière de corail a subi au moins sept épisodes de blanchissement massif depuis 1998, et le monde a connu en 2023-2024 son quatrième épisode planétaire. Selon le GIEC, 70 à 90 % des récifs disparaîtraient à +1,5 °C, plus de 99 % à +2 °C."},
{theme:"nature",diff:"facile",type:"q",q:"Quel programme de réintroduction du loup dans le parc de Yellowstone (1995) a déclenché une 'cascade trophique' qui a modifié jusqu'à la géographie des rivières ?",a:"La réintroduction de 41 loups gris dans Yellowstone entre 1995 et 1997 a déclenché une cascade trophique : les cerfs évitent les vallées, la végétation repousse, les rivières se stabilisent",detail:"Privés de loups depuis 70 ans, les wapitis surpâturaient les vallées. Avec le retour du prédateur, ils évitent certaines zones et la végétation des berges (trembles, saules) repousse, ce qui favorise le retour des castors. L'ampleur de cette « cascade trophique », popularisée par une vidéo virale selon laquelle les loups auraient « changé le cours des rivières », est débattue par les écologues, mais l'exemple illustre le rôle d'un superprédateur."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel est l'état de la population de pandas géants en 2024, et pourquoi leur reproduction en captivité a-t-elle longtemps échoué malgré les milliards investis ?",a:"Le dernier recensement (2014) compte environ 1 860 pandas sauvages ; l'espèce est passée de « en danger » à « vulnérable » en 2016. En captivité, la reproduction est difficile car la femelle n'est fertile que 1 à 3 jours par an",detail:"Les mâles en captivité montrent souvent peu d'intérêt pour l'accouplement. Les zoos ont essayé vidéos, hormones et rapprochements programmés ; les succès récents, notamment à Chengdu, combinent insémination artificielle et soins intensifs. La Chine loue ses pandas aux zoos étrangers pour environ un million de dollars par an et par couple."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel écologiste américain, auteur de A Sand County Almanac (1949), est un pionnier de l'éthique environnementale ?",a:"Aldo Leopold (1887-1948) — sa 'Land Ethic' étend la communauté morale aux sols, eaux, plantes et animaux",detail:"Leopold passe de chasseur et gestionnaire forestier à pionnier de l'écologie. Son évolution est emblématique : il abat une louve au Nouveau-Mexique et voit 'dans ses yeux mourir quelque chose que lui seul connaissait'. Il développe la 'Land Ethic' : une chose est juste si elle tend à préserver l'intégrité, la stabilité et la beauté de la communauté biotique. A Sand County Almanac influencera le mouvement environnemental américain des années 1960-70."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment les éléphants d'Afrique jouent-ils le rôle d''ingénieurs de l'écosystème' dans les savanes et forêts africaines, et quel impact leur disparition aurait-elle sur la forêt tropicale ?",a:"Les éléphants créent des clairières (arbres abattus), disséminent des graines (selles), creusent des trous d'eau (source d'eau pour 30 espèces) et maintiennent les prairies en broyant la bush",detail:"Les éléphants de forêt (Loxodonta cyclotis) sont les 'mégajardins' des forêts d'Afrique centrale : ils disséminent les graines de grands arbres (jusqu'à 60 kg/jour) dans leurs excréments sur des dizaines de km. Sans éléphants, ces espèces disparaissent. Les éléphants creusent des trous d'eau pendant la saison sèche (utilisés par 30+ espèces). Leurs 'chemins' deviennent des routes forestières. Leur braconnage massif (120/jour dans les années 2010) menace l'ensemble de l'écosystème."},
{theme:"nature",diff:"facile",type:"q",q:"Comment appelle-t-on la phase froide, opposée à El Niño, de l'oscillation australe du Pacifique ?",a:"La Niña",detail:"Lors de La Niña, les alizés se renforcent et les eaux froides remontent plus largement dans le Pacifique équatorial est : l'Australie et l'Indonésie reçoivent davantage de pluies, tandis que la côte ouest de l'Amérique du Sud s'assèche. El Niño, phase chaude, produit l'effet inverse ; l'épisode de 1997-1998 a fait environ 23 000 morts. Le cycle El Niño-La Niña (ENSO) se répète tous les 2 à 7 ans."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel phénomène lumineux polaire, l'aurore boréale (Aurora Borealis), est causé par quelle interaction entre le vent solaire et le champ magnétique terrestre ?",a:"Les particules chargées du vent solaire, déviées par la magnétosphère, excitent les atomes d'oxygène et d'azote dans la haute atmosphère — les couleurs dépendent de l'altitude et du gaz excité",detail:"L'oxygène à 100-200 km produit le vert (couleur dominante). L'oxygène à 300+ km produit le rouge rare. L'azote produit le bleu/violet. Les aurores sont plus fréquentes lors des maxima du cycle solaire (11 ans). L'aurore australe (aurora australis) est son pendant dans l'hémisphère sud. La tempête solaire de mai 2024 a produit des aurores visibles jusqu'en Espagne et au Texas."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel dispositif, inexistant dans l'océan Indien en 2004, aurait pu réduire le bilan du tsunami et y a été déployé à partir de 2005 ?",a:"Un système d'alerte aux tsunamis",detail:"Le séisme de Sumatra-Andaman (26 décembre 2004, magnitude 9,1-9,3), l'un des trois plus puissants jamais enregistrés, provoque une rupture de faille de 8 à 10 minutes. Les vagues atteignent 30 m dans la province d'Aceh et frappent jusqu'aux côtes africaines, faisant environ 228 000 morts dans 14 pays. Le Pacifique disposait d'un système d'alerte depuis 1949 ; celui de l'océan Indien est opérationnel depuis 2006."},
{theme:"nature",diff:"difficile",type:"q",q:"Quels lacs se forment lorsque le pergélisol riche en glace dégèle et que le sol s'effondre ?",a:"Les lacs de thermokarst",detail:"Le pergélisol arctique stocke environ 1 400 à 1 700 milliards de tonnes de carbone organique, soit près du double du carbone de l'atmosphère. Au fond des lacs de thermokarst, la décomposition sans oxygène produit du méthane, dont le pouvoir de réchauffement est environ 80 fois supérieur à celui du CO₂ sur 20 ans. Cette boucle de rétroaction fait partie des « points de bascule » climatiques redoutés."},
{theme:"nature",diff:"facile",type:"q",q:"Quel oiseau néo-zélandais, le kiwi, est si atypique parmi les oiseaux qu'il possède des narines au bout du bec, des os denses (pas creux comme les autres oiseaux), une température de mammifère et des plumes ressemblant à du poil ?",a:"Le kiwi (genre Apteryx) — oiseau incapable de voler, nocturne, dont l'œuf pèse 20 % du poids de la femelle (le plus gros rapport œuf/corps du monde chez les oiseaux)",detail:"Le kiwi a évolué en Nouvelle-Zélande en l'absence de mammifères prédateurs terrestres, jusqu'à l'arrivée des humains. Son œuf, qui peut représenter 20 % du poids de la femelle, est proportionnellement six fois plus gros que celui d'une poule ; chez plusieurs espèces, le mâle le couve 70 à 80 jours. Ses ailes vestigiales ne lui permettent pas de voler. Il est menacé par les prédateurs introduits (hermines, chats, chiens)."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel est le plus grand poisson du monde, qui se nourrit pourtant presque uniquement de plancton ?",a:"Le requin-baleine (Rhincodon typus), qui peut atteindre 18 à 20 m",detail:"Le requin-baleine filtre l'eau à travers ses branchies pour retenir plancton, petits poissons et œufs. Ses quelque 3 000 minuscules dents ne lui servent pas à se nourrir. Il est inoffensif pour l'homme. Sa longévité, longtemps inconnue, a été mieux estimée grâce au carbone 14 issu des essais nucléaires des années 1950-1960, enregistré dans ses vertèbres : certains individus dépassent 50 ans, et l'espèce pourrait vivre bien plus longtemps."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel organe rempli d'une huile cireuse, situé dans l'énorme tête du cachalot, participe à son écholocation ?",a:"L'organe du spermaceti",detail:"Le cachalot plonge à plus de 2 000 m pendant une heure ou plus pour chasser les calmars géants. Les baleiniers prenaient l'huile du spermaceti pour du sperme, d'où son nom ; elle se solidifie au froid et se liquéfie au chaud, ce qui pourrait aussi aider à régler la flottabilité. Ses clics d'écholocation, jusqu'à 230 décibels, sont les sons les plus puissants du règne animal. Des cicatrices de ventouses témoignent de ses combats avec les calmars."},
{theme:"nature",diff:"difficile",type:"q",q:"Comment les dauphins utilisent-ils l'écholocation avec une précision dépassant tout sonar humain, et quelles structures anatomiques spécialisées produisent et reçoivent ces signaux ?",a:"Les dauphins produisent des clics dans leurs sacs nasaux (phonic lips), concentrés par le melon (masse graisseuse céphalique), et reçoivent le retour via la mâchoire inférieure jusqu'à l'oreille interne",detail:"Le melon, masse graisseuse située dans le front, focalise les ultrasons comme une lentille acoustique. Les clics, jusqu'à plus de 100 kHz, rebondissent sur les objets ; l'écho traverse la mâchoire inférieure, remplie de graisse, jusqu'à l'oreille interne. Les dauphins distinguent ainsi des objets très proches ou de matériaux différents, se construisant une image acoustique en trois dimensions."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle plante carnivore de Bornéo possède les plus grandes urnes du genre, capables de piéger occasionnellement de petits mammifères ?",a:"Nepenthes rajah",detail:"Endémique des monts Kinabalu et Tambuyukon (Sabah, Malaisie), elle forme des urnes pouvant contenir plus de 3 litres de liquide digestif. Elle piège surtout des insectes, mais aussi parfois des grenouilles, des lézards ou des rats. Elle entretient surtout une étonnante relation avec la toupaye de montagne, qui vient lécher le nectar du couvercle et défèque dans l'urne, fournissant de l'azote à la plante."},
{theme:"nature",diff:"difficile",type:"q",q:"Quelle phrase sur la disparition des abeilles, souvent attribuée à Einstein, est en réalité apocryphe ?",a:"« Si l'abeille disparaissait de la surface du globe, l'homme n'aurait plus que quatre années à vivre »",detail:"Aucune trace de cette phrase n'existe dans les écrits d'Einstein ; elle circule depuis les années 1990. Le fond reste sérieux : près de 90 % des plantes à fleurs dépendent des animaux pour leur pollinisation, et environ 75 % des cultures alimentaires en bénéficient, soit environ un tiers de la production en volume. Les colonies d'abeilles subissent depuis 2006 des effondrements liés aux pesticides, au varroa et au manque de diversité florale."},
{theme:"nature",diff:"facile",type:"q",q:"Quel sommet, le mont Everest (8 849 m), a été gravi pour la première fois le 29 mai 1953 par quel duo, et combien de personnes l'ont depuis atteint ?",a:"Edmund Hillary (Néo-Zélandais) et Tenzing Norgay (sherpa) ; plus de 7 000 personnes ont depuis atteint le sommet, pour plus de 11 000 ascensions",detail:"Hillary et Tenzing atteignent le sommet vers 11 h 30 ; la nouvelle est annoncée le 2 juin, jour du couronnement d'Élisabeth II. L'Everest est devenu une destination commerciale coûteuse. Les embouteillages dans la « zone de la mort » (au-dessus de 8 000 m) ont causé des décès. Plus de 300 personnes y sont mortes depuis 1922, et de nombreux corps restent sur la montagne."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle expédition scientifique antarctique révèle en 1985 le 'trou' dans la couche d'ozone au-dessus du pôle Sud, menant directement au Protocole de Montréal (1987) et son interdiction des CFC ?",a:"Les scientifiques britanniques de la British Antarctic Survey (Joe Farman, Brian Gardiner, Jon Shanklin) publient leurs mesures en 1985 — la NASA confirme via satellite",detail:"Farman, Gardiner et Shanklin mesurent l'ozone depuis la base de Halley Bay et constatent une baisse d'environ 40 % au printemps austral. Les satellites de la NASA avaient enregistré des valeurs anormalement basses, signalées comme suspectes par les logiciels de traitement. Le protocole de Montréal (1987), qui interdit progressivement les CFC, est souvent cité comme le plus efficace des traités environnementaux : la couche d'ozone antarctique devrait se reconstituer vers 2066."},
{theme:"nature",diff:"difficile",type:"q",q:"Entre quels deux grands parcs, en Tanzanie et au Kenya, s'effectue le circuit de la Grande Migration des gnous ?",a:"Le Serengeti (Tanzanie) et le Masai Mara (Kenya)",detail:"Environ 1,5 million de gnous, accompagnés de centaines de milliers de zèbres et de gazelles, parcourent chaque année un circuit d'environ 800 km en suivant les pluies et l'herbe fraîche. C'est le plus grand mouvement de grands mammifères terrestres. Lions, léopards et guépards profitent de cette concentration de proies ; des dizaines de milliers d'animaux meurent chaque année d'épuisement, de prédation ou de noyade."},
{theme:"nature",diff:"moyen",type:"q",q:"Quelle phrase Greta Thunberg lance-t-elle aux dirigeants mondiaux lors du sommet de l'ONU sur le climat en 2019 ?",a:"« How dare you ! » (« Comment osez-vous ! »)",detail:"Née en 2003, Greta Thunberg commence le 20 août 2018 une grève scolaire devant le Parlement suédois. Le mouvement Fridays for Future gagne rapidement des milliers de villes. Elle traverse l'Atlantique en voilier pour se rendre au sommet de New York, où elle accuse les dirigeants de lui avoir « volé [ses] rêves ». Elle est désignée personnalité de l'année par Time en 2019 et critique ensuite le « bla-bla-bla » des COP."},
{theme:"nature",diff:"difficile",type:"q",q:"Quel chimiste suédois calcule dès 1896 qu'un doublement du CO₂ atmosphérique réchaufferait sensiblement la Terre ?",a:"Svante Arrhenius",detail:"Arrhenius (prix Nobel de chimie 1903) estime à la main qu'un doublement du CO₂ réchaufferait la Terre de 5 à 6 °C, un ordre de grandeur proche des estimations modernes (environ 3 °C). Les émissions étant alors faibles, il pense que ce doublement prendrait des millénaires, et voit dans un climat plus doux un bienfait pour l'agriculture des pays froids. Son collègue Nils Ekholm envisageait même de brûler davantage de charbon dans ce but."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel glacier de l'Antarctique occidental est surnommé le « glacier de l'Apocalypse » ?",a:"Le glacier Thwaites",detail:"Thwaites, grand comme la Grande-Bretagne (environ 192 000 km²), perd environ 50 milliards de tonnes de glace par an. Son effondrement complet élèverait le niveau des mers d'environ 65 cm ; en déstabilisant les glaciers voisins, il pourrait conduire à plusieurs mètres. Son lit, qui s'approfondit vers l'intérieur, favorise un recul auto-entretenu. Le surnom de « Doomsday glacier » a été popularisé par la presse à partir de 2017."},
{theme:"nature",diff:"facile",type:"q",q:"Quel mammifère marin, qui dort sur le dos en se tenant parfois la patte avec ses congénères, protège les forêts de kelp en mangeant des oursins ?",a:"La loutre de mer (Enhydra lutris)",detail:"Sans loutres, les oursins prolifèrent et rasent les forêts de kelp, algues géantes pouvant dépasser 40 m, qui abritent des centaines d'espèces. La loutre mange chaque jour l'équivalent d'environ un quart de son poids. Elle utilise des pierres pour ouvrir coquillages et oursins, l'un des rares usages d'outils chez les mammifères marins. C'est un exemple classique d'« espèce clé de voûte »."},
{theme:"nature",diff:"facile",type:"q",q:"Quel oiseau construit le plus grand nid du règne aviaire — une plate-forme pouvant peser 2 tonnes et servir pendant des décennies de génération en génération ?",a:"L'aigle chauve américain (Haliaeetus leucocephalus) — le plus grand nid jamais mesuré (Floride, 1963) mesurait 2,9 m de large, 6 m de profondeur et pesait 2 tonnes",detail:"Les nids d'aigle chauve ('eyries') sont réutilisés et agrandis chaque année. Le record floridien était utilisé depuis 34 ans quand une tempête le détruisit. L'aigle chauve a failli s'éteindre dans les années 1960 (70 000 → 417 couples nicheurs) à cause du DDT (pesticide qui fragilise les coquilles). Son rétablissement après l'interdiction du DDT (1972) est un succès de conservation."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel phénomène biologique dit 'mimétisme batésien' permet à des espèces inoffensives d'imiter l'apparence d'espèces toxiques pour éviter les prédateurs, et qui l'a décrit le premier ?",a:"Henry Walter Bates (1862) décrit ce mimétisme après 11 ans en Amazonie — les papillons inoffensifs imitent l'apparence des papillons toxiques, trompant les prédateurs",detail:"Bates observe que certains papillons Pieridae (inoffensifs) ressemblent à s'y méprendre aux papillons Heliconius (toxiques, accumulent des alcaloïdes des plantes hôtes). Les oiseaux apprennent à éviter les Heliconius et évitent aussi les imitateurs. L'évolution converge vers le même motif visuel par sélection naturelle. Exemples emblématiques : la couleuvre lait imitant le serpent corail venimeux."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel paléoanthropologue envoie en 1960 Jane Goodall, alors sans diplôme universitaire, étudier les chimpanzés de Gombe ?",a:"Louis Leakey",detail:"Leakey espère que l'étude des grands singes éclairera le comportement des premiers humains. Quand Goodall lui décrit des chimpanzés fabriquant des outils, il répond qu'il faut désormais redéfinir l'outil, redéfinir l'homme, ou accepter les chimpanzés comme humains. Leakey envoie aussi Dian Fossey étudier les gorilles et Biruté Galdikas les orangs-outans. Goodall, morte en 2025, avait consacré sa vie à la conservation."},
{theme:"nature",diff:"moyen",type:"q",q:"Quel oiseau chanteur australien, le ménure (Menura novaehollandiae ou 'lyrebird'), est capable d'imiter exactement le chant de 20 autres espèces et même les sons humains comme les tronçonneuses ?",a:"Le ménure superbe (Menura novaehollandiae) — le mâle imite de nombreuses espèces d'oiseaux, et parfois des bruits humains",detail:"Lors de sa parade nuptiale, le mâle déploie sa queue en forme de lyre et enchaîne des imitations d'une vingtaine d'espèces (kookaburras, cacatoès…) d'une précision confirmée par les spectrogrammes. Certains ménures, notamment en captivité, ont imité des déclencheurs d'appareil photo, des alarmes de voiture ou des tronçonneuses. Les jeunes apprennent leur répertoire auprès des adultes : c'est une forme de transmission culturelle."},
{theme:"nature",diff:"facile",type:"q",q:"Quelle grenouille, le dendrobate (Dendrobatidae), est l'un des animaux les plus venimeux du monde malgré sa taille minuscule, et d'où tire-t-elle sa toxine en captivité ou dans la nature ?",a:"Les grenouilles dendrobates tirent leurs alcaloïdes (batrachotoxines) de leur alimentation — en captivité sans fourmis spécifiques et coléoptères, elles perdent leur toxicité",detail:"Phyllobates terribilis, la grenouille dorée de Colombie, contient assez de batrachotoxine pour tuer une dizaine d'humains. Nourrie de grillons en captivité, elle devient inoffensive : la toxine provient de petits coléoptères et d'autres arthropodes de son habitat. Les Emberá enduisent de ce poison la pointe de leurs fléchettes de sarbacane, d'où le nom anglais de « poison dart frog ». La batrachotoxine bloque les canaux sodiques des nerfs et des muscles."},
