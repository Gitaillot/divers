<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Culture Générale · Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  :root { --bg:#0e1117; --surface:#161b25; --surface2:#1c2333; --border:rgba(255,255,255,0.06); --text:#e8eaf0; --muted:#5a6880; --muted2:#3a4558; --accent:#f0c040; }
  html { height:-webkit-fill-available; overflow:hidden; }
  body { min-height:100vh; min-height:-webkit-fill-available; display:flex; align-items:center; justify-content:center; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; position:fixed; width:100%; height:100%; }
  .bg-blob { position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; opacity:0.06; }
  .blob1 { width:400px; height:400px; background:#c0392b; top:-120px; left:-120px; }
  .blob2 { width:300px; height:300px; background:#2980b9; bottom:-80px; right:-80px; }
  .blob3 { width:220px; height:220px; background:#8e44ad; top:40%; left:60%; }

  .screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; transition:opacity 0.3s,transform 0.3s; }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(0.97); }

  /* CONFIG */
  .config-wrap { max-width:460px; width:93%; display:flex; flex-direction:column; align-items:center; gap:0.5rem; }
  .config-title { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:400; color:var(--text); margin-bottom:0.1rem; }
  .config-subtitle { font-size:0.68rem; color:var(--muted); margin-bottom:0.3rem; }
  .config-section-label { font-size:0.58rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted2); align-self:flex-start; margin-bottom:-0.1rem; }

  .theme-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.35rem; width:100%; }
  .theme-btn { padding:11px 8px; border:none; border-radius:14px; font-size:0.68rem; font-weight:700; cursor:pointer; touch-action:manipulation; background:rgba(255,255,255,0.05); color:var(--muted2); transition:background 0.15s,color 0.15s; line-height:1.3; }
  .btn-focus-de { grid-column: span 2; }
  .theme-btn.active[data-theme="histoire"]    { background:linear-gradient(135deg,#c0392b,#e74c3c); color:#fff; }
  .theme-btn.active[data-theme="geo"]         { background:linear-gradient(135deg,#1a7a4a,#27ae60); color:#fff; }
  .theme-btn.active[data-theme="arts"]        { background:linear-gradient(135deg,#7d3c98,#9b59b6); color:#fff; }
  .theme-btn.active[data-theme="sport"]       { background:linear-gradient(135deg,#d35400,#e67e22); color:#fff; }
  .theme-btn.active[data-theme="politique"]   { background:linear-gradient(135deg,#1a5276,#2980b9); color:#fff; }
  .theme-btn.active[data-theme="philo"]       { background:linear-gradient(135deg,#1a3a5c,#2e86c1); color:#fff; }
  .theme-btn.active[data-theme="sciences"]    { background:linear-gradient(135deg,#0e6655,#1abc9c); color:#fff; }
  .theme-btn.active[data-theme="litterature"] { background:linear-gradient(135deg,#6e2f8a,#a569bd); color:#fff; }
  .theme-btn.active[data-theme="economie"]    { background:linear-gradient(135deg,#1e5f74,#2e86c1); color:#fff; }
  .theme-btn.active[data-theme="popculture"]  { background:linear-gradient(135deg,#c0392b,#e91e8c); color:#fff; }
  .theme-btn.active[data-theme="nature"]      { background:linear-gradient(135deg,#1d6a2e,#52be80); color:#fff; }
  .theme-btn.active[data-theme="gastro"]      { background:linear-gradient(135deg,#7d4a00,#ca8a04); color:#fff; }
  .theme-btn.active[data-theme="mytho"]       { background:linear-gradient(135deg,#4a235a,#8e44ad); color:#fff; }

  .btn-focus-de { grid-column:span 2; padding:11px 8px; border:none; border-radius:14px; font-size:0.68rem; font-weight:700; cursor:pointer; touch-action:manipulation; background:rgba(255,255,255,0.05); color:var(--muted2); transition:background 0.2s,color 0.2s,box-shadow 0.2s; letter-spacing:0.02em; line-height:1.3; }
  .btn-focus-de.active { background:linear-gradient(135deg,#1a3a5c,#c0392b); color:#fff; box-shadow:0 3px 15px rgba(192,57,43,0.3); }

  .select-all-row { display:flex; gap:0.35rem; width:100%; }
  .btn-select-all,.btn-select-none { flex:1; padding:8px; border:none; border-radius:12px; font-size:0.62rem; font-weight:700; cursor:pointer; touch-action:manipulation; background:rgba(255,255,255,0.06); color:var(--muted); }

  .diff-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.35rem; width:100%; }
  .diff-btn { padding:10px 0; border:none; border-radius:14px; font-size:0.65rem; font-weight:700; cursor:pointer; touch-action:manipulation; background:rgba(255,255,255,0.05); color:var(--muted2); transition:background 0.15s,color 0.15s; }
  .diff-btn.active { background:linear-gradient(135deg,#2c3e60,#4a6080); color:#ccd; }

  .card-count { font-size:0.6rem; color:var(--muted2); margin-top:-0.15rem; }
  .btn-start { width:100%; padding:14px; border:none; border-radius:16px; font-size:0.9rem; font-weight:700; cursor:pointer; touch-action:manipulation; font-family:'DM Sans',sans-serif; background:linear-gradient(135deg,#c0392b,#e74c3c); color:#fff; letter-spacing:0.03em; box-shadow:0 4px 20px rgba(192,57,43,0.35); margin-top:0.1rem; }
  .btn-start:active { transform:scale(0.98); opacity:0.9; }
  .btn-start:disabled { opacity:0.35; cursor:default; }

  /* GAME */
  .game-wrap { max-width:460px; width:93%; display:flex; flex-direction:column; align-items:center; }
  .game-topbar { display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:0.25rem; }
  .game-title { font-family:'Playfair Display',serif; font-size:0.85rem; font-weight:400; color:var(--muted); }
  .btn-settings { background:none; border:none; cursor:pointer; font-size:1rem; color:var(--muted2); padding:4px 6px; border-radius:8px; touch-action:manipulation; }

  .card-wrapper { width:100%; min-height:295px; border-radius:22px; background:linear-gradient(145deg,var(--surface),var(--surface2)); box-shadow:0 12px 48px rgba(0,0,0,0.7),0 0 0 1.5px var(--border); margin-bottom:0.28rem; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:1.4rem 1.5rem 1.3rem; }
  .card-accent-bar { position:absolute; top:0; left:0; right:0; height:3px; border-radius:22px 22px 0 0; transition:background 0.4s; }
  .q-text { font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:700; line-height:1.45; color:var(--text); text-align:center; }
  .answer-area { display:none; flex-direction:column; align-items:center; gap:0.3rem; width:100%; margin-top:0.35rem; }
  .answer-area.visible { display:flex; }
  .answer-sep { width:40px; height:2px; background:linear-gradient(90deg,transparent,var(--muted2),transparent); border-radius:2px; }
  .answer-text { font-family:'Playfair Display',serif; font-size:1.35rem; font-weight:700; color:var(--accent); text-align:center; line-height:1.3; text-shadow:0 2px 16px rgba(240,192,64,0.25); }
  .answer-detail { font-size:0.76rem; color:#8a9baf; font-style:italic; text-align:center; line-height:1.55; max-width:93%; }
  .progress-bar-bg { position:absolute; bottom:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.04); }
  .progress-bar-fill { height:100%; background:linear-gradient(90deg,#c0392b,var(--accent)); transition:width 0.4s ease; border-radius:0 2px 2px 0; }

  .buttons-zone { height:3.1rem; display:flex; align-items:center; justify-content:center; margin-bottom:0.1rem; position:relative; }
  .btns { display:flex; gap:0.4rem; justify-content:center; position:absolute; }
  .btns.hidden { visibility:hidden; pointer-events:none; }
  .gbtn { padding:10px 14px; border:none; border-radius:14px; font-size:0.75rem; font-weight:700; cursor:pointer; touch-action:manipulation; font-family:'DM Sans',sans-serif; }
  .gbtn:active:not(:disabled) { transform:scale(0.95); opacity:0.85; }
  .btn-reveal   { background:linear-gradient(135deg,#2c3e50,#3d5166); color:#aac; min-width:175px; border:1px solid rgba(255,255,255,0.08); }
  .btn-known    { background:linear-gradient(135deg,#43e97b,#38f9d7); color:#0a1a12; flex:1; }
  .btn-review3  { background:linear-gradient(135deg,#fa709a,#fee140); color:#1a1a2e; flex:1; }
  .btn-review5  { background:linear-gradient(135deg,#f7971e,#ffd200); color:#1a1a2e; flex:1; }
  .btn-review20 { background:linear-gradient(135deg,#eb3349,#f45c43); color:white; flex:1; }
  .action-row { display:flex; gap:0.28rem; width:100%; }
  .stats { font-size:0.57rem; color:var(--muted2); line-height:1.9; }
  .stats strong { color:var(--muted); }

  .done-screen { display:none; text-align:center; padding:1rem; }
  .done-screen h2 { font-family:'Playfair Display',serif; font-size:1.8rem; margin-bottom:0.8rem; font-weight:400; }
  .done-screen p { color:#6a8090; margin-bottom:1.4rem; line-height:1.6; font-size:0.85rem; }
  .done-icon { font-size:2.6rem; margin-bottom:0.4rem; }
  .done-btns { display:flex; gap:0.5rem; justify-content:center; }

  @media (max-width:400px) {
    .theme-btn { font-size:0.6rem; padding:10px 5px; }
    .q-text { font-size:1.05rem; }
    .gbtn { padding:9px 8px; font-size:0.7rem; }
  }
</style>
</head>
<body>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<!-- CONFIG SCREEN -->
<div class="screen" id="screenConfig">
  <div class="config-wrap">
    <div class="config-title">📚 Culture Générale</div>
    <div class="config-subtitle">Choisis tes thèmes et ton niveau</div>

    <div class="config-section-label">Thèmes</div>
    <div class="theme-grid">
      <button class="theme-btn active" data-theme="histoire"    onclick="toggleTheme('histoire')">🏛 Histoire</button>
      <button class="theme-btn active" data-theme="geo"         onclick="toggleTheme('geo')">🌍 Géographie</button>
      <button class="theme-btn active" data-theme="arts"        onclick="toggleTheme('arts')">🎨 Arts</button>
      <button class="theme-btn active" data-theme="sport"       onclick="toggleTheme('sport')">⚽ Sport</button>
      <button class="theme-btn active" data-theme="politique"   onclick="toggleTheme('politique')">⚖️ Politique</button>
      <button class="theme-btn active" data-theme="philo"       onclick="toggleTheme('philo')">🧠 Philosophie</button>
      <button class="theme-btn active" data-theme="sciences"    onclick="toggleTheme('sciences')">🔬 Hist. Sciences</button>
      <button class="theme-btn active" data-theme="litterature" onclick="toggleTheme('litterature')">📖 Littérature</button>
      <button class="theme-btn active" data-theme="economie"    onclick="toggleTheme('economie')">📈 Économie</button>
      <button class="theme-btn active" data-theme="popculture"  onclick="toggleTheme('popculture')">🎬 Pop culture</button>
      <button class="theme-btn active" data-theme="nature"      onclick="toggleTheme('nature')">🌿 Nature</button>
      <button class="theme-btn active" data-theme="gastro"      onclick="toggleTheme('gastro')">🍽 Gastronomie</button>
      <button class="theme-btn active" data-theme="mytho"       onclick="toggleTheme('mytho')">⚗️ Mythologie</button>
      <button class="btn-focus-de theme-btn" id="btnFocusDe" onclick="toggleFocusDe()">🇩🇪 Focus Allemagne</button>
    </div>

    <div class="select-all-row">
      <button class="btn-select-all"  onclick="selectAll()">✓ Tout sélectionner</button>
      <button class="btn-select-none" onclick="selectNone()">✕ Tout désélectionner</button>
    </div>

    <div class="config-section-label" style="margin-top:0.25rem">Difficulté</div>
    <div class="diff-grid">
      <button class="diff-btn active" data-diff="all"       onclick="setDiff('all')">Tous</button>
      <button class="diff-btn"        data-diff="facile"    onclick="setDiff('facile')">Facile</button>
      <button class="diff-btn"        data-diff="moyen"     onclick="setDiff('moyen')">Moyen</button>
      <button class="diff-btn"        data-diff="difficile" onclick="setDiff('difficile')">Difficile</button>
    </div>

    <div class="card-count" id="cardCount"></div>
    <button class="btn-start" id="btnStart" onclick="startGame()">Commencer →</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="screen hidden" id="screenGame">
  <div class="game-wrap">
    <div class="game-topbar">
      <div class="game-title">📚 Culture Générale</div>
      <button class="btn-settings" onclick="goToConfig()">⚙️</button>
    </div>

    <div id="gameArea">
      <div class="card-wrapper">
        <div class="card-accent-bar" id="cardAccentBar"></div>
        <div class="q-text" id="qText"></div>
        <div class="answer-area" id="answerArea">
          <div class="answer-sep"></div>
          <div class="answer-text"   id="answerText"></div>
          <div class="answer-detail" id="answerDetail"></div>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      </div>

      <div class="buttons-zone">
        <div class="btns" id="revealButtons">
          <button class="gbtn btn-reveal" id="revealBtn">Voir la réponse</button>
        </div>
        <div class="btns hidden" id="actionButtons">
          <div class="action-row">
            <button class="gbtn btn-known"    id="knownBtn">✓ Connu</button>
            <button class="gbtn btn-review3"  id="reviewBtn3">+3</button>
            <button class="gbtn btn-review5"  id="reviewBtn5">+5</button>
            <button class="gbtn btn-review20" id="reviewBtn20">+20</button>
          </div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="done-screen" id="doneScreen">
      <div class="done-icon">🎉</div>
      <h2>Bravo !</h2>
      <p>Tu as révisé toutes les cartes sélectionnées.<br>Continue à t'entraîner !</p>
      <div class="done-btns">
        <button class="gbtn btn-reveal" id="restartBtn">🔄 Recommencer</button>
        <button class="gbtn btn-reveal" onclick="goToConfig()">⚙️ Reconfigurer</button>
      </div>
    </div>
  </div>
</div>

<script>
var THEME_COLORS = {
  histoire:   ['#c0392b','#e74c3c'], geo:         ['#1a7a4a','#27ae60'],
  arts:       ['#7d3c98','#9b59b6'], sport:        ['#d35400','#e67e22'],
  politique:  ['#1a5276','#2980b9'], philo:        ['#1a3a5c','#2e86c1'],
  sciences:   ['#0e6655','#1abc9c'], litterature:  ['#6e2f8a','#a569bd'],
  economie:   ['#1e5f74','#2e86c1'], popculture:   ['#c0392b','#e91e8c'],
  nature:     ['#1d6a2e','#52be80'], gastro:       ['#7d4a00','#ca8a04'],
  mytho:      ['#4a235a','#8e44ad']
};
var ALL_THEMES = ['histoire','geo','arts','sport','politique','philo','sciences','litterature','economie','popculture','nature','gastro','mytho'];
var activeThemes = {};
ALL_THEMES.forEach(function(t) { activeThemes[t] = true; });
var activeDiff = 'all';
var focusDeActive = false;
var allCards=[], available=[], reviewQueue=[], known=[], turn=0, current=null, revealed=false;

var CARDS=[
{theme:"geo",diff:"facile",type:"q",q:"Quelle est la capitale de l'Australie ?",a:"Canberra",detail:"Souvent confondue avec Sydney ou Melbourne, Canberra fut choisie en 1908 comme compromis entre ces deux rivales. Son nom vient d'un mot aborigène signifiant « lieu de rencontre »."},
{theme:"geo",diff:"facile",type:"d",q:"Plus grand pays du monde par superficie",a:"La Russie",detail:"17,1 millions de km² — soit 11 % des terres émergées. La Russie s'étend sur 11 fuseaux horaires, de l'enclave de Kaliningrad (mer Baltique) jusqu'au détroit de Béring."},
{theme:"geo",diff:"facile",type:"q",q:"Quel est le plus long fleuve du monde ?",a:"Le Nil ou l'Amazone selon les mesures",detail:"Le Nil (6 650 km) et l'Amazone (6 400 km) se disputent le titre selon la méthode de mesure. L'Amazone transporte à lui seul 20 % de l'eau douce déversée dans les océans."},
{theme:"geo",diff:"moyen",type:"q",q:"Quel pays est traversé à la fois par l'équateur et le tropique du Capricorne ?",a:"Le Brésil",detail:"Seul pays au monde traversé par ces deux parallèles. L'équateur passe par l'Amazonie au nord, le tropique du Capricorne par São Paulo au sud. 5e plus grand pays du monde."},
{theme:"geo",diff:"moyen",type:"d",q:"Détroit de 14 km reliant l'Atlantique à la Méditerranée",a:"Détroit de Gibraltar",detail:"Il sépare l'Espagne du Maroc. Deux courants superposés y circulent : en surface, l'eau atlantique, moins salée, entre en Méditerranée ; en profondeur, l'eau méditerranéenne, plus salée et plus dense, ressort vers l'Atlantique."},
{theme:"geo",diff:"moyen",type:"q",q:"Dans quel pays se trouve le lac Baïkal, le plus profond du monde ?",a:"En Russie (Sibérie) — environ 1 640 m de profondeur",detail:"Le plus ancien lac du monde (25 millions d'années) contient à lui seul 20 % des réserves mondiales d'eau douce liquide — autant que l'ensemble des Grands Lacs nord-américains réunis."},
{theme:"geo",diff:"difficile",type:"q",q:"Quel pays possède la plus grande zone économique exclusive (ZEE) au monde ?",a:"Les États-Unis ou la France, selon le mode de calcul (environ 11 millions de km² chacun)",detail:"Les deux pays doivent leur immense ZEE à leurs territoires dispersés sur tous les océans. Selon les sources, les États-Unis (environ 11,35 millions de km²) ou la France (de 10,2 à 11,7 millions de km², dont 97 % outre-mer) occupent la première place. Viennent ensuite l'Australie et la Russie."},
{theme:"geo",diff:"difficile",type:"d",q:"Point le plus profond des océans, dans la fosse des Mariannes",a:"Challenger Deep (~10 935 m)",detail:"Situé dans l'océan Pacifique occidental. La pression y atteint 1 100 fois la pression atmosphérique. James Cameron l'a atteint en solitaire en 2012 dans un submersible spécialement conçu."},
{theme:"arts",diff:"facile",type:"q",q:"Qui a peint la Joconde ?",a:"Léonard de Vinci",detail:"Peinte entre 1503 et 1519 environ, elle représenterait Lisa Gherardini, épouse du marchand florentin Francesco del Giocondo. Son sourire énigmatique tient au sfumato — contours fondus dans un léger flou —, technique que Léonard a portée à sa perfection."},
{theme:"arts",diff:"moyen",type:"d",q:"Courant pictural du XIXe s. né en France, privilégiant lumière et sensation sur dessin académique",a:"L'Impressionnisme",detail:"Le nom vient d'un article moqueur du critique Louis Leroy sur le tableau de Monet « Impression, soleil levant » (peint en 1872), présenté à la première exposition du groupe en 1874. Monet, Renoir, Degas, Pissarro, Sisley et Morisot peignent souvent en plein air, par touches rapides."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel courant artistique Picasso fonda-t-il avec Braque vers 1907 ?",a:"Le Cubisme",detail:"Inspiré par Cézanne et l'art africain, le cubisme décompose les formes en facettes vues sous plusieurs angles. Les Demoiselles d'Avignon de Picasso (1907) en sont considérées comme l'œuvre annonciatrice ; Braque et Picasso développent le mouvement à partir de 1908."},
{theme:"arts",diff:"facile",type:"q",q:"Qui a composé la 9e Symphonie avec l'Ode à la joie ?",a:"Ludwig van Beethoven",detail:"Créée à Vienne en 1824, alors que Beethoven était presque totalement sourd. À la fin de la première, il fallut le tourner vers le public pour qu'il voie les applaudissements. Adopté par le Conseil de l'Europe en 1972, l'Ode à la joie est devenue l'hymne de l'Union européenne en 1985."},
{theme:"arts",diff:"difficile",type:"d",q:"Technique baroque de contraste dramatique entre ombre intense et lumière vive",a:"Le clair-obscur (chiaroscuro)",detail:"Théorisé par Léonard, porté au sommet par Le Caravage (1571-1610) qui plonge ses personnages dans l'obscurité trouée de lumière rasante. Rembrandt s'en empare pour une profondeur psychologique incomparable."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel compositeur romantique créa le « drame musical » et la Tétralogie Der Ring des Nibelungen ?",a:"Richard Wagner",detail:"L'Anneau du Nibelung (4 opéras, environ 15 heures) fut composé de 1848 à 1874. Wagner systématisa l'usage du leitmotiv et fit construire à Bayreuth un théâtre dédié à ses œuvres, le Festspielhaus, inauguré en 1876."},

// NOUVELLES CARTES ARTS (94 cartes pour atteindre 100)
{theme:"arts",diff:"difficile",type:"q",q:"Quelle technique picturale de la Renaissance consiste à appliquer des couches de peinture translucides superposées pour créer de la profondeur lumineuse ?",a:"Le glacis (ou technique des glacis)",detail:"Les glacis (le mot vient de « glace ») consistent à poser de fines couches de peinture transparente les unes sur les autres. Jan van Eyck, Titien, Rembrandt et Vermeer en font un usage magistral. La couleur finale naît de la superposition optique des couches, avec une luminosité impossible à obtenir en une seule application."},
{theme:"arts",diff:"facile",type:"q",q:"Quel peintre espagnol est l'auteur de Guernica (1937) ?",a:"Pablo Picasso",detail:"Guernica, peinte en réaction au bombardement de la ville basque par l'aviation allemande et italienne au service de Franco, est l'un des symboles les plus forts de l'art engagé. Cette huile sur toile d'environ 3,5 × 7,8 m est conservée au musée Reina Sofía de Madrid. Picasso refusait qu'elle aille en Espagne tant que la démocratie n'y serait pas rétablie ; elle y arriva en 1981."},
{theme:"arts",diff:"facile",type:"q",q:"Qui est l'auteur de La Nuit étoilée (1889) ?",a:"Vincent van Gogh",detail:"Peinte à l'asile de Saint-Paul-de-Mausole, à Saint-Rémy-de-Provence, La Nuit étoilée montre la vue depuis la fenêtre de sa chambre, avec un village en partie imaginé, sous un ciel tourbillonnant. Selon la tradition, Van Gogh n'aurait vendu qu'un seul tableau de son vivant (La Vigne rouge). Certaines de ses œuvres se vendent aujourd'hui plus de 100 millions de dollars. Elle est conservée au MoMA de New York."},
{theme:"arts",diff:"facile",type:"q",q:"Quel musicien américain est considéré comme le « roi du rock and roll » ?",a:"Elvis Presley (1935-1977)",detail:"Elvis Presley popularise le rock and roll en mêlant rhythm and blues afro-américain et country, avec une gestuelle jugée provocante. Son premier single, That's All Right (1954), marque le début d'une révolution musicale. Graceland, sa demeure de Memphis, est souvent présentée comme la résidence la plus visitée des États-Unis après la Maison-Blanche."},
{theme:"arts",diff:"facile",type:"q",q:"Qui a composé les Quatre Saisons ?",a:"Antonio Vivaldi (publiées en 1725)",detail:"Les Quatre Saisons sont quatre concertos pour violon, chacun illustrant une saison par des effets évocateurs (orage, chants d'oiseaux, glace). Vivaldi, prêtre surnommé « il prete rosso » (« le prêtre roux »), dirigeait la musique de l'Ospedale della Pietà, orphelinat de jeunes filles à Venise. Longtemps oubliée, l'œuvre est redécouverte au XXe siècle et compte aujourd'hui parmi les plus jouées de la musique classique."},
{theme:"arts",diff:"facile",type:"q",q:"Quel bâtiment parisien emblématique est une pyramide en verre et acier ?",a:"La Pyramide du Louvre, conçue par I.M. Pei (inaugurée en 1989)",detail:"Commandée par François Mitterrand dans le cadre des Grands Travaux, la Pyramide sert d'entrée principale au musée du Louvre. Sa construction fut très controversée. Elle compte 673 vitrages : 603 losanges et 70 triangles. L'architecte sino-américain Ieoh Ming Pei avait reçu le prix Pritzker en 1983."},
{theme:"arts",diff:"facile",type:"q",q:"Quel opéra de Verdi est inspiré d'une pièce de Shakespeare sur un Maure jaloux ?",a:"Otello (1887)",detail:"Otello, créé à la Scala de Milan, est le chef-d'œuvre tardif de Verdi, sur un livret d'Arrigo Boito d'après Othello de Shakespeare. Le rôle-titre exige un ténor dramatique rare. L'opéra comporte l'un des plus grands rôles de méchant du répertoire lyrique : Iago (baryton)."},
{theme:"arts",diff:"facile",type:"q",q:"Qui est l'auteur de La Symphonie inachevée (1822) ?",a:"Franz Schubert",detail:"Schubert n'a jamais terminé cette symphonie en si mineur (D. 759), dont seuls deux mouvements sur quatre ont été composés. On ignore pourquoi. La Symphonie inachevée n'est exécutée publiquement qu'en 1865, soit 43 ans après sa composition. Schubert, mort à 31 ans, a composé plus de 600 Lieder (mélodies) en plus de ses œuvres instrumentales."},
{theme:"arts",diff:"facile",type:"q",q:"Quel courant pictural du début du XXe siècle se caractérise par des couleurs pures, violentes et non naturalistes ?",a:"Le Fauvisme (Matisse, Derain, Vlaminck, 1905)",detail:"Les fauves (terme péjoratif donné par le critique Louis Vauxcelles) utilisent des couleurs violentes et non naturalistes. Matisse, chef de file, peint La Femme au chapeau (1905) qui scandalise. Ce courant bref (1904-1908) libère la couleur et ouvre la voie à l'abstraction et à l'expressionnisme."},
{theme:"arts",diff:"facile",type:"q",q:"Quelle œuvre de Michel-Ange orne le plafond de la Chapelle Sixtine ?",a:"La Création d'Adam et les scènes de la Genèse (1508-1512)",detail:"Commandée par le pape Jules II, cette fresque d'environ 500 m² représente neuf épisodes de la Genèse. La scène de La Création d'Adam, où les doigts de Dieu et de l'homme se frôlent, est l'une des images les plus célèbres de l'art occidental. Contrairement à la légende, Michel-Ange ne peignit pas couché, mais debout sur un échafaudage, la tête renversée en arrière."},
{theme:"arts",diff:"facile",type:"q",q:"Qui a peint Les Tournesols (1888) ?",a:"Vincent van Gogh",detail:"Van Gogh peint ses Tournesols d'Arles (1888-1889) pour décorer la chambre destinée à Paul Gauguin dans la Maison jaune ; une première série date de son séjour parisien (1887). L'une des versions fut vendue 39,9 millions de dollars en 1987, record mondial aux enchères à l'époque."},
{theme:"arts",diff:"facile",type:"q",q:"Quel ballet de Tchaïkovski est l'un des plus célèbres du répertoire classique ?",a:"Le Lac des cygnes (créé en 1877)",detail:"Composé en 1875-1876 et créé au Bolchoï de Moscou en 1877, le ballet raconte la malédiction du sorcier Rothbart, qui transforme Odette en cygne. La danseuse principale tient deux rôles opposés : Odette (cygne blanc) et Odile (cygne noir). La version chorégraphique de Petipa et Ivanov (1895) est celle qui s'est imposée."},
{theme:"arts",diff:"facile",type:"q",q:"Quel mouvement littéraire et artistique du XVIIe s. se caractérise par la grandeur et l'exubérance ornementale ?",a:"Le Baroque",detail:"Né en Italie vers 1600, le baroque touche l'architecture (Bernin, Borromini), la musique (Monteverdi, puis Vivaldi, Bach, Haendel) et la peinture (Rubens, Rembrandt, le Caravage). Il exprime notamment la puissance de l'Église catholique après la Réforme (art de la Contre-Réforme). Il se caractérise par le mouvement, le contraste et l'émotion intense."},
{theme:"arts",diff:"moyen",type:"q",q:"Dans quelle ville et en quelle année le mouvement Dada naît-il, et quel événement mondial est à l'origine de cette révolte artistique ?",a:"À Zurich, en 1916, en réaction au carnage de la Première Guerre mondiale",detail:"Au Cabaret Voltaire, Hugo Ball, Tristan Tzara, Jean Arp et Marcel Janco rejettent toute logique et toute esthétique traditionnelle. Le mouvement gagne New York (Marcel Duchamp, Man Ray), Berlin et Paris. La Fontaine de Duchamp (1917), un urinoir signé « R. Mutt », pose la question : qu'est-ce que l'art ? Dada prépare le surréalisme et l'art conceptuel."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui est Frida Kahlo et quelle est la particularité de son œuvre ?",a:"Peintre mexicaine (1907-1954) dont l'œuvre autobiographique, marquée par la souffrance physique et l'identité mexicaine, est devenue un symbole féministe mondial",detail:"Victime d'un grave accident de bus à 18 ans, Frida Kahlo peint, souvent alitée, des autoportraits intenses. Elle est l'épouse du muraliste Diego Rivera. Longtemps éclipsées par celles de son mari, ses œuvres atteignent aujourd'hui des dizaines de millions de dollars aux enchères. Elle est devenue l'une des artistes les plus célèbres au monde."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui fonde le mouvement Arts and Crafts britannique dans les années 1860, en réaction à l'industrialisation ?",a:"William Morris",detail:"Morris réagit à la laideur des produits industriels et valorise l'artisanat traditionnel. Il crée des tissus, papiers peints et meubles alliant beauté et utilité. Le mouvement Arts and Crafts influence l'Art nouveau, le Jugendstil, le Bauhaus et tout le design moderne. Il pose une question encore actuelle : celle du rapport entre art et industrie."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui rédige le premier Manifeste du surréalisme, publié en 1924 ?",a:"André Breton",detail:"Influencé par Freud, Breton propose de libérer l'inconscient par l'écriture automatique et le rapprochement irrationnel d'images. Le Manifeste paraît en volume en octobre 1924 ; la revue La Révolution surréaliste est lancée en décembre. Dalí (montres molles), Magritte (La Trahison des images), Ernst et Miró rejoignent le mouvement, qui marque le cinéma (Buñuel) et la publicité."},
{theme:"arts",diff:"moyen",type:"q",q:"Quelle est la différence entre l'opéra seria et l'opéra buffa dans la musique baroque et classique ?",a:"L'opéra seria (sérieux) traite de sujets mythologiques ou héroïques avec des castrats ; l'opéra buffa (comique) met en scène des personnages populaires avec une intrigue comique",detail:"L'opéra seria (Haendel, Vivaldi) est l'opéra aristocratique par excellence. L'opéra buffa naît à Naples (~1730) et se démocratise. Mozart maîtrise les deux formes : Idoménée (seria) et Les Noces de Figaro (buffa). La Serva Padrona de Pergolèse (1733) déclenche la Querelle des Bouffons à Paris (1752)."},
{theme:"arts",diff:"moyen",type:"q",q:"Dans quelle ville Andy Warhol installe-t-il sa célèbre Factory, et en quelle décennie le Pop Art américain est-il à son apogée ?",a:"À New York ; dans les années 1960",detail:"Warhol (1928-1987), chef de file du Pop Art, sérigraphie des boîtes de soupe Campbell, des billets de banque et des portraits de Marilyn Monroe ou de Mao. Sa « Factory », ouverte en 1963 à Manhattan, est à la fois atelier, studio de cinéma et lieu de la contre-culture. En effaçant la frontière entre art et commerce, il annonce une grande part de l'art contemporain."},
{theme:"arts",diff:"moyen",type:"q",q:"Quelle cathédrale française, commencée en 1163, est considérée comme l'un des premiers exemples majeurs de l'architecture gothique ?",a:"Notre-Dame de Paris",detail:"Le gothique (XIIe-XVe s.) se caractérise par l'arc brisé, la voûte d'ogives et l'arc-boutant, qui reporte la poussée des voûtes vers l'extérieur et permet d'ouvrir les murs de grands vitraux. La basilique de Saint-Denis (années 1140) en est le premier jalon ; Notre-Dame de Paris, Chartres, Reims et Amiens en sont les chefs-d'œuvre français. Méprisé à la Renaissance, le gothique est revalorisé au XIXe siècle, notamment par Viollet-le-Duc."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui est Gustav Klimt et quel est son style ?",a:"Peintre autrichien (1862-1918), figure centrale de la Sécession viennoise, connu pour ses œuvres dorées mêlant symbolisme et Art nouveau",detail:"Klimt cofonde la Sécession viennoise en 1897, dont il est le premier président, pour rompre avec l'académisme. Le Baiser (1907-1908), deux amants fondus dans des ornements dorés, est l'une des images les plus reproduites au monde. Il réalise aussi la Frise Beethoven (1902). Egon Schiele, son protégé, pousse plus loin la voie expressionniste."},
{theme:"arts",diff:"moyen",type:"q",q:"Quelle œuvre ultime et inachevée de Jean-Sébastien Bach explore toutes les possibilités contrapuntiques d'un unique sujet ?",a:"L'Art de la fugue",detail:"La fugue (du latin fuga, « fuite ») fait passer un thème, le sujet, d'une voix à l'autre par imitations successives, selon des règles strictes (exposition, développement, strette). Composé dans les années 1740 et publié en 1751, après la mort de Bach, L'Art de la fugue en est le testament. Le Clavier bien tempéré (48 préludes et fugues) parcourt les 24 tonalités majeures et mineures."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel peintre français est le chef de file du néoclassicisme, connu pour ses grandes compositions historiques comme Le Serment des Horaces ?",a:"Jacques-Louis David",detail:"Le néoclassicisme revient aux modèles antiques en réaction au baroque et au rococo. David peint Le Serment des Horaces (1784), aux lignes dures et aux valeurs stoïciennes, puis Le Sacre de Napoléon (1805-1807). Ingres, son élève, pousse la perfection du dessin. Le néoclassicisme est l'art officiel de la Révolution et de l'Empire."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel architecte brésilien a conçu les bâtiments officiels de Brasília ?",a:"Oscar Niemeyer (1907-2012), en collaboration avec Lúcio Costa pour l'urbanisme",detail:"Niemeyer conçoit le Congrès national (une coupole et une demi-coupole renversée), le palais du Planalto (siège de la présidence) et la cathédrale aux 16 piliers courbes. Influencé par Le Corbusier, il développe un style fait de courbes libres. Il travaille jusqu'à sa mort, à 104 ans. Ses bâtiments symbolisent l'utopie moderniste."},
{theme:"arts",diff:"moyen",type:"q",q:"Dans quelle ville américaine le jazz naît-il vers 1900, et quelles traditions musicales y convergent ?",a:"À La Nouvelle-Orléans ; s'y mêlent blues, ragtime, fanfares, chants religieux et rythmes afro-caribéens",detail:"Le jazz naît dans les quartiers afro-américains de La Nouvelle-Orléans et se fonde sur l'improvisation et le swing. Louis Armstrong (trompette), Duke Ellington (big band), Charlie Parker (bebop) et Miles Davis (cool, jazz modal) font évoluer le genre. L'UNESCO a créé en 2011 une Journée internationale du jazz, célébrée chaque 30 avril."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui est Rembrandt et quel est son apport à la peinture ?",a:"Rembrandt Harmenszoon van Rijn (1606-1669), maître hollandais du clair-obscur psychologique et de l'autoportrait",detail:"Rembrandt peint près de 80 autoportraits — un journal visuel de toute sa vie. La Ronde de nuit (1642, Rijksmuseum) est l'un des chefs-d'œuvre de la peinture hollandaise du XVIIe siècle. Il utilise le clair-obscur moins pour le drame théâtral, comme le Caravage, que pour révéler la vie intérieure de ses modèles. Il finit ruiné, ses biens vendus aux enchères."},
{theme:"arts",diff:"moyen",type:"q",q:"Quels compositeurs incarnent le romantisme musical du XIXe siècle, du Polonais Chopin au Hongrois Liszt ?",a:"Chopin, Liszt, Schumann, Mendelssohn, Berlioz, Brahms et Wagner, notamment",detail:"Le romantisme musical (environ 1820-1900) exalte l'émotion, la nature et la liberté formelle. Il développe des formes libres (poème symphonique, nocturne, ballade). Chopin exprime l'âme polonaise dans ses mazurkas, Liszt invente le poème symphonique et le récital de piano, Berlioz la symphonie à programme (Symphonie fantastique, 1830), Wagner le drame musical."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel artiste américain est le pionnier de l'expressionnisme abstrait et du drip painting ?",a:"Jackson Pollock (1912-1956)",detail:"Pollock pose ses toiles au sol et y fait couler ou projette la peinture directement depuis le pot ou le bâton (action painting). Number 31 (1950) illustre cette approche. Avec les expressionnistes abstraits, il contribue à déplacer le centre de l'art mondial de Paris vers New York après 1945. Il meurt dans un accident de voiture à 44 ans."},
{theme:"arts",diff:"moyen",type:"q",q:"Quelle triade de génies incarne le sommet de la Renaissance italienne, réunissant peinture, sculpture et architecture ?",a:"Léonard de Vinci, Michel-Ange et Raphaël",detail:"Florence, sous les Médicis, est le foyer de la Renaissance, qui renouvelle l'art en redécouvrant l'Antiquité. Brunelleschi met au point la perspective linéaire (vers 1415), Donatello renouvelle la sculpture, Botticelli peint la mythologie avec une grâce nouvelle. La Haute Renaissance (environ 1490-1527) culmine avec Léonard, Michel-Ange et Raphaël."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui a composé La Flûte enchantée et à quelle époque ?",a:"Wolfgang Amadeus Mozart — créée à Vienne le 30 septembre 1791, quelques semaines avant sa mort",detail:"La Flûte enchantée (Die Zauberflöte), un singspiel, mêle conte philosophique d'inspiration maçonnique, airs virtuoses (l'air de la Reine de la nuit monte jusqu'au contre-fa) et personnages comiques comme Papageno. Mozart meurt à 35 ans en décembre 1791, laissant son Requiem inachevé. C'est l'un des opéras les plus joués au monde."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel architecte catalan crée la Casa Batlló et la Sagrada Família, exemples emblématiques de l'Art nouveau ?",a:"Antoni Gaudí",detail:"Gaudí est la grande figure du modernisme catalan, version barcelonaise de l'Art nouveau (1890-1910), inspiré des formes naturelles et des courbes végétales. La Sagrada Família, commencée en 1882, est toujours en construction. L'Art nouveau prend d'autres visages avec Horta à Bruxelles, Mackintosh à Glasgow, Guimard à Paris (entrées du métro) ; on parle de Jugendstil en Allemagne et de Sécession en Autriche."},
{theme:"arts",diff:"facile",type:"q",q:"Qui a peint La Naissance de Vénus (vers 1484) ?",a:"Sandro Botticelli",detail:"Conservée aux Offices de Florence, La Naissance de Vénus représente la déesse émergeant de la mer sur une coquille. Peinte sur toile pour l'entourage des Médicis, elle est l'une des premières grandes œuvres profanes à sujet mythologique de la Renaissance. Le visage de Vénus est traditionnellement rapproché de Simonetta Vespucci, célèbre beauté florentine."},
{theme:"arts",diff:"facile",type:"q",q:"Quel compositeur autrichien a écrit plus de 600 œuvres et est mort à 35 ans ?",a:"Wolfgang Amadeus Mozart (1756-1791)",detail:"Mozart compose dès l'âge de 5 ans et parcourt l'Europe en enfant prodige. Son œuvre comprend 41 symphonies numérotées, 27 concertos pour piano et une vingtaine d'opéras. Il meurt à 35 ans, endetté plus que misérable, laissant son Requiem inachevé. Il est inhumé à Vienne dans une tombe commune, conformément aux usages de l'époque."},
{theme:"arts",diff:"facile",type:"q",q:"Quel bâtiment est souvent considéré comme le chef-d'œuvre de l'architecture classique française ?",a:"Le château de Versailles (construit sous Louis XIV, architectes Le Vau et Hardouin-Mansart)",detail:"Versailles est le symbole de la monarchie absolue. La galerie des Glaces (73 m, 357 miroirs) célèbre les victoires de Louis XIV. Les jardins d'André Le Nôtre incarnent la domination de la raison sur la nature. Versailles a inspiré de nombreux palais européens et reçoit environ 8 millions de visiteurs par an."},
{theme:"arts",diff:"facile",type:"q",q:"Qui est Salvador Dalí et quel courant artistique représente-t-il ?",a:"Salvador Dalí (1904-1989), peintre espagnol, figure majeure du surréalisme — connu pour La Persistance de la mémoire (montres molles, 1931)",detail:"Dalí est le génie excentrique du surréalisme : moustaches en croc, déclarations provocatrices, vie théâtrale. Ses montres molles évoquent la subjectivité du temps. Il travaille aussi pour le cinéma (Un chien andalou, avec Buñuel, 1929). Le Théâtre-musée Dalí de Figueres (Catalogne) est l'un des musées les plus visités d'Espagne."},
{theme:"arts",diff:"facile",type:"q",q:"Quel membre fondateur des Beatles fut assassiné à New York en 1980 ?",a:"John Lennon",detail:"Les Beatles (1960-1970) — John Lennon, Paul McCartney, George Harrison et Ringo Starr — révolutionnent la pop par leurs harmonies vocales, leur écriture et leur évolution constante (de She Loves You à A Day in the Life). Ils conquièrent l'Amérique en 1964 (Beatlemania). Abbey Road (1969) est le dernier album enregistré ensemble. Lennon est assassiné devant son immeuble new-yorkais le 8 décembre 1980."},
{theme:"arts",diff:"facile",type:"q",q:"Quel architecte florentin formalise la perspective mathématique au XVe siècle, révolutionnant la peinture de la Renaissance ?",a:"Filippo Brunelleschi, vers 1415",detail:"La perspective linéaire (avec point de fuite) représente l'espace en trois dimensions sur une surface plane selon des règles géométriques. Brunelleschi en fait la démonstration avec un miroir et une peinture du baptistère de Florence ; Leon Battista Alberti la théorise dans De pictura (1435). Le Moyen Âge utilisait plutôt une perspective hiérarchique, où les personnages importants sont plus grands."},
{theme:"arts",diff:"facile",type:"q",q:"Quel peintre romantique français est connu pour La Liberté guidant le peuple (1830) ?",a:"Eugène Delacroix",detail:"Peinte après la révolution de Juillet 1830 (les « Trois Glorieuses »), cette allégorie montre la Liberté brandissant le drapeau tricolore sur une barricade parisienne. C'est l'une des images les plus emblématiques du romantisme politique, souvent associée à Marianne. Conservée au Louvre, elle a notamment illustré la pochette de l'album Viva la Vida de Coldplay."},
{theme:"arts",diff:"facile",type:"q",q:"Qu'est-ce qu'une sonate et comment est-elle structurée ?",a:"Une composition instrumentale en plusieurs mouvements (souvent 3 ou 4), pour un instrument seul ou un duo ; son premier mouvement suit généralement la « forme sonate » : exposition, développement, réexposition",detail:"La forme sonate, fixée au XVIIIe siècle, présente deux thèmes contrastés (exposition), les transforme par modulations (développement), puis les reprend dans la tonalité principale (réexposition). Haydn et Mozart la codifient ; Beethoven la pousse à ses limites dans ses 32 sonates pour piano, dont la Pathétique (op. 13), Clair de lune (op. 27 n° 2) et l'Appassionata (op. 57)."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel peintre français du XIXe siècle est le chef de file du réalisme, scandalisant le public avec Un enterrement à Ornans ?",a:"Gustave Courbet",detail:"Le réalisme, courant du milieu du XIXe siècle, représente la réalité sans idéalisation. Courbet peint paysans, ouvriers et funérailles (Un enterrement à Ornans, 1849-1850) avec la même grandeur que les sujets nobles, ce qui choque l'Académie. Millet peint Des glaneuses (1857), Daumier la société de son temps. Le réalisme est une prise de position politique autant qu'artistique."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel est le rôle du Louvre dans l'histoire de l'art mondial ?",a:"C'est le plus grand musée d'art du monde par sa surface, et souvent le plus visité ; ancien palais royal, il devient musée public en 1793",detail:"Le Louvre naît d'une forteresse de Philippe Auguste (vers 1190), devenue résidence royale. La Révolution l'ouvre au public en 1793. Napoléon y fait affluer des œuvres saisies dans toute l'Europe, en partie restituées en 1815. Il abrite la Joconde, la Vénus de Milo et la Victoire de Samothrace, et expose environ 35 000 œuvres. Il a accueilli 9,6 millions de visiteurs en 2019."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui invente la musique concrète en 1948, et dans quel studio radiophonique parisien travaille-t-il ?",a:"Pierre Schaeffer, au Studio d'essai de la Radiodiffusion française",detail:"Ingénieur de la radio, Schaeffer compose l'Étude aux chemins de fer (1948) en montant et en transformant des sons de locomotives. Il parle de musique concrète, car il part de sons enregistrés et non de notes écrites. Avec Pierre Henry, il fonde en 1951 le Groupe de recherche de musique concrète ; Henry signe les Variations pour une porte et un soupir (1963). Cette démarche préfigure l'échantillonnage (sampling) et la musique électronique."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui est Le Corbusier et quelle est son influence sur l'architecture moderne ?",a:"Charles-Édouard Jeanneret, dit Le Corbusier (1887-1965) — architecte franco-suisse, théoricien du modernisme et de l'urbanisme fonctionnaliste",detail:"Le Corbusier définit la maison comme une « machine à habiter » et formule les 5 points de l'architecture nouvelle (pilotis, toit-terrasse, plan libre, façade libre, fenêtre en bandeau). La Villa Savoye (1929), la Cité Radieuse de Marseille (1952), Chandigarh (Inde) et la chapelle Ronchamp (1955) illustrent son génie contradictoire. Son influence sur l'urbanisme du XXe s. est immense."},
{theme:"arts",diff:"difficile",type:"q",q:"Quels deux compositeurs de l'École de Notre-Dame de Paris, aux XIIe et XIIIe siècles, sont les pionniers de la polyphonie médiévale ?",a:"Léonin et Pérotin",detail:"La polyphonie (plusieurs voix indépendantes) apparaît vers le IXe siècle (organum primitif). L'École de Notre-Dame perfectionne la notation rythmique, ce qui permet de coordonner plusieurs voix. On attribue à Léonin le Magnus Liber Organi (vers 1170) ; Pérotin écrit des organa à 3 et 4 voix. Cette révolution est l'un des fondements de la musique savante occidentale."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel compositeur américain est la figure majeure du minimalisme musical avec des œuvres comme Music for 18 Musicians ?",a:"Steve Reich",detail:"Le minimalisme musical, ou musique répétitive, apparaît dans les années 1960 avec La Monte Young, Terry Riley, Steve Reich et Philip Glass. Il explore les effets hypnotiques de la répétition et du changement graduel. Music for 18 Musicians (1976) de Reich et Einstein on the Beach (1976) de Glass en sont des œuvres fondatrices. En arts plastiques, le minimalisme est représenté par Donald Judd, Dan Flavin et Sol LeWitt."},
{theme:"arts",diff:"difficile",type:"q",q:"En quelle année Monteverdi compose-t-il L'Orfeo, considéré comme le premier grand opéra du répertoire ?",a:"En 1607, à Mantoue",detail:"La Camerata florentine de Giovanni Bardi cherchait à retrouver la musique grecque antique. Peri compose Dafne (vers 1598, perdue) et Euridice (1600), premiers opéras connus. Mais L'Orfeo de Monteverdi dépasse ses prédécesseurs par son écriture orchestrale et sa force dramatique. C'est le plus ancien opéra encore régulièrement joué."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel débat académique oppose au XVIIe siècle les partisans du dessin (Poussinistes) à ceux de la couleur (Rubénistes) ?",a:"La querelle du coloris (fin du XVIIe siècle)",detail:"L'Académie royale de peinture et de sculpture, fondée en 1648, se divise à partir des années 1670. Les poussinistes (Le Brun) tiennent le dessin pour le principe intellectuel supérieur ; les rubénistes (Roger de Piles) défendent la couleur, qui touche les sens. La querelle tourne à l'avantage des coloristes vers 1700. Elle annonce l'opposition entre classicisme et romantisme, puis entre académisme et impressionnisme."},
{theme:"arts",diff:"difficile",type:"q",q:"Qui invente le dodécaphonisme en 1923, et quel autre compositeur viennois en sera le représentant le plus radical ?",a:"Arnold Schoenberg ; Anton Webern",detail:"Schoenberg rompt avec la tonalité vers 1908 (atonalité), puis met au point vers 1921-1923 la méthode des douze sons : une série ordonne les 12 notes de la gamme chromatique, chacune devant apparaître avant qu'une autre ne se répète. Ses élèves Alban Berg (Wozzeck, 1925) et surtout Anton Webern, aux œuvres brèves et très concentrées, la prolongent. Le sérialisme intégral de Boulez et Stockhausen domine ensuite la musique savante après 1945."},
{theme:"arts",diff:"difficile",type:"q",q:"Dans quelle forêt française les peintres de l'École de Barbizon s'installent-ils à partir des années 1830 pour peindre sur le motif ?",a:"La forêt de Fontainebleau",detail:"Installés au village de Barbizon (Seine-et-Marne), Théodore Rousseau, Millet, Daubigny et Corot peignent la nature sur le motif, en plein air, dans les années 1830-1860. Ils rejettent la peinture d'atelier au profit de l'observation directe de la lumière. En légitimant le paysage, ils sont des précurseurs directs des impressionnistes, que Monet connaissait bien."},
{theme:"arts",diff:"difficile",type:"q",q:"Quelle technique artistique, caractéristique de l'art byzantin, orne encore aujourd'hui la basilique Saint-Marc de Venise ?",a:"La mosaïque",detail:"L'art byzantin (IVe-XVe s.) représente des figures aux yeux fixes sur des fonds d'or symbolisant le divin. Les mosaïques de Ravenne (San Vitale, VIe s.) en sont des chefs-d'œuvre ; celles de Saint-Marc de Venise couvrent plus de 8 000 m². L'icône est conçue comme une fenêtre sur le divin. La querelle iconoclaste (VIIIe-IXe s.) menace cette tradition, dont partent Cimabue et Duccio, précurseurs de Giotto."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel compositeur fut le parrain spirituel du groupe des Six, et quel était leur programme esthétique ?",a:"Erik Satie ; les Six rejettent le wagnérisme et l'impressionnisme au profit de la clarté, de la simplicité et de l'humour",detail:"Le nom de « groupe des Six » est donné en 1920 par le critique Henri Collet à Milhaud, Poulenc, Honegger, Auric, Tailleferre et Durey, dont Jean Cocteau est le porte-parole. Milhaud s'inspire des rythmes brésiliens et du jazz (La Création du monde, 1923), Poulenc allie esprit et émotion. Satie, avec ses Gymnopédies (1888), préfigure aussi le minimalisme."},
{theme:"arts",diff:"facile",type:"q",q:"Quel artiste du pop art a représenté des boîtes de soupe Campbell et des portraits de Marilyn Monroe ?",a:"Andy Warhol",detail:"Warhol sérigraphie en série les mêmes images, questionnant l'originalité et l'authenticité de l'œuvre d'art. Ses Gold Marilyn Monroe (1962) utilisent l'imagerie de la célébrité hollywoodienne comme icône commerciale et tragique. Sa Factory, studio new-yorkais, produit des films underground, des magazines (Interview) et accueille la crème de l'avant-garde."},
{theme:"arts",diff:"facile",type:"q",q:"Quel courant musical des années 1950-60 est né de la fusion entre blues et gospel ?",a:"La soul (Ray Charles, Aretha Franklin, Otis Redding)",detail:"Ray Charles mêle gospel et rhythm and blues dès le milieu des années 1950. Aretha Franklin, la « reine de la soul », chante Respect (1967). Le label Motown (Berry Gordy, Detroit) produit une soul-pop dansante (Stevie Wonder, Marvin Gaye, The Supremes) qui touche aussi le public blanc. La soul influence directement le funk, le hip-hop et la pop contemporaine."},
{theme:"arts",diff:"moyen",type:"q",q:"Quelle différence fondamentale distingue la technique de la buon fresco de la peinture à l'huile sur toile ?",a:"La fresque se peint sur un enduit encore humide, où les pigments se fixent en séchant : elle exige rapidité et ne permet guère de retouches ; l'huile, qui sèche lentement, autorise repentirs et glacis",detail:"La peinture à l'huile, perfectionnée au XVe siècle par les Flamands (Jan van Eyck), permet les retouches et les glacis progressifs. La fresque ne supporte guère l'erreur : chaque jour (giornata), le peintre enduit et peint la surface de la journée. Giotto, Masaccio et Michel-Ange en sont des maîtres ; La Cène de Léonard, peinte sur mur sec, n'est pas une vraie fresque, d'où sa dégradation rapide."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui est Claude Monet et quel est son apport central à la peinture ?",a:"Claude Monet (1840-1926), fondateur de l'impressionnisme, père de la série picturale — explore les variations de la lumière sur un même motif à différentes heures",detail:"Monet peint la cathédrale de Rouen plus de 30 fois sous différentes lumières (1892-1894). Son jardin de Giverny inspire les Nymphéas, dont les grands panneaux sont installés au musée de l'Orangerie à Paris. Atteint de cataracte, il peint à la fin des œuvres aux couleurs chaudes et brouillées, qui préfigurent l'abstraction. Il meurt en 1926, à 86 ans."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel compositeur autrichien du XVIIIe siècle est considéré comme le père du quatuor à cordes, genre roi de la musique de chambre ?",a:"Joseph Haydn",detail:"Le quatuor à cordes (2 violons, alto, violoncelle) est le genre roi de la musique de chambre. Haydn, auteur de 68 quatuors, lui donne sa forme classique. Beethoven le porte à ses limites expressives (derniers quatuors, op. 131, 132, 135). Schubert (La Jeune Fille et la Mort), Brahms, Ravel, Bartók et Chostakovitch ont laissé des quatuors majeurs."},
{theme:"arts",diff:"moyen",type:"q",q:"Quelle photographe américaine est connue pour ses portraits en noir et blanc de la Grande Dépression ?",a:"Dorothea Lange — sa photo Migrant Mother (1936) est l'une des plus célèbres de l'histoire",detail:"Dorothea Lange travaille pour la Farm Security Administration (FSA) sous Roosevelt pour documenter la misère rurale. Migrant Mother (Florence Owens Thompson, 32 ans, 7 enfants) devient le visage de la Grande Dépression. La photographie documentaire de Lange, Walker Evans et Margaret Bourke-White définit l'idéal d'un photojournalisme humaniste."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel concept d'« œuvre d'art totale », unifiant musique, poésie, arts visuels et mise en scène, Richard Wagner théorise-t-il en 1849 ?",a:"Le Gesamtkunstwerk",detail:"Wagner développe l'idée dans L'Œuvre d'art de l'avenir (1849) et la met en pratique dans ses drames musicaux, notamment L'Anneau du Nibelung, joués dans le théâtre qu'il fait construire à Bayreuth. L'idée influencera le symbolisme, le Bauhaus, les spectacles multimédias et les installations contemporaines."},
{theme:"arts",diff:"difficile",type:"q",q:"Quelle œuvre de Marcel Duchamp, exposée en 1917, est considérée comme l'acte fondateur de l'art conceptuel ?",a:"Fontaine (Fountain), un urinoir signé « R. Mutt »",detail:"L'art conceptuel (années 1960-1970) fait de l'idée l'essence de l'œuvre, au détriment de sa réalisation matérielle ; Fontaine en est rétrospectivement l'acte fondateur. Joseph Kosuth (One and Three Chairs, 1965) expose une chaise, sa photographie et sa définition de dictionnaire. Sol LeWitt affirme que l'idée est l'œuvre et l'exécution secondaire. Lawrence Weiner laisse parfois à d'autres le soin de matérialiser ses pièces."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel est le rôle de la galerie Peggy Guggenheim dans l'histoire de l'art moderne ?",a:"Sa galerie new-yorkaise Art of This Century (1942-1947) révèle les expressionnistes abstraits, dont Pollock, et relie l'avant-garde européenne en exil aux jeunes artistes américains",detail:"Installée en Europe dès les années 1920, Peggy Guggenheim (1898-1979) achète à Paris, en 1939-1940, une œuvre par jour. En 1941, elle regagne New York et aide plusieurs artistes à fuir, dont Max Ernst, qu'elle épouse. Elle expose Pollock, Rothko et Motherwell. Installée à Venise en 1949, au palazzo Venier dei Leoni, elle y laisse sa collection, aujourd'hui l'un des grands musées d'art moderne d'Italie."},
// NOUVELLES CARTES SPORT (94 cartes pour atteindre 100)
{theme:"sport",diff:"facile",type:"q",q:"Combien de fois Lionel Messi a-t-il remporté le Ballon d'Or ?",a:"8 fois (2009, 2010, 2011, 2012, 2015, 2019, 2021, 2023)",detail:"Messi remporte son premier Ballon d'Or en 2009 avec le FC Barcelone. Le huitième, en 2023, consacre la Coupe du monde 2022 gagnée avec l'Argentine, après la finale perdue en 2014. Son rival Cristiano Ronaldo en compte 5. Messi joue en MLS, à l'Inter Miami, depuis 2023."},
{theme:"sport",diff:"facile",type:"q",q:"Où et en quelle année se tiennent les premiers Jeux olympiques modernes ?",a:"À Athènes (Grèce) en 1896 — fondés par Pierre de Coubertin",detail:"Pierre de Coubertin, pédagogue français, fait renaître les Jeux antiques ; il fonde le Comité international olympique (CIO) à Paris en 1894. Les premiers Jeux modernes réunissent environ 241 athlètes de 14 nations à Athènes. La devise olympique est « Citius, Altius, Fortius » (plus vite, plus haut, plus fort). Les cinq anneaux symbolisent l'union des cinq continents."},
{theme:"sport",diff:"facile",type:"q",q:"Quel pays a remporté le plus de Coupes du Monde de football ?",a:"Le Brésil — 5 titres (1958, 1962, 1970, 1994, 2002)",detail:"Le Brésil est le seul pays à avoir participé à toutes les phases finales de la Coupe du monde (23 éditions jusqu'en 2026). La génération de 1970 (Pelé, Rivelino, Jairzinho) est souvent considérée comme la meilleure de l'histoire. L'Allemagne et l'Italie suivent avec 4 titres. L'Argentine, la France, l'Uruguay et l'Espagne — sacrée en 2010 et en 2026 — en comptent 2 ou 3."},
{theme:"sport",diff:"facile",type:"q",q:"Quel sport se joue avec une raquette et un volant ?",a:"Le badminton",detail:"Codifié en Angleterre vers 1870, le badminton tire son nom du domaine du duc de Beaufort (Badminton House) ; il s'inspire d'un jeu pratiqué en Inde sous le nom de « Poona ». En smash, le volant peut dépasser 500 km/h, record de vitesse pour un projectile de sport de raquette. La Chine, l'Indonésie, la Corée du Sud et le Danemark dominent les compétitions."},
{theme:"sport",diff:"facile",type:"q",q:"Quelle est la distance officielle d'un marathon ?",a:"42,195 km (26 miles et 385 yards)",detail:"La distance est fixée aux JO de Londres (1908), pour que la course parte du château de Windsor et arrive devant la loge royale du stade ; elle est officialisée en 1921. Auparavant, elle variait autour de 40 km. Selon la légende, le messager Philippidès aurait couru de Marathon à Athènes pour annoncer la victoire sur les Perses en 490 av. J.-C."},
{theme:"sport",diff:"facile",type:"q",q:"Qui est considéré comme le meilleur nageur de l'histoire ?",a:"Michael Phelps (États-Unis) — 23 médailles d'or olympiques, record absolu toutes disciplines confondues",detail:"Phelps remporte 28 médailles olympiques entre 2000 et 2016 (Sydney, Athènes, Pékin, Londres, Rio). Il domine le 200 m papillon, le 200 m 4 nages, les relais. Sa carrure (envergure 201 cm, pieds 33 cm) et sa capacité pulmonaire hors norme lui confèrent un avantage physique exceptionnel."},
{theme:"sport",diff:"facile",type:"q",q:"Quel est le plus ancien tournoi du Grand Chelem de tennis ?",a:"Wimbledon (créé en 1877)",detail:"Le tennis moderne naît en 1874, quand le major Walter Clopton Wingfield fait breveter son « lawn tennis ». Wimbledon se joue sur gazon, Roland-Garros sur terre battue, l'US Open et l'Open d'Australie sur dur. Ces 4 tournois forment le Grand Chelem."},
{theme:"sport",diff:"facile",type:"q",q:"Combien de joueurs compte une équipe de basket-ball sur le terrain ?",a:"5 joueurs par équipe (10 au total sur le terrain)",detail:"Le basketball est inventé par James Naismith en 1891 à Springfield (Massachusetts) pour garder ses étudiants actifs l'hiver. Il utilise deux paniers de pêche et un ballon de foot. La NBA (National Basketball Association) est fondée en 1946. Le jeu s'est répandu dans le monde entier, notamment grâce aux Dream Team américaines aux JO depuis 1992."},
{theme:"sport",diff:"facile",type:"q",q:"Quelle ville a accueilli les Jeux olympiques d'été de 2024 ?",a:"Paris (France) — 100 ans après les JO de 1924 également à Paris",detail:"Les JO de Paris 2024 se sont tenus du 26 juillet au 11 août 2024, avec une cérémonie d'ouverture sur la Seine, la première hors d'un stade. Environ 10 500 athlètes y ont participé. Le breaking (breakdance) y a fait ses débuts olympiques. La France a terminé 5e au tableau des médailles, avec 16 titres et 64 médailles."},
{theme:"sport",diff:"facile",type:"q",q:"Quel joueur de basketball américain est surnommé « Air Jordan » ?",a:"Michael Jordan (Chicago Bulls, 1984-1998)",detail:"Jordan remporte 6 titres NBA (1991-1993, 1996-1998), 5 titres de MVP de la saison et 6 de MVP des Finales. Sa détente lui vaut le surnom d'« Air Jordan ». Nike lance la ligne de chaussures Air Jordan en 1985, devenue l'une des plus lucratives de l'histoire du sport. Le documentaire The Last Dance (2020) a relancé sa légende."},
{theme:"sport",diff:"facile",type:"q",q:"Quel sport de raquette se joue sur une table ?",a:"Le tennis de table (ping-pong)",detail:"Inventé en Angleterre vers 1880 comme version d'intérieur du tennis, le tennis de table a sa fédération internationale depuis 1926. La Chine domine la discipline depuis les années 1960 et a remporté l'immense majorité des titres olympiques depuis 1988. La « diplomatie du ping-pong » (1971), avec l'invitation d'une équipe américaine en Chine, a contribué au rapprochement sino-américain."},
{theme:"sport",diff:"facile",type:"q",q:"Combien de points vaut un essai au rugby à XV ?",a:"5 points",detail:"L'essai consiste à aplatir le ballon dans l'en-but adverse. Il peut être suivi d'une transformation (2 points). Une pénalité ou un drop rapportent 3 points. Le rugby à XV oppose deux équipes de 15 joueurs ; le rugby à 7 est au programme olympique depuis 2016."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel coureur cycliste a remporté le plus de Tours de France ?",a:"Cinq coureurs à égalité, avec 5 victoires : Jacques Anquetil, Eddy Merckx, Bernard Hinault, Miguel Indurain et Tadej Pogačar",detail:"Lance Armstrong avait remporté 7 Tours (1999-2005), tous annulés en 2012 pour dopage. Tadej Pogačar (Slovénie) a égalé le record en 2026, après ses victoires de 2020, 2021, 2024 et 2025. Chris Froome compte 4 victoires, Jonas Vingegaard 2 (2022, 2023)."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui a réalisé le Grand Chelem en tennis en une seule saison calendaire, remportant les 4 tournois majeurs la même année ?",a:"Chez les hommes, Don Budge (1938) et Rod Laver (1962 et 1969) ; chez les femmes, Maureen Connolly (1953), Margaret Court (1970) et Steffi Graf (1988)",detail:"Le Grand Chelem calendaire consiste à remporter l'Open d'Australie, Roland-Garros, Wimbledon et l'US Open la même année. En 1988, Steffi Graf y ajoute l'or olympique : c'est le « Golden Slam », unique dans l'histoire du simple. Rafael Nadal détient le record de titres à Roland-Garros (14), Novak Djokovic à l'Open d'Australie (10)."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel est l'événement sportif le plus regardé au monde ?",a:"La finale de la Coupe du Monde de football (~1,5 milliard de téléspectateurs)",detail:"La finale 2022 (Argentine-France) aurait été suivie par environ 1,5 milliard de personnes selon la FIFA. Les Jeux olympiques et la finale de la Ligue des champions attirent aussi des centaines de millions de téléspectateurs ; le Super Bowl est l'événement le plus regardé aux États-Unis."},
{theme:"sport",diff:"moyen",type:"q",q:"Quelle nation domine les Jeux Olympiques depuis leur création en nombre total de médailles ?",a:"Les États-Unis (plus de 2 600 médailles aux Jeux d'été, dont plus de 1 000 en or)",detail:"Les États-Unis dominent le tableau cumulé des médailles depuis 1896 ; l'URSS arrive 2e. La Chine, présente en 1952 puis de retour en 1984, a progressé très vite et a terminé 1re au nombre de titres à Pékin en 2008. Natation (Spitz, Phelps) et athlétisme (Owens, Lewis) sont les points forts historiques des Américains."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel coureur canadien est disqualifié aux JO de Séoul en 1988 pour dopage, dans le scandale le plus retentissant de l'histoire athlétique ?",a:"Ben Johnson",detail:"Ben Johnson court le 100 m en 9″79 à Séoul et est disqualifié trois jours plus tard, contrôlé positif au stanozolol ; Carl Lewis récupère l'or. D'autres scandales ont marqué le sport : l'affaire Festina (Tour de France 1998), le dopage d'État en RDA, le rapport McLaren (2016) sur le programme russe."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel sport est le plus populaire aux États-Unis et quelle est sa finale annuelle ?",a:"Le football américain — le Super Bowl est la finale de la NFL, l'événement le plus regardé aux États-Unis",detail:"Le Super Bowl réunit plus de 120 millions de téléspectateurs aux États-Unis. Un spot publicitaire de 30 secondes y coûte autour de 8 millions de dollars. Le spectacle de la mi-temps (halftime show) est un événement en soi. La NFL est la ligue sportive la plus riche du monde (plus de 20 milliards de dollars de revenus annuels)."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui est Pelé et pourquoi est-il considéré comme le plus grand footballeur de l'histoire ?",a:"Edson Arantes do Nascimento, dit Pelé (1940-2022) — seul joueur triple champion du monde (1958, 1962, 1970), auteur de plus de 1 200 buts revendiqués",detail:"Pelé dispute la Coupe du monde 1958 à 17 ans et y marque 6 buts, dont un doublé en finale. Il passe l'essentiel de sa carrière à Santos, puis termine au Cosmos de New York. Ses 1 281 buts revendiqués incluent de nombreux matchs amicaux. Technique, vitesse et intelligence de jeu font de lui une référence absolue."},
{theme:"sport",diff:"moyen",type:"q",q:"Quelle est la particularité de la Formule 1 par rapport aux autres sports mécaniques ?",a:"Ce sont les voitures de course les plus sophistiquées : des monoplaces dont l'aérodynamique génère plus de 5 g en virage",detail:"La F1 est un laboratoire automobile : freins en carbone, boîte semi-automatique, récupération d'énergie se retrouvent ensuite sur les voitures de série. Lewis Hamilton et Michael Schumacher partagent le record de 7 titres mondiaux. Les écuries (Ferrari, Mercedes, Red Bull, McLaren) sont de véritables entreprises technologiques."},
{theme:"sport",diff:"moyen",type:"q",q:"Quelle franchise NBA détient le record du plus grand nombre de titres, avec 18 sacres ?",a:"Les Boston Celtics (18 titres), devant les Los Angeles Lakers (17)",detail:"Les Celtics ont dominé les années 1950-1960 avec Bill Russell (11 titres) et remporté leur 18e titre en 2024. Les Lakers ont compté Kareem Abdul-Jabbar, Magic Johnson, Shaquille O'Neal, Kobe Bryant et LeBron James. Les Chicago Bulls de Michael Jordan (6 titres en 8 ans, 1991-1998) et les Golden State Warriors de Stephen Curry ont marqué leur époque. La NBA compte 30 franchises."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui est Muhammad Ali et pourquoi dépasse-t-il le seul cadre sportif ?",a:"Cassius Clay (1942-2016), champion du monde des poids lourds, converti à l'islam, refusant la guerre du Vietnam — symbole mondial des droits civiques",detail:"Ali, champion du monde des poids lourds à trois reprises (1964, 1974, 1978), est célèbre pour sa vitesse, son jeu de jambes et ses formules (« voler comme un papillon, piquer comme une abeille »). Converti à l'islam, il refuse en 1967 d'être incorporé pour la guerre du Vietnam : privé de licence, il ne combat plus pendant plus de trois ans. Le « Thrilla in Manila » contre Joe Frazier (1975) reste légendaire."},
{theme:"sport",diff:"moyen",type:"q",q:"Quelle équipe de rugby possède le meilleur pourcentage de victoires de l'histoire du rugby international ?",a:"Les All Blacks (Nouvelle-Zélande), avec environ 77 % de victoires",detail:"Les All Blacks effectuent le haka avant chaque match. Ils ont gagné 3 Coupes du monde (1987, 2011, 2015), une de moins que l'Afrique du Sud (4). Jonah Lomu a marqué les années 1990 ; Richie McCaw (148 sélections) est l'un des joueurs les plus titrés. Un pays de 5 millions d'habitants domine ainsi un sport mondial avec une régularité remarquable."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel est le record du monde du saut à la perche et qui le détient ?",a:"Armand Duplantis (Suède) — 6,31 m (Uppsala, mars 2026)",detail:"Né en 1999 aux États-Unis d'un père américain perchiste et d'une mère suédoise, Duplantis représente la Suède. Il a battu son premier record du monde en février 2020 (6,17 m) et l'a amélioré 15 fois, centimètre par centimètre. Il est double champion olympique (2021, 2024). Le record évolue souvent : vérifier la marque la plus récente."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui détient le record du monde du 200 m ?",a:"Usain Bolt — 19″19 (Berlin, Championnats du monde 2009)",detail:"Bolt établit ce record lors des Championnats du monde 2009, le même soir où il bat le record du 100 m. Il court le 200 m en 19,19 secondes en améliorant de 0,11 secondes son propre record des JO de Pékin 2008. Sa vitesse de pointe atteint 44,72 km/h. Le record féminin est détenu par Florence Griffith-Joyner (21,34 en 1988)."},
{theme:"sport",diff:"moyen",type:"q",q:"Dans quels pays du sous-continent indien le cricket est-il le sport national, mobilisant des centaines de millions de supporters ?",a:"L'Inde, le Pakistan, le Sri Lanka et le Bangladesh",detail:"Né en Angleterre, le cricket est roi en Asie du Sud et populaire en Australie, aux Antilles, en Afrique du Sud et en Nouvelle-Zélande. On lui attribue plus de 2 milliards de fans. Un test match peut durer 5 jours ; le format T20 (20 séries de lancers) a révolutionné le sport. Sachin Tendulkar (Inde) a réussi 100 « centuries » internationales. L'Indian Premier League (IPL) est l'une des ligues les plus riches du monde."},
{theme:"sport",diff:"difficile",type:"q",q:"En quelle année l'UEFA introduit-elle le fair-play financier pour empêcher les clubs de dépenser plus qu'ils ne gagnent ?",a:"En 2010 (appliqué à partir de la saison 2011-2012)",detail:"Le fair-play financier interdit aux clubs de dépenser durablement plus qu'ils ne gagnent, afin de limiter l'influence d'investisseurs fortunés (fonds du Golfe, oligarques). Manchester City et le PSG ont été sanctionnés ou poursuivis. En 2022, l'UEFA l'a remplacé par un « règlement sur la viabilité financière », qui plafonne notamment la masse salariale par rapport aux revenus."},
{theme:"sport",diff:"difficile",type:"q",q:"Combien de médailles d'or Jesse Owens remporte-t-il aux JO de Berlin 1936, contredisant la propagande nazie sur la supériorité aryenne ?",a:"4 médailles d'or (100 m, 200 m, 4 × 100 m, saut en longueur)",detail:"Hitler voulait faire des Jeux de Berlin une vitrine du régime : premier relais de la flamme, premières retransmissions télévisées. Les victoires d'Owens, athlète afro-américain, contredisent la propagande raciste nazie. Leni Riefenstahl en tire le film Olympia. Le CIO avait envisagé de retirer les Jeux à l'Allemagne, mais s'était contenté d'assurances du régime."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel est l'impact économique d'un méga-événement sportif comme une Coupe du Monde ou des JO ?",a:"Les retombées économiques directes sont souvent inférieures aux coûts : les JO de Rio 2016 auraient coûté environ 13 milliards de dollars",detail:"Montréal n'a fini de rembourser la dette des JO de 1976 qu'en 2006. Athènes 2004 a alourdi la dette grecque. Los Angeles 1984 et Londres 2012 font figure d'exceptions. Les bénéfices sont surtout immatériels (image, tourisme) et inégalement répartis. Le Qatar aurait dépensé plus de 200 milliards de dollars en infrastructures autour de la Coupe du monde 2022."},
{theme:"sport",diff:"difficile",type:"q",q:"Quelle région d'origine est surreprésentée parmi les finalistes olympiques du 100 m depuis 50 ans, et quelle explication scientifique est la plus solide ?",a:"Les athlètes d'ascendance ouest-africaine (Jamaïque, États-Unis, Caraïbes) ; aucune explication unique n'est établie",detail:"Depuis les années 1980, la quasi-totalité des finalistes olympiques du 100 m ont des origines ouest-africaines. Certaines études évoquent une proportion moyenne plus élevée de fibres musculaires rapides dans certaines populations, mais les facteurs culturels, économiques et organisationnels (structures d'entraînement, popularité du sprint en Jamaïque) jouent un rôle majeur. Toute généralisation génétique reste scientifiquement fragile."},
{theme:"sport",diff:"difficile",type:"q",q:"Quelle athlète sud-africaine est au cœur de la controverse sur l'hyperandrogénie dans le sport féminin, conduisant à une décision de la Cour européenne des droits de l'homme ?",a:"Caster Semenya",detail:"Double championne olympique du 800 m (2012, 2016), Semenya présente une variation du développement sexuel entraînant un taux de testostérone élevé. World Athletics exige qu'elle le fasse baisser par traitement pour concourir ; le Tribunal arbitral du sport valide la règle en 2019. La Cour européenne des droits de l'homme a jugé en 2023, puis en Grande Chambre en 2025, que la Suisse avait violé son droit à un procès équitable. La question oppose inclusion et équité sportive."},
{theme:"sport",diff:"difficile",type:"q",q:"Dans le système de draft des ligues sportives américaines, quelle équipe choisit en premier parmi les jeunes talents disponibles ?",a:"En principe, l'équipe la plus faible de la saison précédente (une loterie corrige ce principe en NBA et en NHL)",detail:"La draft (NBA, NFL, MLB, NHL) fait choisir les équipes dans l'ordre inverse du classement, afin de rééquilibrer la compétition entre franchises. Ce système contraste avec le football européen, où les clubs peuvent recruter librement. Être premier choix de la draft est un événement médiatique national."},
{theme:"sport",diff:"difficile",type:"q",q:"Combien de joueurs des White Sox de Chicago sont bannis à vie du baseball pour avoir truqué les World Series de 1919 ?",a:"Huit joueurs",detail:"En 1919, des joueurs des White Sox acceptent l'argent de parieurs, dans une combine liée au mafieux Arnold Rothstein, pour perdre les World Series contre Cincinnati : c'est le scandale des « Black Sox ». Acquittés par la justice, les huit joueurs, dont Shoeless Joe Jackson, sont bannis à vie par le commissaire Kenesaw Mountain Landis. En 2025, la MLB a retiré les joueurs décédés de sa liste des bannis, ce qui rend Jackson éligible au Hall of Fame."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel rôle a joué Ayrton Senna dans l'histoire de la Formule 1 ?",a:"Triple champion du monde (1988, 1990, 1991), souvent considéré comme le plus grand pilote de l'histoire, il meurt en course à Imola le 1er mai 1994",detail:"Senna est célèbre pour ses tours de qualification, son pilotage sous la pluie, ses 6 victoires à Monaco (record) et sa rivalité avec Alain Prost. Sa mort au Grand Prix de Saint-Marin, au lendemain de celle de Roland Ratzenberger, provoque un choc mondial et accélère des réformes de sécurité majeures. Le Brésil décrète trois jours de deuil national. Le documentaire Senna (2010) lui est consacré."},
{theme:"sport",diff:"difficile",type:"q",q:"Dans quelle ville italienne et depuis quel siècle pratique-t-on le Calcio storico, ancêtre violent du football ?",a:"À Florence, depuis le XVIe siècle",detail:"Le calcio storico (« football historique ») oppose les quatre quartiers de Florence (bleu, rouge, vert, blanc) sur la piazza Santa Croce. Ses règles sont fixées en 1580. Abandonné au XVIIIe siècle, le jeu est relancé en 1930. Deux équipes de 27 joueurs s'affrontent pendant 50 minutes, dans un mélange de sport collectif et de combat."},
{theme:"sport",diff:"facile",type:"q",q:"Quel sport collectif compte le plus de pratiquants et de fans dans le monde ?",a:"Le football",detail:"La FIFA estime à plus de 250 millions le nombre de joueurs et revendique des milliards de fans. Elle compte 211 fédérations membres, plus que l'ONU ne compte d'États. Le cricket arrive 2e en nombre de fans, grâce à l'Asie du Sud. Parmi les activités individuelles, la marche, la course, la natation et le cyclisme sont les plus répandues."},
{theme:"sport",diff:"facile",type:"q",q:"Quelle athlète française réalise le doublé 200 m-400 m aux JO d'Atlanta en 1996 ?",a:"Marie-José Pérec",detail:"Pérec avait déjà remporté le 400 m à Barcelone en 1992 : avec 3 titres, elle est la première athlète, hommes et femmes confondus, à gagner deux fois le 400 m olympique. Laura Flessel (escrime, 5 médailles dont 2 en or) et Clarisse Agbégnénou (judo, 5 médailles dont 3 en or) sont les Françaises les plus médaillées de l'histoire olympique."},
{theme:"sport",diff:"facile",type:"q",q:"Quelle est la surface sur laquelle se joue Roland-Garros ?",a:"Terre battue (argile rouge)",detail:"Roland-Garros est le seul tournoi du Grand Chelem sur terre battue, une surface lente qui favorise les joueurs de fond de court. Il se tient à Paris, près du bois de Boulogne, de fin mai à début juin. Rafael Nadal y a remporté 14 titres, record absolu pour un tournoi du Grand Chelem. Le court central, le Philippe-Chatrier, compte environ 15 000 places."},
{theme:"sport",diff:"facile",type:"q",q:"Quel est l'objectif du Tour de France et combien d'étapes comprend-il en moyenne ?",a:"Remporter le classement général au temps (maillot jaune) ; le Tour compte 21 étapes",detail:"Le Tour est créé en 1903 par Henri Desgrange pour promouvoir le journal L'Auto ; la première édition compte 6 étapes et 2 428 km. Il couvre aujourd'hui environ 3 300 à 3 500 km en trois semaines. Maillots distinctifs : jaune (général), vert (points), à pois rouges (meilleur grimpeur), blanc (meilleur jeune). Tadej Pogačar (5 victoires) et Jonas Vingegaard dominent les années 2020."},
{theme:"sport",diff:"facile",type:"q",q:"Quel pays a inventé le basketball et l'a popularisé dans le monde ?",a:"Les États-Unis — inventé par James Naismith (Canadien) en 1891 à Springfield, Massachusetts",detail:"Naismith, un Canadien enseignant au collège YMCA de Springfield, cherche un sport d'intérieur pour l'hiver. Il accroche deux paniers à pêches et rédige 13 règles. Le basket devient olympique en 1936. La NBA, fondée en 1946, diffuse le sport dans le monde grâce à des joueurs charismatiques (Magic Johnson, Larry Bird, Michael Jordan, LeBron James). La « Dream Team » des JO de Barcelone 1992 reste une référence."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel est le combat de boxe le plus mythique de l'histoire ?",a:"Le « Rumble in the Jungle » (1974) : Muhammad Ali bat George Foreman à Kinshasa (Zaïre) par KO au 8e round, récupérant son titre mondial",detail:"Ali utilise la tactique du « rope-a-dope » : adossé aux cordes, il laisse Foreman s'épuiser à frapper. Foreman, invaincu et grand favori, s'effondre au 8e round. Organisé par Don King dans le Zaïre de Mobutu, le combat est précédé du festival Zaïre 74 (James Brown, B.B. King). Le documentaire When We Were Kings (1996) a reçu l'Oscar."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel jeu de raquette, né en Grande-Bretagne, oppose deux ou quatre joueurs dans une salle fermée ?",a:"Le squash",detail:"Le squash naît à l'école de Harrow, près de Londres, vers 1830. Les joueurs frappent une balle en caoutchouc contre les murs d'un court fermé. C'est l'un des sports les plus exigeants physiquement. L'Égypte et le Pakistan dominent historiquement. Le Pakistanais Jahangir Khan serait resté invaincu pendant 555 matchs consécutifs (1981-1986)."},
{theme:"sport",diff:"moyen",type:"q",q:"Sur quelle île américaine se trouve le spot de Pipeline, étape mythique du circuit mondial de surf de la WSL ?",a:"Oahu (Hawaï), sur le North Shore",detail:"Le surf est pratiqué depuis des siècles en Polynésie et à Hawaï. Duke Kahanamoku le popularise au début du XXe siècle. La World Surf League passe notamment par Pipeline, Teahupo'o (Tahiti), site des épreuves olympiques de Paris 2024, et Hossegor. Le surf est devenu olympique à Tokyo en 2021. Kelly Slater (11 titres mondiaux) est le surfeur le plus titré."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui est Serena Williams et quel est son palmarès ?",a:"Serena Williams (née 1981) — 23 titres du Grand Chelem en simple, 319 semaines classée numéro 1 mondiale, considérée comme la meilleure joueuse de l'histoire",detail:"Serena Williams domine le tennis féminin du début des années 2000 au milieu des années 2010 et a joué en double avec sa sœur Venus. Elle compte 4 titres olympiques (1 en simple, 3 en double). Sa puissance et son mental ont transformé le tennis féminin. Elle a mis fin à sa carrière après l'US Open 2022."},
