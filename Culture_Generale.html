{theme:"sport",diff:"moyen",type:"q",q:"Quelles franchises détiennent le record de victoires au Super Bowl, avec 6 titres chacune ?",a:"Les New England Patriots et les Pittsburgh Steelers",detail:"Le Super Bowl oppose chaque année, en février, le champion de la conférence AFC à celui de la NFC. Tom Brady détient le record individuel avec 7 titres : 6 avec les Patriots et 1 avec les Tampa Bay Buccaneers. Un spot publicitaire de 30 secondes y coûte autour de 8 millions de dollars."},
{theme:"sport",diff:"moyen",type:"q",q:"Quelle est la différence entre le pentathlon moderne et le pentathlon antique ?",a:"Antique (saut, sprint, disque, javelot, lutte) ; Moderne (équitation, escrime, natation, tir, course à pied) — sport olympique depuis 1912, créé par Coubertin",detail:"Le pentathlon moderne, créé par Coubertin, s'inspire du soldat-messager : il monte à cheval, se bat à l'épée, nage, tire au pistolet et court. Depuis 2009, tir et course sont combinés dans le « laser-run ». Après la maltraitance d'un cheval aux JO de Tokyo 2021, l'équitation sera remplacée par une course d'obstacles à partir des JO de Los Angeles 2028."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel est l'impact de la mondialisation des transferts sur le football européen ?",a:"Les droits TV et les transferts record (Neymar, 222 millions d'euros en 2017) creusent les inégalités entre grands et petits clubs",detail:"L'arrêt Bosman (1995) a libéralisé les transferts en fin de contrat et supprimé les quotas de joueurs européens. Le chiffre d'affaires du Real Madrid dépasse désormais le milliard d'euros. Le projet de Super League européenne fermée, annoncé en avril 2021 puis abandonné en 48 heures par la plupart des clubs, a révélé les tensions entre grands clubs et instances ; la Cour de justice de l'UE a jugé en 2023 que l'UEFA avait abusé de sa position."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel pays domine la nage synchronisée aux JO depuis les années 2000, remportant presque tous les titres olympiques ?",a:"La Russie (tous les titres olympiques de 2000 à 2021)",detail:"La natation synchronisée, rebaptisée natation artistique en 2017, est olympique depuis 1984. Elle exige souffle, souplesse et coordination parfaite. Sous la direction de Tatiana Pokrovskaïa, la Russie a remporté tous les titres de 2000 à 2021. Exclue après l'invasion de l'Ukraine, elle a laissé la place à la Chine, double championne olympique à Paris 2024. Les hommes sont admis dans l'épreuve par équipes depuis 2024."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel athlète américain partage avec Paavo Nurmi le record de 9 médailles d'or olympiques en athlétisme ?",a:"Carl Lewis (États-Unis) — 9 or entre Los Angeles 1984 et Atlanta 1996 (100 m, 200 m, 4×100 m, saut en longueur)",detail:"Carl Lewis gagne 4 titres à Los Angeles en 1984 (100 m, 200 m, 4 × 100 m, longueur), 2 à Séoul en 1988 (100 m, après la disqualification de Ben Johnson, et longueur), 2 à Barcelone en 1992 (4 × 100 m, longueur) et 1 à Atlanta en 1996 (longueur, à 35 ans). Le Finlandais Paavo Nurmi avait remporté 9 titres en fond et demi-fond entre 1920 et 1928."},
{theme:"sport",diff:"difficile",type:"q",q:"Qui popularise la règle des 10 000 heures dans Outliers (2008), en s'appuyant sur les travaux du psychologue Anders Ericsson ?",a:"Malcolm Gladwell",detail:"Ericsson avait observé que les meilleurs violonistes d'une école de Berlin avaient accumulé en moyenne 10 000 heures de pratique à 20 ans. Gladwell en tire une règle générale, très débattue : la qualité de la pratique compte autant que la quantité, les facteurs génétiques sont sous-estimés, et certains champions atteignent l'élite bien plus vite. Ericsson lui-même a critiqué cette simplification."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel organisme mondial du sport a adopté en 2021 un cadre laissant chaque fédération décider de sa politique d'inclusion des athlètes transgenres ?",a:"Le Comité international olympique (CIO)",detail:"L'intégration des athlètes transgenres oppose inclusion et équité. World Aquatics (2022) et World Athletics (2023) excluent des compétitions féminines d'élite les femmes transgenres ayant connu une puberté masculine. Le cas de Lia Thomas, nageuse universitaire américaine, a cristallisé le débat. La recherche sur les avantages physiologiques persistant après transition est encore en cours."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel président américain ne reçut pas Jesse Owens à la Maison-Blanche après ses quatre titres olympiques de 1936 ?",a:"Franklin D. Roosevelt",detail:"Owens rentre en héros, avec une parade à New York, mais ne reçoit ni invitation ni télégramme de félicitations de Roosevelt, en pleine campagne électorale. Contrairement à la légende, Hitler n'a pas refusé de lui serrer la main en particulier : après avoir félicité des vainqueurs allemands le premier jour, il avait été prié par le CIO de féliciter tous les champions ou aucun, et avait cessé de le faire. Owens disait avoir été plus blessé par l'attitude de son propre président."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel sport d'hiver se pratique sur des skis avec des bâtons dans un parcours de portes ?",a:"Le ski alpin (slalom, géant, super-G, descente)",detail:"Le ski alpin de compétition comprend le slalom, le slalom géant, le super-G et la descente. La Coupe du monde, créée en 1967, se dispute d'octobre à mars. Mikaela Shiffrin (États-Unis) détient le record absolu de victoires avec 110 succès à la fin de la saison 2025-2026, devant Ingemar Stenmark (86). Marcel Hirscher (67) et Lindsey Vonn (82) font aussi partie des légendes."},
{theme:"sport",diff:"facile",type:"q",q:"Quel est le sport national du Japon ?",a:"Le sumo (traditionnel) et le baseball (sport le plus populaire aujourd'hui)",detail:"Le sumo, lutte rituelle pratiquée depuis des siècles, oppose deux rikishi qui tentent de faire sortir l'adversaire du dohyo ou de lui faire toucher le sol. Six tournois officiels (basho) ont lieu chaque année. Le baseball (yakyū), introduit dans les années 1870, est devenu le sport le plus populaire du pays, avec la Nippon Professional Baseball (NPB)."},
{theme:"sport",diff:"facile",type:"q",q:"Quelle course automobile, disputée depuis 1923, est la plus ancienne course d'endurance encore active ?",a:"Les 24 Heures du Mans",detail:"Organisée par l'Automobile Club de l'Ouest sur le circuit de la Sarthe, la course récompense l'équipage qui parcourt la plus grande distance en 24 heures. Avec le Grand Prix de Monaco et les 500 miles d'Indianapolis, elle forme la « Triple Couronne » du sport automobile. Le Tour de France cycliste est, lui, surnommé la « Grande Boucle »."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel club détient le record de victoires en Ligue des Champions de l'UEFA, avec 15 titres au compteur ?",a:"Le Real Madrid",detail:"La Coupe des clubs champions européens est créée en 1955. Le Real Madrid remporte les 5 premières éditions (1956-1960) avec Di Stéfano. La compétition devient la Ligue des champions en 1992. Le Real a gagné son 15e titre en 2024. L'AC Milan (7), le Bayern Munich (6), Liverpool (6) et le FC Barcelone (5) suivent."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel combattant irlandais de MMA devient en 2016 le premier à détenir simultanément deux ceintures de l'UFC ?",a:"Conor McGregor (né en 1988)",detail:"McGregor est champion des poids plumes et des poids légers de l'UFC en 2016. Il affronte ensuite Floyd Mayweather en boxe anglaise (2017), combat qui génère des centaines de millions de dollars. Sa défaite contre Khabib Nurmagomedov (2018) reste l'un des combats de MMA les plus regardés. Sa personnalité provocatrice a fait de lui une star mondiale."},
// CARTES SPORT SUITE
{theme:"sport",diff:"facile",type:"q",q:"Qui est considéré comme le plus grand joueur de hockey sur glace de tous les temps ?",a:"Wayne Gretzky (Canada) — « The Great One » — 2 857 points en carrière NHL, record absolu",detail:"Gretzky joue 20 saisons en NHL (1979-1999), surtout avec les Oilers d'Edmonton et les Kings de Los Angeles. Ses 1 963 passes décisives dépassent à elles seules le total de points de tout autre joueur. Son record de buts (894) a été battu par Alexander Ovechkin en 2025. Son numéro 99 a été retiré par toute la ligue."},
{theme:"sport",diff:"facile",type:"q",q:"Quel sport, surnommé « America's pastime », est traditionnellement considéré comme le passe-temps national des États-Unis ?",a:"Le baseball",detail:"La première grande ligue professionnelle, la National League, est fondée en 1876. Les New York Yankees sont l'équipe la plus titrée, avec 27 World Series. Le baseball a donné à l'anglais de nombreuses expressions (« to hit a home run », « out of left field »). Aujourd'hui, le football américain le devance en audience, et le basket en nombre de pratiquants."},
{theme:"sport",diff:"facile",type:"q",q:"Quel est le record du monde du saut en hauteur ?",a:"Javier Sotomayor (Cuba) — 2,45 m (1993)",detail:"Sotomayor établit ce record à Salamanque (Espagne) le 27 juillet 1993 ; il tient toujours. Mesurant 1,93 m, il a franchi une barre placée 52 cm au-dessus de sa tête. La technique du « Fosbury flop » (passage dorsal), popularisée par Dick Fosbury aux JO de Mexico 1968, est utilisée par tous les sauteurs modernes."},
{theme:"sport",diff:"facile",type:"q",q:"Quelle discipline olympique consiste à lancer un poids de métal le plus loin possible ?",a:"Le lancer du poids",detail:"Le poids pèse 7,26 kg chez les hommes et 4 kg chez les femmes. L'Américain Ryan Crouser détient le record du monde avec 23,56 m (2023). Le record féminin, 22,63 m, appartient à Natalia Lisovskaïa depuis 1987. Disque, marteau et javelot sont les autres lancers olympiques."},
{theme:"sport",diff:"facile",type:"q",q:"Quelles sont les trois disciplines enchaînées dans un triathlon olympique, et dans quel ordre se succèdent-elles ?",a:"Natation, cyclisme puis course à pied",detail:"Le triathlon olympique comprend 1,5 km de natation, 40 km de vélo et 10 km de course. L'Ironman enchaîne 3,8 km de natation, 180 km de vélo et un marathon. Né à San Diego en 1974, le triathlon devient olympique à Sydney en 2000."},
{theme:"sport",diff:"facile",type:"q",q:"Quel pays a remporté le plus de titres en Coupe Davis de tennis ?",a:"Les États-Unis (32 titres) devant l'Australie (28 titres)",detail:"La Coupe Davis, créée en 1900, est la plus ancienne compétition internationale de tennis par équipes. Le format a été réformé en 2019, avec une phase finale regroupée (Madrid, puis Malaga et Bologne). L'Italie s'est imposée en 2023, 2024 et 2025."},
{theme:"sport",diff:"moyen",type:"q",q:"Quels pays asiatiques dominent l'haltérophilie olympique depuis les années 2000, trustant médailles et records du monde ?",a:"La Chine, très largement en tête, et la Corée du Nord",detail:"L'haltérophilie est olympique depuis 1896. Elle comprend deux mouvements : l'arraché, en un temps, et l'épaulé-jeté, en deux temps. La Chine domine depuis les années 2000, notamment chez les femmes. La discipline a été minée par le dopage, au point que le CIO a réduit le nombre de catégories et menacé de l'exclure du programme."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel judoka français, champion olympique des +100 kg en 2012, 2016 et 2024, compte 11 titres de champion du monde ?",a:"Teddy Riner (né en 1989)",detail:"Riner est resté invaincu de 2010 à 2020 (154 combats). Avec 5 titres olympiques (3 en individuel, 2 par équipes mixtes en 2021 et 2024) et 2 médailles de bronze, il est le judoka le plus titré de l'histoire. Son sacre à Paris 2024, à 35 ans, a fait de lui le plus vieux champion olympique de judo."},
{theme:"sport",diff:"moyen",type:"q",q:"Quelle pénalité un biathlète subit-il pour chaque cible manquée au stand de tir ?",a:"Une boucle de pénalité de 150 m pour chaque cible manquée (une minute ajoutée en épreuve individuelle)",detail:"Né dans les patrouilles militaires scandinaves, le biathlon combine ski de fond et tir à la carabine ; il est olympique depuis 1960. Les athlètes doivent maîtriser souffle et rythme cardiaque après l'effort. La Norvège, la France et l'Allemagne dominent. Martin Fourcade a remporté 5 titres olympiques ; Quentin Fillon Maillet est devenu en 2026 le Français le plus médaillé aux JO (9 médailles)."},
{theme:"sport",diff:"moyen",type:"q",q:"Quelle est la particularité des Jeux Paralympiques ?",a:"C'est la grande compétition multisport pour athlètes en situation de handicap ; organisée après les JO dans la même ville, elle est née des jeux de Stoke Mandeville lancés par Ludwig Guttmann en 1948",detail:"Ludwig Guttmann, neurochirurgien allemand réfugié en Angleterre, organise des compétitions pour blessés de guerre paraplégiques à l'hôpital de Stoke Mandeville. Les premiers Jeux paralympiques se tiennent à Rome en 1960 (environ 400 athlètes). Paris 2024 a réuni environ 4 400 paralympiens de près de 170 délégations."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui est Rafael Nadal et quel record unique détient-il à Roland-Garros ?",a:"Rafael Nadal (Espagne) — 22 titres du Grand Chelem dont 14 à Roland-Garros (record absolu dans un tournoi)",detail:"Surnommé le « roi de la terre battue », Nadal a pris sa retraite en novembre 2024. Son coup droit très lifté et son jeu de jambes étaient parfaitement adaptés à la terre battue. Il détient le record de titres dans un même tournoi du Grand Chelem (14 Roland-Garros). Sa rivalité avec Roger Federer, puis avec Novak Djokovic, est souvent considérée comme l'une des plus grandes de l'histoire du sport."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel pays a dominé le curling aux Jeux Olympiques d'hiver avec le plus grand nombre de médailles depuis son introduction en 1998 ?",a:"Le Canada",detail:"Le curling naît en Écosse au XVIe siècle. Des équipes de 4 joueurs font glisser des pierres de granit vers une cible ; les balayeurs frottent la glace pour modifier leur trajectoire et leur vitesse. Ses subtilités tactiques lui valent le surnom d'« échecs sur glace ». Le Canada, la Suède et la Grande-Bretagne dominent ; l'équipe féminine sud-coréenne a fait sensation à Pyeongchang (2018)."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui est Tiger Woods et comment a-t-il révolutionné le golf ?",a:"Eldrick « Tiger » Woods (né en 1975) — 15 titres du Grand Chelem de golf, premier joueur non blanc à dominer ce sport",detail:"Woods remporte le Masters d'Augusta à 21 ans (1997) avec 12 coups d'avance, un record. Sa puissance et son professionnalisme transforment le golf, dont il fait exploser les audiences et les dotations. Blessures et scandales n'empêchent pas son 15e titre majeur au Masters 2019. Il est considéré comme l'un des plus grands sportifs de l'histoire."},
{theme:"sport",diff:"moyen",type:"q",q:"Quels sports de combat étaient déjà présents aux Jeux Olympiques antiques de 776 av. J.-C. ?",a:"La lutte et le pugilat (boxe) sont aux JO antiques depuis leur fondation (776 av. J.-C.) — aux JO modernes depuis 1896",detail:"La lutte figure aux Jeux antiques dès 708 av. J.-C., le pugilat dès 688 av. J.-C. ; aux Jeux modernes, la lutte est présente dès 1896 et la boxe depuis 1904. Le judo (1964), le taekwondo (2000) et la lutte féminine (2004) ont été ajoutés ; le karaté n'a figuré qu'en 2021. Le MMA n'est pas olympique."},
{theme:"sport",diff:"moyen",type:"q",q:"En quelle saison le championnat de Formule E est-il lancé, et quel constructeur automobile remporte le premier titre ?",a:"Lors de la saison 2014-2015 ; le premier titre par équipes revient à e.dams-Renault, le titre pilotes à Nelson Piquet Jr.",detail:"La Formule E se distingue de la F1 par ses courses en ville (Monaco, Berlin, New York…) et sa double mission sportive et technologique. Audi, BMW, Mercedes, Porsche, Jaguar ou Nissan y ont testé leurs technologies de batteries et de moteurs électriques, transférées ensuite vers leurs véhicules de série."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel est l'impact des droits télévisés sur l'économie du sport professionnel ?",a:"Les droits TV représentent souvent la moitié ou plus des revenus des grandes ligues — la Premier League a vendu ses droits 2022-2025 pour environ 10 milliards de livres",detail:"La Premier League anglaise est la ligue de football la plus riche du monde, grâce notamment à ses droits internationaux. La NFL perçoit plus de 10 milliards de dollars par an de ses diffuseurs depuis 2023. Ces revenus creusent les écarts entre ligues et entre clubs, et gonflent salaires et transferts."},
{theme:"sport",diff:"difficile",type:"q",q:"Dans quel pays la culture ultras du football naît-elle dans les années 1960-70, avant de se répandre dans toute l'Europe ?",a:"En Italie",detail:"Les premiers groupes ultras apparaissent à la fin des années 1960, comme la Fossa dei Leoni de l'AC Milan (1968) ou les Boys de l'Inter (1969). Ils organisent tifos géants, fumigènes et chants coordonnés. Distincts des hooligans, les ultras ont souvent une identité politique marquée. Le mouvement s'est répandu dans toute l'Europe et au Maghreb."},
{theme:"sport",diff:"difficile",type:"q",q:"Dans quel milieu scolaire britannique du XIXe siècle l'idéal de fair play sportif émerge-t-il pour la première fois ?",a:"Les public schools anglaises (Rugby, Eton, Harrow)",detail:"Ces écoles privées codifient des sports collectifs pour forger le caractère de leurs élèves : la manière de jouer importe plus que la victoire. Le roman Tom Brown's School Days (1857) de Thomas Hughes popularise cet idéal. Coubertin s'en inspire pour les JO ; la formule « l'important, c'est de participer » vient d'un sermon de l'évêque Ethelbert Talbot (1908), qu'il reprend."},
{theme:"sport",diff:"difficile",type:"q",q:"Dans quelle ville japonaise se déroule la majorité des tournois de sumo, et combien de tournois officiels ont lieu chaque année ?",a:"À Tokyo, qui accueille 3 des 6 tournois officiels annuels, au Ryōgoku Kokugikan",detail:"Les trois autres basho se tiennent à Osaka, Nagoya et Fukuoka. Le sumo mêle sport et rituel shintoïste : purification du dohyo au sel, frappes des cuisses. Les lutteurs les plus lourds dépassent 200 kg. Le rang suprême est celui de yokozuna. Le Mongol Hakuhō, retraité en 2021, détient le record de 45 tournois remportés en première division."},
{theme:"sport",diff:"facile",type:"q",q:"Quel sportif français est devenu en 2026 le plus médaillé de l'histoire des Jeux olympiques ?",a:"Quentin Fillon Maillet (biathlon), avec 9 médailles",detail:"Il dépasse les escrimeurs Roger Ducret et Philippe Cattiau (8 médailles chacun, dans les années 1920-1930). Teddy Riner (judo) compte 7 médailles, dont 5 en or, record de titres pour un Français aux Jeux d'été ; Martin Fourcade (biathlon) compte aussi 5 titres. Laura Flessel (escrime) et Clarisse Agbégnénou (judo), avec 5 médailles chacune, sont les Françaises les plus médaillées."},
{theme:"sport",diff:"facile",type:"q",q:"Combien d'épreuves composent le décathlon, et sur combien de jours se déroule-t-il aux Jeux Olympiques ?",a:"10 épreuves, sur 2 jours",detail:"Jour 1 : 100 m, saut en longueur, lancer du poids, saut en hauteur, 400 m. Jour 2 : 110 m haies, disque, saut à la perche, javelot, 1 500 m. Le vainqueur est surnommé « l'athlète le plus complet du monde ». Kevin Mayer (France) détient le record du monde avec 9 126 points (2018). Daley Thompson (Royaume-Uni) et Roman Šebrle (République tchèque) ont aussi marqué l'histoire."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel sport collectif nord-américain se joue avec une crosse et une rondelle sur la glace ?",a:"Le hockey sur glace",detail:"Le hockey sur glace moderne naît à Montréal dans les années 1870. La NHL (National Hockey League) est la principale ligue professionnelle. Le Canada et l'URSS/Russie ont longtemps dominé. Wayne Gretzky, Mario Lemieux et Gordie Howe sont des légendes. La Série du siècle Canada-URSS (1972) est l'une des confrontations les plus célèbres de l'histoire du sport."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel est le parcours officiel d'un Ironman triathlon ?",a:"3,86 km de natation + 180,25 km de vélo + 42,195 km de course à pied (marathon) — total ~226 km",detail:"L'Ironman naît en février 1978 à Hawaï, d'un pari visant à savoir quels athlètes étaient les plus endurants. Le record sur la distance est d'environ 7 h 21 (Kristian Blummenfelt, 2022). Les concurrents disposent généralement de 17 heures. Le championnat du monde se court traditionnellement à Kona (Hawaï). Jan Frodeno et Patrick Lange (Allemagne) ont dominé les années 2010."},
{theme:"sport",diff:"moyen",type:"q",q:"Dans quelle ville britannique se tient chaque année le Championnat du monde de snooker, la compétition la plus prestigieuse du sport ?",a:"Sheffield (au Crucible Theatre, depuis 1977)",detail:"Le snooker, né en Inde dans l'armée britannique vers 1875, se joue sur une table d'environ 3,6 × 1,8 m avec 15 billes rouges et 6 de couleur. Un « break maximum » (147 points) consiste à toutes les empocher dans l'ordre sans manquer. Ronnie O'Sullivan a réalisé le plus rapide en 5 min 08 s (1997). Le snooker est très populaire au Royaume-Uni et en Chine."},
{theme:"sport",diff:"difficile",type:"q",q:"Quelle est la signification culturelle des Haka dans le rugby néo-zélandais ?",a:"Danse guerrière maorie performée par les All Blacks avant chaque match — revendication de l'identité polynésienne de la Nouvelle-Zélande et intimidation de l'adversaire",detail:"Le Ka Mate, haka traditionnel, est exécuté par les All Blacks depuis 1905. En 2005, ils adoptent aussi le Kapa o Pango, composé pour eux. Certains adversaires y répondent : les Gallois sont restés face aux All Blacks en 2008, les Irlandais ont formé un « 8 » en hommage à Anthony Foley en 2016, les Français ont avancé en triangle en 2011."},
{theme:"sport",diff:"difficile",type:"q",q:"Combien d'équipes composent la Nippon Professional Baseball (NPB), et quel joueur japonais est devenu le symbole du passage vers la MLB ?",a:"12 équipes ; Hideo Nomo ouvre la voie en 1995, puis Ichiro Suzuki devient en 2001 la grande star japonaise de la MLB",detail:"La NPB, issue d'une ligue fondée en 1936, est organisée en deux ligues de 6 équipes depuis 1950. Ichiro Suzuki enchaîne 10 saisons consécutives à plus de 200 coups sûrs et entre au Hall of Fame en 2025. Shohei Ohtani brille à la fois comme lanceur et comme frappeur, du jamais-vu depuis Babe Ruth. Le Japon a notamment remporté le Classique mondial en 2006, 2009 et 2023."},
{theme:"sport",diff:"facile",type:"q",q:"Quel record cycliste consiste à parcourir la plus grande distance possible en une heure sur piste ?",a:"Le record de l'heure",detail:"Ce record mythique a été détenu par Fausto Coppi, Jacques Anquetil, Eddy Merckx ou Miguel Indurain. Depuis 2022, il appartient à l'Italien Filippo Ganna (56,792 km). Les épreuves olympiques de cyclisme sur piste incluent aussi la vitesse, le keirin, la poursuite par équipes, l'omnium et l'américaine."},
{theme:"sport",diff:"facile",type:"q",q:"Dans quel pays d'Amérique du Sud le polo est-il le plus pratiqué et le plus titré au niveau mondial ?",a:"L'Argentine",detail:"Originaire de Perse, le polo oppose deux équipes de 4 cavaliers qui frappent une balle avec un maillet. L'Argentine domine le polo mondial depuis le milieu du XXe siècle ; son open de Palermo est le tournoi le plus prestigieux. Un match de haut niveau comprend 6 périodes (chukkers) de 7 minutes ; les chevaux sont changés très souvent. Le roi Charles III a joué jusqu'en 2005."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel est le record du monde du lancer du javelot et qui le détient ?",a:"Jan Železný (République tchèque) — 98,48 m (Iéna, 25 mai 1996)",detail:"Železný détient ce record depuis 1996. Il a remporté 3 titres olympiques (1992, 1996, 2000). En 1986, le centre de gravité du javelot masculin (800 g) a été avancé pour réduire les distances, après le jet de l'Allemand de l'Est Uwe Hohn à 104,80 m (1984), qui menaçait la sécurité du public."},
{theme:"sport",diff:"moyen",type:"q",q:"Combien de fois l'équipe de France masculine de handball a-t-elle remporté le Championnat du monde ?",a:"6 fois (1995, 2001, 2009, 2011, 2015, 2017)",detail:"Les « Experts » ont aussi remporté 3 titres olympiques (2008, 2012, 2021). Nikola Karabatić, avec 3 titres olympiques et 4 titres mondiaux, est souvent considéré comme le meilleur handballeur de l'histoire. L'équipe de France féminine a été sacrée championne olympique en 2021 et a obtenu l'argent à Paris 2024. Le handball est surtout populaire en Europe."},
{theme:"sport",diff:"moyen",type:"q",q:"Quel pays reconnaît l'e-sport comme discipline sportive officielle dès 2003, parmi les premiers au monde ?",a:"La Chine, qui reconnaît l'e-sport comme sport officiel en 2003",detail:"La Corée du Sud a structuré très tôt l'e-sport, avec une association dédiée dès 2000 et des championnats de StarCraft télévisés. Les finales des grands tournois (League of Legends, Counter-Strike, Dota 2) réunissent des millions de spectateurs en ligne. Le CIO a organisé une Olympic Esports Week à Singapour en 2023."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui est Simone Biles et pourquoi est-elle considérée comme la plus grande gymnaste de l'histoire ?",a:"Simone Biles (née en 1997, États-Unis) — 30 médailles mondiales (record), 11 médailles olympiques dont 7 en or, et 5 éléments portant son nom",detail:"Biles a révolutionné la gymnastique artistique par des éléments d'une difficulté inédite au sol, au saut et à la poutre. Aux JO de Tokyo 2021, elle se retire de plusieurs finales pour protéger sa santé mentale, à cause des « twisties » (perte de repères en l'air). À Paris 2024, elle remporte 3 titres et 1 médaille d'argent. Elle est devenue un symbole de la prise en compte de la santé mentale dans le sport."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel est l'impact de la technologie VAR sur le football professionnel ?",a:"La Video Assistant Referee (VAR), introduite en 2018 (Coupe du Monde), réduit les erreurs arbitrales mais ralentit le jeu et crée de nouvelles controverses",detail:"L'assistance vidéo à l'arbitrage intervient pour quatre types de décisions : buts, penalties, cartons rouges directs et erreurs d'identité. Elle corrige de nombreuses erreurs manifestes, mais les interruptions et l'interprétation des règles (hors-jeu au centimètre) suscitent frustration et polémiques. L'IFAB, gardienne des lois du jeu, continue d'ajuster son usage."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel a été le rôle du sportif Arthur Ashe dans l'histoire des droits civiques ?",a:"Arthur Ashe (1943-1993) — premier joueur noir vainqueur de l'US Open (1968) et du simple messieurs de Wimbledon (1975), militant contre l'apartheid, il révèle sa séropositivité en 1992",detail:"Ashe grandit dans la Virginie ségrégationniste, où les courts publics sont réservés aux Blancs. Il est le premier Noir sélectionné en équipe américaine de Coupe Davis (1963). Infecté par le VIH lors d'une transfusion sanguine après une opération cardiaque (1983), il rend sa maladie publique en 1992 et fait de la lutte contre le sida son dernier combat. Il meurt en 1993, à 49 ans. Althea Gibson avait, avant lui, remporté Wimbledon chez les femmes (1957)."},
// CARTES SPORT FINALES (9 cartes pour atteindre 100)
{theme:"sport",diff:"facile",type:"q",q:"Quel pays a inventé le volleyball ?",a:"Les États-Unis — William G. Morgan invente le volleyball en 1895 à Holyoke, Massachusetts",detail:"Morgan, directeur au YMCA, cherche un sport moins brutal que le basket pour des hommes d'affaires. Il invente la « mintonette », rebaptisée volley-ball. Le volley est olympique depuis 1964, le beach-volley depuis Atlanta 1996. Le Brésil, les États-Unis et la Pologne dominent le volley-ball mondial."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui est Lionel Messi et quel exploit a-t-il accompli en 2022 ?",a:"Considéré par beaucoup comme le meilleur footballeur de l'histoire, il remporte la Coupe du monde 2022 avec l'Argentine après une finale épique contre la France",detail:"Messi joue 17 saisons au FC Barcelone (2004-2021) et y gagne 4 Ligues des champions (2006, 2009, 2011, 2015). La finale 2022 contre la France (3-3 après prolongation, victoire aux tirs au but) est souvent citée comme la plus belle de l'histoire. Il remporte aussi les Copa América 2021 et 2024, et rejoint l'Inter Miami en 2023."},
{theme:"sport",diff:"facile",type:"q",q:"Qui crée le judo en 1882 au Japon, et quel principe fondamental — utiliser la force de l'adversaire — en constitue la philosophie ?",a:"Jigoro Kano ; le principe de souplesse (ju) : utiliser la force de l'adversaire contre lui",detail:"Le judo (« voie de la souplesse ») devient olympique à Tokyo en 1964. Les judokas portent le judogi. Les techniques comprennent projections, immobilisations, étranglements et clés de bras. Le Japon, la France, la Géorgie et le Brésil sont parmi les nations fortes. Teddy Riner (France) est le judoka le plus titré de l'histoire."},
{theme:"sport",diff:"moyen",type:"q",q:"Quelle est la différence entre le rugby à XV et le rugby à 7 ?",a:"Le rugby à XV se joue à 15 joueurs en 2 × 40 minutes ; le rugby à 7, à 7 joueurs en 2 × 7 minutes, est olympique depuis Rio 2016",detail:"Le rugby à 7 est plus rapide et plus spectaculaire, avec des scores élevés. Les Fidji ont remporté l'or olympique à Rio 2016 et Tokyo 2021, premiers titres olympiques de leur histoire. À Paris 2024, la France, emmenée par Antoine Dupont, a été sacrée championne olympique."},
{theme:"sport",diff:"facile",type:"q",q:"Quelle discipline olympique consiste à tirer des flèches vers une cible circulaire ?",a:"Le tir à l'arc (archery)",detail:"Le tir à l'arc est l'une des plus anciennes techniques humaines. Olympique en 1900, il disparaît après 1920 et revient en 1972. La Corée du Sud domine très largement la discipline, en particulier chez les femmes, depuis les années 1980. Les épreuves olympiques se tirent à 70 mètres."},
{theme:"sport",diff:"moyen",type:"q",q:"Quelle nation détient le record de victoires en Coupe du monde de rugby, avec 4 titres (1995, 2007, 2019, 2023) ?",a:"L'Afrique du Sud",detail:"La Coupe du monde de rugby se dispute tous les 4 ans depuis 1987. Les Springboks ont remporté leur 4e titre en France en 2023. La Nouvelle-Zélande compte 3 titres (1987, 2011, 2015), l'Australie 2 (1991, 1999) et l'Angleterre 1 (2003). Le sacre de 1995, à domicile, avec Nelson Mandela remettant le trophée à François Pienaar, est resté un symbole de réconciliation."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel physiologiste soviétique développe dans les années 1960 le concept de périodisation de l'entraînement, influençant tous les sports de haut niveau ?",a:"Lev Matveïev",detail:"La périodisation planifie l'entraînement en cycles (macrocycles, mésocycles, microcycles) pour atteindre le pic de forme au bon moment. Matveïev divise la saison en phases : préparation générale, préparation spécifique, compétition, transition. Aujourd'hui, la périodisation ondulatoire (charges variées) et la périodisation par blocs sont aussi très utilisées."},
{theme:"sport",diff:"difficile",type:"q",q:"Quel rôle a joué Munich 1972 dans l'histoire des JO et de la sécurité des méga-événements ?",a:"La prise d'otages des JO de Munich (5-6 septembre 1972) par le groupe Septembre Noir — 11 athlètes israéliens assassinés — a transformé la sécurité olympique pour toujours",detail:"Le 5 septembre 1972, huit membres de Septembre noir prennent en otage des membres de la délégation israélienne. Deux sont tués au village olympique ; les neuf autres meurent lors de la tentative de libération ratée à l'aéroport de Fürstenfeldbruck, avec un policier ouest-allemand. Le CIO décide de poursuivre les Jeux après une cérémonie de deuil (« The Games must go on »). La sécurité des grands événements sportifs a été profondément repensée depuis."},
{theme:"sport",diff:"moyen",type:"q",q:"Qui est Ronaldo et comment se distingue-t-il de Messi dans l'histoire du football ?",a:"Cristiano Ronaldo (né en 1985, Portugal) — 5 Ballons d'or, 5 Ligues des champions, plus de 900 buts en carrière ; sa rivalité avec Messi est l'une des plus grandes de l'histoire du sport",detail:"Ronaldo est le meilleur buteur de l'histoire des sélections nationales. Sa puissance, son explosivité et son jeu de tête contrastent avec la technique de Messi. Ensemble, ils ont dominé le football mondial de 2008 à 2022. Après Manchester United, le Real Madrid et la Juventus, il joue en Arabie saoudite (Al-Nassr) depuis 2023."},
// CARTES ARTS FINALES (8 cartes pour atteindre 100)
{theme:"arts",diff:"facile",type:"q",q:"Quel mouvement musical des années 1960-70 est caractérisé par des guitares distordues et des concerts à grand volume ?",a:"Le hard rock (puis le heavy metal) : Led Zeppelin, Deep Purple, Black Sabbath",detail:"Le rock naît du rock and roll des années 1950 (Elvis, Chuck Berry). Les Beatles et les Rolling Stones lancent la British Invasion ; Jimi Hendrix révolutionne la guitare électrique. Led Zeppelin, Deep Purple et Black Sabbath posent les bases du hard rock et du heavy metal. Les années 1970 voient aussi naître le rock progressif (Pink Floyd, Genesis) et le punk (Sex Pistols)."},
{theme:"arts",diff:"facile",type:"q",q:"Quel peintre impressionniste français est célèbre pour ses tableaux de danseuses ?",a:"Edgar Degas (1834-1917)",detail:"Degas peint les danseuses de l'Opéra de Paris en coulisses, en répétition ou au repos — moins le spectacle que le labeur de la danse. Il utilise des cadrages audacieux, inspirés de la photographie et des estampes japonaises. Sa vue déclinante le pousse vers le pastel et la sculpture (La Petite Danseuse de quatorze ans). Il se disait d'ailleurs « réaliste » plus qu'impressionniste."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel architecte, directeur du Bauhaus de 1930 à 1933, conçoit ensuite le Seagram Building à New York ?",a:"Ludwig Mies van der Rohe",detail:"Mies van der Rohe dirige le Bauhaus à Dessau puis à Berlin, jusqu'à sa fermeture sous la pression nazie en 1933. Émigré aux États-Unis en 1938, il enseigne à Chicago (IIT) et y développe un style de verre et d'acier. Le Seagram Building (1958) en est l'aboutissement. On lui attribue la formule « less is more » ; il a aussi dessiné le pavillon et la chaise Barcelona (1929)."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui est Caravage et quelle révolution a-t-il apportée à la peinture ?",a:"Michelangelo Merisi da Caravaggio (1571-1610) — révolutionne la peinture en utilisant des modèles populaires et un clair-obscur dramatique radical",detail:"Le Caravage peint des saints sous les traits de gens du peuple, pieds sales compris. Son clair-obscur extrait les personnages d'un fond sombre par une lumière tranchante comme un projecteur. Son influence, le « caravagisme », touche Rubens, Rembrandt, Vélasquez, Georges de La Tour et toute l'Europe du XVIIe siècle. Sa vie violente — il tue un homme en 1606 et doit fuir Rome — nourrit sa légende."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel roman de Gabriel García Márquez, publié en 1967, est l'œuvre emblématique du réalisme magique latino-américain ?",a:"Cent ans de solitude",detail:"Le réalisme magique mêle la réalité quotidienne et des éléments fantastiques, sans les distinguer. Dans Cent ans de solitude, la famille Buendía vit à Macondo, où les morts reviennent, où il pleut des fleurs jaunes et où une jeune femme monte au ciel. Isabel Allende et, avant eux, Alejo Carpentier ou Juan Rulfo sont d'autres grands noms du courant, qui influence Rushdie et Murakami."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel est l'héritage du mouvement Arts and Crafts dans le design et l'architecture contemporaine ?",a:"Il pose les bases du design intégré, de l'artisanat d'art et de l'idéal de cohérence entre forme et fonction — influence directe sur l'Art nouveau, le Bauhaus et le mouvement Maker contemporain",detail:"William Morris (1834-1896) rejette la laideur industrielle et prône un retour à l'artisanat. Son influence se propage en Europe (Art nouveau, Jugendstil), aux États-Unis (Frank Lloyd Wright, Prairie School) et au Japon, où le mouvement mingei de Yanagi Sōetsu revalorise l'artisanat populaire. Le mouvement « maker » contemporain prolonge, à sa manière, cet idéal de fabrication soignée."},
{theme:"arts",diff:"difficile",type:"q",q:"Quelle est la place de la photographie dans l'histoire de l'art et comment a-t-elle transformé la peinture ?",a:"La photographie (1839) libère la peinture de son rôle de documentation du réel — l'impressionnisme, l'expressionnisme et l'abstraction en sont les conséquences directes",detail:"Avant la photographie, la peinture devait documenter les visages, les batailles, les paysages. La photo prend ce rôle, libérant la peinture vers l'expression subjective. Baudelaire voit la photographie comme une menace ; les impressionnistes l'utilisent au contraire pour s'en affranchir. La photographie devient elle-même un art (Nadar, Atget, Cartier-Bresson) et repose la question : qu'est-ce que l'art ?"},
{theme:"arts",diff:"facile",type:"q",q:"Qui est Frédéric Chopin et quel rapport entretenait-il avec la Pologne ?",a:"Compositeur et pianiste polonais (1810-1849), il quitte Varsovie en 1830, s'installe à Paris en 1831 après l'échec de l'insurrection contre la Russie, et exprime son attachement à la Pologne dans ses mazurkas et polonaises",detail:"Chopin quitte Varsovie quelques semaines avant l'insurrection de novembre 1830 ; il apprend la chute de la ville en 1831, lors de son voyage vers Paris. Il ne retournera jamais en Pologne. Ses mazurkas et polonaises, danses nationales, sont des hommages à sa patrie. Selon sa volonté, son cœur est rapatrié à Varsovie (église Sainte-Croix) ; son corps repose au cimetière du Père-Lachaise."},
{theme:"arts",diff:"facile",type:"q",q:"Qui est l'architecte de l'opéra de Sydney ?",a:"Jørn Utzon (Danemark) — inauguré en 1973, classé au patrimoine UNESCO en 2007",detail:"Avec ses « voiles » blanches, l'Opéra de Sydney est l'un des bâtiments les plus reconnaissables du monde. Utzon remporte le concours international en 1957. Le chantier, chaotique et controversé, le pousse à démissionner en 1966. Il ne reviendra jamais voir l'œuvre achevée. Il reçoit le prix Pritzker en 2003."},
{theme:"arts",diff:"facile",type:"q",q:"Quel artiste de rue (street art) est le plus célèbre au monde et reste anonyme ?",a:"Banksy — artiste britannique anonyme dont les œuvres satiriques apparaissent dans les villes du monde entier",detail:"Banksy réalise des pochoirs sur les murs des villes (Bristol, Londres, New York, Bethléem, Gaza) pour dénoncer la guerre, le consumérisme et l'hypocrisie sociale. En 2018, sa Girl with Balloon s'est autodétruite en partie juste après son adjudication chez Sotheby's ; rebaptisée Love is in the Bin, elle a été revendue plus de 18 millions de livres en 2021. Son identité n'a jamais été officiellement confirmée, malgré plusieurs enquêtes journalistiques."},
{theme:"arts",diff:"facile",type:"q",q:"Quel mouvement musical des années 1970 a été fondé par des groupes comme les Ramones et les Sex Pistols ?",a:"Le punk rock",detail:"Le punk naît presque simultanément à New York (Ramones, club CBGB, 1974) et à Londres (Sex Pistols, The Clash, 1976). Réaction au rock progressif sophistiqué, il valorise la spontanéité, la brièveté et la colère. Les Sex Pistols ne durent que de 1975 à 1978 mais marquent durablement la musique. Le punk ouvre la voie au post-punk, à la new wave et au rock indépendant."},
{theme:"arts",diff:"facile",type:"q",q:"Quel peintre néerlandais est l'auteur de La Jeune Fille à la perle (vers 1665) ?",a:"Johannes Vermeer",detail:"Surnommé le « sphinx de Delft », Vermeer n'a laissé qu'environ 35 œuvres. La Jeune Fille à la perle, parfois appelée la « Joconde du Nord », est une « tronie » (figure de fantaisie) plutôt qu'un portrait. Elle est conservée au Mauritshuis de La Haye. Le roman de Tracy Chevalier (1999) et son adaptation au cinéma (2003) ont contribué à sa célébrité."},
{theme:"arts",diff:"facile",type:"q",q:"Quelle série de portraits sérigraphiés Andy Warhol réalise-t-il en 1962, devenant l'icône du Pop Art ?",a:"Les Marilyn, réalisées après la mort de Marilyn Monroe en août 1962",detail:"Warhol part d'une photo publicitaire du film Niagara (1953) et la reproduit en série par sérigraphie, avec des variations de couleur (Gold Marilyn Monroe, Marilyn Diptych). La sérigraphie, impression au pochoir à travers un écran de soie, lui permet de questionner la notion d'original. Shot Sage Blue Marilyn (1964) a été adjugée 195 millions de dollars en 2022."},
{theme:"arts",diff:"facile",type:"q",q:"Qui est Léonard de Vinci et comment illustre-t-il l'idéal de l'« homme universel » ?",a:"Léonard de Vinci (1452-1519) — peintre, sculpteur, architecte, ingénieur, anatomiste, musicien — archétype de l'homo universalis de la Renaissance",detail:"L'Homme de Vitruve (vers 1490), un homme inscrit dans un cercle et un carré, symbolise l'harmonie entre l'homme et le cosmos. Léonard remplit des milliers de pages de carnets : machines volantes, études anatomiques (il dit avoir disséqué une trentaine de corps), observations géologiques et hydrauliques. Il incarne l'idéal de l'uomo universale de la Renaissance."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel bâtiment de Philip Johnson à New York, avec son fronton brisé inspiré de Chippendale, symbolise le tournant postmoderne en architecture ?",a:"L'AT&T Building (aujourd'hui 550 Madison Avenue), achevé en 1984",detail:"Le postmodernisme architectural (années 1970-1990) rejette l'austérité du style international et réintroduit ornements, citations historiques et ironie. Robert Venturi répond au « less is more » de Mies van der Rohe par « less is a bore ». Michael Graves (Portland Building, 1982) et Ricardo Bofill en sont d'autres figures. Le Centre Pompidou (high-tech) ou le Guggenheim de Bilbao (déconstructivisme) relèvent d'autres courants."},
{theme:"arts",diff:"moyen",type:"q",q:"Devant quel roi Mozart, enfant prodige, joue-t-il à Versailles lors de sa grande tournée européenne de 1763-1766 ?",a:"Louis XV",detail:"Leopold Mozart parcourt l'Europe avec ses deux enfants prodiges, Wolfgang et sa sœur Nannerl. Au tournant de 1764, Wolfgang, âgé de 7 ans, joue devant la cour de Louis XV. Adulte, Mozart rompt en 1781 avec l'archevêque de Salzbourg pour vivre de son art à Vienne, l'un des premiers compositeurs à tenter l'indépendance. Il meurt endetté en 1791, à 35 ans."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel film de Fritz Lang (1927), œuvre majeure du cinéma expressionniste allemand, influence encore la science-fiction contemporaine ?",a:"Metropolis",detail:"Le Cabinet du docteur Caligari (Wiene, 1920), Nosferatu (Murnau, 1922) et Metropolis (Lang, 1927) définissent le cinéma expressionniste : décors déformés, angles obliques, ombres portées, thèmes sombres. Metropolis, avec sa ville futuriste et sa femme-robot, inspire encore la science-fiction (Blade Runner). Après 1933, de nombreux cinéastes allemands émigrent à Hollywood, où ce style nourrit le film noir."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui a inventé la photographie couleur et quand ?",a:"James Clerk Maxwell réalise la première photographie en couleurs par synthèse trichrome en 1861 ; l'Autochrome des frères Lumière (commercialisé en 1907) rend la couleur accessible",detail:"Maxwell, avec le photographe Thomas Sutton, projette en 1861 trois clichés pris à travers des filtres rouge, vert et bleu — le principe additif encore utilisé aujourd'hui. Louis Ducos du Hauron obtient les premiers tirages couleur durables à la fin des années 1860. L'Autochrome utilise des grains de fécule de pomme de terre colorés. Kodachrome (1935) et Kodacolor (1942) popularisent la couleur sur film."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel gratte-ciel new-yorkais, achevé en 1930, est l'exemple le plus célèbre de l'architecture Art déco ?",a:"Le Chrysler Building",detail:"L'Art déco, courant des années 1920-1930, tire son nom de l'Exposition internationale des arts décoratifs de Paris (1925). Il marie des formes géométriques modernes et des matériaux luxueux (acier chromé, laque, ivoire). Le Chrysler Building (1930), avec sa flèche en acier inoxydable, l'Empire State Building (1931) et les hôtels de South Beach à Miami en sont des exemples célèbres."},
{theme:"arts",diff:"moyen",type:"q",q:"Qui est Johann Sebastian Bach et pourquoi est-il considéré comme le plus grand compositeur de tous les temps par beaucoup ?",a:"Bach (1685-1750) synthétise toute la musique baroque et pose les bases de l'harmonie moderne — ses œuvres couvrent tous les genres et tous les registres",detail:"Bach compose pour l'orgue (Toccata et fugue en ré mineur, dont l'attribution est discutée), le clavecin (Variations Goldberg), l'orchestre (Concertos brandebourgeois), plus de 200 cantates conservées et des Passions (selon saint Matthieu, selon saint Jean). Ses œuvres contrapuntiques (L'Art de la fugue, L'Offrande musicale) sont d'une rigueur quasi mathématique. Moins joué après sa mort, il est remis à l'honneur par Mendelssohn, qui dirige la Passion selon saint Matthieu en 1829."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel compositeur français est le chef de file de l'impressionnisme musical, avec des œuvres comme La Mer et Prélude à l'après-midi d'un faune ?",a:"Claude Debussy",detail:"L'impressionnisme musical, à la charnière des XIXe et XXe siècles, cherche à évoquer des atmosphères plutôt qu'à raconter. Debussy (La Mer, Prélude à l'après-midi d'un faune, Pelléas et Mélisande) et Ravel (Daphnis et Chloé, La Valse) explorent les couleurs orchestrales, les gammes pentatoniques et les modes anciens. Le terme vient de la critique ; Debussy le récusait. Leur influence sur le jazz (Bill Evans, Miles Davis) et la musique de film est considérable."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel philosophe britannique publie en 1757 un essai fondateur sur le sublime et le beau, influençant toute la peinture romantique ?",a:"Edmund Burke (Recherche philosophique sur l'origine de nos idées du sublime et du beau)",detail:"Burke distingue le beau (ordre, harmonie) du sublime (immensité, terreur, infini) ; Kant reprend la notion en 1790. Caspar David Friedrich (Le Voyageur contemplant une mer de nuages, vers 1818) montre l'homme face à une nature écrasante, Turner (Pluie, vapeur et vitesse, 1844) préfigure l'abstraction. En Amérique, l'Hudson River School transpose le sublime dans les paysages sauvages."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel philosophe florentin du XVe siècle traduit Platon en latin et diffuse le néoplatonisme sous le mécénat des Médicis ?",a:"Marsile Ficin",detail:"Côme de Médicis confie à Ficin la traduction de Platon et met à sa disposition une villa à Careggi, où se réunit l'« Académie platonicienne ». Selon le néoplatonisme, le monde sensible n'est qu'un reflet imparfait des Idées, et la beauté peut élever l'âme vers le divin. Botticelli peint Vénus comme figure de l'amour divin ; Michel-Ange voit la sculpture comme la libération de la forme idéale prisonnière du marbre."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel programme iconographique décore les cathédrales gothiques pour instruire les fidèles, formant une 'Bible des illettrés' ?",a:"Les sculptures des portails et les vitraux, qui racontent l'histoire sainte et la vie des saints",detail:"Au Moyen Âge, la plupart des fidèles ne savent pas lire : les images leur enseignent la Bible. Les portails sculptés (Jugement dernier, vie du Christ) et les verrières, comme celles de Chartres, forment de véritables récits. L'abbé Suger, à Saint-Denis (années 1140), développe une théologie de la lumière : la clarté colorée des vitraux doit élever l'âme vers Dieu."},
{theme:"arts",diff:"difficile",type:"q",q:"Quel est le rôle de la Collection Frick à New York ou du Mauritshuis à La Haye dans la transmission du patrimoine artistique ?",a:"Ces musées de taille réduite à collections ciblées (art flamand, néerlandais, ancien) offrent une expérience muséale intime impossible dans les grands musées encyclopédiques",detail:"Le Mauritshuis (La Haye) présente La Jeune Fille à la perle de Vermeer et La Leçon d'anatomie du docteur Tulp de Rembrandt dans un cadre intime. La Frick Collection (New York), rouverte en 2025 après rénovation, montre Rembrandt, Vermeer et Holbein dans l'hôtel particulier d'Henry Clay Frick. Ces collections de « connaisseurs » offrent une autre relation aux œuvres que les musées encyclopédiques (Louvre, British Museum)."},
{theme:"arts",diff:"difficile",type:"q",q:"Qui publie en 1994 Le Canon occidental, défendant une liste d'œuvres fondamentales et déclenchant une vive controverse culturelle ?",a:"Harold Bloom",detail:"Dans Le Canon occidental, Bloom défend un corpus de grandes œuvres (Shakespeare, Dante, Cervantès, Goethe, Proust…) contre ce qu'il appelle « l'école du ressentiment ». Ses détracteurs, issus des études culturelles, postcoloniales et féministes, dénoncent l'exclusion des femmes et des auteurs non occidentaux. Le livre s'inscrit dans les « guerres culturelles » des universités américaines des années 1990."},
{theme:"arts",diff:"facile",type:"q",q:"Quel compositeur polonais est surnommé « le poète du piano » ?",a:"Frédéric Chopin (1810-1849)",detail:"Chopin compose presque exclusivement pour le piano : préludes, nocturnes, mazurkas, valses, études, ballades. Sa musique allie une technique pianistique novatrice et une profondeur émotionnelle liée à son exil parisien. Sa liaison avec George Sand et sa mort à 39 ans, probablement de la tuberculose, nourrissent son aura romantique."},
{theme:"arts",diff:"facile",type:"q",q:"Quel artiste pop et rock britannique est surnommé le 'Thin White Duke' et 'Ziggy Stardust' ?",a:"David Bowie (1947-2016)",detail:"David Bowie invente des alter ego musicaux : Ziggy Stardust (1972, glam rock), Aladdin Sane, le Thin White Duke. Ses albums Station to Station, Heroes, Let's Dance définissent chacun une époque. Son œuvre explore l'identité, le genre et la transformation. Il meurt deux jours après la sortie de son dernier album Blackstar (8 janvier 2016)."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel peintre flamand du XVe siècle, auteur du Retable de l'Agneau mystique, perfectionne la technique de la peinture à l'huile ?",a:"Jan van Eyck",detail:"Van Eyck perfectionne la peinture à l'huile, qui permet glacis et détails infimes, et achève avec son frère Hubert le Retable de l'Agneau mystique (1432, cathédrale Saint-Bavon de Gand). Les Primitifs flamands — Van Eyck, Rogier van der Weyden, Hans Memling — représentent saints et donateurs avec un réalisme saisissant. Leur technique influence profondément la peinture italienne de la Renaissance."},
{theme:"arts",diff:"moyen",type:"q",q:"Quel est l'apport de l'opéra de chambre contemporain au renouvellement du genre lyrique ?",a:"Des compositeurs comme Benjamin Britten (Le Tour d'écrou, 1954) ou John Adams (Nixon in China, 1987) ont réinventé l'opéra pour des effectifs réduits ou des sujets contemporains",detail:"Britten compose des opéras de chambre pour petits effectifs, moins coûteux à monter, sur des sujets psychologiquement complexes (Le Viol de Lucrèce, 1946 ; Le Tour d'écrou, 1954). John Adams porte à la scène l'histoire récente (Nixon in China, 1987 ; The Death of Klinghoffer, 1991). Ces démarches renouvellent un genre que beaucoup croyaient figé."},
{theme:"arts",diff:"moyen",type:"q",q:"Quelle contrainte religieuse majeure oriente l'art islamique vers l'arabesque et la calligraphie plutôt que vers la représentation humaine ?",a:"L'aniconisme : le refus de représenter des êtres vivants dans les lieux de culte, fondé sur la tradition (hadiths) plus que sur le Coran",detail:"L'art islamique développe des motifs géométriques et végétaux d'une grande complexité (arabesques), fait de la calligraphie un art majeur et invente une architecture propre (minaret, coupole, mihrab). Hors des lieux sacrés, la figuration existe : miniatures persanes et mogholes, céramiques. Le Coran ne l'interdit pas expressément ; la tradition théologique majoritaire la décourage."},
{theme:"arts",diff:"difficile",type:"q",q:"Qui fonde le mouvement Fluxus dans les années 1960, et quelle artiste d'origine japonaise en est la figure la plus connue du grand public ?",a:"George Maciunas ; Yoko Ono",detail:"Fluxus, réseau international né vers 1962, rassemble notamment George Brecht, Yoko Ono, Nam June Paik et Joseph Beuys, sous l'influence de John Cage. Ses artistes organisent des concerts-performances et écrivent des « event scores » (instructions pour des actions). Dans Cut Piece (1964), Yoko Ono invite le public à découper ses vêtements. Nam June Paik est un pionnier de l'art vidéo."},
{theme:"arts",diff:"facile",type:"q",q:"Quel film de Stanley Kubrick (1971), adapté d'un roman d'Anthony Burgess, se déroule dans une Angleterre future ultra-violente ?",a:"Orange mécanique (A Clockwork Orange)",detail:"Le film suit Alex, jeune délinquant que le gouvernement tente de « guérir » par un conditionnement psychologique. Kubrick a aussi réalisé 2001 : l'Odyssée de l'espace (1968, écrit avec Arthur C. Clarke), Shining (1980, d'après Stephen King) et Full Metal Jacket (1987). Son perfectionnisme est légendaire : une scène de Shining avec Shelley Duvall aurait nécessité 127 prises."},
{theme:"arts",diff:"facile",type:"q",q:"Quel compositeur russe est l'auteur du Lac des cygnes, de La Belle au bois dormant et de Casse-Noisette ?",a:"Piotr Ilitch Tchaïkovski (1840-1893)",detail:"Tchaïkovski est le plus populaire des compositeurs russes. Ses 3 ballets (Lac des cygnes, 1877 ; Belle au bois dormant, 1890 ; Casse-Noisette, 1892) dominent le répertoire classique de ballet mondial. Ses symphonies (n°6 Pathétique) et concertos pour piano (n°1) sont aussi au cœur du répertoire. Il meurt 9 jours après la première de la Pathétique — dans des circonstances mystérieuses."},
{theme:"politique",diff:"facile",type:"q",q:"Combien d'États membres compte l'Union Européenne depuis le Brexit ?",a:"27 États membres",detail:"Le Royaume-Uni a quitté l'UE le 31 janvier 2020 après le référendum de 2016 (51,9 % pour le Leave). L'UE représente 450 millions d'habitants et le 3e PIB mondial."},
{theme:"politique",diff:"facile",type:"d",q:"Organisation internationale fondée en 1945 pour maintenir la paix mondiale",a:"L'ONU (Organisation des Nations Unies)",detail:"Créée à San Francisco le 26 juin 1945, elle compte 193 membres. Ses organes principaux incluent l'Assemblée générale et le Conseil de sécurité. Siège à New York."},
{theme:"politique",diff:"moyen",type:"q",q:"Quelle est la procédure de destitution du président américain par le Congrès ?",a:"L'impeachment",detail:"La Chambre des représentants vote la mise en accusation à la majorité simple ; le Sénat juge et ne peut destituer qu'à la majorité des deux tiers. Donald Trump est le seul président mis en accusation deux fois (2019, 2021), acquitté les deux fois. Andrew Johnson (1868) et Bill Clinton (1998) l'ont aussi été ; Nixon a démissionné avant (1974)."},
{theme:"politique",diff:"moyen",type:"d",q:"Doctrine américaine de 1823 s'opposant à toute intervention européenne en Amérique",a:"La doctrine Monroe",detail:"Toute ingérence européenne dans les Amériques est considérée comme un acte hostile. Elle justifiera l'interventionnisme américain en Amérique latine pendant plus d'un siècle."},
{theme:"politique",diff:"difficile",type:"q",q:"Quelle est la règle de la « double majorité » pour voter au Conseil de l'UE ?",a:"55 % des États membres (au moins 15) représentant au moins 65 % de la population de l'UE",detail:"Prévue par le traité de Lisbonne (entré en vigueur en 2009) et appliquée depuis 2014, cette « majorité qualifiée » concilie l'égalité des États (majorité numérique) et la légitimité démographique. Une minorité de blocage doit réunir au moins 4 États."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel philosophe théorisa la séparation des pouvoirs, inspirant la Constitution de 1958 ?",a:"Montesquieu (De l'Esprit des lois, 1748)",detail:"Montesquieu distingue pouvoirs législatif, exécutif et judiciaire. Ce principe fonde aussi la Constitution américaine de 1787 — l'une des plus anciennes encore en vigueur."},
// NOUVELLES CARTES POLITIQUE (94 cartes pour atteindre 100)
{theme:"politique",diff:"facile",type:"q",q:"Quel est le rôle du Conseil de sécurité de l'ONU et qui en sont les membres permanents ?",a:"Maintenir la paix internationale — 5 membres permanents avec droit de veto : États-Unis, Russie, Chine, France, Royaume-Uni",detail:"Le Conseil de sécurité peut décider de sanctions, d'embargos ou d'interventions militaires. Le droit de veto des P5 signifie qu'un seul membre permanent peut bloquer toute résolution. Depuis la guerre froide, ce mécanisme paralyse souvent le Conseil. Des réformes pour élargir la représentation (Inde, Brésil, Allemagne, Japon) sont régulièrement discutées sans aboutir."},
{theme:"politique",diff:"facile",type:"q",q:"Quelle est la différence entre un régime présidentiel et un régime parlementaire ?",a:"Présidentiel : le chef de l'État (élu directement) dirige le gouvernement et ne dépend pas du parlement (ex. États-Unis) — Parlementaire : le gouvernement émane du parlement et lui est responsable (ex. Royaume-Uni)",detail:"Dans un régime présidentiel, la séparation des pouvoirs est rigide : le président ne peut dissoudre le Congrès, le Congrès ne peut renverser le président (sauf impeachment). En régime parlementaire, le Premier ministre peut être renversé par un vote de défiance. La France est un régime semi-présidentiel : le président élu au suffrage universel coexiste avec un gouvernement responsable devant l'Assemblée."},
{theme:"politique",diff:"facile",type:"q",q:"Quels cinq États membres permanents du Conseil de sécurité de l'ONU détiennent le droit de veto ?",a:"Les États-Unis, la Russie, la Chine, la France et le Royaume-Uni",detail:"Le droit de veto, prévu à l'article 27 de la Charte, permet à un seul membre permanent de bloquer une résolution, même approuvée par tous les autres. Il a été utilisé plus de 300 fois depuis 1945, surtout par l'URSS/Russie, puis les États-Unis (souvent pour protéger Israël). Ce mécanisme reflète l'équilibre des puissances de 1945."},
{theme:"politique",diff:"facile",type:"q",q:"Quel mécanisme de démocratie directe permet aux citoyens suisses de proposer une modification de la Constitution fédérale ?",a:"L'initiative populaire (100 000 signatures en 18 mois)",detail:"La Suisse pratique une démocratie semi-directe : outre l'initiative populaire, le référendum facultatif permet, avec 50 000 signatures, de soumettre au vote une loi adoptée par le Parlement. Les citoyens votent ainsi plusieurs fois par an. La démocratie directe athénienne (Ve s. av. J.-C.) n'était praticable que dans une petite cité ; la démocratie représentative domine depuis les révolutions américaine et française."},
{theme:"politique",diff:"facile",type:"q",q:"En quelle année l'OTAN est-elle fondée, et quelle menace motive sa création ?",a:"En 1949 ; la menace soviétique, rendue tangible par le blocus de Berlin (1948-1949)",detail:"L'Organisation du traité de l'Atlantique Nord réunit les États-Unis, le Canada et des démocraties d'Europe occidentale. Son article 5 stipule qu'une attaque contre un membre est une attaque contre tous ; il n'a été invoqué qu'une fois, après le 11 septembre 2001. Après 1989, l'Alliance s'élargit vers l'Est. L'invasion russe de l'Ukraine pousse la Finlande (2023) et la Suède (2024) à la rejoindre : elle compte 32 membres."},
{theme:"politique",diff:"facile",type:"q",q:"Quel est le rôle du Parlement européen et comment ses membres sont-ils élus ?",a:"Seule institution de l'UE élue au suffrage universel direct — vote les lois européennes avec le Conseil de l'UE, contrôle la Commission",detail:"Les 720 eurodéputés sont élus pour 5 ans dans chaque État membre, à la proportionnelle. Le Parlement siège à Strasbourg (sessions plénières) et à Bruxelles (commissions). Ses pouvoirs ont grandi avec les traités (Maastricht, Lisbonne). Il élit le président de la Commission et peut la renverser par une motion de censure, ce qu'il n'a jamais fait ; la Commission Santer a démissionné en 1999 avant un tel vote."},
{theme:"politique",diff:"facile",type:"q",q:"Qu'est-ce qu'un État fédéral et comment diffère-t-il d'un État unitaire ?",a:"État fédéral : deux niveaux de gouvernement souverain (fédéral + fédérés) — État unitaire : le pouvoir central délègue des compétences aux collectivités locales sans les leur céder",detail:"États-Unis, Allemagne, Suisse, Australie sont fédéraux. France, Japon, Suède sont unitaires. L'Espagne est un quasi-fédéralisme (communautés autonomes). Le fédéralisme préserve les identités régionales mais peut créer des tensions (Catalogne, Québec, Écosse). La Constitution américaine (1787) est le premier grand modèle fédéral moderne."},
{theme:"politique",diff:"facile",type:"q",q:"En quelle année les femmes françaises ont-elles obtenu le droit de vote ?",a:"En 1944 (ordonnance du 21 avril) ; elles votent pour la première fois en 1945",detail:"La IIe République instaure le suffrage universel masculin en 1848. Les Françaises obtiennent le droit de vote par une ordonnance du Gouvernement provisoire de la République française et l'exercent pour la première fois aux municipales d'avril 1945. La Nouvelle-Zélande avait été pionnière (1893) ; la Suisse ne l'accorde au niveau fédéral qu'en 1971."},
{theme:"politique",diff:"facile",type:"q",q:"Quelle institution française est chargée de vérifier la conformité des lois à la Constitution ?",a:"Le Conseil constitutionnel",detail:"Créé par la Constitution de 1958, il compte 9 membres nommés pour 9 ans, plus les anciens présidents de la République. Depuis 2010, tout justiciable peut contester une loi déjà en vigueur grâce à la question prioritaire de constitutionnalité (QPC). Aux États-Unis, la Cour suprême exerce ce contrôle depuis l'arrêt Marbury v. Madison (1803)."},
{theme:"politique",diff:"facile",type:"q",q:"Quelle est la différence entre la gauche et la droite en politique ?",a:"Distinction née de la Révolution française (1789) : les partisans du changement siègent à gauche de l'Assemblée, les défenseurs de l'ordre établi à droite",detail:"Historiquement : gauche = égalité, réforme, État redistributeur, laïcité ; droite = ordre, tradition, liberté économique, rôle de la religion. Ces distinctions se brouillent au XXIe s. : le clivage autoritarisme/libéralisme culturel, ou mondialisation/souverainisme, croise l'axe gauche-droite. Le terme reste utile comme boussole mais insuffisant pour cartographier la complexité politique contemporaine."},
{theme:"politique",diff:"facile",type:"q",q:"Quel politologue néerlandais définit en 2004 le populisme comme une « idéologie mince » opposant « le peuple pur » à « l'élite corrompue » ?",a:"Cas Mudde",detail:"Pour Mudde, le populisme est une idéologie « mince », qui se greffe sur d'autres : il peut être de gauche (Chávez, Podemos) ou de droite (Trump, Le Pen, Orbán). Il n'est pas forcément antidémocratique, mais peut le devenir en s'en prenant aux contre-pouvoirs. Il exprime souvent une crise de représentation. La frontière avec la démagogie ou la critique légitime des élites est débattue."},
{theme:"politique",diff:"moyen",type:"q",q:"Dans quel ouvrage de 1762 Rousseau développe-t-il sa théorie du contrat social ?",a:"Du contrat social (1762)",detail:"Rousseau distingue la volonté de tous (somme des intérêts particuliers) de la volonté générale (intérêt commun). Par le contrat, chacun renonce à sa liberté naturelle pour obtenir la liberté civile ; la souveraineté appartient au peuple et est inaliénable. Hobbes (contrat pour sortir de la guerre de tous contre tous) et Locke (contrat pour protéger les droits naturels) en proposent d'autres versions."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel philosophe du XVIIe siècle est considéré comme le père du libéralisme politique avec ses Deux Traités du gouvernement civil ?",a:"John Locke (Deux Traités du gouvernement civil, 1690)",detail:"Locke défend les droits naturels (vie, liberté, propriété), le consentement des gouvernés, la tolérance religieuse et le droit de résistance à un pouvoir tyrannique. Le libéralisme économique (Smith, puis Hayek, Friedman) se développe aux XVIIIe-XXe siècles. Au XXe siècle, un libéralisme social (Rawls) cherche à concilier liberté individuelle et justice sociale."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année Karl Marx publie-t-il Le Capital, et dans quelle ville vivait-il alors en exil ?",a:"En 1867 (livre I) ; il vit alors en exil à Londres",detail:"Marx (1818-1883) analyse le capitalisme comme l'exploitation du prolétariat par les détenteurs des moyens de production, à travers l'extraction de la plus-value. Il prévoit que la lutte des classes conduira à une révolution et à une société sans classes. Le Manifeste du Parti communiste (avec Engels, 1848) appelait déjà à l'action révolutionnaire. Les révolutions russe (1917) et chinoise (1949) se réclameront du marxisme."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel rapport britannique de 1942 pose les bases de l'État-providence moderne en Europe ?",a:"Le rapport Beveridge",detail:"William Beveridge propose une couverture universelle contre les grands risques (maladie, chômage, vieillesse, pauvreté), financée par l'impôt et les cotisations. Le Royaume-Uni crée le National Health Service en 1948 ; la France fonde la Sécurité sociale en 1945. Les pays nordiques développent les États-providence les plus généreux. Leur financement (déficits, vieillissement) est un débat central depuis les années 1980."},
{theme:"politique",diff:"moyen",type:"q",q:"Quelle distinction Ernest Renan établit-il en 1882 entre la conception française et allemande de la nation ?",a:"Pour Renan, la nation repose sur la volonté de vivre ensemble (« un plébiscite de tous les jours »), et non, comme dans la conception allemande, sur la langue ou la race",detail:"Renan prononce sa conférence « Qu'est-ce qu'une nation ? » à la Sorbonne en 1882, dans le contexte de l'annexion de l'Alsace-Moselle par l'Allemagne. À la conception « élective » ou civique, il oppose la conception ethnique et culturelle héritée de Herder et Fichte. Au XIXe siècle, le nationalisme porte les unifications italienne et allemande ; au XXe, il alimente guerres et génocides."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année la guerre froide prend-elle officiellement fin, et quel événement en est le symbole le plus marquant ?",a:"En 1991, avec la dissolution de l'URSS ; la chute du mur de Berlin (9 novembre 1989) en est le symbole le plus marquant",detail:"La guerre froide (1947-1991) oppose les États-Unis et l'URSS sans affrontement direct, par guerres par procuration, course aux armements et rivalité idéologique. Elle commence avec la doctrine Truman et le plan Marshall (1947) et se structure autour de l'OTAN (1949) et du pacte de Varsovie (1955). Crises majeures : Berlin (1948-1949, 1961), Corée (1950-1953), Cuba (1962), Vietnam. L'URSS est dissoute le 26 décembre 1991."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année la quasi-totalité des colonies africaines accèdent-elles à l'indépendance, faisant de cette année l'« année de l'Afrique » ?",a:"1960",detail:"En 1960, 17 pays africains accèdent à l'indépendance, dont 14 anciennes colonies françaises (Sénégal, Côte d'Ivoire, Madagascar…), le Nigeria et le Congo belge. La décolonisation, accélérée par la Seconde Guerre mondiale et la Charte de l'ONU, avait touché l'Asie dès 1945-1955 (Inde et Pakistan en 1947). La France mène deux guerres coloniales majeures : Indochine (1946-1954) et Algérie (1954-1962)."},
{theme:"politique",diff:"moyen",type:"q",q:"Dans quelle ville siège la Cour européenne des droits de l'homme, créée par le Conseil de l'Europe ?",a:"Strasbourg",detail:"Le Conseil de l'Europe (1949, 46 membres, siège à Strasbourg) veille au respect des droits humains, notamment par la Convention européenne des droits de l'homme (1950) et la Cour qui l'applique. Il comprend des pays non membres de l'UE (Turquie, Ukraine, Royaume-Uni…). La Russie en a été exclue en 2022. Il ne faut le confondre ni avec le Conseil de l'UE (ministres des États membres) ni avec le Conseil européen (chefs d'État ou de gouvernement)."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel tribunal international, basé à La Haye, tranche les différends entre États membres de l'ONU ?",a:"La Cour internationale de justice (CIJ)",detail:"Organe judiciaire principal de l'ONU, la CIJ tranche les différends entre États qui acceptent sa compétence, mais ne peut pas les contraindre à exécuter ses arrêts. Elle ne doit pas être confondue avec la Cour pénale internationale (CPI, 2002), également à La Haye, qui juge des individus pour génocide, crimes contre l'humanité et crimes de guerre. Le droit international repose sur les traités, la coutume et les principes généraux."},
{theme:"politique",diff:"moyen",type:"q",q:"Qui a théorisé le concept de soft power, et dans quel ouvrage de 1990 ?",a:"Joseph Nye, dans Bound to Lead (1990)",detail:"Le soft power est la capacité d'influencer par l'attraction (culture, valeurs, diplomatie) plutôt que par la contrainte militaire ou économique (hard power). Celui des États-Unis s'appuie sur Hollywood, les universités, la langue anglaise. La Chine développe le sien via les Instituts Confucius ; la France mise sur la francophonie, la culture et la gastronomie."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année de Gaulle instaure-t-il la Ve République, et à quelle occasion ?",a:"En 1958, à la faveur de la crise de mai 1958 liée à la guerre d'Algérie",detail:"Rappelé au pouvoir après le soulèvement d'Alger du 13 mai 1958, de Gaulle fait adopter par référendum, en septembre, une Constitution qui met fin à l'instabilité de la IVe République (une vingtaine de gouvernements en 12 ans). Le président nomme le Premier ministre, peut dissoudre l'Assemblée et recourir à l'article 16 (pouvoirs exceptionnels). L'article 49-3 permet d'adopter un texte sans vote, sauf motion de censure. L'élection du président au suffrage universel direct date de 1962."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel géographe britannique théorise en 1904 le concept de Heartland, pierre angulaire de la géopolitique classique ?",a:"Halford Mackinder",detail:"Selon Mackinder, celui qui contrôle le cœur de l'Eurasie (Heartland) domine le monde. L'Américain Alfred Mahan insiste au contraire sur la puissance maritime. Karl Haushofer développe une Geopolitik allemande récupérée par les nazis. Zbigniew Brzezinski (Le Grand Échiquier, 1997) analyse la prépondérance américaine en Eurasie. La géopolitique connaît un regain depuis les années 2000."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel attentat du 11 septembre 2001 a tué le plus de victimes, et combien en a-t-il fait ?",a:"L'attaque contre le World Trade Center à New York : environ 2 750 morts, sur près de 3 000 victimes pour l'ensemble des attentats",detail:"Le 11 septembre 2001, 19 terroristes d'Al-Qaïda détournent quatre avions : deux frappent les tours jumelles, un le Pentagone, le quatrième s'écrase en Pennsylvanie. Les États-Unis lancent la « guerre contre le terrorisme » (Afghanistan 2001, Irak 2003). Le Conseil de sécurité adopte la résolution 1373 imposant des mesures antiterroristes à tous les États. Il n'existe toujours pas de définition universelle du terrorisme en droit international."},
{theme:"politique",diff:"moyen",type:"q",q:"Combien d'années Nelson Mandela a-t-il passé en prison avant d'être libéré en 1990 ?",a:"27 ans",detail:"Mandela est libéré le 11 février 1990. L'apartheid (« séparation » en afrikaans), instauré par le Parti national en 1948, classait la population en Blancs, métis (Coloureds), Indiens et Noirs, avec des droits différents. L'ANC mène la résistance. Sanctions internationales et pression intérieure poussent Frederik de Klerk à négocier. Les premières élections multiraciales, le 27 avril 1994, portent Mandela à la présidence."},
{theme:"politique",diff:"moyen",type:"q",q:"Quel dirigeant religieux prend le pouvoir en Iran après la révolution de 1979 et instaure la République islamique ?",a:"L'ayatollah Rouhollah Khomeini",detail:"Le chah Mohammad Reza Pahlavi modernise l'Iran mais réprime ses opposants par la SAVAK. La révolution de 1979 réunit islamistes, nationalistes et gauche. Khomeini instaure un régime théocratique fondé sur le velayat-e faqih (gouvernement du juriste-théologien). La prise d'otages de l'ambassade américaine (1979-1981) rompt les relations avec Washington. Ali Khamenei lui succède comme Guide suprême en 1989."},
{theme:"politique",diff:"moyen",type:"q",q:"En quelle année l'Union africaine est-elle fondée, et en remplacement de quelle organisation ?",a:"En 2002, en remplacement de l'Organisation de l'unité africaine (OUA, 1963)",detail:"L'Union africaine (55 États, siège à Addis-Abeba) s'inspire de l'UE. Elle mène des missions de paix (Somalie) et suspend les membres après un coup d'État (Mali, Burkina Faso, Niger, Guinée, Gabon, Soudan). Elle porte la Zone de libre-échange continentale africaine (ZLECAf, opérationnelle depuis 2021) et l'Agenda 2063. Elle est membre du G20 depuis 2023. Ses faiblesses : ressources propres limitées et divisions entre États."},
{theme:"politique",diff:"difficile",type:"q",q:"Qui est Hans Morgenthau et quel ouvrage de 1948 fonde-t-il le réalisme politique en relations internationales ?",a:"Un politologue germano-américain, fondateur du réalisme classique en relations internationales, avec Politics Among Nations (1948)",detail:"Pour les réalistes (Thucydide, Machiavel, Morgenthau, puis Waltz), les États cherchent la puissance dans un système international anarchique, sans autorité supérieure ; l'équilibre des puissances prévient les guerres hégémoniques. Les libéraux (Kant, Wilson, Keohane) jugent la coopération possible grâce aux institutions, au commerce et à la démocratie. Le constructivisme (Wendt) insiste sur le rôle des identités et des normes."},
{theme:"politique",diff:"difficile",type:"q",q:"Dans quel pays le Printemps arabe commence-t-il fin 2010, et quel événement déclencheur — l'immolation d'un vendeur de rue — l'embrase ?",a:"En Tunisie ; l'immolation de Mohamed Bouazizi, le 17 décembre 2010",detail:"Ben Ali fuit en janvier 2011. En Égypte, Moubarak tombe, mais l'armée reprend le pouvoir (Sissi, 2013). La Libye et le Yémen sombrent dans la guerre civile. En Syrie, la répression de Bachar al-Assad déclenche une guerre d'environ 500 000 morts ; il est renversé en décembre 2024. La Tunisie, longtemps seul succès démocratique, connaît un tournant autoritaire sous Kaïs Saïed depuis 2021."},
{theme:"politique",diff:"difficile",type:"q",q:"Quelle institution fondée en 1919 est le premier exemple de diplomatie multilatérale permanente, précédant l'ONU ?",a:"La Société des Nations (SDN)",detail:"Créée par le traité de Versailles sur l'idée du président Wilson, la SDN (siège à Genève) échoue à empêcher les agressions des années 1930, faute de moyens et en l'absence des États-Unis. L'ONU lui succède en 1945. Le multilatéralisme connaît son apogée dans les années 1990 (OMC, CPI) ; il est aujourd'hui fragilisé par le retour des rivalités de puissances, et des formats restreints se développent (Quad, AUKUS)."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel traité de 1648 fonde le principe de souveraineté des États et met fin à la guerre de Trente Ans ?",a:"Les traités de Westphalie (1648)",detail:"Signés à Münster et Osnabrück, ils mettent fin à la guerre de Trente Ans et consacrent le principe de souveraineté des États et de non-ingérence, défini dès 1576 par Jean Bodin comme « puissance absolue et perpétuelle ». Depuis 1945, les droits humains limitent cette souveraineté : la « responsabilité de protéger » (2005) autorise une intervention si un État massacre sa population. La Chine et la Russie défendent une conception stricte de la souveraineté."},
{theme:"politique",diff:"difficile",type:"q",q:"Dans quel article de 1997 Fareed Zakaria théorise-t-il la 'démocratie illibérale', distinguant élections et libertés constitutionnelles ?",a:"Dans « The Rise of Illiberal Democracy », publié dans la revue Foreign Affairs",detail:"Zakaria observe que des élections libres peuvent porter au pouvoir des gouvernements qui érodent les libertés, l'État de droit et les contre-pouvoirs. Viktor Orbán, au pouvoir en Hongrie de 2010 à 2026, a revendiqué le terme en 2014 : réduction de l'indépendance des juges, contrôle des médias, réécriture de la Constitution. Il a été battu aux législatives d'avril 2026 par Péter Magyar."},
{theme:"politique",diff:"difficile",type:"q",q:"Dans quel article puis quel livre Fukuyama annonce-t-il en 1989 la 'fin de l'histoire' avec le triomphe de la démocratie libérale ?",a:"L'article « The End of History? » (The National Interest, 1989), puis le livre La Fin de l'histoire et le Dernier Homme (1992)",detail:"Inspiré de Hegel, Fukuyama soutient qu'après la chute du communisme, la démocratie libérale représente l'aboutissement de l'évolution idéologique de l'humanité. Samuel Huntington lui répond avec le « choc des civilisations » (1993). La montée de la Chine, le révisionnisme russe et la poussée des populismes ont alimenté les critiques ; Fukuyama a lui-même nuancé sa thèse."},
{theme:"politique",diff:"difficile",type:"q",q:"En quelle année l'ONU adopte-t-elle le principe de 'responsabilité de protéger' (R2P), et lors de quel conflit africain l'invoque-t-on en 2011 ?",a:"En 2005 ; en Libye, en 2011",detail:"La « responsabilité de protéger » (R2P) prolonge le « devoir d'ingérence » défendu par Bernard Kouchner après les massacres de l'ex-Yougoslavie et du Rwanda. Adoptée au Sommet mondial de l'ONU en 2005, elle prévoit qu'en cas de défaillance d'un État, la communauté internationale peut intervenir avec l'aval du Conseil de sécurité. L'intervention en Libye (résolution 1973) dépasse le mandat initial, ce qui rend la Russie et la Chine hostiles à toute action similaire en Syrie."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel réseau d'instituts culturels la Chine déploie-t-elle dans le monde pour exercer son soft power, suscitant des controverses sur l'ingérence ?",a:"Les Instituts Confucius",detail:"Lancés en 2004, ces instituts, souvent hébergés par des universités, enseignent la langue et la culture chinoises. Ils sont accusés de surveillance et d'autocensure, et beaucoup ont fermé aux États-Unis et en Europe. La Chine exerce aussi son influence par les « nouvelles routes de la soie » (2013), critiquées pour la « diplomatie du piège de la dette » (port de Hambantota au Sri Lanka)."},
{theme:"politique",diff:"difficile",type:"q",q:"Quel effet le scrutin majoritaire à un tour produit-il sur le nombre de partis, selon la loi de Duverger ?",a:"Il tend à produire un bipartisme",detail:"Maurice Duverger formule cette « loi » dans Les Partis politiques (1951) : le scrutin majoritaire à un tour favorise deux grands partis (États-Unis, Royaume-Uni), la proportionnelle le multipartisme (Pays-Bas, Italie). La proportionnelle représente mieux les minorités mais impose des coalitions. La France utilise un scrutin majoritaire à deux tours."},
