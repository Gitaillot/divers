{theme:"histoire",diff:"difficile",type:"q",q:"Par quel concordat de 1122 la querelle des investitures entre le pape et l'Empereur du Saint-Empire prend-elle fin ?",a:"Le concordat de Worms",detail:"L'enjeu : qui contrôle l'Église, le pape ou l'empereur ? Henri IV doit faire pénitence devant Grégoire VII à Canossa (1077) — humiliation symbolique immense. Le Concordat de Worms (1122) distingue l'investiture spirituelle (pape) et temporelle (empereur). Cette querelle affaiblit durablement le pouvoir impérial en Allemagne."},
{theme:"histoire",diff:"difficile",type:"q",q:"Combien de jours dure la crise des missiles de Cuba en octobre 1962, et qui sont les deux dirigeants en face-à-face ?",a:"13 jours ; John F. Kennedy et Nikita Khrouchtchev",detail:"Kennedy découvre des missiles soviétiques à Cuba. Il impose un blocus naval. Khrouchtchev propose le retrait des missiles cubains contre la garantie américaine de ne pas envahir Cuba (et, secrètement, le retrait des missiles américains de Turquie). Un sous-marin soviétique B-59, isolé, fut à deux doigts de lancer une torpille nucléaire."},
{theme:"histoire",diff:"difficile",type:"q",q:"Dans quelle ville yougoslave le mouvement des Non-Alignés est-il fondé en 1961, et qui en accueille le premier sommet ?",a:"À Belgrade ; Josip Broz Tito",detail:"Fondé à Belgrade par Tito (Yougoslavie), Nehru (Inde), Nasser (Égypte), Sukarno (Indonésie) et Nkrumah (Ghana). En théorie, une « troisième voie » ; en pratique, beaucoup de membres reçoivent de l'aide des deux superpuissances simultanément. Le mouvement survit à la Guerre froide avec 120 membres mais une cohérence réduite."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quel conflit médiéval la loi salique est-elle invoquée pour justifier, excluant les femmes du trône de France ?",a:"La guerre de Cent Ans, née de la crise de succession de 1328",detail:"À la mort de Charles IV (1328), Édouard III d'Angleterre revendique la couronne par sa mère, Isabelle de France ; les grands du royaume lui préfèrent Philippe VI de Valois. La « loi salique », vieux code franc, n'est invoquée explicitement que plus tard, vers le milieu du XIVe siècle, pour justifier a posteriori l'exclusion des femmes et de leur descendance. Cette règle de succession est restée en vigueur jusqu'à la fin de la monarchie."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quelle dynastie chinoise crée le système des concours mandarinaux, ouvrant en théorie la haute administration à tous les lettrés ?",a:"Les Sui (vers 605), système ensuite développé par les Tang et généralisé sous les Song",detail:"Sous les Han, les fonctionnaires étaient surtout recrutés par recommandation. Les examens impériaux (keju), fondés sur les classiques confucéens, permettent en théorie à des roturiers d'accéder aux plus hautes fonctions ; en pratique, seules les familles aisées peuvent financer des années d'études. Le système, qui a assuré la stabilité de l'État chinois pendant plus de treize siècles, est aboli en 1905."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé l'imprimerie à caractères mobiles en Europe vers 1450 ?",a:"Johannes Gutenberg",detail:"Gutenberg adapte la presse à vis (utilisée pour le vin) pour imprimer avec des caractères en alliage de plomb. Sa Bible à 42 lignes (1455) est le premier livre imprimé en Europe. En 50 ans, 8 millions de livres circulent — plus qu'en toute l'histoire précédente. L'imprimerie est le moteur de la Réforme et de la Renaissance."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a décrit le premier la circulation sanguine de façon complète en 1628 ?",a:"William Harvey",detail:"Harvey démontre par expérience que le sang circule en circuit fermé propulsé par le cœur — contre 1400 ans de dogme galénique. Son traité De Motu Cordis est un modèle de raisonnement expérimental. Il mesure le volume d'éjection systolique et conclut mathématiquement que le sang doit circuler."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé le téléphone en 1876 ?",a:"Alexander Graham Bell (breveté le 7 mars 1876)",detail:"Bell dépose son brevet quelques heures avant son rival Elisha Gray. Sa première phrase transmise : « Mr Watson, come here, I want to see you. » La paternité est contestée — l'inventeur italo-américain Antonio Meucci avait protégé un concept similaire dès 1871 mais n'avait pas les moyens de renouveler son brevet."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a découvert la radioactivité en 1896 ?",a:"Henri Becquerel",detail:"Becquerel découvre que des sels d'uranium impressionnent une plaque photographique même dans l'obscurité. Marie Curie choisit ce rayonnement comme sujet de thèse et invente le terme « radioactivité » ; Pierre Curie la rejoint. Les trois partagent le prix Nobel de physique en 1903. Marie Curie reçoit en 1911 le Nobel de chimie : elle reste la seule personne récompensée dans deux disciplines scientifiques différentes."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé la machine à vapeur pratique, moteur de la révolution industrielle ?",a:"James Watt (1769), perfectionnant la machine de Newcomen",detail:"Thomas Newcomen avait créé une première machine à vapeur en 1712 pour pomper l'eau des mines. Watt améliore radicalement son rendement en ajoutant un condenseur séparé. Sa machine rotative (1781) peut entraîner n'importe quelle machine. Il invente aussi le concept de « cheval-vapeur » pour vendre ses machines."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé l'ampoule électrique à filament durable en 1879 ?",a:"Thomas Edison (et Joseph Swan indépendamment en Grande-Bretagne)",detail:"Edison met au point un filament de carbone carbonisé capable de tenir 1 200 heures. Mais son génie est autant commercial que technique : il invente simultanément le réseau de distribution électrique, les compteurs et les prises. Son usine de Menlo Park est le premier laboratoire de R&D industrielle de l'histoire."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a réalisé le premier vol motorisé de l'histoire en 1903 ?",a:"Orville et Wilbur Wright à Kitty Hawk (Caroline du Nord)",detail:"Le Flyer I vole 12 secondes sur 36 mètres le 17 décembre 1903. Les frères Wright sont des réparateurs de bicyclettes autodidactes qui ont résolu le problème du contrôle latéral (gauchissement des ailes) que les ingénieurs diplômés avaient ignoré. Leur quatrième vol du même jour atteint 59 secondes."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a découvert les lois de l'hérédité en étudiant des pois dans un jardin monastique ?",a:"Gregor Mendel (années 1860, publié en 1866)",detail:"Le moine augustinien Mendel croise 29 000 plants de pois pendant 8 ans et découvre les lois de transmission des caractères héréditaires (dominance, ségrégation, assortiment indépendant). Son travail est ignoré pendant 35 ans jusqu'à sa redécouverte en 1900 — qui fonde la génétique moderne."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé le vaccin contre la variole à la fin du XVIIIe siècle ?",a:"Edward Jenner en 1796",detail:"Jenner observe que les laitières contractant la vaccine (maladie bénigne des vaches) ne tombent pas malades lors des épidémies de variole. Il inocule du pus de vaccine à un enfant de 8 ans, puis l'expose à la variole : l'enfant est protégé. La variole sera la première maladie éradiquée par la vaccination (1980)."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a découvert la pénicilline et dans quelles circonstances ?",a:"Alexander Fleming en 1928 — en observant qu'une moisissure avait contaminé et détruit sa culture de staphylocoques",detail:"Fleming rentre de vacances et remarque qu'une moisissure (Penicillium notatum) a colonisé sa boîte de Petri et tué les bactéries autour d'elle. Il publie en 1929 mais ne réussit pas à isoler le principe actif. Florey et Chain y parviennent en 1940 et sauvent des millions de vies pendant la Seconde Guerre mondiale."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a posé les bases de l'électromagnétisme en démontrant le lien entre électricité et magnétisme ?",a:"Hans Christian Ørsted (1820), puis Faraday et Maxwell",detail:"Ørsted remarque qu'un fil parcouru par un courant fait dévier une boussole. Faraday découvre l'induction électromagnétique (1831) et invente le moteur électrique. Maxwell unifie tout en 4 équations (1865) et prédit les ondes radio — que Hertz démontrera en 1887. Cette chaîne mène directement à toute l'électronique moderne."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé le moteur à explosion et la première automobile à essence ?",a:"Karl Benz avec sa Motorwagen (1885), brevetée en janvier 1886",detail:"Benz construit un tricycle à moteur à 4 temps de 0,75 CV. Sa femme Bertha effectue le premier long trajet automobile de l'histoire (106 km, Mannheim-Pforzheim) en 1888 sans le lui dire — un coup de pub génial. Gottlieb Daimler développe parallèlement un moteur similaire. Les deux compagnies fusionneront en Mercedes-Benz en 1926."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a découvert les rayons X et quand ?",a:"Wilhelm Röntgen en novembre 1895",detail:"Röntgen expérimente avec des tubes cathodiques quand il remarque qu'un écran fluorescent s'illumine à distance. Il passe 6 semaines à étudier secrètement ce nouveau rayonnement avant de publier. La première radiographie est la main de sa femme. Il refuse de breveter sa découverte pour que l'humanité entière en bénéficie."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé le World Wide Web en 1989 ?",a:"Tim Berners-Lee, physicien britannique au CERN",detail:"Berners-Lee propose un système de partage d'informations pour les physiciens du CERN basé sur des hyperliens. Son patron griffonne sur sa proposition : « Vague mais excitant. » En 1991, le premier site web est en ligne. Berners-Lee refuse de breveter l'invention pour que le Web reste ouvert — décision qui change l'histoire de l'humanité."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a formulé la loi de la gravitation universelle après, dit la légende, avoir observé une pomme tomber ?",a:"Isaac Newton (Principia Mathematica, 1687)",detail:"La légende de la pomme est vraie selon Newton lui-même : une pomme qui tombe lui suggère que la même force pourrait atteindre la Lune. Il faudra 20 ans pour développer la démonstration mathématique complète. Newton est aussi coinventeur du calcul infinitésimal (avec Leibniz) et co-fondateur de l'optique moderne."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel philosophe anglais théorise en 1620, dans le Novum Organum, une méthode inductive et expérimentale opposée à la logique d'Aristote ?",a:"Francis Bacon",detail:"Au XVIIe siècle, Galilée, Harvey et Descartes contestent l'autorité d'Aristote et de Galien. Bacon propose de partir de l'observation et de l'expérience pour remonter aux lois générales. La fondation de la Royal Society (1660) et de l'Académie des sciences (1666) institutionnalise cette nouvelle science. À la fin du siècle, la « querelle des Anciens et des Modernes » oppose en France partisans de l'Antiquité et du progrès, surtout dans le domaine littéraire."},
{theme:"sciences",diff:"moyen",type:"q",q:"Dans quelles décennies Newton et Leibniz développent-ils indépendamment le calcul infinitésimal, et lequel publie en premier ?",a:"Newton dès 1665-1666, Leibniz vers 1675 ; Leibniz publie le premier, en 1684",detail:"Newton développe sa « méthode des fluxions » mais tarde à publier. Leibniz publie en 1684 avec une notation (dx, ∫) qui s'impose en Europe. En 1712, un rapport de la Royal Society, inspiré par Newton lui-même, accuse Leibniz de plagiat. La querelle isole durablement les mathématiciens britanniques, attachés à la notation de Newton. On admet aujourd'hui que les deux ont fait leur découverte indépendamment."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel élément Lavoisier identifie-t-il comme responsable de la combustion, renversant la théorie du phlogistique ?",a:"L'oxygène",detail:"Georg Stahl expliquait la combustion par la libération d'un « phlogistique ». Par des pesées précises, Lavoisier montre que la combustion consomme de l'oxygène et que la masse se conserve. Il crée avec d'autres une nomenclature chimique systématique encore utilisée. Fermier général, il est guillotiné en 1794 ; la phrase « La République n'a pas besoin de savants », prêtée au tribunal, est probablement apocryphe."},
{theme:"sciences",diff:"moyen",type:"q",q:"En quelle année Darwin publie-t-il De l'origine des espèces, et quel naturaliste arrive simultanément à la même théorie ?",a:"En 1859 ; Alfred Russel Wallace",detail:"En 1858, Wallace envoie à Darwin un essai exposant une théorie très proche de la sienne. Leurs travaux sont présentés ensemble à la Linnean Society de Londres en juillet 1858, sans grand écho. Darwin, qui mûrissait sa théorie depuis une vingtaine d'années, publie L'Origine des espèces en novembre 1859 ; le premier tirage est épuisé dès sa sortie."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel résultat négatif l'expérience de Michelson-Morley (1887) produit-elle, et quelle théorie ouvre-t-elle la voie ?",a:"Aucune différence de vitesse de la lumière selon la direction, donc aucun « vent d'éther » ; ce résultat prépare la relativité restreinte",detail:"On pensait que la lumière se propageait dans un milieu fixe, l'éther. L'interféromètre de Michelson et Morley devait détecter le mouvement de la Terre à travers lui ; il ne détecte rien. Lorentz et FitzGerald tentent d'expliquer ce résultat par une contraction des longueurs. La relativité restreinte d'Einstein (1905) rend l'éther inutile, même si Einstein affirmait que cette expérience avait peu compté dans sa démarche."},
{theme:"sciences",diff:"moyen",type:"q",q:"Qui était Nikola Tesla et quelle est son importance dans l'histoire des sciences ?",a:"Inventeur serbo-américain qui développa le courant alternatif, le moteur à induction et les bases de la radio — souvent éclipsé par Edison",detail:"Tesla et Edison s'opposent dans la « guerre des courants » (1880-1890) : Edison défend le courant continu, Tesla le courant alternatif (AC). Westinghouse adopte le système Tesla qui équipe les chutes du Niagara en 1895. L'AC permet de transporter l'électricité sur de longues distances. Tesla mourra seul et ruiné malgré 300 brevets."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel rival de Pasteur défend encore la génération spontanée lors du célèbre débat devant l'Académie des sciences en 1864 ?",a:"Félix-Archimède Pouchet",detail:"Naturaliste rouennais, Pouchet défend la génération spontanée. L'Académie des sciences offre un prix pour trancher la question ; Pasteur l'emporte. Les expériences de Pouchet utilisaient une infusion de foin contenant des spores résistantes à la chaleur, ce qui expliquait ses résultats. Pasteur développe ensuite la théorie microbienne des maladies et des vaccins (choléra des poules, charbon, rage)."},
{theme:"sciences",diff:"moyen",type:"q",q:"Qui résout la catastrophe ultraviolette en 1900 en introduisant la notion de quantum d'énergie ?",a:"Max Planck",detail:"La physique classique prédisait qu'un corps chauffé devrait rayonner une énergie infinie aux courtes longueurs d'onde : c'est la « catastrophe ultraviolette ». Planck la résout en supposant que l'énergie est émise par paquets (quanta). Il y voit d'abord un artifice mathématique. Einstein prend l'idée au sérieux en 1905 (effet photoélectrique), Bohr l'applique à l'atome en 1913 ; la mécanique quantique naît dans les années 1920."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel système hybride Tycho Brahe propose-t-il pour concilier observations et cosmologie, entre Ptolémée et Copernic ?",a:"Le système tychonique : le Soleil et la Lune tournent autour de la Terre immobile, et les autres planètes autour du Soleil",detail:"Tycho Brahe est le plus grand observateur astronomique de l'ère pré-télescopique. Ses données précises permettront à Kepler (son assistant) de déduire les lois des orbites elliptiques. Mais Tycho refuse l'héliocentrisme — la parallaxe des étoiles n'était pas mesurable avec ses instruments, ce qu'il interprète comme une preuve contre Copernic."},
{theme:"sciences",diff:"moyen",type:"q",q:"Qui a découvert la structure de l'ADN et dans quel contexte de rivalité scientifique ?",a:"Watson et Crick (1953), grâce aux données de Rosalind Franklin et en rivalité avec le laboratoire de Linus Pauling",detail:"Linus Pauling, déjà célèbre, propose en janvier 1953 un modèle erroné à triple hélice. Watson et Crick ont accès, sans l'accord de Rosalind Franklin, à la photo 51 et à des données de son laboratoire, qui révèlent la structure hélicoïdale. Leur modèle paraît dans Nature en avril 1953. Franklin meurt en 1958 ; le Nobel de 1962, attribué à Watson, Crick et Wilkins, ne peut être décerné à titre posthume."},
{theme:"sciences",diff:"moyen",type:"q",q:"En quelle année le séquençage complet du génome humain est-il annoncé, et qui est en compétition avec le consortium public ?",a:"En 2003 (un premier brouillon est annoncé en juin 2000) ; l'entreprise privée Celera Genomics de Craig Venter",detail:"La course entre le consortium public (Francis Collins) et Celera accélère le séquençage. Clinton et Blair annoncent le premier brouillon en juin 2000. Surprise : l'humain ne compte qu'environ 20 000 gènes codant des protéines, moins que certaines plantes. La version de 2003 laissait des lacunes ; une séquence réellement complète, de bout en bout, est publiée en 2022."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel est le rôle de la Royal Society de Londres dans l'histoire des sciences ?",a:"Fondée en 1660, c'est la plus ancienne académie scientifique encore active ; elle a contribué à imposer la méthode expérimentale et l'évaluation des travaux par les pairs",detail:"La Royal Society réunit Boyle, Hooke, Newton, Halley. Sa devise : « Nullius in verba » (ne s'en remettre à la parole de personne). Elle publie les Philosophical Transactions depuis 1665 — la plus ancienne revue scientifique encore en activité. Elle normalise les poids et mesures, finance des expéditions et valide (ou non) les découvertes."},
{theme:"sciences",diff:"moyen",type:"q",q:"Qui propose en 1912 la théorie de la dérive des continents, et pourquoi est-elle rejetée par ses contemporains ?",a:"Alfred Wegener en 1912 — l'idée que les continents se déplacent sur la surface terrestre, rejetée pendant 50 ans avant d'être confirmée par la tectonique des plaques",detail:"Wegener remarque que les côtes africaines et sud-américaines s'emboîtent et que les fossiles des deux côtés de l'Atlantique sont identiques. Il propose un supercontinent originel (Pangée). Ses collègues géologues rejettent violemment sa théorie faute de mécanisme convaincant. Il mourra en 1930 pendant une expédition au Groenland, incompris. La dorsale atlantique, découverte dans les années 1950, le réhabilite."},
{theme:"sciences",diff:"moyen",type:"q",q:"Qui était Ada Lovelace et pourquoi est-elle importante dans l'histoire de l'informatique ?",a:"Mathématicienne britannique (1815-1852) qui écrivit le premier algorithme destiné à être exécuté par une machine — la machine analytique de Babbage",detail:"Lovelace traduit un article sur la machine de Babbage et y ajoute ses propres notes (3 fois plus longues que l'original). Elle y décrit un algorithme pour calculer les nombres de Bernoulli et comprend que la machine pourrait traiter autre chose que des chiffres — de la musique, des symboles. Elle est considérée comme la première programmatrice de l'histoire."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel physicien britannique calcule au XIXe siècle que la Terre n'a que 20 à 400 millions d'années, contredisant les géologues ?",a:"Lord Kelvin (William Thomson)",detail:"Kelvin calcule le temps de refroidissement d'une Terre initialement en fusion et conclut à quelques dizaines de millions d'années. Les géologues (Lyell) et Darwin ont besoin de beaucoup plus pour expliquer l'érosion et l'évolution. Kelvin ignore la chaleur produite par la radioactivité, découverte en 1896, et la convection du manteau. La Terre a environ 4,54 milliards d'années."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel mathématicien indien du VIIe siècle est le premier à formaliser le zéro comme nombre à part entière ?",a:"Brahmagupta, en 628",detail:"Les Babyloniens disposaient d'un signe de position vide, mais pas d'un zéro utilisé comme nombre ; les Mayas ont aussi inventé un zéro. Brahmagupta énonce les règles de calcul avec le zéro et les nombres négatifs. Al-Khwarizmi (IXe siècle) diffuse la numération indienne dans le monde arabe, puis Fibonacci (Liber Abaci, 1202) la popularise en Europe."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quelle expérience du XIXe siècle tranche en faveur de la nature ondulatoire de la lumière défendue par Huygens contre Newton ?",a:"Les expériences d'interférences de Thomas Young (vers 1801-1803)",detail:"Newton défendait une lumière faite de corpuscules, Huygens une lumière ondulatoire. En montrant que deux faisceaux lumineux peuvent produire des franges d'interférence, Young donne raison à Huygens ; Fresnel en tire une théorie mathématique complète. Maxwell identifie la lumière à une onde électromagnétique (1865). Einstein montre en 1905 qu'elle se comporte aussi comme des particules (photons) : c'est la dualité onde-corpuscule."},
{theme:"sciences",diff:"difficile",type:"q",q:"Dans quel pays l'affaire Lysenko provoque-t-elle l'interdiction officielle de la génétique mendélienne, et pendant combien d'années ?",a:"En URSS ; la génétique y est officiellement proscrite de 1948 au milieu des années 1960",detail:"Trofim Lysenko (1898-1976) défend l'hérédité des caractères acquis et rejette la génétique mendélienne, jugée « bourgeoise ». Soutenu par Staline, puis par Khrouchtchev, il fait condamner la génétique en 1948 ; des généticiens, comme Nikolaï Vavilov dès 1940, sont arrêtés et meurent en détention. Ses méthodes agricoles sont un échec. Il n'est écarté qu'après la chute de Khrouchtchev, en 1964-1965."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quel programme de formalisation des mathématiques le théorème d'incomplétude de Gödel (1931) ruine-t-il définitivement ?",a:"Le programme de Hilbert",detail:"David Hilbert voulait formaliser toutes les mathématiques en un système complet et cohérent. Gödel, à 25 ans, démontre que c'est impossible : dans tout système formel assez riche, il existera toujours des vérités indémontrables. Ce résultat stupéfie les mathématiciens et a des implications philosophiques profondes sur les limites de la connaissance."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quel montage Pasteur utilise-t-il pour montrer qu'un bouillon stérilisé reste stérile même au contact de l'air ?",a:"Le ballon à col de cygne",detail:"Pasteur fait bouillir un bouillon dans un ballon dont il étire le col en S : l'air circule, mais les poussières et les germes se déposent dans la courbure. Le bouillon reste stérile ; si l'on brise le col, il se contamine. L'expérience montre que les micro-organismes viennent de germes présents dans l'air et non d'une génération spontanée."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quelle célèbre phrase Einstein prononce-t-il pour exprimer son refus du caractère probabiliste de la mécanique quantique ?",a:"« Dieu ne joue pas aux dés » (formule tirée d'une lettre à Max Born de 1926)",detail:"Einstein propose des expériences de pensée, comme le paradoxe EPR (1935), pour montrer que la mécanique quantique serait incomplète ; Bohr lui répond. Les expériences d'Alain Aspect (1982), après celles de John Clauser, montrent la violation des inégalités de Bell et donnent tort aux théories « réalistes locales ». Aspect, Clauser et Zeilinger reçoivent le Nobel en 2022. L'interprétation de la mécanique quantique reste débattue."},
{theme:"sciences",diff:"difficile",type:"q",q:"Qui était Ignace Semmelweis et pourquoi son histoire est-elle tragique ?",a:"Médecin hongrois qui démontra en 1847 que le lavage des mains réduit la fièvre puerpérale — et fut ridiculisé par ses collègues avant de mourir de la maladie qu'il voulait éradiquer",detail:"Semmelweis constate qu'à la maternité de Vienne, la mortalité est bien plus forte dans le service des étudiants, qui sortent des salles d'autopsie, que dans celui des sages-femmes. En imposant le lavage des mains au chlorure de chaux (1847), il fait chuter la mortalité d'environ 10-18 % à 1-2 %. Ses collègues refusent sa conclusion. Interné en 1865, il meurt deux semaines plus tard d'une infection, peut-être consécutive à des mauvais traitements."},
{theme:"sciences",diff:"difficile",type:"q",q:"Combien d'hommes le programme Apollo envoie-t-il sur la Lune entre 1969 et 1972, et quel est le nom du premier ?",a:"12 astronautes ; Neil Armstrong (Apollo 11, 21 juillet 1969)",detail:"Kennedy lance le défi en 1961 alors que la NASA n'a que 15 minutes de vol spatial à son actif. Apollo résout des centaines de problèmes inédits : rentrée atmosphérique, moteurs cryogéniques, ordinateurs embarqués (AGC, 4 Ko de RAM). L'accident d'Apollo 1 (1967, 3 morts) oblige à repenser toute l'électronique. Les missions rapportent 382 kg de roches lunaires encore étudiées aujourd'hui."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quels deux astronomes prédisent mathématiquement la position de Neptune en 1846, déclenchant une dispute franco-britannique ?",a:"Urbain Le Verrier et John Couch Adams",detail:"Le Verrier calcule la position d'une planète hypothétique et demande à Galle (Berlin) de pointer son télescope : Neptune est trouvée le 23 septembre 1846 à moins d'un degré de la prédiction. Adams avait fait le même calcul mais n'avait pas su convaincre les astronomes britanniques d'observer. La prédiction mathématique d'une planète inconnue est saluée comme le triomphe de la mécanique newtonienne."},
{theme:"sciences",diff:"difficile",type:"q",q:"Lors de quelle éclipse solaire de 1919 la théorie de la relativité générale d'Einstein est-elle confirmée par observation ?",a:"L'éclipse totale du 29 mai 1919, observée par les expéditions d'Eddington à Principe et à Sobral",detail:"Einstein prédit que la lumière des étoiles est déviée par la masse du Soleil, deux fois plus que ne le donnerait la théorie de Newton. Les mesures de 1919, imprécises mais favorables, sont annoncées à Londres en novembre ; la presse en fait un événement mondial et Einstein devient célèbre du jour au lendemain. Des observations ultérieures, bien plus précises, ont confirmé la prédiction."},
{theme:"sciences",diff:"difficile",type:"q",q:"En quelle année l'URSS teste-t-elle sa première bombe atomique, et quel espion lui a transmis des secrets du projet Manhattan ?",a:"En 1949 ; le physicien Klaus Fuchs (britannique d'origine allemande), parmi d'autres espions",detail:"Fuchs, qui travaille à Los Alamos, transmet des informations décisives sur la bombe au plutonium ; il est arrêté en 1950. Julius et Ethel Rosenberg, au cœur d'un autre réseau, sont exécutés aux États-Unis en 1953. Le premier essai soviétique (29 août 1949) pousse Truman à lancer la bombe à hydrogène. Les arsenaux mondiaux culminent au milieu des années 1980 à plus de 60 000 têtes."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quelle expérience Rutherford réalise-t-il en 1911 avec des feuilles d'or pour découvrir le noyau atomique ?",a:"Le bombardement d'une fine feuille d'or par des particules alpha (expériences de Geiger et Marsden, interprétées par Rutherford en 1911)",detail:"Rutherford bombarde une feuille d'or avec des particules alpha. La plupart passent, mais quelques-unes rebondissent. Il est « aussi stupéfait que si on tirait des obus de 15 pouces sur du papier de soie et qu'ils rebondissaient. » Le modèle planétaire de l'atome (noyau + électrons en orbite) remplace le « plum pudding » de Thomson, mais posera bientôt de nouveaux problèmes à la physique classique."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quel rôle joua la cryptographie dans la Seconde Guerre mondiale et qui en fut le héros méconnu ?",a:"Alan Turing et l'équipe de Bletchley Park déchiffrèrent Enigma, raccourcissant la guerre de 2 à 4 ans selon les estimations",detail:"La machine Enigma offre un nombre colossal de réglages. S'appuyant sur les travaux de mathématiciens polonais (Rejewski), Turing conçoit la « Bombe », machine électromécanique qui teste systématiquement les réglages possibles. Les renseignements obtenus (« Ultra ») jouent un rôle majeur, notamment dans la bataille de l'Atlantique. Condamné en 1952 pour homosexualité, Turing meurt en 1954 ; il est gracié à titre posthume en 2013."},
{theme:"sciences",diff:"difficile",type:"q",q:"Qui propose en 1927 la théorie du Big Bang sous le nom d'« atome primitif », et qui la baptise ironiquement « Big Bang » ?",a:"Le chanoine Lemaître proposa en 1927 un univers en expansion issu d'un « atome primitif » — rejeté par Hoyle qui forgea ironiquement le terme « Big Bang » pour se moquer",detail:"Lemaître, prêtre et physicien belge, déduit de la relativité générale que l'univers est en expansion et l'appuie sur des données astronomiques dès 1927, avant Hubble. Fred Hoyle, partisan d'un univers stationnaire, emploie l'expression « Big Bang » à la radio de la BBC en 1949 ; il niera avoir voulu se moquer. La découverte du rayonnement fossile par Penzias et Wilson (1964-1965) fait pencher la balance vers le Big Bang."},
{theme:"sciences",diff:"facile",type:"q",q:"Quel drapier de Delft observe le premier, dans les années 1670, des bactéries et des protozoaires avec des microscopes de sa fabrication ?",a:"Antonie van Leeuwenhoek",detail:"Le microscope composé apparaît aux Pays-Bas vers 1590-1620. Leeuwenhoek, autodidacte, fabrique des microscopes simples à une seule lentille, d'une qualité inégalée (grossissement de plus de 200 fois). Il décrit bactéries, protozoaires, spermatozoïdes et globules rouges dans quelque 190 lettres en néerlandais adressées à la Royal Society de Londres."},
{theme:"sciences",diff:"facile",type:"q",q:"Quel philosophe français publie en 1637 la loi de la réfraction de la lumière, aussi attribuée au Néerlandais Snell ?",a:"René Descartes (loi de Snell-Descartes)",detail:"Snell avait trouvé la loi vers 1621 sans la publier ; le savant persan Ibn Sahl l'avait déjà formulée au Xe siècle. Descartes la publie dans La Dioptrique, l'un des essais accompagnant le Discours de la méthode (1637), qui contient aussi La Géométrie, fondatrice de la géométrie analytique."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé la dynamite en 1867 et pour quelles raisons ?",a:"Alfred Nobel, pour rendre la nitroglycérine plus sûre à manipuler — et dont les remords ont fondé le Prix Nobel",detail:"Nobel stabilise la nitroglycérine en l'absorbant dans du kieselguhr (terre de diatomées). La dynamite transforme les mines et les grands travaux, mais aussi la guerre. Selon une anecdote célèbre, un journal publie par erreur sa nécrologie en 1888 (à la mort de son frère Ludvig) sous le titre « Le marchand de mort est mort ». Son testament de 1895 crée les prix Nobel."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel savant danois du XVIIe siècle montre que les « glossopètres » sont des dents de requin fossilisées et pose les principes de la stratigraphie ?",a:"Nicolas Sténon (Niels Stensen), en 1667-1669",detail:"En disséquant la tête d'un grand requin, Sténon remarque que ses dents ressemblent aux « langues de pierre » trouvées dans les roches, qu'on tenait pour des jeux de la nature. Il en déduit que les fossiles sont d'anciens organismes et formule le principe de superposition : les couches les plus profondes sont les plus anciennes. C'est l'un des fondements de la géologie."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quelle substance est utilisée pour la première fois comme anesthésique général en chirurgie en 1842, et par quel médecin américain ?",a:"L'éther ; Crawford Long (1842), même si la première démonstration publique est faite par William Morton à Boston en 1846",detail:"Avant l'anesthésie, les chirurgiens devaient opérer très vite sur des patients conscients. Long ne publie pas ses résultats ; Morton fait connaître la méthode et tente de la breveter, ce qui suscite une âpre querelle de priorité. James Young Simpson introduit le chloroforme en obstétrique en 1847 ; la reine Victoria l'adopte pour un accouchement en 1853."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel système de double nom latin Linné généralise-t-il au milieu du XVIIIe siècle pour nommer les espèces vivantes ?",a:"La nomenclature binominale (genre + espèce), appliquée aux plantes en 1753 et aux animaux en 1758",detail:"Dans son Systema Naturae (1re édition en 1735) et Species Plantarum (1753), Carl von Linné classe des milliers d'espèces selon une hiérarchie (règne, classe, ordre, genre, espèce) et les nomme en deux mots latins (Homo sapiens). Il ne cherche pas à expliquer leurs ressemblances ; Darwin montrera qu'elles reflètent une descendance commune."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel rôle a joué l'Académie des sciences de Paris dans le développement scientifique français ?",a:"Fondée en 1666 par Colbert sous Louis XIV, elle centralise, finance et valide la science en France — et arbitre les controverses (Pasteur-Pouchet, Lamarck-Cuvier)",detail:"Colbert crée l'Académie pour que la science serve l'État (cartographie, marine, manufactures). Elle envoie des expéditions mesurer la Terre (Maupertuis en Laponie, La Condamine en Équateur pour trancher le débat sur la forme de la Terre). Lavoisier, Laplace, Cuvier, Pasteur en sont membres. Dissoute pendant la Révolution, elle renaît sous l'Institut de France."},
{theme:"sciences",diff:"moyen",type:"q",q:"En quelle année J.J. Thomson découvre-t-il l'électron, et dans quel type d'expérience avec des tubes à vide ?",a:"En 1897, avec des tubes à rayons cathodiques",detail:"Thomson mesure le rapport charge/masse des particules cathodiques et trouve qu'il est le même quel que soit le matériau de la cathode ou le gaz utilisé. Il conclut que ces particules (qu'il appelle d'abord « corpuscules ») sont des constituants universels de la matière. Le modèle « plum pudding » (électrons noyés dans une sphère positive) sera bientôt remplacé par le modèle nucléaire de Rutherford."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quelle découverte de Griffith en 1928, confirmée par Avery en 1944, ouvre la voie à l'identification de l'ADN comme support de l'hérédité ?",a:"La transformation bactérienne : un pneumocoque inoffensif devient virulent au contact de bactéries virulentes tuées",detail:"Griffith injecte à des souris des pneumocoques virulents tués et des pneumocoques inoffensifs vivants : les souris meurent. Un « principe transformant » passe des bactéries mortes aux vivantes. Avery, MacLeod et McCarty l'identifient à l'ADN en 1944, résultat longtemps contesté car on pensait que les protéines portaient l'hérédité. L'expérience de Hershey et Chase (1952) achève de convaincre."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quelle découverte des années 1950-60 sur les fonds océaniques convainc finalement la communauté scientifique de la dérive des continents ?",a:"L'expansion des fonds océaniques, révélée par les anomalies magnétiques symétriques de part et d'autre des dorsales (Hess, Vine et Matthews)",detail:"Harry Hess propose l'expansion des fonds océaniques (1960) : du magma monte à la dorsale, pousse les plaques de part et d'autre. Vine et Matthews (1963) observent les anomalies magnétiques symétriques des fonds océaniques — preuve irréfutable. En 10 ans, toute la géologie est révolutionnée. Les plaques continentales « flottent » sur l'asthénosphère."},
{theme:"sciences",diff:"difficile",type:"q",q:"Qui est le premier, en 1676, à démontrer que la lumière a une vitesse finie en étudiant les éclipses des lunes de Jupiter ?",a:"Ole Rømer",detail:"Rømer remarque que les éclipses de Io, satellite de Jupiter, surviennent en avance quand la Terre se rapproche de Jupiter et en retard quand elle s'en éloigne : la lumière met du temps à parcourir la distance. Fizeau (1849) puis Foucault mesurent sa vitesse sur Terre ; Michelson l'affine à la fin du XIXe siècle. Depuis 1983, elle est fixée par définition à 299 792 458 m/s, ce qui sert à définir le mètre."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quel cartographe flamand du XVIe siècle crée en 1569 la projection qui porte son nom, encore utilisée aujourd'hui malgré ses déformations ?",a:"Gerardus Mercator",detail:"Ptolémée (IIe s.) dessine déjà une carte avec projections. Mercator résout le problème de la navigation : sur sa projection, une ligne de cap constant est une droite, révolutionnant la navigation maritime. Mais le Groenland paraît aussi grand que l'Afrique (il est 14 fois plus petit). La projection de Peters (1974) tente de corriger les déformations — déclenchant un débat géopolitique sur la représentation du monde."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé la vaccination contre la rage et comment ?",a:"Louis Pasteur en 1885, en atténuant le virus sur des lapins et en injectant ces cultures affaiblies à un enfant mordu par un chien enragé",detail:"Le 6 juillet 1885, Joseph Meister, 9 ans, mordu gravement par un chien enragé, est amené à Pasteur. Pasteur n'est pas médecin et prend un risque légal énorme. Il injecte 13 doses de virus atténué sur 10 jours. L'enfant survit. Pasteur reçoit en quelques mois des milliers de demandes du monde entier. L'Institut Pasteur est fondé en 1888 par souscription internationale."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel pays développe en secret le radar Chain Home dès 1935, jouant un rôle décisif lors de la Bataille d'Angleterre ?",a:"Le Royaume-Uni",detail:"Watson-Watt développe le radar britannique en 1935. Lors de la Bataille d'Angleterre, il permet aux Spitfires et Hurricanes d'être dirigés vers les escadrilles allemandes sans patrouilles permanentes. Les Allemands ont aussi le radar mais ne comprennent pas son usage tactique défensif. Le transfert de technologie radar aux États-Unis via la mission Tizard en 1940 est l'un des actes scientifiques les plus importants de la guerre."},
// NOUVELLES CARTES HISTOIRE (30 cartes pour atteindre 100),
{theme:"histoire",diff:"facile",type:"q",q:"Qui était Napoléon Bonaparte ?",a:"Général corse devenu Empereur des Français (1804-1814/1815), conquérant de l'Europe",detail:"Né en Corse en 1769, Napoléon s'impose pendant la Révolution à Toulon (1793). Premier Consul en 1799, il se couronne Empereur en 1804. Ses victoires (Austerlitz, Iéna, Wagram) dominent l'Europe. La campagne de Russie (1812) marque le début de sa chute. Exilé à Sainte-Hélène, il meurt en 1821."},
{theme:"histoire",diff:"facile",type:"q",q:"Quelle date symbolise le début de la Révolution française, et quel bâtiment les Parisiens prennent-ils d'assaut ?",a:"Le 14 juillet 1789 ; la Bastille",detail:"La prise de la Bastille marque le début symbolique de la Révolution. L'Assemblée nationale abolit les privilèges (nuit du 4 août) et adopte la Déclaration des droits de l'homme et du citoyen (26 août). La Terreur (1793-1794) fait environ 17 000 exécutions officielles et des dizaines de milliers de morts au total. Le 14 juillet devient fête nationale en 1880."},
{theme:"histoire",diff:"facile",type:"q",q:"Combien d'Africains sont déportés vers les Amériques lors de la traite transatlantique entre le XVIe et le XIXe siècle ?",a:"Environ 12,5 millions de captifs embarqués, dont près de 10,7 millions arrivés vivants",detail:"Les navires européens échangent des marchandises contre des captifs sur les côtes africaines, puis les vendent aux Amériques contre du sucre, du tabac ou du coton (commerce triangulaire). Ces chiffres proviennent de la base de données Slave Voyages. La France abolit définitivement l'esclavage en 1848, sous l'impulsion de Victor Schœlcher. La traite a profondément marqué les démographies africaine et américaine."},
{theme:"histoire",diff:"facile",type:"q",q:"Quelle a été la durée du règne de Louis XIV et pourquoi est-il appelé le « Roi-Soleil » ?",a:"72 ans (1643-1715), le plus long règne connu d'un monarque d'un grand État européen ; il choisit le soleil comme emblème, symbole d'un roi source de tout éclat",detail:"Louis XIV fait de Versailles le centre du pouvoir et y attire la noblesse. Il incarne la monarchie absolue, même si la formule « L'État, c'est moi » est apocryphe. Il révoque l'édit de Nantes (1685), poussant environ 200 000 protestants à l'exil. Son règne est aussi un âge d'or culturel : Molière, Racine, La Fontaine, Lully."},
{theme:"histoire",diff:"facile",type:"q",q:"Combien de morts la Seconde Guerre mondiale provoque-t-elle au total, et quel pays en subit le plus grand nombre ?",a:"Entre 60 et 80 millions de morts environ ; l'URSS, avec quelque 27 millions de victimes",detail:"Déclenchée par l'invasion de la Pologne (1er septembre 1939), la guerre fait des dizaines de millions de victimes civiles, dont 6 millions de Juifs assassinés lors de la Shoah. La Chine compte aussi de 15 à 20 millions de morts. La guerre s'achève par la capitulation allemande (8 mai 1945) et japonaise (2 septembre 1945, après Hiroshima et Nagasaki). L'ONU est fondée en 1945."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel traité met fin à la guerre de Trente Ans en 1648, et dans quelles deux villes westphaliennes est-il signé ?",a:"Les traités de Westphalie, signés à Münster et à Osnabrück",detail:"Déclenchée par la défenestration de Prague (1618), la guerre commence comme un conflit religieux dans le Saint-Empire et devient une lutte pour l'hégémonie européenne. Certaines régions allemandes perdent plus d'un tiers de leur population. Les traités de 1648 consacrent la souveraineté des États. La France en sort renforcée face aux Habsbourg."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel principe — « no taxation without representation » — résume la principale cause de la Révolution américaine de 1776 ?",a:"Le refus des colons d'être taxés par le Parlement britannique, où ils ne sont pas représentés",detail:"Le Stamp Act (1765) et les droits Townshend (1767) suscitent l'opposition des 13 colonies. Le Boston Tea Party (1773) précipite la rupture. La guerre éclate en 1775 et l'indépendance est proclamée le 4 juillet 1776. La France soutient les insurgés (La Fayette, Rochambeau), notamment par hostilité envers la Grande-Bretagne."},
{theme:"histoire",diff:"moyen",type:"q",q:"Par qui et à quelle date Charlemagne est-il couronné Empereur d'Occident, relançant l'idée d'un empire romain ?",a:"Par le pape Léon III, à Rome, le 25 décembre 800",detail:"Charlemagne (vers 742-748 – 814) conquiert la Lombardie, la Saxe et le nord de l'Espagne. Il encourage la réforme de l'écriture (minuscule caroline), fonde des écoles et unifie la monnaie. Après sa mort, l'empire est partagé entre ses petits-fils par le traité de Verdun (843), esquisse des futures France, Allemagne et Italie."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quelle infirmière britannique devient célèbre pendant la guerre de Crimée (1853-1856) pour avoir révolutionné les soins aux blessés ?",a:"Florence Nightingale",detail:"Première guerre couverte par des correspondants de presse et photographes. Florence Nightingale révolutionne les soins infirmiers à Scutari. Le télégraphe permet les premières dépêches en temps réel. La Russie perd et ses ambitions méditerranéennes sont bloquées. Le traité de Paris (1856) reconnaît pour la première fois l'Empire ottoman dans le concert européen."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel pays accorde le premier le droit de vote aux femmes au niveau national, et en quelle année ?",a:"La Nouvelle-Zélande, en 1893",detail:"Aux États-Unis, la convention de Seneca Falls (1848) lance la lutte. Au Royaume-Uni, Emmeline Pankhurst fonde la WSPU (1903), dont les militantes, les « suffragettes », multiplient actions spectaculaires et grèves de la faim. Les femmes votent en Australie dès 1902, en Finlande en 1906, au Royaume-Uni en 1918 (sous conditions), aux États-Unis en 1920 et en France en 1944."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quelles grandes colonies portugaises d'Afrique accèdent à l'indépendance en 1975, après la révolution des Œillets ?",a:"L'Angola et le Mozambique (ainsi que le Cap-Vert et Sao Tomé-et-Principe ; la Guinée-Bissau avait proclamé son indépendance en 1973)",detail:"Le Portugal menait depuis 1961 des guerres coloniales coûteuses en Angola, au Mozambique et en Guinée. Leur poids pousse l'armée à renverser la dictature en 1974. En Angola, l'indépendance débouche sur une longue guerre civile. Au-delà du cas portugais, la décolonisation fait passer l'ONU de 51 membres en 1945 à plus de 120 au début des années 1970."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quelle opération militaire du Pacte de Varsovie écrase le Printemps de Prague en août 1968 ?",a:"L'opération Danube (21 août 1968)",detail:"Alexander Dubček prône un « socialisme à visage humain » : liberté de la presse, réformes économiques, ouverture politique. Le 21 août 1968, des centaines de milliers de soldats du Pacte de Varsovie envahissent la Tchécoslovaquie. L'étudiant Jan Palach s'immole par le feu en janvier 1969. La « doctrine Brejnev » affirme le droit d'intervenir dans un pays socialiste menacé."},
{theme:"histoire",diff:"difficile",type:"q",q:"Vers quelle date et dans quelle région du monde la Révolution néolithique marque-t-elle le passage à l'agriculture ?",a:"Vers 10 000-9 000 av. J.-C., au Croissant fertile (Proche-Orient)",detail:"La domestication du blé, de l'orge, des moutons et des chèvres permet la sédentarisation, les surplus, la division du travail et l'essor des premiers grands villages (Jéricho, Çatal Höyük). L'agriculture apparaît aussi de manière indépendante en Chine, en Mésoamérique, dans les Andes et en Nouvelle-Guinée. Elle s'accompagne d'inégalités accrues et de nouvelles maladies transmises par les animaux."},
{theme:"histoire",diff:"difficile",type:"q",q:"En quelle année l'Empire Han s'effondre-t-il, et en combien de royaumes rivaux la Chine se divise-t-elle alors ?",a:"En 220 ; en trois royaumes (Wei, Shu et Wu)",detail:"La révolte des Turbans Jaunes (184) fragilise le pouvoir central. Les généraux se partagent l'empire. La Chine se divise en trois royaumes (Wei, Wu, Shu) puis en une mosaïque d'États. L'unification ne reviendra qu'avec les Sui (581) puis les Tang (618). Cette période de fragmentation enrichit cependant l'art bouddhique et la philosophie."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quelle ville de l'Empire Songhaï était au XVe siècle un grand centre du savoir islamique, abritant une université réputée ?",a:"Tombouctou, avec la mosquée-université de Sankoré",detail:"L'Empire songhaï, sous Sonni Ali puis l'askia Mohammed, domine le commerce transsaharien (or, sel, esclaves). Tombouctou attire des savants de tout le monde musulman ; des dizaines de milliers de manuscrits y ont été conservés. L'invasion marocaine (bataille de Tondibi, 1591) provoque l'effondrement de l'empire."},
{theme:"histoire",diff:"difficile",type:"q",q:"Dans combien de pays européens des soulèvements éclatent-ils simultanément en 1848, et quel philosophe écrit alors le Manifeste du Parti communiste ?",a:"Plus d'une cinquantaine de pays et territoires selon certains décomptes ; Karl Marx (avec Friedrich Engels)",detail:"Le « Printemps des peuples » commence à Paris (chute de Louis-Philippe). Les révolutions de 1848 associent libéralisme politique et nationalismes naissants. Presque toutes échouent : restauration des monarchies, répression hongroise par la Russie. Mais elles laissent des réformes durables (abolition du servage en Autriche, suffrage universel masculin en France)."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quel secrétaire d'État américain formule en 1899 la doctrine de la « Porte ouverte » réclamant l'égalité d'accès au marché chinois ?",a:"John Hay",detail:"John Hay, secrétaire d'État américain, lance cette politique en 1899. Elle reflète les intérêts commerciaux américains en Chine mais aussi une certaine idéologie anti-impérialiste. Elle échoue en pratique : la Chine reste divisée en zones d'influence. La révolte des Boxers (1900) et l'intervention des 8 puissances montrent la fragilité de la Chine impériale."},
{theme:"histoire",diff:"difficile",type:"q",q:"Lors de la nuit du 4 août 1789, quels deux ordres privilégiés renoncent volontairement à leurs droits féodaux devant l'Assemblée nationale ?",a:"La noblesse et le clergé",detail:"Dans un élan d'enthousiasme (peut-être calculé), les nobles proposent eux-mêmes d'abolir les droits seigneuriaux, la dîme, les exemptions fiscales. En quelques heures, tout l'édifice de l'Ancien Régime s'effondre légalement. Cette nuit prépare la Déclaration des droits de l'homme (26 août) et constitue la révolution sociale de 1789."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quelles cités grecques sont fondées comme colonies sur les rives de la Méditerranée occidentale entre le VIIIe et le VIe siècle av. J.-C. ?",a:"Notamment Marseille (Massalia), Naples (Neapolis), Syracuse, Tarente et Agrigente — plusieurs centaines de colonies au total, jusqu'à la mer Noire",detail:"La croissance démographique, les tensions politiques et la recherche de terres et de comptoirs poussent des groupes de colons à quitter leur cité. Chaque colonie reprend les institutions de sa métropole mais devient indépendante. Le sud de l'Italie et la Sicile forment la « Grande-Grèce ». En mer Noire, les Grecs fondent Olbia ou Byzance."},
{theme:"histoire",diff:"difficile",type:"q",q:"En combien de jours l'assassinat de François-Ferdinand à Sarajevo le 28 juin 1914 conduit-il à la guerre générale en Europe ?",a:"37 jours, de l'attentat du 28 juin à l'entrée en guerre du Royaume-Uni le 4 août 1914",detail:"L'assassinat de Sarajevo était un incident local gérable. Mais l'Autriche-Hongrie choisit d'humilier la Serbie, sachant que la Russie réagirait. Les plans militaires (Schlieffen pour l'Allemagne) ne laissent aucune souplesse. Chaque pays mobilise pour ne pas être pris de vitesse. L'historien Christopher Clark les décrit comme des « somnambules » marchant vers le gouffre."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quels trois dirigeants se réunissent à Yalta en février 1945 pour organiser l'après-guerre, et quel accord controversé y est conclu sur l'Europe de l'Est ?",a:"Roosevelt, Churchill et Staline ; les accords sur la Pologne, dont les frontières sont déplacées vers l'ouest et le gouvernement laissé sous influence soviétique",detail:"En février 1945, les « Trois Grands » se retrouvent en Crimée. Ils décident du partage de l'Allemagne en zones d'occupation, préparent l'ONU et obtiennent l'engagement soviétique d'entrer en guerre contre le Japon. La Déclaration sur l'Europe libérée promet des élections libres, que Staline ne respecte pas. L'idée d'un « partage du monde à Yalta » relève en partie du mythe, mais la conférence est souvent associée aux débuts de la guerre froide."},
{theme:"histoire",diff:"facile",type:"q",q:"Quelle bataille de 1453, victoire française, met fin à la guerre de Cent Ans ?",a:"La bataille de Castillon",detail:"L'artillerie des frères Bureau écrase l'armée anglaise de John Talbot près de Bordeaux, qui tombe peu après. Les Anglais ne conservent sur le continent que Calais (jusqu'en 1558). La guerre de Cent Ans (1337-1453) est une succession de conflits entrecoupés de trêves, marquée par Crécy, Poitiers, Azincourt et l'intervention de Jeanne d'Arc (1429)."},
{theme:"histoire",diff:"facile",type:"q",q:"Quel ouvrage Jules César consacre-t-il au récit de sa conquête de la Gaule ?",a:"Les Commentaires sur la guerre des Gaules (De bello Gallico)",detail:"En sept livres (un huitième est ajouté par son lieutenant Hirtius), César raconte ses campagnes de 58 à 52 av. J.-C., jusqu'à la reddition de Vercingétorix à Alésia. Écrit à la troisième personne dans un style sobre, le texte sert aussi sa propagande politique à Rome. La romanisation de la Gaule apporte ensuite routes, villes et latin, ancêtre du français."},
{theme:"histoire",diff:"moyen",type:"q",q:"Dans quel traité de 1763 la France cède-t-elle le Canada à la Grande-Bretagne, à l'issue de la Guerre de Sept Ans ?",a:"Le traité de Paris (1763)",detail:"Le renversement des alliances de 1756 unit la France et l'Autriche contre la Prusse et la Grande-Bretagne. On se bat en Europe, en Amérique du Nord (guerre de la Conquête), en Inde (Plassey, 1757) et aux Caraïbes. La France perd la Nouvelle-France et l'essentiel de ses positions en Inde. Ce revers nourrit la volonté de revanche qui la pousse à soutenir la révolution américaine."},
{theme:"histoire",diff:"moyen",type:"q",q:"Combien de Juifs d'Europe sont assassinés lors de la Shoah, et quel camp est le plus meurtrier ?",a:"Environ 6 millions ; Auschwitz-Birkenau, où environ un million de Juifs sont assassinés",detail:"Après le début de l'invasion de l'URSS, les Einsatzgruppen fusillent plus d'un million de Juifs à l'Est. La conférence de Wannsee (janvier 1942) coordonne la « Solution finale » : déportations et camps d'extermination (Auschwitz-Birkenau, Treblinka, Belzec, Sobibor, Chelmno, Majdanek). Environ deux tiers des Juifs d'Europe sont assassinés. Le procès de Nuremberg consacre la notion de crime contre l'humanité."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel philosophe des Lumières publie en 1763 le Traité sur la tolérance, à la suite de l'affaire Calas ?",a:"Voltaire",detail:"Le protestant toulousain Jean Calas, accusé à tort d'avoir tué son fils pour l'empêcher de se convertir, est roué vif en 1762. Voltaire mène campagne et obtient sa réhabilitation en 1765. Le Traité dénonce le fanatisme religieux. Avec Montesquieu, Rousseau, Diderot et d'Alembert, les philosophes des Lumières défendent la raison, la tolérance et les libertés."},
{theme:"histoire",diff:"difficile",type:"q",q:"Combien d'exécutions officielles la Terreur (1793-1794) fait-elle, et comment prend-elle fin ?",a:"Environ 17 000 condamnations à mort, dont quelque 2 600 à Paris ; elle prend fin avec la chute de Robespierre le 9 Thermidor an II (27 juillet 1794)",detail:"La France est en guerre avec une grande partie de l'Europe et déchirée par des insurrections (Vendée). Le Comité de salut public, dont Robespierre est la figure majeure, et le Tribunal révolutionnaire frappent aristocrates, girondins, prêtres réfractaires et « suspects ». Avec les morts en prison et les exécutions sommaires, le bilan total atteint plusieurs dizaines de milliers de victimes. Robespierre est guillotiné le lendemain de sa chute."},
{theme:"histoire",diff:"difficile",type:"q",q:"Quelles deux grandes cités de la civilisation de l'Indus (2600-1900 av. J.-C.) ont été redécouvertes par les archéologues au XXe siècle ?",a:"Mohenjo-daro et Harappa",detail:"Ces villes abritaient des dizaines de milliers d'habitants, avec un urbanisme en damier, des égouts et des bains publics. L'écriture de l'Indus, quelque 400 signes, reste indéchiffrée. La civilisation décline vers 1900 av. J.-C. ; les causes évoquées sont surtout climatiques et hydrologiques (sécheresse, déplacement des cours d'eau), l'hypothèse d'une invasion aryenne étant largement abandonnée."},
{theme:"histoire",diff:"difficile",type:"q",q:"En quelle année Samuel Morse envoie-t-il le premier message télégraphique, et entre quelles deux villes ?",a:"En 1844, entre Washington et Baltimore (« What hath God wrought »)",detail:"Le télégraphe électrique, le premier câble transatlantique durable (1866) et le téléphone (Bell, 1876) bouleversent la vitesse de l'information. Avant le câble, une nouvelle traversait l'Atlantique en une dizaine de jours ; elle le fait désormais en quelques minutes. Les agences de presse (Havas, 1835 ; Reuters, 1851) prospèrent grâce à ce réseau."},
{theme:"histoire",diff:"moyen",type:"q",q:"Quel document signe-t-on en juillet 1953 pour suspendre les combats en Corée, et pourquoi n'est-ce pas un traité de paix ?",a:"Un armistice, signé à Panmunjeom le 27 juillet 1953 ; il suspend les combats sans les terminer juridiquement, et aucun traité de paix n'a été signé depuis",detail:"La Corée du Nord envahit le Sud le 25 juin 1950. Truman obtient un mandat de l'ONU, l'URSS boycottant alors le Conseil de sécurité. La Chine entre en guerre quand les forces de MacArthur approchent du Yalu. L'armistice, que la Corée du Sud n'a pas signé, fixe une ligne de démarcation proche du 38e parallèle."},
// NOUVELLES CARTES GEO (92 cartes pour atteindre 100),
{theme:"geo",diff:"facile",type:"q",q:"Quelle est la capitale de la France ?",a:"Paris",detail:"Fondée par les Parisii (tribu gauloise) sur une île de la Seine, Paris devient la principale résidence des rois capétiens à partir du Xe siècle. Elle compte environ 2,1 millions d'habitants intra-muros et plus de 12 millions en Île-de-France. Kinshasa la dépasse aujourd'hui comme plus grande ville francophone du monde."},
{theme:"geo",diff:"facile",type:"q",q:"Quel est le plus grand océan du monde ?",a:"L'océan Pacifique",detail:"Le Pacifique couvre 165 millions de km² — plus que toutes les terres émergées réunies. Il contient plus de la moitié de l'eau des océans mondiaux. La fosse des Mariannes (Challenger Deep, 10 935 m) en est le point le plus profond."},
{theme:"geo",diff:"facile",type:"q",q:"Quelle chaîne de montagnes sépare l'Europe de l'Asie ?",a:"L'Oural (en Russie)",detail:"Longue de 2 500 km, cette chaîne ancienne et érodée est la frontière géographique Europe-Asie. Elle est complétée au sud par la mer Caspienne, le Caucase et la mer Noire. La Russie s'étend sur les deux continents."},
{theme:"geo",diff:"facile",type:"q",q:"Quelle est la capitale du Brésil ?",a:"Brasília",detail:"Brasília, inaugurée en 1960, fut construite en 41 mois en plein cerrado (savane) pour déplacer la capitale de Rio. Conçue par Oscar Niemeyer (architecte) et Lúcio Costa (urbaniste) en forme d'avion ou d'oiseau. Classée au patrimoine UNESCO en 1987."},
{theme:"geo",diff:"facile",type:"q",q:"Quel est le plus grand désert du monde ?",a:"L'Antarctique (environ 14 millions de km²)",detail:"Un désert se définit par la faiblesse des précipitations (moins de 250 mm/an), pas par la chaleur. L'Antarctique est le plus grand désert du monde, et le plus grand désert froid. Le Sahara (environ 9,2 millions de km²) est le plus grand désert chaud ; il s'est étendu d'environ 10 % au cours du XXe siècle."},
{theme:"geo",diff:"facile",type:"q",q:"Combien de pays composent le continent africain ?",a:"54 pays reconnus par l'ONU",detail:"L'Afrique est le continent qui compte le plus de pays. Le plus récent est le Soudan du Sud (2011). Le Nigeria (environ 230 millions d'habitants) est le plus peuplé, l'Algérie (environ 2,4 millions de km²) le plus vaste. Le Sahara occupe près de 30 % de la superficie du continent."},
{theme:"geo",diff:"facile",type:"q",q:"Quel détroit sépare l'Amérique du Nord de la Russie ?",a:"Le détroit de Béring (environ 82 km au plus étroit)",detail:"Ce détroit peu profond (50 m) entre l'Alaska et la Sibérie était un pont terrestre (Béringie) pendant les glaciations, permettant les migrations humaines vers l'Amérique. Par temps clair, on peut voir les deux côtes depuis les îles Diomède, situées en son centre."},
{theme:"geo",diff:"facile",type:"q",q:"Quelle est la montagne la plus haute du monde ?",a:"L'Everest (8 849 m), dans l'Himalaya",detail:"Situé à la frontière Népal-Tibet, l'Everest (Sagarmatha en népalais, Chomolungma en tibétain) a été gravi pour la première fois le 29 mai 1953 par Tenzing Norgay et Edmund Hillary. La mesure exacte de 8 849 m a été officialisée par la Chine et le Népal en 2020."},
{theme:"geo",diff:"facile",type:"q",q:"Quel fleuve traverse Paris et Rouen avant de se jeter dans la Manche ?",a:"La Seine (environ 775 km)",detail:"La Seine prend sa source à Source-Seine (Côte-d'Or), sur le plateau de Langres, et se jette dans la Manche par un estuaire entre Le Havre et Honfleur. Ses berges parisiennes sont inscrites au patrimoine mondial de l'UNESCO (1991). Ses principaux affluents sont l'Yonne, la Marne et l'Oise."},
{theme:"geo",diff:"facile",type:"q",q:"Quel pays est à la fois le plus grand producteur et consommateur de pétrole au monde ?",a:"Les États-Unis (premier producteur depuis 2018, devant l'Arabie saoudite et la Russie)",detail:"Grâce à la révolution du pétrole de schiste (fracturation hydraulique), les États-Unis sont redevenus le premier producteur mondial en 2018. Ils produisent environ 13 millions de barils de brut par jour et en consomment près de 20 millions, tous produits pétroliers confondus."},
{theme:"geo",diff:"facile",type:"q",q:"Quelle mer se trouve entre l'Europe et l'Afrique du Nord ?",a:"La mer Méditerranée",detail:"La mer Méditerranée (environ 2,5 millions de km²) est presque fermée, reliée à l'Atlantique par le détroit de Gibraltar. Elle borde une vingtaine de pays. Les Romains l'appelaient « mare nostrum » (« notre mer »). Elle est plus salée que l'Atlantique, car l'évaporation y dépasse les apports des fleuves et des pluies."},
{theme:"geo",diff:"facile",type:"q",q:"Quelle ville est l'agglomération la plus peuplée du monde hispanophone ?",a:"Mexico (plus de 20 millions d'habitants dans l'agglomération)",detail:"Mexico est construite sur les ruines de Tenochtitlan, capitale aztèque, sur le lit de l'ancien lac Texcoco. Les sols argileux et le pompage des nappes provoquent un affaissement qui atteint plusieurs dizaines de centimètres par an dans certains quartiers. La ville est à environ 2 240 m d'altitude. Seule São Paulo rivalise avec elle en Amérique latine."},
{theme:"geo",diff:"moyen",type:"q",q:"Quels sont les cinq pays les plus peuplés du monde ?",a:"Inde, Chine, États-Unis, Indonésie, Pakistan (ordre 2024)",detail:"L'Inde a dépassé la Chine en 2023 (environ 1,43 milliard d'habitants contre 1,41). Suivent les États-Unis (environ 335 millions), l'Indonésie (environ 280 millions) et le Pakistan (environ 240 millions). Ensemble, ces 5 pays représentent environ 45 % de la population mondiale."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle est la différence entre un État, une nation et un pays ?",a:"L'État est une entité politique (gouvernement, territoire, population) ; la nation est un peuple partageant une identité ; le pays désigne couramment les deux",detail:"Un État multinational : l'URSS, qui regroupait de nombreuses nationalités. Une nation sans État : les Kurdes. Un État-nation proche de l'idéal : l'Islande ou la Corée du Sud. La distinction est essentielle pour comprendre les conflits ethniques et les mouvements indépendantistes."},
{theme:"geo",diff:"moyen",type:"q",q:"Quels pays asiatiques ont le plus bénéficié de la mondialisation économique depuis les années 1980, multipliant leur PIB par dix en quelques décennies ?",a:"La Chine, la Corée du Sud, Taïwan et Singapour, puis le Vietnam",detail:"En volume, le PIB chinois a été multiplié par environ 40 depuis 1980, grâce à l'ouverture commerciale et aux investissements étrangers. Singapour, la Corée du Sud et Taïwan sont devenus des pays riches en une génération. La mondialisation a aussi creusé les inégalités à l'intérieur des pays développés (désindustrialisation des régions ouvrières)."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle catastrophe du 26 décembre 2004, provoquée par le déplacement de la plaque indo-australienne, tue plus de 220 000 personnes dans l'océan Indien ?",a:"Le tsunami de l'océan Indien, déclenché par un séisme de magnitude 9,1 au large de Sumatra",detail:"Le séisme s'est produit dans la zone de subduction où la plaque indienne plonge sous la plaque de Birmanie. Les vagues ont frappé l'Indonésie, le Sri Lanka, l'Inde, la Thaïlande et jusqu'aux côtes africaines, faisant environ 230 000 morts. Plus au nord, la collision de la plaque indienne avec l'Eurasie soulève l'Himalaya et provoque des séismes comme celui du Népal (2015, environ 9 000 morts)."},
{theme:"geo",diff:"moyen",type:"q",q:"Quels sont les pays membres du BRICS et que représentent-ils ?",a:"Brésil, Russie, Inde, Chine (2009) et Afrique du Sud (2010), rejoints par l'Égypte, l'Éthiopie, l'Iran et les Émirats arabes unis (2024), puis l'Indonésie (2025)",detail:"Les BRICS représentent près de la moitié de la population mondiale et environ 40 % du PIB mondial en parité de pouvoir d'achat. L'Arabie saoudite, invitée en 2023, entretient un statut ambigu ; l'Argentine a décliné l'invitation. Le groupe a créé en 2024 une catégorie de « pays partenaires ». Il se présente comme une alternative aux institutions dominées par l'Occident (FMI, Banque mondiale)."},
{theme:"geo",diff:"moyen",type:"q",q:"Quel pays possède le plus de frontières terrestres avec d'autres pays ?",a:"La Chine (14 pays voisins), ex-aequo avec la Russie (14 pays voisins)",detail:"La Chine partage ses frontières avec la Russie, Mongolie, Kazakhstan, Kirghizstan, Tadjikistan, Afghanistan, Pakistan, Inde, Népal, Bhoutan, Myanmar, Laos, Vietnam et Corée du Nord. La Russie borde 14 pays différents, de la Norvège à la Corée du Nord."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle est la particularité géographique de la mer Morte ?",a:"C'est le point le plus bas des terres émergées (environ −435 m, en baisse), avec une salinité d'environ 34 % qui empêche toute vie de poissons et de plantes et permet de flotter sans effort",detail:"Bordée par Israël, la Jordanie et la Cisjordanie, la mer Morte perd environ 1 m de niveau par an en raison des prélèvements d'eau sur le Jourdain et de l'évaporation. Seuls des micro-organismes y survivent. Ses eaux riches en magnésium, potassium et brome attirent les curistes depuis l'Antiquité."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelles marchandises circulaient sur la route de la soie, qui reliait la Chine à la Méditerranée ?",a:"La soie, mais aussi les épices, la porcelaine, le thé, les métaux précieux, les chevaux et le verre",detail:"La route de la soie n'est pas une route unique mais un réseau de pistes de plus de 6 000 km à travers l'Asie centrale (Samarcande, Kachgar, Tourfan), actif d'environ 100 av. J.-C. au XVe siècle. Y circulaient aussi des idées, des religions (le bouddhisme vers la Chine, l'islam vers l'Asie centrale) et des maladies (la peste). La Chine a repris ce nom pour son initiative « Ceinture et Route » (2013)."},
{theme:"geo",diff:"moyen",type:"q",q:"Quel est le pays le plus densément peuplé au monde ?",a:"Monaco (environ 19 000 hab./km²) ; parmi les États plus grands, Singapour (environ 8 000 hab./km²)",detail:"Monaco, 2 km², est le plus petit État souverain du monde après le Vatican, et le plus densément peuplé. Singapour, île-État d'environ 735 km², abrite près de 6 millions d'habitants."},
{theme:"geo",diff:"moyen",type:"q",q:"En quelle année la population urbaine mondiale dépasse-t-elle pour la première fois la population rurale ?",a:"En 2007 (selon les estimations de l'ONU de l'époque)",detail:"En 1800, environ 3 % de l'humanité vivait en ville. En 2025, l'ONU a changé de méthode de mesure : selon ses nouvelles estimations, Jakarta (près de 42 millions d'habitants) est la plus grande agglomération du monde, devant Dhaka et Tokyo. Les définitions de « ville » variant, les pourcentages d'urbanisation diffèrent selon les méthodes."},
{theme:"geo",diff:"moyen",type:"q",q:"Quel pourcentage des tremblements de terre mondiaux se produisent le long de l'arc de feu du Pacifique ?",a:"Environ 90 %",detail:"La « ceinture de feu » borde l'océan Pacifique sur environ 40 000 km, de la Nouvelle-Zélande au Japon, au Kamtchatka, à l'Alaska, à la Californie et jusqu'aux Andes. Elle concentre les zones de subduction (plaques plongeant sous d'autres) et environ 75 % des volcans actifs. Le Japon, l'Indonésie, les Philippines et le Chili sont parmi les pays les plus exposés."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle ville est la plus haute capitale du monde ?",a:"La Paz (Bolivie) à 3 640 m d'altitude (siège de gouvernement) — Sucre est la capitale constitutionnelle",detail:"La Paz occupe une cuvette au bord de l'Altiplano andin. L'altitude provoque le soroche (mal des montagnes) chez les visiteurs non acclimatés. Son réseau de téléphériques, Mi Teleférico, est le plus grand réseau de téléphériques urbains du monde. Sucre, à environ 2 800 m, est la capitale constitutionnelle, mais La Paz abrite le gouvernement et le Parlement."},
{theme:"geo",diff:"moyen",type:"q",q:"Combien de personnes parlent français dans le monde, et sur quel continent se trouve désormais la majorité des francophones ?",a:"Environ 320 millions de locuteurs (OIF, 2022), dont plus de 60 % en Afrique",detail:"Le français est parlé sur les 5 continents. L'Afrique concentre plus de 60 % des locuteurs quotidiens, et cette part augmente avec la croissance démographique africaine. Le français est langue officielle de 29 pays et langue de travail de nombreuses organisations internationales (ONU, UE, CIO)."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle forêt est surnommée « le poumon de la planète », et pourquoi l'expression est-elle trompeuse ?",a:"L'Amazonie — elle consomme presque autant d'oxygène qu'elle en produit ; son rôle majeur est de stocker le carbone et de réguler le climat",detail:"La forêt amazonienne couvre environ 5,5 millions de km², dont 60 % au Brésil, et abrite environ 10 % des espèces connues. Elle stocke de 150 à 200 milliards de tonnes de carbone et produit une grande part de ses propres pluies par évapotranspiration. La déforestation a culminé à plus de 13 000 km² par an au Brésil en 2021, avant de reculer. Une partie de la forêt est devenue émettrice nette de carbone."},
{theme:"geo",diff:"difficile",type:"q",q:"Comment appelle-t-on en biogéographie la zone de transition entre deux biomes différents, réputée pour sa biodiversité élevée ?",a:"Un écotone",detail:"Les écotones (lisière forêt-prairie, zone intertidale, mangrove) abritent souvent une biodiversité plus riche que les deux milieux adjacents. Mais en biologie de la conservation, les effets de lisière sont aussi négatifs : les fragments de forêt ont proportionnellement plus de lisière, exposée aux perturbations humaines."},
{theme:"geo",diff:"difficile",type:"q",q:"Quelle part des terres émergées de l'hémisphère Nord le pergélisol couvre-t-il, et quel risque climatique son dégel représente-t-il ?",a:"Environ 24 % ; son dégel libère du CO₂ et du méthane, ce qui accélère le réchauffement",detail:"Le pergélisol (permafrost) est un sol gelé en permanence, parfois sur plusieurs centaines de mètres, en Sibérie, en Alaska, au Canada et au Tibet. Il contient environ deux fois plus de carbone que l'atmosphère. Le méthane (CH₄) a un pouvoir de réchauffement environ 30 fois supérieur à celui du CO₂ sur un siècle. Ce mécanisme peut devenir une boucle de rétroaction difficile à arrêter."},
{theme:"geo",diff:"difficile",type:"q",q:"Il y a combien de millions d'années l'isthme de Panama s'est-il formé, séparant l'Atlantique du Pacifique et modifiant les courants océaniques ?",a:"Il y a environ 3 millions d'années",detail:"La fermeture de l'isthme a séparé l'Atlantique du Pacifique et renforcé le Gulf Stream, ce qui a peut-être favorisé les glaciations de l'hémisphère Nord. Elle a permis aux espèces des deux Amériques de se mélanger (Grand Échange interaméricain). Certains géologues proposent une fermeture plus ancienne. Le canal de Panama (1914, environ 80 km) relie de nouveau les deux océans."},
{theme:"geo",diff:"difficile",type:"q",q:"Pourquoi la projection de Mercator est-elle controversée, et quelle grande île y paraît aussi vaste que l'Afrique ?",a:"Elle agrandit fortement les hautes latitudes ; le Groenland y paraît aussi grand que l'Afrique, qui est pourtant environ 14 fois plus vaste",detail:"Les navigateurs utilisent la projection de Mercator (1569) car les lignes de cap constant y sont droites. Mais elle donne une image biaisée du monde : l'Europe et l'Amérique du Nord paraissent plus grandes qu'elles ne le sont. La projection de Gall-Peters (1974) conserve les surfaces au détriment des formes et a déclenché un débat sur la représentation cartographique."},
{theme:"geo",diff:"difficile",type:"q",q:"Qui formule en 1933 la théorie des lieux centraux expliquant la hiérarchie des villes, et dans quel pays mène-t-il son étude ?",a:"Walter Christaller, à partir du sud de l'Allemagne",detail:"Christaller propose que les villes s'organisent en réseaux d'hexagones emboîtés selon le niveau des services qu'elles offrent : les villes d'ordre supérieur, rares, desservent de vastes aires ; les bourgs, nombreux, de petites aires. Sa théorie explique l'espacement régulier des villes de même rang. Christaller travailla ensuite pour les planificateurs nazis de la colonisation de l'Est."},
{theme:"geo",diff:"difficile",type:"q",q:"Quelle route maritime arctique, longtemps gelée, est devenue partiellement navigable en été du fait du réchauffement climatique ?",a:"Le passage du Nord-Ouest",detail:"Cette route relie l'Atlantique au Pacifique par l'archipel arctique canadien. Recherchée depuis le XVIe siècle, elle fut franchie pour la première fois par Amundsen (1903-1906). Elle raccourcit de plusieurs milliers de km le trajet Europe-Asie. Sa navigabilité croissante oppose le Canada, qui la considère comme ses eaux intérieures, aux États-Unis, qui y voient un détroit international."},
{theme:"geo",diff:"difficile",type:"q",q:"À quelle phase de la transition démographique se trouve l'Afrique subsaharienne, caractérisée encore par une forte natalité ?",a:"Entre les phases 2 et 3 : la mortalité a fortement baissé, mais la natalité reste élevée",detail:"Le modèle de transition démographique décrit le passage d'une natalité et d'une mortalité élevées à une natalité et une mortalité faibles. L'Europe l'a traversée aux XIXe et XXe siècles. L'Afrique subsaharienne, avec environ 4,3 enfants par femme, connaît une forte croissance : sa population, d'environ 1,2 milliard en 2023, pourrait dépasser 3 milliards en 2100 selon l'ONU."},
{theme:"geo",diff:"difficile",type:"q",q:"Pourquoi la mer des Sargasses est-elle géographiquement unique parmi toutes les mers du monde ?",a:"Seule mer sans côtes, délimitée uniquement par des courants océaniques dans l'Atlantique Nord — berceau des anguilles européennes et américaines",detail:"La mer des Sargasses est délimitée par le Gulf Stream (ouest), le courant des Açores (nord), le courant des Canaries (est) et le courant nord-équatorial (sud). Les algues flottantes (sargasses) y forment un écosystème unique. Les anguilles d'Europe et d'Amérique y pondent puis meurent ; leurs larves dérivent sur des milliers de km pour rejoindre les rivières."},
{theme:"geo",diff:"difficile",type:"q",q:"Quels sont les deux pays doublement enclavés, c'est-à-dire entourés uniquement de pays sans accès à la mer ?",a:"Ouzbékistan et Liechtenstein",detail:"L'Ouzbékistan est entouré du Kazakhstan, du Turkménistan, de l'Afghanistan, du Tadjikistan et du Kirghizstan, tous sans façade maritime (la mer Caspienne étant un lac fermé). Le Liechtenstein est entouré de l'Autriche et de la Suisse. Pour l'Ouzbékistan, ce double enclavement renchérit fortement les exportations."},
{theme:"geo",diff:"difficile",type:"q",q:"Quel pourcentage du commerce maritime mondial transite par le détroit de Malacca, entre la Malaisie et Sumatra ?",a:"Environ un quart du commerce maritime mondial",detail:"Long d'environ 900 km entre la Malaisie et Sumatra, le détroit de Malacca relie l'océan Indien à la mer de Chine méridionale. Son chenal navigable se réduit à moins de 3 km au large de Singapour. Environ 80 % des importations de pétrole de la Chine y transitent : c'est son « dilemme de Malacca ». Pékin développe des alternatives terrestres (oléoduc via le Myanmar, corridor via le Pakistan)."},
{theme:"geo",diff:"difficile",type:"q",q:"Quels sont les trois grands ensembles géoculturels de l'Océanie, et quelle est la signification étymologique de leurs noms ?",a:"Mélanésie (« îles noires »), Micronésie (« petites îles ») et Polynésie (« nombreuses îles »)",detail:"Ces noms ont été proposés par Dumont d'Urville en 1831. Mélanésie : Papouasie-Nouvelle-Guinée, Fidji, Vanuatu, îles Salomon, Nouvelle-Calédonie. Micronésie : Guam, Palaos, Mariannes, Kiribati. Polynésie : Hawaï, Tahiti, Tonga, Samoa, Nouvelle-Zélande. Les Polynésiens ont peuplé le Pacifique en pirogues, en naviguant aux étoiles, à la houle et aux oiseaux."},
{theme:"geo",diff:"difficile",type:"q",q:"Quel fleuve partagé entre l'Éthiopie, le Soudan et l'Égypte est au cœur d'une tension géopolitique majeure depuis la construction du barrage de la Renaissance ?",a:"Le Nil (le Nil Bleu prend sa source en Éthiopie)",detail:"Le Grand barrage de la Renaissance (GERD), achevé par l'Éthiopie en 2025, inquiète l'Égypte, qui dépend du Nil pour l'essentiel de son eau, et le Soudan. D'autres bassins sont source de tensions, comme celui du Jourdain (Israël, Jordanie, Palestiniens). Plus de 2 milliards de personnes n'ont pas accès à une eau potable gérée en toute sécurité. L'ONU reconnaît l'accès à l'eau comme un droit humain depuis 2010."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle est la différence entre climat et météo ?",a:"La météo décrit les conditions atmosphériques à court terme (heures, jours) ; le climat est la moyenne des conditions sur 30 ans dans une région",detail:"On dit souvent : « le climat, c'est ce qu'on attend ; la météo, c'est ce qu'on reçoit. » Le changement climatique modifie les moyennes et les extrêmes (fréquence des canicules, intensité des ouragans) sans supprimer la variabilité météo quotidienne."},
{theme:"geo",diff:"moyen",type:"q",q:"Quel continent n'a aucun État souverain et aucun habitant permanent ?",a:"L'Antarctique",detail:"L'Antarctique est régi par le Traité sur l'Antarctique (1959), qui compte aujourd'hui plus de 50 Parties ; il gèle les revendications territoriales et réserve le continent à la paix et à la recherche. De 1 000 (hiver) à 5 000 (été) personnes y séjournent temporairement. Le Protocole de Madrid (1991) interdit toute exploitation minière."},
{theme:"geo",diff:"moyen",type:"q",q:"À quelle latitude se situent le tropique du Cancer et le tropique du Capricorne, et quelle zone climatique délimitent-ils ?",a:"Environ 23°26' de latitude nord et sud ; ils délimitent la zone intertropicale",detail:"Entre les deux tropiques, le soleil passe au zénith au moins une fois par an. Le tropique du Cancer traverse le Mexique, l'Algérie, l'Égypte, l'Arabie saoudite, l'Inde et la Chine ; celui du Capricorne, le Chili, l'Argentine, le Brésil, l'Afrique du Sud, Madagascar et l'Australie."},
{theme:"geo",diff:"moyen",type:"q",q:"Quel est le point le plus à l'est de l'Europe ?",a:"Dans l'Oural polaire (Russie) pour l'Europe continentale",detail:"La limite conventionnelle entre l'Europe et l'Asie suit l'Oural, le fleuve Oural, la mer Caspienne et le Caucase ; elle varie selon les géographes. Si l'on compte les îles, l'extrémité orientale est en Nouvelle-Zemble. Pour l'Union européenne, le point le plus oriental du continent se trouve en Finlande ; Chypre, plus à l'est, est géographiquement en Asie."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle est la particularité de la Nouvelle-Zélande en termes de biodiversité ?",a:"Une faune dominée par les oiseaux, souvent incapables de voler (kiwi, kakapo), en l'absence de mammifères terrestres, à l'exception des chauves-souris",detail:"Isolée depuis environ 80 millions d'années, la Nouvelle-Zélande est devenue le domaine des oiseaux : kiwi, kakapo, takahé, et jadis le moa géant. L'arrivée des Maoris (vers 1280), puis la colonisation européenne au XIXe siècle, ont provoqué de nombreuses extinctions. Le kiwi est devenu le symbole national."},
