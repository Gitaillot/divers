{theme:"litterature",focus:"allemagne",diff:"moyen",type:"q",q:"Quel écrivain allemand, auteur du Tambour et du Chat et la Souris, a reçu le Prix Nobel en 1999 ?",a:"Günter Grass",detail:"Le Tambour (1959), premier volume de la Trilogie de Dantzig, narre la Seconde Guerre mondiale du point de vue d'Oskar, un enfant qui décide de ne plus grandir. Grass, longtemps voix morale de l'Allemagne contre le nazisme, avouera en 2006 avoir été membre des Waffen-SS à 17 ans."},
{theme:"litterature",focus:"allemagne",diff:"difficile",type:"q",q:"Qu'est-ce que le Sturm und Drang, et quels auteurs en sont les figures principales ?",a:"Mouvement littéraire allemand des années 1760-1780 célébrant l'émotion, la nature et la rébellion contre les règles classiques — Goethe, Schiller, Herder",detail:"Le Sturm und Drang (« Tempête et Élan »), du nom d'une pièce de Klinger (1776), préfigure le romantisme : culte du génie individuel, nature miroir de l'âme, rejet du rationalisme des Lumières. Les Souffrances du jeune Werther de Goethe (1774) et Les Brigands de Schiller (1781) en sont les œuvres emblématiques."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel film de Steven Spielberg (1975) sur un requin tueur inventa le concept de 'blockbuster' hollywoodien ?",a:"Les Dents de la mer (Jaws)",detail:"Jaws est le premier film à atteindre 100 millions de dollars de recettes, lançant l'ère du blockbuster estival. Spielberg tourne avec un requin mécanique défaillant (surnommé 'Bruce'), ce qui l'oblige à le montrer le moins possible — ce qui renforce le suspense. Cinq décennies après, sa bande-son (John Williams) reste iconique."},
{theme:"popculture",diff:"facile",type:"q",q:"Dans quelle franchise de films de super-héros trouve-t-on Iron Man, Captain America et les Avengers ?",a:"Le Marvel Cinematic Universe (MCU)",detail:"Lancé en 2008 avec Iron Man, le MCU est la franchise la plus rentable de l'histoire du cinéma, avec plus de 30 milliards de dollars de recettes mondiales. Avengers: Endgame (2019) est le 2e plus gros succès de l'histoire derrière Avatar. Kevin Feige en dirige la production depuis l'origine."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel film d'animation Pixar (1995) met en scène des jouets qui s'animent en l'absence de leur propriétaire ?",a:"Toy Story",detail:"Premier long métrage entièrement réalisé en images de synthèse, Toy Story révolutionne l'animation. Il lance une franchise à succès poursuivie pendant trois décennies. En version originale, Woody a la voix de Tom Hanks et Buzz l'Éclair celle de Tim Allen."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel film de James Cameron (1997) est longtemps resté le plus grand succès commercial de l'histoire du cinéma ?",a:"Titanic",detail:"Titanic dépasse 1,8 milliard de dollars de recettes à sa sortie et environ 2,2 milliards avec ses ressorties ; Avatar, du même Cameron, le dépasse en 2010. Le film remporte 11 Oscars. Leonardo DiCaprio et Kate Winslet deviennent des stars mondiales ; My Heart Will Go On, chanté par Céline Dion, est l'un des plus grands succès des années 1990."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel réalisateur japonais, cofondateur du Studio Ghibli, est l'auteur de Princesse Mononoké (1997) et du Voyage de Chihiro (2001) ?",a:"Hayao Miyazaki (né en 1941)",detail:"Le Voyage de Chihiro, longtemps le plus grand succès du cinéma japonais (jusqu'à Demon Slayer en 2020), remporte l'Ours d'or à Berlin et l'Oscar du meilleur film d'animation en 2003. Miyazaki obtient un second Oscar en 2024 pour Le Garçon et le Héron. Il est célèbre pour ses thèmes écologistes et pacifistes et ses héroïnes autonomes."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel cinéaste coréen remporte la Palme d'or à Cannes et l'Oscar du meilleur film en 2020 avec Parasite ?",a:"Bong Joon-ho (né en 1969)",detail:"Parasite est le premier film non anglophone à remporter l'Oscar du meilleur film. Satire acérée des inégalités sociales, il raconte la manipulation d'une famille riche par une famille pauvre. Bong Joon-ho avait déjà signé Memories of Murder, The Host et Snowpiercer — adapté en série Netflix."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle saga cinématographique inspirée d'un roman de J.R.R. Tolkien a remporté 11 Oscars dont celui du meilleur film en 2004 ?",a:"Le Seigneur des Anneaux : Le Retour du Roi (Peter Jackson, 2003)",detail:"La trilogie de Peter Jackson (2001-2003) est une prouesse technique et narrative. Le Retour du Roi remporte tous les Oscars pour lesquels il est nommé (11), record partagé avec Ben-Hur et Titanic. Tournée en Nouvelle-Zélande, la saga a transformé le tourisme du pays."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel film de Christopher Nolan (2010) explore les rêves dans des rêves et est devenu un phénomène culturel mondial ?",a:"Inception",detail:"Inception met en scène Dom Cobb (Leonardo DiCaprio), voleur qui s'infiltre dans les rêves pour extraire des informations. Le film questionne la nature de la réalité et se termine sur une toupie dont on ne sait si elle tombe. Sa musique (Hans Zimmer) et ses effets visuels (l'hôtel en apesanteur) restent des références."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quel film de Stanley Kubrick (1968), adapté d'Arthur C. Clarke, est considéré comme l'un des chefs-d'œuvre absolus du cinéma de science-fiction ?",a:"2001 : L'Odyssée de l'espace",detail:"Sans presque aucun dialogue, Kubrick représente l'évolution de l'humanité de la préhistoire à la rencontre avec une intelligence extraterrestre. Le monolithe noir, HAL 9000 et la séquence psychédélique finale sont entrés dans la mémoire collective. Le film préfigure l'IA, la solitude spatiale et le transhumanisme."},
{theme:"popculture",diff:"facile",type:"q",q:"Dans quelle série fantastique HBO (2011-2019), adaptée des romans de George R.R. Martin, des familles nobles se disputent le Trône de Fer ?",a:"Game of Thrones",detail:"Game of Thrones est l'une des séries les plus piratées de l'histoire et la série dramatique la plus récompensée aux Emmy Awards. Elle est connue pour tuer ses personnages principaux sans prévenir, brisant les codes narratifs habituels. La dernière saison (2019) a été vivement critiquée pour sa précipitation. Le préquel House of the Dragon a suivi en 2022."},
{theme:"popculture",diff:"facile",type:"q",q:"Quelle série américaine (2008-2013) sur un professeur de chimie qui devient dealer de drogue est considérée comme l'une des meilleures séries de l'histoire ?",a:"Breaking Bad",detail:"Walter White (Bryan Cranston), professeur de chimie atteint d'un cancer, fabrique de la méthamphétamine avec son ancien élève Jesse Pinkman. La série explore la transformation morale d'un homme ordinaire. Sa suite Better Call Saul (2015-2022) est aussi unanimement saluée."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle série sud-coréenne Netflix (2021) mettant en scène des jeux mortels est devenue la plus regardée de l'histoire de la plateforme ?",a:"Squid Game (오징어 게임)",detail:"Créée par Hwang Dong-hyuk, Squid Game cumule 1,65 milliard d'heures de visionnage en 28 jours. Elle propulse les séries coréennes sur la scène mondiale et pousse Netflix à investir massivement en Corée. Les saisons 2 (décembre 2024) et 3 (juin 2025) concluent l'histoire."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle série britannique (2001-2003), créée par Ricky Gervais et Stephen Merchant, a inspiré une version américaine devenue culte ?",a:"The Office (BBC)",detail:"The Office (BBC) est un faux documentaire sur la vie d'un bureau à Slough, dirigé par le pathétique David Brent (Gervais). Il ne compte que deux saisons et deux épisodes spéciaux. La version américaine (NBC, 2005-2013), avec Steve Carell, la dépasse en popularité et reste l'une des comédies les plus regardées en streaming."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle série d'animation américaine, diffusée depuis 1989, suit la famille Simpson et est la plus longue série animée de l'histoire de la télévision ?",a:"Les Simpson (The Simpsons)",detail:"Créée par Matt Groening, la série dépasse les 750 épisodes. Homer, Marge, Bart, Lisa et Maggie vivent à Springfield, ville fictive. Elle est célèbre pour ses supposées « prédictions » (comme la présidence de Donald Trump, évoquée en 2000), qui relèvent surtout de la coïncidence et du très grand nombre d'épisodes."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel groupe britannique, formé à Liverpool, est considéré comme le plus influent de l'histoire de la musique pop ?",a:"Les Beatles (1960-1970)",detail:"John Lennon, Paul McCartney, George Harrison et Ringo Starr ont vendu plus de 600 millions d'albums. Leur débarquement aux États-Unis en 1964 ('Beatlemania') transforme la culture mondiale. Sgt. Pepper's Lonely Hearts Club Band (1967) est souvent cité comme le meilleur album de l'histoire."},
{theme:"popculture",diff:"facile",type:"q",q:"Quelle chanteuse américaine, connue pour ses albums Red, 1989 et Folklore, est l'une des artistes les plus écoutées au monde ?",a:"Taylor Swift (née en 1989)",detail:"Le Eras Tour (2023-2024) de Taylor Swift est la tournée la plus lucrative de l'histoire, avec plus de 2 milliards de dollars de recettes. Elle détient le record de victoires dans la catégorie album de l'année aux Grammy Awards (4). Son influence s'étend à la culture pop, à l'économie des villes qu'elle visite et même au débat politique."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel chanteur jamaïcain, figure mondiale du reggae, a popularisé ce genre et est décédé en 1981 à 36 ans ?",a:"Bob Marley (1945-1981)",detail:"Bob Marley and the Wailers ont fait connaître le reggae et le mouvement rastafari au monde entier. Legend (1984), album posthume, est l'un des plus vendus de l'histoire. Ses chansons (No Woman No Cry, Redemption Song, One Love) restent des hymnes à la paix et à la résistance."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel album de Nirvana (1991) a popularisé le grunge et révolutionné la musique rock avec des titres comme Smells Like Teen Spirit ?",a:"Nevermind",detail:"Nevermind propulse Nirvana (Kurt Cobain, Krist Novoselic, Dave Grohl) de l'underground au sommet des charts mondiaux, détrônant Michael Jackson. Smells Like Teen Spirit devient l'hymne d'une génération. La mort de Kurt Cobain en 1994 met fin au groupe et fait de lui une figure du 'Club des 27'."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel rappeur américain, auteur de The Marshall Mathers LP et 8 Mile, est considéré comme l'un des artistes les plus vendus de l'histoire ?",a:"Eminem (Marshall Mathers, né en 1972)",detail:"Eminem est le rappeur blanc le plus vendu de l'histoire et l'artiste musical le plus vendu des années 2000. Ses textes autobiographiques, sa technique de flow et sa controverse permanente en font une figure centrale du hip-hop. 8 Mile (2002) lui vaut un Oscar pour la chanson Lose Yourself."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel duo français de musique électronique, formé par Thomas Bangalter et Guy-Manuel de Homem-Christo, a popularisé la French Touch dans les années 2000 ?",a:"Daft Punk (1993-2021)",detail:"Homework (1997) contient Around the World et Da Funk ; Discovery (2001), One More Time et Harder, Better, Faster, Stronger. Random Access Memories (2013), avec Get Lucky, remporte 5 Grammy Awards. Les deux membres se cachent derrière des casques de robots. Leur séparation est annoncée en 2021 par une vidéo intitulée Epilogue."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle chanteuse colombienne, auteure de Hips Don't Lie et de Waka Waka, l'hymne de la Coupe du monde 2010, est l'une des artistes latines les plus vendues de l'histoire ?",a:"Shakira (née en 1977)",detail:"Shakira Isabel Mebarak Ripoll mêle pop, rock, dancehall et musiques latines. Waka Waka (This Time for Africa) reste l'hymne de Coupe du monde le plus écouté. En 2023, sa chanson avec Bizarrap (#53) bat des records de streams mondiaux, réponse musicale à sa séparation de Gérard Piqué."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quelle chanteuse islandaise, connue pour ses œuvres mêlant art sonore et performance visuelle comme Homogenic et Vespertine, est considérée comme l'une des artistes les plus avant-gardistes du XXe siècle ?",a:"Björk (née en 1965)",detail:"Björk Guðmundsdóttir commence avec The Sugarcubes avant une carrière solo révolutionnaire. Ses albums (Debut, Post, Homogenic, Vespertine) mêlent musique électronique, orchestrale et expérimentale. Sa robe-cygne aux Oscars 2001 est l'un des moments de mode les plus mémorables de l'histoire."},
{theme:"popculture",diff:"facile",type:"q",q:"Quelle franchise de jeux vidéo de Nintendo, née en 1985, met en scène un plombier moustachu qui affronte un roi tortue pour sauver une princesse ?",a:"Super Mario (Nintendo)",detail:"Super Mario Bros. (1985) est l'un des jeux vidéo les plus vendus de l'histoire. La franchise approche le milliard d'exemplaires vendus, toutes séries confondues. Mario, créé par Shigeru Miyamoto, est la mascotte de Nintendo et la figure la plus reconnaissable du jeu vidéo ; le film d'animation de 2023 a dépassé 1,3 milliard de dollars de recettes."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel jeu de battle royale, sorti gratuitement en 2017, a dépassé les 350 millions de joueurs inscrits ?",a:"Fortnite (Epic Games)",detail:"Fortnite combine construction, tir et survie dans des parties de 100 joueurs. Son modèle gratuit, financé par la vente d'éléments cosmétiques (skins), a transformé l'économie du jeu vidéo. Des concerts virtuels (Travis Scott, Ariana Grande) y ont réuni des dizaines de millions de spectateurs."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle franchise de jeux vidéo de Rockstar Games, permettant d'évoluer librement dans des villes ouvertes inspirées de Miami, Los Angeles et New York, est l'une des plus vendues de l'histoire ?",a:"Grand Theft Auto (GTA)",detail:"GTA V (2013) s'est vendu à plus de 200 millions d'exemplaires, 2e jeu le plus vendu de tous les temps après Minecraft. Très attendu, GTA VI a été repoussé à plusieurs reprises. La série est controversée pour sa violence et son contenu adulte, mais reste une référence technique et narrative."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle franchise de jeux d'action-aventure de Nintendo met en scène Link, qui doit sauver la princesse Zelda de Ganon dans le royaume d'Hyrule ?",a:"The Legend of Zelda (Nintendo, 1986-...)",detail:"Créée par Shigeru Miyamoto et Takashi Tezuka, la série débute en 1986. Ocarina of Time (1998) est souvent cité comme l'un des plus grands jeux vidéo de l'histoire ; Breath of the Wild (2017) et Tears of the Kingdom (2023) renouvellent le jeu en monde ouvert. Link n'est pas un elfe mais un Hylien, peuple aux oreilles pointues. La musique de Koji Kondo a marqué des générations."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quel jeu vidéo indépendant de 2015, créé par Toby Fox seul, a marqué la culture geek par son refus de la violence, ses méta-références et sa communauté passionnée ?",a:"Undertale",detail:"Undertale permet de terminer l'aventure sans tuer aucun ennemi. Le jeu brise régulièrement le quatrième mur et récompense la bienveillance. Développé en 30 mois par un seul développeur pour 51 000 dollars de budget, il est devenu une référence sur Steam et a engendré l'une des fandoms les plus actives d'internet."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel manga de Masashi Kishimoto, mettant en scène un jeune ninja blond rêvant de devenir chef de son village, s'est vendu à plus de 250 millions d'exemplaires ?",a:"Naruto (1999-2014)",detail:"Naruto Uzumaki, rejeté par son village, rêve de devenir Hokage (chef des ninjas). La suite, Boruto, poursuit l'histoire. L'anime a été diffusé dans plus de 70 pays. Avec One Piece et Bleach, Naruto forme le trio des grandes séries shōnen des années 2000."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel manga d'Eiichiro Oda, commencé en 1997, est le manga le plus vendu de l'histoire avec plus de 500 millions d'exemplaires ?",a:"One Piece",detail:"One Piece suit Monkey D. Luffy, un garçon au corps élastique qui veut devenir le roi des pirates. Après plus de 1 100 chapitres, l'œuvre n'est toujours pas terminée. Son auteur détient le record Guinness du plus grand nombre d'exemplaires publiés pour une série de bande dessinée d'un seul auteur. Une adaptation en série live (Netflix, 2023) a aussi rencontré le succès."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel manga de Hajime Isayama (2009-2021) met en scène des géants mangeant les humains, contraints de vivre derrière des murailles, et a connu un succès mondial phénoménal ?",a:"L'Attaque des Titans (Shingeki no Kyojin)",detail:"L'Attaque des Titans a vendu plus de 110 millions d'exemplaires. Son monde post-apocalyptique et sa narration complexe (avec des retournements majeurs) en font un jalon du manga contemporain. L'adaptation animée par MAPPA est unanimement saluée pour sa qualité d'animation."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle bande dessinée belge de Hergé, dont le premier album date de 1929, est l'une des séries les plus lues au monde avec plus de 230 millions d'albums vendus ?",a:"Les Aventures de Tintin",detail:"Tintin, jeune reporter accompagné de son chien Milou et du capitaine Haddock, voyage dans le monde entier. Hergé (Georges Remi) développe un style graphique dit 'ligne claire', très influent. Le Lotus bleu (1936) marque le tournant vers des albums plus réalistes et engagés politiquement."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quel manga de Kentaro Miura (1989-2021), inachevé à la mort de son auteur, est souvent cité comme le chef-d'œuvre du dark fantasy en manga par sa complexité narrative et visuelle ?",a:"Berserk",detail:"Berserk suit Guts, mercenaire dans un monde sombre médiéval-fantastique inspiré de l'Europe médiévale. Miura meurt en 2021 avant d'achever l'œuvre ; ses assistants continuent la publication. La série est connue pour la densité de ses planches, la profondeur psychologique de ses personnages et sa violence."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel couturier allemand, mort en 2019, a été le directeur artistique de Chanel pendant plus de 35 ans ?",a:"Karl Lagerfeld (1933-2019)",detail:"Lagerfeld prend la direction artistique de Chanel en 1983 et revitalise complètement la maison. Il dirige parallèlement les collections de Fendi et sa propre marque. Connu pour ses lunettes noires, son catogan blanc et ses déclarations provocatrices, il est l'une des figures les plus influentes et polarisantes de la mode."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel artiste britannique, figure des Young British Artists, est connu pour ses animaux conservés dans le formol et pour un crâne serti de diamants ?",a:"Damien Hirst (né en 1965)",detail:"For the Love of God (2007), un crâne humain en platine serti de 8 601 diamants, aurait été vendu 100 millions de dollars à un consortium incluant l'artiste lui-même. Le requin dans le formol, The Physical Impossibility of Death in the Mind of Someone Living (1991), l'a rendu célèbre. Il compte parmi les artistes vivants les plus riches."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quel groupe de rock new-yorkais Andy Warhol produit-il, avec la chanteuse Nico, sur un album de 1967 à la célèbre pochette ornée d'une banane ?",a:"The Velvet Underground",detail:"The Velvet Underground & Nico, avec Lou Reed et John Cale, se vend mal à sa sortie mais devient l'un des albums les plus influents du rock : on dit que chacun de ses rares acheteurs a fondé un groupe. Warhol en signe la pochette et intègre le groupe à son spectacle multimédia Exploding Plastic Inevitable. On lui prête la formule selon laquelle chacun aura un jour son « quart d'heure de célébrité »."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel réseau social, fondé par Mark Zuckerberg à Harvard en 2004, compte plus de 3 milliards d'utilisateurs actifs en 2024 ?",a:"Facebook (Meta)",detail:"Après FaceMash, site de comparaison de photos d'étudiants, Zuckerberg lance « TheFacebook » à Harvard en 2004 avant de l'ouvrir au monde. Le groupe, rebaptisé Meta en 2021, possède aussi Instagram et WhatsApp. Le film The Social Network (2010) de David Fincher retrace sa fondation controversée."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel service de streaming vidéo, fondé en 1997 par Reed Hastings et Marc Randolph, a révolutionné la consommation de films et de séries et dépasse les 300 millions d'abonnés ?",a:"Netflix",detail:"Netflix passe de la location de DVD par courrier au streaming en 2007. Dès 2013, il produit ses propres contenus (House of Cards). Il popularise le binge-watching et transforme l'industrie audiovisuelle mondiale ; son modèle est copié par Disney+, Prime Video et Apple TV+."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel réseau social de partage de vidéos courtes, lancé en Chine par ByteDance en 2016, est devenu la plateforme de divertissement la plus téléchargée au monde malgré des controverses sur la sécurité des données ?",a:"TikTok (抖音, Douyin en Chine)",detail:"TikTok, version internationale lancée en 2017 de l'application chinoise Douyin, revendique plus d'un milliard d'utilisateurs mensuels. Son algorithme de recommandation est réputé pour son efficacité. Plusieurs gouvernements s'inquiètent de la sécurité des données ; les États-Unis ont adopté en 2024 une loi exigeant la cession de ses activités américaines. L'effet de ces formats courts sur l'attention fait l'objet d'études."},
{theme:"popculture",diff:"moyen",type:"q",q:"Qu'est-ce qu'un mème internet, et quel site fondé en 2005 se surnomme « la page d'accueil d'internet » ?",a:"Un contenu (image, vidéo, phrase) repris et détourné en masse ; Reddit",detail:"Le terme « mème » est inventé par Richard Dawkins dans Le Gène égoïste (1976) pour désigner une unité d'information culturelle qui se propage par imitation. Internet en a fait un format humoristique (image + texte). Reddit, surnommé « the front page of the internet », et 4chan (2003) sont de grands incubateurs de la culture internet."},
{theme:"popculture",diff:"difficile",type:"q",q:"Qu'est-ce que le 'metaverse' et quelle entreprise a mis sa réputation en jeu en 2021 pour se recentrer sur ce concept de réalité virtuelle sociale ?",a:"Le metaverse = espace virtuel persistant où les avatars des utilisateurs se rencontrent, travaillent et divertissent — Meta (Facebook) a rebaptisé sa société pour cette vision",detail:"Mark Zuckerberg annonce le pivot de Facebook vers le metaverse en octobre 2021 en rebaptisant la société Meta. L'investissement dépasse 10 milliards de dollars par an dans Horizon Worlds, son application sociale en réalité virtuelle. Le metaverse peine à convaincre le grand public. Ready Player One (Spielberg, 2018) en popularise la notion."},
{theme:"popculture",diff:"facile",type:"q",q:"Dans quel club brésilien Pelé passe-t-il l'essentiel de sa carrière, de 1956 à 1974 ?",a:"Le Santos FC",detail:"Pelé signe à Santos à 15 ans et y remporte notamment deux Coupes intercontinentales (1962, 1963). Le gouvernement brésilien l'aurait déclaré « trésor national » pour empêcher son transfert en Europe. Il termine sa carrière au Cosmos de New York (1975-1977). Il reste le seul joueur triple champion du monde (1958, 1962, 1970) ; il meurt en décembre 2022."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel geste de célébration, bras tendu vers le ciel comme un archer, est devenu la marque de fabrique d'Usain Bolt ?",a:"Le « Lightning Bolt » (ou « To Di World »)",detail:"Le sprinteur jamaïcain détient les records du monde du 100 m (9″58) et du 200 m (19″19), établis à Berlin en 2009. Il est le seul à avoir remporté le doublé 100 m-200 m à trois Jeux consécutifs (2008, 2012, 2016). Son charisme a fait de lui l'athlète le plus populaire de sa génération."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle compétition, créée en 1930 et disputée tous les quatre ans, est l'événement sportif le plus regardé au monde ?",a:"La Coupe du monde de football (FIFA World Cup)",detail:"La première édition se tient en Uruguay en 1930. La finale 2022 au Qatar entre l'Argentine et la France (3-3, victoire argentine aux tirs au but) est souvent citée comme la plus grande de l'histoire ; Kylian Mbappé y réussit un triplé, une première en finale depuis 1966. L'édition 2026, la première à 48 équipes, organisée par les États-Unis, le Canada et le Mexique, a été remportée par l'Espagne."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel tournoi du Grand Chelem Serena Williams remporte-t-elle en 2017 alors qu'elle est enceinte d'environ deux mois ?",a:"L'Open d'Australie",detail:"C'est son 23e et dernier titre du Grand Chelem en simple, record de l'ère Open (Margaret Court en compte 24, dont une partie avant 1968). Elle avait remporté son premier titre majeur à 17 ans, à l'US Open 1999. Elle a mis fin à sa carrière après l'US Open 2022."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel guide gastronomique français, publié depuis 1900, distribue des étoiles aux meilleurs restaurants du monde et est la référence absolue en haute gastronomie ?",a:"Le Guide Michelin",detail:"André et Édouard Michelin créent le guide en 1900 pour encourager les automobilistes à voyager. Les étoiles (1 à 3) sont attribuées anonymement par des inspecteurs professionnels. Trois étoiles signifient 'vaut le voyage'. Le guide couvre aujourd'hui 40 pays. Certains chefs rendent leurs étoiles pour fuir la pression."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel chef espagnol, patron du restaurant El Bulli (fermé en 2011), est le pionnier de la 'cuisine moléculaire' et figure régulièrement en tête des classements des meilleurs chefs mondiaux ?",a:"Ferran Adrià (né en 1962)",detail:"El Bulli, à Roses (Catalogne), est élu cinq fois meilleur restaurant du monde (2002, puis de 2006 à 2009). Adrià invente des techniques comme la sphérification (sphères de liquide gélifiées) et les « airs » (mousses très légères). Il récuse l'étiquette de « cuisine moléculaire » et préfère parler de cuisine créative ou déconstructiviste. Son influence sur la gastronomie contemporaine est considérable."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel phénomène de téléréalité, lancé en Hollande en 1999 et diffusé dans plus de 70 pays, enferme des inconnus ensemble et les élimine par vote ?",a:"Big Brother (Pays-Bas, 1999)",detail:"Créé par John de Mol, Big Brother inspire une déferlante de téléréalité mondiale. Survivor, The Voice, The X Factor et toute la téléréalité contemporaine héritent de son concept. Le nom 'Big Brother' vient d'Orwell (1984). Il a transformé la façon dont la télévision produit du divertissement."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel biologiste américain crée en 1979 un programme de réduction du stress fondé sur la pleine conscience (MBSR) ?",a:"Jon Kabat-Zinn",detail:"Kabat-Zinn adapte des pratiques de méditation bouddhiste dans un cadre laïque et médical, à l'université du Massachusetts. Les écrits du moine vietnamien Thich Nhat Hanh contribuent aussi à populariser la pleine conscience en Occident. Les applications Headspace (2010) et Calm (2012) en ont fait une industrie du bien-être valant plusieurs milliards."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quelle chanteuse britannique lance en 2024 la tendance virale « Brat Summer » avec son album Brat ?",a:"Charli XCX",detail:"Le vert acide de la pochette et l'esthétique d'une fille indépendante et chaotique deviennent un phénomène mondial sur TikTok, jusqu'à être repris par la campagne de Kamala Harris. D'autres tendances, comme le « Roman Empire » (les hommes qui pensent souvent à l'Empire romain), illustrent des cycles culturels très rapides, nés de micro-communautés en ligne plutôt que des médias traditionnels."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel roman-monde de J.R.R. Tolkien (1954-1955), précédé du Hobbit, est l'un des romans les plus vendus de l'histoire avec plus de 150 millions d'exemplaires ?",a:"Le Seigneur des Anneaux (The Lord of the Rings)",detail:"Tolkien (1892-1973), professeur à Oxford, invente des langues (quenya, sindarin), une mythologie et une géographie complètes pour la Terre du Milieu. Le Seigneur des Anneaux inspire tout le genre fantasy moderne : Donjons et Dragons, World of Warcraft, Game of Thrones. L'adaptation de Peter Jackson (2001-2003) est l'une des plus rentables de l'histoire."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel roman policier d'Agatha Christie (1934) mettant en scène le détective Hercule Poirot sur un train est l'un des romans policiers les plus vendus de l'histoire ?",a:"Le Crime de l'Orient-Express",detail:"Agatha Christie (1890-1976) est, selon le Guinness, l'auteure de fiction la plus vendue de l'histoire (environ 2 milliards d'exemplaires) et, selon l'UNESCO, l'auteure la plus traduite au monde. Hercule Poirot (belge, moustachu, adepte des « petites cellules grises ») et Miss Marple sont ses deux détectives emblématiques. Sa pièce La Souricière se joue à Londres sans interruption depuis 1952."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel roman de Dan Brown (2003), mettant en scène le symbologiste Robert Langdon sur fond de secrets du Vatican et du Prieuré de Sion, est devenu l'un des romans les plus lus du XXIe siècle ?",a:"Le Da Vinci Code",detail:"Le Da Vinci Code s'est vendu à plus de 80 millions d'exemplaires. Il mêle histoire de l'art, christianisme, ésotérisme et thriller. Malgré ses nombreuses inexactitudes historiques, il attire les touristes au Louvre et à l'église Saint-Sulpice de Paris, qui a dû afficher une mise au point. L'adaptation de Ron Howard (2006), avec Tom Hanks, a reçu un accueil critique mitigé."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle série de romans pour adolescents de Stephenie Meyer (2005-2008), mettant en scène une romance entre une humaine et un vampire, a vendu 160 millions d'exemplaires et lancé une franchise cinématographique ?",a:"Twilight",detail:"Bella Swan tombe amoureuse d'Edward Cullen, vampire végétarien qui refuse de la mordre. La série Twilight (Fascination, Tentation, Hésitation, Révélation) a dominé les listes de best-sellers mondiaux pendant des années et lancé les carrières de Kristen Stewart et Robert Pattinson."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel chanteur assure en 1993 le spectacle de mi-temps du Super Bowl qui transforme ce show en événement mondial ?",a:"Michael Jackson",detail:"Sa prestation au Super Bowl XXVII, à Pasadena, fait pour la première fois augmenter l'audience pendant la mi-temps ; la NFL invite dès lors de grandes stars. Prince, Beyoncé, Rihanna ou Kendrick Lamar ont suivi. Le Super Bowl est chaque année l'émission la plus regardée aux États-Unis ; un spot de 30 secondes y coûte environ 8 millions de dollars."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle cérémonie hollywoodienne, organisée depuis 1929, récompense chaque année les meilleurs films et est regardée par des centaines de millions de personnes dans le monde ?",a:"Les Oscars (Academy Awards)",detail:"Organisés par l'Academy of Motion Picture Arts and Sciences, les Oscars sont les récompenses cinématographiques les plus prestigieuses. La cérémonie la plus regardée de l'histoire (1998, avec Titanic). La gifle de Will Smith à Chris Rock en 2022 est le moment télévisé le plus commenté de la décennie."},
{theme:"popculture",diff:"difficile",type:"q",q:"Qu'est-ce que le 'Complexe industriel de la nostalgie' et comment Hollywood, Netflix et Disney exploitent-ils systématiquement la nostalgie des générations millennials et Gen X ?",a:"Phénomène où les studios misent sur des IPs connues (remakes, reboots, suites) plutôt que sur des créations originales pour minimiser le risque commercial — au détriment de la créativité",detail:"Disney (Star Wars, Marvel, remakes en prises de vues réelles de ses classiques), Netflix (Stranger Things et la nostalgie des années 1980) et Hollywood en général privilégient les franchises connues, jugées moins risquées. Suites, remakes et adaptations dominent les plus gros succès des années 2010. Le critique Mark Fisher (Le Réalisme capitaliste, 2009) y voyait le symptôme d'une culture incapable d'imaginer du nouveau."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel film de Francis Ford Coppola (1972), adapté du roman de Mario Puzo, est considéré comme l'un des plus grands films de l'histoire du cinéma ?",a:"Le Parrain (The Godfather)",detail:"Le Parrain suit la famille Corleone, clan mafieux new-yorkais. Marlon Brando (Don Vito), Al Pacino (Michael) et James Caan (Sonny) y sont inoubliables. Le film remporte 3 Oscars et change la façon de filmer la violence au cinéma. La suite (1974) est l'une des rares à égaler l'original."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel film d'animation Disney (1994) raconte l'histoire d'un lion qui doit reprendre son trône après le meurtre de son père, inspiré de Hamlet ?",a:"Le Roi Lion (The Lion King)",detail:"Le Roi Lion est longtemps le dessin animé le plus rentable de l'histoire de Disney. La mort de Mufasa est l'une des scènes les plus émouvantes du cinéma d'animation. La bande originale signée Hans Zimmer et les chansons d'Elton John (Circle of Life, Can You Feel the Love Tonight) sont iconiques."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel film de Ridley Scott (1979) inaugure la franchise Alien et révolutionne le film d'horreur de science-fiction avec la créature de H.R. Giger ?",a:"Alien, le huitième passager",detail:"Sigourney Weaver incarne Ellen Ripley, l'une des grandes héroïnes d'action du cinéma. L'artiste suisse H.R. Giger conçoit le Xénomorphe (mâchoire rétractile, sang acide), devenu une icône de l'imaginaire collectif. La franchise compte plusieurs suites et préquelles, ainsi que la série Alien: Earth (2025)."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel film de Sergio Leone (1966), avec Clint Eastwood, est l'archétype du western spaghetti et reste l'un des films les plus influents de l'histoire ?",a:"Le Bon, la Brute et le Truand (Il Buono, il Brutto, il Cattivo)",detail:"Clint Eastwood, Lee Van Cleef et Eli Wallach chassent un trésor de la guerre de Sécession. La musique d'Ennio Morricone et les plans sur les yeux des personnages avant le duel final définissent le western spaghetti. Leone invente un langage cinématographique qui influence Tarantino, Rodriguez et toute une génération de cinéastes."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quel film d'Akira Kurosawa (1954) met en scène sept samouraïs défendant un village de paysans et a inspiré Les Sept Mercenaires (1960) et indirectement Star Wars ?",a:"Les Sept Samouraïs (七人の侍)",detail:"Les Sept Samouraïs dure 3 h 27 et est tourné dans des conditions difficiles. Kurosawa y utilise plusieurs caméras simultanées et le ralenti dans les scènes d'action, techniques largement imitées. George Lucas s'inspire d'un autre film de Kurosawa, La Forteresse cachée (1958), pour Star Wars ; Yojimbo inspire Pour une poignée de dollars de Leone. Spielberg, Coppola et Scorsese le citent comme influence majeure."},
{theme:"popculture",diff:"facile",type:"q",q:"Quelle série américaine (1994-2004) suivant six amis à New York est l'une des comédies les plus regardées de l'histoire de la télévision ?",a:"Friends",detail:"Ross, Rachel, Monica, Chandler, Joey et Phoebe vivent à Manhattan. Diffusée pendant 10 saisons, Friends reste très regardée en streaming vingt ans après sa fin. La coupe de cheveux de Jennifer Aniston, « The Rachel », a été imitée dans le monde entier. Les acteurs se sont retrouvés pour une émission spéciale en 2021 ; Matthew Perry (Chandler) est mort en 2023."},
{theme:"popculture",diff:"facile",type:"q",q:"Quelle série britannique, diffusée depuis 1963, met en scène un Seigneur du Temps voyageant à bord d'une cabine de police bleue ?",a:"Doctor Who (BBC, depuis 1963)",detail:"Doctor Who est diffusé depuis 1963, avec une interruption entre 1989 et 2005 (hors téléfilm de 1996). Le Docteur peut se régénérer sous les traits d'un nouvel acteur, astuce narrative qui permet de changer d'interprète ; la série en compte quinze officiels. Son vaisseau, le TARDIS, a l'apparence d'une cabine de police londonienne des années 1960. Ncuti Gatwa est en 2023 le premier acteur noir à tenir le rôle principal."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle série HBO (1999-2007) sur la mafia new-yorkaise, créée par David Chase, est considérée par beaucoup comme la meilleure série de l'histoire de la télévision ?",a:"Les Sopranos (The Sopranos)",detail:"Tony Soprano (James Gandolfini) est un chef mafieux du New Jersey qui consulte un psychiatre. La série brouille la frontière entre anti-héros et monstre, explore la masculinité toxique et invente la 'television prestige'. Sa fin ambiguë (écran noir) reste l'une des plus débattues de l'histoire des séries."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle série britannique (2013-2022), créée par Steven Knight, suit une famille de gangsters de Birmingham dans les années 1920 et est devenue un phénomène mondial grâce à Netflix ?",a:"Peaky Blinders",detail:"La famille Shelby, menée par Thomas Shelby (Cillian Murphy), dirige un gang dans l'Angleterre de l'entre-deux-guerres. La série est réputée pour son esthétique, sa bande-son rock (Nick Cave, Arctic Monkeys) et sa distribution (Tom Hardy, Helen McCrory). Un long métrage prolonge l'histoire."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel groupe irlandais de rock, formé à Dublin en 1976, est l'un des plus grands groupes de l'histoire avec des albums comme The Joshua Tree (1987) ?",a:"U2",detail:"Bono, The Edge, Adam Clayton et Larry Mullen Jr. forment U2. The Joshua Tree est l'un des albums les plus vendus de l'histoire. U2 est célèbre pour ses concerts spectaculaires (ZooTV Tour, PopMart) et l'engagement humanitaire de Bono (Jubilee 2000, ONE Campaign, RED)."},
{theme:"popculture",diff:"facile",type:"q",q:"Quelle chanteuse américaine, auteure de Like a Prayer, Material Girl et Vogue, est surnommée la 'Reine de la Pop' pour son influence sur la mode, la danse et la musique depuis les années 1980 ?",a:"Madonna (née en 1958)",detail:"Madonna Louise Ciccone révolutionne l'image de la femme dans la pop, en se réinventant à chaque album. Vogue (1990) popularise le voguing, danse née dans la culture LGBTQ+ des clubs new-yorkais. Elle est, selon le Guinness, l'artiste féminine la plus vendue de l'histoire de la musique."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel rappeur américain, auteur de The College Dropout et My Beautiful Dark Twisted Fantasy, est l'un des artistes les plus influents et controversés des années 2010-2020 ?",a:"Kanye West (né en 1977, rebaptisé Ye)",detail:"Kanye West révolutionne le rap (soul samples, orchestrations), la mode (Yeezy/Adidas) et la communication (Twitter). My Beautiful Dark Twisted Fantasy (2010) est souvent cité comme le meilleur album de la décennie. Ses sorties de route (MAGA, antisémitisme) ont progressivement isolé l'artiste de l'industrie."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle chanteuse américaine, auteure des albums Lemonade et Renaissance, est avec son mari Jay-Z la figure artistique noire la plus influente de sa génération ?",a:"Beyoncé Knowles (née en 1981)",detail:"Beyoncé débute avec Destiny's Child avant une carrière solo dominante. Lemonade (2016) est un album visuel sur la trahison et l'identité des femmes noires ; Renaissance (2022) rend hommage à la culture queer noire ; Cowboy Carter (2024) revisite la country et lui vaut le Grammy de l'album de l'année en 2025. Elle est l'artiste la plus récompensée de l'histoire des Grammy Awards."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quel album des Sex Pistols (1977) est le manifeste du punk britannique ?",a:"Never Mind the Bollocks, Here's the Sex Pistols",detail:"Le seul album studio du groupe contient Anarchy in the UK et God Save the Queen, chanson sortie pendant le jubilé d'Élisabeth II et interdite d'antenne par la BBC. Il résume l'esprit punk : rejet du rock progressif, « Do It Yourself », provocation. The Clash politisent le mouvement. Le punk influence la new wave, le grunge et toute la culture alternative."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel jeu de simulation sociale de Maxis/EA (2000), où le joueur contrôle la vie quotidienne de personnages virtuels, est l'un des jeux vidéo les plus vendus de l'histoire ?",a:"Les Sims (The Sims)",detail:"Les Sims permet de construire des maisons, gérer des relations, des carrières et les besoins de personnages (faim, social, fun, hygiène). Le jeu a vendu plus de 200 millions d'exemplaires. Ses add-ons sont un modèle économique du DLC (downloadable content). Les Sims 4 est passé gratuit en 2022."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel jeu de rôle en ligne massivement multijoueur (MMORPG), lancé par Blizzard en 2004, a atteint 12 millions d'abonnés et a défini le genre pendant une décennie ?",a:"World of Warcraft (WoW)",detail:"World of Warcraft (WoW) se déroule dans l'univers de Warcraft. À son apogée (2010), il compte 12 millions d'abonnés payants — un record pour le genre. Le jeu a généré des phénomènes culturels (addiction, mariages de joueurs, deuils dans le jeu). Il reste actif en 2024 avec ses extensions régulières."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel jeu de tir en équipe de Valve, sorti en 2012 et devenu gratuit en 2018, est l'un des jeux compétitifs PC les plus joués au monde ?",a:"Counter-Strike: Global Offensive (CS:GO) / CS2",detail:"Counter-Strike est né en 1999 d'un mod du jeu Half-Life. CS:GO (2012) a été remplacé par Counter-Strike 2 en 2023. Les grands tournois (Majors) rassemblent des millions de spectateurs en ligne. C'est l'un des plus anciens et des plus stables de l'esport."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel super-héros DC Comics, né sous le nom de Bruce Wayne et traumatisé par le meurtre de ses parents, combat le crime à Gotham City déguisé en chauve-souris ?",a:"Batman",detail:"Créé par Bob Kane et Bill Finger en 1939, Batman est le super-héros sans superpouvoirs — seulement intelligence, arts martiaux et fortune. Ses ennemis (Joker, Catwoman, Pingouin) sont parmi les plus iconiques de la culture pop. Les adaptations cinématographiques de Tim Burton (1989) et Christopher Nolan (2005-2012) redéfinissent le super-héros au cinéma."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel manga de Tite Kubo (2001-2016) met en scène Ichigo Kurosaki, un lycéen capable de voir les fantômes qui devient un Shinigami pour protéger les âmes ?",a:"Bleach",detail:"Bleach est l'une des trois grandes séries shōnen du magazine Weekly Shōnen Jump des années 2000 avec Naruto et One Piece. Il a vendu plus de 120 millions d'exemplaires. Son anime (2004-2012) est culte. La continuation animée Thousand-Year Blood War (2022-2024) relance l'enthousiasme des fans."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel scénariste américain, co-créateur de Spider-Man, Iron Man, Thor et des X-Men, est devenu la figure emblématique de Marvel Comics ?",a:"Stan Lee (1922-2018)",detail:"Stan Lee crée la plupart des grands héros Marvel avec les dessinateurs Jack Kirby et Steve Ditko. Spider-Man (1962), avec l'adolescent ordinaire Peter Parker, révolutionne le genre. Stan Lee fait une apparition dans la plupart des films Marvel jusqu'à sa mort en 2018. « Excelsior ! » était sa formule fétiche."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quel mangaka, auteur de 20th Century Boys et de Pluto, signe aussi Monster (1994-2001), thriller psychologique pour adultes ?",a:"Naoki Urasawa (né en 1960)",detail:"Monster suit le Dr Kenzo Tenma qui sauve la vie d'un enfant qui devient un serial killer. Le manga explore la culpabilité, l'identité et la nature du mal dans une Europe post-Guerre Froide. Urasawa est considéré comme le maître du thriller psychologique en manga. Ses œuvres sont comparées à des romans policiers européens."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel réseau social de partage de photos, fondé par Kevin Systrom et Mike Krieger en 2010 et racheté par Facebook pour 1 milliard de dollars en 2012, est devenu le symbole de la culture visuelle contemporaine ?",a:"Instagram",detail:"Instagram revendique 3 milliards d'utilisateurs mensuels en 2025. L'application a transformé la photographie, le marketing, la mode et la restauration, et fait émerger le métier d'« influenceur ». Ses filtres et son esthétique ont modifié la façon dont chacun présente son quotidien."},
{theme:"popculture",diff:"moyen",type:"q",q:"Qu'est-ce que l'esport (sport électronique) et quels sont les tournois et jeux qui génèrent les plus grandes audiences mondiales ?",a:"Compétitions professionnelles de jeux vidéo — League of Legends, Dota 2 et Counter-Strike rassemblent des dizaines de millions de spectateurs",detail:"Les championnats du monde de League of Legends dépassent les 6 millions de spectateurs simultanés (hors Chine) en 2024. The International (Dota 2) a distribué jusqu'à 40 millions de dollars de prix en 2021. L'esport est reconnu comme discipline sportive dans plusieurs pays, et des arènes dédiées accueillent des compétitions en direct."},
{theme:"popculture",diff:"moyen",type:"q",q:"Qu'est-ce que le podcast et comment ce format audio, né au début des années 2000, a-t-il révolutionné la consommation de contenus culturels et informatifs ?",a:"Fichier audio numérique à la demande — Serial (2014) popularise le format auprès du grand public, suivi par des dizaines de millions de podcasts",detail:"Le podcast (iPod + broadcast) naît vers 2004. Serial (2014) — enquête criminelle en 12 épisodes — est le premier podcast à atteindre 5 millions d'écoutes. En 2024, il existe plus de 4 millions de podcasts dans le monde. Spotify, Apple et Amazon investissent des milliards pour dominer le marché."},
{theme:"popculture",diff:"difficile",type:"q",q:"Qu'est-ce que l'économie des créateurs (creator economy) et comment des plateformes comme YouTube, Patreon et Substack ont-elles transformé la production culturelle ?",a:"Écosystème où des individus monétisent directement leur audience sans intermédiaire — YouTube (2005), Patreon (2013) et Substack (2017) en sont les piliers",detail:"YouTube (2005) permet aux créateurs de monétiser via la publicité. Patreon (2013) introduit l'abonnement direct fan-créateur. Substack (2017) relance la newsletter premium. En 2024, plus de 50 millions de personnes se considèrent créateurs de contenu. Cette économie remet en question les modèles de l'édition, du journalisme, de la musique et du cinéma."},
{theme:"popculture",diff:"facile",type:"q",q:"Combien de médailles d'or Michael Phelps remporte-t-il aux JO de Pékin en 2008, record absolu pour une seule édition ?",a:"8",detail:"Phelps bat le record de 7 titres établi par Mark Spitz à Munich en 1972. Au total, il remporte 28 médailles olympiques, dont 23 en or, entre 2000 et 2016, ce qui fait de lui l'athlète le plus médaillé de l'histoire des Jeux. Après sa carrière, il a témoigné de sa dépression pour briser le tabou de la santé mentale dans le sport."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quelle couleur de tenue est obligatoire pour les joueurs du tournoi de Wimbledon ?",a:"Le blanc (presque intégral)",detail:"Le règlement impose une tenue presque entièrement blanche, jusqu'aux chaussures ; depuis 2023, les joueuses peuvent porter des sous-shorts de couleur foncée. Le tournoi, le plus ancien du Grand Chelem (1877), se joue sur gazon à Londres, de fin juin à mi-juillet. Les fraises à la crème et la loge royale font partie de sa tradition."},
{theme:"popculture",diff:"difficile",type:"q",q:"Qu'est-ce que la Formule 1 et comment la domination de Michael Schumacher puis de Lewis Hamilton a-t-elle façonné ce sport en phénomène culturel mondial ?",a:"Championnat automobile de la FIA — Schumacher (7 titres, Ferrari 2000-2004) puis Hamilton (7 titres, Mercedes 2014-2020) dominent le sport sur vingt ans",detail:"La F1 combine technologie de pointe, glamour et vitesse. Schumacher (Ferrari) révolutionne la préparation physique des pilotes ; Hamilton, passé chez Ferrari en 2025, milite pour la diversité. La série Netflix Formula 1 : Pilotes de leur destin (Drive to Survive, depuis 2019) a popularisé la F1 auprès d'un nouveau public, notamment aux États-Unis."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel festival de musique britannique, créé en 1970 dans le Somerset, est l'un des plus grands et des plus emblématiques festivals de musique en plein air au monde ?",a:"Glastonbury",detail:"Glastonbury accueille environ 200 000 personnes sur la ferme de Worthy Farm, à Pilton, fondée par Michael Eavis. Sa programmation mêle rock, pop, électro, arts et militantisme. David Bowie, Radiohead ou Beyoncé y ont donné des concerts mémorables. Les billets s'arrachent en quelques minutes ; le festival fait relâche certaines années (« fallow years ») pour laisser reposer les terres."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel chef français, auteur de La Cuisine du marché et triple étoilé Michelin, est considéré comme le père de la Nouvelle Cuisine des années 1970 qui révolutionne la gastronomie française ?",a:"Paul Bocuse (1926-2018)",detail:"Surnommé « Monsieur Paul », Bocuse lance avec Michel Guérard, Alain Chapel et les frères Troisgros la Nouvelle Cuisine : assiettes plus légères, sauces réduites, respect du produit. Son Auberge du Pont de Collonges, près de Lyon, a conservé 3 étoiles de 1965 à 2019, avant de perdre la troisième en 2020. Il a créé le concours du Bocuse d'or (1987)."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel jeu de stratégie, né en Inde vers le VIe siècle, consiste à mettre le roi adverse échec et mat ?",a:"Les échecs",detail:"Les échecs dérivent du chaturanga indien et se diffusent par la Perse et le monde arabe, avant d'arriver en Europe vers l'an mil. La défaite de Garry Kasparov face à l'ordinateur Deep Blue d'IBM en 1997 marque l'entrée de l'intelligence artificielle dans la culture populaire. La série Netflix Le Jeu de la dame (2020) a déclenché un boom mondial de la pratique."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel parc d'attractions créé par Walt Disney en 1955 en Californie a lancé un empire mondial du divertissement familial ?",a:"Disneyland (Anaheim, Californie)",detail:"Disneyland est le premier 'parc thématique' de l'histoire — différent des parcs d'attraction traditionnels. Walt Disney supervise chaque détail. L'empire Disney Parks compte aujourd'hui 12 parcs sur 3 continents (Anaheim, Orlando, Paris, Tokyo, Hong Kong, Shanghai). Disney World (Orlando, 1971) est le plus grand complexe de loisirs du monde."},
{theme:"popculture",diff:"moyen",type:"q",q:"Qu'est-ce que le Comic-Con de San Diego et comment est-il devenu le symbole de la culture geek et du divertissement populaire mondial ?",a:"Convention annuelle créée en 1970 à San Diego réunissant fans de BD, SF, jeux vidéo et films — devenu la scène mondiale des annonces de franchise",detail:"Le San Diego Comic-Con (SDCC) accueille 135 000 personnes par an. Créé par des fans de comics, il est devenu le lieu où Hollywood annonce ses blockbusters (Marvel, DC, Star Wars). Les 'panels' de la salle Hall H rassemblent des milliers de fans. Le terme 'geek' est passé de péjoratif à identité valorisée."},
{theme:"popculture",diff:"difficile",type:"q",q:"Quel terme coréen désigne la vague de diffusion mondiale de la culture sud-coréenne (musique, séries, cinéma, cosmétiques) ?",a:"La Hallyu (« vague coréenne »)",detail:"Le terme apparaît à la fin des années 1990, quand les séries coréennes conquièrent l'Asie. Soutenue par l'État, la Hallyu s'étend au monde avec la K-pop (PSY, BTS, BLACKPINK), le cinéma (Parasite, Palme d'or 2019) et les séries (Squid Game). Elle illustre le soft power, concept de Joseph Nye (1990), longtemps associé surtout à Hollywood."},
{theme:"popculture",diff:"facile",type:"q",q:"Quel groupe suédois, formé en 1972 par deux couples, est l'un des groupes de pop les plus vendus de l'histoire avec des tubes comme Dancing Queen et Mamma Mia ?",a:"ABBA",detail:"Agnetha, Björn, Benny et Anni-Frid (ABBA) dominent les charts mondiaux de 1974 à 1982. Mamma Mia ! (comédie musicale, 1999 ; film, 2008) relance leur popularité. Leur album ABBA Gold (1992) est l'un des plus vendus de tous les temps. En 2021, ils sortent Voyage, leur premier album depuis 40 ans."},
{theme:"popculture",diff:"moyen",type:"q",q:"Quel phénomène culturel mondial né en Corée du Sud dans les années 2010, incarné par des groupes comme BTS et BLACKPINK, a propulsé la culture coréenne sur la scène internationale ?",a:"La K-pop (Korean pop)",detail:"La K-pop combine chorégraphies millimétrées, esthétique visuelle soignée et marketing intense sur les réseaux sociaux, grâce à de puissantes agences qui forment les artistes dès l'adolescence. Gangnam Style de PSY devient en 2012 la première vidéo à dépasser le milliard de vues sur YouTube. BTS se classe ensuite à de multiples reprises en tête des charts américains."},
{theme:"popculture",focus:"allemagne",diff:"facile",type:"q",q:"Quelle chanteuse allemande remporte le concours Eurovision de la chanson en 2010 avec Satellite ?",a:"Lena (Lena Meyer-Landrut)",detail:"C'est la deuxième victoire allemande, après celle de Nicole en 1982 avec Ein bisschen Frieden. L'Allemagne fait partie des 7 pays de la première édition (1956) et des « Big Five », qui contribuent le plus au financement et sont qualifiés d'office pour la finale."},
{theme:"popculture",focus:"allemagne",diff:"moyen",type:"q",q:"Quel groupe allemand, fondé à Düsseldorf en 1970, est un pionnier de la musique électronique moderne ?",a:"Kraftwerk",detail:"Ralf Hütter et Florian Schneider créent, avec synthétiseurs, boîtes à rythmes et voix robotiques, un son totalement nouveau. Autobahn (1974), Trans-Europe Express (1977) et The Man-Machine (1978) influencent directement le hip-hop américain, la techno de Detroit et toute la pop électronique."},
{theme:"popculture",focus:"allemagne",diff:"moyen",type:"q",q:"Quel festival, fondé par Richard Wagner en 1876, est exclusivement consacré à ses opéras ?",a:"Le Festival de Bayreuth (Bayreuther Festspiele)",detail:"Il se tient chaque été à Bayreuth, en Bavière, dans le Festspielhaus que Wagner a fait construire pour ses œuvres (fosse d'orchestre invisible, acoustique exceptionnelle). L'attente pour obtenir des billets a longtemps dépassé dix ans. Le festival est dirigé par des descendants du compositeur, aujourd'hui son arrière-petite-fille Katharina Wagner."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel chef français, surnommé 'le roi des cuisiniers et le cuisinier des rois', codifie la grande cuisine française au XIXe siècle avec ses cinq sauces mères ?",a:"Auguste Escoffier (1846-1935)",detail:"Escoffier travaille avec César Ritz (Savoy de Londres, Ritz de Paris) et modernise la cuisine héritée de Carême. Dans son Guide culinaire (1903), il codifie notamment les sauces de base (béchamel, velouté, espagnole, hollandaise, tomate), simplifie les menus et organise la brigade de cuisine. Il crée la pêche Melba pour la cantatrice Nellie Melba. Le surnom, également appliqué à Carême, lui aurait été donné par l'empereur Guillaume II."},
{theme:"gastro",diff:"facile",type:"q",q:"Dans quelle région française produit-on le Roquefort, et dans quoi est-il affiné pour développer ses moisissures bleues caractéristiques ?",a:"Dans les caves naturelles du Combalou, à Roquefort-sur-Soulzon (Aveyron), où des failles (fleurines) assurent une ventilation naturelle",detail:"Le roquefort est fabriqué exclusivement au lait cru de brebis (principalement de race Lacaune) et ensemencé de Penicillium roqueforti. Il est le premier fromage français reconnu par une appellation d'origine (loi de 1925). Sa fabrication est attestée depuis le Moyen Âge, et des textes antiques évoquent déjà des fromages de la région."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel dessert français en forme de chou fourré de crème et nappé de caramel est la pièce maîtresse du croquembouche, gâteau de mariage traditionnel ?",a:"La profiterole (ou chou à la crème)",detail:"Le croquembouche (« croque en bouche ») est une pyramide de choux garnis liés par du caramel, popularisée par Antonin Carême au début du XIXe siècle. Il orne les mariages et baptêmes français. La pâte à choux, qui gonfle à la cuisson grâce à la vapeur, sert aussi aux éclairs, religieuses et Paris-Brest."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle région française produit le foie gras, et quelle race de canard ou d'oie est traditionnellement utilisée pour les deux appellations IGP ?",a:"Sud-Ouest principalement (Landes, Périgord, Gers) — canard mulard pour le foie gras de canard, oie pour le foie gras d'oie",detail:"La France produit 70 % du foie gras mondial. Le gavage (alimentation forcée) est interdit dans la plupart des pays mais légal en France où il est patrimoine gastronomique protégé. L'IGP 'Canard à foie gras du Sud-Ouest' couvre 8 départements. Le foie gras d'oie, plus rare et délicat, représente moins de 5 % de la production."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel plat de haricots blancs, confit de canard et charcuteries fait l'objet d'une rivalité entre Castelnaudary, Carcassonne et Toulouse ?",a:"Le cassoulet",detail:"Castelnaudary revendique la paternité (saucisse de porc + confit de canard). Carcassonne ajoute le gigot d'agneau. Toulouse inclut sa saucisse emblématique. La Confrérie du Cassoulet de Castelnaudary défend l'orthodoxie de la recette. Le nom vient de la cassole en terre cuite dans laquelle il cuit. La croûte doit être cassée sept fois selon la tradition."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle sauce émulsionnée au beurre, née selon la légende d'une béarnaise ratée près de Nantes, accompagne traditionnellement le brochet de Loire ?",a:"Le beurre blanc (nantais)",detail:"La légende attribue son invention à Clémence Lefeuvre dite 'La Mère Clémence' vers 1890 à Saint-Julien-de-Concelles. La recette : réduction de vinaigre et d'échalotes dans du muscadet, puis incorporation progressive de beurre froid en fouettant. La sauce émulsionnée obtenue accompagne le poisson de Loire. Son secret : ne jamais laisser bouillir après l'ajout du beurre."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelle cuisinière lyonnaise devient en 1933 la première personne à détenir 6 étoiles Michelin, avec deux restaurants triplement étoilés ?",a:"Eugénie Brazier, la « Mère Brazier » (1895-1977)",detail:"Elle obtient 3 étoiles pour son restaurant de la rue Royale, à Lyon, et 3 pour son auberge du col de la Luère. Paul Bocuse y fait son apprentissage. Sa cuisine bourgeoise, fondée sur des produits d'exception, comprend la volaille de Bresse demi-deuil (truffes glissées sous la peau), les quenelles de brochet ou l'artichaut au foie gras. Elle incarne la tradition des « mères lyonnaises »."},
{theme:"gastro",diff:"facile",type:"q",q:"Quelle ville italienne a donné son nom au jambon cru le plus célèbre d'Italie, produit avec des porcs nourris au petit-lait de parmesan ?",a:"Parme (Prosciutto di Parma DOP)",detail:"Le Prosciutto di Parma est affiné au moins 12 mois, souvent bien davantage, dans les collines autour de Langhirano, où se rencontrent l'air venu de la mer et celui des Apennins. Les porcs, issus de régions définies, peuvent être nourris avec le petit-lait de la fabrication du Parmigiano-Reggiano. La couronne ducale à cinq pointes, marquée au feu, certifie les jambons conformes."},
{theme:"gastro",diff:"facile",type:"q",q:"Quelle pâte italienne à base d'œufs et de farine est originaire de Bologne, et quel est le vrai nom de la sauce bolognaise selon les Italiens ?",a:"Les tagliatelles (et non les spaghettis) accompagnent le ragù alla bolognese — la Chambre de Commerce de Bologne a déposé la recette officielle en 1982",detail:"La recette officielle bolognaise stipule : bœuf haché, pancetta, oignon, carotte, céleri, vin blanc, lait, tomates. Pas de spaghettis — les tagliatelles, dont la largeur doit correspondre à 1/12 276e de la hauteur de la Tour des Asinelli. Les spaghettis bolognaise sont une invention de la diaspora italienne."},
{theme:"gastro",diff:"moyen",type:"q",q:"Dans quelle région italienne produit-on le Parmigiano-Reggiano, et combien de litres de lait faut-il pour produire une meule ?",a:"En Émilie-Romagne et en Lombardie (provinces de Parme, Reggio d'Émilie, Modène, Bologne en partie et Mantoue en partie) — environ 550 litres de lait pour une meule d'environ 40 kg",detail:"Le Parmigiano-Reggiano AOP est affiné au moins 12 mois, souvent 24 à 36 mois ou plus. Des experts testent les meules au marteau : le son révèle d'éventuels défauts internes. Environ 300 fromageries produisent sous l'appellation. Le nom « parmesan » est protégé dans l'UE, mais utilisé librement dans d'autres pays."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel vinaigre traditionnel de Modène est produit uniquement à partir de moût de raisin cuit et vieilli minimum 12 ans en fûts de bois successivement plus petits ?",a:"L'Aceto Balsamico Tradizionale di Modena DOP",detail:"Le balsamique traditionnel (à distinguer du balsamique IGP industriel, 60 jours de vieillissement minimum) vieillit dans une batterie de 5 à 7 fûts en bois différents (chêne, mûrier, châtaignier, cerisier, genévrier). La surface d'évaporation concentre les arômes. 25 litres de moût donnent 1 litre de vinaigre après 12 ans. La bouteille officielle (sphérique, 100 ml) a été créée par Giorgetto Giugiaro."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quel journaliste piémontais fonde le mouvement Slow Food, en réaction notamment à l'ouverture d'un McDonald's place d'Espagne à Rome en 1986 ?",a:"Carlo Petrini (né en 1949)",detail:"Petrini fonde l'association Arcigola à Bra (Piémont) en 1986 ; le manifeste international de Slow Food est signé à Paris en 1989. Il crée ensuite Terra Madre (réseau mondial de producteurs), l'Arche du goût (inventaire des produits menacés) et l'Université des sciences gastronomiques de Pollenzo. Le mouvement défend une alimentation « bonne, propre et juste »."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel bouillon japonais de base, fait d'algue kombu et de flocons de bonite séchée, est le fondement de la cuisine japonaise et vecteur de l'umami ?",a:"Le dashi",detail:"Le dashi est l'équivalent japonais du fond de veau français — base de la soupe miso, des ramen, des sauces et des plats mijotés. Il se prépare en 20 minutes (kombu infusé, bonite ajoutée hors du feu, filtrée). Sa richesse en acide glutamique (kombu) et en inosinate (bonite) crée une synergie umami. La cuisine japonaise structurée autour du dashi est inscrite au patrimoine UNESCO (washoku, 2013)."},
{theme:"gastro",diff:"facile",type:"q",q:"Dans quelle ville chinoise est née la cuisine cantonaise, et quel est son principe culinaire fondamental de respect du produit brut ?",a:"Guangzhou (Canton) — la cuisine cantonaise valorise la fraîcheur absolue et les cuissons douces (vapeur, sauté rapide) pour ne pas masquer le goût naturel des ingrédients",detail:"La cuisine cantonaise est l'une des huit grandes cuisines chinoises. Elle valorise la fraîcheur (poissons gardés vivants jusqu'à la commande), la cuisson à la vapeur et le sauté rapide au wok. Les dim sum, petites bouchées servies en paniers vapeur lors du yum cha, en sont l'expression festive. Hong Kong et les communautés cantonaises de la diaspora en sont les ambassadeurs."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel Premier ministre thaïlandais fait promouvoir le pad thaï comme plat national dans les années 1940 ?",a:"Plaek Phibunsongkhram (dit Phibun)",detail:"Dans le cadre d'une politique nationaliste de modernisation, le gouvernement de Phibun diffuse des recettes et encourage les échoppes de rue. Objectifs : économiser le riz en période de pénurie au profit des nouilles de riz, et affirmer une identité culinaire thaïe. La recette doit pourtant beaucoup aux nouilles sautées chinoises."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle technique coréenne de fermentation en jarre enterrée (onggi) permet de conserver légumes et sauces pendant des années, et quel est son produit emblématique autre que le kimchi ?",a:"La fermentation en onggi (jarre en terre cuite) produit aussi la pâte de soja doenjang, la sauce gochujang et la sauce de soja ganjang — bases de la cuisine coréenne",detail:"Les onggi, jarres en terre cuite poreuse, laissent l'air circuler tout en maintenant une température stable. Le doenjang (pâte de soja fermentée), le gochujang (pâte de piment, soja et riz gluant) et le ganjang (sauce soja) sont les sauces fondamentales de la cuisine coréenne. La culture du jang (sauces de soja fermentées) a été inscrite au patrimoine immatériel de l'UNESCO en 2024."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel maître sushi japonais, dont le restaurant Sukiyabashi Jiro obtient 3 étoiles dans le premier guide Michelin de Tokyo (2007), est le héros du documentaire Jiro Dreams of Sushi (2011) ?",a:"Jiro Ono (né en 1925)",detail:"Jiro Ono, né en 1925, travaille dans un restaurant d'une dizaine de places situé au sous-sol d'un immeuble de Ginza, près d'une station de métro. Il masse les poulpes pendant de longues minutes et laisse maturer certains poissons. Ses apprentis passent des années avant de pouvoir préparer le poisson. Le restaurant disparaît du guide en 2020, faute d'être accessible au grand public."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelle épice indienne, mélange de curcuma, coriandre, cumin et d'autres aromates, n'existe pas en Inde sous cette forme, étant une création britannique de la période coloniale ?",a:"Le curry en poudre (curry powder) est une invention britannique — en Inde, chaque plat a son propre mélange d'épices fraîchement moulus (masala)",detail:"En Inde, le terme curry n'existe presque pas. Chaque région, chaque plat a son masala (mélange d'épices fraîches moulues). Les Britanniques ont simplifié cette complexité en une poudre unique 'curry' pour reproduire les saveurs indiennes en Angleterre. La sauce curry britannique (British curry sauce) est aussi distincte des cuisines indiennes. Le 'chicken tikka masala' est souvent présenté comme le plat national britannique — créé en Grande-Bretagne."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel pays d'Amérique latine est considéré comme le berceau du pisco, et quel cocktail emblématique est préparé avec cette eau-de-vie de raisin ?",a:"Dispute Pérou/Chili — le Pisco Sour (pisco, jus de citron vert, blanc d'oeuf, sirop de sucre, angostura)",detail:"La « guerre du pisco » oppose le Pérou et le Chili depuis des décennies : le Pérou invoque le port de Pisco, le Chili produit aussi son pisco. Les deux pays protègent chacun leur dénomination, et les accords commerciaux reconnaissent souvent les deux. Le pisco sour péruvien inclut du blanc d'œuf et de l'angostura ; la version chilienne est souvent plus simple."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel pays est le premier producteur mondial de cacao, et quelle région du monde fournit environ 70 % des fèves ?",a:"Côte d'Ivoire est le premier producteur mondial — 70 % du cacao mondial vient d'Afrique de l'Ouest (Côte d'Ivoire, Ghana, Cameroun, Nigeria)",detail:"La Côte d'Ivoire produit ~2 millions de tonnes/an, soit 40 % du cacao mondial. Ironie : le chocolat est consommé principalement en Europe et aux États-Unis, rarement par les producteurs africains. Les fèves de cacao (Theobroma cacao) ne poussent que dans la zone tropicale (20° de part et d'autre de l'équateur). Le cacao était monnaie chez les Aztèques."},
{theme:"gastro",diff:"moyen",type:"q",q:"Que désigne d'abord le mot « tajine » dans la cuisine du Maghreb ?",a:"Le plat en terre cuite muni d'un couvercle conique, puis, par extension, le ragoût qui y mijote",detail:"Le couvercle conique fait condenser la vapeur, qui retombe sur les aliments : viandes, légumes et fruits cuisent lentement dans leur jus, avec peu d'eau. La cuisine marocaine l'associe aux épices (ras el-hanout, safran), au citron confit, aux olives ou aux fruits secs. Le terme désigne aussi, en Tunisie, une sorte d'omelette épaisse cuite au four."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel pays d'Amérique du Sud possède la plus haute densité de restaurants dans la liste des 50 Meilleurs Restaurants du Monde, grâce notamment à son chef Gastón Acurio et à la diversité de ses écosystèmes ?",a:"Le Pérou — Lima est considérée comme la capitale gastronomique de l'Amérique latine, avec Central, Maido et Astrid y Gastón parmi les meilleurs mondiaux",detail:"Le Pérou réunit 84 des 117 « zones de vie » du monde — désert côtier, Andes, Amazonie — d'où une biodiversité alimentaire exceptionnelle. Gastón Acurio (Astrid y Gastón) a popularisé le ceviche et la cuisine novoandina. Central (Virgilio Martínez), qui cuisine par étages d'altitude, a été élu meilleur restaurant du monde en 2023, puis Maido (Mitsuharu Tsumura) en 2025."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelle est l'origine historique du mole negro mexicain, et combien d'ingrédients peut contenir sa version la plus complexe, celle d'Oaxaca ?",a:"Le mole negro d'Oaxaca peut contenir jusqu'à 30 ingrédients — chocolat, piments séchés, épices, tomates, noix, raisins secs, et sa préparation peut prendre 3 jours",detail:"Le mole (du nahuatl molli, 'sauce') est un héritage précolombien enrichi par la cuisine coloniale. Le mole negro d'Oaxaca est l'un des 7 moles de l'État. Il intègre piments mulato, ancho, pasilla, chipotle, chocolat amer, achiote, cannelle, clou de girofle, thym, plantain frit, tortilla brûlée, noix. Sa complexité symbolise la fusion des cultures autochtone et espagnole."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel explorateur génois rapporte en Europe à son retour des Amériques des ingrédients qui révolutionneront la cuisine européenne — tomate, piment, maïs, pomme de terre — lors de quel échange historique ?",a:"Christophe Colomb ; l'« échange colombien » (à partir de 1492), qui transforme les cuisines du monde — la tomate italienne, la pomme de terre irlandaise et le paprika hongrois viennent des Amériques",detail:"Avant 1492 : pas de tomates en Italie (la sauce tomate n'a que 400 ans), pas de piments en Asie, pas de chocolat en Europe, pas de pommes de terre en Irlande. En échange, les Amériques reçoivent blé, riz, bovins, chevaux, bananes. L'Échange colombien est l'une des plus grandes révolutions alimentaires de l'histoire, ayant aussi propagé des maladies dévastatrices pour les peuples autochtones."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel livre de cuisine français d'Antonin Carême (1784-1833) codifie pour la première fois la grande cuisine française et inspire tous les chefs du XIXe siècle ?",a:"L'Art de la cuisine française au XIXe siècle (1833-1844) — Carême est le premier grand chef de l'histoire moderne, cuisinier de Talleyrand, du Tsar et de Rothschild",detail:"Abandonné enfant, Marie-Antoine (dit Antonin) Carême commence comme marmiton puis pâtissier. Il travaille pour Talleyrand, qui l'emploie au service de sa diplomatie, puis pour le prince régent d'Angleterre, le tsar Alexandre Ier et James de Rothschild. Il classe les sauces en grandes familles, conçoit des pièces montées architecturales et aurait popularisé la toque. Son œuvre fonde la grande cuisine française."},
{theme:"gastro",diff:"moyen",type:"q",q:"Dans quel contexte historique la conserve alimentaire est-elle inventée par Nicolas Appert en 1810, et pour quel usage militaire Napoléon finance-t-il sa recherche ?",a:"Napoléon offre 12 000 francs de récompense pour inventer un moyen de nourrir ses armées en campagne — Appert invente la stérilisation en bocal hermétique",detail:"Nicolas Appert, confiseur parisien, constate que des aliments chauffés dans des bocaux hermétiques se conservent, sans comprendre pourquoi : le rôle des micro-organismes ne sera établi que par Pasteur dans les années 1860. Il reçoit en 1810 une récompense de 12 000 francs du gouvernement impérial. La même année, l'Anglais Peter Durand fait breveter la boîte en fer-blanc."},
{theme:"gastro",diff:"difficile",type:"q",q:"Comment la Route de la Soie a-t-elle été aussi une 'Route des Épices' et pourquoi le commerce des épices a-t-il financé les grandes découvertes européennes du XVe siècle ?",a:"Les épices (poivre, cannelle, muscade, girofle) valaient leur pesant d'or — la recherche d'une route directe vers les épices des Moluques motive Vasco de Gama, Colomb et Magellan",detail:"Au Moyen Âge, les épices arrivent d'Asie via des intermédiaires arabes puis vénitiens, gonflant les prix x100. Une livre de poivre vaut une journée de salaire. Une livre de safran vaut un cheval. La recherche d'une route directe vers les Moluques ('Îles aux Épices', Indonésie) motive les explorations. Vasco de Gama (1498) contourne l'Afrique. Magellan (1519) fait le tour du monde. Le poivre déclenche des guerres coloniales."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel vignoble français, centré sur la Gironde, produit des vins parmi les plus chers du monde, dont le Pétrus (Pomerol) ?",a:"Le Bordelais (vins de Bordeaux) — appellations Pauillac, Margaux, Saint-Émilion, Pomerol, Sauternes…",detail:"Le classement de 1855, établi pour l'Exposition universelle, hiérarchise 61 châteaux du Médoc (et Haut-Brion) en cinq crus ; Mouton Rothschild est le seul à être monté de catégorie (1973). Pétrus, à Pomerol, n'est pas classé mais compte parmi les vins les plus chers du monde. Le record d'enchères pour une bouteille revient toutefois à la Bourgogne : une Romanée-Conti 1945 vendue 558 000 dollars en 2018."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quelle est la différence entre Champagne et crémant, et pourquoi seule la région de Champagne peut légalement appeler ses vins pétillants 'Champagne' ?",a:"Le champagne est une AOC protégée : seuls les vins produits dans l'aire délimitée (Marne, Aube, Aisne, Haute-Marne, Seine-et-Marne) selon la méthode traditionnelle peuvent porter ce nom",detail:"La méthode traditionnelle (ou champenoise) repose sur une seconde fermentation en bouteille, qui crée les bulles. Les crémants (Alsace, Bourgogne, Loire…) utilisent la même méthode hors de Champagne. Dom Pérignon n'a pas « inventé » le champagne, contrairement à la légende, mais a contribué à l'art de l'assemblage. Les « coteaux, maisons et caves de Champagne » sont inscrits au patrimoine mondial depuis 2015."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel pays est le premier consommateur mondial de thé, et quelle cérémonie rituelle japonaise du thé (chanoyu) a été codifiée par le maître Sen no Rikyū au XVIe siècle ?",a:"La Chine est le premier consommateur (et producteur) mondial de thé — le chanoyu japonais est codifié par Sen no Rikyū (1522-1591), conseiller de Toyotomi Hideyoshi",detail:"Le thé (Camellia sinensis) vient de Chine. La légende attribue sa découverte à l'Empereur Shennong en 2737 av. J.-C. Le Japon adopte le thé matcha via les moines bouddhistes. Sen no Rikyū codifie le chanoyu : harmonie (wa), respect (kei), pureté (sei), tranquillité (jaku). Il sera contraint de commettre le seppuku par Hideyoshi. Sa tea house originale (Taian) est classée trésor national."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quel processus chimique découvert par Louis Pasteur en 1857 explique la transformation du sucre en alcool par les levures, révolutionnant la production de bière et de vin ?",a:"La fermentation alcoolique — Pasteur démontre qu'elle est due à des micro-organismes vivants (levures) et non à une réaction chimique spontanée, contredisant Liebig",detail:"Liebig voyait dans la fermentation une simple réaction chimique de décomposition. Pasteur montre (1857-1860) qu'elle est l'œuvre de micro-organismes vivants : les levures transforment le sucre en alcool et en gaz carbonique. Il travaille d'abord pour un distillateur lillois, puis étudie les maladies du vin et de la bière. La pasteurisation, d'abord appliquée au vin (1865), permet de stabiliser les boissons."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel restaurant de Gérone, tenu par les trois frères Roca, est élu meilleur restaurant du monde en 2013 et en 2015 ?",a:"El Celler de Can Roca",detail:"Joan (cuisine), Josep (salle et vins) et Jordi (desserts) associent technique de pointe (cuisson sous vide, distillation d'arômes) et terroir catalan. Joan Roca a contribué à introduire la cuisson sous vide à basse température dans la haute gastronomie. Le restaurant figure régulièrement en tête des classements mondiaux."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel chef danois, propriétaire du Noma à Copenhague, révolutionne la gastronomie mondiale dans les années 2000 avec sa cuisine 'New Nordic' fondée sur les produits locaux et la cueillette sauvage ?",a:"René Redzepi (né en 1977) — le Noma, élu cinq fois meilleur restaurant du monde, est le pionnier de la « nouvelle cuisine nordique »",detail:"Redzepi ouvre le Noma en 2003. Sa cuisine n'utilise que des produits nordiques (herbes sauvages, lichens, fourmis, fruits de mer), pousse très loin la fermentation et suit strictement les saisons. Le restaurant est élu meilleur du monde en 2010, 2011, 2012, 2014 et 2021. Fin 2024, il cesse son service régulier pour devenir un laboratoire culinaire ponctué de résidences temporaires."},
{theme:"gastro",diff:"moyen",type:"q",q:"Quel chef américain, auteur de The French Laundry Cookbook, est le premier Américain à obtenir 3 étoiles Michelin simultanément dans deux restaurants (French Laundry et Per Se) ?",a:"Thomas Keller (né en 1955) — French Laundry (Napa Valley) et Per Se (New York)",detail:"Thomas Keller ouvre le French Laundry en 1994 dans une ancienne blanchisserie de Yountville. Sa cuisine est précise, technique, influencée par la France mais profondément américaine. Il est l'un des rares Américains à avoir égalé et peut-être surpassé les grands chefs français. Anthony Bourdain qualifie le French Laundry du meilleur restaurant américain."},
{theme:"gastro",diff:"difficile",type:"q",q:"Quelle philosophie culinaire Heston Blumenthal défend-il dans son restaurant The Fat Duck (Bray) et comment sa célèbre 'snail porridge' (porridge d'escargots) illustre-t-elle l'approche multi-sensorielle ?",a:"Blumenthal défend la 'gastronomie moléculaire et multi-sensorielle' — manger est une expérience totale (vision, ouïe, mémoire, attente) et non seulement gustative",detail:"The Fat Duck (3 étoiles) crée des plats qui manipulent les perceptions : la 'Sound of the Sea' arrive avec un iPod diffusant des bruits de vagues pour amplifier la saveur du poisson. La 'snail porridge' combine la texture familière du porridge avec les escargots — subversion des attentes. Blumenthal travaille avec des psychologues et des neuroscientifiques. Le 'nitro-scrambled egg and bacon ice cream' est préparé à table à l'azote liquide."},
{theme:"gastro",diff:"facile",type:"q",q:"Quel champignon très recherché pousse sous terre en symbiose avec certains arbres, notamment des chênes et des noisetiers, et se récolte à l'aide de chiens ou de porcs dressés ?",a:"La truffe — en particulier la truffe noire du Périgord (Tuber melanosporum) et la truffe blanche d'Alba (Tuber magnatum)",detail:"La truffe noire du Périgord se récolte de novembre à mars, à quelques centimètres de profondeur. Son parfum doit beaucoup à des composés soufrés comme le diméthylsulfure. Les porcs la flairent naturellement mais ont tendance à la manger ; on leur préfère souvent des chiens, comme le lagotto romagnolo. Une seule truffe blanche d'Alba peut dépasser 100 000 euros aux enchères. La trufficulture reste aléatoire."},
