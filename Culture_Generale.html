{theme:"geo",diff:"moyen",type:"q",q:"Où se situent les îles Galapagos et pourquoi sont-elles célèbres ?",a:"Dans le Pacifique, à environ 1 000 km des côtes de l'Équateur ; Darwin y puisa des observations décisives pour sa théorie de l'évolution",detail:"Darwin y fait escale en 1835 lors du voyage du Beagle. Il observe que les pinsons et les tortues géantes diffèrent d'une île à l'autre selon les ressources. Ces observations nourrissent sa réflexion sur la sélection naturelle. Les Galápagos, inscrites au patrimoine mondial de l'UNESCO en 1978, abritent de nombreuses espèces endémiques."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle part du territoire néerlandais se situe sous le niveau de la mer, et comment le pays s'en protège-t-il ?",a:"Environ un quart ; le pays est protégé par des digues, des dunes, des polders drainés et le plan Delta",detail:"Le nom Nederland signifie « pays bas ». Les Néerlandais ont gagné environ 17 % de leur territoire sur la mer grâce aux polders, longtemps asséchés par des moulins à vent. Le plan Delta (1954-1997), lancé après l'inondation meurtrière de 1953, a été désigné comme l'une des sept merveilles du monde moderne par l'Société américaine des ingénieurs civils. La montée des eaux menace ce système."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelles grandes civilisations antiques se sont succédé sur les rives de la Méditerranée, faisant d'elle le berceau de l'Occident ?",a:"Les Égyptiens, les Phéniciens, les Grecs, les Carthaginois et les Romains",detail:"Presque fermée et navigable une grande partie de l'année, la Méditerranée a favorisé les échanges : l'alphabet phénicien, la philosophie et les mathématiques grecques, le droit romain y ont circulé. Les Romains l'appelaient « mare nostrum ». Les Arabes, à partir du VIIe siècle, prolongent ce rôle de carrefour."},
{theme:"geo",diff:"moyen",type:"q",q:"Quel est le plus grand lac d'eau douce du monde et où se situe-t-il ?",a:"Le lac Supérieur (82 100 km²), dans les Grands Lacs nord-américains à la frontière Canada-États-Unis",detail:"Les cinq Grands Lacs (Supérieur, Michigan, Huron, Érié, Ontario) forment la plus grande réserve d'eau douce de surface du monde (environ 21 %). Le lac Baïkal (Russie, environ 31 500 km²) détient le record de volume et de profondeur (1 642 m). La mer Caspienne, plus vaste, est salée."},
{theme:"geo",diff:"moyen",type:"q",q:"Quels pays bordent la mer Caspienne ?",a:"Russie, Kazakhstan, Turkménistan, Iran, Azerbaïdjan",detail:"La mer Caspienne est la plus grande étendue d'eau fermée du monde (environ 371 000 km²). C'est techniquement un lac salé. Elle est riche en hydrocarbures : l'Azerbaïdjan a bâti sa fortune autour de Bakou. Son niveau baisse fortement depuis le milieu des années 1990, en raison des prélèvements et du réchauffement."},
{theme:"geo",diff:"moyen",type:"q",q:"Entre quels pays s'étend le Sahel, d'ouest en est, et quelle organisation régionale les États sahéliens créent-ils en 2014 ?",a:"Du Sénégal (et de la Mauritanie) jusqu'au Soudan et à l'Érythrée ; le G5 Sahel (2014), dissous en 2023",detail:"Le Sahel (de l'arabe sāhil, « rivage ») est une bande semi-aride entre le Sahara et les savanes, de l'Atlantique à la mer Rouge. Les pluies erratiques (200 à 600 mm/an) entraînent des famines récurrentes. La région est le théâtre d'insurrections djihadistes depuis les années 2010. Après les coups d'État, le Mali, le Burkina Faso et le Niger ont quitté le G5 Sahel et fondé l'Alliance des États du Sahel (2023)."},
{theme:"geo",diff:"moyen",type:"q",q:"Quel pays d'Asie du Sud-Est est un archipel de 17 000 îles et le 4e pays le plus peuplé du monde ?",a:"L'Indonésie (environ 280 millions d'habitants)",detail:"L'Indonésie s'étend sur environ 5 100 km d'ouest en est. Elle compte environ 6 000 îles habitées et plus de 700 langues. Java (environ 150 millions d'habitants) est l'île la plus peuplée du monde. L'Indonésie est le pays à majorité musulmane le plus peuplé et l'une des plus grandes démocraties du monde."},
{theme:"geo",diff:"facile",type:"q",q:"Quel pays est le plus grand producteur de café au monde ?",a:"Le Brésil (produit ~40 % du café mondial)",detail:"Le café est cultivé au Brésil depuis 1727, surtout dans les États du Minas Gerais, de São Paulo et d'Espírito Santo. Le Vietnam est le 2e producteur mondial. Le port de Santos est le principal port d'exportation de café depuis le XIXe siècle."},
{theme:"geo",diff:"facile",type:"q",q:"Quel pays est le premier producteur mondial d'épices, et quel État en est surnommé le « jardin des épices » ?",a:"L'Inde ; le Kerala",detail:"L'Inde produit et consomme la majeure partie des épices mondiales (curcuma, piment, cumin, gingembre). Elle n'est pas en tête pour toutes : le Vietnam est le premier producteur de poivre et le Guatemala celui de cardamome. C'est pour atteindre directement les épices de l'Inde que Vasco de Gama contourne l'Afrique (1498)."},
{theme:"geo",diff:"facile",type:"q",q:"Quelle chaîne de montagnes forme la frontière entre la France et l'Espagne ?",a:"Les Pyrénées (430 km, culminant au pic d'Aneto 3 404 m côté espagnol et au Vignemale 3 298 m côté français)",detail:"Les Pyrénées forment une barrière naturelle presque continue entre la France et l'Espagne, de l'Atlantique à la Méditerranée. Elles abritent la principauté d'Andorre. Leurs cols, peu nombreux et souvent fermés en hiver, ont longtemps freiné les échanges. La végétation passe des forêts atlantiques à l'ouest aux garrigues méditerranéennes à l'est."},
{theme:"geo",diff:"facile",type:"q",q:"Quel continent est souvent appelé « le continent rouge » ?",a:"L'Australie, en raison de ses vastes étendues de déserts rouges (oxyde de fer dans les sols)",detail:"L'intérieur de l'Australie, le « Red Centre », est dominé par des déserts aux sols rougeâtres. Uluru (Ayers Rock), immense monolithe de grès, en est le symbole. Les anglophones surnomment aussi l'Australie « Down Under »."},
{theme:"geo",diff:"facile",type:"q",q:"Quel pays abrite à la fois les Andes, l'Amazonie et les îles Galapagos ?",a:"L'Équateur",detail:"Malgré sa petite taille (environ 284 000 km²), l'Équateur fait partie des pays les plus riches en biodiversité. Les Andes le traversent du nord au sud, l'Amazonie couvre l'est, la côte pacifique l'ouest, et les Galápagos sont à environ 1 000 km au large. Il doit son nom à l'équateur, qui passe juste au nord de Quito."},
{theme:"geo",diff:"facile",type:"q",q:"Quelle ville est la capitale mondiale du tango ?",a:"Buenos Aires (Argentine)",detail:"Le tango naît à la fin du XIXe s. dans les quartiers populaires de Buenos Aires et Montevideo, mêlant influences africaines, gaucho et européennes (immigration italienne et espagnole). Il est inscrit au patrimoine immatériel de l'UNESCO depuis 2009. Buenos Aires, avec ses quartiers La Boca et San Telmo, en est le cœur vivant."},
{theme:"geo",diff:"facile",type:"q",q:"Quelle ville norvégienne, au-delà du cercle polaire, est réputée comme l'une des meilleures au monde pour observer les aurores boréales ?",a:"Tromsø",detail:"Les aurores boréales naissent quand des particules du vent solaire, guidées par le champ magnétique terrestre, excitent les atomes d'oxygène et d'azote de la haute atmosphère. Elles sont surtout visibles sous l'ovale auroral, entre environ 65° et 72° de latitude nord, pendant les longues nuits d'hiver. La Laponie finlandaise et suédoise, l'Islande et le nord du Canada sont d'autres lieux d'observation réputés."},
{theme:"geo",diff:"facile",type:"q",q:"Quel est le nom de l'archipel atlantique appartenant à la France et situé près du Canada ?",a:"Saint-Pierre-et-Miquelon",detail:"Cet archipel de 242 km² est le dernier vestige de la Nouvelle-France en Amérique du Nord. Situé à environ 25 km de Terre-Neuve (Canada), c'est une collectivité d'outre-mer française d'environ 6 000 habitants. Il vit à l'heure UTC−3 (UTC−2 en été). La pêche à la morue y a été l'activité principale pendant des siècles."},
{theme:"geo",diff:"facile",type:"q",q:"Quel fleuve est le plus long d'Europe ?",a:"La Volga (environ 3 530 km, en Russie)",detail:"La Volga prend sa source dans les collines de Valdaï et se jette dans la mer Caspienne près d'Astrakhan, en formant un vaste delta. Les Russes l'appellent « Matouchka Volga » (« Petite mère Volga »). Stalingrad (aujourd'hui Volgograd) devait son importance stratégique à sa position sur le fleuve."},
{theme:"geo",diff:"facile",type:"q",q:"Quel est le pays le moins densément peuplé du monde (hors Antarctique) ?",a:"La Mongolie (environ 2 hab./km² : 3,5 millions d'habitants sur 1,56 million de km²)",detail:"La Mongolie, prise entre la Russie et la Chine, est dominée par les steppes, le désert de Gobi et les montagnes. Un tiers de la population est nomade ou semi-nomade. Oulan-Bator concentre la moitié de la population totale du pays. Autrefois cœur du plus grand empire terrestre (XIIIe s.), la Mongolie est aujourd'hui l'un des pays les plus vides du monde."},
{theme:"geo",diff:"facile",type:"q",q:"Quel bras de mer sépare la Grande-Bretagne de la France ?",a:"La Manche (environ 33 km au plus étroit, au pas de Calais)",detail:"La Manche est l'une des voies maritimes les plus fréquentées du monde. Le tunnel sous la Manche (1994) la traverse en environ 35 minutes de trajet, dont 38 km sous la mer. Matthew Webb fut le premier à la traverser à la nage, en 1875, en 21 h 45."},
{theme:"geo",diff:"moyen",type:"q",q:"Combien de pays composent l'espace Schengen en 2025, et quels membres de l'UE n'en font pas partie ?",a:"29 pays (25 membres de l'UE plus l'Islande, le Liechtenstein, la Norvège et la Suisse) ; l'Irlande et Chypre n'en font pas partie",detail:"L'accord de Schengen (1985, signé au Luxembourg) supprime les contrôles aux frontières intérieures. La Roumanie et la Bulgarie ont rejoint l'espace pour les frontières aériennes et maritimes en mars 2024, puis terrestres en janvier 2025. L'Irlande a choisi de rester en dehors ; Chypre attend son intégration."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle est la capitale politique de l'Union européenne et où siège le Parlement européen ?",a:"Bruxelles accueille la Commission et le Conseil ; le Parlement européen siège à Strasbourg (sessions plénières) et Bruxelles (commissions)",detail:"Le système institutionnel de l'UE est polycentrique : la Commission européenne (exécutif) et le Conseil de l'UE siègent à Bruxelles, le Parlement européen à Strasbourg et à Bruxelles (son secrétariat est à Luxembourg), la Cour de justice à Luxembourg. Cette dispersion résulte de compromis politiques."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle est la particularité géologique des îles Hawaii ?",a:"Archipel volcanique créé par un point chaud fixe dans le manteau terrestre, sur lequel la plaque Pacifique se déplace vers le nord-ouest",detail:"Hawaii est le seul État américain à croître encore : la grande île Hawaii grandit grâce aux éruptions du Kilauea et du Mauna Loa. Les îles du nord-ouest de l'archipel sont plus vieilles et plus érodées. La chaîne d'îles Hawaii-Empereur enregistre le passage de la plaque Pacifique sur ce point chaud depuis 80 millions d'années."},
{theme:"geo",diff:"moyen",type:"q",q:"Quels cinq États riverains se partagent et revendiquent les ressources de l'océan Arctique ?",a:"La Russie, le Canada, les États-Unis, la Norvège et le Danemark (via le Groenland)",detail:"L'Arctique contiendrait environ 13 % des réserves mondiales de pétrole non découvertes et 30 % de celles de gaz (USGS, 2008). La Russie a planté un drapeau en titane au fond de l'océan, sous le pôle Nord, en 2007. La Convention des Nations unies sur le droit de la mer encadre les revendications sur le plateau continental. Le recul des glaces ouvre de nouvelles routes maritimes."},
{theme:"geo",diff:"moyen",type:"q",q:"Quels sont les pays de l'Asean et que représente cette organisation ?",a:"11 pays d'Asie du Sud-Est : Indonésie, Malaisie, Philippines, Singapour, Thaïlande (fondateurs, 1967), Brunei, Vietnam, Laos, Myanmar, Cambodge et Timor oriental (depuis 2025)",detail:"L'ASEAN promeut la stabilité régionale et l'intégration économique ; aucune guerre n'a opposé ses membres depuis sa création. Elle compte près de 700 millions d'habitants et formerait la 5e économie mondiale si elle était un seul pays. Le Timor oriental en est devenu le 11e membre en octobre 2025. Le Myanmar est exclu des sommets des dirigeants depuis le coup d'État de 2021."},
{theme:"geo",diff:"moyen",type:"q",q:"Quel pays, bâti sur le plus grand delta du monde, est particulièrement menacé par la montée des eaux et les cyclones ?",a:"Le Bangladesh, bâti sur le delta du Gange et du Brahmapoutre",detail:"Ce delta d'environ 100 000 km², partagé avec l'Inde, abrite les Sundarbans, plus grande forêt de mangrove du monde. Le Bangladesh (environ 1 200 hab./km²) pourrait perdre près de 20 % de son territoire si le niveau de la mer montait d'1 m. Des millions de déplacés climatiques sont attendus."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle ville est considérée comme la capitale mondiale de la finance ?",a:"New York (première place financière mondiale par capitalisation boursière) ou Londres (hub mondial du forex et des marchés de gré à gré)",detail:"Le NYSE est la première bourse mondiale par capitalisation (plus de 25 000 milliards de dollars). Londres traite environ 38 % des transactions mondiales de devises (BRI, 2022). Avec Hong Kong, Singapour, Tokyo, Zurich et Francfort, ces villes forment les nœuds du réseau financier mondial."},
{theme:"geo",diff:"difficile",type:"q",q:"Quel petit pays européen, grâce à l'agriculture sous serre et hors-sol, est le 2e exportateur agricole mondial ?",a:"Les Pays-Bas",detail:"Sur à peine 41 500 km², les Pays-Bas exportent plus de 120 milliards d'euros de produits agricoles par an (2023), grâce à des serres ultra-intensives, souvent hydroponiques. Les fermes verticales se développent à Singapour, au Japon ou aux États-Unis pour économiser le foncier. Selon la FAO, environ un tiers des sols du monde sont dégradés."},
{theme:"geo",diff:"difficile",type:"q",q:"Pourquoi les Andes abritent-elles les plus grands gisements de cuivre du monde, selon la géographie des plaques tectoniques ?",a:"Parce que la subduction de la plaque de Nazca sous l'Amérique du Sud produit des magmas qui concentrent le cuivre en gisements dits porphyriques",detail:"Le Chili est le premier producteur mondial de cuivre et détient environ un cinquième des réserves mondiales. La même tectonique andine a créé l'Altiplano, dont les bassins fermés abritent des salars riches en lithium (triangle Chili-Argentine-Bolivie). Le pétrole du golfe Persique est piégé dans des bassins sédimentaires plissés par la collision Arabie-Eurasie."},
{theme:"geo",diff:"difficile",type:"q",q:"Dans quel golfe américain une zone morte due à l'eutrophisation s'étend-elle chaque été, alimentée par les engrais du bassin du Mississippi ?",a:"Le golfe du Mexique",detail:"Le Mississippi charrie vers le golfe l'azote et le phosphore des engrais du Midwest. Ces nutriments provoquent une prolifération d'algues dont la décomposition épuise l'oxygène (eutrophisation) : la zone morte couvre souvent 15 000 à 20 000 km² en été. La mer Baltique et la mer Noire connaissent aussi de vastes zones privées d'oxygène."},
{theme:"geo",diff:"difficile",type:"q",q:"Quel continent présente le taux de pénétration d'internet le plus faible malgré une croissance rapide, creusant la fracture numérique mondiale ?",a:"L'Afrique",detail:"Environ 38 % des Africains utilisent internet, contre environ deux tiers de la population mondiale (UIT, 2024). Le mobile y progresse très vite, sans passer par la ligne fixe (« saut technologique »). La fracture numérique oppose les pays développés (plus de 90 % d'internautes) aux pays les moins avancés (environ un tiers)."},
{theme:"geo",diff:"difficile",type:"q",q:"Sur quel versant des Alpes le fœhn souffle-t-il le plus souvent, et quels pays en ressentent les effets ?",a:"Sur le versant nord, sous le vent, lors des flux du sud ; il touche surtout la Suisse, l'Autriche et la Bavière",detail:"Quand une masse d'air humide monte sur le versant au vent, elle se refroidit et perd son humidité en pluie ou en neige. En redescendant de l'autre côté, elle se réchauffe d'environ 1 °C par 100 m, plus vite qu'elle ne s'était refroidie, et arrive chaude et sèche. Le fœhn peut faire grimper la température de 10 à 20 °C en quelques heures et attiser les incendies."},
{theme:"geo",diff:"difficile",type:"q",q:"Quel pourcentage de sa surface la mer d'Aral a-t-elle perdu entre 1960 et 2007, et quelle politique soviétique en est responsable ?",a:"Environ 90 % ; la cause est l'irrigation massive des cultures de coton décidée par l'URSS",detail:"Dès les années 1960, l'URSS détourne l'Amou-Daria et le Syr-Daria, les deux fleuves qui alimentent la mer d'Aral, pour irriguer le coton d'Asie centrale. La mer se fragmente et laisse un désert de sel toxique, l'Aralkoum ; des épaves reposent aujourd'hui à plus de 100 km du rivage. Le barrage de Kok-Aral (2005) a permis au Kazakhstan de faire remonter la « petite Aral » au nord, mais le bassin sud est presque perdu."},
{theme:"geo",diff:"difficile",type:"q",q:"Qui trace en 1893 la ligne Durand entre l'Afghanistan et le Pakistan, divisant les populations pachtounes sans leur consentement ?",a:"Sir Mortimer Durand, diplomate britannique",detail:"La ligne Durand (environ 2 640 km) coupe en deux l'aire de peuplement pachtoune. Le Pakistan la considère comme une frontière internationale ; l'Afghanistan ne l'a jamais reconnue. Les zones tribales (FATA), intégrées à la province de Khyber Pakhtunkhwa en 2018, sont longtemps restées hors du contrôle des États. Ce tracé colonial alimente encore l'instabilité régionale."},
{theme:"geo",diff:"difficile",type:"q",q:"Tous les combien d'années environ le phénomène El Niño se produit-il, et quelles régions du monde subissent sécheresses et inondations à cause de lui ?",a:"Tous les 2 à 7 ans ; il provoque notamment des sécheresses en Australie, en Indonésie et en Afrique australe, et des inondations au Pérou et en Équateur",detail:"El Niño est un réchauffement anormal des eaux du Pacifique équatorial est. Les eaux chaudes, normalement accumulées à l'ouest (Indonésie, Australie), migrent vers l'est (Pérou, Équateur). Il apporte aussi de fortes pluies en Afrique de l'Est, mais réduit les ouragans dans l'Atlantique. Les années El Niño figurent souvent parmi les plus chaudes jamais mesurées."},
{theme:"geo",diff:"difficile",type:"q",q:"Quel fleuve possède le plus grand bassin versant du monde, avec environ 7 millions de km² ?",a:"L'Amazone",detail:"Un bassin versant est le territoire dont toutes les eaux rejoignent le même exutoire. Après l'Amazone viennent le Congo et le Nil. Les bassins transcendent les frontières : le Nil traverse 11 pays, le Congo 9. Les conflits de l'eau (barrage Atatürk en Turquie, Grand barrage de la Renaissance en Éthiopie) se jouent à l'échelle des bassins."},
{theme:"geo",diff:"difficile",type:"q",q:"De combien de centimètres Venise s'est-elle enfoncée au cours du XXe siècle, et quel projet d'ingénierie tente d'enrayer ce phénomène ?",a:"D'environ 25 cm (affaissement du sol et montée de la mer) ; le système MOSE de digues mobiles",detail:"Venise est bâtie sur 118 îlots de la lagune, fondée selon la tradition au Ve siècle par des populations fuyant les invasions. Au XXe siècle, le pompage des nappes phréatiques a accéléré l'affaissement, aujourd'hui ralenti à environ 1 à 2 mm par an. L'acqua alta (inondation lors des grandes marées) devient plus fréquente. Les 78 vannes du MOSE protègent la ville depuis 2020 lors des marées exceptionnelles."},
{theme:"geo",diff:"facile",type:"q",q:"Quelle est la capitale de l'Inde ?",a:"New Delhi",detail:"Le transfert de la capitale de Calcutta à Delhi est annoncé en 1911 ; New Delhi, construite par les Britanniques, est inaugurée en 1931. L'agglomération de Delhi compte plus de 30 millions d'habitants. Mumbai est la capitale économique et financière. L'Inde est la plus grande démocratie du monde, avec près de 970 millions d'électeurs inscrits en 2024."},
{theme:"geo",diff:"facile",type:"q",q:"Quel est le plus grand pays francophone du monde par superficie ?",a:"La République démocratique du Congo (2 344 000 km²)",detail:"La RDC est le 2e plus grand pays d'Afrique après l'Algérie. Elle abrite la deuxième forêt tropicale du monde, après l'Amazonie, et d'immenses ressources minières (cobalt, cuivre, coltan). Kinshasa, sa capitale, est avec plus de 15 millions d'habitants la plus grande ville francophone du monde."},
{theme:"geo",diff:"facile",type:"q",q:"Quel pays possède le plus de lacs d'eau douce au monde ?",a:"Le Canada (plus de 31 000 lacs de plus de 3 km²)",detail:"Les glaciations du Quaternaire ont creusé au Canada d'innombrables cuvettes ; certaines études estiment qu'il abrite plus de la moitié des lacs du monde. La Finlande, « pays des mille lacs », en compte en réalité environ 188 000, de taille modeste. Le Canada détient environ 20 % des réserves mondiales d'eau douce de surface."},
{theme:"geo",diff:"facile",type:"q",q:"Quel pays d'Asie du Sud-Est a fait inscrire en 1995 ses rizières en terrasses des cordillères au patrimoine mondial de l'UNESCO ?",a:"Les Philippines (rizières des Ifugao, sur l'île de Luçon)",detail:"Taillées à flanc de montagne depuis environ 2 000 ans, ces terrasses retiennent l'eau grâce à de petites diguettes. Les plus célèbres sont celles de Banaue et de Batad. D'autres rizières en terrasses sont inscrites à l'UNESCO : le système des subak à Bali (Indonésie, 2012) et les terrasses des Hani au Yunnan (Chine, 2013)."},
{theme:"geo",diff:"facile",type:"q",q:"Quel est le seul pays d'Amérique du Sud à avoir l'anglais comme langue officielle ?",a:"Le Guyana (ancienne Guyane britannique)",detail:"Le Guyana (à ne pas confondre avec la Guyane, collectivité française) est le seul État d'Amérique du Sud dont l'anglais est la langue officielle. Il borde le Venezuela, le Brésil et le Suriname. La découverte de pétrole en mer en 2015 a transformé son économie."},
{theme:"geo",diff:"moyen",type:"q",q:"En quelle année Frederick Jackson Turner présente-t-il sa thèse sur la frontier américaine, et à quelle occasion historique le fait-il ?",a:"En 1893, lors du congrès de l'American Historical Association tenu pendant l'Exposition universelle de Chicago",detail:"Turner soutient que la frontière mobile de la colonisation, de l'Est vers l'Ouest, a forgé le caractère américain (individualisme, démocratie, pragmatisme) : les colons repartaient de zéro, loin des hiérarchies européennes. Le Bureau du recensement ayant déclaré la frontière close en 1890, Turner s'inquiète pour l'avenir de la démocratie. Sa thèse est critiquée car elle ignore les peuples autochtones."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle conférence de 1884-1885 fixe les règles du partage de l'Afrique entre les puissances européennes ?",a:"La conférence de Berlin",detail:"Contrairement à une idée reçue, la conférence ne trace pas les frontières africaines : elle fixe les règles du partage (principe d'occupation effective, libre navigation sur le Congo et le Niger) et reconnaît l'État indépendant du Congo de Léopold II. Les frontières, souvent rectilignes, sont négociées ensuite par des traités bilatéraux. Elles séparent parfois des peuples (Yoruba entre Nigeria et Bénin) et en regroupent d'autres, ce qui pèse sur la stabilité post-coloniale."},
{theme:"geo",diff:"facile",type:"q",q:"Quel pays abrite le Taj Mahal et où se situe ce monument ?",a:"L'Inde — le Taj Mahal se trouve à Agra, dans l'État de l'Uttar Pradesh",detail:"Le Taj Mahal fut construit par l'empereur moghol Shah Jahan entre 1631 et 1653 environ, en mémoire de son épouse Mumtaz Mahal. Ce mausolée en marbre blanc est inscrit au patrimoine mondial de l'UNESCO depuis 1983 et reçoit plusieurs millions de visiteurs par an. Il est considéré comme le chef-d'œuvre de l'architecture moghole."},
{theme:"geo",diff:"facile",type:"q",q:"Quel pays d'Afrique est le plus peuplé du continent ?",a:"Le Nigeria (environ 230 millions d'habitants)",detail:"Le Nigeria pourrait devenir l'un des trois pays les plus peuplés du monde d'ici la fin du siècle. Lagos (plus de 15 millions d'habitants) est l'une des plus grandes villes d'Afrique. Le pays est l'un des premiers producteurs africains de pétrole et l'une des plus grandes économies du continent. On le surnomme le « géant de l'Afrique »."},
{theme:"geo",diff:"facile",type:"q",q:"Quel est le plus long fleuve d'Amérique du Sud ?",a:"L'Amazone (environ 6 400 km, voire davantage selon la source retenue)",detail:"L'Amazone transporte environ 20 % de l'eau douce que les fleuves déversent dans les océans, avec un débit moyen d'environ 209 000 m³/s. Sa source la plus lointaine se trouve dans les Andes péruviennes (Apurímac ou Mantaro selon les études). La question du fleuve le plus long du monde (Amazone ou Nil) dépend de ce choix."},
{theme:"geo",diff:"moyen",type:"q",q:"Quels pays composent le Maghreb ?",a:"Maroc, Algérie, Tunisie, Libye et Mauritanie (selon la définition large) — ou simplement Maroc, Algérie, Tunisie (sens étroit)",detail:"Le terme Maghreb signifie « le couchant » en arabe. L'Union du Maghreb arabe (UMA), fondée en 1989, regroupe ces 5 pays. Malgré leur proximité géographique, linguistique et culturelle, les tensions politiques, notamment entre l'Algérie et le Maroc au sujet du Sahara occidental, paralysent l'intégration."},
{theme:"geo",diff:"moyen",type:"q",q:"Que révèle géologiquement la dépression de l'Afar en Éthiopie, l'une des rares zones où un rift continental est observable en surface ?",a:"La naissance d'un océan : trois plaques (nubienne, somalienne et arabique) s'y écartent, et la Corne de l'Afrique se détache lentement du continent",detail:"Le triangle de l'Afar (Éthiopie, Djibouti, Érythrée) est l'un des rares endroits où un rift en voie d'océanisation est visible à terre. Le lac Assal (Djibouti) est à environ 155 m sous le niveau de la mer. Le système du Grand Rift s'étend sur des milliers de km jusqu'au Mozambique. L'Afar est aussi un berceau de l'humanité : Lucy (Australopithecus afarensis) y a été découverte en 1974."},
{theme:"geo",diff:"moyen",type:"q",q:"Quelle superficie la forêt boréale (taïga) couvre-t-elle, et quels deux pays en abritent la plus grande partie ?",a:"Environ 12 millions de km² ; la Russie et le Canada en abritent la plus grande partie",detail:"La taïga, forêt de conifères qui s'étend du Canada à la Sibérie en passant par la Scandinavie, est le plus vaste biome forestier du monde (près de 30 % des forêts). Elle stocke d'immenses quantités de carbone dans ses sols et abrite l'orignal, le loup, le lynx et des millions d'oiseaux migrateurs. La Russie en possède plus de la moitié. Les incendies, aggravés par le réchauffement, la menacent."},
{theme:"geo",diff:"difficile",type:"q",q:"Quel pays asiatique a enregistré en 2023 le taux de fécondité le plus bas du monde, avec 0,72 enfant par femme ?",a:"La Corée du Sud",detail:"Le taux est remonté à 0,75 en 2024, puis à 0,80 en 2025, loin du seuil de remplacement (2,1). Le Japon, qui compte près de 30 % de plus de 65 ans, est le pays le plus avancé dans le vieillissement. La Chine, après la politique de l'enfant unique (1980-2015), vieillit rapidement (« vieillir avant de s'enrichir »)."},
// NOUVELLES CARTES HIST. SCIENCES (42 cartes pour atteindre 100),
{theme:"sciences",diff:"facile",type:"q",q:"Qui a développé la théorie de la relativité restreinte en 1905 ?",a:"Albert Einstein, à 26 ans, avec son article sur l'électrodynamique des corps en mouvement",detail:"En 1905, son « année miraculeuse », Einstein publie quatre articles majeurs : sur l'effet photoélectrique, le mouvement brownien, la relativité restreinte et l'équivalence masse-énergie (E = mc²). Il est alors expert à l'Office des brevets de Berne. La relativité restreinte repose sur deux postulats : les lois de la physique sont les mêmes dans tous les référentiels inertiels, et la vitesse de la lumière dans le vide y est la même."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui est considéré comme le père de la géométrie et quand a-t-il vécu ?",a:"Euclide d'Alexandrie (~330-270 av. J.-C.), auteur des Éléments",detail:"Les Éléments d'Euclide (13 livres) codifient la géométrie à partir de 5 postulats. C'est le manuel scientifique le plus diffusé de l'histoire après la Bible. Il a été utilisé dans les écoles jusqu'au XXe siècle. Les géométries non-euclidiennes (Bolyai, Lobatchevski, Riemann) remettent en cause le 5e postulat au XIXe s. — menant à la relativité générale d'Einstein."},
{theme:"sciences",diff:"facile",type:"q",q:"Quel astronome finance de sa poche la publication des Principia de Newton en 1687 ?",a:"Edmond Halley",detail:"En 1684, Halley demande à Newton quelle orbite suivrait une planète soumise à une force inversement proportionnelle au carré de la distance ; Newton répond « une ellipse » et développe ses calculs. Halley pousse à la rédaction des Principia et en paie l'impression, la Royal Society étant à court d'argent. Il prédit ensuite, grâce à la mécanique de Newton, le retour de la comète qui porte son nom (observé en 1758)."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a formalisé les lois du mouvement des planètes au début du XVIIe siècle ?",a:"Johannes Kepler (1609-1619), à partir des observations de Tycho Brahe",detail:"Les 3 lois de Kepler : (1) les planètes décrivent des ellipses dont le Soleil est un foyer ; (2) les rayons planète-Soleil balayent des surfaces égales en temps égaux ; (3) T²/a³ = constante. Ces lois, purement empiriques, seront expliquées par la gravitation de Newton. Elles sont encore utilisées pour calculer les trajectoires des sondes spatiales."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé le thermomètre et l'échelle de températures qui porte son nom ?",a:"Gabriel Fahrenheit (1724) pour le mercure et l'échelle Fahrenheit ; Anders Celsius (1742) pour l'échelle centésimale",detail:"Galilée avait conçu un thermoscope sans échelle. Fahrenheit fabrique un thermomètre à mercure fiable (1714) et définit son échelle en 1724. Celsius propose en 1742 une échelle centésimale, d'abord inversée (100 pour la glace fondante, 0 pour l'eau bouillante), retournée peu après. Fahrenheit reste utilisé aux États-Unis, Celsius presque partout ailleurs."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a découvert l'oxygène et joué un rôle central dans la révolution chimique ?",a:"Carl Wilhelm Scheele (1772) et Joseph Priestley (1774) découvrent l'oxygène indépendamment — Lavoisier comprend son rôle dans la combustion",detail:"Priestley isole le « gaz déphlogistiqué » mais reste prisonnier de la théorie du phlogistique. Lavoisier comprend que ce gaz (qu'il nomme oxygène, 'qui produit des acides') est le principe actif de la combustion et de la respiration. Il détruit la théorie du phlogistique et fonde la chimie moderne avec une nomenclature rigoureuse."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé le premier ordinateur programmable électronique ?",a:"John Mauchly et J. Presper Eckert avec l'ENIAC (1945), mais Alan Turing avait posé les bases théoriques dès 1936",detail:"ENIAC, achevé fin 1945 et présenté en 1946, pèse environ 27 tonnes et compte 18 000 tubes à vide ; il effectue 5 000 additions par seconde. Il avait des prédécesseurs : le Z3 électromécanique de Konrad Zuse (1941) et les Colossus britanniques (1943-1944), électroniques mais spécialisés. L'article de Turing de 1936 sur les nombres calculables pose les fondements théoriques de l'informatique."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a formulé les lois de la thermodynamique et inventé le concept d'entropie ?",a:"Le premier principe (conservation de l'énergie) est établi par Mayer, Joule et Helmholtz dans les années 1840 ; Rudolf Clausius formule le second principe et introduit l'entropie (1850-1865)",detail:"Sadi Carnot pose les bases dès 1824 en étudiant le rendement des machines à vapeur. Le second principe affirme que l'entropie d'un système isolé ne peut que croître ; Kelvin en donne une autre formulation. Boltzmann en propose une interprétation statistique : S = k ln W. Ces principes sont parmi les plus généraux de la physique."},
{theme:"sciences",diff:"facile",type:"q",q:"Quel physicien britannique autodidacte découvre l'induction électromagnétique en 1831 ?",a:"Michael Faraday",detail:"Fils d'un forgeron, apprenti relieur, Faraday devient l'assistant de Humphry Davy puis le plus grand expérimentateur de son siècle. Il montre dès 1821 qu'un courant peut produire une rotation (principe du moteur), puis qu'un aimant en mouvement induit un courant, principe de la dynamo et du transformateur. Maxwell met ses découvertes en équations. Einstein avait son portrait dans son bureau."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quelle expérience — réelle ou légendaire — Galilée aurait-il menée à la tour de Pise pour démontrer que tous les corps tombent à la même vitesse ?",a:"Lâcher du sommet de la tour deux boules de masses différentes, qui touchent le sol en même temps — récit de son disciple Viviani, sans doute légendaire",detail:"Galilée montre que, en l'absence de résistance de l'air, tous les corps tombent avec la même accélération, contrairement à Aristote. Il le démontre surtout avec des billes roulant sur des plans inclinés, en mesurant le temps à l'aide d'une horloge à eau. Cette alliance de l'expérience et des mathématiques fonde la physique moderne."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel est le rôle de Marie Curie dans l'histoire des sciences ?",a:"Première femme Prix Nobel (physique 1903, chimie 1911) — elle découvrit le polonium et le radium, établissant la radioactivité comme propriété atomique",detail:"Marie Curie (Sklodowska, 1867-1934) isole le polonium (nommé après sa Pologne natale) et le radium, 10 000 fois plus radioactif que l'uranium. Avec Pierre Curie, elle démontre que la radioactivité est une propriété de l'atome lui-même (pas une réaction chimique). Elle mourra d'anémie aplasique — probablement causée par ses années d'exposition. Son carnet de laboratoire est encore trop radioactif pour être consulté sans protection."},
{theme:"sciences",diff:"moyen",type:"q",q:"Sur quel navire Charles Darwin fait-il le tour du monde de 1831 à 1836 ?",a:"Le HMS Beagle",detail:"Embarqué comme naturaliste aux côtés du capitaine FitzRoy, Darwin explore l'Amérique du Sud, les Galápagos, l'Australie. Il récolte fossiles, plantes et animaux, et observe des variations entre îles proches. De retour, il mûrit sa théorie pendant une vingtaine d'années avant de publier L'Origine des espèces (1859), sous la pression de l'essai de Wallace."},
{theme:"sciences",diff:"moyen",type:"q",q:"Qui dresse en 1815 la première carte géologique d'un pays entier en fondant la stratigraphie, et de quel pays s'agit-il ?",a:"William Smith ; la Grande-Bretagne (Angleterre, pays de Galles et une partie de l'Écosse)",detail:"Smith, ingénieur des canaux, remarque que les mêmes fossiles se trouvent dans les mêmes couches partout en Angleterre. Il déduit que ces couches se sont déposées à des époques différentes. Sa carte (1815) est considérée comme la première carte géologique moderne. Elle permettra de localiser le charbon et de rationaliser les travaux de génie civil."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel géologue britannique oppose au catastrophisme de Cuvier le principe d'uniformitarisme, influençant profondément Darwin ?",a:"Charles Lyell",detail:"Georges Cuvier démontre l'extinction des espèces (1812) en étudiant des mammouths et mastodontes. Il explique ces extinctions par des cataclysmes. Charles Lyell (Principes de géologie, 1830) argumente au contraire pour des processus lents et uniformes (érosion, dépôt). C'est l'uniformitarisme de Lyell qui inspirera Darwin — et qui a raison dans les grandes lignes, même si des catastrophes existent (impact de l'astéroïde K-T)."},
{theme:"sciences",diff:"moyen",type:"q",q:"En quelle année Joseph Lister introduit-il l'acide phénique comme antiseptique en chirurgie, révolutionnant la survie post-opératoire ?",a:"En 1867",detail:"Avant Lister, les chirurgiens opéraient sans se laver les mains, en blouse ensanglantée. La mortalité post-opératoire atteignait 50 %. Lister lit les travaux de Pasteur et asperge ses instruments, plaies et mains d'acide phénique. Les résultats sont spectaculaires. L'antisepsie de Lister est la première application directe de la théorie des germes à la médecine clinique."},
{theme:"sciences",diff:"moyen",type:"q",q:"Qui a découvert les vitamines et comment ?",a:"Christiaan Eijkman montre dans les années 1890 que le béribéri est lié à l'alimentation ; Casimir Funk forge le mot « vitamine » en 1912",detail:"Eijkman, en poste à Java, observe que des poulets nourris de riz poli développent une maladie proche du béribéri, guérie par le riz complet. Frederick Hopkins démontre l'existence de « facteurs alimentaires accessoires ». Funk, pensant qu'il s'agit d'amines vitales, forge le mot « vitamine ». La thiamine (vitamine B1) est isolée en 1926. Eijkman et Hopkins partagent le Nobel de médecine en 1929."},
{theme:"sciences",diff:"moyen",type:"q",q:"En quelle année Huygens construit-il la première horloge à pendule, et quelle précision atteint-elle par rapport aux horloges antérieures ?",a:"En 1656 (horloge réalisée en 1657) ; elle ne dérive plus que d'une dizaine de secondes par jour, contre plusieurs minutes auparavant",detail:"Galilée avait remarqué que la période d'un pendule dépend surtout de sa longueur. Grâce à l'horloge de Huygens, la mesure du temps fait un bond. Pour la navigation, l'enjeu est la longitude : 4 minutes d'erreur correspondent à 1° de longitude, soit environ 110 km à l'équateur. Le prix britannique de la longitude (1714) stimule l'invention du chronomètre de marine de John Harrison."},
{theme:"sciences",diff:"moyen",type:"q",q:"En quelle année John Dalton propose-t-il sa théorie atomique, et quelle propriété fondamentale attribue-t-il aux atomes d'un même élément ?",a:"Entre 1803 et 1808 (New System of Chemical Philosophy) ; tous les atomes d'un même élément ont la même masse, différente de celle des autres éléments",detail:"Dalton reprend l'atomisme grec mais le fonde sur des mesures. Il détermine les masses atomiques relatives (H=1) à partir des rapports de composition des composés. Ses Tables of Atomic Weights (1803) sont la première table des éléments. Sa théorie explique pourquoi les éléments se combinent toujours en rapports entiers (loi des proportions multiples)."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel rôle a joué l'astronomie islamique médiévale dans la conservation et la transmission du savoir antique ?",a:"Les savants islamiques (IXe-XIIe s.) traduisirent, corrigèrent et étendirent l'astronomie ptoléméenne — transmettant ce savoir à l'Europe via l'Espagne",detail:"Al-Battani (858-929) corrige les tables de Ptolémée et mesure l'inclinaison de l'écliptique. Al-Biruni calcule la circonférence de la Terre avec une précision remarquable. L'Almageste de Ptolémée est traduit de l'arabe en latin à Tolède au XIIe s. Les noms d'étoiles (Aldébaran, Altaïr, Bételgeuse) gardent leurs noms arabes."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quel physicien français développe dans les années 1810-1820 une théorie ondulatoire de la lumière qui explique la diffraction ?",a:"Augustin Fresnel",detail:"En 1818, Fresnel présente à l'Académie des sciences un mémoire sur la diffraction. Poisson, partisan de la théorie corpusculaire, objecte que la théorie prévoit un point lumineux au centre de l'ombre d'un disque, ce qui lui semble absurde ; Arago fait l'expérience et observe ce point (« tache de Poisson » ou d'Arago). Fresnel invente aussi la lentille à échelons utilisée dans les phares."},
{theme:"sciences",diff:"moyen",type:"q",q:"Combien d'éléments Mendeleïev connaît-il en 1869 quand il publie son tableau périodique, et combien en prédit-il en laissant des cases vides ?",a:"63 éléments connus ; il en prédit plusieurs, dont trois découverts peu après avec les propriétés annoncées : le gallium (1875), le scandium (1879) et le germanium (1886)",detail:"Mendeleïev classe les éléments par masse atomique et constate que leurs propriétés se répètent périodiquement. Il laisse des cases vides pour l'« éka-aluminium », l'« éka-bore » et l'« éka-silicium ». Le tableau moderne, fondé sur le numéro atomique (Moseley, 1913), compte 118 éléments ; l'élément 101 porte le nom de mendélévium."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quelle unité fondamentale Claude Shannon introduit-il dans sa théorie mathématique de l'information de 1948 ?",a:"Le bit (binary digit)",detail:"Ingénieur aux Bell Labs, Shannon publie en 1948 « A Mathematical Theory of Communication ». Il mesure l'information en bits, définit l'entropie de l'information et établit la capacité maximale d'un canal bruité. Ces résultats fondent la compression, la correction d'erreurs et toutes les télécommunications numériques. Dès son mémoire de 1937, il avait appliqué l'algèbre de Boole aux circuits électriques."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quel physicien français vérifie expérimentalement en 1908 la théorie d'Einstein sur le mouvement brownien, établissant la réalité des atomes ?",a:"Jean Perrin (prix Nobel de physique 1926)",detail:"À la fin du XIXe siècle, des savants comme Mach et Ostwald tenaient les atomes pour de simples hypothèses commodes. Einstein montre en 1905 que l'agitation de petites particules en suspension s'explique par les chocs des molécules. Perrin mesure ces mouvements, détermine le nombre d'Avogadro par plusieurs méthodes concordantes et convainc la communauté scientifique ; Ostwald se rallie."},
{theme:"sciences",diff:"difficile",type:"q",q:"En quelle année Galilée est-il condamné par l'Inquisition pour avoir défendu le système copernicien ?",a:"En 1633",detail:"Copernic publie De revolutionibus en 1543, l'année de sa mort. En 1616, l'Église met le livre à l'Index et Galilée reçoit l'injonction de ne plus défendre l'héliocentrisme. Son Dialogue sur les deux grands systèmes du monde (1632) lui vaut un procès : il doit abjurer et finit sa vie en résidence surveillée. La formule « Eppur si muove » est vraisemblablement apocryphe. L'Église a reconnu son erreur en 1992."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quelle grandeur physique fondamentale Robert Millikan mesure-t-il entre 1909 et 1913 grâce à son expérience des gouttes d'huile ?",a:"La charge électrique élémentaire, celle de l'électron",detail:"Millikan observe des gouttelettes d'huile chargées entre deux plaques ; en ajustant la tension, il équilibre leur poids par la force électrique. Les charges mesurées sont toujours des multiples d'une valeur minimale (environ 1,6 × 10⁻¹⁹ coulomb). Il reçoit le Nobel en 1923. On lui a reproché d'avoir écarté certaines mesures jugées peu fiables."},
{theme:"sciences",diff:"difficile",type:"q",q:"En quelle année Jonas Salk annonce-t-il son vaccin contre la polio, et combien de cas par an évite-t-il aux États-Unis ?",a:"En 1955 (annonce du 12 avril) ; le nombre de cas de poliomyélite paralytique aux États-Unis, qui dépassait 20 000 par an au début des années 1950, chute de plus de 90 % en quelques années",detail:"L'épidémie de 1952 touche près de 58 000 Américains, dont environ 21 000 paralysés. L'essai du vaccin de Salk en 1954 porte sur 1,8 million d'enfants, l'un des plus grands de l'histoire. Albert Sabin développe ensuite un vaccin oral vivant atténué, moins cher, qui facilite les campagnes de masse. La polio sauvage ne circule plus qu'en Afghanistan et au Pakistan."},
{theme:"sciences",diff:"difficile",type:"q",q:"Comment Ludwig Boltzmann meurt-il en 1906, et quel lien ses contemporains établissent-ils avec le rejet de ses théories ?",a:"Il se suicide en 1906 à Duino, près de Trieste ; ses contemporains y ont vu l'effet de sa dépression et des attaques contre sa théorie atomiste, même si les causes restent débattues",detail:"Boltzmann explique les lois de la thermodynamique par le comportement statistique d'immenses populations de molécules ; sa formule de l'entropie, S = k ln W, est gravée sur sa tombe à Vienne. Des « énergétistes » comme Ostwald et le positiviste Mach contestent la réalité des atomes. Deux ans après sa mort, les expériences de Jean Perrin établissent leur existence."},
{theme:"sciences",diff:"difficile",type:"q",q:"En quelle année Alessandro Volta invente-t-il la pile électrique, et quelle découverte de Faraday permet ensuite la production industrielle d'électricité ?",a:"En 1800 ; l'induction électromagnétique (1831), qui permet de produire du courant avec des générateurs",detail:"La pile de Volta est la première source continue de courant électrique. Elle permet à Davy d'isoler le sodium et le potassium par électrolyse. Faraday découvre qu'un aimant en mouvement génère un courant (induction) et qu'un courant génère un champ magnétique. Il invente la dynamo et le moteur électrique. Maxwell unifie tout en 4 équations. Edison et Tesla industrialisent 60 ans plus tard."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quel mathématicien remporte en 1889 le prix du roi Oscar II en étudiant le problème des trois corps, découvrant au passage le chaos déterministe ?",a:"Henri Poincaré",detail:"Le problème des deux corps est résolu par Newton, mais celui des trois corps (par exemple Soleil, Terre, Lune) n'a pas de solution générale simple. Le mémoire primé de Poincaré contenait une erreur ; en la corrigeant (version publiée en 1890), il découvre que certaines trajectoires sont extrêmement sensibles aux conditions initiales. Cette idée, centrale dans la théorie du chaos, est redécouverte par Edward Lorenz dans les années 1960."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quel astrophysicien britannique démontre dans les années 1950 comment les étoiles synthétisent les éléments lourds par fusion nucléaire ?",a:"Fred Hoyle, notamment dans l'article « B²FH » (1957) écrit avec Margaret et Geoffrey Burbidge et William Fowler",detail:"Les étoiles fusionnent l'hydrogène en hélium, puis, pour les plus massives, en carbone, oxygène et éléments plus lourds jusqu'au fer ; les éléments plus lourds se forment notamment lors de supernovae et de fusions d'étoiles à neutrons. Les éléments les plus légers (hydrogène, hélium) proviennent, eux, du Big Bang. Hoyle, défenseur d'un univers stationnaire, est aussi l'auteur de l'expression « Big Bang »."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quel cliché de diffraction des rayons X, obtenu en 1952 dans le laboratoire de Rosalind Franklin, a été décisif pour Watson et Crick ?",a:"La « photo 51 »",detail:"Prise par l'étudiant Raymond Gosling sous la direction de Franklin, au King's College de Londres, la photo montre une croix caractéristique d'une structure hélicoïdale. Maurice Wilkins la montre à Watson sans l'accord de Franklin. Avec d'autres données de son laboratoire, elle permet à Watson et Crick de construire leur modèle en double hélice. Franklin meurt en 1958 ; son rôle est aujourd'hui pleinement reconnu."},
{theme:"sciences",diff:"difficile",type:"q",q:"En quelle année Fleming découvre-t-il la pénicilline par accident, et combien d'années faut-il avant qu'elle soit utilisée en médecine ?",a:"En 1928 ; il faut attendre le début des années 1940 (premier patient traité en 1941, production de masse pendant la guerre)",detail:"Dans son discours Nobel de 1945, Fleming met en garde contre le mésusage de la pénicilline, qui sélectionne des bactéries résistantes. Le staphylocoque doré résistant à la méticilline (SARM) apparaît dès 1961. Selon une étude publiée dans The Lancet, l'antibiorésistance a directement causé environ 1,3 million de morts en 2019 et contribué à près de 5 millions ; ce bilan pourrait fortement augmenter d'ici 2050."},
{theme:"sciences",diff:"difficile",type:"q",q:"Quel rôle ont joué les mathématiques arabes dans la transmission du savoir vers l'Europe médiévale ?",a:"Al-Khwarizmi (IXe siècle) fonde l'algèbre et diffuse les chiffres indo-arabes, que Fibonacci fait connaître en Europe avec son Liber Abaci (1202)",detail:"Le mot « algèbre » vient d'Al-Jabr, titre d'un traité d'Al-Khwarizmi. Le mot « algorithme » vient de la latinisation de son nom. Fibonacci (Leonardo de Pise) découvre les chiffres arabes en Afrique du Nord et publie le Liber Abaci (1202) qui montre leur supériorité pour le commerce. La résistance des « abacistes » (défenseurs des chiffres romains) dure jusqu'au XVe siècle."},
{theme:"sciences",diff:"difficile",type:"q",q:"En quelle année Edwin Hubble publie-t-il sa loi sur l'expansion de l'univers, et quelle « tension » les mesures actuelles révèlent-elles ?",a:"En 1929 ; la « tension de Hubble » : les mesures locales (céphéides, supernovae) donnent environ 73 km/s/Mpc, le fond diffus cosmologique environ 67, un écart qui dépasse les marges d'erreur",detail:"Hubble montre que les galaxies s'éloignent d'autant plus vite qu'elles sont lointaines (v = H₀ × d). Georges Lemaître avait établi cette relation dès 1927 ; l'Union astronomique internationale recommande depuis 2018 de parler de loi de Hubble-Lemaître. La tension persistante pourrait révéler des erreurs systématiques ou une physique nouvelle."},
{theme:"sciences",diff:"moyen",type:"q",q:"Qui réalise la première greffe du cœur humain, dans quelle ville, et en quelle année ?",a:"Christiaan Barnard réalise la première greffe du cœur humain le 3 décembre 1967 à Cape Town — le patient Louis Washkansky survit 18 jours",detail:"La circulation extracorporelle (John Gibbon, 1953) rend possible la chirurgie à cœur ouvert. Washkansky meurt d'une pneumonie, son système immunitaire étant affaibli par les traitements antirejet. La greffe cardiaque devient courante dans les années 1980 grâce à la ciclosporine. Plus de 5 000 greffes de cœur sont réalisées chaque année dans le monde."},
{theme:"sciences",diff:"moyen",type:"q",q:"Combien de dimensions spatiales la théorie des supercordes postule-t-elle, et pourquoi Karl Popper la considérerait-il comme non scientifique ?",a:"9 dimensions d'espace, soit 10 dimensions d'espace-temps (11 dans la théorie M) ; parce qu'elle ne fait pas, à ce jour, de prédiction testable qui permettrait de la réfuter",detail:"La mécanique quantique et la relativité générale sont incompatibles dans les conditions extrêmes (trous noirs, Big Bang). La théorie des cordes, développée depuis les années 1970, propose de les unifier en remplaçant les particules par de minuscules cordes vibrantes. Mais elle admet un nombre gigantesque de solutions (« paysage »). Ses critiques, comme Lee Smolin et Peter Woit, doutent de sa scientificité au sens de Popper."},
{theme:"sciences",diff:"moyen",type:"q",q:"En quelle année Charles Richter crée-t-il son échelle de magnitude des séismes, et par quelle échelle est-elle aujourd'hui officiellement remplacée ?",a:"En 1935 ; par l'échelle de magnitude de moment (Mw), proposée en 1979",detail:"Le premier sismoscope connu est chinois (Zhang Heng, 132). L'échelle de Richter mesure l'amplitude des ondes : un degré de plus correspond à une amplitude dix fois plus grande et à environ 32 fois plus d'énergie. Elle sature pour les très gros séismes, d'où la magnitude de moment, fondée sur l'énergie libérée. Le séisme du Chili de 1960 (Mw 9,5) reste le plus puissant jamais enregistré."},
{theme:"sciences",diff:"moyen",type:"q",q:"Qui a découvert les groupes sanguins et pourquoi cette découverte est-elle capitale ?",a:"Karl Landsteiner découvre les groupes ABO en 1901 (Nobel 1930) — ce qui permet les transfusions sanguines compatibles et rend la chirurgie moderne possible",detail:"Avant Landsteiner, les transfusions provoquaient souvent des accidents mortels (agglutination des globules rouges incompatibles). Il décrit les groupes A, B et O ; le groupe AB est identifié en 1902 par ses collaborateurs. Avec Alexander Wiener, il découvre le facteur Rhésus en 1940. Le système ABO et le facteur Rh guident toujours les transfusions et les greffes."},
{theme:"sciences",diff:"moyen",type:"q",q:"En quelle année et sous quel nom le premier homme dans l'espace est-il envoyé par l'URSS, battant les Américains ?",a:"En 1961 (le 12 avril) ; Youri Gagarine, à bord de Vostok 1",detail:"Spoutnik (4 oct. 1957) choque les Américains : une bombe atomique soviétique peut atteindre le territoire américain. Le 12 avril 1961, Youri Gagarine boucle un tour de la Terre en 108 minutes. Kennedy réagit en lançant le programme Apollo. L'URSS rate la Lune (fusée N1 échouant 4 fois) mais développe les premières stations spatiales (Saliout, Mir)."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui construit la première locomotive à vapeur, et qui ouvre les premières grandes lignes de chemin de fer ?",a:"Richard Trevithick fait rouler la première locomotive en 1804 ; George Stephenson ouvre la ligne Stockton-Darlington (1825) puis Liverpool-Manchester (1830)",detail:"La Rocket, construite par Robert Stephenson, fils de George, remporte en 1829 le concours de Rainhill à environ 47 km/h. La ligne Liverpool-Manchester est la première ligne interurbaine exploitée entièrement à la vapeur, avec un service régulier de voyageurs. En une trentaine d'années, le réseau britannique atteint 10 000 km."},
{theme:"sciences",diff:"facile",type:"q",q:"Qui a inventé la photographie et quand ?",a:"Louis Daguerre (daguerréotype, 1839) en France et William Henry Fox Talbot (calotype, négatif-positif, 1841) en Grande-Bretagne",detail:"Daguerre présente son procédé à l'Académie des sciences le 19 août 1839, date retenue comme naissance officielle de la photographie. Le procédé négatif-positif de Talbot, qui permet de multiplier les tirages, est l'ancêtre de la photographie argentique. Nicéphore Niépce avait obtenu vers 1826-1827 la plus ancienne photographie conservée, avec une pose de plusieurs heures, voire de plusieurs jours."},
{theme:"sciences",diff:"moyen",type:"q",q:"Quelle particule le Grand Collisionneur de Hadrons (LHC) du CERN confirme-t-il en 2012, complétant le Modèle Standard ?",a:"Le boson de Higgs",detail:"Le LHC, anneau de 27 km sous la frontière franco-suisse, accélère des protons à 99,9999991 % de la vitesse de la lumière. Le boson, prédit en 1964 par Peter Higgs, François Englert et Robert Brout, est la manifestation du champ qui donne leur masse aux particules élémentaires. Englert et Higgs reçoivent le Nobel en 2013. Matière noire, énergie noire et gravité quantique restent inexpliquées."},
// FOCUS ALLEMAGNE,
{theme:"histoire",focus:"allemagne",diff:"facile",type:"q",q:"En quelle année l'Allemagne a-t-elle été réunifiée ?",a:"Le 3 octobre 1990",detail:"Après la chute du mur de Berlin (nov. 1989), les négociations « 2+4 » (deux Allemagnes + quatre puissances) aboutissent à la réunification. La RDA est dissoute et ses Länder rejoignent la RFA. Le 3 octobre est aujourd'hui la fête nationale allemande."},
{theme:"histoire",focus:"allemagne",diff:"facile",type:"q",q:"Quelle période désigne-t-on par « Troisième Reich » ?",a:"La dictature nazie de 1933 à 1945",detail:"Hitler est nommé chancelier le 30 janvier 1933. L'Allemagne nazie annexe l'Autriche (Anschluss, 1938), déclenche la Seconde Guerre mondiale (1939) et perpètre la Shoah (6 millions de Juifs assassinés). Le Reich capitule le 8 mai 1945."},
{theme:"histoire",focus:"allemagne",diff:"moyen",type:"q",q:"En quelle année Hitler est-il nommé chancelier, mettant fin à la République de Weimar, et par qui ?",a:"Le 30 janvier 1933, par le président Paul von Hindenburg",detail:"Née de la défaite de 1918, la République de Weimar subit l'hyperinflation de 1923, puis la Grande Dépression. Les nazis deviennent le premier parti en 1932. Après sa nomination, Hitler obtient les pleins pouvoirs en mars 1933 et détruit la démocratie en quelques mois."},
{theme:"histoire",focus:"allemagne",diff:"moyen",type:"q",q:"Quel traité imposa à l'Allemagne des réparations massives après la Première Guerre mondiale ?",a:"Le traité de Versailles (1919)",detail:"L'Allemagne est déclarée seule responsable de la guerre (clause de culpabilité, art. 231), perd 13 % de son territoire et doit payer 132 milliards de marks-or. Keynes dénonce ces conditions comme une erreur économique. L'humiliation nationale alimentera la montée du nazisme."},
{theme:"histoire",focus:"allemagne",diff:"difficile",type:"q",q:"Combien de synagogues sont incendiées lors de la Nuit de Cristal des 9-10 novembre 1938, et combien de Juifs sont arrêtés ?",a:"Plus de 1 400 synagogues et lieux de prière détruits ou endommagés ; environ 30 000 Juifs arrêtés et envoyés en camp de concentration",detail:"Organisé par les nazis sous prétexte de venger l'assassinat d'un diplomate allemand à Paris par un jeune Juif, le pogrom détruit quelque 7 500 commerces juifs et fait au moins 91 morts. Il marque le passage des discriminations légales à la violence de masse."},
{theme:"histoire",focus:"allemagne",diff:"difficile",type:"d",q:"Nom donné à la politique étrangère de l'Allemagne de l'Ouest cherchant la réconciliation avec l'Est communiste",a:"L'Ostpolitik (Willy Brandt, 1969-1974)",detail:"Willy Brandt, chancelier SPD, normalise les relations avec l'URSS, la Pologne et la RDA. Son geste le plus fort : agenouillé devant le mémorial du ghetto de Varsovie (1970), sans un mot. Il reçoit le Prix Nobel de la paix en 1971. L'Ostpolitik préfigure la détente et prépare la réunification."},
{theme:"geo",focus:"allemagne",diff:"facile",type:"q",q:"Quels sont les quatre plus grands États (Länder) d'Allemagne par superficie ?",a:"Bavière, Basse-Saxe, Bade-Wurtemberg et Rhénanie-du-Nord-Westphalie",detail:"L'Allemagne compte 16 Länder, chacun doté d'un parlement et d'un gouvernement. La Bavière (environ 70 550 km²) est de loin le plus vaste ; le Brandebourg arrive en 5e position. Berlin, Hambourg et Brême sont des villes-États (Stadtstaaten)."},
{theme:"geo",focus:"allemagne",diff:"facile",type:"q",q:"Quel fleuve traverse Cologne, Düsseldorf et se jette dans la mer du Nord aux Pays-Bas ?",a:"Le Rhin",detail:"Long d'environ 1 230 km, le Rhin est l'artère économique de l'Europe occidentale. Né en Suisse, il forme la frontière entre la France (Alsace) et l'Allemagne, traverse la Ruhr industrielle puis les Pays-Bas. La vallée du Haut-Rhin moyen et ses châteaux sont inscrits au patrimoine mondial de l'UNESCO."},
{theme:"geo",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle région industrielle allemande, autour d'Essen, de Dortmund et de Duisbourg, fut le cœur de la sidérurgie européenne ?",a:"La Ruhr (Rhénanie-du-Nord-Westphalie)",detail:"La région doit son nom à la rivière Ruhr. Aux XIXe et XXe siècles, elle produisait charbon, acier et armements (Krupp). La désindustrialisation à partir des années 1970 a transformé la région : les anciennes usines sont devenues musées et lieux culturels (IBA Emscher Park, mine de Zollverein inscrite à l'UNESCO)."},
{theme:"geo",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle mer borde l'Allemagne au nord-est, et quelle importance a-t-elle pour le pays ?",a:"La mer Baltique (Ostsee) : la seconde façade maritime du pays, berceau des ports de la Hanse",detail:"Avec la mer du Nord à l'ouest, elle offre à l'Allemagne deux façades maritimes. Les ports de Lübeck, Rostock et Kiel furent des piliers de la Ligue hanséatique. Les plages de l'île de Rügen, la plus grande île allemande, sont une destination touristique majeure."},
{theme:"arts",focus:"allemagne",diff:"facile",type:"q",q:"Quel compositeur baroque allemand est l'auteur des Variations Goldberg et des Passions ?",a:"Johann Sebastian Bach (1685-1750)",detail:"Bach est considéré comme le sommet de la polyphonie baroque. Ses Passions selon saint Matthieu et selon saint Jean, ses cantates, ses Variations Goldberg et son Clavier bien tempéré forment une véritable encyclopédie musicale. Moins joué après sa mort, il est remis à l'honneur par Mendelssohn en 1829."},
{theme:"arts",focus:"allemagne",diff:"moyen",type:"q",q:"Quel mouvement artistique et pédagogique allemand, fondé en 1919 à Weimar, révolutionna le design moderne ?",a:"Le Bauhaus (Walter Gropius)",detail:"Le Bauhaus (« maison de la construction ») fusionne arts et artisanat, forme et fonction. Sous Walter Gropius, puis Hannes Meyer et Ludwig Mies van der Rohe, il produit meubles, affiches, textiles et bâtiments devenus des classiques. Contraint de fermer sous la pression nazie en 1933, il essaime grâce à ses maîtres émigrés."},
{theme:"arts",focus:"allemagne",diff:"moyen",type:"q",q:"Quel romancier allemand a écrit La Montagne magique et Les Buddenbrook, et a reçu le Nobel en 1929 ?",a:"Thomas Mann",detail:"Les Buddenbrook (1901) racontent le déclin d'une famille de marchands de Lübeck sur quatre générations. La Montagne magique (1924) se déroule dans un sanatorium de Davos, à la veille de 1914, et met en scène les grands débats d'idées européens. Opposé au nazisme, Mann s'exile en Suisse en 1933, puis aux États-Unis en 1938."},
{theme:"arts",focus:"allemagne",diff:"difficile",type:"q",q:"Qu'est-ce que l'Expressionnisme allemand, et quels artistes en sont les figures majeures ?",a:"Un courant du début du XXe siècle qui privilégie l'expression des émotions sur la représentation fidèle ; ses figures majeures sont Ernst Ludwig Kirchner, Emil Nolde, Max Beckmann et, au sein du Blaue Reiter, Kandinsky et Franz Marc",detail:"Le groupe Die Brücke (1905, Dresde) et Der Blaue Reiter (1911, Munich, avec Kandinsky) constituent les deux pôles de l'expressionnisme allemand. Couleurs violentes, formes déformées, angoisse existentielle. Les nazis l'interdiront comme « art dégénéré » (entartete Kunst) en 1937."},
{theme:"politique",focus:"allemagne",diff:"facile",type:"q",q:"Comment appelle-t-on la loi fondamentale de l'Allemagne, adoptée en 1949 ?",a:"Le Grundgesetz (Loi fondamentale)",detail:"Rédigée sous occupation alliée, la Loi fondamentale instaure une démocratie parlementaire fédérale. Son article premier proclame : « La dignité de l'être humain est intangible. » Sa « clause d'éternité » (art. 79) interdit de modifier certains principes (dignité humaine, démocratie, fédéralisme) — une réponse directe à la prise de pouvoir légale de Hitler. Conçue comme provisoire, elle est devenue la Constitution de l'Allemagne réunifiée en 1990."},
{theme:"politique",focus:"allemagne",diff:"moyen",type:"q",q:"Quel est le rôle du Bundesrat dans le système politique allemand ?",a:"Il représente les 16 Länder au niveau fédéral et co-légifère sur les lois affectant les États",detail:"Contrairement au Sénat français, les membres du Bundesrat sont des ministres des gouvernements des Länder (pas des élus directs). Ils peuvent bloquer les lois fédérales affectant les compétences régionales. Ce bicaméralisme reflète le fédéralisme coopératif allemand (Kooperativer Föderalismus)."},
{theme:"politique",focus:"allemagne",diff:"moyen",type:"q",q:"Qu'est-ce que le « modèle rhénan » ou « économie sociale de marché » (soziale Marktwirtschaft) ?",a:"Un capitalisme régulé associant libre marché et protections sociales fortes — codécision, syndicats puissants, État-providence",detail:"Théorisée par l'économiste Alfred Müller-Armack et mise en œuvre par Ludwig Erhard après 1945, l'économie sociale de marché associe concurrence et protection sociale. La cogestion (Mitbestimmung) donne aux salariés des sièges dans les conseils de surveillance des grandes entreprises. Elle accompagne le « miracle économique » (Wirtschaftswunder) des années 1950-1960. L'Allemagne est aujourd'hui la 3e économie mondiale."},
{theme:"politique",focus:"allemagne",diff:"difficile",type:"q",q:"Qu'est-ce que la « clause de défiance constructive » (konstruktives Misstrauensvotum) dans la Constitution allemande ?",a:"Le Parlement ne peut renverser le chancelier qu'en élisant simultanément son successeur",detail:"Cette règle, inscrite dans le Grundgesetz (art. 67), tire les leçons de l'instabilité de Weimar où les partis s'unissaient pour renverser des gouvernements sans pouvoir en former de nouveaux. Elle a été utilisée deux fois : en 1972 (échec) et en 1982 (succès, Kohl remplace Schmidt)."},
{theme:"philo",focus:"allemagne",diff:"moyen",type:"q",q:"Quel philosophe allemand a développé la dialectique historique et la notion d'« Aufhebung » (dépassement) ?",a:"Georg Wilhelm Friedrich Hegel",detail:"Dans la Phénoménologie de l'esprit (1807), Hegel décrit le développement de l'Esprit à travers des contradictions surmontées. L'Aufhebung désigne un dépassement qui à la fois supprime, conserve et élève. La formule « thèse-antithèse-synthèse » vient plutôt de Fichte et des manuels. Marx renverse cette dialectique idéaliste en dialectique matérialiste."},
{theme:"philo",focus:"allemagne",diff:"moyen",type:"q",q:"Quelle œuvre de Nietzsche proclame la « mort de Dieu » et annonce le Surhomme ?",a:"Ainsi parlait Zarathoustra (1883-1885)",detail:"Zarathoustra y proclame que Dieu est mort et prêche le surhomme (Übermensch), celui qui crée ses propres valeurs, ainsi que l'éternel retour. La formule « Dieu est mort » apparaît d'abord dans Le Gai Savoir (1882). L'œuvre, écrite dans un style poétique et prophétique, est unique dans l'histoire de la philosophie."},
{theme:"philo",focus:"allemagne",diff:"difficile",type:"q",q:"Quel ouvrage de 1951 Hannah Arendt consacre-t-elle à l'analyse comparée du nazisme et du stalinisme ?",a:"Les Origines du totalitarisme",detail:"L'ouvrage, en trois parties (l'antisémitisme, l'impérialisme, le totalitarisme), montre que le totalitarisme est un régime inédit, distinct des tyrannies classiques : il repose sur l'idéologie, la terreur, la destruction de l'espace public et l'isolement des individus, et culmine dans les camps. Il reste une référence."},
{theme:"sciences",focus:"allemagne",diff:"facile",type:"q",q:"Quelle distinction Wilhelm Conrad Röntgen reçoit-il en 1901, une première dans l'histoire ?",a:"Le tout premier prix Nobel de physique",detail:"Röntgen est récompensé pour sa découverte des rayons X (1895), dont la première radiographie célèbre montre la main de sa femme. Il fait don de l'argent du prix à son université et refuse de breveter sa découverte. En allemand, on parle de Röntgenstrahlen ; l'élément 111 porte le nom de roentgenium."},
{theme:"sciences",focus:"allemagne",diff:"moyen",type:"q",q:"Quel chimiste allemand a mis au point la synthèse de l'ammoniac, révolutionnant l'agriculture mondiale ?",a:"Fritz Haber (procédé Haber-Bosch, 1909)",detail:"La synthèse industrielle de l'ammoniac à partir de l'azote de l'air, mise au point par Haber puis industrialisée par Carl Bosch (BASF, 1913), permet la production massive d'engrais azotés ; on estime qu'elle nourrit aujourd'hui près de la moitié de l'humanité. Haber reçoit le Nobel de chimie en 1918, mais il a dirigé l'emploi des gaz de combat en 1915 ; sa femme, Clara Immerwahr, chimiste, se suicide peu après."},
{theme:"sciences",focus:"allemagne",diff:"difficile",type:"q",q:"Quelle position philosophique Abélard défend-il dans la querelle des universaux médiévale, entre réalisme et nominalisme ?",a:"Une position souvent qualifiée de conceptualisme : les universaux ne sont ni des choses réelles ni de simples sons, mais des significations attachées aux mots",detail:"La querelle des universaux demande si les notions générales (« homme », « rougeur ») existent réellement (réalisme, défendu par Guillaume de Champeaux), ne sont que des mots (nominalisme de Roscelin) ou des concepts de l'esprit. Abélard, élève des deux, critique l'un et l'autre. Au XIVe siècle, Guillaume d'Ockham radicalise le nominalisme."},
{theme:"economie",diff:"facile",type:"q",q:"Qu'est-ce que le taux de chômage et comment est-il mesuré selon la définition du BIT ?",a:"La part des actifs sans emploi, disponibles et en recherche d'emploi ; il est mesuré par enquête, et non à partir des inscrits à France Travail (ex-Pôle emploi)",detail:"Selon le Bureau international du travail, un chômeur n'a pas travaillé, même une heure, au cours d'une semaine de référence, est disponible dans les 15 jours et a effectué une démarche active de recherche dans le mois. Le « halo du chômage » (découragés, personnes indisponibles) et le temps partiel subi n'y figurent pas. En France, l'Insee le mesure par l'enquête Emploi."},
{theme:"economie",diff:"facile",type:"d",q:"Concept désignant la somme que les consommateurs sont prêts à payer au-delà du prix effectivement payé",a:"Le surplus du consommateur",detail:"Si vous êtes prêt à payer 50 € pour un livre mais ne payez que 20 €, votre surplus est 30 €. Ce concept de Marshall mesure le bien-être tiré d'un marché. Les monopoles et les taxes réduisent ce surplus."},
{theme:"economie",diff:"facile",type:"q",q:"Qu'est-ce que la balance commerciale d'un pays et comment la distingue-t-on de la balance des paiements ?",a:"La balance commerciale mesure les exportations moins les importations de biens ; la balance des paiements inclut aussi les services, les revenus et les flux financiers",detail:"Un excédent commercial signifie qu'un pays exporte plus qu'il n'importe (Allemagne, Chine). Un déficit commercial (États-Unis, France) peut être financé par des entrées de capitaux. La balance des paiements est toujours équilibrée comptablement."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le paradoxe de Condorcet et pourquoi remet-il en cause la notion de volonté générale ?",a:"Même si chaque individu a des préférences cohérentes, leur agrégation collective peut produire des cycles sans vainqueur stable — Arrow généralise ce résultat",detail:"Condorcet (1785) montre que si A bat B, B bat C, et C bat A en vote à la majorité, il n'existe pas de choix collectif cohérent. Arrow (Prix Nobel 1972) généralise : aucun système de vote ne peut simultanément satisfaire cinq critères d'équité raisonnables."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que la théorie de la valeur-travail chez Marx et en quoi diffère-t-elle de la théorie néoclassique de la valeur ?",a:"Marx : la valeur d'une marchandise est déterminée par le temps de travail socialement nécessaire à sa production — les néoclassiques la tirent de l'utilité marginale subjective",detail:"Pour Marx, le travail est la seule source de valeur. La plus-value naît de l'écart entre la valeur produite par l'ouvrier et le salaire versé. Les marginalistes (Jevons, Menger, Walras, 1870s) renversent cette logique : la valeur vient de la rareté et de l'utilité subjective — ce qui explique le paradoxe de l'eau et du diamant."},
{theme:"economie",diff:"moyen",type:"q",q:"Qu'est-ce que le modèle Heckscher-Ohlin et que prédit-il sur les échanges internationaux ?",a:"Un pays exporte les biens utilisant intensément son facteur de production abondant (travail ou capital) — complète Ricardo en expliquant pourquoi les dotations factorielles orientent le commerce",detail:"Eli Heckscher (1919) et Bertil Ohlin (Nobel 1977) : les États-Unis, riches en capital, exportent des biens capitalistiques ; les pays en développement, riches en travail peu qualifié, exportent des biens à forte intensité de main-d'œuvre. Le paradoxe de Leontief (1953) contredit empiriquement ce modèle pour les USA."},
{theme:"economie",diff:"moyen",type:"d",q:"Situation où une entreprise, en fixant son prix, tient compte de la réaction probable de ses concurrents",a:"L'interdépendance oligopolistique (comportement stratégique)",detail:"Dans un oligopole (peu d'acteurs), chaque décision de prix ou de quantité affecte les autres. La théorie des jeux (Nash) modélise ces interactions. Le modèle de Cournot (quantités) et celui de Bertrand (prix) aboutissent à des équilibres très différents."},
{theme:"economie",diff:"difficile",type:"q",q:"Qu'est-ce que le théorème d'impossibilité d'Arrow (1951) et quelles en sont les cinq conditions ?",a:"Il est impossible de construire une fonction de bien-être social qui respecte simultanément l'unanimité, l'indépendance des alternatives non pertinentes, la transitivité, la non-dictature et le domaine universel",detail:"Kenneth Arrow (Nobel 1972) prouve mathématiquement qu'aucun système de vote démocratique ne peut satisfaire ces cinq conditions simultanément. La seule façon d'y satisfaire toutes est d'avoir un dictateur. Ce résultat bouleverse la théorie du choix social et fonde un vaste programme de recherche."},
{theme:"economie",diff:"difficile",type:"q",q:"Qu'est-ce que la loi de Goodhart et comment s'applique-t-elle aux politiques économiques ?",a:"Quand une mesure devient un objectif, elle cesse d'être une bonne mesure — les agents modifient leur comportement en réponse à la politique",detail:"Charles Goodhart (1975) formule ce principe en contexte de politique monétaire : dès que la banque centrale cible un agrégat monétaire (M3), les banques créent de nouveaux instruments qui y échappent. La loi de Goodhart explique les échecs de nombreuses politiques — objectifs scolaires, quotas hospitaliers, métriques de gestion."},
{theme:"economie",focus:"allemagne",diff:"facile",type:"q",q:"Qu'est-ce que le « Wirtschaftswunder » (miracle économique) allemand ?",a:"La reconstruction économique spectaculaire de l'Allemagne de l'Ouest dans les années 1950-60",detail:"Sous la direction de Ludwig Erhard et grâce au plan Marshall, la RFA connaît une croissance de ~8 %/an. L'industrie automobile (VW, Mercedes, BMW), chimique et mécanique se développent. La DM (Deutsche Mark) devient un symbole de stabilité. L'Allemagne dépasse la France et la Grande-Bretagne en quelques décennies."},
{theme:"economie",focus:"allemagne",diff:"moyen",type:"q",q:"Pourquoi l'Allemagne est-elle obsédée par la stabilité des prix et l'orthodoxie budgétaire ?",a:"Traumatisme de l'hyperinflation de 1923 qui avait détruit l'épargne et déstabilisé la République de Weimar",detail:"En novembre 1923, 1 dollar vaut 4 200 milliards de marks. Les épargnants sont ruinés, le système économique s'effondre. Ce traumatisme collectif explique l'attachement allemand à la Bundesbank indépendante, à la rigueur budgétaire (Schwarze Null — zéro déficit) et les réticences face à la BCE accommodante."},
{theme:"economie",focus:"allemagne",diff:"difficile",type:"q",q:"Qu'est-ce que la Mitbestimmung (cogestion) dans les entreprises allemandes ?",a:"L'obligation légale pour les grandes entreprises d'intégrer des représentants des salariés dans leur conseil de surveillance",detail:"La loi de 1976 impose que 50 % des sièges du Aufsichtsrat (conseil de surveillance) soient occupés par des représentants des employés dans les entreprises de plus de 2 000 salariés. Ce modèle de cogestion est cité comme facteur de paix sociale, d'investissement long terme et de compétitivité industrielle allemande."},
{theme:"litterature",diff:"facile",type:"q",q:"Quel roman de Victor Hugo (1831) met en scène Quasimodo et Esmeralda dans le Paris du XVe siècle ?",a:"Notre-Dame de Paris",detail:"Hugo écrit ce roman en partie pour alerter l'opinion sur la dégradation des cathédrales gothiques. Frollo, Quasimodo, Esmeralda forment un triangle tragique. Le roman déclenche un mouvement de restauration du patrimoine médiéval. Viollet-le-Duc restaurera Notre-Dame à partir de 1844."},
{theme:"litterature",diff:"facile",type:"d",q:"Genre narratif bref qui illustre une vérité morale par un récit allégorique, souvent avec des animaux",a:"La fable",detail:"Ésope (VIe s. av. J.-C.) pose les fondements du genre ; La Fontaine les porte à leur sommet en français (1668-1694). La fable use d'animaux comme miroir des vices humains pour enseigner sans heurter."},
{theme:"litterature",diff:"facile",type:"q",q:"Quel roman de Gustave Flaubert (1857) raconte l'adultère et la désillusion d'Emma Bovary dans la province normande ?",a:"Madame Bovary",detail:"Flaubert est poursuivi en justice pour 'outrage à la morale publique' mais acquitté. Madame Bovary, élevée aux romans sentimentaux, confond rêve et réalité ; son ennui provincial (le 'bovarysme') mène à sa ruine. Flaubert inaugure le réalisme psychologique et le style indirect libre."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel poète d'origine américaine, naturalisé britannique, révolutionne la poésie moderniste avec La Terre vaine (1922) ?",a:"T.S. Eliot (1888-1965)",detail:"La Terre vaine (The Waste Land) est un poème fragmenté de 434 vers mêlant langues, cultures et mythes pour exprimer le désarroi de l'après-guerre. Né à Saint-Louis (Missouri), Eliot s'installe en Angleterre et devient sujet britannique en 1927. Il reçoit le Nobel en 1948 et exerce une influence considérable sur la littérature du XXe siècle."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier français, auteur de Bel-Ami (1885), est avec Flaubert le maître de la nouvelle réaliste et naturaliste ?",a:"Guy de Maupassant (1850-1893)",detail:"Disciple de Flaubert et ami de Zola, Maupassant écrit plus de 300 nouvelles en dix ans (Boule de Suif, La Parure, Le Horla) avant de sombrer dans la folie. Bel-Ami retrace l'ascension cynique d'un journaliste séducteur dans la presse parisienne — critique acérée du monde des médias."},
{theme:"litterature",diff:"moyen",type:"q",q:"Quel romancier américain, auteur de Gatsby le Magnifique (1925), capture l'illusion du rêve américain dans les années folles ?",a:"F. Scott Fitzgerald (1896-1940)",detail:"Gatsby le Magnifique dépeint la fascination et la corruption de la richesse dans le Long Island des années 1920. Nick Carraway observe Gatsby qui reconstruit sa vie autour d'un amour perdu, Daisy. Le roman est une méditation sur l'impossibilité de revivre le passé et la désillusion du rêve américain."},
{theme:"litterature",diff:"moyen",type:"d",q:"Procédé littéraire consistant à raconter une histoire dans une chronologie non linéaire, avec retours en arrière",a:"L'analepse (ou flashback)",detail:"L'analepse (du grec ana, en arrière) désigne tout retour narratif dans le temps. À l'opposé, la prolepse anticipe des événements futurs. Proust, Faulkner et la Nouvelle Vague en font un usage systématique pour révéler le passé par bribes."},
{theme:"litterature",diff:"difficile",type:"q",q:"Quel écrivain brésilien, auteur de Dom Casmurro (1899), est considéré comme le maître du réalisme brésilien ?",a:"Machado de Assis (1839-1908)",detail:"Petit-fils d'esclaves affranchis, d'origine modeste, Machado de Assis fonde l'Académie brésilienne des lettres (1897). Ses romans (Mémoires posthumes de Brás Cubas, Dom Casmurro) sont confiés à des narrateurs peu fiables, ironiques, conscients de leur propre fiction. Dom Casmurro laisse une question irrésolue : Capitu a-t-elle trompé son mari ?"},
{theme:"litterature",diff:"difficile",type:"q",q:"Quelle poète polonaise, prix Nobel 1996, est connue pour la brièveté et l'ironie philosophique de ses poèmes ?",a:"Wisława Szymborska (1923-2012)",detail:"Szymborska publie peu (environ 350 poèmes en soixante ans) mais chaque texte est ciselé avec précision. Elle traite des grandes questions — la mort, le hasard, l'histoire — avec légèreté et humour. Son discours Nobel ('Inspiration') célèbre la curiosité et le 'je ne sais pas' comme moteur de la création."},
{theme:"litterature",focus:"allemagne",diff:"facile",type:"q",q:"Quel poète et écrivain allemand est l'auteur de Faust et de Les Souffrances du jeune Werther ?",a:"Johann Wolfgang von Goethe (1749-1832)",detail:"Werther (1774), roman épistolaire sur un amour impossible menant au suicide, déclenche une vague de suicides en Europe (le « syndrome Werther »). Faust (1808-1832), son chef-d'œuvre, explore le pacte avec le diable, la quête du savoir et la condition humaine."},
